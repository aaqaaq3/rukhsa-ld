إبقاء المهام بمستواها الحالي","إعفاؤه من مسائل الكسور مؤقتًا حتى تتحسن دافعيته من تلقاء نفسها","مهام قابلة للنجاح تربط النجاح بالجهد والاستراتيجية، مع رفع التحدي تدريجيًّا","إحالته إلى المرشد الطلابي بوصف المشكلة انفعالية بحتة لا صلة لها بتعلم الرياضيات"],"a":2,"w":"عبارة «لن أفهمها مهما حاولت» بعد إخفاقات متكررة مؤشر محتمل للعجز المتعلم وانخفاض الكفاءة الذاتية. والعلاج يجمع تعليم المهارة مع خبرات نجاح واقعية وتغذية راجعة تربط التقدم بالجهد والاستراتيجية، ثم يُرفع التحدي تدريجيًّا.","n":["الطمأنة وحدها لا تبني خبرة نجاح حقيقية.","التجنب يرسّخ توقع الفشل ولا يعلّم المهارة.","صحيح: يعالج المهارة والكفاءة الذاتية معًا.","يتجاهل تفاعل الفشل الأكاديمي مع الجانب الانفعالي."],"c":"«لن أفهمها مهما حاولت» بعد فشل متكرر","p":"العجز المتعلم يُعالج بنجاح حقيقي متدرج، لا بالطمأنة ولا بالإعفاء."},{"id":"12-13","s":12,"i":"12.2","l":"تطبيق","t":"يتقن ماجد مهارات الكتابة حين تُطلب منه منفردة، لكنه في المشروعات الطويلة لا يعرف من أين يبدأ، ويضيّع أوراقه، ويسلّم العمل ناقصًا. ما المجال الأولى بالدعم؟","o":["الوظائف التنفيذية، بتعليم صريح للتخطيط وتقسيم المهمة ومتابعة الإنجاز ذاتيًّا","مهارات الإملاء والخط، لأنها أساس جودة أي مشروع كتابي","سرعة المعالجة، بمنحه وقتًا إضافيًّا مفتوحًا في المشروعات دون تغيير طريقة عمله فيها","الوعي الصوتي، لأن مشكلات الكتابة تعود غالبًا إلى المعالجة الفونولوجية"],"a":0,"w":"البدء بالمهمة وتنظيم الأدوات ومتابعة الإنجاز من الوظائف التنفيذية. وبما أن المهارة الأكاديمية متقنة والتعثر يظهر في إدارة المهمة الطويلة، فالأولوية لتعليم مباشر لاستراتيجيات التخطيط والتنظيم والمراقبة الذاتية.","n":["صحيح: الحاجة في إدارة المهمة لا في المهارة.","مهاراته الكتابية متقنة؛ والعائق في التنظيم.","الوقت وحده لا يعلّمه التخطيط والتنظيم.","لا قرينة على مشكلة صوتية في الموقف."],"c":"يتقن المهارة ويتعثر في إدارة المشروع","p":"مشكلات البدء والتنظيم والمتابعة ← وظائف تنفيذية، لا مهارة أكاديمية."},{"id":"12-14","s":12,"i":"12.2","l":"تطبيق","t":"في أثناء العمل الجماعي يسيء أنس فهم مزاح زملائه، فيغضب وينسحب من المجموعة، وقد تكرر ذلك في عدة حصص. ما الإجراء الأنسب؟","o":["إبعاده عن العمل الجماعي نهائيًّا تجنبًا لتكرار المواقف المحرجة","عدّ ذلك دليلًا كافيًا على اضطراب طيف التوحد، وإحالته إلى التشخيص المتخصص فورًا","تجاهل السلوك لأن الخصائص الاجتماعية لا تؤثر في التعلم الأكاديمي","تعليم فهم الإشارات الاجتماعية في مواقف منظمة، مع جمع بيانات عن سياقات حدوثه"],"a":3,"w":"سوء تفسير المزاح والانسحاب من المواقف الجماعية من المظاهر الاجتماعية المحتملة لدى بعض الطلاب ذوي صعوبات التعلم. والاستجابة التربوية تدريب منظم على المهارات الاجتماعية مع جمع بيانات عن السياق، دون إقصاء الطالب أو القفز إلى تشخيص من سلوك واحد.","n":["التجنب يحرمه من فرص تعلم المهارة الاجتماعية.","سلوك واحد لا يكفي للتشخيص الفارق.","الجانب الاجتماعي يؤثر في المشاركة والأداء.","صحيح: يستهدف المهارة ويجمع البيانات."],"c":"يسيء فهم المزاح وينسحب من المجموعة","p":"الخاصية الاجتماعية تُعالج بتعليم المهارة في سياقها، لا بالإقصاء ولا بالتشخيص المتسرع."},{"id":"12-15","s":12,"i":"12.2","l":"تحليل","t":"يقرأ بدر الكلمات المنفردة بدقة، لكنه يفقد معنى الجمل الطويلة كثيرة الروابط، ويتحسن فهمه حين تُجزّأ الجملة ويُتوقف للتلخيص. ما التفسير الأقرب لهذا النمط؟","o":["ضعف في فك الرموز يمنعه من قراءة كلمات الجمل الطويلة بدقة","ضعف عام في القدرة العقلية يظهر في جميع المهام اللغوية والأكاديمية بالدرجة نفسها","تداخل حمل الذاكرة العاملة والمعالجة اللغوية مع الفهم كلما طالت الجملة وتعقدت","عزوف عن القراءة يظهر عند النصوص الطويلة بسبب الملل"],"a":2,"w":"الدقة في الكلمات المنفردة سليمة، والتعثر يرتبط بطول الجملة وتعقيد روابطها، ويتراجع بالتجزئة والتلخيص. وهذا النمط يرجّح أن حمل الذاكرة العاملة والمعالجة اللغوية يؤثران في الفهم، فيُدعم بتجزئة النص وأسئلة توجيهية وخرائط دلالية.","n":["دقته في قراءة الكلمات جيدة.","التحسن مع التجزئة ينفي التفسير العام.","صحيح: التجزئة تحسّن الأداء، فالحمل هو العامل.","تفسير دافعي لا تدعمه القرائن المذكورة."],"c":"يتحسن الفهم حين تُجزّأ الجملة","p":"إذا تحسن الأداء بخفض كمية المعلومات النشطة فابحث عن الذاكرة العاملة."},{"id":"12-16","s":12,"i":"12.2","l":"تحليل","t":"في اختبار حقائق الضرب المؤقت بدقيقتين أجاب صالح عن 12 سؤالًا من 40 وكلها صحيحة، وحين أُعطي الورقة نفسها دون توقيت أجاب عن 38 سؤالًا إجابة صحيحة. ما الاستنتاج الأكثر حذرًا؟","o":["صالح لا يعرف حقائق الضرب، والدرجة المؤقتة هي الأصدق في تمثيل مستواه","النتيجتان تثبتان وجود صعوبة تعلم في الرياضيات دون حاجة إلى بيانات أخرى","قد يكون بطء الاسترجاع أو المعالجة عاملًا في أدائه، ويحتاج التحقق ببيانات أخرى","الفارق بين النتيجتين يدل على ضعف دافعيته في المهام المؤقتة لا أكثر"],"a":2,"w":"الدقة محفوظة في الحالتين، والذي تغيّر هو الزمن؛ أي أن طلاقة الاسترجاع أو سرعة المعالجة قد تكون موضع الحاجة لا المعرفة نفسها. والاستنتاج الحذر يبقى فرضية تُفحص مع بقية البيانات، فالخاصية الواحدة لا تشخّص.","n":["دقته العالية دون توقيت تنفي عدم المعرفة.","خاصية واحدة لا تكفي للتشخيص.","صحيح: استنتاج بحجم البيانات.","تفسير غير مدعوم يتجاهل احتمال بطء الاسترجاع."],"c":"الدقة ثابتة والزمن يغيّر الأداء","p":"الخاصية تصف وتوجّه التقييم، لكنها لا تشخّص وحدها."},{"id":"12-17","s":12,"i":"12.3","l":"معرفة","t":"ما العنصر الذي يُعد جوهريًّا في تشخيص الإعاقة العقلية، ولا يُعد جوهر تشخيص صعوبات التعلم المحددة؟","o":["قيود دالة في الأداء العقلي والسلوك التكيفي معًا، تبدأ خلال الفترة النمائية","ضعف مستمر ونوعي في مهارة أكاديمية محددة رغم توفير تعليم مناسب ومنظم لمدة كافية","انخفاض التحصيل الدراسي عن مستوى الصف في مادة دراسية أو أكثر","الحاجة إلى تقييم شامل يعتمد على مصادر بيانات متعددة ومتنوعة"],"a":0,"w":"تشخيص الإعاقة العقلية يتطلب قيودًا دالة في الأداء العقلي والسلوك التكيفي (المفاهيمي والاجتماعي والعملي) مع بداية خلال الفترة النمائية، ولا يكفي فيه رقم ذكاء منخفض. أما صعوبات التعلم المحددة فجوهرها صعوبة أكاديمية نوعية مستمرة، والسلوك التكيفي ليس جوهر تشخيصها.","n":["صحيح: العقل والتكيف معًا مع بداية نمائية.","هذا جوهر صعوبات التعلم المحددة لا الإعاقة العقلية.","انخفاض التحصيل وحده لا يميّز بين الفئتين.","مبدأ مشترك في الحالتين وليس عنصرًا فارقًا."],"c":"جوهري في الإعاقة العقلية دون صعوبات التعلم","p":"الإعاقة العقلية = أداء عقلي + سلوك تكيفي + بداية نمائية."},{"id":"12-18","s":12,"i":"12.3","l":"معرفة","t":"أي المواقف الآتية يمثل «تعديلًا» (Modification) لا «تكييفًا» (Accommodation)؟","o":["قراءة أسئلة اختبار الرياضيات جهريًّا لطالب يتعثر في فك رموز الكلمات","تقليص عدد المفاهيم المطلوبة وخفض مستوى صعوبتها في وحدة الكسور لطالب بعينه","منح طالب بطيء الكتابة وقتًا إضافيًّا في اختبار يقيس فهم المفاهيم العلمية للوحدة","السماح لطالب بالإجابة شفهيًّا في اختبار تاريخ لا يقيس مهارة الكتابة"],"a":1,"w":"التكييف يغيّر الوصول أو الزمن أو طريقة الاستجابة دون تغيير البناء المقاس، أما التعديل فيغيّر مستوى التوقع أو المحتوى نفسه. وتقليص المفاهيم وخفض صعوبتها يغيّر ما يُتوقع من الطالب تعلمه، فهو تعديل.","n":["تكييف يزيل حاجز القراءة في اختبار لا يقيسها.","صحيح: تغيّر مستوى التوقع والمحتوى.","تكييف في الزمن لا يغيّر المفهوم المقاس.","تكييف في طريقة الاستجابة مع بقاء الهدف."],"c":"تقليص المفاهيم وخفض صعوبتها","p":"تكييف = إزالة حاجز مع بقاء الهدف، وتعديل = تغيير الهدف أو المحتوى."},{"id":"12-19","s":12,"i":"12.3","l":"تطبيق","t":"تفيد تقارير معلمي مشعل ووالده بأنه يتسرع في الإجابة قبل اكتمال السؤال، ولا ينتظر دوره، ويترك المهام دون إكمال في المدرسة والمنزل، في حين تقع درجاته في القراءة والرياضيات ضمن المتوقع لصفه. ما الفرضية الأقرب التي يتجه إليها التقييم؟","o":["صعوبة تعلم محددة، لأن الاندفاع وضعف الإنجاز من خصائص هذه الفئة","تأخر دراسي ناتج عن نقص فرص التعليم المقدمة له في المدرسة","اضطراب فرط الحركة وتشتت الانتباه المحتمل، مع تقييم متخصص عبر السياقات","إعاقة عقلية بسيطة، لأن ترك المهام دون إكمال يدل على قصور في السلوك التكيفي"],"a":2,"w":"الاندفاع وعدم انتظار الدور وترك المهام في أكثر من سياق، مع تحصيل أكاديمي مناسب، قرائن أقرب لاضطراب فرط الحركة وتشتت الانتباه؛ إذ يمكن أن يوجد مع تحصيل طبيعي ولا يتطلب صعوبة أكاديمية نوعية. والقرار يحتاج تقييمًا متخصصًا عبر السياقات.","n":["لا يوجد تعثر أكاديمي نوعي، وتحصيله ضمن المتوقع.","تحصيله مناسب، والأعراض تظهر في المنزل أيضًا.","صحيح: أعراض ممتدة عبر السياقات مع تحصيل مناسب.","لا قرائن على قصور عقلي عام أو تكيفي."],"c":"أعراض في المدرسة والمنزل مع تحصيل مناسب","p":"التحصيل الجيد لا ينفي ADHD، ووجود ADHD لا يثبت صعوبة تعلم."},{"id":"12-20","s":12,"i":"12.3","l":"تطبيق","t":"التحق يوسف بالمدرسة قادمًا من بلد كان يدرس فيه بلغة أخرى، وبعد شهرين يُظهر تعثرًا في القراءة والمفردات العربية، وتفيد أسرته بأنه كان يقرأ جيدًا بلغته الأولى. ما الإجراء الأنسب أولًا؟","o":["إحالته فورًا لتقييم صعوبات التعلم لأن تعثره في القراءة واضح ومتكرر","تطبيق اختبار ذكاء مقنن باللغة العربية لتحديد ما إذا كان تعثره نوعيًّا","إلحاقه ببرنامج صعوبات القراءة مباشرة لتجنب اتساع الفجوة مع زملائه","فحص تعرضه للعربية وكفاءته في لغته الأولى، مع دعم لغوي ومراقبة استجابته"],"a":3,"w":"تغيّر لغة التدريس وقِصر مدة التعرض للعربية تفسير بديل مباشر للتعثر، وقراءته الجيدة بلغته الأولى تعزز هذا التفسير. لذلك يُفحص التاريخ اللغوي ويُقدَّم دعم لغوي مع مراقبة الاستجابة قبل نسبة التعثر إلى صعوبة تعلم.","n":["يقفز إلى التصنيف قبل فحص عامل اللغة.","أداة بلغة لا يتقنها تقيس اللغة لا القدرة.","يعامل الاختلاف اللغوي على أنه صعوبة تعلم.","صحيح: يعالج التفسير البديل المباشر أولًا."],"c":"لغة تدريس جديدة وقراءة جيدة بلغته الأولى","p":"لغة تدريس جديدة أو حرمان تعليمي ← افحص الفرصة قبل تشخيص صعوبة التعلم."},{"id":"12-21","s":12,"i":"12.3","l":"تطبيق","t":"تحصيل عبير منخفض في جميع المواد بدرجة متقاربة، وتحتاج إلى تكرار ووقت أطول في معظم المهام، ولا يظهر لديها مجال أكاديمي قوي، وتفيد أسرتها بأنها تعتمد على غيرها في كثير من مهام العناية الذاتية. ما الإجراء الأنسب؟","o":["عدّ حالتها صعوبة تعلم محددة في مجالات متعددة، وبناء خطة علاجية لكل مادة","وصفها بأنها «بطيئة تعلم» مباشرة بناءً على انخفاض تحصيلها العام","الاكتفاء بتطبيق اختبار ذكاء فردي، فإن جاءت الدرجة منخفضة ثبتت الإعاقة العقلية","عدم افتراض صعوبة تعلم محددة، وطلب تقييم شامل للأداء العقلي والسلوك التكيفي"],"a":3,"w":"الانخفاض الواسع المتقارب في المواد كلها مع غياب مجال قوة واضح لا يمثل نمطًا نوعيًّا، وقرائن الاعتماد في العناية الذاتية تثير سؤال السلوك التكيفي. لذلك لا يُقفز إلى صعوبة تعلم محددة، بل يُطلب تقييم شامل يشمل الأداء العام والسلوك التكيفي وفرص التعلم.","n":["الانخفاض الواسع غير النوعي لا يرجّح صعوبة تعلم محددة.","بطء التعلم وصف تربوي لا يُطلق دون تقييم شامل.","درجة الذكاء وحدها لا تكفي، والسلوك التكيفي عنصر حاسم.","صحيح: النمط عام لا نوعي، وفيه قرائن تكيفية."],"c":"انخفاض عام متقارب مع اعتماد في العناية الذاتية","p":"ضعف نوعي ← صعوبة تعلم محتملة، وانخفاض عام مع قصور تكيفي ← قيّم الإعاقة العقلية."},{"id":"12-22","s":12,"i":"12.3","l":"تحليل","t":"تلقى وليد تدخلًا قرائيًّا مكثفًا في المستوى الثاني مدة اثني عشر أسبوعًا، ووثّقت سجلات المتابعة تنفيذه كما خُطط، وبقي منحنى تقدمه أدنى من خط الهدف بوضوح، مع سلامة سمعه وبصره وانتظام حضوره. ما التفسير الأدق لهذه البيانات؟","o":["البيانات تكفي وحدها لإعلان صعوبة تعلم محددة دون حاجة إلى تقييم إضافي","ضعف الاستجابة قرينة قوية تستدعي تقييمًا شاملًا، لكنه ليس تشخيصًا بمفرده","التدخل غير مناسب له، فيُعاد تطبيقه بالشدة نفسها مدة أطول","ضعف الاستجابة يرجّح الإعاقة العقلية، فيُكتفى بتطبيق مقياس ذكاء عليه"],"a":1,"w":"سلامة التنفيذ وسلامة السمع والبصر وانتظام الحضور تجعل بيانات عدم الاستجابة ذات معنى، فهي قرينة قوية لتصعيد التقييم. لكن الاستجابة للتدخل (RTI) مصدر بيانات ضمن تقييم شامل، وليست اختبارًا تشخيصيًّا مستقلًا.","n":["عدم الاستجابة وحده لا يساوي التشخيص.","صحيح: بيانات مهمة لا تشخيص آلي.","تكرار ما لم ينجح بالشدة نفسها يهدر الوقت.","لا قرائن على قصور عام، ومقياس واحد لا يحسم."],"c":"تنفيذ موثق وعوامل بديلة مستبعدة","p":"عدم الاستجابة لتدخل جيد التنفيذ = بيانات قوية للتقييم، لا تشخيص منفرد."},{"id":"12-23","s":12,"i":"12.3","l":"تحليل","t":"كان أداء حمد في القراءة منخفضًا في الصفين الأول والثاني، وتفيد السجلات بتغيّر معلميه مرارًا وعدم انتظام التعليم القرائي. وبعد ستة أسابيع من تعليم صريح منظم ارتفع أداؤه ارتفاعًا واضحًا ومتسقًا. ماذا ترجّح هذه البيانات؟","o":["أن لديه صعوبة تعلم محددة، لأن تعثره استمر سنتين دراسيتين متتاليتين","أن التحسن مؤقت على الأرجح، فلا يغيّر ذلك الحاجة إلى إحالته العاجلة لتشخيص صعوبة تعلم","أن ضعف التعليم السابق كان عاملًا مهمًّا في تعثره، مع استمرار المراقبة قبل التصنيف","أن مستواه الحقيقي كان مرتفعًا دائمًا، فلا حاجة إلى أي متابعة لاحقة"],"a":2,"w":"صعوبات التعلم المحددة تستمر رغم التعليم المناسب، أما هنا فالتعليم السابق لم يكن مناسبًا، والتحسن جاء سريعًا ومتسقًا بعد تعليم جيد. وهذا يرجّح أن فرصة التعلم كانت عاملًا مهمًّا، مع استمرار المراقبة قبل أي استنتاج تصنيفي.","n":["الاستمرار مع تعليم غير منتظم ليس قرينة على صعوبة نوعية.","يتجاهل بيانات الاستجابة القوية والمتسقة.","صحيح: الاستجابة السريعة تُضعف فرضية الإعاقة.","إلغاء المتابعة قرار يتجاوز البيانات."],"c":"تحسن سريع ومتسق بعد تعليم منظم","p":"افحص فرصة التعلم وجودة التدريس أولًا؛ فصعوبة التعلم تستمر رغم التعليم المناسب."},{"id":"12-24","s":12,"i":"12.3","l":"تطبيق","t":"لدى نواف صعوبة قراءة محددة موثقة، وشُخِّص حديثًا من جهة مختصة باضطراب فرط الحركة وتشتت الانتباه. أي الخطط التربوية أنسب له؟","o":["علاج الانتباه أولًا، وتأجيل التدخل القرائي حتى يتحسن تركيزه بوضوح","عدّ صعوبة القراءة نتيجة مباشرة لتشتت الانتباه، والاكتفاء بخطة لتعديل السلوك الصفي","إلغاء تشخيص صعوبة التعلم لأن اضطراب الانتباه يفسر تعثره كله","تدخل قرائي مباشر يستهدف مهاراته، مع دعم الانتباه والتنظيم بحسب أثرهما في تعلمه"],"a":3,"w":"صعوبة التعلم المحددة واضطراب فرط الحركة وتشتت الانتباه اضطرابان مستقلان قد يترافقان، ووجود أحدهما لا ينفي الآخر. لذلك تعالج الخطة كل حاجة: تدريس قرائي صريح ومنظم، ودعم للانتباه والتنظيم (مهام قصيرة، وقواعد واضحة، وتنظيم بيئي).","n":["يضيّع التدخل القرائي النوعي الذي يحتاجه الآن.","يفسر كل خطأ قرائي بالانتباه ويهمل الصعوبة النوعية.","وجود أحد الاضطرابين لا ينفي الآخر.","صحيح: الترافق يتطلب معالجة الحاجتين."],"c":"صعوبة قراءة موثقة مع ADHD","p":"SLD وADHD قد يترافقان؛ عالج كل حاجة ولا تجعل إحداهما تلغي الأخرى."},{"id":"12-25","s":12,"i":"12.3","l":"تطبيق","t":"لاحظت المعلمة أن بشرى تطلب إعادة الكلام كثيرًا، وتقرّب أذنها من مصدر الصوت، وتخلط بين الأصوات المتقاربة في القراءة، ولم يُفحص سمعها منذ التحاقها بالمدرسة. ما الإجراء الأنسب؟","o":["فحص سمعي لدى جهة مختصة، مع استمرار الدعم القرائي وجمع البيانات","عدّ حالتها صعوبة قراءة محددة لأن الخلط بين الأصوات من مؤشراتها","إيقاف أي دعم قرائي حتى تصدر نتيجة الفحص السمعي بصورة نهائية","تطبيق اختبار مقنن في الوعي الصوتي، واعتماد نتيجته مباشرة في قرار أهليتها للبرنامج"],"a":0,"w":"مؤشرات السمع المذكورة تجعل العامل الحسي تفسيرًا بديلًا مباشرًا يجب تقدير أثره قبل نسبة التعثر إلى صعوبة تعلم. والفحص من اختصاص جهة صحية، ولا يعني ذلك تأخير الدعم التعليمي المناسب في أثناء جمع البيانات.","n":["صحيح: يفحص العامل الحسي دون إيقاف الدعم.","لا يُنسب التعثر إلى صعوبة تعلم قبل استبعاد العامل الحسي.","فحص العامل الحسي لا يقتضي وقف الدعم.","قبل فحص السمع قد يقيس الاختبار الفقد السمعي لا الوعي الصوتي."],"c":"مؤشرات سمعية وسمع غير مفحوص","p":"استبعد العوامل الحسية قبل التصنيف، ولا توقف الدعم في أثناء ذلك."},{"id":"12-26","s":12,"i":"12.4","l":"معرفة","t":"ما المقصود بالطالب «مزدوج الاستثناء» (Twice-Exceptional/2e)؟","o":["طالب يُظهر موهبة أو قدرة عالية، ولديه في الوقت نفسه إعاقة أو صعوبة تعلم","طالب موهوب في مجالين مختلفين أو أكثر، مثل الرياضيات والفنون","طالب لديه صعوبتا تعلم متزامنتان أو أكثر، مثل صعوبة القراءة وصعوبة الكتابة معًا","طالب يجمع بين صعوبة تعلم واضطراب فرط الحركة وتشتت الانتباه"],"a":0,"w":"مزدوج الاستثناء يجمع طرفين: موهبة أو قدرة عالية من جهة، وإعاقة أو صعوبة تعلم أو اضطراب مؤهل للخدمات من جهة أخرى. وقد تخفي الموهبة الصعوبة أو تخفي الصعوبة الموهبة، فيحتاج الطالب مسارين متزامنين.","n":["صحيح: موهبة وصعوبة متزامنتان.","تعدد مجالات الموهبة ليس ازدواج استثناء.","يغيب عنصر الموهبة أو القدرة العالية.","هذا ترافق اضطرابين دون موهبة."],"c":"موهبة وصعوبة في الوقت نفسه","p":"2e = موهبة أو قدرة عالية + إعاقة أو صعوبة متزامنة."},{"id":"12-27","s":12,"i":"12.4","l":"معرفة","t":"أي العبارات تصف «النموذج القائم على نقاط القوة» (Strengths-Based Approach) بدقة؟","o":["يحدد موارد الطالب ومهاراته ويوظفها لدعم تعلمه، مع الاستمرار في معالجة صعوباته","ينمّي مجالات تفوق الطالب أولًا، ويؤجل معالجة صعوباته حتى يكتسب الثقة الكافية بنفسه","يستبدل التدريس العلاجي بأنشطة إثرائية في مجال قوة الطالب طوال العام","يقصر تقويم الطالب على مجالات قوته حمايةً لدافعيته من الإحباط"],"a":0,"w":"النموذج القائم على نقاط القوة توجه يبدأ من موارد الطالب ومهاراته ويستخدمها مدخلًا للتعلم والدافعية، لكنه لا يلغي التدخل المباشر للصعوبة؛ فالهدف التمكين مع استمرار العلاج.","n":["صحيح: تمكين وعلاج معًا.","تأجيل العلاج يهمل الحاجة الأكاديمية.","القوة مدخل للتعلم لا بديل عن التدخل.","يحجب بيانات الحاجة ويُخل بعدالة القياس."],"c":"يوظف القوة ويستمر في المعالجة","p":"القوة مدخل وجسر، وليست بديلًا عن تدريس المهارة الضعيفة."},{"id":"12-28","s":12,"i":"12.4","l":"تطبيق","t":"قالت معلمة: «لدى جنى ذكاء موسيقي واضح، لذا سأقدّم لها الدروس كلها من خلال الأناشيد فقط». ما التصحيح المهني الأنسب لهذا التوجه؟","o":["الاستمرار في الخطة، لأن التدريس بالذكاء القوي يعالج الصعوبة تلقائيًّا","توظيف الأناشيد حين تخدم الهدف، مع تنويع طرق العرض دون تثبيتها في نمط واحد","منع استخدام الأناشيد تمامًا، لأن نظرية الذكاءات المتعددة ليست أداة تشخيص","تطبيق مقياس للذكاءات المتعددة لتأكيد نمطها قبل اعتماده في التدريس"],"a":1,"w":"الذكاءات المتعددة إطار توعوي لتوسيع النظر إلى القدرات وتنويع فرص المشاركة، لا اختبار يصنّف الطالب في «نمط تعلم» يُدرَّس من خلاله حصرًا. والأنسب توظيف الأناشيد حين تخدم الهدف مع تنويع طرائق العرض والتعبير وفق طبيعة المهمة.","n":["لا علاج تلقائيًّا؛ المهارة الضعيفة تحتاج تدريسًا مباشرًا.","صحيح: القوة تُوظَّف ولا تتحول إلى نمط ثابت.","مبالغة عكسية تهدر قوة يمكن توظيفها.","يعامل النظرية كاختبار تشخيصي لأنماط ثابتة."],"c":"الدروس كلها من خلال الأناشيد فقط","p":"لا تحوّل نقطة القوة إلى «نمط تعلم ثابت»؛ اختر الدعم بحسب المهمة والبيانات."},{"id":"12-29","s":12,"i":"12.4","l":"تطبيق","t":"عمر موهوب في الرياضيات ولديه عسر قراءة، ويتذمر من أن أنشطة غرفة المصادر «سهلة ومملة»، فقلّ تفاعله فيها. ما الإجراء الأنسب؟","o":["إيقاف التدخل القرائي لأن موهبته الرياضية تعوّض صعوبته في القراءة","منحه الأنشطة الإثرائية مكافأةً فقط بعد إنهاء تدريبات القراءة","خفض مستوى أنشطة الرياضيات لتتوافق مع مستواه القرائي المنخفض","إبقاء التدخل القرائي المستهدف، مع إثراء وتحديات رياضية تناسب قدرته العالية"],"a":3,"w":"الطالب مزدوج الاستثناء يحتاج مسارين متزامنين: تدخلًا مباشرًا للصعوبة، وإثراءً وتحديًا مناسبين للموهبة. والمشكلة هنا ليست في وجود العلاج، بل في غياب التحدي المتناسب مع قدرته العالية.","n":["الموهبة لا تلغي الحاجة إلى التدخل.","الإثراء استجابة لموهبته لا مكافأة مشروطة.","يخفض التوقعات ويحجب الموهبة.","صحيح: مساران متزامنان."],"c":"موهوب يشعر بالملل من التدريب العلاجي","p":"مع 2e لا تختر بين الموهبة والصعوبة: إثراء للقوة وتدخل للصعوبة معًا."},{"id":"12-30","s":12,"i":"12.4","l":"تطبيق","t":"يقيّم معلم مهارة كتابة فقرة وصفية منظمة لدى سارا، وهي متميزة في التعبير الشفهي ولديها صعوبة كتابة. ما الإجراء الذي يحافظ على عدالة القياس وصلاحيته؟","o":["استبدال الفقرة المكتوبة بعرض شفهي، لأن التعبير الشفهي نقطة قوتها","إعفاؤها من المهمة الكتابية والاكتفاء بدرجة مشاركتها الشفهية في الصف","تقييم فقرتها بمعايير أدنى من معايير زملائها دون توثيق ذلك أو إعلام الفريق","تقديم سقالات مثل منظم أفكار ووقت مناسب، ثم تقييم الفقرة المكتوبة نفسها"],"a":3,"w":"حين تكون الكتابة نفسها هي ما يقيسه التقويم، لا يجوز استبدالها باستجابة شفهية ثم الادعاء بأن المهارة نفسها قِيست. والتكييف المشروع يقدّم سقالات لا تلغي إنتاج الكتابة، ثم تُقاس الكتابة نفسها.","n":["الكتابة هي البناء المقاس، واستبدالها يلغي القياس.","إعفاء من المهارة المستهدفة لا تكييف.","تعديل غير موثق يغيّر معنى الدرجة.","صحيح: يدعم دون إلغاء البناء المقاس."],"c":"المقاس هو مهارة الكتابة نفسها","p":"إذا كانت الكتابة هي الهدف فقِس الكتابة؛ وإن لم تكن فأتح استجابة بديلة."},{"id":"12-31","s":12,"i":"12.4","l":"تطبيق","t":"لاحظ معلم التربية الفنية أن طلال يصمم نماذج مجسمة متقنة، بينما تُظهر اختباراته الورقية تحصيلًا منخفضًا بسبب صعوبة القراءة. يريد الفريق التحقق من وجود قدرة متميزة لديه. ما الإجراء الأنسب؟","o":["الاعتماد على درجاته الورقية لأنها المقياس الرسمي لقدراته","جمع منتجات وملاحظات من مواقف ومعلمين متعددين، ثم تحليل نمط أدائه","الاكتفاء بملاحظة معلم التربية الفنية لأنه الأقرب إلى مجال قوته","تطبيق اختبار ذكاء جمعي ورقي واعتماد نتيجته في الحكم على قدرته"],"a":1,"w":"اكتشاف القدرة يحتاج التحقق من ثبات الأداء عبر مواقف ومنتجات ومصادر متعددة، لأن الاختبار الورقي قد يسمح لصعوبة القراءة بإخفاء القدرة. ثم يُحلَّل النمط ويُوثَّق قبل الحكم.","n":["صعوبة القراءة قد تحجب قدرته في الاختبار الورقي.","صحيح: تعدد المصادر والمواقف.","مصدر واحد لا يكفي للتحقق من ثبات القدرة.","أداة ورقية واحدة يتأثر أداؤه فيها بالقراءة."],"c":"إبداع عملي واختبارات ورقية منخفضة","p":"الكشف عن الموهبة = مواقف ومنتجات ومصادر متعددة، لا درجة واحدة."},{"id":"12-32","s":12,"i":"12.4","l":"تحليل","t":"وظّفت معلمة اهتمام فهد بعلم الفلك في نصوص جلسات القراءة العلاجية، وبعد شهر أصبح يُقبل على الجلسات بحماس. ما الدليل الأقوى على أن هذا التوظيف حقق غرضه التربوي؟","o":["إقباله على الجلسات بحماس، وطلبه المزيد من نصوص الفلك من تلقاء نفسه بعد كل جلسة","إنتاجه ملصقًا عن الكواكب نال إعجاب زملائه ومعلميه في المدرسة","اختياره موضوعات الفلك طوعًا في أنشطة الصف المختلفة كلها","تحسن موثق في قياسات مهارة القراءة المستهدفة، إلى جانب ارتفاع مشاركته"],"a":3,"w":"استثمار القوة أو الاهتمام يكون تربويًّا حين يرتبط بهدف تعليمي واضح ويظهر أثره في بيانات قابلة للتوثيق. وارتفاع الحماس مهم، لكن الدليل الأقوى هو تحسن المهارة المستهدفة في القياسات.","n":["مؤشر دافعية مهم لكنه لا يثبت تحسن المهارة.","منتج ممتع لا يرتبط مباشرة بهدف القراءة.","يدل على الاهتمام لا على أثر تعليمي موثق.","صحيح: الأثر مرتبط بالهدف ومقيس."],"c":"الغرض التربوي للتوظيف","p":"وثّق الأثر: استثمار القوة يجب أن يرتبط بهدف وبيانات تقدم."},{"id":"12-33","s":12,"i":"12.4","l":"تحليل","t":"تقع درجات سلطان قرب متوسط صفه في معظم المواد، لكن تقييم قدراته أظهر استدلالًا لفظيًّا وكميًّا مرتفعًا جدًّا، وتبيّن أنه يقضي ساعات طويلة في إنجاز الواجبات الكتابية، وأخطاؤه الإملائية متكررة ونوعية. ما التفسير الأدق؟","o":["أداؤه القريب من متوسط صفه في معظم المواد ينفي وجود صعوبة تعلم، فلا يحتاج إلى دعم","قد تُخفي قدرته العالية صعوبة كتابية نوعية، فيحتاج تقييم الكتابة مع رعاية قدرته","ارتفاع قدرته يدل على أن تعثره الكتابي ناتج عن الإهمال وقلة الجهد","الأَولى إلحاقه ببرنامج الموهوبين فقط، دون حاجة إلى تقييم كتابته"],"a":1,"w":"لدى الطالب مزدوج الاستثناء قد تعوّض الموهبة الصعوبة فتخفيها، فيظهر أداء متوسط لا يلفت الانتباه. والأخطاء الإملائية النوعية والجهد الكتابي المفرط قرائن تستدعي تقييم الكتابة مع رعاية القدرة العالية، دون جعل التناقض وحده تصنيفًا.","n":["الأداء المتوسط قد يخفي فجوة بين القدرة والأداء النوعي.","صحيح: احتمال إخفاء متبادل يحتاج تحققًا.","يفسر الصعوبة بالكسل رغم قرائن نوعية.","يُغفل جانب الصعوبة لدى طالب يُحتمل ازدواج استثنائه."],"c":"قدرة مرتفعة جدًّا وأداء متوسط وأخطاء نوعية","p":"قد تخفي الموهبة الصعوبة: تحقق ببيانات متعددة قبل النفي أو الإثبات."},{"id":"12-34","s":12,"i":"12.5","l":"معرفة","t":"أي العبارات أدق في وصف «المؤشر المبكر» لخطر صعوبات التعلم؟","o":["علامة تستدعي المتابعة والتدخل، وتقوى إذا تعددت واستمرت رغم المساندة المعتادة","علامة تثبت وجود صعوبة تعلم إذا ظهرت لدى الطفل في مرحلة رياض الأطفال","علامة لا تستحق الاهتمام قبل اتساع التعثر الأكاديمي، لأن الفروق النمائية تزول تلقائيًّا","علامة تقتضي إحالة الطفل مباشرة إلى التشخيص الرسمي قبل تقديم أي دعم"],"a":0,"w":"المؤشر المبكر علامة تستدعي المتابعة والتدخل، وليس تشخيصًا. وتزداد قوته حين تتعدد المؤشرات وتستمر عبر الزمن ولا تتحسن بالمساندة المعتادة؛ وعندئذ يُقدَّم تدخل مبكر منظم مع مراقبة التقدم بدل انتظار الفشل.","n":["صحيح: علامة متابعة لا تشخيص.","المؤشر المبكر لا يساوي التشخيص.","هذه سياسة انتظار الفشل.","القفز إلى التشخيص وتأخير الدعم خطآن."],"c":"وصف المؤشر المبكر","p":"متعدد + مستمر + لا يتحسن بالمساندة المعتادة = حاجة أقوى للتدخل، لا تشخيص آلي."},{"id":"12-35","s":12,"i":"12.5","l":"معرفة","t":"أي مما يلي يُعد مؤشرًا مبكرًا لخطر صعوبات القراءة يستدعي المتابعة؟","o":["تفضيل الطفل اللعب الحركي على الأنشطة الهادئة في الروضة","خطأ الطفل في تسمية حرف جديد في الأسبوع الأول من تعلمه","صعوبة مستمرة في تحليل أصوات الكلمات ودمجها رغم التعليم المنتظم","اختلاف لهجة الطفل في المنزل عن لغة التدريس في المدرسة"],"a":2,"w":"الوعي الصوتي من أهم المؤشرات المبكرة المرتبطة بتعلم القراءة، وتزداد دلالته حين تكون الصعوبة مستمرة رغم تعليم منتظم. أما الخطأ العابر في بداية التعلم أو الاختلاف اللغوي فلا يُعدان مؤشر خطر بذاتهما.","n":["تفضيل نشاط ليس مؤشرًا لخطر القراءة.","خطأ عابر في بداية التعلم لا يمثل استمرارًا.","صحيح: وعي صوتي، واستمرار رغم التعليم.","الاختلاف اللغوي ليس مؤشرًا لصعوبة تعلم بحد ذاته."],"c":"صعوبة مستمرة رغم التعليم المنتظم","p":"ابحث عن الاستمرار رغم التعليم؛ فالخطأ العابر ليس مؤشر خطر."},{"id":"12-36","s":12,"i":"12.5","l":"تطبيق","t":"في الصف الأول لا يزال زياد يعدّ من الواحد في كل مرة ليعرف أي المجموعتين أكبر، ويتعثر في مقارنة الكميات الصغيرة رغم التعليم المنتظم منذ بداية العام. ما الإجراء الأنسب؟","o":["تدخل مبكر مباشر في الحس العددي بتمثيلات محسوسة، مع قياس متكرر للتقدم","انتظار نضج المفاهيم العددية مع تقدم العمر قبل تقديم أي دعم خاص","زيادة الواجبات المنزلية في الحساب دون تحديد المهارة المتأثرة","إحالته لتشخيص صعوبة الرياضيات، وتأجيل أي دعم حتى يصدر قرار اللجنة المختصة"],"a":0,"w":"التعثر في الحس العددي والعلاقات بين الكميات رغم التعليم المناسب مؤشر مبكر مهم لمسار تعلم الرياضيات. والاستجابة المهنية تدخل مبكر مباشر في المهارة المحددة بتمثيلات محسوسة متدرجة، مع قياس تقدم متكرر بدل الانتظار أو التشخيص المتسرع.","n":["صحيح: يستهدف المهارة المتأثرة مبكرًا.","انتظار الفشل يوسّع الفجوة.","زيادة الكمية لا تعالج العملية المتأثرة.","يؤخر الدعم ويقفز إلى التشخيص."],"c":"تعثر مستمر في مقارنة الكميات","p":"المؤشر المبكر يُقابَل بتدخل يستهدف المهارة المحددة وقياس متكرر."},{"id":"12-37","s":12,"i":"12.5","l":"تطبيق","t":"يجد رائد في الروضة صعوبة متكررة في نسخ الأشكال البسيطة وتتبع المسارات بالقلم، ويتجنب أنشطة القص والتلوين. ما الإجراء الأنسب؟","o":["عدّ ذلك مؤشرًا مؤكدًا على صعوبة تعلم في الكتابة وإحالته للتشخيص","جمع بيانات وظيفية عن تآزره البصري الحركي في مهام متعددة، مع متابعته ودعمه","تجاهل الأمر لأن التآزر البصري الحركي لا علاقة له بالتعلم المدرسي","منعه من أنشطة القلم حتى يكتمل نضجه الحركي من تلقاء نفسه"],"a":1,"w":"التآزر البصري الحركي من المجالات التي تُلاحظ مبكرًا، والصعوبة المتكررة فيه علامة تستدعي متابعة وظيفية لا تشخيصًا. لذلك تُجمع بيانات عن أدائه في مهام مختلفة ويُقدَّم دعم مناسب، مع إشراك مختص إذا استمر الأثر الوظيفي.","n":["المؤشر المبكر ليس تشخيصًا.","صحيح: متابعة وظيفية دون تشخيص.","التآزر البصري الحركي من مجالات الملاحظة المبكرة.","التجنب يحرمه من الممارسة ويؤخر الدعم."],"c":"صعوبة متكررة في نسخ الأشكال وتتبع المسارات","p":"علامة مبكرة ← بيانات وظيفية ودعم ومتابعة، لا حكم نهائي."},{"id":"12-38","s":12,"i":"12.5","l":"تطبيق","t":"التحق عبدالرحمن بالصف الأول في منتصف الفصل الدراسي بعد انقطاع طويل عن التعليم، ويُظهر تأخرًا في معرفة أصوات الحروف مقارنة بزملائه. ما الإجراء الأنسب أولًا؟","o":["عدّه معرضًا لخطر صعوبات التعلم بدرجة عالية، وإحالته إلى تقييم شامل فورًا ودون انتظار","تحديد مستواه وتعويض ما فاته بتعليم صريح، ثم مراقبة استجابته قبل أي استنتاج","انتظار نهاية العام الدراسي لمعرفة ما إذا كان التأخر سيزول تلقائيًّا","ضمّه إلى طلاب صعوبات التعلم في غرفة المصادر مباشرة دون تقييم"],"a":1,"w":"الانقطاع الطويل عن التعليم تفسير سياقي مباشر للتأخر، فلا يُعد مؤشر خطر مستمر قبل تعويض فرص التعلم. والإجراء الأول خط أساس لمستواه، ثم تعليم صريح منظم، ومراقبة الاستجابة؛ فإن استمر الضعف رغم التعليم الكافي صُعِّد التقييم.","n":["يتجاهل تفسيرًا بديلًا مباشرًا هو الانقطاع.","صحيح: يعالج نقص الفرصة أولًا.","الانتظار دون تعليم موجه يوسّع الفجوة.","تصنيف متسرع قبل فحص أثر نقص التعليم."],"c":"انقطاع طويل عن التعليم","p":"غياب أو انقطاع أو انتقالات كثيرة ← عوّض الفرصة وراقب قبل التصنيف."},{"id":"12-39","s":12,"i":"12.5","l":"تحليل","t":"تُظهر بيانات متابعة غادة في الروضة خلال عشرة أسابيع من تعليم منتظم: بطئًا ملحوظًا في تعلم أسماء الحروف وأصواتها، وصعوبة مستمرة في تمييز الكلمات المتشابهة صوتيًّا، ونسيانًا متكررًا لتعليمات من خطوتين، مع سلامة السمع وانتظام الحضور. ما التفسير الأدق؟","o":["اجتماع هذه المؤشرات يكفي لتشخيص صعوبة تعلم محددة في القراءة","تعدد المؤشرات واستمرارها يرفعان الخطر ويستدعيان تدخلًا مبكرًا، لا تشخيصًا نهائيًّا","المؤشرات عابرة ومتوقعة في هذا العمر، فيُكتفى بالتعليم الصفي المعتاد دون متابعة خاصة","المؤشرات تدل على إعاقة عقلية لأنها تشمل اللغة والذاكرة معًا"],"a":1,"w":"المؤشرات متعددة (الحروف والأصوات، والوعي الصوتي، والذاكرة) ومستمرة رغم تعليم منتظم، والعوامل البديلة كالسمع والغياب مستبعدة؛ فهي ترفع مستوى الخطر. لكن المؤشر المبكر يبقى علامة تستدعي تدخلًا مبكرًا منظمًا ومراقبة تقدم، لا تشخيصًا نهائيًّا.","n":["تعدد المؤشرات لا يحولها إلى تشخيص.","صحيح: خطر أعلى، وتدخل، ومراقبة.","الاستمرار عشرة أسابيع رغم التعليم ليس عابرًا.","لا بيانات عن قصور عقلي عام أو تكيفي."],"c":"مؤشرات متعددة مستمرة مع استبعاد السمع والغياب","p":"التعدد والاستمرار يرفعان الخطر، لكنهما لا يحولان المؤشر إلى تشخيص."},{"id":"12-40","s":12,"i":"12.5","l":"تحليل","t":"قُدِّم تدخل في الوعي الصوتي لطفلين مدة ستة أسابيع، ووثّق المعلم تنفيذ الجلسات كاملة لهما. ارتفع أداء سامي في دمج الأصوات من 3 إلى 9 من 10، وارتفع أداء رامي من 2 إلى 3 من 10. ما القرار الأنسب لرامي؟","o":["الاستمرار في التدخل نفسه دون تغيير، لأنه أثبت فاعليته مع سامي","إيقاف الدعم، لأن تحسنه البسيط يدل على أنه سيلحق بزملائه تلقائيًّا","مراجعة التدخل بزيادة شدته أو تعديله، مع النظر في تقييم أعمق لحالته","إعلان تشخيصه بصعوبة تعلم محددة اعتمادًا على هذه البيانات وحدها"],"a":2,"w":"مع تنفيذ موثق للجلسات يصبح ضعف استجابة رامي بيانات ذات معنى: فالاستجابة أقل من المتوقع رغم تدخل مناسب. والقرار المهني تصعيد مدروس بزيادة الشدة أو تعديل الطريقة والنظر في تقييم أعمق، دون تشخيص آلي.","n":["فاعليته مع طفل آخر لا تضمن مناسبته لرامي.","تحسن ضئيل لا يبرر وقف الدعم.","صحيح: بيانات موثوقة مع تنفيذ سليم.","ضعف الاستجابة لا يساوي التشخيص وحده."],"c":"تنفيذ كامل واستجابة ضعيفة جدًّا","p":"صعّد الشدة أو التقييم حين تُبيّن بيانات موثوقة ضعف الاستجابة رغم تنفيذ سليم."},{"id":"12-41","s":12,"i":"12.5","l":"تطبيق","t":"قبل بدء برنامج دعم مبكر لطفل يتعثر في معرفة أصوات الحروف، ما الإجراء الذي يجعل الحكم على تقدمه لاحقًا ممكنًا؟","o":["إبلاغ الأسرة بأن طفلها معرض لخطر صعوبات التعلم قبل بدء البرنامج","اختيار أكثر برامج الدعم المبكر انتشارًا في المدارس وتطبيقه على الطفل من اليوم الأول","زيادة وقت تعليمه في الصف العام دون تسجيل مستواه الحالي","قياس خط أساس لأصوات الحروف بإجراء قابل للتكرار والمقارنة عبر الزمن"],"a":3,"w":"خط الأساس يحدد مستوى البداية الذي تُقارن به بيانات التقدم بعد التدخل، ولا يمكن الحكم على الاستجابة دونه. ويُفضَّل أن يُقاس بإجراء قابل للتكرار حتى تكون القياسات اللاحقة قابلة للمقارنة.","n":["تواصل مهم لكنه لا يوفر مرجعًا لقياس التقدم.","الانتشار ليس دليلًا، ولا يحدد نقطة البداية.","دون بيانات بداية لا يمكن الحكم على التقدم.","صحيح: خط الأساس مرجع المقارنة."],"c":"يجعل الحكم على التقدم لاحقًا ممكنًا","p":"خط الأساس يسبق الحكم على التقدم."},{"id":"13-01","s":13,"i":"13.1","l":"معرفة","t":"عند تحليل وحدة «الكسور» صنّفت المعلمة مفهوم «الوحدة الكاملة وأجزاؤها المتساوية» مفهومًا حرجًا. ما المقصود بالمفهوم الحرج في تحليل المحتوى؟","o":["مفهوم تأسيسي يُشترط إتقانه لفهم ما يُبنى عليه من تعلم لاحق","مفهوم يتكرر وروده كثيرًا في صفحات الوحدة وتمارينها","مفهوم يخطئ فيه أغلب طلاب الصف عادةً في الاختبار القبلي","مفهوم مجرد لا يُدرَّس إلا بوسائل بصرية ومحسوسة"],"a":0,"w":"المفهوم الحرج حجر بناء في البنية المعرفية للمادة؛ إذا لم يُتقن انقطع تعلم ما يليه من مفاهيم ومهارات. لذلك يحدده المعلم في أثناء تحليل المحتوى، ويتحقق من إتقانه قبل الانتقال إلى ما يُبنى عليه.","n":["صحيح: يُعرَّف بوظيفته البنائية لما بعده.","كثرة التكرار لا تجعل المفهوم حرجًا؛ العبرة بكونه شرطًا لما يليه.","شيوع الخطأ وصف لصعوبة المفهوم، لا لوظيفته في بنية المادة.","يخلط بين طريقة التمثيل ودرجة التجريد وبين معنى الحرجية."],"c":"مفهومًا حرجًا في تحليل المحتوى","p":"المفهوم الحرج شرط بنائي لما بعده، لا مجرد مفهوم صعب أو متكرر."},{"id":"13-02","s":13,"i":"13.1","l":"تطبيق","t":"فيصل في الصف الخامس، يقرأ درس «دورة الماء في الطبيعة» قراءة جهرية سليمة وبطلاقة مناسبة، لكنه يعجز عن تفسير سبب تكوّن السحب. ما الإجراء الأنسب أولًا؟","o":["تحليل مفاهيم الدرس وعلاقاتها لتحديد موضع انقطاع الفهم","تدريبه على قراءة الدرس مرات متكررة لرفع طلاقته وسرعته في القراءة","تخفيف الدرس بحذف المفاهيم العلمية والاكتفاء بالحقائق المباشرة فيه","تسجيل الدرس صوتيًا ليستمع إليه في المنزل بدل أن يقرأه بنفسه"],"a":0,"w":"القراءة الآلية لا تعني الفهم؛ فما دام فيصل يقرأ بدقة وطلاقة فإن تعثره في المحتوى نفسه: مفهوم غير متقن، أو علاقة سببية غير واضحة، أو متطلب سابق مفقود. وتحليل المحتوى يحدد نقطة الانقطاع ويسبق اختيار أي استراتيجية.","n":["صحيح: القراءة سليمة، فالتحليل يبدأ من بنية المحتوى.","القراءة سليمة أصلًا؛ علاج الطلاقة لا يستهدف موضع التعثر.","تعديل يخفض الهدف قبل معرفة سبب التعثر.","يزيل حاجز قراءة غير موجود، ولا يعالج فجوة الفهم."],"c":"قراءة سليمة مع عجز عن التفسير","p":"تعثر مع قراءة جيدة يعني: حلّل المفاهيم والعلاقات، ولا تعالج الطلاقة تلقائيًا."},{"id":"13-03","s":13,"i":"13.1","l":"تطبيق","t":"تخطط المعلمة لدرس «مقارنة الكسور» لريم، وأظهر تقويم قبلي أن ريم لا تتقن مفهوم «الكسور المتكافئة» الذي يقوم عليه الدرس. ما القرار الأنسب؟","o":["إعادة تدريس وحدة الكسور كاملة من بدايتها قبل تقديم أي درس جديد","المضي في الدرس كما هو مع تقليل عدد التمارين المطلوبة منها","استبدال هدف المقارنة بهدف أسهل يناسب مستواها الحالي في الكسور","تعليم المتطلب السابق بقدر ما يلزم ثم العودة إلى هدف المقارنة"],"a":3,"w":"ذكر متطلب سابق غير متقن قرينة على التسلسل الهرمي للمهارات؛ فالبناء على أساس هش ينتج تعلمًا هشًا. والإجراء الأصح معالجة المتطلب بالقدر الذي يمكّن من تعلم الدرس الحالي، ثم العودة إلى الهدف الأصلي دون خفضه.","n":["المتطلبات السابقة لا تعني إعادة المنهج كله، بل ما يلزم للمهارة الحالية.","تقليل الكمية لا يسد فجوة مفاهيمية في متطلب سابق.","تعديل للهدف قبل معالجة السبب المحدد للتعثر.","صحيح: يعالج نقطة الانقطاع ويحافظ على الهدف."],"c":"لا تتقن ما يقوم عليه الدرس","p":"متطلب سابق مفقود: عالجه بقدر الحاجة ثم عُد إلى الهدف الأصلي."},{"id":"13-04","s":13,"i":"13.1","l":"تحليل","t":"في وحدة «النبات» اتخذت المعلمة إجراءين مع جود: قدّمت لها النص منظمًا بصريًا مع قارئ صوتي وأبقت أسئلة تفسير وظائف الأجزاء كما هي، ثم اكتفت منها في التقويم الختامي بتسمية أجزاء النبات بدل تفسير وظائفها. ما التوصيف الأدق للإجراءين؟","o":["كلاهما تكييف لأنهما يراعيان صعوبة جود دون حرمانها من الدرس","الأول تكييف لأنه أبقى الهدف، والثاني تعديل لأنه خفّض مستوى التوقع","الأول تعديل لأنه غيّر شكل النص المقدَّم، والثاني تكييف لأنه بسّط المهمة","كلاهما تعديل لأن أي تغيير فيما يُقدَّم للطالبة يُعد تعديلًا"],"a":1,"w":"التكييف يغيّر طريقة العرض أو الاستجابة أو الزمن أو البيئة مع بقاء الهدف الأكاديمي ثابتًا، والتعديل يغيّر الهدف نفسه أو يخفض مستوى التوقع. والانتقال من «تفسير الوظائف» إلى «تسمية الأجزاء» خفضٌ لمستوى التفكير المطلوب، فهو تعديل.","n":["مراعاة الصعوبة لا تكفي للتصنيف؛ الإجراء الثاني غيّر الهدف نفسه.","صحيح: الفيصل ثبات الهدف أو تغيّره.","عكسٌ للمفهومين: تغيير العرض تكييف، وخفض التوقع تعديل.","ليس كل تغيير تعديلًا؛ تغيير العرض مع بقاء الهدف تكييف."],"c":"أبقت الأسئلة كما هي ثم اكتفت بالتسمية","p":"الهدف ثابت وطريقة العرض تغيّرت = تكييف؛ الهدف نفسه تغيّر = تعديل."},{"id":"13-05","s":13,"i":"13.1","l":"تطبيق","t":"يتعثر سلمان في صفحة درس الدراسات الاجتماعية التي تعرض ستة مفاهيم مترابطة دفعة واحدة، وتشير بياناته إلى ضعف في الذاكرة العاملة. ما الإجراء الأنسب؟","o":["تقديم المفاهيم في وحدات مترابطة متتابعة دون حذف أي منها","حذف بعض المفاهيم والاكتفاء بأسهلها حتى لا تُرهَق ذاكرته العاملة","مطالبته بحفظ تعريفات المفاهيم الستة كلها قبل شرح العلاقات بينها","تمديد زمن الحصة ليقرأ الصفحة كاملة دون مقاطعة أو أسئلة"],"a":0,"w":"كثافة العناصر مع ضعف الذاكرة العاملة قرينة على الحمل المعرفي، والتجزئة تقلل عدد ما يعالجه الطالب في الوقت نفسه. والمهم أن تبقى المفاهيم المستهدفة كاملة؛ فالتجزئة تغيّر طريقة التقديم لا مقدار الهدف.","n":["صحيح: يقلل الحمل المعرفي دون خفض الهدف.","تقليل الحمل المعرفي لا يعني خفض الهدف الأكاديمي.","يزيد الحفظ الصم ويضاعف العبء على الذاكرة العاملة.","الزمن الإضافي لا يقلل عدد العناصر المعالجة في آن واحد."],"c":"ستة مفاهيم مترابطة دفعة واحدة","p":"مهمة كثيفة مع ذاكرة عاملة ضعيفة: جزّئ وحافظ على الهدف."},{"id":"13-06","s":13,"i":"13.1","l":"معرفة","t":"ما الفرق الأدق بين تحليل المحتوى وتحليل المهمة؟","o":["الأول يجريه معلم التعليم العام، والثاني يختص به معلم التربية الخاصة وحده","الأول يُستخدم في المواد النظرية، والثاني يقتصر على مهارات الرياضيات وحدها","لا فرق جوهريًا بينهما؛ فكلاهما اسم آخر لتبسيط الدرس على الطالب","الأول يكشف المفاهيم وعلاقاتها ومتطلباتها، والثاني يجزّئ الأداء إلى خطوات"],"a":3,"w":"تحليل المحتوى يفكك المادة إلى حقائق ومفاهيم وتعميمات ومهارات وعلاقات ومتطلبات سابقة ليكشف مصادر الصعوبة، أما تحليل المهمة فيفكك أداءً أو إجراءً إلى خطوات متتابعة يمكن تعليمها ومراقبتها. وقد يُستخدمان معًا في مهارة أكاديمية مركبة.","n":["التمييز بينهما وظيفي، لا بحسب من يجريهما.","كلاهما يصلح في مواد مختلفة بحسب طبيعة الهدف.","تحليل المحتوى ليس تبسيطًا عشوائيًا، والإجراءان مختلفان وظيفيًا.","صحيح: تمييز وظيفي دقيق بين الإجراءين."],"c":"تحليل المحتوى مقابل تحليل المهمة","p":"المحتوى: ماذا يجب أن يعرف الطالب؟ والمهمة: ما خطوات الأداء؟"},{"id":"13-07","s":13,"i":"13.1","l":"تطبيق","t":"يحل يوسف مسائل الجمع مع إعادة التجميع بنجاح عندما يستخدم المكعبات، لكن أداءه ينهار عند الانتقال مباشرة إلى الصورة الرمزية العمودية. ما الإجراء الأنسب؟","o":["إعادة تدريس مفهوم الجمع من البداية والبقاء على المكعبات وحدها مدة أطول","إدخال تمثيل شبه محسوس كالرسوم يربط المكعبات بالرموز تدريجيًا","سحب المكعبات فورًا وتدريبه على الصورة الرمزية بتمارين مكثفة","تحفيظه جدول حقائق الجمع أولًا لأن تعثره ناتج عن ضعف الحفظ"],"a":1,"w":"نجاح يوسف بالمكعبات يثبت فهمه للمفهوم، وانهياره عند الرموز يحدد نقطة الانقطاع في الانتقال بين التمثيلات. والمسار المهم في الرياضيات: محسوس ثم شبه محسوس ثم مجرد، مع التحقق من الفهم في كل مرحلة.","n":["المفهوم متقن محسوسًا؛ البقاء على المحسوس لا يبني الانتقال إلى الرمز.","صحيح: يسد فجوة الانتقال بين التمثيلات.","سحب مفاجئ يقفز فوق المرحلة الوسيطة التي انقطع عندها الأداء.","تفسير لا تدعمه القرينة؛ الانهيار مرتبط بالانتقال إلى الرموز لا بالحفظ."],"c":"ينهار عند الانتقال مباشرة إلى الرموز","p":"محسوس ثم شبه محسوس ثم مجرد، ولا تقفز فوق المرحلة الوسيطة."},{"id":"13-08","s":13,"i":"13.2","l":"معرفة","t":"أعدّت معلمة خطة درس في الإملاء لمجموعة من طالبات غرفة المصادر. أي العبارات الآتية تمثّل ناتج تعلم لا نشاطًا تعليميًا؟","o":["أن تلوّن الطالبة التاء المربوطة في بطاقات الكلمات بلون مختلف ومميز","أن تكتب الطالبة بصحة كلمات تنتهي بالتاء المربوطة في إملاء منظور","أن تستمع الطالبة إلى قصة قصيرة تتكرر فيها كلمات الدرس","أن تعمل الطالبة مع زميلتها على ترتيب بطاقات كلمات الدرس"],"a":1,"w":"ناتج التعلم عبارة تصف ما يُتوقع أن تعرفه الطالبة أو تؤديه في نهاية النشاط بفعل قابل للملاحظة والقياس، أما التلوين والاستماع والعمل مع الزميلة فأنشطة ووسائل لتحقيقه. النشاط يجيب عن «ماذا سنفعل؟»، والناتج عن «ماذا سنتعلم أو نستطيع أداءه؟».","n":["تلوين البطاقات وسيلة ونشاط، لا ما ستتعلمه الطالبة.","صحيح: يصف أداء الطالبة القابل للملاحظة.","الاستماع نشاط تعليمي لا يصف الأداء المتوقع.","عمل تعاوني يصف ما يُفعل في أثناء التعلم لا ناتجه."],"c":"ناتج تعلم لا نشاطًا تعليميًا","p":"النشاط وسيلة والناتج غاية؛ ابحث عن الأداء الذي سيُحكم عليه."},{"id":"13-09","s":13,"i":"13.2","l":"تطبيق","t":"في بداية حصة الحساب بغرفة المصادر وزّع المعلم بطاقات أعداد على عبدالله وزميليه وطلب منهم البدء، فسأله عبدالله: «ماذا نفعل بها؟» ثم انشغل بترتيبها عشوائيًا. ما الإجراء الأنسب؟","o":["تقديم تعزيز رمزي لمن يُكمل ترتيب البطاقات أولًا لضبط انشغالهم","زيادة وقت النشاط حتى يكتشفوا الغاية من البطاقات بأنفسهم","استبدال البطاقات بورقة عمل مكتوبة تقل فيها فرص العبث والانشغال","إعلان ناتج التعلم ومعيار النجاح بصريًا وشفهيًا والتحقق من فهمه"],"a":3,"w":"سؤال الطالب «ماذا نفعل؟» قرينة على غياب ناتج تعلم معلن؛ فالطالب ذو صعوبات التعلم يتشتت حين لا يعرف بؤرة المهمة. وإعلان الناتج ومعيار النجاح والتحقق من فهمهما يحوّل النشاط إلى ممارسة هادفة، ويُقدَّم على زيادة الوقت أو التعزيز.","n":["يعالج السلوك الظاهر ويغفل جذره: غموض الغاية.","زيادة الوقت لا تعالج غياب الناتج المعلن.","تغيير الأداة لا يوضح ما سيتعلمه الطلاب.","صحيح: يعالج غياب الهدف المعلن قبل أي إجراء آخر."],"c":"«ماذا نفعل بها؟» ثم انشغل عشوائيًا","p":"عالج غياب الهدف المعلن قبل زيادة الوقت أو التعزيز."},{"id":"13-10","s":13,"i":"13.2","l":"تطبيق","t":"ناتج التعلم في خطة درس: «أن يقارن الطالب بين عددين من ثلاث منازل باستخدام الرموز (>، <، =)». أي أدوات التقويم الآتية أكثر اتساقًا مع هذا الناتج؟","o":["بطاقات تعرض أزواج أعداد جديدة يضع الطالب بينها الرمز المناسب","أسئلة يكتب فيها الطالب فقرة كاملة يشرح فيها معنى القيمة المكانية","سؤال الطالب شفهيًا عن مدى استمتاعه بنشاط المقارنة في الدرس","عدّ أوراق العمل التي أكملها الطالب في الوحدة خلال الأسبوع"],"a":0,"w":"التقويم الجيد يقيس الناتج نفسه بأقل تلوث بمهارات جانبية. والمهمة التي تطلب وضع الرمز بين أعداد جديدة تقيس المقارنة مباشرة، بينما الكتابة المطولة تقيس عائقًا غير مقصود، وإكمال الأوراق يقيس إتمام النشاط لا التعلم.","n":["صحيح: يقيس أداء المقارنة نفسه مباشرة.","تقيس الكتابة والتعبير أكثر من مهارة المقارنة المستهدفة.","رأي الطالب في النشاط لا يدل على تحقق الناتج.","إكمال الأنشطة لا يساوي اكتساب المهارة."],"c":"أن يقارن بين عددين باستخدام الرموز","p":"اختر الأداة التي تقيس الناتج نفسه لا مهارة جانبية."},{"id":"13-11","s":13,"i":"13.2","l":"تحليل","t":"حصلت مها على درجة متدنية في تقويم وحدة «المغناطيس» الذي طُلب فيه شرح كل إجابة بفقرة مكتوبة، مع أنها شرحت المفاهيم نفسها شفهيًا بدقة لمعلمتها. والناتج المستهدف فهم خصائص المغناطيس. ما التفسير الأدق لهذه الدرجة؟","o":["تثبت أن مها لم تحقق ناتج فهم خصائص المغناطيس حتى الآن","تأثرت بعائق الكتابة غير المستهدف، فلا تعكس تحقق ناتج الفهم بصدق","صادقة لأن الكتابة المطولة جزء لا يتجزأ من أي تقويم في العلوم","تدل على ضعف عام في قدرتها يستلزم خفض نواتج الوحدة لها"],"a":1,"w":"التقويم يجب أن يتطابق مع الناتج المستهدف، وإلا أعطى صورة غير صادقة عن التعلم. وشرح مها الشفهي الدقيق يشير إلى تحقق الفهم، فانخفاض الدرجة يعود إلى عائق الكتابة؛ لذلك يُعاد تصميم طريقة الاستجابة لتقيس الفهم نفسه.","n":["تتجاهل الدليل الشفهي الدقيق على الفهم.","صحيح: القياس تلوث بعائق غير مقصود.","الكتابة ليست البناء المقاس في هذا الناتج.","قفز إلى خفض الناتج دون تحليل سبب الدرجة."],"c":"شرحت المفاهيم نفسها شفهيًا بدقة","p":"صعوبة الاستجابة لا تعني دائمًا ضعف المعرفة."},{"id":"13-12","s":13,"i":"13.2","l":"معرفة","t":"كتبت معلمة على السبورة في بداية النشاط: «سنعرف أننا نجحنا إذا حددنا أربع كلمات مفتاحية صحيحة من خمس». ماذا تمثّل هذه العبارة؟","o":["نية تعلم تصف ما نركز على تعلمه","معيار نجاح يوضح شكل الأداء المقبول","نشاط تعليمي يصف ما سيفعله الطلاب","هدف عام طويل المدى في الخطة الفردية"],"a":1,"w":"معيار النجاح هو المحك الذي يوضح للطالب والمعلم كيف يبدو الأداء المقبول، وصيغته الشائعة «سننجح إذا...». ويُستخدم في التغذية الراجعة والتقويم الذاتي طوال النشاط، ويختلف عن نية التعلم التي تصف ما نتعلمه.","n":["نية التعلم صيغتها «نحن نتعلم...» وتصف المهارة لا محك الحكم.","صحيح: صيغة «سننجح إذا...» تحدد محك الحكم.","العبارة لا تصف إجراءات النشاط بل مستوى النجاح.","العبارة محددة قصيرة المدى ومرتبطة بنشاط واحد."],"c":"«سنعرف أننا نجحنا إذا...»","p":"«نحن نتعلم...» نية تعلم، و«سننجح إذا...» معيار نجاح."},{"id":"13-13","s":13,"i":"13.2","l":"تطبيق","t":"حققت أروى 40% في مهمة «تحديد الفكرة الرئيسة» بعد درسين، فاقترحت زميلة تغيير الناتج إلى «قراءة الفقرة قراءة صحيحة». ما الموقف المهني الأنسب؟","o":["قبول المقترح لأن انخفاض الأداء دليل كافٍ على صعوبة الناتج عليها","الإبقاء على الناتج وتكرار الدرسين نفسيهما حتى تتحسن النتيجة","تحليل أخطائها ومتطلبات المهارة وجودة التدريس قبل تغيير الناتج","تأجيل الحكم إلى نهاية الفصل الدراسي وانتظار درجة الاختبار النهائي"],"a":2,"w":"عدم تحقق الناتج بعد درسين يستدعي فهم السبب لا خفض التوقع: هل الخلل في متطلب سابق، أم في طريقة التدريس، أم في أداة القياس، أم في مستوى الدعم؟ ومراجعة التقدم وتحليل الأخطاء يسبقان أي قرار بتغيير الناتج.","n":["عدم تحقق الناتج لا يعني مباشرة خفضه.","تكرار التدريس نفسه دون تحليل قد يكرر الإخفاق.","صحيح: البيانات تسبق خفض التوقع.","الانتظار يضيّع فرصة تعديل التدريس في وقته."],"c":"اقتراح تغيير الناتج بعد درسين","p":"مراجعة التقدم وتحليل الأخطاء يسبقان خفض التوقعات."},{"id":"13-14","s":13,"i":"13.2","l":"تحليل","t":"قارن مشرف بين ناتجين كتبهما معلمان لدرس واحد؛ الأول: «أن يدرك الطالب أهمية علامات الترقيم»، والثاني: «أن يضع الطالب النقطة وعلامة الاستفهام في مواضعهما الصحيحة في فقرة من خمس جمل». ما الحكم الأدق؟","o":["الثاني أدق لأنه يصف أداءً ظاهرًا محددًا يمكن الحكم على تحققه","الأول أدق لأنه يستهدف الفهم العميق لا مجرد الأداء الآلي للمهارة","كلاهما مقبول لأن الصياغة لا تؤثر في اختيار التدريس والتقويم","الثاني أضعف لأن تحديد عدد الجمل يقيّد المعلم عند التقويم"],"a":0,"w":"الناتج الجيد واضح ومحدد وقابل للملاحظة والقياس، ويتضمن المهارة وشرط الأداء عند الحاجة. والفعل «يدرك» غامض لا يكشف ما سيفعله الطالب، أما «يضع العلامة في موضعها في فقرة محددة» فأداء يمكن الحكم على تحققه.","n":["صحيح: فعل قابل للرصد مع شرط أداء واضح.","«يدرك» فعل غير قابل للرصد، والفهم يُستدل عليه بأداء ظاهر.","الصياغة الواضحة هي التي تحدد التدريس والتقويم المتسقين معها.","تحديد شرط الأداء يزيد دقة الحكم ولا يضعفه."],"c":"«يدرك أهمية» مقابل «يضع في مواضعهما»","p":"الفعل الغامض وحده لا يجعل الناتج قابلًا للقياس."},{"id":"13-15","s":13,"i":"13.3","l":"معرفة","t":"في أثناء حل مسألة توقفت رهف وسألت نفسها: «هل طريقتي توصلني إلى المطلوب؟ هل أحتاج إلى تغييرها؟». إلى أي مرحلة ميتامعرفية ينتمي هذا السلوك؟","o":["المراقبة والتنظيم في أثناء أداء المهمة","التخطيط الذي يسبق البدء في المهمة","التأمل والتقويم بعد انتهاء المهمة","إعادة تدريب العزو نحو أسباب قابلة للتحكم"],"a":0,"w":"الميتامعرفة ثلاث مراحل يميزها التوقيت: تخطيط قبل المهمة، ومراقبة وتنظيم في أثنائها، وتأمل وتقويم بعدها. وسؤال «هل طريقتي تعمل؟ هل أحتاج تغييرًا؟» في منتصف الحل مراقبة ذاتية قد تقود إلى تعديل الاستراتيجية.","n":["صحيح: التوقيت «أثناء» والسؤال عن فاعلية الطريقة.","التخطيط قبل التنفيذ: ما المطلوب؟ وما الاستراتيجية؟","التأمل بعد الأداء: ماذا نجح؟ وماذا أغيّر لاحقًا؟","العزو تفسير لسبب النتيجة، لا مراقبة للطريقة في أثناء العمل."],"c":"في أثناء الحل: هل طريقتي توصلني؟","p":"قبل المهمة أخطط، وأثناءها أراقب وأعدّل، وبعدها أتأمل وأقيّم."},{"id":"13-16","s":13,"i":"13.3","l":"تطبيق","t":"رمى تركي ورقة المسائل بعد خطأين متتاليين وقال: «عقلي لا يفهم الرياضيات مهما حاولت». ما الاستجابة الأنسب من معلمه؟","o":["ربط الخطأ بخطوة قابلة للتعديل ثم إتاحة نجاح قريب موثق","طمأنته بأنه ذكي جدًا وأن الرياضيات ستصبح سهلة عليه قريبًا","إعفاؤه من المسائل الصعبة مؤقتًا حتى تتحسن حالته المزاجية","تذكيره بأن زملاءه أنهوا المسائل نفسها دون صعوبة تُذكر"],"a":0,"w":"عبارة تركي تكشف عزوًا إلى سبب ثابت غير قابل للتحكم مع توقع الفشل، وهي بوابة العجز المتعلم. وإعادة تدريب العزو تربط النتيجة بأسباب قابلة للتحكم كالاستراتيجية والجهد الفعال، وتدعمها خبرة نجاح حقيقية لا عبارات تشجيع عامة.","n":["صحيح: يعيد بناء العزو بدليل نجاح حقيقي.","تفاؤل عام غير مرتبط بدليل، ويُبقي القدرة الثابتة محور التفسير.","يعزز الانسحاب ويغذي دائرة العجز المتعلم.","المقارنة بالأقران تعمّق الإحساس بالعجز."],"c":"«عقلي لا يفهم الرياضيات مهما حاولت»","p":"حوّل العزو من قدرة ثابتة إلى استراتيجية قابلة للتعديل، وادعمه بنجاح حقيقي."},{"id":"13-17","s":13,"i":"13.3","l":"تحليل","t":"سارة واثقة بنفسها في علاقاتها ومحبوبة بين زميلاتها، لكنها تتجنب أي مهمة كتابة قائلة: «لن أستطيع كتابة فقرة صحيحة». ما التفسير الأدق لحالتها؟","o":["انخفاض عام في تقدير الذات يظهر في جميع مجالات حياتها","انخفاض في كفاءتها الذاتية المرتبطة بمهمة الكتابة تحديدًا دون غيرها","عجز متعلم شامل يستلزم إحالتها فورًا إلى جهة نفسية متخصصة","ضعف دافعية ناتج عن قلة الجهد يُعالج بزيادة واجبات الكتابة"],"a":1,"w":"الكفاءة الذاتية اعتقاد الطالب بقدرته على إنجاز مهمة محددة، أما تقدير الذات فتقييم عام أوسع للذات. وثقة سارة في علاقاتها مع تجنبها الكتابة وحدها يشير إلى كفاءة ذاتية منخفضة في مجال بعينه، تُبنى بخبرات نجاح متدرجة وتغذية راجعة محددة.","n":["البيانات تنفي العموم؛ ثقتها في علاقاتها سليمة.","صحيح: الكفاءة الذاتية ترتبط بمهمة أو مجال محدد.","قفز إلى استنتاج شامل من سلوك مرتبط بمهمة واحدة.","زيادة الواجبات لا تعالج اعتقادها بعدم القدرة."],"c":"واثقة في علاقاتها وتتجنب الكتابة","p":"الكفاءة الذاتية خاصة بمهمة محددة، وتقدير الذات عام."},{"id":"13-18","s":13,"i":"13.3","l":"تطبيق","t":"يريد المعلم أن ينمذج لطلابه استراتيجية مراقبة الفهم في القراءة باستخدام التفكير بصوت مسموع (Think-Aloud). أي الأداءات الآتية يحقق ذلك؟","o":["يقرأ الفقرة بصوت واضح ومعبّر ثم يطلب من الطلاب تلخيصها شفهيًا","يقول وهو يقرأ: «لم تتضح لي هذه الجملة؛ سأعيد قراءتها»","يشرح تعريف استراتيجية مراقبة الفهم وخطواتها مكتوبة على السبورة","يطلب من كل طالب قراءة الفقرة بصوت مرتفع أمام زملائه بالتناوب"],"a":1,"w":"التفكير بصوت مسموع نمذجة لعملية التفكير الخفية: يحدد المعلم هدفه، ويلاحظ عدم الفهم، ويقرر إعادة القراءة أو البحث عن قرينة. وليس مجرد قراءة التعليمات أو النص بصوت مرتفع.","n":["قراءة جهرية جيدة لكنها لا تكشف عمليات التفكير.","صحيح: يكشف الشك والمراجعة والتعديل بصوت مسموع.","شرح الاستراتيجية ليس نمذجة لتطبيقها في أثناء التفكير.","قراءة الطلاب الجهرية ليست نمذجة من المعلم."],"c":"ينمذج مراقبة الفهم بالتفكير بصوت مسموع","p":"التفكير بصوت مسموع يكشف ما يدور في ذهن المعلم، لا ما في الكتاب."},{"id":"13-19","s":13,"i":"13.3","l":"تطبيق","t":"أصبحت لمى تكتشف أخطاءها الحسابية عند استخدام قائمة تحقق من أربعة بنود، لكنها تنسى المراجعة تمامًا حين تغيب القائمة. ما الخطوة التالية الأنسب؟","o":["إبقاء القائمة معها في جميع المواد بصورة دائمة لضمان استمرار الدقة","سحب القائمة فجأة لتتعوّد على المراجعة دون أي وسيلة خارجية","إضافة بنود جديدة إلى القائمة لتغطي أنواعًا أكثر من الأخطاء","تحويل البنود تدريجيًا إلى أسئلة ذاتية مختصرة تستدعيها بنفسها"],"a":3,"w":"قائمة التحقق أداة لنقل المراقبة من المعلم إلى الطالب، وهدفها النهائي أن تتحول الخطوات إلى توجيه ذاتي داخلي. ونجاح لمى معها وإخفاقها دونها يعني أن الخطوة التالية تلاشٍ تدريجي مع مطالبتها باستدعاء البنود بنفسها ورصد استقلالها.","n":["يحوّل السقالة المؤقتة إلى اعتماد دائم.","السحب المفاجئ قد يُسقط الأداء؛ المطلوب تلاشٍ متدرج.","يزيد الحمل والاعتماد بدل الاستقلال.","صحيح: ينقل الضبط تدريجيًا إلى الطالبة."],"c":"تنسى المراجعة حين تغيب القائمة","p":"قائمة التحقق سقالة تُخفف تدريجيًا، لا عكاز دائم."},{"id":"13-20","s":13,"i":"13.3","l":"معرفة","t":"أي عبارات التغذية الراجعة الآتية أكثر دعمًا للكفاءة الذاتية لدى طالب ذي صعوبات تعلم؟","o":["«أنت أذكى طالب في المجموعة، ولن تخطئ في مثل هذه المسائل»","«أحسنت، إجابتك صحيحة، انتقل الآن إلى المسألة التالية مباشرة»","«تقسيمك المسألة إلى خطوات ومراجعتك كل خطوة أوصلك إلى الحل»","«لقد نجحت هذه المرة لأن المسألة كانت سهلة نسبيًا»"],"a":2,"w":"المدح الفعال محدد وصادق وموجه للعملية: يذكر الاستراتيجية والجهد الفعال اللذين أنتجا النجاح، فيدرك الطالب أن التحسن تحت سيطرته. أما مدح الذكاء أو عزو النجاح إلى سهولة المهمة فلا يبني كفاءة ذاتية مستقرة.","n":["مدح لصفة ثابتة قد يولّد خوفًا من الفشل.","عامة لا تحدد ما الذي صنع النجاح.","صحيح: تربط النجاح باستراتيجية قابلة للتكرار.","تعزو النجاح إلى عامل خارجي غير قابل للتحكم."],"c":"أكثر دعمًا للكفاءة الذاتية","p":"امدح الاستراتيجية والجهد المحددين، لا الذكاء ولا الحظ."},{"id":"13-21","s":13,"i":"13.3","l":"تحليل","t":"يستطيع بدر أن يسرد خطوات استراتيجية التلخيص بدقة، لكنه في دروس العلوم لا يلجأ إليها عند النصوص الطويلة، ولا يلاحظ أنه لم يفهم ما قرأ إلا حين يسأله المعلم. ما الذي ينقصه تحديدًا؟","o":["المعرفة الشرطية بمتى يستخدم الاستراتيجية ولماذا، ومراقبة فهمه","المعرفة الإجرائية بخطوات التلخيص التي لم يتقنها بالقدر الكافي بعد","الدافعية للتعلم، ويعالجها نظام تعزيز مرتبط بإكمال دروس العلوم","القدرة القرائية الأساسية، ويعالجها تدريب مكثف على الطلاقة"],"a":0,"w":"الميتامعرفة ليست مجرد معرفة الاستراتيجية؛ بل تشمل معرفة متى ولماذا تُستخدم، ومراقبة الفهم واتخاذ قرار عند تعثره. وبدر يملك المعرفة الإجرائية، لكن غياب استخدامه الذاتي واعتماده على المعلم في اكتشاف عدم الفهم يكشفان نقصًا في المعرفة الشرطية والمراقبة.","n":["صحيح: يعرف «كيف» ويجهل «متى ولماذا» ولا يراقب فهمه.","هو يسرد الخطوات بدقة؛ المعرفة الإجرائية متوافرة.","لا قرينة على ضعف الدافعية، والتعزيز لا يعلّم متى تُستخدم الاستراتيجية.","لا بيانات عن ضعف قرائي أساسي؛ المشكلة في إدارة الفهم."],"c":"يسرد الخطوات لكنه لا يلجأ إليها","p":"معرفة الاستراتيجية لا تكفي دون معرفة متى ولماذا تُستخدم."},{"id":"13-22","s":13,"i":"13.4","l":"تطبيق","t":"تقيس لين أطوال الأشكال بالمسطرة بدقة في أوراق العمل، لكنها في نشاط تجهيز لوحة للفصل لم تستطع قص شريط بطول محدد دون مساعدة. ما الإجراء الأنسب؟","o":["زيادة أوراق العمل في القياس حتى تصل إلى مستوى الإتقان الكامل","إعادة تعليم مهارة القياس من البداية بمسطرة ملونة مكبرة الأرقام","إعفاؤها من مهام القياس العملية لأنها خارج أهداف خطتها الحالية","تدريبها على القياس في مهام عملية متنوعة مع خفض الدعم ورصد انتقال المهارة"],"a":3,"w":"نجاح لين في ورقة العمل وتعثرها في موقف حقيقي قرينة على مشكلة تعميم، لا على غياب المهارة. والتعميم لا يحدث تلقائيًا دائمًا؛ بل يحتاج تخطيطًا عبر مهام ومواد وسياقات متنوعة مع خفض الدعم ورصد انتقال المهارة.","n":["هي متقنة على الورق؛ المشكلة في الانتقال لا في الاكتساب.","إعادة التعليم من الصفر تتجاهل إتقانها في التدريب.","يتجاهل الأثر الوظيفي للمهارة في حياتها اليومية.","صحيح: برمجة التعميم في سياقات حقيقية."],"c":"تقيس بدقة في الأوراق وتتعثر في النشاط","p":"ينجح في التدريب ويتعثر خارجه: خطّط للتعميم ولا تُعِد التعليم من الصفر."},{"id":"13-23","s":13,"i":"13.4","l":"معرفة","t":"ما المقصود بالتعميم في سياق ربط مهارات الطلاب ذوي صعوبات التعلم بحياتهم اليومية؟","o":["تكرار المهارة بدقة عالية في الموقف التدريبي نفسه عدة مرات","حفظ خطوات المهارة واسترجاعها لفظيًا عند سؤال المعلم عنها","استخدام المهارة المتعلمة مع أشخاص ومواد ومواقف وبيئات جديدة","تطبيق المعلم الأنشطة نفسها على جميع طلاب المجموعة بلا تمييز"],"a":2,"w":"التعميم قدرة الطالب على استخدام المهارة المتعلمة مع أشخاص أو مواد أو مواقف أو بيئات جديدة، وهو مؤشر مهم على فاعلية التدخل. أما النجاح المتكرر في موقف التدريب نفسه أو حفظ الخطوات فلا يدلان على انتقال المهارة.","n":["الإتقان داخل موقف واحد لا يثبت التعميم.","المعرفة اللفظية بالخطوات ليست استخدامًا وظيفيًا.","صحيح: انتقال المهارة خارج شروط التدريب.","توحيد الأنشطة لا علاقة له بتعميم المهارة لدى الطالب."],"c":"المقصود بالتعميم","p":"التعميم أن تنتقل المهارة مع الطالب إلى أماكن وأشخاص ومواد جديدة."},{"id":"13-24","s":13,"i":"13.4","l":"تطبيق","t":"بدأ ماجد يرتب حقيبته وفق جدول الحصص باستقلال بعد تدريب بالتلميحات الشفهية، فأوقف المعلم التلميحات كلها في يوم واحد، فعاد ماجد إلى نسيان كتبه. ما الإجراء الأنسب؟","o":["العودة إلى أقل تلميح لازم ثم خفضه تدريجيًا وفق أدائه","إعادة التلميحات الشفهية الكاملة بصورة دائمة حتى نهاية العام","الحكم بأن المهارة لم تُكتسب أصلًا وإعادة تعليمها من البداية","تحميل الأسرة مسؤولية ترتيب الحقيبة يوميًا بدلًا منه"],"a":0,"w":"انهيار الأداء بعد سحب التلميحات دفعة واحدة قرينة على أن السحب كان أسرع من اللازم، لا على غياب المهارة. والاستقلال لا يعني إلغاء الدعم فجأة؛ بل الرجوع إلى أقل تلميح فعال ثم خفضه تدريجيًا وفق البيانات.","n":["صحيح: تلاشٍ متدرج لا سحب مفاجئ.","يكرّس الاعتماد ولا يبني الاستقلال.","أداؤه المستقل السابق يثبت الاكتساب؛ الخلل في سرعة السحب.","ينقل المهمة إلى غيره بدل نقل الضبط إليه."],"c":"أوقف التلميحات كلها في يوم واحد","p":"خفّض الدعم تدريجيًا؛ السحب المفاجئ يُسقط الأداء."},{"id":"13-25","s":13,"i":"13.4","l":"تحليل","t":"تشير بيانات مهارة «طلب المساعدة بطريقة مناسبة» لدى عبدالرحمن إلى: 90% مع معلم غرفة المصادر، و20% مع معلم الرياضيات في الفصل، و10% مع المرشد الطلابي. ما التفسير الأدق والإجراء المترتب عليه؟","o":["المهارة غير مكتسبة أصلًا؛ فيُعاد تعليمها كاملة داخل غرفة المصادر","المعلمون الآخرون لا يطبقون الخطة؛ فيُكتفى بغرفة المصادر بيئةً للمهارة","الطالب يرفض التعامل مع غير معلمه؛ فيُحال إلى تقييم سلوكي متخصص","المهارة مرتبطة بشخص واحد؛ فيُبرمج تعميمها عبر أشخاص متعددين"],"a":3,"w":"الفرق الكبير بين أدائه مع معلم المصادر ومع غيره يدل على أن المهارة مكتسبة لكنها مرتبطة بشخص التدريب. والتدخل الأدق تنويع الأشخاص مع ثبات عناصر المهارة الأساسية وخفض التلميحات، بالتنسيق مع معلم الفصل والمرشد.","n":["أداؤه 90% مع معلمه ينفي غياب الاكتساب.","الاكتفاء ببيئة واحدة يناقض هدف الاستقلال الوظيفي.","قفز إلى تفسير سلوكي قبل تجربة برمجة التعميم.","صحيح: النمط يكشف ضعف التعميم عبر الأشخاص."],"c":"90% مع معلم المصادر و20% مع غيره","p":"النجاح مع شخص واحد لا يثبت التعميم؛ نوّع الأشخاص."},{"id":"13-26","s":13,"i":"13.4","l":"تطبيق","t":"يحتاج هتان إلى تعلم الإبلاغ عن حالة طارئة بالاتصال الهاتفي وذكر عنوان منزله بوضوح. ما أسلوب التدريب الأنسب؟","o":["انتظار حدوث موقف طارئ حقيقي لتدريبه عليه في سياقه الطبيعي","الاكتفاء بشرح خطوات الاتصال شفهيًا ومطالبته بحفظها وترديدها","محاكاة منظمة للموقف تتدرج نحو الأداء المستقل مع إشراك الأسرة","تأجيل المهارة لأنها ليست من المهارات الأكاديمية في خطته"],"a":2,"w":"المحاكاة مفيدة عندما يكون الموقف الطبيعي غير متاح أو يتطلب سلامة واستعدادًا، فتُستخدم جسرًا نحو الأداء الحقيقي لا بديلًا دائمًا عنه. وإشراك الأسرة يدعم تعميم المهارة في المنزل حيث قد يحتاجها هتان فعلًا.","n":["الموقف الطبيعي هنا غير متاح وغير آمن للتدريب.","حفظ الخطوات لفظيًا لا يضمن الأداء الفعلي.","صحيح: المحاكاة جسر آمن حين يتعذر الموقف الحقيقي.","الحاجة الوظيفية الثابتة لا تُهمل لأنها غير أكاديمية."],"c":"الإبلاغ عن حالة طارئة","p":"الموقف الطبيعي أقوى متى كان آمنًا ومتاحًا، وإلا فالمحاكاة جسر إليه."},{"id":"13-27","s":13,"i":"13.4","l":"معرفة","t":"أي العبارات الآتية أدق في وصف آثار صعوبات التعلم في الحياة اليومية؟","o":["يعاني جميع الطلاب ذوي صعوبات التعلم مشكلات في الاستقلال والتنظيم","تختلف الآثار فرديًا، وتُضاف الأهداف الوظيفية متى ثبتت الحاجة بالتقييم","ضعف السلوك التكيفي معيار تشخيصي أساسي لصعوبات التعلم كالإعاقة الفكرية","الفوضى والنسيان المتكرر دليلان كافيان على وجود صعوبات تعلم لدى الطالب"],"a":1,"w":"قد تمتد آثار صعوبات التعلم إلى الحياة اليومية بحسب طبيعة الصعوبة وشدتها والخصائص الفردية ومتطلبات البيئة، لكنها لا تتجانس بين جميع الطلاب. لذلك يُحدد التدخل بناءً على الأثر الفعلي لدى الطالب لا على التشخيص وحده.","n":["تعميم خاطئ؛ التأثيرات تختلف فرديًا.","صحيح: الأثر فردي، والهدف يتبع الحاجة الثابتة.","ليس معيارًا تشخيصيًا أساسيًا لصعوبات التعلم.","لا يُعدّان وحدهما دليلًا تشخيصيًا؛ تُجمع البيانات وتُفحص التفسيرات البديلة."],"c":"أدق وصف لآثار الصعوبات اليومية","p":"الأثر الوظيفي فردي؛ لا تفترض التجانس بين الطلاب."},{"id":"13-28","s":13,"i":"13.4","l":"تحليل","t":"الهدف في خطة فهد إتقان جمع الأعداد ذات المنزلتين يدويًا، ويطلب والده السماح له باستخدام الآلة الحاسبة في اختبار الوحدة بحجة أنها «مهارة حياتية». ما الرد المهني الأدق؟","o":["يُسمح بها لأن كل أداة تدعم الاستقلال تُعد تكييفًا مقبولًا في أي تقويم","يُمنع منها في حياته اليومية كلها حتى يتقن الجمع اليدوي تمامًا","لا يُسمح بها في هذا الاختبار لأنها ستؤدي المهارة المقاسة عنه","يُسمح بها بشرط أن يكتب الخطوات بجانب كل ناتج يظهر على الشاشة"],"a":2,"w":"عندما تكون العملية نفسها هي البناء المقاس فإن الأداة تغيّر ما يُقاس؛ فالآلة ستجمع بدلًا من فهد. أما في مواقف التسوق التي يكون هدفها اتخاذ قرار عن المبلغ لا الحساب اليدوي، فقد تكون الآلة دعمًا وظيفيًا للاستقلال.","n":["صلاحية الأداة تعتمد على البناء المقاس في كل موقف.","منع مطلق لا مبرر له في المواقف التي لا تقيس الجمع.","صحيح: يحفظ صدق القياس دون منع الأداة في مواقف أخرى.","كتابة الخطوات لا تعيد قياس الجمع الذي أدّته الآلة."],"c":"الهدف إتقان الجمع يدويًا","p":"التقنية تدعم الاستقلال ما لم تستبدل المهارة المقاسة."},{"id":"13-29","s":13,"i":"13.5","l":"تحليل","t":"يرى نواف أن 0.25 أكبر من 0.5، وأن 0.125 أكبر من 0.3، وتكرر هذا النمط في معظم مسائل المقارنة رغم إعادة الشرح. ما التفسير الأدق لأخطائه؟","o":["سهو عابر ناتج عن التسرع في قراءة الأعداد العشرية وكتابتها","ضعف في الذاكرة العاملة يمنعه من مقارنة عددين معًا","نقص في كمية التدريب يُعالج بمضاعفة مسائل المقارنة","تصور خاطئ منظّم يعامل الجزء العشري معاملة العدد الصحيح"],"a":3,"w":"الخطأ المنتظم الذي يتكرر بالنمط نفسه رغم إعادة الشرح قرينة على مفهوم خاطئ، أي قاعدة داخلية تبدو منطقية للطالب مثل «الرقم الأطول أكبر». وهذا يحتاج تشخيصًا وتغييرًا مفاهيميًا، لا تكرار الشرح بالطريقة نفسها.","n":["السهو العابر لا يتكرر بنمط ثابت رغم إعادة الشرح.","لا قرينة على فقد معلومات؛ الأخطاء تتبع قاعدة واحدة.","زيادة التدريب على تصور خاطئ قد ترسخه.","صحيح: خطأ منتظم يكشف قاعدة داخلية غير صحيحة."],"c":"تكرر النمط رغم إعادة الشرح","p":"خطأ منتظم رغم إعادة الشرح: ابحث عن مفهوم خاطئ."},{"id":"13-30","s":13,"i":"13.5","l":"تطبيق","t":"بعد أن تأكدت المعلمة أن دانة تعتقد أن «الضرب يُكبّر الناتج دائمًا»، ما الإجراء الأنسب لتغيير هذا التصور؟","o":["إخبارها بالقاعدة الصحيحة مباشرة ومطالبتها بحفظها وترديدها","تجنب أمثلة الضرب في الكسور حتى لا يتعزز التصور الخاطئ لديها","عرض حالة ضرب في كسر تخالف توقعها ثم بناء تفسير صحيح معها","زيادة تمارين الضرب في الأعداد الصحيحة لتثبيت المفهوم الأساسي"],"a":2,"w":"المفهوم الخاطئ المتجذر لا يتغير بمجرد قول الإجابة الصحيحة. والتغيير المفاهيمي يبدأ بإظهار حالة تكشف قصور التصور القديم (التخلخل المعرفي)، ثم بناء تفسير صحيح قابل للتطبيق والتحقق من تعميمه.","n":["الإجابة الجاهزة لا تغيّر البنية المفاهيمية الخاطئة.","تجنب الحالات المتعارضة يُبقي التصور دون علاج.","صحيح: تخلخل معرفي ثم بناء للمفهوم الصحيح.","تلك التمارين تؤكد التصور الخاطئ بدل كشفه."],"c":"تعتقد أن «الضرب يُكبّر الناتج دائمًا»","p":"اكشف قصور التصور ثم ابنِ البديل، ولا تكتفِ بإعطاء القاعدة."},{"id":"13-31","s":13,"i":"13.5","l":"معرفة","t":"أي العبارات الآتية تصف الممارسة القائمة على الأدلة (Evidence-Based Practice) بدقة؟","o":["أحدث استراتيجية منشورة تُطبَّق حرفيًا على جميع الطلاب لضمان الأمانة","طريقة تستخدم مصطلحات علم الأعصاب وتوصف بأنها مبنية على الدماغ","تدخل تدعمه بحوث رصينة ويلائم حاجة الطالب وتُتابَع فاعليته","استراتيجية نجحت مع طالب سابق فتُعمَّم على كل من يشبهه في حالته"],"a":2,"w":"الممارسة القائمة على الأدلة تجمع ثلاثة عناصر: دليلًا بحثيًا مناسبًا، وملاءمة لحاجة الطالب وسياقه، ومتابعة أثرها ببيانات الطالب وتعديلها عند الحاجة. فالدليل لا يعمل منفصلًا عن الطالب.","n":["الحداثة لا تكفي، والتطبيق الآلي يتجاهل ملاءمة الطالب والسياق.","اللغة العصبية وحدها ليست دليلًا على الفاعلية.","صحيح: دليل بحثي وملاءمة وقياس أثر.","خبرة فردية سابقة ليست دليلًا بحثيًا ولا تغني عن بيانات الطالب."],"c":"الممارسة القائمة على الأدلة","p":"الممارسة الأقوى: دليل مناسب، وحاجة محددة، ومتابعة أثر."},{"id":"13-32","s":13,"i":"13.5","l":"تحليل","t":"نمذج المعلم استراتيجية جديدة لحل المسائل اللفظية مرة واحدة، ثم طلب من الطلاب حل عشر مسائل بمفردهم مباشرة، فأخفق معظمهم. ما الخلل في تطبيق التدريس الصريح؟","o":["تجاوز الممارسة الموجهة ذات التغذية الراجعة الفورية قبل الاستقلال","البدء بالنمذجة، والأصح أن يكتشف الطلاب الاستراتيجية بأنفسهم أولًا","قلة عدد المسائل المستقلة، والأصح مضاعفتها حتى يتحسن أداؤهم","عدم اللجوء إلى التعلم التعاوني بديلًا عن النمذجة في هذه المرحلة"],"a":0,"w":"التدريس الصريح ينقل المسؤولية تدريجيًا: نمذجة من المعلم، ثم ممارسة موجهة بتغذية راجعة فورية، ثم ممارسة مستقلة. والقفز من نمذجة واحدة إلى العمل المستقل يُسقط المرحلة التي يُبنى فيها الأداء الصحيح ويُصحح الخطأ مبكرًا.","n":["صحيح: سقطت المرحلة الوسيطة من نقل المسؤولية التدريجي.","النمذجة بداية صحيحة في التدريس الصريح لمهارة جديدة.","زيادة الممارسة المستقلة قبل الإتقان تكرر الإخفاق.","التعلم التعاوني لا يستبدل التدريس الصريح لمهارة جديدة."],"c":"نمذج مرة ثم طلب الحل بمفردهم","p":"التدريس الصريح: نمذجة، ثم ممارسة موجهة، ثم ممارسة مستقلة."},{"id":"13-33","s":13,"i":"13.5","l":"تطبيق","t":"طُبّق مع هند تدخل في الطلاقة القرائية بدقة تنفيذ عالية مدة ثمانية أسابيع، وأظهرت القياسات الأسبوعية ميل تحسن أقل كثيرًا من المطلوب لبلوغ الهدف. ما القرار الأنسب في إطار الاستجابة للتدخل (RTI)؟","o":["الاستمرار في التدخل نفسه دون أي تغيير حتى نهاية العام الدراسي","إيقاف التدخل والحكم بأن هند لا تستفيد من أي دعم في القراءة","زيادة شدة التدخل أو تعديل مكوناته منهجيًا مع مواصلة القياس المتكرر للتقدم","الاعتماد على اختبار تشخيصي واحد لتحديد مسارها بدل القياسات المتكررة"],"a":2,"w":"الاستجابة للتدخل إطار يربط شدة الدعم بقياس الأداء المتكرر. وبما أن التنفيذ دقيق والبيانات المتكررة تُظهر استجابة غير كافية، فالقرار المنطقي تعديل شدة التدخل أو جرعته أو مكوناته منهجيًا ومتابعة الأثر.","n":["تجاهل لبيانات تُظهر استجابة غير كافية.","حكم مطلق يتجاوز خيار تعديل الشدة والمكونات.","صحيح: قرار الشدة مبني على مسار البيانات.","الاستجابة للتدخل تقوم على قياس متكرر لا على اختبار منفرد."],"c":"تنفيذ دقيق مع ميل أقل من المطلوب","p":"استجابة ضعيفة مع تنفيذ جيد: عدّل الشدة أو المكونات بالبيانات."},{"id":"13-34","s":13,"i":"13.5","l":"تطبيق","t":"عرضت جهة تجارية على المدرسة برنامجًا لعلاج صعوبات القراءة يوصف بأنه «قائم على أحدث أبحاث الدماغ». ما المعيار الأهم للحكم على صلاحية تبنيه؟","o":["حداثة البرنامج وكثرة المصطلحات العصبية الواردة في وصفه وتسويقه","دليل بحثي تربوي على فاعليته في القراءة مع إمكانية قياس أثره","انتشار البرنامج في مدارس عديدة وإعجاب المعلمين بأنشطته المتنوعة","توافق أنشطته مع أنماط التعلم البصرية والسمعية الثابتة لدى الطلاب"],"a":1,"w":"عبارة «مبني على الدماغ» لا تكفي لإثبات الفاعلية؛ فالقرار التربوي يحتاج دليلًا بحثيًا تربويًا صالحًا ونتائج قابلة للقياس. ثم يُطبَّق البرنامج مع متابعة أثره ببيانات الطلاب.","n":["اللغة العلمية الحديثة لا تثبت فاعلية التدخل.","صحيح: الفاعلية المثبتة والقابلة للقياس هي الحكم.","الشيوع والانطباع ليسا دليلًا بحثيًا.","أنماط التعلم الثابتة ليست أساسًا علميًا لاختيار التدخل."],"c":"«قائم على أحدث أبحاث الدماغ»","p":"لا تختر تدخلًا لأنه يبدو علميًا؛ اختره لأن دليله وأثره قابلان للقياس."},{"id":"13-35","s":13,"i":"13.5","l":"تطبيق","t":"تحفظ شهد قاعدة «القسمة على كسر تساوي الضرب في مقلوبه» وتطبقها بدقة في التمارين الرمزية، لكنها لا تفسر سبب القاعدة، وتعجز عن حل مسألة لفظية جديدة تتطلبها. ما الإجراء الأنسب؟","o":["مضاعفة تمارين القسمة الرمزية حتى تصبح القاعدة آلية تمامًا لديها","تدريبها على قراءة المسائل اللفظية بطلاقة قبل العودة إلى الكسور","بناء معنى القاعدة بتمثيلات وعلاقات ثم تطبيقها في مسائل جديدة","مطالبتها بحفظ القاعدة بصيغ متعددة وترديدها قبل كل تمرين"],"a":2,"w":"صحة الناتج في التمارين المألوفة لا تثبت المعالجة العميقة؛ فالعجز عن التفسير والنقل إلى موقف جديد قرينة على حفظ سطحي. والمعالجة العميقة تربط القاعدة بالمعنى والعلاقات وتختبرها في أمثلة متنوعة.","n":["هي تتقن الإجراء؛ زيادة التكرار تعمّق الحفظ السطحي.","لا قرينة على ضعف قرائي؛ الخلل في فهم القاعدة.","صحيح: ينقلها من المعالجة السطحية إلى العميقة.","حفظ إضافي لا يبني المعنى ولا يدعم النقل."],"c":"تطبق القاعدة ولا تفسرها ولا تنقلها","p":"التفسير والنقل إلى مثال جديد يكشفان الفهم العميق."},{"id":"13-36","s":13,"i":"13.6","l":"معرفة","t":"أي المهام الآتية «لا» تقيس الوعي الصوتي؟","o":["أن يدمج الطالب الأصوات /ب/ /ا/ /ب/ لينطق كلمة «باب»","أن يميّز الطالب بين حرفين متشابهين شكلًا في كلمات مكتوبة","أن يحذف الطالب الصوت الأول من كلمة منطوقة ويقول ما تبقى منها","أن يعدّ الطالب مقاطع كلمة يسمعها بالتصفيق لكل مقطع"],"a":1,"w":"الوعي الصوتي القدرة على إدراك أصوات اللغة المنطوقة ومقاطعها وفونيماتها والتعامل معها دون الاعتماد على الحروف المكتوبة، ولذلك يُقاس شفهيًا. أما التمييز بين حرفين متشابهين شكلًا فمهمة إدراك بصري لرموز مكتوبة.","n":["دمج صوتي شفهي؛ من صميم الوعي الصوتي.","صحيح: مهمة بصرية مكتوبة لا تتعامل مع أصوات اللغة المنطوقة.","حذف صوتي شفهي؛ يقيس الوعي الصوتي.","تقطيع مقطعي سمعي؛ من مهارات الوعي الصوتي."],"c":"«لا» تقيس الوعي الصوتي","p":"الوعي الصوتي صوتي شفهي، والإدراك البصري يتعلق بالرموز والاتجاهات."},{"id":"13-37","s":13,"i":"13.6","l":"تطبيق","t":"يحل بندر حقائق الجمع شفهيًا بدقة، لكن نواتجه في الجمع العمودي تخطئ لأنه يكتب الآحاد تحت العشرات في معظم المسائل. ما الإجراء الأنسب؟","o":["إعادة تدريس حقائق الجمع وتكثيف حفظها حتى يتقنها آليًا وسريعًا","إحالته مباشرة لتشخيص اضطراب بصري بناءً على هذا الخطأ وحده","تنظيم الأعمدة داخل مسائل الجمع بورق المربعات وعلامات بصرية","تدريبه على ألغاز بصرية منفصلة عن الرياضيات لتقوية إدراكه"],"a":2,"w":"إتقان الحقائق شفهيًا مع خطأ منتظم في موضع الأرقام يشير إلى أن الخلل في التنظيم البصري المكاني لا في مفهوم الجمع. والتدخل الأقوى يربط الدعم المكاني بالمهمة الأكاديمية نفسها، كورق المربعات وعلامات الأعمدة، مع خفضه تدريجيًا.","n":["الحقائق متقنة؛ الخلل في التنظيم المكاني.","قفز من عرض واحد إلى تشخيص.","صحيح: دعم مكاني وظيفي داخل المهمة الأكاديمية.","تدريب منفصل قد لا ينتقل أثره إلى الحساب."],"c":"يتقن الحقائق ويكتب الآحاد تحت العشرات","p":"اربط دعم العملية المعرفية بالمهمة الأكاديمية نفسها."},{"id":"13-38","s":13,"i":"13.6","l":"تحليل","t":"تسترجع غادة حقائق الضرب ببطء وتشتقها بالعد، لكنها لا تفقد أي خطوة في المسائل متعددة الخطوات حين يُعطى لها جدول الحقائق مكتوبًا أمامها. ما التفسير الأدق؟","o":["صعوبة في استرجاع الحقائق المخزنة لا في الاحتفاظ بالخطوات","ضعف في الذاكرة العاملة يجعلها تفقد الخطوات الوسيطة في أثناء الحل","ضعف في الانتباه الانتقائي يجعلها تتشتت بالمثيرات الجانبية","صعوبة في الإدراك البصري المكاني تظهر في تنظيم الأرقام"],"a":0,"w":"الذاكرة العاملة تحتفظ بالمعلومات وتعالجها مؤقتًا في أثناء المهمة، والذاكرة طويلة المدى تخزن المعرفة ليُسترجع منها. ونجاح غادة في الخطوات حين تُتاح الحقائق مكتوبة يدل على أن التعثر في استرجاع المعرفة المخزنة، فلا يُسمّى كل نسيان «ذاكرة عاملة».","n":["صحيح: يميز الذاكرة طويلة المدى من الذاكرة العاملة.","البيانات تنفي ذلك؛ لا تفقد أي خطوة مع الجدول.","لا قرينة على تشتت بالمثيرات في الموقف.","لا أخطاء في التنظيم المكاني في وصف الحالة."],"c":"تسترجع ببطء ولا تفقد أي خطوة","p":"ضعف الذاكرة العاملة لا يعني ضعف الذاكرة طويلة المدى، والعكس صحيح."},{"id":"13-39","s":13,"i":"13.6","l":"تطبيق","t":"تقول المعلمة للطالبات: «افتحن الكتاب، وحللن التمرين الثالث، واكتبن الناتج في الدفتر، ثم سلّمنه على الطاولة»، فتنفذ ليان الخطوة الأخيرة فقط، مع أنها تؤدي كل خطوة بمفردها بنجاح. ما الإجراء الأنسب؟","o":["إعادة التعليمات الأربع كاملة بصوت أعلى وبإيقاع أبطأ من المعتاد","تنبيهها إلى ضرورة الإصغاء الجيد وتعزيزها عند التنفيذ الكامل","إعفاؤها من التعليمات المركبة والاكتفاء بخطوة واحدة في كل المهام","تقديم التعليمات على دفعات قصيرة مع بطاقة خطوات مرئية مؤقتة"],"a":3,"w":"فقدان بداية السلسلة مع إتقان كل خطوة منفردة يشير إلى متطلبات الذاكرة العاملة لا إلى ضعف الفهم. وتجزئة التعليمات ودعمها بصريًا يقللان الاحتفاظ اللفظي المؤقت، ثم يُخفض الدعم تدريجيًا مع تحسن الاستقلال.","n":["يُبقي الحمل نفسه على الذاكرة العاملة.","يفترض ضعف انتباه أو دافعية دون قرينة.","إعفاء دائم يخفض المتطلب ولا يبني الاستقلال.","صحيح: يخفف متطلبات الذاكرة العاملة داخل المهمة."],"c":"تنفذ الأخيرة فقط وتتقن كل خطوة منفردة","p":"ينسى بداية التعليمات قبل نهايتها: فكّر في الذاكرة العاملة وجزّئ وادعم بصريًا."},{"id":"13-40","s":13,"i":"13.6","l":"معرفة","t":"يتابع يزيد شرح المعلم جيدًا في غرفة هادئة، لكنه يفقد التركيز كلما تحدث زملاؤه أو مرّ أحد بجوار الباب. بأي عملية يتصل هذا النمط أكثر؟","o":["الانتباه المستمر الذي يتيح مواصلة التركيز مدة طويلة دون انقطاع","الانتباه الانتقائي الذي يتيح تجاهل المثيرات غير ذات الصلة","الذاكرة العاملة التي تتيح الاحتفاظ بالمعلومة ومعالجتها","الوعي الصوتي الذي يتيح تحليل أصوات الكلمات المنطوقة"],"a":1,"w":"الانتباه الانتقائي هو القدرة على التركيز على المثير ذي الصلة مع تجاهل المشتتات المحيطة، ويختلف عن الانتباه المستمر المرتبط بمواصلة التركيز مدة طويلة. ونجاح يزيد في البيئة الهادئة وتعثره مع الأصوات والحركة يحددان العملية.","n":["التعثر يرتبط بالمشتتات لا بطول المهمة.","صحيح: التعثر مرتبط بوجود المشتتات لا بطول المدة.","لا قرينة على فقد معلومات محتفظ بها.","لا علاقة للنمط بتحليل أصوات اللغة."],"c":"ينجح في الهدوء ويتعثر مع المشتتات","p":"يتشتت بالمثيرات الجانبية: انتباه انتقائي؛ لا يثبت مدة طويلة: انتباه مستمر."},{"id":"13-41","s":13,"i":"13.6","l":"تحليل","t":"حصل ياسر على درجة منخفضة في اختبار للذاكرة السمعية، فكتب أحد أعضاء الفريق في التقرير: «سبب صعوبته في القراءة ضعف الذاكرة السمعية». ما التقويم الأدق لهذه العبارة؟","o":["دقيقة، لأن الاختبار المقنن يحدد سبب الصعوبة بصورة كافية وحده","دقيقة، لأن ضعف الذاكرة السمعية هو السبب الأول لصعوبات القراءة دائمًا","غير دقيقة، لأن الذاكرة لا علاقة لها بتعلم القراءة على الإطلاق","غير دقيقة، لأنها تجعل نتيجة واحدة سببًا مؤكدًا بدل فرضية تُختبر"],"a":3,"w":"لا يجوز تشخيص سبب نمائي أو معرفي من خطأ واحد أو اختبار واحد؛ فالأداء نتاج تفاعل عمليات ومتطلبات وتعليم. والصياغة المهنية الحذرة: «قد تسهم الذاكرة السمعية في التعثر، وسنختبر الفرضية ببيانات ومهمات إضافية».","n":["الدرجة تصف الأداء ولا تفسر السبب وحدها.","تعميم مطلق لا تدعمه البيانات.","تنفي علاقة قائمة؛ الذاكرة قد تسهم في التعثر.","صحيح: الاختبار الواحد مصدر بيانات لا برهان سببي."],"c":"درجة منخفضة في اختبار واحد","p":"الخطأ أو الاختبار الواحد يبدأ منه التحليل ولا ينتهي عنده."},{"id":"13-42","s":13,"i":"13.6","l":"تطبيق","t":"لاحظت المعلمة أن رغد تتشتت كثيرًا في حصص القراءة الطويلة، فاقترحت على الفريق اعتبارها حالة «اضطراب فرط الحركة وتشتت الانتباه». ما الموقف المهني الأدق؟","o":["اعتماد الاقتراح لأن التشتت الصفي المتكرر علامة كافية على الاضطراب","تجاهل الملاحظة لأن الانتباه لا يرتبط بالتعثر الأكاديمي في القراءة","إعفاؤها من القراءة الطويلة إلى أن يصدر تشخيص طبي رسمي لحالتها","دراسة نمط انتباهها عبر مواقف ومهام متعددة قبل أي استنتاج"],"a":3,"w":"ضعف الانتباه في الصف عرض قد ينتج عن صعوبة المهمة أو المشتتات أو عوامل أخرى، ولا يكفي وحده لتشخيص اضطراب. والأصح جمع ملاحظات من مواقف وبيئات متعددة وتحليل ظروف الأداء قبل أي استنتاج.","n":["ضعف الانتباه لا يساوي تلقائيًا اضطراب فرط الحركة وتشتت الانتباه.","الانتباه يحدد ما يدخل المعالجة ويؤثر في التعلم.","إعفاء يحرمها التعلم ويقفز إلى انتظار تشخيص.","صحيح: ضعف الانتباه عرض يحتاج دراسة نمطه."],"c":"تتشتت في حصص القراءة الطويلة","p":"ضعف الانتباه لا يساوي تلقائيًا اضطراب فرط الحركة وتشتت الانتباه."},{"id":"14-01","s":14,"i":"14.1","l":"معرفة","t":"أي العبارات الآتية تصف «التعزيز السلبي» (Negative Reinforcement) وصفًا دقيقًا؟","o":["إزالة مثير غير مرغوب عقب السلوك بما يرفع احتمال تكراره مستقبلًا","تقديم مثير غير مرغوب عقب السلوك بهدف خفض احتمال تكراره مستقبلًا","سحب مثير مرغوب فيه عقب السلوك بهدف خفض احتمال تكراره مستقبلًا","إيقاف التعزيز الذي كان يحافظ على السلوك حتى يتناقص تدريجيًا"],"a":0,"w":"كل تعزيز – موجبًا كان أو سالبًا – يزيد احتمال تكرار السلوك، وكلمة «سلبي» تعني أن الزيادة تحققت بإزالة مثير منفّر لا بإضافة شيء. لذلك فالتعزيز السلبي ليس عقابًا، والخلط بينهما من أكثر أخطاء الاختبار شيوعًا.","n":["صحيح: إزالة مثير منفّر + زيادة السلوك = تعزيز سلبي.","هذا عقاب بالإضافة؛ هدفه خفض السلوك لا زيادته.","هذا عقاب بالحذف (سحب شيء مرغوب)؛ يخفض السلوك.","هذا وصف الانطفاء لا التعزيز."],"c":"كلمة «التعزيز» تعني زيادة السلوك","p":"التعزيز يزيد السلوك دائمًا والعقاب يخفضه، و«موجب/سالب» تعني إضافة أو إزالة فقط."},{"id":"14-02","s":14,"i":"14.1","l":"معرفة","t":"يندفع الطالب عبدالله إلى حل المسائل قبل قراءة المطلوب، فدرّبه المعلم على أن يسأل نفسه بصوت منخفض قبل الحل وبعده: «ماذا يطلب السؤال؟ ما خطتي؟ هل راجعت إجابتي؟». إلى أي إطار نظري ينتمي هذا الإجراء بصورة أدق؟","o":["المنظور المعرفي السلوكي القائم على التوجيه الذاتي والحوار الداخلي","المنظور السلوكي القائم على تعزيز الاستجابة الصحيحة بعد ظهورها","المنظور البنائي القائم على إعادة بناء المعنى انطلاقًا من الخبرة السابقة","التعلم بالملاحظة القائم على تقليد نموذج ناجح من الأقران"],"a":0,"w":"الإجراء يعلّم الطالب حوارًا داخليًا يوجّه به سلوكه ويراقبه، وهذا جوهر المنظور المعرفي السلوكي: تعديل الأداء عبر التوجيه الذاتي والتنظيم الذاتي. ولا يوجد في الموقف معزز يلي السلوك، ولا نموذج يُقلَّد، ولا إعادة بناء لمفهوم.","n":["صحيح: حديث ذاتي يوجّه الأداء = معرفي سلوكي.","لا توجد في الموقف نتيجة تعزيزية تلي السلوك.","البنائية تُعنى ببناء المعنى، لا بتنظيم خطوات الأداء ذاتيًا.","لم يشاهد الطالب نموذجًا يقلّده؛ بل تدرّب على أسئلة ذاتية."],"c":"يسأل نفسه بصوت منخفض قبل الحل وبعده","p":"الحوار الداخلي والتوجيه الذاتي علامتا المنظور المعرفي السلوكي."},{"id":"14-03","s":14,"i":"14.1","l":"تطبيق","t":"يحل الطالب فيصل مسائل القسمة حين يقدّم له المعلم تلميحًا عند كل خطوة، ويعجز عنها وحده. وبعد أسبوعين صار ينجح بتلميح واحد في بداية المسألة فقط. ما الخطوة التالية الأنسب وفق مفهوم السقالات التعليمية؟","o":["سحب التلميح المتبقي تدريجيًا ومتابعة أدائه في محاولات مستقلة","الإبقاء على التلميح الأول ثابتًا لأنه يضمن نجاحه في كل مسألة","إيقاف أشكال الدعم كلها دفعة واحدة لاختبار قدرته الحقيقية","العودة إلى التلميح عند كل خطوة لتثبيت الإتقان قبل أي تغيير"],"a":0,"w":"السقالة دعم مؤقت هدفه نقل المسؤولية إلى الطالب، وتناقص حاجة فيصل من تلميح لكل خطوة إلى تلميح واحد دليل على تقدمه داخل منطقة النمو الوشيك. فالخطوة المنطقية متابعة السحب التدريجي المبني على الأداء، لا الإبقاء ولا القطع المفاجئ.","n":["صحيح: دعم يتناقص تدريجيًا بحسب الأداء.","إبقاء الدعم ثابتًا يصنع اعتمادًا دائمًا.","السحب المفاجئ يخالف مبدأ التدرج وقد يعيد الفشل.","تراجع غير مبرر؛ البيانات تشير إلى تقدم لا إلى حاجة لدعم أكبر."],"c":"صار ينجح بتلميح واحد فقط","p":"السقالة لا تُبقى ولا تُقطع فجأة؛ تُسحب تدريجيًا كلما ثبت الأداء."},{"id":"14-04","s":14,"i":"14.1","l":"تحليل","t":"عرض المعلم على الطالب خالد مقطعًا مصورًا طويلًا يؤدي فيه نموذج تجربة علمية من ثماني خطوات، ثم طلب منه تنفيذها، فنفّذ خطوتين ونسي البقية، مع أنه كان متحمسًا للتنفيذ. ما التفسير الأدق في ضوء نظرية التعلم الاجتماعي؟","o":["غياب التعزيز المباشر عقب كل خطوة نفّذها خالد أثناء أداء التجربة العلمية","ضعف الاحتفاظ بخطوات النموذج؛ فالمشاهدة وحدها لا تكفي للتعلم بالملاحظة","انخفاض دافعية خالد نحو أداء المهمة العلمية المعروضة عليه","عدم ملاءمة النمذجة أصلًا لتعليم الطلاب ذوي صعوبات التعلم"],"a":1,"w":"التعلم بالملاحظة يتطلب انتباهًا واحتفاظًا ودافعية، لا مجرد المشاهدة. والموقف ينفي ضعف الدافعية (كان متحمسًا)، ويشير طول المقطع وكثرة الخطوات إلى عبء على الاحتفاظ؛ فالأجدى عرض النموذج على أجزاء مع ممارسة بعد كل جزء.","n":["التعزيز المباشر ليس شرطًا لاكتساب سلوك عبر الملاحظة.","صحيح: الخلل في الاحتفاظ لا في الرغبة.","الجذع ينص على حماسه للتنفيذ، فتسقط فرضية الدافعية.","النمذجة من أقوى الممارسات معهم إذا نُظّم عرضها."],"c":"متحمسًا… نفّذ خطوتين ونسي البقية","p":"إذا فشل التعلم بالملاحظة فاسأل: أين التعطل؟ في الانتباه أم الاحتفاظ أم الدافعية؟"},{"id":"14-05","s":14,"i":"14.1","l":"تطبيق","t":"تقول المعلمة منى إنها تطبق البنائية؛ لذلك تترك طالباتها ذوات صعوبات التعلم يكتشفن خطوات الجمع مع إعادة التجميع بأنفسهن دون أي توضيح أو تلميح منها، ويتكرر تعثرهن. ما الإجراء الأنسب لتصحيح ممارستها؟","o":["الاستمرار في الاكتشاف الحر مدة أطول لأن المعنى المكتشف ذاتيًا أرسخ وأبقى في الذهن","تعزيز الطالبة التي تكتشف الخطوات أولًا لتحفيز البقية على مواصلة المحاولة","التحول إلى حفظ الخطوات وتكرارها دون ربطها بمعنى المفهوم الرياضي","إبقاء الطالبات فاعلات في بناء المعنى مع تقديم سقالات ونمذجة واضحة للخطوات"],"a":3,"w":"البنائية تؤكد بناء المتعلم للمعنى، لكنها لا تعني غياب التوجيه أو التدريس الصريح، خصوصًا مع طالبات يحتجن إلى وضوح. والجمع بين المشاركة النشطة والسقالات والنمذجة يصحح الممارسة دون التخلي عن جوهر البنائية.","n":["يطيل التعثر؛ الاكتشاف غير الموجه لا يناسب من يحتاج تدريسًا صريحًا.","التعزيز لا يعالج غياب التوجيه الذي سبّب التعثر.","ينتقل إلى الطرف المقابل فيفقد بناء المعنى.","صحيح: تعلم نشط + توجيه وسقالات."],"c":"دون أي توضيح… ويتكرر تعثرهن","p":"البنائية لا تعني اكتشافًا بلا توجيه؛ المعلم يوجّه والطالب يبني."},{"id":"14-06","s":14,"i":"14.1","l":"تطبيق","t":"تستهدف المعلمة نورة زيادة الكتابة المستقلة لدى الطالبة جود، التي تكتب سطرين ثم تتوقف. أي إجراء يمثل «التشكيل» (Shaping) تمثيلًا صحيحًا؟","o":["تعزيز جود عند كتابة فقرة كاملة مستقلة فقط لتكون المكافأة ذات قيمة عالية لديها","تقسيم الفقرة إلى عناصرها وتدريس كل عنصر منفصلًا قبل مطالبتها بالكتابة","تعزيز كل زيادة صغيرة في عدد الأسطر ثم رفع المعيار تدريجيًا حتى الفقرة الكاملة","عرض فقرة نموذجية مكتوبة وتكليف جود بنسخها يوميًا حتى تتقن بناءها"],"a":2,"w":"التشكيل يبني سلوكًا غير موجود كاملًا بتعزيز التقاربات المتتابعة منه، مع رفع معيار التعزيز خطوة بعد خطوة. وانتظار الفقرة الكاملة لن يتيح فرصة للتعزيز أصلًا، وتقسيم المهارة تحليل مهام، والنسخ نمذجة لا تشكيل.","n":["السلوك النهائي غير موجود، فلن تُتاح فرصة للتعزيز.","هذا تحليل مهام؛ ممارسة سليمة لكنها ليست التشكيل.","صحيح: تقاربات متتابعة + معيار يتقدم.","نسخ لنموذج لا يبني الكتابة المستقلة تدريجيًا."],"c":"تكتب سطرين ثم تتوقف","p":"سلوك غير مكتمل يُبنى خطوة خطوة بالتعزيز = تشكيل."},{"id":"14-07","s":14,"i":"14.1","l":"تحليل","t":"يبدأ الطالب ماجد درس الإملاء بحماس، لكنه حين تُملى عليه جملة طويلة دفعة واحدة يكتب أولها ويترك بقيتها ثم يتوقف عن المحاولة. وحين تُملى الجملة نفسها على أجزاء قصيرة يكتبها كاملة. ما التفسير الأدق لأدائه؟","o":["طول الجملة يتجاوز سعة ذاكرته العاملة السمعية، لا ضعف رغبته في التعلم","انخفاض دافعيته للكتابة، فيحتاج إلى نظام تعزيز رمزي قبل حصص الإملاء","ضعف في تشكيل الحروف يجعله يبطئ تدريجيًا ثم يتوقف عن الكتابة","تشتت انتباهه بالمثيرات البصرية الموجودة في غرفة الصف أثناء الإملاء"],"a":0,"w":"تغيّر الأداء بتغيّر طول الوحدة المُملاة – مع ثبات المهارة والموقف – يشير إلى قيد في الاحتفاظ المؤقت بالمعلومات السمعية. والحماس الظاهر يُسقط تفسير الدافعية، ونجاحه في كتابة الجملة كاملة حين تُجزّأ يُسقط تفسير ضعف الخط.","n":["صحيح: النجاح مع التجزئة يكشف قيد الذاكرة العاملة.","خلط شائع بين الحمل المعرفي وضعف الدافعية، والجذع يثبت حماسه.","لو كان الخط هو المشكلة لتعثر أيضًا في الأجزاء القصيرة.","لا قرينة على مثيرات بصرية؛ التغير مرتبط بطول الجملة."],"c":"على أجزاء قصيرة يكتبها كاملة","p":"إذا تحسن الأداء بالتجزئة وحدها ففكر في الذاكرة العاملة قبل الدافعية."},{"id":"14-08","s":14,"i":"14.2","l":"معرفة","t":"أي ترتيب يعكس المراحل التي تطورت عبرها طرق تدريس ذوي صعوبات التعلم؟","o":["التأسيس العصبي ← تدريب العمليات النفسية ← التدريس المباشر وتحليل المهام ← الاستراتيجيات المعرفية وما وراء المعرفة","تدريب العمليات النفسية ← التأسيس العصبي ← الاستراتيجيات المعرفية وما وراء المعرفة ← التدريس المباشر وتحليل المهام","التدريس المباشر وتحليل المهام ← التأسيس العصبي ← تدريب العمليات النفسية ← الاستراتيجيات المعرفية وما وراء المعرفة","التأسيس العصبي ← التدريس المباشر وتحليل المهام ← تدريب العمليات النفسية ← الاستراتيجيات المعرفية وما وراء المعرفة"],"a":0,"w":"بدأ المجال بتفسيرات طبية وعصبية، ثم ركّز على علاج العمليات النمائية (الإدراك والانتباه والذاكرة) بمعزل نسبي عن المهارات، ولما اتضحت محدودية انتقال أثرها اتجه إلى التدريس الأكاديمي المباشر وتحليل المهام، ثم إلى استراتيجيات التفكير والتنظيم الذاتي والتعميم.","n":["صحيح: من الدماغ إلى العمليات ثم المهارة ثم التفكير.","يقدّم العمليات على الأساس العصبي، ويؤخر التدريس المباشر إلى النهاية.","يبدأ بالتدريس المباشر مع أنه جاء ردًّا على محدودية تدريب العمليات.","يقدّم التدريس المباشر على مرحلة العمليات النفسية التي سبقته."],"c":"المراحل التي تطورت عبرها طرق التدريس","p":"تذكّر السلسلة: دماغ ← عمليات ← مهارة صريحة ← استراتيجية وتفكير."},{"id":"14-09","s":14,"i":"14.2","l":"تحليل","t":"أمضى الطالب يزن فصلًا دراسيًا في تمارين تمييز بصري لأشكال مجردة، فارتفعت درجاته فيها بوضوح، بينما بقيت دقته في قراءة الكلمات عند مستواها السابق. ما القرار الأنسب للفصل التالي؟","o":["مضاعفة زمن تمارين التمييز البصري لأن أثرها سينتقل إلى القراءة لاحقًا","إيقاف التدخل في القراءة لأن تحسن الإدراك البصري مؤشر كافٍ على النجاح","توجيه التدخل إلى قراءة الكلمات نفسها بتدريس صريح وقياس متكرر لها","إضافة تمارين تمييز سمعي معزولة إلى جانب التمارين البصرية الحالية"],"a":2,"w":"من أبرز دروس تطور المجال أن تحسن عملية نمائية معزولة لا يضمن تلقائيًا تحسن التحصيل. والبيانات هنا صريحة: تحسنت المهارة المدرَّبة ولم تتحسن القراءة؛ فالقرار المهني ربط التدخل مباشرة بالمهارة الأكاديمية وقياس أثره عليها.","n":["يفترض انتقال الأثر تلقائيًا رغم أن البيانات تنفيه.","يحكم بالنجاح على مؤشر لا يمثل الهدف الأكاديمي.","صحيح: يستهدف المهارة الأكاديمية مباشرة ويقيسها.","يكرر الخطأ نفسه بتدريب عملية معزولة أخرى."],"c":"ارتفعت درجاته فيها… وبقيت دقته في القراءة","p":"تحسن العملية المعزولة لا يعني تحسن التحصيل؛ درّس المهارة الأكاديمية نفسها."},{"id":"14-10","s":14,"i":"14.2","l":"تطبي
