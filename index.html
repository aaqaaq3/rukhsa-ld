 عندما تُعرض خطواتها دفعة واحدة، وتُظهر عيّنات عمله أنه يؤدي كل خطوة بمفردها بدقة لكنه يضيع في الانتقال بينها. ما التعديل الأنسب للدرس؟","o":["خفض الهدف إلى القسمة على عدد من رقم واحد دون باقٍ حتى نهاية الفصل.","تقسيم الإجراء إلى خطوات مع قائمة مؤقتة، ثم ربطها بالإجراء الكامل.","منحه وقتًا إضافيًا لإكمال المسائل بالطريقة نفسها دون أي تغيير في العرض.","زيادة عدد المسائل الكاملة في الواجب المنزلي حتى يعتاد الإجراء بالتكرار."],"a":1,"w":"إذا كانت القفزة بين مرحلتين كبيرة يقسّم المعلم المهارة إلى خطوات أصغر ذات معنى، ويقدّم سقالة مؤقتة كقائمة خطوات، ثم يعيد ربط الأجزاء بالبنية الكاملة ويقلل الدعم مع تحسن قدرة الطالب على إدارة الخطوات.","n":["يخفض الهدف رغم أنه يتقن الخطوات منفردة.","صحيح: يعالج عبء التسلسل ويحافظ على الصورة الكلية.","الوقت لا يعالج الضياع في تسلسل الخطوات.","يكرر الإجراء الكامل الذي يضيع فيه دون دعم."],"c":"يضيع في الانتقال بين الخطوات","p":"قسّم الخطوات ثم أعد الربط، وقلّل القائمة المؤقتة مع التحسن."},{"id":"16-13","s":16,"i":"16.2","l":"تطبيق","t":"يتأخر فيصل في حل المسائل اللفظية، ويكشف تحليل عمله أنه لا يفهم العلاقة بين المعطيات. اقترح زميل منحه وقتًا إضافيًا حلًّا للمشكلة. ما الحكم الأدق على الاقتراح؟","o":["غير كافٍ؛ فالوقت لا يعالج خطأً مفاهيميًا، فيُعلَّم تمثيل العلاقات أولًا.","مناسب؛ لأن الوقت الإضافي حق ثابت لكل طالب لديه صعوبات تعلم في كل مهمة.","مناسب؛ لأن بطء الحل وحده دليل كافٍ على الحاجة إلى وقت أطول في الاختبار.","غير مناسب؛ ويُطلب منه الإسراع في الحل ليعتاد على ضغط الاختبارات."],"a":0,"w":"قد يكون الوقت الإضافي مناسبًا في بعض المهام، لكنه ليس حلًا عامًا؛ فإذا كان الخطأ مفاهيميًا فلن يعالجه الوقت. لذا يُعلَّم فيصل تمثيل المسألة وتحليل العلاقات أولًا، ثم يُحدَّد هل ما زال يحتاج وقتًا إضافيًا.","n":["صحيح: يعالج سبب البطء لا عرضه.","الوقت ليس حلًا عامًا لكل صعوبة.","البطء عرض، وسببه هنا مفاهيمي.","يتجاهل سبب الصعوبة ويزيد الضغط عليه."],"c":"لا يفهم العلاقة بين المعطيات","p":"حدّد سبب الحاجة للوقت؛ فالوقت لا يعالج خطأً مفاهيميًا."},{"id":"16-14","s":16,"i":"16.2","l":"تطبيق","t":"هدف نشاط اليوم قياس قدرة الطلاب على كتابة فقرة وصفية بخط اليد مع مراعاة الإملاء. اقترحت المعلمة أن يجيب عادل شفهيًا لأن الكتابة تتعبه. ما الحكم الأنسب؟","o":["مناسب؛ لأن تغيير طريقة الاستجابة تكييف لا يغيّر الهدف في أي مهمة كانت.","غير مناسب؛ لأن الكتابة هي المهارة المقيسة، فيُدعم بسقالات تحافظ عليها.","مناسب؛ لأن راحة الطالب مقدّمة دائمًا على الالتزام بطريقة القياس المحددة.","غير مناسب؛ لأن الإجابة الشفهية لا تصلح لطلاب صعوبات التعلم مطلقًا."],"a":1,"w":"يجوز تعديل طريقة الاستجابة عندما لا تكون هي المهارة المقيسة، أما إذا كان الهدف الكتابة فلا يمكن استبدالها بإجابة شفهية ثم الادعاء بقياس الكتابة. والبديل دعم مؤقت كالمنظم البصري أو تقسيم المهمة مع بقاء الكتابة.","n":["تعميم خاطئ؛ فهنا الاستجابة هي البنية المقيسة.","صحيح: لا تُبدَّل طريقة الاستجابة إذا كانت هي الهدف.","يضحي بصدق القياس ولا يعالج الصعوبة.","الحكم صحيح والتعليل خاطئ؛ فقد تصلح حين لا تكون الكتابة هدفًا."],"c":"الهدف قياس الكتابة بخط اليد","p":"لا تغيّر طريقة الاستجابة إذا كانت هي نفسها المهارة المقيسة."},{"id":"16-15","s":16,"i":"16.2","l":"تحليل","t":"تُظهر بيانات أسبوعين أن هشامًا يحقق دقة عالية لكن مع تلميحات كثيرة، وأن بدرًا يتقن البنود بسرعة وثبات دون أي تلميح. أي قرار يناسب الطالبين؟","o":["تلاشي التلميحات تدريجيًا لهشام، ورفع التحدي أو التعميم لبدر.","رفع التحدي لهشام، وتلاشي التلميحات تدريجيًا لبدر.","خفض الهدف لهشام، والإبقاء على المهام نفسها لبدر حتى نهاية الوحدة.","زيادة التلميحات لهشام، وزيادة عدد البنود المتشابهة نفسها لبدر."],"a":0,"w":"الدقة مع التلميحات الكثيرة تعني اعتمادًا مرتفعًا فيُخطَّط لتلاشي الدعم، والإتقان السريع المستقر يعني أن المهمة دون مستوى التحدي فيُرفع التعقيد أو التعميم؛ فالتعديل يتبع نمط البيانات لكل طالب.","n":["صحيح: لكل نمط بيانات قرار مختلف.","عكس للقرارين؛ بدر لا يتلقى تلميحات أصلًا.","يخفض توقعات هشام ويُبقي بدرًا دون تحدٍّ.","يرفع الاعتماد، ويزيد الكم دون تحدٍّ نوعي."],"c":"دقة مع تلميحات كثيرة، وإتقان دون تلميح","p":"دقة مع تلميح كثير ← تلاشٍ، وإتقان سريع مستقر ← ارفع التحدي."},{"id":"16-16","s":16,"i":"16.2","l":"تحليل","t":"قرر معلم تطبيق تعديل واحد، هو تقليل عدد البنود إلى النصف، على جميع طلاب صعوبات التعلم في صفه لأن تشخيصهم واحد. ما الخلل الأدق في قراره؟","o":["اختار تقليل البنود بدل الوقت الإضافي الذي يناسب جميع الطلاب في العادة.","طبّق التعديل متأخرًا، وكان ينبغي تطبيقه منذ بداية العام الدراسي كله.","لم يستشر الأسرة قبل التطبيق، وهذا وحده ما يُضعف القرار ويُبطله.","بنى التعديل على التشخيص لا على ملف كل طالب ونوع المهمة وبياناته."],"a":3,"w":"تشخيص صعوبات التعلم لا يحدد تلقائيًا نوع التعديل؛ فطالبان بالتشخيص نفسه قد يحتاجان تعديلات مختلفة. والقرار يتبع الملف الفردي ونوع المهمة والهدف والبيانات، وتقليل الكم قد يقلل فرص الممارسة الضرورية لبعضهم.","n":["يستبدل حلًا عامًا بحل عام آخر.","التوقيت ليس جوهر الخلل.","الشراكة مهمة لكنها ليست أصل الخلل.","صحيح: التشخيص لا يحدد التعديل تلقائيًا."],"c":"لأن تشخيصهم واحد","p":"التشخيص الواحد لا يعني تعديلًا واحدًا؛ القرار فردي مبني على البيانات."},{"id":"16-17","s":16,"i":"16.3","l":"معرفة","t":"تدرّب معلمة طالباتها على أن يسألن أنفسهن في أثناء المهمة: «ماذا أعرف؟ ما المطلوب؟ ما الاستراتيجية المناسبة؟ هل تنجح؟ ماذا أغيّر؟». إلى أي مفهوم تنتمي هذه الأسئلة؟","o":["المناصرة الذاتية (Self-Advocacy).","التعلم التعاوني (Cooperative Learning).","المعرفة فوق المعرفية (Metacognition).","التعزيز الذاتي (Self-Reinforcement)."],"a":2,"w":"المعرفة فوق المعرفية وعي الطالب بطريقة تعلمه وقدرته على التخطيط والمراقبة والتقويم، وهذه الأسئلة تحوّله من منفّذ للتعليمات إلى مدير جزئي لتعلمه.","n":["تعني التعبير عن الحاجة وطلب الدعم المناسب.","يقوم على العمل المشترك ضمن مجموعة.","صحيح: تخطيط ومراقبة وتقويم للتعلم.","يعني مكافأة الطالب نفسه بعد تحقيق المعيار."],"c":"ماذا أعرف؟ هل تنجح؟ ماذا أغيّر؟","p":"أسئلة التخطيط والمراقبة والتقويم الذاتي = معرفة فوق معرفية."},{"id":"16-18","s":16,"i":"16.3","l":"معرفة","t":"في التعلم التعاوني لطلاب صعوبات التعلم، ما المقصود بالمساءلة الفردية؟","o":["أن يُحاسَب أقوى طالب في المجموعة عن نتيجة المجموعة كلها أمام المعلم.","أن يتمكن المعلم من معرفة تعلّم كل طالب عبر إجابة أو شرح أو منتج خاص به.","أن يعمل كل طالب منفردًا داخل المجموعة دون تبادل الأفكار مع زملائه.","أن تحصل المجموعة على درجة واحدة يتقاسمها أعضاؤها بالتساوي فيما بينهم."],"a":1,"w":"المساءلة الفردية شرط لفاعلية التعلم التعاوني؛ فبدونها قد يؤدي الطالب الأقوى المهمة ويبقى الطالب ذو الصعوبة متلقيًا، لذا يحتاج المعلم إلى دليل فردي على تعلّم كل طالب.","n":["يُبقي الطالب ذا الصعوبة متلقيًا.","صحيح: يمنع اختفاء الطالب خلف المجموعة.","يلغي التعاون نفسه.","لا يكشف تعلّم كل فرد."],"c":"المساءلة الفردية","p":"لا تعاون فعّال دون مساءلة فردية تكشف تعلّم كل طالب."},{"id":"16-19","s":16,"i":"16.3","l":"تطبيق","t":"تطرح المعلمة سؤالًا على جود، وبعد ثانيتين من صمتها تعطيها تلميحًا مباشرًا، حتى أصبحت جود تنتظر التلميح في كل مرة. ما التعديل الأنسب؟","o":["منحها زمن انتظار مناسبًا للمعالجة، ثم البدء بأقل تلميح ممكن وتلاشيه.","تقديم التلميح فور طرح السؤال لتوفير وقت الحصة على جميع الطالبات.","استبدال التلميح بالإجابة الكاملة؛ لأن التلميح لم يعد مجديًا معها.","التوقف عن توجيه الأسئلة إليها حتى تبادر بالإجابة من تلقاء نفسها."],"a":0,"w":"بعض الطلاب يحتاجون وقتًا لمعالجة اللغة واسترجاع الإجابة، والتدخل السريع يعلّمهم الانتظار. فإعطاء زمن انتظار مناسب، ثم التلميح من الأقل إلى الأكثر وتلاشيه، يزيد المبادرة ويمنع الاعتماد على التلميح.","n":["صحيح: يعالج الاعتماد على التلميح.","يعمّق الاعتماد ويحرمها من وقت المعالجة.","يؤدي المهمة عنها كليًا.","يقلل فرص الاستجابة بدل بناء المبادرة."],"c":"أصبحت تنتظر التلميح في كل مرة","p":"التلميح السريع يبني الاعتماد؛ امنح زمن انتظار ثم أقل تلميح ممكن."},{"id":"16-20","s":16,"i":"16.3","l":"تطبيق","t":"كلّف المعلم طالبًا متفوقًا بمساعدة زميله ذي صعوبات التعلم في القراءة، فصار المتفوق يقرأ النص كاملًا عنه في كل حصة. ما التعديل الأنسب؟","o":["إيقاف تدريس الأقران نهائيًا؛ لأنه لا يناسب طلاب صعوبات التعلم في القراءة.","الإبقاء على الترتيب نفسه؛ لأن الطالب يستمع إلى نموذج قراءة سليمة كل حصة.","استبدال القرين بطالب متفوق آخر دون أي تغيير في طريقة العمل بينهما.","تدريب القرين على أدوار متبادلة، مع متابعة المعلم وقياس أداء الطالب نفسه."],"a":3,"w":"يكون تدريس الأقران فعّالًا عندما تكون الأدوار والإجراءات محددة، ويتلقى القرين تدريبًا، وتوجد فرص لتبادل الأدوار وتغذية راجعة ومتابعة من المعلم؛ فهو لا يعني تسليم مسؤولية التعلم لطالب آخر.","n":["يلغي استراتيجية فعّالة بدل تنظيمها.","الاستماع وحده لا يبني مهارة القراءة لديه.","يغيّر الشخص ويُبقي الخلل نفسه.","صحيح: تدريس الأقران يحتاج أدوارًا وتدريبًا ومتابعة."],"c":"صار المتفوق يقرأ النص كاملًا عنه","p":"تدريس الأقران = أدوار محددة + تدريب القرين + متابعة، لا قرين ينوب عن الطالب."},{"id":"16-21","s":16,"i":"16.3","l":"تطبيق","t":"أرادت معلمة أن يراقب فهد انتباهه للمهمة بنفسه، فأعطته بطاقة تتضمن عشرة سلوكيات مختلفة يقيّمها كل خمس دقائق دون تدريب مسبق، فأهملها بعد يومين. ما التعديل الأنسب؟","o":["زيادة عدد السلوكيات في البطاقة لتصبح المراقبة أشمل وأدق في وصف أدائه.","إلغاء المراقبة الذاتية واستبدالها بمراقبة المعلمة له طوال الحصة.","ربط البطاقة بعقوبة عند عدم تعبئتها لضمان التزامه بها في كل حصة.","تبسيط البطاقة إلى سلوك واحد واضح، وتدريبه على التسجيل أولًا."],"a":3,"w":"تنجح المراقبة الذاتية حين يكون المؤشر واضحًا وبسيطًا ولا يستهلك وقتًا أكثر من التعلم نفسه، وحين يُدرَّب الطالب على استخدامه. والقائمة الطويلة والمطالبة بالمراقبة دون تدريب من الأخطاء الشائعة.","n":["يزيد العبء الذي أدى إلى إهمال البطاقة.","ينقل الضبط إلى الخارج بدل بنائه داخليًا.","العقاب لا يعالج تعقيد الأداة وغياب التدريب.","صحيح: مؤشر واضح بسيط مع تدريب."],"c":"بطاقة بعشرة سلوكيات دون تدريب","p":"المراقبة الذاتية الناجحة: سلوك واحد واضح + تدريب على التسجيل."},{"id":"16-22","s":16,"i":"16.3","l":"تطبيق","t":"ترفض ندى كتابة موضوعات التعبير المقررة، لكنها تتحمس عندما تختار الموضوع بنفسها. ما الاستخدام الأنسب للاختيار في درس الكتابة؟","o":["عرض موضوعين أو ثلاثة يحقق كل منها مهارة الكتابة المستهدفة نفسها.","السماح لها بكتابة أي شيء تريده دون التقيد بنوع النص المستهدف في الدرس.","إتاحة الاختيار بين كتابة الموضوع أو تلوين رسمة تعبّر عنه بدلًا من الكتابة.","إلغاء الاختيار؛ لأنه يعوّدها التهرب من المهام المقررة عليها."],"a":0,"w":"الاختيار المنظم يزيد الإحساس بالملكية والمبادرة، بشرط أن تكون الخيارات محدودة ومرتبطة بالهدف ومتكافئة في تحقيقه، وألا يصبح وسيلة لتجنب المهارة الأساسية.","n":["صحيح: اختيار محدود متكافئ في تحقيق الهدف.","اختيار مفتوح يُسقط الهدف.","خيار يسمح بتجنب المهارة الأساسية.","يُهدر أداة فعّالة لزيادة الملكية والمشاركة."],"c":"تتحمس عندما تختار الموضوع بنفسها","p":"الاختيار المفيد محدود ومتكافئ ويحافظ على الهدف."},{"id":"16-23","s":16,"i":"16.3","l":"تحليل","t":"يستخدم زياد استراتيجية تلخيص الفقرة بنجاح كلما طلبت منه معلمة لغتي ذلك، لكنه لا يستخدمها من تلقاء نفسه في نصوص مادة العلوم. ما التفسير والإجراء الأدق؟","o":["لم يكتسب الاستراتيجية أصلًا؛ فيُعاد تعليمها من البداية في حصة لغتي.","نصوص العلوم أعلى من مستواه؛ فيُعفى من تلخيصها إلى أن يتحسن أداؤه.","لم يصل إلى الاختيار الذاتي؛ فيُعلَّم صراحةً متى يختارها وفي أي سياق.","يفتقر إلى الدافعية في العلوم؛ فيكفي ربط التلخيص فيها بمكافأة مادية."],"a":2,"w":"الطالب المبادر يختار الاستراتيجية من تلقاء نفسه في مهام جديدة. وزياد يمتلكها لكنه لا ينقلها، والتعميم لا يحدث تلقائيًا، فيحتاج تعليمًا صريحًا لمتى ولماذا يستخدمها، وممارسة في مواد أخرى مع قياس اختياره الذاتي لها.","n":["نجاحه عند الطلب يثبت اكتسابها.","لا دليل على صعوبة النص، والإعفاء لا يبني المبادرة.","صحيح: التعميم يحتاج تعليمًا صريحًا.","المكافأة وحدها لا تعلّم متى تُستخدم الاستراتيجية."],"c":"لا يستخدمها من تلقاء نفسه في العلوم","p":"يستخدم الاستراتيجية عند الطلب فقط = علّم الاختيار الذاتي والتعميم."},{"id":"16-24","s":16,"i":"16.3","l":"تحليل","t":"تقيس معلمة مبادرة طالبها بعدد مرات رفع يده للإجابة، فارتفع العدد كثيرًا، لكن إجاباته غالبًا لا ترتبط بالسؤال، وما زال لا يبدأ مهامه إلا بتذكير. ما الحكم الأدق على مؤشرها؟","o":["مؤشر دقيق؛ لأن كثرة رفع اليد هي أوضح دليل على فاعلية الطالب في الحصة.","مؤشر شكلي؛ فالمبادرة تُقاس ببدء المهام دون تذكير وجودة الاستجابات.","مؤشر دقيق؛ لكنه يحتاج إلى مقارنة أدائه بأداء زملائه في الصف نفسه.","مؤشر مناسب؛ ويكفي تعزيز الطالب في كل مرة يرفع فيها يده للإجابة."],"a":1,"w":"الطالب الفاعل يشارك معرفيًا لا شكليًا. وتُقاس المبادرة بمؤشرات مثل نسبة البدء دون تذكير، وعدد الاستجابات الأكاديمية ذات الجودة، واختيار الاستراتيجية، وانخفاض التلميحات، والتعميم؛ وقياسها بالمشاركة اللفظية فقط فخ شائع.","n":["الحركة والكلام لا يثبتان عملًا معرفيًا.","صحيح: المشاركة الشكلية ليست مبادرة.","يُبقي المؤشر الشكلي ويضيف مقارنة غير لازمة.","يكافئ المشاركة دون التعلم فيعمّق الخلل."],"c":"لا يبدأ مهامه إلا بتذكير","p":"المبادرة = بدء مستقل وجودة استجابة، لا كثرة رفع اليد."},{"id":"16-25","s":16,"i":"16.4","l":"معرفة","t":"ما الذي يجعل أداة ما «تقنية مساندة» (Assistive Technology) لطالب ذي صعوبات تعلم، لا مجرد تقنية تعليمية؟","o":["كونها جهازًا إلكترونيًا متقدمًا مرتفع التكلفة ومعقد التشغيل.","استخدام جميع طلاب الصف لها في الحصص العادية بالطريقة نفسها.","وظيفتها في زيادة قدرته الوظيفية أو تحسينها وفق حاجته وسياقه.","اسم الجهاز ونوعه كما يصنّفه المصنع في دليل الاستخدام."],"a":2,"w":"التقنية المساندة أداة أو نظام يساعد طالبًا ذا إعاقة على زيادة قدرته الوظيفية أو الحفاظ عليها أو تحسينها وفق حاجته، وقد تكون بسيطة أو متقدمة. والأداة نفسها قد تكون تعليمية في سياق ومساندة في آخر؛ فالحاسم وظيفتها.","n":["قد تكون منخفضة التقنية كقالب أو مسطرة قراءة.","هذا أقرب إلى وصف التقنية التعليمية العامة.","صحيح: الحاسم وظيفة الأداة بالنسبة للطالب.","الأداة نفسها قد تكون تعليمية أو مساندة بحسب الوظيفة."],"c":"تقنية مساندة لا مجرد تقنية تعليمية","p":"ركّز على العائق الذي تعالجه الأداة، لا على اسم الجهاز."},{"id":"16-26","s":16,"i":"16.4","l":"معرفة","t":"أي العبارات التالية أدق في وصف علاقة التصميم الشامل للتعلم (UDL) بالدعم الفردي؟","o":["يلغي الحاجة إلى أي دعم فردي؛ لأنه يناسب جميع الطلاب بالضرورة في كل الأحوال.","يعني أن يستخدم جميع الطلاب الطريقة نفسها في التعلم والتعبير عن فهمهم.","يقلل العوائق منذ التخطيط، وقد يبقى بعض الطلاب بحاجة إلى دعم فردي إضافي.","يُطبّق بعد ظهور الصعوبة لدى الطالب بديلًا عن التخطيط المسبق للدرس."],"a":2,"w":"التصميم الشامل للتعلم يوفر منذ التخطيط طرقًا متعددة للمشاركة والتمثيل والتعبير مع أهداف واضحة، فيقلل الحاجة إلى تعديلات لاحقة، لكنه لا يلغي الدعم الفردي الذي قد يحتاجه بعض الطلاب.","n":["اعتباره بديلًا عن كل دعم فردي فخ شائع.","الشمول لا يعني توحيد الطريقة للجميع.","صحيح: التصميم الشامل لا يلغي الدعم الفردي.","التصميم الشامل تخطيط استباقي منذ البداية."],"c":"علاقة (UDL) بالدعم الفردي","p":"التصميم الشامل يقلل العوائق مسبقًا، والدعم الفردي قد يبقى مطلوبًا."},{"id":"16-27","s":16,"i":"16.4","l":"تطبيق","t":"يقرأ سلمان ببطء شديد، ويحتاج إلى فهم وحدة علمية عن دورة الماء ضمن هدف يقيس فهم المحتوى العلمي، وله برنامج مستقل لعلاج فك الترميز. ما الإجراء الأنسب؟","o":["استخدام قارئ النص للوصول إلى المحتوى مع استمرار برنامج القراءة.","منع قارئ النص؛ لأنه يحرمه من فرصة التدرب على القراءة في أثناء حصص العلوم.","خفض هدف العلوم إلى حفظ عدد قليل من المصطلحات بدل فهم الوحدة كاملة.","تأجيل وحدة العلوم حتى يتقن فك الترميز ويقرأ نصوصها بطلاقة."],"a":0,"w":"إذا كان الهدف فهم المحتوى العلمي لا فك الترميز، فقارئ النص وسيلة وصول مناسبة لا تغيّر ما يُقاس، مع استمرار تدريس القراءة في برنامج مستقل. أما إذا كان الهدف قياس فك الترميز فاستخدامه يغيّر ما يُقاس.","n":["صحيح: وصول إلى المحتوى دون إفساد البنية المقيسة.","يجعل القراءة عائقًا أمام هدف لا يقيسها.","يخفض الهدف بدل إزالة عائق الوصول.","يحرمه من المحتوى دون مبرر."],"c":"هدف يقيس فهم المحتوى العلمي","p":"اسأل: هل القراءة هي المهارة المقيسة أم وسيلة للوصول إلى المحتوى؟"},{"id":"16-28","s":16,"i":"16.4","l":"تطبيق","t":"تستخدم سارة برنامج تحويل الكلام إلى نص في مهام الكتابة. في أي المهام التالية يكون استخدامه «غير مناسب»؟","o":["اختبار يقيس إتقانها كتابة كلمات نمط إملائي درسته.","نشاط يقيس قدرتها على تنظيم أفكارها في فقرة مترابطة.","تقرير علمي يقيس فهمها لنتائج تجربة أجرتها في المختبر.","قصة قصيرة يقيس فيها المعلم توليد الأفكار والخيال."],"a":0,"w":"تُختار تقنية الكتابة وفق الهدف: إذا كان الهدف توليد الأفكار أو بناء النص أو الفهم فقد تزيل عائق الكتابة اليدوية، أما إذا كان الهدف الإملاء نفسه فلا ينبغي لأداة أن تؤدي المهارة المقيسة بدل الطالب.","n":["صحيح: الأداة ستؤدي المهارة المقيسة بدلًا منها.","التنظيم هو المقيس، والأداة تزيل عائق الكتابة اليدوية.","الفهم العلمي هو المقيس، فالأداة وسيلة وصول.","توليد الأفكار هو المقيس، فالأداة مناسبة."],"c":"يكون استخدامه «غير مناسب»","p":"الأداة المناسبة تزيل العائق ولا تؤدي المهارة المقيسة بدل الطالب."},{"id":"16-29","s":16,"i":"16.4","l":"تطبيق","t":"تزداد أخطاء نوف في أوراق العمل المزدحمة بالرسوم والألوان، وتقل حين تُعرض البنود نفسها في مساحات واضحة. ما الإجراء الأنسب؟","o":["زيادة الألوان والرسوم في الورقة لجذب انتباهها إلى البنود المهمة فيها.","حذف نصف البنود الصعبة من الورقة حتى تقل أخطاؤها في المهمة.","نقلها إلى مقعد أمامي مع إبقاء تصميم الورقة كما هو دون تغيير.","إعادة تصميم الورقة بمسافات واضحة وإبراز محدود، ومقارنة دقتها بخط الأساس."],"a":3,"w":"البيانات تربط الأخطاء بالازدحام البصري، فالتهيئة المناسبة تبسيط الصفحة وإبراز المعلومة الحاسمة دون تقديم الإجابة أو حذف المهارة، ثم مقارنة الدقة والاستقلال بخط الأساس للتحقق من الأثر.","n":["يزيد العائق البصري نفسه.","يحذف المهارة بدل تنظيم عرضها.","حل عام لا يعالج العائق المحدد في الورقة.","صحيح: يزيل المشتت ويحافظ على المهارة ويقيس الأثر."],"c":"تقل حين تُعرض البنود في مساحات واضحة","p":"عالج العائق البصري بتنظيم الصفحة، لا بحذف المهارة أو بزيادة الزينة."},{"id":"16-30","s":16,"i":"16.4","l":"تطبيق","t":"يحتاج مازن إلى من يشغّل له تطبيق تنظيم المهام في كل مرة رغم استخدامه منذ أشهر، بينما يستخدم بطاقة خطوات ورقية بنفسه ويحقق بها النتيجة ذاتها. ما القرار الأنسب؟","o":["الإبقاء على التطبيق؛ لأنه أحدث ويواكب التطور التقني في التعليم.","الإبقاء على التطبيق مع تكليف زميل بتشغيله له في كل مرة.","إلغاء أدوات التنظيم كلها؛ لأنه لم يستفد من التطبيق بعد أشهر.","اعتماد البطاقة الورقية؛ لأنها تحقق الوظيفة باستقلال وجهد أقل."],"a":3,"w":"أفضل أداة هي التي تزيد قدرة الطالب على أداء المهمة بنفسه، وإذا تساوت الفاعلية تُفضَّل الأداة الأسهل والأكثر استدامة. واحتياج مازن إلى من يشغّل التطبيق دليل على ضعف ملاءمته مقارنة بالبطاقة.","n":["الأعلى تقنية ليس الأفضل تلقائيًا.","يُبقي الاعتماد على شخص آخر.","يتجاهل نجاح البطاقة الورقية.","صحيح: الأبسط الفعّال أولى."],"c":"يستخدم بطاقة ورقية بنفسه بالنتيجة ذاتها","p":"إذا تساوت الفاعلية، فالأداة الأبسط والأكثر استقلالًا أولى."},{"id":"16-31","s":16,"i":"16.4","l":"تحليل","t":"وجدت معلمة تطبيقًا مجانيًا جذابًا لتدريب طالباتها على الحساب، لكنه يطلب الاسم الكامل للطالبة ورقم جوال ولي أمرها وصلاحية الوصول إلى الصور، ويعرض إعلانات. ما القرار الأدق؟","o":["استخدامه فورًا؛ لأن المحتوى التعليمي هو المعيار الوحيد للحكم على أي تطبيق.","فحص الخصوصية والصلاحيات والإعلانات وفق السياسات، أو اختيار بديل آمن.","استخدامه؛ لأن كونه مجانيًا يجعله أنسب من أي بديل مدفوع في كل الأحوال.","رفض استخدام أي تطبيق رقمي مع طالبات صعوبات التعلم في المستقبل."],"a":1,"w":"التطبيق التعليمي الجيد لا يُقاس بمحتواه فقط بل بسلامة استخدامه؛ فيفحص المعلم الإعلانات والروابط وجمع البيانات والصلاحيات، ويقلل البيانات الشخصية إلى الضروري، ويتبع السياسات المعتمدة.","n":["يتجاهل الخصوصية والأمان الرقمي.","صحيح: السلامة الرقمية جزء من جودة الأداة.","التكلفة عامل واحد لا يلغي معايير السلامة.","تعميم متطرف يحرم الطالبات من أدوات مفيدة."],"c":"يطلب بيانات شخصية وصلاحيات ويعرض إعلانات","p":"الخصوصية والأمان الرقمي جزء من جودة أي أداة تعليمية."},{"id":"16-32","s":16,"i":"16.4","l":"تحليل","t":"يفخر معلم بأن طلابه ذوي صعوبات التعلم استخدموا السبورة التفاعلية في كل حصة طوال الفصل، لكنه لم يجمع أي بيانات عن تعلمهم. ما الحكم الأدق على فاعلية الأداة؟","o":["لا يمكن الحكم بفاعليتها؛ فالاستخدام لا يساوي الفاعلية دون بيانات أثر.","الأداة فعّالة؛ لأن انتظام استخدامها طوال الفصل دليل كافٍ على أثرها في التعلم.","الأداة فعّالة؛ لأن الطلاب أبدوا استمتاعًا واضحًا بها في الحصص كلها.","الأداة غير فعّالة؛ لأن التقنية التعليمية لا تفيد طلاب صعوبات التعلم."],"a":0,"w":"السؤال ليس: هل استخدم الطلاب الأداة؟ بل: هل حسّنت الوصول أو التعلم أو الاستقلال دون آثار غير مرغوبة مقارنة بخط الأساس؟ وبدون بيانات أثر لا يمكن الحكم على فاعليتها.","n":["صحيح: الفاعلية تُثبت ببيانات الأثر.","الاستخدام المتكرر لا يثبت الفاعلية.","المتعة لا تثبت تحسن الهدف.","حكم مسبق بلا بيانات، وتعميم خاطئ."],"c":"لم يجمع أي بيانات عن تعلمهم","p":"الاستخدام يصف حدوث الأداة، والفاعلية تعني تحسن نتيجة مستهدفة."},{"id":"16-33","s":16,"i":"16.5","l":"معرفة","t":"أي الإجراءات التالية يُعدّ تعديلًا في هدف الخطة التربوية الفردية، لا تعديلًا في طريقة التدريس؟","o":["استخدام نموذج بصري بدل الشرح اللفظي الطويل في تعليم كتابة الفقرة.","زيادة عدد الأمثلة والممارسة الموجهة على كتابة الفقرة المترابطة.","تغيير المطلوب من «يكتب فقرة مترابطة» إلى «يكتب جملة واحدة تامة».","تقديم منظم بصري مؤقت يساعده على تخطيط الفقرة قبل كتابتها."],"a":2,"w":"إذا بقي المطلوب النهائي نفسه وتغيرت طريقة الشرح أو عدد الأمثلة أو أُضيفت سقالة، فهذا تعديل في التدريس. أما إذا تغيّر ما سيؤديه الطالب أو مستوى التعقيد المتوقع، فقد أصبح تعديلًا في الهدف.","n":["تغيير في طريقة العرض مع بقاء الهدف.","زيادة في جرعة التدريس لا في المطلوب.","صحيح: تغيّر ما يُتوقع أن يؤديه الطالب.","سقالة مؤقتة للوصول إلى الهدف نفسه."],"c":"تعديل في الهدف لا في التدريس","p":"إن تغيّر «ماذا» سيؤدي الطالب فقد عُدّل الهدف، وإن تغيّر «كيف» نعلّمه فهو تدريس."},{"id":"16-34","s":16,"i":"16.5","l":"معرفة","t":"أي الصياغات التالية تمثّل هدفًا قابلًا للقياس في الخطة التربوية الفردية؟","o":["يتحسن أداؤه في الكتابة تحسنًا ملحوظًا وواضحًا مع نهاية الفصل الدراسي الحالي.","يكتب فقرة من أربع جمل مترابطة حول موضوع مألوف دون تلميح في ثلاث عينات متتالية.","يدرك أهمية الكتابة المنظمة ويقدّر جمال التعبير الكتابي في حياته اليومية.","يشارك في أنشطة الكتابة الصفية بانتظام وبدافعية مرتفعة طوال العام الدراسي."],"a":1,"w":"الهدف القابل للقياس يتضمن سلوكًا يمكن ملاحظته، وشروط الأداء عند الحاجة، ومعيارًا للإتقان، وسياقًا يسمح بالقياس. أما صياغات مثل «يتحسن» أو «يدرك» فلا يمكن الحكم على تحققها بدقة.","n":["عبارة عامة بلا سلوك محدد ولا معيار.","صحيح: سلوك ملاحظ وشرط ومعيار.","يصف اتجاهات داخلية لا تُلاحظ مباشرة.","يصف المشاركة لا أداء المهارة بمعيار."],"c":"هدفًا قابلًا للقياس","p":"الهدف القابل للقياس = سلوك ملاحظ + شرط + معيار إتقان."},{"id":"16-35","s":16,"i":"16.5","l":"تطبيق","t":"حققت أروى هدف جمع الأعداد مع إعادة التجميع بدقة 95٪ وباستقلال في عدة قياسات وبمواد جديدة قبل منتصف مدة الخطة. ما الإجراء الأنسب؟","o":["الإبقاء على الهدف كما هو حتى نهاية المدة المحددة في الخطة الفردية.","خفض معيار الإتقان لضمان استمرار نجاحها في القياسات القادمة كلها.","رفع مستوى التعقيد أو التعميم في الهدف بدل إبقائه لمجرد أنه مكتوب.","إيقاف أهداف الرياضيات كلها في خطتها؛ لأنها لم تعد بحاجة إليها."],"a":2,"w":"إذا أظهرت بيانات متكررة أن الطالب أتقن الهدف قبل المتوقع وباستقلال وفي أمثلة متنوعة، يُرفع مستوى التعقيد أو التعميم أو الاستقلال؛ فالهدف قرار قابل للمراجعة لا عبارة ثابتة حتى نهاية العام.","n":["يُبقيها في هدف أصبح دون مستواها.","تعديل بلا مبرر تربوي، وفي الاتجاه الخاطئ.","صحيح: الإتقان المبكر يستدعي رفع التحدي.","إتقان هدف واحد لا يلغي حاجتها في المادة."],"c":"قبل منتصف مدة الخطة","p":"إتقان مبكر مستقل ومتعمم ← ارفع التعقيد أو التعميم."},{"id":"16-36","s":16,"i":"16.5","l":"تحليل","t":"لم يتقدم طلال نحو هدف الطلاقة القرائية خلال ستة أسابيع، وتكشف السجلات أنه غاب عن نصف الجلسات، وأن مستوى النصوص المستخدمة في القياس تغيّر من قياس إلى آخر. ما الإجراء الأنسب أولًا؟","o":["خفض الهدف فورًا؛ لأن عدم التقدم دليل على أنه أعلى من قدرته الحالية.","رفع الهدف؛ لأن تذبذب الأداء يدل على قدرة أكبر لم تظهر بعد.","حذف هدف الطلاقة من الخطة والاكتفاء بهدف الفهم القرائي.","معالجة انتظام الجلسات وتوحيد شروط القياس، ثم جمع بيانات جديدة."],"a":3,"w":"عدم التقدم قد يرجع إلى غياب متكرر أو جرعة تعليمية غير كافية أو قياس غير متسق، لا إلى خطأ الهدف. واختلاف النصوص دون توثيق يجعل البيانات غير قابلة للمقارنة، لذا يُصحَّح التنفيذ والقياس أولًا ثم تُجمع بيانات جديدة.","n":["عدم التقدم لا يعني دائمًا أن الهدف خطأ.","لا تدعمه البيانات، والقياس نفسه غير موثوق.","قرار كبير مبني على بيانات غير صالحة للمقارنة.","صحيح: لم تُختبر ملاءمة الهدف بصورة عادلة بعد."],"c":"غياب متكرر وتغيّر نصوص القياس","p":"حلّل سبب عدم التقدم (تدريس، حضور، قياس) قبل تعديل الهدف."},{"id":"16-37","s":16,"i":"16.5","l":"تطبيق","t":"هدف رنا قراءة كلمات متعددة المقاطع، لكن تحليل أخطائها يكشف أنها لم تتقن بعد دمج المقاطع في الكلمات القصيرة. ما التعديل الأنسب؟","o":["الاستمرار في تدريبها على الكلمات متعددة المقاطع بتكرار أكثر كثافة كل يوم.","استبدال الهدف بحفظ قائمة كلمات متعددة المقاطع شكلًا دون تحليلها.","إضافة هدف مرحلي لدمج المقاطع في كلمات أقصر، ثم العودة إلى الكلمات الأطول.","حذف هدف القراءة من خطتها والتركيز على مهارة الاستماع بدلًا منه."],"a":2,"w":"إذا كان الهدف يتطلب مهارة سابقة لم يتقنها الطالب، يُدرج هدف مرحلي يعالج هذا المتطلب؛ لأن القفز فوقه ينتج حفظًا هشًّا أو فشلًا متكررًا، ثم يُعاد الطالب تدريجيًا إلى المهمة المركبة.","n":["القفز فوق المتطلب السابق ينتج فشلًا متكررًا.","ينتج حفظًا هشًّا لا ينتقل إلى كلمات جديدة.","صحيح: يعالج المتطلب السابق قبل المهارة المركبة.","يخفض التوقعات ويتجاهل حاجة ذات أولوية."],"c":"لم تتقن بعد دمج المقاطع","p":"متطلب سابق مفقود ← هدف مرحلي ثم عودة إلى المهارة المركبة."},{"id":"16-38","s":16,"i":"16.5","l":"تطبيق","t":"تحقق هيفاء دقة عالية في مراجعة إملائها، لكن ذلك يحدث فقط عندما تذكّرها المعلمة بقاعدة المراجعة في كل مرة. ما التعديل الأنسب على هدفها؟","o":["اعتبار الهدف متحققًا بالكامل؛ لأن نسبة الدقة مرتفعة بالفعل في كل القياسات.","تعديل شرط الهدف نحو استخدام استراتيجية المراجعة باستقلال مع تلاشي التذكير.","رفع معيار الدقة المطلوب مع الإبقاء على التذكير نفسه في كل مرة تراجع فيها.","خفض الهدف إلى مراجعة عدد أقل من الكلمات مع استمرار التذكير."],"a":1,"w":"من أهم تطورات الهدف تقليل الاعتماد لا زيادة الدقة فقط. ودقة هيفاء مرتبطة بتذكير مستمر، فيُعدَّل شرط الأداء نحو استخدام الاستراتيجية باستقلال مع تلاشي التذكير تدريجيًا وقياس ذلك.","n":["يتجاهل مستوى الاستقلال بوصفه جزءًا من الهدف.","صحيح: الناتج صحيح لكن السيطرة لم تنتقل إليها.","يرفع الدقة ويُبقي الاعتماد على حاله.","يخفض الهدف دون سبب ويُبقي الاعتماد."],"c":"فقط عندما تذكّرها المعلمة","p":"دقة عالية مع تلميحات ← عدّل شرط الاستقلال لا معيار الدقة."},{"id":"16-39","s":16,"i":"16.5","l":"تحليل","t":"هدف ماجد في العلوم «يفسّر مراحل دورة الماء بدقة»، وهو يفهم المحتوى عند شرحه شفهيًا لكنه يتعثر في قراءة النص الطويل. اقترح عضو في الفريق تغيير الهدف إلى «يسمّي مرحلتين من دورة الماء». ما الحكم الأدق؟","o":["يخفض الهدف دون مبرر؛ فالعائق في الوصول ويُعالَج بتكييف يحفظ الهدف.","مناسب؛ لأن ضعف القراءة يستلزم خفض أهداف جميع المواد الدراسية للطالب.","مناسب؛ لأن الهدف الأسهل يرفع ثقته بنفسه ويضمن تحققه في الموعد المحدد.","غير مناسب؛ لأن أهداف العلوم لا يجوز تعديلها مطلقًا مهما كانت البيانات."],"a":0,"w":"إذا كانت المشكلة في الوصول فقط فلا يُخلط التكييف بتعديل الهدف؛ فتوفير وصول مناسب للنص يحافظ على هدف فهم العلوم. ووجود صعوبات تعلم لا يعني خفض الأهداف تلقائيًا.","n":["صحيح: لا تخلط التكييف بتعديل الهدف.","يعمّم أثر عائق واحد على كل الأهداف.","الواقعية لا تعني السهولة المضمونة.","الحكم صحيح والتعليل خاطئ؛ فالتعديل جائز متى بررته البيانات."],"c":"يفهم المحتوى عند شرحه شفهيًا","p":"إذا كانت المشكلة في الوصول فقط، فهي حاجة إلى تكييف لا إلى خفض الهدف."},{"id":"16-40","s":16,"i":"16.5","l":"تحليل","t":"بعد كل قياس منخفض لهدف كتابة الفقرة، كان المعلم يخفض معيار الإتقان قليلًا، حتى ظهر الهدف «متحققًا» في نهاية الفصل. ما التقويم الأدق لهذه الممارسة؟","o":["ممارسة سليمة؛ لأنها تراعي الفروق الفردية وتحمي الطالب من الإحباط المتكرر.","ممارسة سليمة؛ لأن تعديل المعيار مسموح به في أي وقت ودون حاجة إلى توثيق.","ممارسة خاطئة؛ لأنها تُظهر نجاحًا شكليًا ولا تعالج سبب ضعف التقدم.","ممارسة خاطئة؛ لأن معيار الإتقان يجب أن يكون واحدًا لجميع الطلاب."],"a":2,"w":"خفض معيار الإتقان بعد كل قياس لإظهار النجاح خطأ؛ لأن تعديل المعيار يجب أن يستند إلى معنى تربوي وبيانات وأن يُوثَّق، ولا يكون وسيلة لجعل الهدف يبدو متحققًا بدل تحليل سبب ضعف التقدم.","n":["مراعاة الفروق لا تبرر تزييف التقدم.","أي تعديل يجب أن يكون مبررًا وموثقًا.","صحيح: تعديل المعيار يحتاج مبررًا تربويًا موثقًا.","الحكم صحيح والتعليل خاطئ؛ فالمعايير فردية."],"c":"يخفض معيار الإتقان بعد كل قياس منخفض","p":"لا تخفض المعيار لتُظهر نجاحًا؛ حلّل السبب وعدّل بمبرر موثق."},{"id":"17-01","s":17,"i":"17.1","l":"تطبيق","t":"أنهى فيصل وحدة تقسيم الكلمات إلى مقاطع قبل شهرين، ويستعد معلمه لتدريسه قراءة الكلمات متعددة المقاطع. ما الإجراء الأنسب قبل تقديم المهارة الجديدة؟","o":["يبدأ الكلمات الجديدة مباشرة لأن وحدة المقاطع أُنجزت وسُجّلت في ملفه","يطلب منه تقسيم بضع كلمات قصيرة ليتحقق من بقاء المهارة متاحة له","يعيد تدريس وحدة المقاطع كاملة من بدايتها قبل أي نشاط جديد معه","يراجع معه جميع مهارات القراءة التي درسها منذ بداية العام الدراسي"],"a":1,"w":"الكلمات متعددة المقاطع تعتمد مباشرة على مهارة التقسيم، ومرور الوقت لا يضمن بقاءها متاحة للاسترجاع. لذلك يتحقق المعلم باستجابة قصيرة قبل البناء عليها؛ فإن ثبتت انتقل إلى الجديد، وإن ضعفت أعاد تعليم الجزء الضروري فقط.","n":["يساوي التعرض السابق بالإتقان الحالي؛ ومرور شهرين قد يُضعف الاسترجاع.","صحيح: تحقّق سريع من المتطلب المباشر قبل البناء عليه.","إعادة تدريس كاملة بلا دليل على الحاجة؛ والتنشيط غير إعادة التدريس.","مراجعة شاملة تستهلك الوقت والذاكرة العاملة بلا صلة مباشرة بالمهارة."],"c":"أنهى الوحدة قبل شهرين","p":"لا تفترض بقاء المتطلب السابق ولا تُعِد تدريسه كله؛ تحقّق منه باستجابة قصيرة."},{"id":"17-02","s":17,"i":"17.1","l":"معرفة","t":"أي العبارات التالية يقولها المعلم في بداية الحصة تمثل ربطًا صريحًا بين التعلم السابق والتعلم الجديد؟","o":["درسنا اليوم ممتع وجديد، فركّزوا جيدًا حتى نهاية الحصة لتفهموه كله","تذكّروا أن الرياضيات مهمة في حياتنا اليومية وفي كل مكان من حولنا","سنبدأ اليوم وحدة جديدة تمامًا، فافتحوا الكتاب على أول صفحة من صفحاتها","تعلّمنا أمس جمع العشرات، واليوم نستخدمه لجمع أعداد من ثلاث منازل"],"a":3,"w":"الربط الصريح يحدد للطالب ما الذي سيستدعيه من تعلمه السابق، ولماذا يحتاجه في المهمة الجديدة. هذه العبارة البسيطة تجعل العلاقة بين القديم والجديد مرئية، ولا تترك الطالب ذا الصعوبة يكتشفها وحده.","n":["تمهيد تحفيزي عام لا يكشف أي علاقة بين القديم والجديد.","ربط عام بالحياة لا يحدد المعرفة السابقة اللازمة للدرس.","يقدّم الجديد منفصلًا عمّا سبق، فيبقى الطالب دون جسر.","صحيح: يسمّي المعرفة السابقة ووظيفتها في المهارة الجديدة."],"c":"ربطًا صريحًا","p":"الجسر الصريح = ماذا تعلّمنا + كيف سنستخدمه اليوم."},{"id":"17-03","s":17,"i":"17.1","l":"تطبيق","t":"أتقن سلمان قاعدة كتابة التاء المربوطة في آخر الأسماء المؤنثة مثل «شجرة»، ثم صار يكتب الأفعال بها فيكتب «ذهبة» بدل «ذهبت». ما الإجراء الأنسب؟","o":["يقارن معه أسماءً وأفعالًا متجاورة ويبرز القرينة التي تحدد نوع التاء","يمدح إتقانه لقاعدة الأسماء، ويؤجل تصحيح الأفعال إلى وحدة لاحقة","يطلب منه نسخ قائمة الأفعال الصحيحة عشر مرات حتى يحفظ رسمها","يتوقف عن استخدام قاعدة التاء المربوطة معه حتى لا تختلط عليه القواعد"],"a":0,"w":"الطالب يمتلك قاعدة صحيحة لكنه يمدّها إلى موقف لا تنطبق عليه. وتنشيط هذه المعرفة دون كشف حدودها يعزز الخطأ؛ أما مقارنة أمثلة متجاورة مع إبراز القرينة الفارقة (اسم أم فعل) فتعيد تنظيم المعرفة وتصحح المفهوم صراحة.","n":["صحيح: مقارنة التشابه والاختلاف تكشف حدود القاعدة وتصحح المفهوم.","تأجيل التصحيح يترك المعرفة السابقة الخاطئة تتعزز بالاستخدام.","حفظ آلي لقائمة واحدة لا يعلّم متى تنطبق القاعدة على كلمات جديدة.","يحذف معرفة صحيحة ومفيدة بدل ضبط حدود استخدامها."],"c":"صار يكتب الأفعال بها","p":"المعرفة السابقة الخاطئة تُصحَّح بمقارنة ما يتشابه وما يختلف، لا بالتجاهل ولا بالحذف."},{"id":"17-04","s":17,"i":"17.1","l":"تطبيق","t":"كانت جود تحتاج ثلاثة تلميحات لتبدأ مهمة الكتابة، وبعد أربعة أسابيع أصبحت تبدأ بتلميح واحد في أربع مهام من خمس. أي تغذية راجعة تساعدها أكثر على رؤية تقدمها؟","o":["كنتِ تحتاجين ثلاثة تلميحات، والآن تبدئين بتلميح واحد في أربع مهام من خمس","أداؤكِ هذا الشهر رائع جدًّا، وأصبحتِ من أفضل طالبات المجموعة في الكتابة كلها","ما زلتِ تحتاجين إلى تلميح، والمطلوب أن تبدئي وحدكِ مثل بقية زميلاتكِ","أحسنتِ كثيرًا يا جود، وسأضع لكِ نجمة إضافية في لوحة الصف على جهدكِ"],"a":0,"w":"التغذية الراجعة الموجهة للتقدم تقارن أداء الطالبة بخط أساسها وتسمّي التغير بدقة، فتدرك أن الاستراتيجية والجهد الفعال يؤديان إلى نمو قابل للتكرار. وهذا أنفع لدافعيتها وكفاءتها الذاتية من المدح العام أو المقارنة بالزميلات.","n":["صحيح: تصف ما تغيّر مقارنة بخط الأساس بلغة تفهمها الطالبة.","مدح عام قائم على المقارنة بالزميلات، ولا يوضح ما الذي تحسّن.","تركّز على النقص وتقارنها بغيرها، فتحجب نموها الحقيقي.","مكافأة رمزية بلا معلومات عن التغير في أدائها."],"c":"ثلاثة تلميحات ثم تلميح واحد","p":"سمِّ ما تغيّر مقارنة بخط الأساس، ولا تقارن الطالب بزملائه."},{"id":"17-05","s":17,"i":"17.1","l":"معرفة","t":"ما الفرق الجوهري بين تنشيط المعرفة السابقة وإعادة تدريسها؟","o":["التنشيط يأتي في نهاية الدرس دائمًا، وإعادة التدريس تأتي في بدايته دائمًا","التنشيط استدعاء موجز لما يخدم المهمة الجديدة، وإعادة التدريس علاج لما لم يُتقن","التنشيط يشمل كل المهارات التي تعلّمها الطالب سابقًا، وإعادة التدريس تقتصر على آخرها","التنشيط خاص بمادة الرياضيات، وإعادة التدريس خاصة بمادتي القراءة والكتابة"],"a":1,"w":"تنشيط المعرفة السابقة سؤال موجز أو مثال مألوف أو بطاقة استرجاع تستدعي المتطلب اللازم قبل الجديد. أما إعادة التدريس فتلزم حين يكشف التحقق أن المتطلب غير متقن، وتقتصر على الجزء الضروري منه.","n":["التنشيط يسبق الجديد لا يليه، والتوقيت ليس هو الفارق الجوهري.","صحيح: التنشيط انتقائي وقصير، وإعادة التدريس علاج لفجوة ثابتة.","التنشيط انتقائي يستدعي المتطلب ذا الصلة فقط، لا كل ما تعلّمه الطالب.","كلاهما يُستخدم في جميع المواد؛ الفرق في الوظيفة لا في المادة."],"c":"الفرق الجوهري","p":"نشِّط ما يخدم الجديد باختصار، وأعِد تدريس ما ثبت أنه غير متقن فقط."},{"id":"17-06","s":17,"i":"17.1","l":"تحليل","t":"كرّر المعلم شرح القسمة لسلمان ثلاث مرات بالطريقة نفسها، ولم يستطع سلمان ربطها بالضرب. ما الإجراء الأدق في هذه الحالة؟","o":["يكرر شرح القسمة مرة رابعة مع زيادة عدد التمارين المنزلية المرتبطة بها","يفحص: هل حقائق الضرب منسية، أم غير متقنة، أم العلاقة غير واضحة له؟","ينتقل إلى درس القياس لأن سلمان لم يصبح مستعدًّا لتعلم القسمة بعد","يعطيه جدول القسمة جاهزًا ليحفظه دون الرجوع إلى حقائق الضرب السابقة"],"a":1,"w":"عندما يفشل الربط يكون الخلل غالبًا في الجسر نفسه: متطلب منسي يحتاج استرجاعًا، أو غير متقن يحتاج إعادة تعليم، أو علاقة غير صريحة تحتاج تمثيلًا. وتحديد المصدر يوجه التدخل بدل تكرار الدرس الجديد.","n":["تكرار الجديد بالطريقة نفسها لا يعالج خللًا في المتطلب السابق.","صحيح: يحدد مصدر انقطاع الجسر قبل اختيار التدخل.","يتجاوز المشكلة دون تشخيص، فتبقى الفجوة قائمة.","حفظ منفصل يقطع العلاقة العكسية التي تمنح القسمة معناها."],"c":"كرّر الشرح بالطريقة نفسها","p":"إذا فشل الربط فافحص المتطلب السابق والجسر، ولا تكرر الجديد فقط."},{"id":"17-07","s":17,"i":"17.1","l":"تطبيق","t":"تريد معلمة استخدام منظم بصري يربط الجملة المكتملة التي أتقنتها الطالبة بكتابة الفقرة. أي تصميم أنسب؟","o":["خريطة كبيرة ملونة تجمع كل قواعد الكتابة التي درستها منذ بداية العام","نموذج فقرة جاهز تحفظه الطالبة وتعيد كتابته في كل موضوع جديد يُطلب","رسم جذاب يرتبط بموضوع القصة دون أن يوضح بنية الفقرة وأجزاءها","جدول بسيط من ثلاث خانات: ما أعرفه، وما الجديد، والعلاقة بينهما"],"a":3,"w":"المنظم البصري يفيد حين يوضح البناء المتدرج: الجملة المكتملة وحدة متقنة، والفقرة تنظم عدة جمل حول فكرة مركزية. وشرطه أن يبقى بسيطًا ولا يتحول إلى ازدحام يرهق الذاكرة العاملة.","n":["ازدحام بصري يرفع الحمل المعرفي ويخفي العلاقة الحاسمة.","حفظ نموذج ثابت لا يبني فهم بنية الفقرة ولا ينتقل إلى مواقف جديدة.","ربط سطحي بالموضوع لا بالمفهوم المستهدف.","صحيح: بسيط ويُظهر البناء المتدرج من الجملة إلى الفقرة."],"c":"يربط الجملة المكتملة بكتابة الفقرة","p":"المنظم البصري الجيد بسيط ويُظهر العلاقة بين المعلوم والجديد."},{"id":"17-08","s":17,"i":"17.1","l":"تحليل","t":"قدّم معلمان ربطًا لدرس الضرب: الأول اختار مسألة جديدة لأن رسومها تشبه رسوم مسألة الأمس، والثاني بيّن أن الضرب تجميع لمجموعات متساوية كالجمع المتكرر. ما الحكم الأدق؟","o":["الربطان متكافئان في قيمتهما ما دام الطالب يتذكر مسألة الأمس في الحالتين","ربط الأول أفضل لأن التشابه البصري يجذب انتباه الطالب ذي الصعوبة أكثر","ربط الثاني يرفع الحمل المعرفي، فلا يناسب الطلاب ذوي صعوبات التعلم عادة","ربط الثاني مفاهيمي يقبل النقل، وربط الأول سطحي قائم على الشكل"],"a":3,"w":"الربط الأقوى يقوم على العلاقة الأساسية (الضرب مجموعات متساوية) لا على تشابه اللون أو الشكل أو موضوع القصة. وفهم العلاقة يتيح للطالب نقل الفكرة إلى أمثلة لا تشبه مثال التدريب في مظهرها.","n":["تذكّر المثال لا يعني فهم العلاقة؛ قيمة الربط في مضمونه.","الجاذبية البصرية لا تعلّم قاعدة قابلة للنقل.","الربط المفاهيمي المركّز لا يرفع الحمل؛ كثرة التفاصيل هي التي ترفعه.","صحيح: الربط القائم على القاعدة يدعم التعميم."],"c":"رسومها تشبه / مجموعات متساوية","p":"اختر الربط القائم على المفهوم لا على الشكل."},{"id":"17-09","s":17,"i":"17.1","l":"تطبيق","t":"يتدرب طالب في الصف الرابع على الطلاقة القرائية. أي إجراء يُشركه في رؤية تقدمه بصورة أنسب؟","o":["يطّلع كل أسبوع على ترتيبه بين زملائه في عدد الكلمات التي قرأها في الدقيقة","يسجّل بنفسه كلماته الصحيحة في الدقيقة على رسم بسيط ويقارنها ببدايته وهدفه","يحصل على ملصق ملون في نهاية كل حصة يُكمل فيها قراءة النص دون أي توقف","يتسلم تقرير المعلم المفصّل عن مستواه القرائي بعد انتهاء الفصل الدراسي"],"a":1,"w":"إشراك الطالب في تسجيل بياناته يجعل التقدم مرئيًّا له ويزيد ملكيته لتعلمه، بشرط أن تكون الأداة بسيطة وأن تكون المقارنة بخط أساسه وهدفه الفردي لا بزملائه.","n":["مقارنة اجتماعية قد تحجب نموه الحقيقي وتضعف دافعيته.","صحيح: مشاركة الطالب في بياناته مقارنةً بخط أساسه وهدفه.","مكافأة على الإكمال لا تُظهر تغيرًا حقيقيًّا في الأداء.","بيانات متأخرة لا يشارك الطالب في متابعتها أثناء التعلم."],"c":"يُشركه في رؤية تقدمه","p":"رسم تقدم بسيط يسجله الطالب ويقارنه ببدايته وهدفه."},{"id":"17-10","s":17,"i":"17.1","l":"تحليل","t":"أي الشواهد التالية أقوى دلالة على أن الطالب نقل مهارة تقسيم المقاطع إلى موقف جديد؟","o":["يقرأ بدقة كلمات القائمة نفسها التي تدرّب عليها طوال الأسبوع","يقسّم كلمة لم يتدرب عليها في نص العلوم دون تذكير من المعلم","يردد قاعدة تقسيم المقاطع بالصياغة التي شرحها المعلم في الحصة","يقسّم كلمات جديدة إلى مقاطع بعد أن يذكّره المعلم بالقاعدة أولًا"],"a":1,"w":"التعميم يظهر حين يستخدم الطالب المعرفة السابقة في مثال أو سياق جديد دون تلميح مباشر. والنجاح في القائمة المدرَّبة أو بعد التذكير مؤشر مرحلي، لكنه لا يثبت أن العلاقة أصبحت مرنة ومستقلة.","n":["نجاح في مادة التدريب نفسها لا يثبت النقل.","صحيح: سياق جديد مع غياب التلميح دليل تعميم حقيقي.","تكرار القاعدة لفظيًّا لا يعني تطبيقها.","نقل جزئي؛ لأنه ما زال يعتمد على تلميح المعلم."],"c":"لم يتدرب عليها ... دون تذكير","p":"دليل التعميم: سياق جديد بلا تلميح."},{"id":"17-11","s":17,"i":"17.1","l":"تحليل","t":"عند تقديم مفهوم الكسور، ربط المعلم الدرس بخمس قصص حياتية وثلاث قواعد سابقة ومثالين من مادة أخرى في الحصة نفسها، فتشتت الطلاب. ما الخلل الأدق؟","o":["الروابط الحياتية لا تصلح أصلًا لتدريس الرياضيات لذوي صعوبات التعلم","كان ينبغي تقديم المفهوم الجديد مباشرة دون أي ربط بالتعلم السابق","كثرة الروابط رفعت العبء على الذاكرة العاملة وأخفت العلاقة الحاسمة","عدد القصص لم يكن كافيًا لجذب انتباه جميع الطلاب طوال الحصة"],"a":2,"w":"تقديم روابط كثيرة في وقت واحد يزيد العبء على الذاكرة العاملة، فتتنافس التفاصيل غير الضرورية مع العلاقة الأساسية. والربط الفعال انتقائي: رابط واضح بين متطلب سابق محدد والمفهوم الجديد.","n":["الخبرة الحياتية مفيدة إذا أوضحت المفهوم ثم عاد المعلم إلى القاعدة.","الخلل في كثرة الروابط لا في مبدأ الربط نفسه.","صحيح: الأفضل إبراز رابط حاسم وتقليل التفاصيل غير الضرورية.","زيادة القصص تزيد الحمل المعرفي ولا تعالجه."],"c":"خمس قصص وثلاث قواعد ومثالان","p":"أبرز الرابط الحاسم وقلّل التفاصيل غير الضرورية."},{"id":"17-12","s":17,"i":"17.2","l":"معرفة","t":"متى تُعدّ النتيجة التي يقدمها المعلم بعد سلوك الطالب «معززًا» بالمعنى الوظيفي؟","o":["إذا كانت مرغوبة لدى أغلب طلاب الصف في العادة","إذا قصد المعلم بها تشجيع الطالب على الأداء الجيد","إذا قُدّمت فور حدوث السلوك مباشرة دون أي تأخير","إذا زاد احتمال تكرار السلوك المستهدف بعد تقديمها"],"a":3,"w":"التعزيز نتيجة تلي السلوك وتزيد احتمال تكراره مستقبلًا. فالنتيجة لا تُسمى معززًا لأنها مكافأة أو لأن المعلم قصد التشجيع، بل لأن البيانات أظهرت أن السلوك زاد بعدها.","n":["ما يعزز أغلب الطلاب قد لا يعزز هذا الطالب؛ فالمعزز فردي.","نية المعلم لا تحدد الوظيفة؛ الأثر هو المعيار.","الفورية تقوي الأثر في الاكتساب، لكنها ليست تعريف المعزز.","صحيح: المعزز يُعرَف بأثره في السلوك."],"c":"بالمعنى الوظيفي","p":"اسأل دائمًا: هل زاد السلوك بعد النتيجة؟"},{"id":"17-13","s":17,"i":"17.2","l":"معرفة","t":"كلما راجعت ريم إجابتها بقائمة التحقق قبل التسليم، أعفتها المعلمة من إعادة حل التمارين المماثلة في الواجب، فازداد استخدامها لقائمة التحقق. ما الذي يمثله هذا الإجراء؟","o":["تعزيز سلبي؛ لأن إزالة مهمة غير مرغوبة زادت السلوك","عقاب؛ لأن الطالبة حُرمت من فرصة حل تمارين إضافية","تعزيز إيجابي؛ لأن الطالبة حصلت على مكافأة ملموسة واضحة","إطفاء؛ لأن المعلمة أوقفت نتيجة كانت تتبع السلوك"],"a":0,"w":"التعزيز السلبي إزالة مثير غير مرغوب أو تخفيفه بعد السلوك بما يزيد تكراره. وهو ليس عقابًا ولا تقديمًا لشيء سلبي للطالب؛ فالحكم يكون بأثر الإجراء: هل زاد السلوك أم نقص؟","n":["صحيح: «سلبي» تعني الإزالة، و«تعزيز» تعني زيادة السلوك.","العقاب يُضعف السلوك، والسلوك هنا ازداد.","لم يُضَف شيء مرغوب، بل أُزيل شيء غير مرغوب.","الإطفاء إيقاف تعزيز سابق يؤدي إلى تراجع السلوك، والسلوك هنا ازداد."],"c":"أعفتها ... فازداد استخدامها","p":"سلبي = إزالة، وتعزيز = زيادة السلوك؛ فلا تخلطه بالعقاب."},{"id":"17-14","s":17,"i":"17.2","l":"تطبيق","t":"بدأ عبدالله اليوم تعلّم قراءة المد بالألف لأول مرة. ما نمط التعزيز الأنسب في هذه المرحلة؟","o":["تعزيز متقطع بعد عدة جلسات حتى لا يعتاد انتظار المعزز من البداية","تأجيل التعزيز حتى يقرأ النص كاملًا دون أي خطأ في المد بالألف","تعزيز قريب ومتكرر لقراءته الصحيحة للمد، مع تغذية راجعة فورية","تعزيز سرعته في قراءة الكلمات لأن الطلاقة هي هدف هذه المرحلة"],"a":2,"w":"في مرحلة الاكتساب يحتاج الطالب تعزيزًا قريبًا ومتكررًا نسبيًّا للاستجابات الصحيحة والمحاولات المناسبة، مع تغذية راجعة فورية وتصحيح واضح للأخطاء، حتى تتضح له العلاقة بين ما فعله ونتيجته.","n":["جدول يناسب مرحلة الاحتفاظ بعد ثبات المهارة لا بدايتها.","انتظار الأداء الكامل يحرمه من بناء سلسلة نجاح تدريجية.","صحيح: الاكتساب يحتاج علاقة واضحة بين الاستجابة والنتيجة.","الطلاقة تأتي بعد استقرار الدقة، لا في أول التعلم."],"c":"لأول مرة","p":"مهارة جديدة = تعزيز قريب ومتكرر + تغذية راجعة فورية."},{"id":"17-15","s":17,"i":"17.2","l":"تطبيق","t":"تقرأ جود نصوص صفها بدقة مستقرة عالية منذ أسابيع، لكن قراءتها بطيئة جدًّا. ما المعيار الأنسب لتعزيز أدائها في المرحلة التالية؟","o":["زيادة عدد الكلمات الصحيحة في الدقيقة مع بقاء الدقة والفهم","كل زيادة في سرعتها حتى لو صاحبها ارتفاع في عدد الأخطاء","كل كلمة تقرؤها قراءة صحيحة كما كان في بداية تعلّمها","إيقاف التعزيز كليًّا لأن الدقة المستقرة تعني إتقان المهارة"],"a":0,"w":"عندما تستقر الدقة ينتقل التعزيز إلى أداء أكثر سلاسة وكفاءة. لكن المعيار يجب أن يعكس المهارة كاملة، فلا تُعزَّز السرعة إذا أدت إلى أخطاء أو فقدان للفهم.","n":["صحيح: الطلاقة كفاءة أداء مع المحافظة على الدقة والمعنى.","تعزيز السرعة وحدها قد يزيد الأخطاء ويضعف الفهم.","معيار مرحلة الاكتساب؛ يبقيها دون تقدم نحو الطلاقة.","الدقة وحدها ليست نهاية التعلم؛ فالطلاقة ما زالت هدفًا."],"c":"دقة مستقرة ... بطيئة جدًّا","p":"في الطلاقة عزّز السرعة المقرونة بالدقة والفهم."},{"id":"17-16","s":17,"i":"17.2","l":"تحليل","t":"أتقن فيصل حقائق الضرب منذ ستة أسابيع ويحافظ على دقة عالية، لكنه يسأل بعد كل مسألة: «كم نقطة سآخذ؟». ما القرار الأدق؟","o":["إيقاف النقاط فورًا لأن سؤاله دليل واضح على اعتماده الزائد عليها","زيادة قيمة النقاط حتى يحافظ على مستوى دقته الحالي في الضرب","إعادة تدريس حقائق الضرب لأن سؤاله يدل على ضعف في إتقانه","انتقال تدريجي إلى تعزيز متقطع ونتائج طبيعية مع مراجعات موزعة"],"a":3,"w":"بعد الإتقان والاستقرار تصبح المرحلة مرحلة احتفاظ، فيقل التعزيز الاصطناعي تدريجيًّا ويصبح متقطعًا مع مراجعات موزعة. وسؤال الطالب عن النقاط بعد كل استجابة إشارة إلى ضرورة التلاشي، لكن بتدرج لا بقطع مفاجئ.","n":["القطع المفاجئ قبل استقرار النتائج الطبيعية قد يخفض الأداء.","يعمّق الاعتماد على المكافأة بدل تخفيفه.","البيانات تُظهر إتقانًا؛ والمشكلة في جدول التعزيز لا في المهارة.","صحيح: المهارة مستقرة، فيُخفَّف الاعتماد على المعزز تدريجيًّا."],"c":"يحافظ على دقة عالية ... كم نقطة سآخذ","p":"إتقان مستقر مع انتظار المكافأة = تلاشٍ تدريجي، لا زيادة ولا قطع."},{"id":"17-17","s":17,"i":"17.2","l":"تطبيق","t":"تطبّق ريم استراتيجية تحديد الفكرة الرئيسة بنجاح في غرفة المصادر، لكنها لا تستخدمها في نصوص العلوم داخل الصف. ما وجهة التعزيز الأنسب الآن؟","o":["زيادة المكافآت داخل غرفة المصادر حتى يرتفع أداؤها هناك أكثر من ذي قبل","إعادة تعليم الاستراتيجية من بدايتها لأنها لم تُتقنها بعد إتقانًا كاملًا","تعزيز استخدامها للاستراتيجية في نصوص العلوم بالتنسيق مع معلمة الصف","انتظار انتقال المهارة تلقائيًّا مع الوقت دون أي تدخل مقصود من المعلمة"],"a":2,"w":"في مرحلة التعميم يُعزَّز استخدام المهارة مع مواد وأشخاص وبيئات وأمثلة جديدة، لا في جلسة التدريب وحدها. ويصبح نجاح الطالبة الوظيفي في الصف جزءًا من التعزيز.","n":["تعزيز النجاح المقيد بالمكان لا يعالج مشكلة النقل.","نجاحها في الغرفة يدل على الاكتساب؛ والخلل في التعميم.","صحيح: المرحلة تعميم، فيُعزَّز النقل إلى السياق الجديد.","التعميم يحتاج تخطيطًا وفرصًا معززة، ولا يحدث تلقائيًّا غالبًا."],"c":"بنجاح في غرفة المصادر ... لا في العلوم","p":"ينجح في مكان التدريب فقط؟ عزّز استخدامه في السياق الجديد."},{"id":"17-18","s":17,"i":"17.2","l":"تطبيق","t":"يكتب سلمان جملة واحدة فقط عندما يُطلب منه كتابة فقرة، والهدف فقرة من خمس جمل مترابطة. أي إجراء يطبق أسلوب التشكيل؟","o":["حجب التعزيز كليًّا حتى يكتب الفقرة كاملة بخمس جمل مترابطة وصحيحة","تعزيز الجملة الواحدة باستمرار لأنها أقصى ما يستطيع كتابته حاليًّا","تعزيز كتابة جملتين مترابطتين أولًا، ثم رفع المعيار تدريجيًّا حتى خمس","خفض الهدف النهائي إلى جملتين مترابطتين وتثبيته في خطته الفردية"],"a":2,"w":"التشكيل تعزيز تقاربات متتابعة نحو أداء نهائي لم يظهر كاملًا بعد. يبدأ المعلم بخطوة قريبة من أداء الطالب الحالي، ثم يرفع معيار التعزيز تدريجيًّا حتى يصل إلى الهدف.","n":["انتظار الأداء الكامل من البداية يناقض فكرة التشكيل.","لا يرفع المعيار، فيبقى الأداء عند مستواه الحالي.","صحيح: تعزيز تقاربات متتابعة مع رفع المعيار خطوة خطوة.","يخفض التوقع بدل بناء الأداء المستهدف تدريجيًّا."],"c":"جملة واحدة ... والهدف خمس","p":"التشكيل = عزّز الاقتراب من الهدف ثم ارفع المعيار تدريجيًّا."},{"id":"17-19","s":17,"i":"17.2","l":"تحليل","t":"كان وقت الحاسب اللوحي معززًا فعالًا لفيصل، ثم توقف أثره في أدائه رغم أن المعلم زاد مدته من خمس دقائق إلى عشر. ما الإجراء الأنسب؟","o":["مضاعفة المدة مرة أخرى حتى يستعيد المعزز أثره السابق في أداء فيصل","الاستمرار عليه كما هو لأن فيصل ما زال يطلبه ويختاره عند السؤال","استبدال الهدف بهدف أسهل لأن السلوك لم يعد قابلًا للتعزيز أصلًا","إعادة تقييم تفضيلاته وتجريب بديل مناسب مع متابعة أثره في الأداء"],"a":3,"w":"قد يفقد المعزز قيمته بالإشباع أو بتغير التفضيلات. لذلك لا يزيد المعلم كميته تلقائيًّا، بل يعيد تقييم التفضيلات ومرحلة التعلم، ويختار نتيجة أكثر ملاءمة، ثم يتحقق من أثرها في البيانات.","n":["زيادة كمية معزز فقد قيمته قد تعمّق الإشباع.","التفضيل وحده لا يثبت أنه ما زال يعزز السلوك.","الخلل في المعزز لا في قابلية السلوك للتعزيز.","صحيح: قيمة المعزز تتغير، والبيانات الحالية هي الحكم."],"c":"توقف أثره رغم زيادة مدته","p":"معزز فقد أثره؟ أعد تقييمه، ولا تزد كميته تلقائيًّا."},{"id":"17-20","s":17,"i":"17.2","l":"معرفة","t":"ما الميزة الأساسية للانتقال من التعزيز المستمر إلى التعزيز المتقطع بعد ثبات السلوك؟","o":["يرفع قيمة المعزز لأن الطالب يحصل عليه بعد كل استجابة صحيحة","يسرّع اكتساب المهارات الجديدة في بداية تعلمها لدى الطالب","يجعل الأداء أقل اعتمادًا على التعزيز وأكثر مقاومة للانطفاء","يغني المعلم عن متابعة بيانات السلوك المستهدف بعد ذلك"],"a":2,"w":"التعزيز المستمر مفيد غالبًا في بداية اكتساب السلوك، لكنه ليس الخطة النهائية. وبعد ثبات السلوك تجعل الجداول المتقطعة الأداء أقل اعتمادًا على النتيجة في كل مرة وأكثر مقاومة للانطفاء.","n":["هذا وصف للتعزيز المستمر لا المتقطع.","المستمر هو الأنسب غالبًا في بداية الاكتساب.","صحيح: الجدول المتقطع يدعم الصيانة والاستدامة.","البيانات تبقى ضرورية للحكم على استمرار الأداء."],"c":"بعد ثبات السلوك","p":"مستمر في البداية، ومتقطع بعد الثبات."},{"id":"17-21","s":17,"i":"17.2","l":"تطبيق","t":"في مرحلة الاستقلال، أخطأت طالبة في مسألة، ثم اكتشفت خطأها بنفسها وصححته باستخدام خطوات التحقق. ما الذي ينبغي أن يعززه المعلم؟","o":["استخدامها خطوات التحقق واكتشافها الخطأ وتصحيحه ذاتيًّا","لا شيء؛ لأن التعزيز بعد الخطأ يعزز الخطأ نفسه لديها","الإجابة النهائية الصحيحة فقط دون الإشارة إلى الخطوات","سرعتها في إنهاء المسائل مقارنة بأدائها في الحصة السابقة"],"a":0,"w":"في مرحلة الاستقلال يُعزَّز البدء الذاتي واختيار الاستراتيجية والمراقبة والتصحيح الذاتي. ولا يُعزَّز الخطأ نفسه، لكن يُعزَّز استخدام إجراء التصحيح لأنه سلوك تعلم يبني الاستقلال.","n":["صحيح: المراقبة والتصحيح الذاتي سلوكا استقلال يستحقان التعزيز.","يُعزَّز التصحيح الذي تلا الخطأ، لا الخطأ نفسه.","يُغفل السلوك القابل للتكرار الذي أوصلها إلى الصواب.","السرعة ليست هدف هذا الموقف، وقد تأتي على حساب الدقة."],"c":"اكتشفت خطأها بنفسها وصححته","p":"عزّز السلوك الذي سبق النتيجة مباشرة؛ وهو هنا التصحيح الذاتي."},{"id":"17-22","s":17,"i":"17.3","l":"تطبيق","t":"تقول ريم «لا أعرف» وتترك المسألة فور مواجهة أي صعوبة. أي سلوك بديل أنسب لتعزيزه لديها؟","o":["أن تجرّب خطوتين من استراتيجية الحل ثم تطلب تلميحًا محددًا","أن تنتظر بهدوء حتى تمر المعلمة عليها وتشرح لها طريقة الحل","أن تنتقل مباشرة إلى المسألة التالية دون أن تطلب أي مساعدة","أن تطلب الإجابة من المعلمة بأدب بدل أن تقول «لا أعرف»"],"a":0,"w":"تعزيز السلوك البديل (DRA) يبني سلوكًا يؤدي وظيفة مناسبة بدل السلوك غير المرغوب. والمطلوب هنا محاولة باستراتيجية متفق عليها ثم طلب مساعدة محددة، لا تعزيز طلب الإجابة قبل المحاولة.","n":["صحيح: بديل وظيفي يحافظ على المحاولة والمثابرة.","يعزز الاعتماد على المعلمة بدل المحاولة.","صورة أخرى من ترك المهمة والهروب منها.","تأدب في الصياغة، لكنه طلب للإجابة قبل المحاولة."],"c":"تترك المسألة فور مواجهة أي صعوبة","p":"عزّز «محاولة + طلب مساعدة محدد»، لا الهروب ولا طلب الإجابة الجاهزة."},{"id":"17-23","s":17,"i":"17.3","l":"معرفة","t":"أي مما يلي من شروط نجاح نظام الاقتصاد الرمزي مع الطلاب ذوي صعوبات التعلم؟","o":["قواعد معلنة بسيطة ومعيار واضح وخطة تلاشٍ نحو التعزيز الطبيعي","تغيير أسعار المكافآت يوميًّا لإبقاء الطلاب متحمسين للنظام دائمًا","استمرار النظام دون أي تغيير طوال سنوات المرحلة الدراسية كلها","منح الرموز على إكمال الأوراق بصرف النظر عن جودة الأداء فيها"],"a":0,"w":"يحصل الطالب في الاقتصاد الرمزي على رموز وفق قواعد معلنة ثم يستبدلها بنتائج متفق عليها. ونجاحه يتطلب معيارًا واضحًا وقواعد بسيطة وخطة تلاشٍ مخططة منذ البداية حتى لا يصبح النظام مصدر اعتماد دائم.","n":["صحيح: الوضوح والبساطة والتلاشي أركان النظام الرمزي.","تغيير القواعد عشوائيًّا يربك الطالب ويضعف صلة النتيجة بالسلوك.","الرموز وسيلة لا غاية؛ وبقاؤها بلا تلاشٍ يصنع الاعتماد.","يحوّل التعزيز إلى إنتاج كمي لا يضمن جودة التعلم."],"c":"شروط نجاح نظام الاقتصاد الرمزي","p":"الرموز وسيلة مؤقتة: قواعد بسيطة + معيار واضح + تلاشٍ."},{"id":"17-24","s":17,"i":"17.3","l":"تطبيق","t":"تريد معلمة كتابة عقد سلوكي مع طالبة تسلّم فقراتها دون مراجعة. أي صياغة أنسب لبند العقد؟","o":["أراجع فقرتي بقائمة التحقق قبل تسليمها في أربع مهام من خمس، ثم أختار نشاطًا","أكون طالبة مجتهدة ومنظمة، وأحرص دائمًا على أن تكون أعمالي جميلة ومرتبة ونظيفة","إذا سلّمت فقرة دون مراجعة فسأُحرم من الفسحة ومن نشاط نهاية الأسبوع مع زميلاتي كلهن","أراجع جميع أعمالي في كل المواد دائمًا، ولا أقع في أي خطأ إملائي أو نحوي أبدًا"],"a":0,"w":"العقد السلوكي اتفاق واضح يحدد السلوك المتوقع ومعيار النجاح وطريقة المتابعة والنتيجة. والعقد الجيد قصير وإيجابي وواقعي وقابل للقياس، لا قائمة تهديدات ولا عبارات عامة.","n":["صحيح: إيجابي، قصير، قابل للقياس، ويحدد المعيار والنتيجة.","عبارة عامة غير قابلة للقياس ولا تحدد السلوك المطلوب.","صيغة تهديد وعقوبة، والعقد الجيد إيجابي.","غير واقعي ويتجاوز السلوك المستهدف إلى كل المواد."],"c":"تسلّم فقراتها دون مراجعة","p":"العقد الجيد: سلوك محدد + معيار قابل للقياس + نتيجة إيجابية."},{"id":"17-25","s":17,"i":"17.3","l":"تطبيق","t":"يحب فيصل الرسم ويتجنب كتابة الجمل. أي ترتيب يطبق مبدأ بريماك تطبيقًا صحيحًا؟","o":["ارسم خمس دقائق أولًا لتهدأ، ثم اكتب بعدها ثلاث جمل كاملة","إن لم تكتب الجمل الثلاث كاملة فلن ترسم بقية هذا الأسبوع","يمكنك أن ترسم أو تكتب الجمل اليوم، والخيار لك وحدك فيهما","بعد أن تكتب ثلاث جمل وفق المعيار، يمكنك أن ترسم خمس دقائق"],"a":3,"w":"مبدأ بريماك يجعل النشاط مرتفع الاحتمال (الرسم) تابعًا لأداء النشاط الأقل احتمالًا (الكتابة) وفق معيار واضح. وصيغة «بعد أن... يمكنك» هي جوهر المبدأ.","n":["عكسٌ للترتيب؛ النشاط المفضل يسبق المهمة فيفقد أثره.","تهديد بالحرمان لا ترتيب تعزيزي إيجابي.","خيار بلا اشتراط يلغي المهمة المستهدفة.","صحيح: النشاط مرتفع الاحتمال يتبع السلوك المستهدف."],"c":"يحب الرسم ويتجنب الكتابة","p":"بريماك: المهمة المستهدفة أولًا ثم النشاط المفضل."},{"id":"17-26","s":17,"i":"17.3","l":"تحليل","t":"يطلب سلمان من المعلم التحقق من كل خطوة في المسألة، فيسأله أكثر من عشر مرات في الحصة. ما الأسلوب الأنسب؟","o":["تعزيز غياب طلب التحقق تمامًا طوال الحصة حتى يعتمد على نفسه كليًّا","تجاهل جميع طلباته للتحقق إلى أن يتوقف عنها من تلقاء نفسه نهائيًّا","تعزيز خفض معدل طلب التحقق إلى حد مناسب، مع تعليمه التحقق الذاتي","الاستجابة الفورية لكل طلب تحقق يقدمه حتى يشعر بالأمان ويطمئن"],"a":2,"w":"طلب التحقق سلوك مقبول في أصله، لكنه يحدث أكثر من المناسب. لذلك يناسبه تعزيز المعدلات المنخفضة (DRL) الذي يخفض التكرار إلى مستوى مناسب، مع تعليم المراقبة الذاتية حتى ينتقل التحقق إلى الطالب نفسه.","n":["يلغي سلوكًا مقبولًا عند الحاجة بدل ضبط معدله.","يحرمه من مساعدة مشروعة ولا يعلّمه بديلًا.","صحيح: خفض معدل سلوك مقبول أصلًا (DRL) مع بناء الضبط الذاتي.","يعزز الإفراط في الاعتماد على المعلم."],"c":"يسأله أكثر من عشر مرات","p":"سلوك مقبول لكنه مفرط؟ فكّر في DRL مع مراقبة ذاتية."},{"id":"17-27","s":17,"i":"17.3","l":"تطبيق","t":"يخمّن طالب الكلمات غير المألوفة من حرفها الأول. ما الذي يعززه المعلم ليبني سلوك قراءة قابلًا للتكرار؟","o":["عدد الصفحات التي يقرؤها في كل حصة بالغرفة","توقفه عند الكلمة وتحليلها صوتيًّا قبل نطقها","سرعته في الإجابة حتى لا يتردد أمام الكلمة","نطقه الكلمة صحيحة أيًّا كانت طريقة وصوله"],"a":1,"w":"الأفضل أن يُعزَّز استخدام العملية التي يمكن تكرارها، لا الإجابة الصحيحة وحدها. فتعزيز توقف الطالب وتحليله للكلمة يجعل التحليل عادة، ثم يُقلَّل التعزيز الخارجي عندما يستقر.","n":["تعزيز الكم لا يعالج التخمين.","صحيح: يعزز استراتيجية يمكن تكرارها مع كلمات جديدة.","السرعة تعزز التخمين نفسه.","قد يصيب بالتخمين، فلا يُبنى سلوك قابل للنقل."],"c":"يخمّن الكلمات من حرفها الأول","p":"عزّز الاستراتيجية لا الناتج وحده."},{"id":"17-28","s":17,"i":"17.3","l":"تحليل","t":"طبّقت معلمة نظام نقاط مع طالب ثلاثة أسابيع بانتظام، وتقول إنه «يحب النظام كثيرًا»، بينما بقيت دقته في حل المسائل عند خط الأساس. ما الحكم الأدق؟","o":["النظام ناجح لأن الطالب يُقبل عليه ويطلب النقاط في كل حصة باستمرار","الطالب غير قادر على التحسن، فيُخفض هدفه في خطته التربوية الفردية","النظام لم يثبت فاعليته؛ فيُراجع المعزز والشرط والمعيار والتوقيت","يُضاف إلى النظام مزيد من القواعد والنقاط حتى يزداد أثره في الطالب"],"a":2,"w":"يُحكم على أسلوب التعزيز بمقارنة الأداء بخط الأساس. فإذا لم يتحسن الهدف بعد تطبيق متسق، يفحص المعلم: هل السلوك محدد؟ هل المعزز ذو قيمة؟ هل الشرط مفهوم؟ هل التوقيت قريب؟ هل المهمة مناسبة؟","n":["حب الطالب للنظام لا يثبت أثره في الدقة.","يلوم الطالب قبل تحليل أسباب إخفاق التعزيز.","صحيح: الفاعلية تُقاس بتغير السلوك المستهدف لا بالانطباع.","التعقيد يستهلك وقت التعلم ولا يعالج سبب الإخفاق."],"c":"يحب النظام ... بقيت دقته عند خط الأساس","p":"التفضيل لا يساوي الفاعلية؛ البيانات هي الحكم."},{"id":"17-29","s":17,"i":"17.3","l":"معرفة","t":"ما الشرط الأساسي لنجاح التعزيز الذاتي لدى طالب ذي صعوبات تعلم؟","o":["ترك الطالب يقرر متى يستحق المكافأة دون أي متابعة","معيار موضوعي واضح مع فحص دوري لدقة تقييمه لأدائه","إلغاء تقييم المعلم فور بدء الطالب في التعزيز الذاتي","أن تكون مكافأته الذاتية أكبر من مكافأة المعلم السابقة"],"a":1,"w":"بعد تدريب مناسب، يحدد الطالب تحقق معيار محدد ويمنح نفسه نقطة أو يسجل نجاحًا. ولأن تقديره قد يكون غير دقيق في البداية، يلزم معيار موضوعي وفحص دوري لدقة مراقبته.","n":["دون معيار ومتابعة قد يمنح نفسه النتيجة بلا أداء.","صحيح: المعيار والتحقق من الدقة ضمانة التعزيز الذاتي.","الانتقال تدريجي، ويُقارن تقييمه بتقييم المعلم أولًا.","حجم المكافأة ليس شرط النجاح، والمعزز الأكبر ليس الأفضل دائمًا."],"c":"نجاح التعزيز الذاتي","p":"التعزيز الذاتي = معيار واضح + تحقق دوري من الدقة."},{"id":"17-30","s":17,"i":"17.3","l":"تطبيق","t":"تريد معلمة استخدام التعزيز الجماعي مع مجموعة قراءة صغيرة في غرفة المصادر. أي تطبيق أنسب؟","o":["هدف جماعي مع متابعة أداء كل طالب، دون تحميل أحد مسؤولية حرمان المجموعة","تحصل المجموعة كلها على المكافأة إذا أنهى أسرع طلابها المهمة قبل الآخرين","تُحرم المجموعة كلها من المكافأة إذا أخطأ طالب واحد فقط من أفرادها","يُعلن ترتيب الطلاب يوميًّا أمام المجموعة لإشعال روح المنافسة بينهم"],"a":0,"w":"يمكن استخدام هدف جماعي بشرط الحفاظ على المساءلة الفردية، حتى لا يحصل بعض الطلاب على النتائج اعتمادًا على غيرهم، ولا يتحمل طالب مسؤولية حرمان زملائه فيتعرض للإحراج.","n":["صحيح: هدف مشترك مع مساءلة فردية ودون إحراج.","يحصل الآخرون على النتيجة اعتمادًا على أداء غيرهم.","يحمّل طالبًا مسؤولية حرمان المجموعة ويعرّضه للإحراج.","منافسة اجتماعية قد تُحبط، ولا يُبدأ بها عادة."],"c":"التعزيز الجماعي","p":"جماعي نعم، لكن مع مساءلة فردية وبلا إحراج."},{"id":"17-31","s":17,"i":"17.3","l":"تحليل","t":"لعبة رقمية لتعليم أصوات الحروف تجذب الطلاب بنقاطها ومؤثراتها، لكن بيانات أسبوعين أظهرت أن دقتهم في ربط الحرف بصوته لم تتغير. ما الاستنتاج الأدق؟","o":["اللعبة ناجحة لأن الطلاب يقضون فيها وقتًا أطول بحماس واضح","تُعتمد اللعبة لأن مشاركة الطلاب فيها دليل كافٍ على تعلمهم","تُستبدل بلعبة أكثر مؤثرات ونقاطًا لزيادة جذب الطلاب إليها","جاذبية اللعبة لا تثبت فاعليتها؛ فالمعيار تحسّن الدقة"],"a":3,"w":"قد تعزز الألعاب والتقنية المشاركة والممارسة إذا ظلت مرتبطة بالهدف. لكن كثرة النقاط والمؤثرات لا تضمن التعلم؛ فالحكم على فاعلية الأسلوب يكون بتغير الأداء المستهدف مقارنة بخط الأساس.","n":["الوقت والحماس ليسا دليلًا على تحسن المهارة.","المشاركة لا تساوي التعلم ما لم يتغير الأداء.","كثرة المؤثرات لا تضمن التعلم وقد تشتت.","صحيح: نقيس الدقة والاستقلال والتعميم لا الجاذبية."],"c":"تجذب الطلاب ... الدقة لم تتغير","p":"الجاذبية ليست دليل فاعلية؛ ابحث عن تغير الأداء."},{"id":"17-32","s":17,"i":"17.3","l":"معرفة","t":"أي مما يلي «لا» يُعد ممارسة تعزيز مقبولة تربويًّا وأخلاقيًّا؟","o":["حرمان الطالب من وجبة الفسحة حتى يُنهي ورقة العمل","إتاحة نشاط مفضّل قصير بعد تحقيق معيار متفق عليه","الإقرار المحدد بتحسن الطالب دون مقارنته بزملائه","منح الطالب اختيار معززه من بدائل محدودة مناسبة"],"a":0,"w":"لا تُستخدم الاحتياجات الأساسية أو الحقوق وسيلة ضغط، ولا يُستخدم الطعام أو الامتيازات بطريقة مهينة أو قسرية. فالتعزيز يجب أن يكون تربويًّا آمنًا يحترم عمر الطالب وكرامته وخصوصيته.","n":["صحيح: يستخدم حاجة أساسية وسيلة ضغط، وهذا مرفوض.","ممارسة مقبولة وفق مبدأ بريماك إذا لم تعطّل التعلم.","تعزيز اجتماعي محدد يحفظ كرامة الطالب.","الاختيار المحدود يزيد قيمة المعزز دون تنازل عن الهدف."],"c":"«لا» يُعد ... مقبولة أخلاقيًّا","p":"لا تعزيز على حساب حق أساسي أو كرامة الطالب."},{"id":"17-33","s":17,"i":"17.4","l":"معرفة","t":"أي المواقف التالية يقيس احتفاظ الطالب بالمهارة لا تعميمها؟","o":["أداء مهمة مماثلة بعد ثلاثة أسابيع دون إعادة تدريس","استخدام المهارة في درس العلوم مع معلم آخر غير معلمه","أداء المهمة مباشرة بعد انتهاء جلسة التدريب عليها","تطبيق الاستراتيجية على نص جديد لم يتدرب عليه قبلًا"],"a":0,"w":"الاحتفاظ قدرة الطالب على أداء المهارة بعد فاصل زمني دون إعادة تعليم كاملة، أما التعميم فاستخدامها في ظروف تختلف عن ظروف التدريب. والإتقان الفوري لا يكفي دليلًا على أيٍّ منهما.","n":["صحيح: الاحتفاظ هو الأداء بعد مرور الزمن.","تغيّر المادة والشخص يقيس التعميم.","يقيس الإتقان الفوري لا الاحتفاظ.","النص الجديد سياق مختلف، فهو قياس للتعميم."],"c":"بعد ثلاثة أسابيع دون إعادة تدريس","p":"الزمن = احتفاظ، والسياق الجديد = تعميم."},{"id":"17-34","s":17,"i":"17.4","l":"معرفة","t":"ما العبارة الأدق في وصف العلاقة بين التحفيز والتعزيز؟","o":["التعزيز أوسع؛ لأن كل تحفيز ينتهي في الواقع بمكافأة خارجية يحصل عليها الطالب","هما مترادفان يصفان النتيجة التي تلي السلوك وتزيد من تكراره لاحقًا","التحفيز أوسع؛ يشمل أسباب البدء والاستمرار، وقد يكون المعزز جزءًا منه","التحفيز يسبق التعلم، أما التعزيز فلا يُستخدم إلا بعد إتقان المهارة"],"a":2,"w":"التعزيز نتيجة تلي السلوك وتزيد احتماله، بينما التحفيز مفهوم أوسع يشمل العمليات التي تدعم بدء السلوك واستمراره وتوجيهه، ويتأثر بقيمة المهمة وتوقع النجاح والشعور بالكفاءة والاختيار والتغذية الراجعة.","n":["يعكس العلاقة ويختزل التحفيز في المكافأة الخارجية.","هذا وصف للتعزيز وحده لا للتحفيز.","صحيح: المعزز جزء من خطة تحفيزية لا الخطة كلها.","التعزيز يُستخدم منذ الاكتساب، ويتغير شكله مع المراحل."],"c":"العلاقة بين التحفيز والتعزيز","p":"التحفيز مظلة واسعة، والتعزيز أداة داخلها."},{"id":"17-35","s":17,"i":"17.4","l":"تطبيق","t":"أتقن عبدالله هذا الأسبوع قراءة الكلمات المنونة. ما الخطة الأنسب لدعم احتفاظه بهذه المهارة؟","o":["جلسة مراجعة طويلة واحدة لكل كلمات التنوين في نهاية الفصل","مراجعات قصيرة متباعدة يسترجع فيها التنوين داخل نصوص لاحقة","تكرار قائمة الكلمات المنونة نفسها يوميًّا حتى نهاية الشهر","الانتقال إلى نمط جديد مباشرة دون العودة إلى التنوين لاحقًا"],"a":1,"w":"تدعم المراجعة الموزعة الاحتفاظ أكثر من حشد التدريب ثم تركه، ويقوي الاسترجاع الوصول إلى المهارة. وإدخال النمط في نصوص لاحقة ممارسة تراكمية تُبقيه مستخدمًا بدل أن يختفي بعد انتهاء الوحدة.","n":["الحشد في جلسة واحدة أضعف من التوزيع عبر الزمن.","صحيح: تباعد + استرجاع + ممارسة تراكمية.","تكرار مطابق قد يُمل ويربط الأداء بالقائمة.","ترك المهارة بعد الوحدة يعرّضها للنسيان."],"c":"لدعم احتفاظه","p":"للاحتفاظ: وزّع المراجعة، واطلب الاسترجاع، وأعِد استخدام القديم."},{"id":"17-36","s":17,"i":"17.4","l":"تحليل","t":"تنجح ريم في استراتيجية حل المسألة مع معلمة غرفة المصادر فقط، وبالأوراق نفسها وترتيب الأسئلة نفسه. ما التفسير الأدق والإجراء الأنسب؟","o":["اكتساب ضعيف؛ فتُعاد الاستراتيجية من بدايتها بالأوراق نفسها","تعميم ناقص؛ فتُنوَّع الأمثلة والأشخاص والمواد تنويعًا مخططًا","دافعية منخفضة؛ فتُزاد المكافآت داخل غرفة المصادر وحدها","تعميم زائد؛ فتُدرَّب على المواقف التي لا تُستخدم فيها الاستراتيجية"],"a":1,"w":"حين ترتبط المهارة بشخص واحد ومادة واحدة وترتيب ثابت، قد يتعلم الطالب إشارات السياق بدل المهارة. ويُعالج التعميم الناقص بتغيير العناصر غير الجوهرية تدريجيًّا: الأشخاص والمواد والأمثلة والبيئات.","n":["نجاحها في الغرفة يدل على الاكتساب، والمشكلة في النقل.","صحيح: الأداء مرتبط بإشارات سياق التدريب.","لا قرينة على ضعف الدافعية، والمكافأة المحصورة لا تنقل المهارة.","التعميم الزائد تطبيق في غير موضعه، وهنا لا تطبيق خارج الغرفة أصلًا."],"c":"المعلمة نفسها والأوراق نفسها","p":"ينجح في سياق واحد؟ نوّع الأشخاص والمواد والأمثلة."},{"id":"17-37","s":17,"i":"17.4","l":"تطبيق","t":"تعلّمت جود أن الألف في أول «اسم» و«ابن» تُكتب دون همزة، فصارت تكتب كل ألف في أول الكلمة دون همزة، مثل «اكل» و«امي». ما الإجراء الأنسب؟","o":["تأجيل هذه القاعدة حتى تتقن كتابة جميع أنواع الهمزات الأخرى أولًا","عرض أمثلة وغير أمثلة للقاعدة، مع إبراز القرينة الفارقة بينها","زيادة تمارين الكلمات المبدوءة بهمزة الوصل لتثبيت القاعدة لديها أكثر","تصحيح الكلمات الخاطئة لها مباشرة دون مناقشة القاعدة أو حدودها معها"],"a":1,"w":"التعميم الجيد لا يعني استخدام القاعدة في كل موقف، بل أن يعرف الطالب متى يستخدمها ومتى لا يستخدمها. ويُعالج التعميم الزائد بأمثلة مضادة وأسئلة تمييز وإبراز القرينة الحاسمة.","n":["يؤجل المشكلة ولا يعلّم التمييز.","صحيح: الأمثلة وغير الأمثلة تضبط حدود القاعدة.","يقوّي التعميم الزائد بدل ضبطه.","تصحيح الناتج لا يعالج سوء فهم حدود القاعدة."],"c":"صارت تكتب كل ألف","p":"التعميم الزائد يُعالج بالأمثلة وغير الأمثلة والتمييز."},{"id":"17-38","s":17,"i":"17.4","l":"تطبيق","t":"لا يستخدم فيصل خريطة التخطيط للكتابة إلا إذا قال له المعلم: «استخدم الخريطة الآن»، رغم إتقانه لها. ما الإجراء الأنسب؟","o":["الاستمرار في التذكير اللفظي قبل كل مهمة كتابية لضمان استخدامه للخريطة دائمًا","إيقاف التذكير فجأة من اليوم حتى يتعلم الاعتماد على نفسه دون مساعدة","تقليل التلميح تدريجيًّا ونقله إلى إشارات المهمة، مع أسئلة مراقبة ذاتية","إعادة تعليم الخريطة من البداية لأنه لا يستخدمها من تلقاء نفسه بعد"],"a":2,"w":"التعميم الحقيقي يحدث دون تلميح مباشر يخبر الطالب متى يستخدم المهارة. لذلك تُخفَّف التلميحات تدريجيًّا لتنتقل السيطرة إلى إشارات المهمة نفسها، وتساعده أسئلة المراقبة الذاتية: ما المطلوب؟ أي استراتيجية تناسب؟ هل طبقتها؟","n":["يُبقي الأداء مرتبطًا بتلميح المعلم.","السحب المفاجئ قد يُسقط الأداء قبل بناء البديل الذاتي.","صحيح: التلاشي ينقل التحكم إلى الإشارات الطبيعية وإلى الطالب.","المهارة متقنة؛ والمشكلة في الاعتماد على التلميح."],"c":"إلا إذا قال له المعلم","p":"ينتظر التلميح؟ تلاشٍ تدريجي + إشارات طبيعية + مراقبة ذاتية."},{"id":"17-39","s":17,"i":"17.4","l":"تحليل","t":"أرادت معلمة قياس تعميم استراتيجية تحديد الفكرة الرئيسة لدى طالبها. أي إجراء يقيس التعميم بدقة أكبر؟","o":["نص الدرس نفسه بعد أسبوع، دون إعادة تدريس الاستراتيجية له مرة أخرى","نص جديد في مادة أخرى، مع تذكيره أولًا باستخدام استراتيجية الفكرة الرئيسة","نص دراسات اجتماعية لم يتدرب عليه، دون إخباره بالاستراتيجية المطلوبة","سؤاله عن خطوات الاستراتيجية ليشرحها بالترتيب كما تعلّمها في الحصة"],"a":2,"w":"قياس التعميم يغيّر عنصرًا مهمًّا من سياق التدريب، ثم يلاحظ هل يستخدم الطالب المهارة المناسبة دون تلميح خاص. فإذا أُخبر بالاستراتيجية مسبقًا أصبح القياس لاتباع التعليمات لا للتعميم.","n":["يقيس الاحتفاظ عبر الزمن لا التعميم.","التلميح المباشر يُضعف دلالة القياس على التعميم.","صحيح: سياق جديد دون تلميح خاص.","معرفة الخطوات لفظيًّا لا تعني تطبيقها في موقف جديد."],"c":"قياس التعميم بدقة أكبر","p":"قِس التعميم في موقف جديد ودون تلميح."},{"id":"17-40","s":17,"i":"17.4","l":"تطبيق","t":"أي تطبيق للاختيار المنظّم يدعم دافعية طالبة ذات صعوبات تعلم دون الإخلال بهدف التعلم؟","o":["أن تختار بين تطبيق استراتيجية التلخيص أو الاكتفاء بقراءة النص فقط","أن تختار عدد الأهداف التي ستعمل عليها في خطتها التربوية الفردية","أن تختار إلغاء مهمة الكتابة متى شعرت بالتعب أو الملل في أثنائها","أن تختار موضوع النص الذي ستطبق عليه استراتيجية التلخيص المستهدفة"],"a":3,"w":"الاختيار المنظم يدعم الملكية والدافعية حين يكون في عناصر لا تغيّر الهدف، مثل موضوع المثال أو ترتيب نشاطين أو الأداة المناسبة. أما جعل الهدف أو المتطلب نفسه اختياريًّا فيُخل بالتعلم.","n":["يجعل الهدف نفسه اختياريًّا.","الأهداف تُحدَّد بالبيانات وقرار الفريق لا باختيار الطالبة.","إلغاء المتطلبات ليس اختيارًا منظمًا.","صحيح: يتغير الموضوع ويبقى الهدف ثابتًا."],"c":"دون الإخلال بهدف التعلم","p":"اسمح بالاختيار في «كيف» و«على ماذا»، لا في «هل نتعلم»."},{"id":"17-41","s":17,"i":"17.4","l":"تحليل","t":"اختُبر سلمان بعد شهر من إتقانه الطرح مع إعادة التجميع، فكانت خطواته صحيحة كلها إلا الاستلاف من الصفر. ما القرار الأنسب؟","o":["إعادة تدريس وحدة الطرح كاملة لأن المهارة ضعفت بعد مرور شهر عليها","جلسة تعزيز قصيرة تستهدف الاستلاف من الصفر، ثم إعادة القياس","اعتبار المهارة محفوظة والانتقال إلى غيرها لأن أغلب الخطوات صحيحة","تكثيف أوراق مراجعة شاملة للطرح يوميًّا حتى نهاية الفصل الدراسي"],"a":1,"w":"إذا انخفض الاحتفاظ يحدد المعلم الجزء المفقود ويقدم مراجعة أو تدريبًا قصيرًا ثم يعيد القياس. وجلسات التعزيز القصيرة اللاحقة تعيد تنشيط المهارة التي بدأت تضعف دون إعادة الوحدة كاملة.","n":["يفترض فقد الوحدة كلها، والبيانات تحدد جزءًا واحدًا.","صحيح: يحدد الجزء المفقود ويعالجه بإيجاز ثم يعيد القياس.","يتجاهل جزءًا ضعُف فعلًا وقد يتسع أثره.","مراجعة كمية غير موجهة إلى الجزء المفقود."],"c":"كلها إلا الاستلاف من الصفر","p":"ضعف جزئي = جلسة تعزيز قصيرة موجهة ثم إعادة قياس."},{"id":"17-42","s":17,"i":"17.4","l":"تطبيق","t":"ينسحب طالب ذو صعوبات تعلم من مهام القراءة ويقول: «لن أنجح مهما حاولت». أي إجراء تحفيزي أنسب؟","o":["مقارنة أدائه بزميل نجح بعد أن كان في مثل مستواه تمامًا ليقتدي به","تقديم نصوص سهلة جدًّا حتى لا يواجه أي صعوبة في أثناء القراءة","مهام قصيرة بتحدٍّ مناسب ينجح فيها، مع عرض تقدمه مقارنة ببدايته","إبلاغه بأن انسحابه المتكرر سيؤثر في درجاته إن استمر عليه"],"a":2,"w":"التحفيز الفعال يدعم الكفاءة: بداية يمكن النجاح فيها مع تحدٍّ مناسب تقلل خبرات الفشل، ثم رفع الصعوبة تدريجيًّا، مع جعل التقدم مرئيًّا مقارنة بنقطة البداية. أما المقارنة والتهديد فلا يبنيان استمرارًا.","n":["المقارنة بالزملاء قد تُحبط ولا تبني الكفاءة.","المهمة السهلة جدًّا لا تبني نموًّا ولا ثقة حقيقية.","صحيح: نجاح مبكر وتحدٍّ مناسب وتقدم مرئي تبني الكفاءة الذاتية.","التهديد ضغط لا يبني دافعية مستمرة."],"c":"لن أنجح مهما حاولت","p":"ابنِ الكفاءة: نجاح مبكر، وتحدٍّ مناسب، وتقدم مرئي."},{"id":"17-43","s":17,"i":"17.4","l":"تطبيق","t":"أتقن طالب استخدام قائمة لتنظيم أدواته في غرفة المصادر، ويرى الفريق أن يستخدمها في المنزل أيضًا. ما الإجراء الأنسب مع الأسرة؟","o":["تكليف الأسرة بجلسة تدريب يومية مدتها ساعة كاملة على استخدام القائمة","الاكتفاء بنجاحه في غرفة المصادر لأن المنزل خارج نطاق دور المدرسة","إرسال نسخة من القائمة إلى الأسرة دون تحديد متى وكيف تُستخدم في المنزل","الاتفاق على موقف يومي طبيعي لاستخدام القائمة دون جلسات مكثفة"],"a":3,"w":"إذا كانت المهارة ذات استخدام منزلي أو حياتي، يتفق الفريق والأسرة على فرصة طبيعية للممارسة. فالتعميم يُبرمج مسبقًا: أين ومتى ومع من، لكن دون تحويل المنزل إلى جلسة علاجية مكثفة.","n":["يحوّل المنزل إلى جلسة علاجية مكثفة ومرهقة.","يتخلى عن تعميم مهارة ذات استخدام حياتي.","التعميم لا يحدث تلقائيًّا؛ يحتاج فرصة محددة ومتابعة.","صحيح: تعميم مخطط في موقف طبيعي بالتنسيق مع الأسرة."],"c":"أن يستخدمها في المنزل أيضًا","p":"برمج التعميم في مواقف طبيعية، ولا تنتظره تلقائيًّا."},{"id":"18-01","s":18,"i":"18.1","l":"معرفة","t":"أي العبارات الآتية أدق في وصف قرار التعرف على الطالب ذي صعوبات التعلم؟","o":["حكم يُبنى على وجود تباعد دال بين درجتي الذكاء والتحصيل وحده دون غيره","قرار فريق يستند إلى تقارب أدلة متعددة بعد فحص التعليم والتفسيرات البديلة","نتيجة اختبار تحصيلي مقنن واحد تقل فيه درجة الطالب عن نقطة القطع المعتمدة","تصنيف يحدده معلم الفصل بناءً على ملاحظاته اليومية المتراكمة لأداء الطالب"],"a":1,"w":"التعرف على صعوبات التعلم لا يُبنى على درجة واحدة أو ملاحظة واحدة، بل على تقارب أدلة متعددة: تحصيل منخفض مستمر في مهارة محددة، واستجابة لتعليم وتدخل مناسبين، وفحص للعوامل التي قد تفسر الأداء. ثم يتخذ الفريق القرار وفق الأنظمة المعتمدة.","n":["خطأ: التباعد محك تاريخي لا يصلح دليلًا وحيدًا.","صحيح: أدلة متعددة متقاربة وقرار فريق.","خطأ: لا يوجد اختبار منفرد حاسم في التعرف.","خطأ: المعلم مصدر بيانات مهم، لكنه لا يشخّص منفردًا."],"c":"أدق في وصف قرار التعرف","p":"التعرف حجة متكاملة من أدلة متعددة، لا رقم يثبت الحالة."},{"id":"18-02","s":18,"i":"18.1","l":"تطبيق","t":"طالب في الصف الرابع منخفض في القراءة، ويُظهر سجله غيابًا متكررًا وتنقلًا بين ثلاث مدارس خلال عامين دون أي تدخل قرائي منظم. ما الإجراء الأنسب أولًا؟","o":["إحالته فورًا إلى التقييم الشامل لأن ضعفه القرائي يتجاوز صفًّا دراسيًّا كاملًا","تطبيق مقياس ذكاء عليه للتحقق من وجود تباعد بين قدرته العقلية وتحصيله","استبعاده نهائيًّا من فئة صعوبات التعلم بسبب ظروفه التعليمية المضطربة","تقديم تعليم قرائي منظم مع جمع بيانات التقدم قبل نسبة ضعفه إلى صعوبة تعلم"],"a":3,"w":"الغياب المتكرر والتنقل وغياب التدخل المنظم قد تفسر ضعف التحصيل، فلا يصح مساواة «لم يتعلم» بـ«لا يستطيع أن يتعلم». والأولوية سد فجوة الفرصة بتعليم مناسب مع جمع بيانات التقدم، دون استبعاد آلي ولا تأخير للدعم.","n":["خطأ: يتجاهل فجوة فرصة التعلم الواضحة في سجله.","خطأ: لا يجيب عن السؤال الأهم: هل تلقى تعليمًا كافيًا؟","خطأ: الاستبعاد ليس آليًّا؛ فقد تبقى الصعوبة بعد تعويض الفرصة.","صحيح: سد فجوة الفرصة مع جمع البيانات."],"c":"غيابًا متكررًا وتنقلًا ... دون تدخل منظم","p":"قبل نسبة الضعف إلى الطالب، تحقق: هل أُتيحت له فرصة تعلم مناسبة؟"},{"id":"18-03","s":18,"i":"18.1","l":"تحليل","t":"الطالبة ريم مشخّصة باضطراب تشتت الانتباه وفرط الحركة، وتُظهر أخطاء ثابتة في فك الترميز رغم تدخل قرائي مناسب نُفّذ بجودة طوال فصل دراسي. ما التفسير الأدق؟","o":["الاضطراب يفسر أخطاء القراءة كلها، فلا حاجة إلى إجراء تقييم قرائي لها","وجود الاضطراب يستبعد صعوبات التعلم تلقائيًّا وفق محكات الاستبعاد المعروفة","احتمال تزامن صعوبة تعلم مع الاضطراب، فيُقيَّم نمط القراءة بأدلة مستقلة","ضعف استجابتها للتدخل يكفي وحده لإثبات صعوبة تعلم محددة دون تقييم آخر"],"a":2,"w":"قد يتزامن اضطراب الانتباه مع صعوبات التعلم، فوجوده لا يثبت الصعوبة ولا ينفيها. والسؤال الأدق: هل الاضطراب هو التفسير الأساسي للأداء، أم توجد صعوبة متزامنة تظهر في نمط أكاديمي محدد ومستمر رغم تدخل جيد؟ وهذا يحتاج أدلة مستقلة.","n":["خطأ: يجعل التشخيص المصاحب تفسيرًا شاملًا دون دليل.","خطأ: الحالة المصاحبة لا تنفي صعوبات التعلم تلقائيًّا.","صحيح: التزامن ممكن ويُفحص بأدلة مستقلة.","خطأ: الاستجابة للتدخل مصدر مهم لكنها ليست تشخيصًا منفردًا."],"c":"أخطاء ثابتة في فك الترميز رغم تدخل بجودة","p":"الحالة المصاحبة لا تستبعد تلقائيًّا ولا تثبت تلقائيًّا؛ افحص الأثر بأدلة مستقلة."},{"id":"18-04","s":18,"i":"18.1","l":"تطبيق","t":"يشكو الطالب فيصل من صعوبة رؤية ما يُكتب على السبورة، ويقرّب الكتاب من عينيه كثيرًا، وأداؤه القرائي منخفض. ما الخطوة الأنسب قبل أي تفسير أكاديمي نهائي؟","o":["تطبيق اختبار تشخيصي مقنن في القراءة لتحديد نوع صعوبته القرائية بدقة","تصنيفه مبدئيًّا ضمن صعوبات القراءة لتسريع حصوله على خدمة غرفة المصادر","إحالته لفحص البصر وضمان تصحيح أي مشكلة، ثم تفسير أدائه القرائي","مضاعفة جرعة التدخل القرائي اليومي له داخل غرفة المصادر"],"a":2,"w":"يجب التأكد من أن مشكلات البصر أو السمع غير المصححة لا تفسر الأداء الأكاديمي بصورة أساسية، مع إحالة مناسبة عند الاشتباه. فالعامل الحسي قد يكون التفسير الأساسي للضعف، ولا يُفسَّر الأداء تفسيرًا نهائيًّا قبل ضمان الوصول.","n":["خطأ: نتائج الاختبار قد تتأثر بالعامل البصري غير المعالج.","خطأ: تصنيف متسرع يتجاهل تفسيرًا حسيًّا محتملًا.","صحيح: تأكد من الوصول الحسي أولًا.","خطأ: يعالج النتيجة ويهمل السبب المحتمل."],"c":"صعوبة رؤية ما يُكتب ... يقرّب الكتاب","p":"مؤشرات حسية في الموقف = فحص وإحالة قبل أي تفسير أكاديمي."},{"id":"18-05","s":18,"i":"18.1","l":"معرفة","t":"أي العبارات أدق في وصف محك التباعد بين القدرة العقلية والتحصيل الدراسي؟","o":["شرط أساسي لا يُشخَّص الطالب دون تحققه في جميع الأنظمة التعليمية المعاصرة","محك أُلغي تمامًا، فلا يُرجع إليه في أي نظام تعليمي ولا يُعتد ببياناته","مؤشر يكفي وحده للتعرف إذا تجاوز الفرق بين الدرجتين حدًّا إحصائيًّا معينًا","محك تاريخي قد يُعد أحد أنواع البيانات، لكنه لا يصلح قاعدة وحيدة للتعرف"],"a":3,"w":"اعتمدت بعض الممارسات تاريخيًّا على وجود فرق ملحوظ بين القدرة العقلية والتحصيل، وقد يُؤخذ اليوم بوصفه أحد أنواع البيانات في بعض النظم. لكن النماذج الحديثة لا تختزل التعرف فيه، بل تعتمد صورة أوسع من الأدلة.","n":["خطأ: النماذج الحديثة لا تشترطه بوصفه المحك الوحيد.","خطأ: تطرف مقابل؛ فقد يُستخدم ضمن البيانات في بعض النظم.","خطأ: لا يكفي محك منفرد مهما بلغ الفرق.","صحيح: محك تاريخي لا يُختزل فيه القرار."],"c":"محك التباعد بين القدرة العقلية والتحصيل","p":"التباعد محك تاريخي؛ لا تجعله الدليل الوحيد ولا تلغِه إلغاءً مطلقًا."},{"id":"18-06","s":18,"i":"18.2","l":"تطبيق","t":"يريد معلم صعوبات التعلم معرفة أي مهارات الجمع مع إعادة التجميع أتقنها الطالب عبدالله وأيها لم يتقنه، ليبني أهدافه التدريسية. ما الأداة الأنسب؟","o":["اختبار محكي المرجع مرتبط بالمهارات الفرعية المستهدفة","اختبار تحصيلي معياري المرجع يحدد موقعه بين أقرانه في الصف","مقياس قدرات معرفية يكشف نقاط قوته وضعفه العقلية العامة","أداة فرز سريعة تُطبق على جميع طلاب الصف في بداية العام"],"a":0,"w":"الاختبار محكي المرجع يقارن أداء الطالب بمعيار أو مهارة محددة، فيبين ما أتقنه وما يحتاج إلى تدريسه؛ ولذلك هو الأنسب لبناء أهداف تدريسية. أما معياري المرجع فيجيب عن موقع الطالب مقارنة بمجموعة معيارية.","n":["صحيح: إتقان مهارة = محكي المرجع.","خطأ: يجيب عن الموقع النسبي لا عن المهارات المتقنة.","خطأ: لا يحدد مهارات الجمع التي تحتاج تدريسًا.","خطأ: الفرز يحدد الخطر ولا يصف المهارات بالتفصيل."],"c":"أي مهارات أتقنها وأيها لم يتقنه","p":"مقارنة بالأقران = معياري؛ إتقان مهارة محددة = محكي."},{"id":"18-07","s":18,"i":"18.2","l":"معرفة","t":"حصل الطالب سلمان على رتبة مئينية 25 في اختبار قراءة مقنن. ما التفسير الصحيح لهذه النتيجة؟","o":["أجاب إجابة صحيحة عن 25% تقريبًا من مجموع أسئلة الاختبار","نحو 25% من أفراد المجموعة المعيارية حصلوا على درجة مساوية لدرجته أو أقل","أداؤه أفضل من أداء 75% من أفراد المجموعة المعيارية","يحتاج إلى 25 درجة إضافية ليبلغ متوسط أداء أقرانه"],"a":1,"w":"الرتبة المئينية تشير إلى نسبة أفراد المجموعة المعيارية الذين حصلوا على درجات مساوية أو أقل تقريبًا، فهي موقع نسبي وليست نسبة إجابات صحيحة. وتفسيرها مرتبط بمعايير الأداة وملاءمة المجموعة المعيارية للطالب.","n":["خطأ: الخلط الشائع بين الرتبة المئينية والنسبة المئوية للإجابات.","صحيح: موقع نسبي في المجموعة المعيارية.","خطأ: عكسٌ للمعنى؛ فنحو 75% من المجموعة المعيارية أداؤهم أعلى منه.","خطأ: الرتبة موقع نسبي لا مقدار درجات ناقصة."],"c":"رتبة مئينية 25","p":"الرتبة المئينية موقع بين الأقران المعياريين، لا نسبة صحة."},{"id":"18-08","s":18,"i":"18.2","l":"تطبيق","t":"طُبّقت أداة فرز في القراءة على طالبات الصف الثاني، فجاءت درجة الطالبة جود ضمن نطاق الخطر. ما الاستخدام الصحيح لهذه النتيجة؟","o":["تصنيفها ضمن صعوبات التعلم لأن أداة الفرز مقننة وموثوقة","تجاهل النتيجة لأن أدوات الفرز تكثر فيها الإيجابيات الكاذبة","عدّها مؤشرًا على الحاجة إلى تدخل مبكر ومتابعة وتقييم أعمق","كتابة أهداف علاجية لها في برنامج تربوي فردي على الفور"],"a":2,"w":"تهدف أدوات الفرز إلى تحديد من قد يكون معرضًا للخطر ويحتاج تدخلًا أو تقييمًا أعمق، وليست أداة تشخيص نهائي. ويمكن تقديم تدخل مبكر وجمع البيانات بالتوازي بدل انتظار فشل شديد.","n":["خطأ: الفرز بوابة للتقييم لا تشخيص نهائي.","خطأ: تجاهلها يؤخر الدعم، والصواب التحقق منها.","صحيح: الفرز يحدد الخطر لا الحالة.","خطأ: البرنامج الفردي يسبقه تقييم شامل وقرار فريق."],"c":"أداة فرز ... ضمن نطاق الخطر","p":"الفرز = خطر محتمل ثم تقييم أعمق، لا تشخيص."},{"id":"18-09","s":18,"i":"18.2","l":"تحليل","t":"يريد الفريق متابعة نمو طلاقة القراءة لدى الطالب مشعل أسبوعيًّا أثناء التدخل، فاقترح أحد الأعضاء إعادة تطبيق الاختبار التشخيصي الشامل كل أسبوع. ما التقييم الأدق؟","o":["مناسب؛ لأن الاختبار التشخيصي الشامل أدق الأدوات المتاحة وأعلاها صدقًا وثباتًا","مناسب؛ بشرط تطبيقه في المكان والزمن نفسيهما كل أسبوع دون تغيير","غير مناسب؛ لأن الطلاقة لا تُقاس إلا بالملاحظة الصفية المباشرة للطالب","غير مناسب؛ فقد لا يلتقط التغير الصغير ويتأثر بالممارسة، والأنسب مقياس CBM"],"a":3,"w":"متابعة التقدم تحتاج أداة قصيرة متكررة وحساسة للتغير الصغير، مثل القياس القائم على المنهج (CBM). أما الاختبار التشخيصي الشامل فقد لا يكون مصممًا للتكرار الأسبوعي، وإعادته بسرعة قد ترفع الدرجة بأثر الألفة لا بنمو المهارة.","n":["خطأ: الأداة الجيدة للتشخيص ليست بالضرورة صالحة للمتابعة.","خطأ: توحيد الظروف لا يعالج عدم الحساسية وأثر الممارسة.","خطأ: التعليل خاطئ؛ فالطلاقة تُقاس بقراءة زمنية محددة الإجراء.","صحيح: المتابعة تحتاج أداة حساسة متكررة."],"c":"أسبوعيًّا ... الاختبار التشخيصي الشامل","p":"أداة التشخيص ليست بالضرورة أداة متابعة؛ النمو المتكرر يحتاج CBM."},{"id":"18-10","s":18,"i":"18.2","l":"معرفة","t":"أي العبارات أدق في وصف أدوات القياس غير الرسمية في مجال صعوبات التعلم؟","o":["أقل قيمة من الأدوات الرسمية في جميع القرارات التربوية دون استثناء","عشوائية بطبيعتها؛ لأنها لا تخضع لتقنين أو معايير أو خصائص فنية","مرنة ومرتبطة بالتدريس، وتحتاج هدفًا وإجراءً منظمًا ومعيار تسجيل","تكفي وحدها لاتخاذ قرار الأهلية؛ لأنها أقرب إلى أداء الطالب الفعلي"],"a":2,"w":"تشمل الأدوات غير الرسمية الملاحظة وعينات العمل وتحليل الأخطاء وقوائم المهارات والقياسات المنهجية، وهي قريبة من التدريس ومفيدة لتحديد ما يحتاجه الطالب. لكنها لا تكون قوية إلا إذا كان لها هدف واضح وإجراء منظم ومعيار تسجيل وتوثيق كافٍ.","n":["خطأ: قد تكون أكثر فائدة لتحديد المهارة الفرعية ونوع الخطأ.","خطأ: غير الرسمي لا يعني العشوائي إذا نُظّم.","صحيح: مرنة لكنها منظمة.","خطأ: القرارات عالية المخاطر تحتاج أدلة أوسع وإجراءات رسمية."],"c":"أدوات القياس غير الرسمية","p":"غير الرسمي ليس عشوائيًّا، والرسمي ليس الأفضل دائمًا."},{"id":"18-11","s":18,"i":"18.3","l":"معرفة","t":"في تحليل بيانات متابعة التقدم، ما المقصود بالاتجاه (Trend)؟","o":["مقدار الأداء الحالي في آخر نقطة قياس مسجلة","مدى تذبذب الدرجات وتباعد بعضها عن بعض","الفرق بين درجة خط الأساس ودرجة الهدف السنوي","المسار العام للأداء عبر عدة نقاط قياس زمنية"],"a":3,"w":"الاتجاه يصف المسار العام لبيانات الطالب عبر الزمن: صعودًا أو ثباتًا أو هبوطًا، وهو أهم من نقطة منفردة في الحكم على الاستجابة. ويختلف عن المستوى الذي يصف مقدار الأداء الحالي، وعن التباين الذي يصف التذبذب.","n":["خطأ: هذا هو المستوى (Level) لا الاتجاه.","خطأ: هذا هو التباين (Variability).","خطأ: هذه الفجوة المطلوب سدها، لا مسار الأداء الفعلي.","صحيح: مسار عبر الزمن لا لقطة."],"c":"المقصود بالاتجاه (Trend)","p":"المستوى = كم الآن؟ الاتجاه = إلى أين يسير؟ التباين = كم يتذبذب؟"},{"id":"18-12","s":18,"i":"18.3","l":"تحليل","t":"سُجّلت درجات الطالب فيصل في طلاقة القراءة (كلمة صحيحة في الدقيقة) خلال خمسة أسابيع كالآتي: 38، 61، 35، 64، 37. ما التفسير الأنسب قبل اتخاذ قرار بتعديل الخطة؟","o":["اتجاه صاعد واضح يدل على استجابة جيدة للتدخل الحالي، فيستمر كما هو","تذبذب مرتفع يستدعي فحص ظروف القياس والمواد والحضور وجمع نقاط إضافية","متوسط الدرجات 47 كلمة، فيُعتمد مستوى أداء حاليًّا للطالب في الخطة الفردية","ثبات في الأداء يثبت عدم الاستجابة ويستوجب تغيير التدخل فورًا"],"a":1,"w":"الدرجات تتأرجح بين نحو 35 ونحو 64، وهذا تباين مرتفع قد يدل على اختلاف المهام أو الظروف أو عدم ثبات الأداء. فلا يُتخذ قرار كبير من بيانات غير مستقرة، بل تُفحص الظروف وتُضاف نقاط قياس بطريقة متسقة.","n":["خطأ: لا يوجد صعود منتظم؛ الدرجات تتأرجح.","صحيح: التذبذب يحتاج تفسيرًا قبل القرار.","خطأ: المتوسط يخفي التذبذب الكبير ولا يصف النمط.","خطأ: البيانات غير مستقرة أصلًا، فلا تسمح بحكم كبير."],"c":"38، 61، 35، 64، 37","p":"التباين المرتفع يسبق أي قرار: افحص الظروف قبل تفسير المستوى والاتجاه."},{"id":"18-13","s":18,"i":"18.3","l":"تطبيق","t":"ورد في البرنامج التربوي الفردي للطالبة جود الهدف الآتي: «أن تتحسن قراءتها خلال العام الدراسي». ما التعديل الأنسب لهذا الهدف؟","o":["إعادة صياغته ليحدد المهارة والشرط ومعيار الأداء وطريقة القياس","إبقاؤه عامًّا ليمنح المعلمة مرونة في اختيار الأنشطة المناسبة لها","إضافة عبارة «بدرجة ملحوظة» إليه لتوضيح مقدار التحسن المطلوب","استبداله بقائمة الأنشطة القرائية التي ستُنفذ في غرفة المصادر"],"a":0,"w":"الهدف القابل للقياس يحدد السلوك أو المهارة، والظروف، والمحك، والزمن عند الحاجة، بحيث يرتبط التقويم به مباشرة، وينطلق من حاجة موثقة في مستوى الأداء الحالي. أما «تتحسن قراءتها» فلا يمكن الحكم على تحققه.","n":["صحيح: هدف قابل للقياس مرتبط بالبيانات.","خطأ: الهدف العام لا يسمح بقياس التقدم ولا باتخاذ قرار.","خطأ: «ملحوظة» وصف غامض غير قابل للقياس.","خطأ: الأنشطة وسائل، وليست نتائج يُقاس بها التعلم."],"c":"«أن تتحسن قراءتها خلال العام»","p":"اسأل عن كل هدف: هل يمكن قياسه والحكم على تحققه؟"},{"id":"18-14","s":18,"i":"18.3","l":"تطبيق","t":"هدف الطالب عبدالله في خطته هو فهم المقروء، لكن المعلم يتابع تقدمه أسبوعيًّا بعدد الكلمات المقروءة صحيحًا في الدقيقة فقط. ما التعديل الأنسب؟","o":["الإبقاء على مقياس الطلاقة؛ لأنه أسرع تطبيقًا وأعلى ثباتًا من غيره","اختيار مقياس متابعة يقيس الفهم نفسه؛ لأن المقياس يطابق الهدف","تعديل الهدف إلى الطلاقة ليتوافق مع المقياس المستخدم في المتابعة","إضافة اختبار ذكاء إلى الخطة لتفسير بطء تقدمه في الفهم القرائي"],"a":1,"w":"يجب أن يقيس مقياس متابعة التقدم المهارة المستهدفة نفسها؛ فلا تُستخدم سرعة القراءة للحكم على هدف فهم المقروء إذا لم تكن السرعة هي البناء المقصود. واختيار مقياس غير مطابق يجعل قرارات تعديل الخطة مبنية على بيانات لا تجيب عن السؤال.","n":["خطأ: سهولة القياس لا تبرر قياس بناء غير مستهدف.","صحيح: قِس الهدف نفسه.","خطأ: يجعل الأداة تقود الهدف بدل العكس.","خطأ: لا يعالج عدم التطابق بين الهدف والمقياس."],"c":"هدفه فهم المقروء ... بعدد الكلمات","p":"مقيا
