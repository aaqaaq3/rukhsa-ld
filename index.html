ق","t":"يصف المعلم أحمد درسه بأنه «تدريس مباشر» لأنه شرح قاعدة التاء المربوطة عشرين دقيقة متواصلة ثم وزّع ورقة عمل يحلها الطلاب منفردين. ما التعديل الذي يجعل الدرس تدريسًا مباشرًا فعلًا؟","o":["إطالة زمن الشرح مع زيادة الأمثلة حتى يستوعب جميع الطلاب القاعدة قبل ورقة العمل","إضافة نمذجة واضحة واستجابات نشطة وممارسة موجهة بتغذية راجعة فورية قبل الاستقلال","استبدال ورقة العمل بنشاط اكتشافي يستنتج فيه الطلاب القاعدة من أمثلة متنوعة","توزيع ورقة العمل في بداية الحصة ثم شرح القاعدة بعد معرفة أخطاء الطلاب الشائعة فيها"],"a":1,"w":"التدريس المباشر منظومة متسلسلة: هدف واضح، ثم نمذجة، ثم ممارسة موجهة باستجابات نشطة وتغذية راجعة فورية، ثم ممارسة مستقلة. وما فعله المعلم شرح طويل يليه عمل مستقل، أي أنه قفز من العرض إلى الاستقلال وأسقط المرحلة الوسطى.","n":["يزيد التلقين ولا يضيف ممارسة موجهة.","صحيح: يكمل الحلقة المفقودة بين الشرح والاستقلال.","يحوّل الدرس إلى اكتشاف بدل إصلاح التدريس المباشر.","يبدأ بالتقويم قبل التعليم، فلا يعالج غياب النمذجة."],"c":"شرح عشرين دقيقة متواصلة ثم ورقة عمل","p":"التدريس المباشر ليس محاضرة: نمذجة ثم ممارسة موجهة بتغذية راجعة ثم استقلال."},{"id":"14-11","s":14,"i":"14.2","l":"معرفة","t":"أي وصف يطابق فكرة نموذج الاستجابة للتدخل (RTI) متعدد المستويات؟","o":["تشخيص الطالب أولًا ثم إحالته مباشرة إلى أكثف مستويات الدعم الفردي دون مراحل سابقة","توزيع الطلاب على مستويات ثابتة طوال العام وفق نتائج اختبار تحصيلي واحد في بدايته","تدريس جيد للجميع، فدعم في مجموعات صغيرة، فتدخل أكثف لمن لا يستجيب بحسب البيانات","تقديم البرنامج نفسه بالشدة نفسها لكل الطلاب، وانتظار نتائج نهاية العام للحكم عليه"],"a":2,"w":"يقوم النموذج على مستويات متدرجة الشدة: تدريس عام جيد للجميع، ثم دعم إضافي لمن يحتاجه، ثم تدخل مكثف لمن لا يستجيب. ويتحرك الطالب بين المستويات بناءً على متابعة تقدمه، لا على قرار ثابت أو اختبار واحد.","n":["يقفز إلى أشد المستويات دون المرور بالتدريس العام والدعم.","المستويات في النموذج مرنة تتغير بالبيانات لا ثابتة.","صحيح: مستويات متدرجة تحكمها بيانات الاستجابة.","يلغي التدرج في الشدة ويؤخر القرار إلى نهاية العام."],"c":"متعدد المستويات","p":"RTI = شدة تتصاعد بحسب الاستجابة المقيسة."},{"id":"14-12","s":14,"i":"14.2","l":"تحليل","t":"اقترح أحد المشرفين أن يعتمد معلمو غرف المصادر استراتيجية واحدة حديثة مع جميع طلاب صعوبات التعلم طوال العام «لتوحيد العمل». ما الخلل الأهم في هذا المقترح؟","o":["يتجاهل تباين ملفات الطلاب؛ فالاستراتيجية تُختار وفق نوع الصعوبة وبيانات الاستجابة","لا خلل فيه ما دامت الاستراتيجية حديثة ومنشورة في مصادر علمية معروفة ومحكمة","الخلل في توقيته فقط، والأنسب تطبيقه بعد اختبار تحصيلي يُجرى في منتصف العام","يقلل حرية المعلمين في اختيار الوسائل التعليمية التي يفضلونها في حصصهم"],"a":0,"w":"طلاب صعوبات التعلم غير متجانسين؛ فقد يحتاج طالب إلى تدريس صريح وآخر إلى استراتيجيات تفكير وتعميم. لذا فاعتماد طريقة واحدة للجميع خطأ شائع، والحداثة ليست دليل فاعلية، والحكم للمطابقة مع الحاجة وبيانات الاستجابة.","n":["صحيح: المرونة وفق الملف والبيانات.","الحداثة والنشر لا يعنيان الملاءمة لكل طالب.","تغيير التوقيت لا يعالج فكرة الطريقة الواحدة للجميع.","تفضيل المعلم ليس معيار اختيار الاستراتيجية."],"c":"استراتيجية واحدة… مع جميع الطلاب","p":"«استراتيجية واحدة للجميع» إجابة خاطئة غالبًا؛ ابحث عن المطابقة والبيانات."},{"id":"14-13","s":14,"i":"14.2","l":"تطبيق","t":"تحفظ الطالبة لمى قواعد علامات الترقيم وتطبقها بدقة في تمارين الإكمال، لكنها لا توظفها حين تكتب موضوعًا تعبيريًا. أي اتجاه تدريسي يناسب حاجتها الحالية أكثر؟","o":["إعادة تدريس القواعد بالتدريس المباشر مع مزيد من تمارين الإكمال المتدرجة","تدريب متعدد الحواس على رسم علامات الترقيم بالرمل والتتبع والنطق المتزامن","تدريس استراتيجي يعلّمها التخطيط والمراجعة الذاتية بقائمة تتلاشى تدريجيًا","خفض متطلبات التعبير لديها إلى جمل قصيرة لا تحتاج إلى علامات ترقيم"],"a":2,"w":"لمى تعرف القاعدة وتطبقها في التمرين المقيّد، فالمشكلة ليست في اكتساب المعرفة بل في توظيفها ذاتيًا في مهمة مفتوحة. وهذا موضع التدريس الاستراتيجي وما وراء المعرفة: التخطيط والمراقبة والمراجعة الذاتية مع تلاشي الدعم حتى الاستقلال.","n":["القاعدة متقنة أصلًا؛ تكرار تدريسها لا يعالج التوظيف.","لا مشكلة في رسم العلامات حتى نلجأ إلى التكامل الحسي.","صحيح: يعالج التوظيف الذاتي لا المعرفة.","يخفض الهدف بدل تعليم المهارة الناقصة."],"c":"تطبقها في التمارين… لا توظفها في التعبير","p":"يعرف القاعدة ولا يوظفها ← تدريس استراتيجي ومراجعة ذاتية."},{"id":"14-14","s":14,"i":"14.3","l":"تحليل","t":"قرأت الطالبة شهد نصًا مناسبًا لصفها بدقة 97%، لكن بمعدل كلمات في الدقيقة أقل كثيرًا من المتوقع وبقراءة متقطعة كلمةً كلمة، وأجابت عن معظم أسئلة الفهم. ما الهدف التدريسي ذو الأولوية؟","o":["إعادة تعليم العلاقة بين الحرف والصوت لضمان دقة فك الرموز لديها","تعليم استراتيجيات الفهم كالتلخيص وطرح الأسئلة الذاتية أثناء القراءة","تدريب الذاكرة البصرية بحفظ قوائم كلمات منفصلة عن سياق النص","بناء الطلاقة بالقراءة المتكررة الموجهة مع نموذج قرائي وتغذية راجعة"],"a":3,"w":"البيانات تفصل المهارات الفرعية: الدقة مرتفعة (فك الرموز سليم)، والفهم مقبول، والقصور في السرعة والانسياب. فالأولوية للطلاقة بالقراءة المتكررة الموجهة مع نموذج وتغذية راجعة، لا لإعادة تعليم مهارة متقنة.","n":["دقة 97% تنفي وجود مشكلة جوهرية في فك الرموز.","الفهم جيد في معظمه، فليس الأولوية الآن.","حفظ قوائم معزولة لا يبني القراءة المتصلة.","صحيح: دقة عالية + بطء وتقطيع = طلاقة."],"c":"بدقة 97% لكن متقطعة وبطيئة","p":"دقيق وبطيء ← طلاقة، وغير دقيق ← فك رموز، ويقرأ ولا يفهم ← فهم."},{"id":"14-15","s":14,"i":"14.3","l":"تطبيق","t":"عند قراءة كلمة جديدة يقرأ الطالب راكان حرفها الأول ثم يخمّن بقيتها اعتمادًا على الصورة أو السياق، فتكثر أخطاؤه، بينما يفهم النص جيدًا إذا قُرئ عليه. ما التدخل الأنسب؟","o":["تشجيعه على الاعتماد على الصور والسياق أكثر لأنها تدعم فهمه للنص المقروء","قراءة متكررة للنص نفسه حتى يحفظ كلماته ويقرأها بسرعة أكبر في كل مرة","إتاحة قارئ صوتي في حصص القراءة كلها بدلًا من قراءته المستقلة للنصوص","تعليم صوتي صريح ومنظم لتحليل الكلمة كاملة ومزج أصواتها مع ممارسة تراكمية"],"a":3,"w":"نمط الخطأ (قراءة الحرف الأول ثم التخمين) يدل على ضعف في فك الرموز والربط بين الحرف والصوت، والفهم السماعي الجيد يؤكد أن المشكلة ليست لغوية. فالأولوية لتعليم صوتي صريح ومنظم، لا لتقوية التخمين ولا لحفظ نص بعينه ولا لتكييف يلغي المهارة المستهدفة.","n":["يعزز استراتيجية التخمين التي هي مصدر الخطأ.","القراءة المتكررة للطلاقة، ولا تعالج خلل فك الرموز.","تكييف يلغي المهارة نفسها في حصة هدفها القراءة.","صحيح: يستهدف فك الرموز الذي يكشفه نمط الخطأ."],"c":"يقرأ حرفها الأول ثم يخمّن بقيتها","p":"التخمين من أول حرف أو من الصورة علامة ضعف فك رموز ← تعليم صوتي صريح."},{"id":"14-16","s":14,"i":"14.3","l":"تحليل","t":"تستخدم المعلمة سارة قطع العد في كل حصص الجمع منذ بداية الفصل، والطالبة هيا تحل بها بإتقان، لكن المعلمة لم تكتب معها أي رمز عددي حتى الآن. ما الخلل في تطبيق نموذج «المحسوس – شبه المحسوس – المجرد» (CRA)؟","o":["البدء بالمحسوسات أصلًا، إذ كان الأولى البدء بالرموز ثم الاستعانة بالقطع عند الخطأ","قلة تنويع المحسوسات، والأنسب استبدال قطع العد بأدوات أكثر جاذبية للطالبة","عدم الاستعانة بالآلة الحاسبة لتقليل الأخطاء الحسابية لدى هيا في الحصص","غياب الانتقال المنظم إلى التمثيل المرسوم ثم الرموز المجردة مع ربط صريح بينها"],"a":3,"w":"نموذج CRA ليس مجرد استخدام أدوات؛ بل انتقال منظم من المحسوس إلى التمثيل (الرسم) ثم الرمز مع ربط صريح بين المراحل. والبقاء في المرحلة المحسوسة يبني المعنى، لكنه لا يوصل الطالبة إلى التجريد المطلوب.","n":["البدء بالمحسوس هو الصحيح عند بناء مفهوم جديد.","تنويع الأدوات لا يعالج غياب الانتقال إلى الرمز.","الحاسبة تتجاوز المهارة ولا تبني التجريد.","صحيح: المعنى بُني والانتقال إلى التجريد غائب."],"c":"لم تكتب معها أي رمز عددي","p":"CRA تسلسل لا محطة: محسوس ← رسم ← رمز مع ربط صريح."},{"id":"14-17","s":14,"i":"14.3","l":"تطبيق","t":"يخلط الطالب مشاري في الإملاء بين الحروف المتقاربة صوتيًا مثل (ت/ط) و(س/ص)، ولاحظ معلمه أنه يتذكرها أفضل حين يرى الحرف وينطقه ويتتبعه بإصبعه. أي إجراء يوظف ذلك توظيفًا منظمًا؟","o":["تزويده بقائمة الكلمات المتشابهة ليحفظها بصريًا قبل كل اختبار إملاء أسبوعي","تلوين الحروف المتشابهة بألوان مختلفة في أوراق العمل دون تغيير طريقة التدريس","تدريس متعدد الحواس يربط شكل الحرف بصوته وحركة كتابته معًا ضمن تعليم إملائي صريح","السماح له باستخدام المدقق الإملائي في جميع مهام الإملاء والتعبير الكتابي"],"a":2,"w":"التدريس متعدد الحواس (على نهج أورتن-جيلينجهام) يدمج البصر والسمع واللمس والحركة في اللحظة نفسها لخدمة العلاقة بين الصوت والرمز. وملاحظة المعلم تؤكد أن هذا التكامل يخدم مشاري، فيوظَّف داخل تعليم صريح للمهارة الإملائية المستهدفة.","n":["حفظ بصري منفرد يعتمد قناة واحدة ولا يعالج التمييز الصوتي.","اللون وحده وسيلة بصرية لا تعني تدريسًا متعدد الحواس.","صحيح: تكامل حسي منظم يخدم مهارة محددة.","المدقق يخفي المهارة المستهدفة بدل تعليمها."],"c":"يراه وينطقه ويتتبعه بإصبعه","p":"متعدد الحواس = قنوات متزامنة تخدم المهارة نفسها، لا وسيلة واحدة ملونة."},{"id":"14-18","s":14,"i":"14.3","l":"تطبيق","t":"تتأخر الطالبة دانة في نسخ مسائل الرياضيات من السبورة، وتظهر في دفترها أرقام ساقطة ومنازل مقلوبة، بينما تحل المسائل نفسها بدقة حين تُعطى لها مطبوعة. ما الإجراء الأنسب؟","o":["تكليفها بتدريبات إضافية على نسخ الأرقام من السبورة لتقوية مهارة النقل لديها","تزويدها بنسخة مطبوعة أو تظليل السطر المطلوب لتخفيف حمل الذاكرة البصرية","إعادة تدريسها القيمة المنزلية من البداية لأنها تقلب المنازل عند الكتابة","خفض عدد المسائل المطلوبة منها إلى النصف في كل حصة وكل واجب منزلي"],"a":1,"w":"نجاحها في المسائل المطبوعة يثبت أن مهارة الحل سليمة، وأن الحاجز في عملية النقل التي تُثقل الذاكرة البصرية العاملة. فالإجراء الأنسب تكييف يزيل هذا الحاجز مع بقاء المهمة الرياضية كما هي.","n":["يزيد الضغط على القناة الضعيفة نفسها.","صحيح: يزيل حاجز النقل ويحفظ الهدف.","دقتها في المسائل المطبوعة تنفي ضعف القيمة المنزلية.","يخفض المطلوب دون أن يعالج سبب الخطأ."],"c":"تحل المسائل نفسها بدقة حين تُعطى مطبوعة","p":"إذا اختفى الخطأ بتغيير طريقة الوصول، فالحل تكييف الوصول لا إعادة التدريس."},{"id":"14-19","s":14,"i":"14.3","l":"معرفة","t":"أي العبارات الآتية أدق في وصف طريقة أورتن-جيلينجهام (Orton-Gillingham)؟","o":["برنامج لتدريب الإدراك البصري للأشكال المجردة بمعزل عن مهارات القراءة والكتابة","نموذج في الرياضيات يتدرج من المحسوس إلى شبه المحسوس ثم إلى الرمز المجرد","استراتيجية لفهم المقروء تقوم على التنبؤ والتلخيص وطرح الأسئلة الذاتية","طريقة علاجية منظمة متعددة الحواس لتعليم القراءة والكتابة والتهجئة"],"a":3,"w":"أورتن-جيلينجهام من أشهر التوجهات العلاجية المنظمة متعددة الحواس؛ إذ يرى الطالب الحرف ويسمع صوته ويلمسه أو يكتبه في الوقت نفسه. وتُستخدم في القراءة والكتابة والتهجئة، لا في الرياضيات ولا في تدريب إدراكي معزول.","n":["هذا تدريب نمائي معزول، وهو عكس فكرة الطريقة.","هذا وصف نموذج CRA في الرياضيات.","هذه استراتيجيات فهم قرائي لا علاج لفك الرموز.","صحيح: علاجية، منظمة، متعددة الحواس، للقراءة والتهجئة."],"c":"طريقة أورتن-جيلينجهام","p":"أورتن-جيلينجهام للقراءة والتهجئة بتكامل حسي منظم، وCRA للرياضيات."},{"id":"14-20","s":14,"i":"14.3","l":"تطبيق","t":"يقرأ الطالب بندر النص بدقة وطلاقة مناسبتين، لكنه حين يُسأل عن الفكرة الرئيسة يكرر جملًا متفرقة منه، ولا ينتبه حين يفقد المعنى أثناء القراءة. ما التدخل ذو الأولوية؟","o":["قراءة متكررة للنص نفسه لرفع سرعته في القراءة الجهرية أمام زملائه في الصف","تعليم صوتي منظم لتحليل الكلمات الطويلة ومزج أصواتها في قوائم متدرجة الصعوبة","تعليم صريح لاستراتيجيات الفهم ومراقبته ذاتيًا أثناء القراءة","استبدال نصوص الدرس بملخصات جاهزة يقرؤها قبل الحصة بدلًا من النص الأصلي"],"a":2,"w":"الدقة والطلاقة سليمتان، فالقصور في بناء المعنى ومراقبته، وعدم انتباهه لفقد المعنى مهارة ما وراء معرفية. لذا يُدرَّس صراحةً تحديد الفكرة الرئيسة والتوقف الذاتي وأسئلة التحقق، لا الطلاقة ولا فك الرموز.","n":["الطلاقة مناسبة أصلًا، فلا تعالج ضعف الفهم.","فك الرموز سليم بنص الجذع.","صحيح: يستهدف بناء المعنى ومراقبته.","يتجاوز المهارة بدل تعليمها."],"c":"لا ينتبه حين يفقد المعنى","p":"يقرأ جيدًا ولا يفهم ← استراتيجيات فهم ومراقبة ذاتية."},{"id":"14-21","s":14,"i":"14.4","l":"معرفة","t":"أي ممارسة تمثل مبدأ «تعدد وسائل التمثيل» في التصميم الشامل للتعلم (UDL)؟","o":["إتاحة اختيار الطالب بين الإجابة كتابةً أو شفهيًا أو بعرض مصور قصير يعده بنفسه","عرض المفهوم نفسه بنص واضح ورسم معبّر وشرح صوتي متاح لجميع الطلاب من البداية","إشراك الطلاب في اختيار موضوع المشروع وفق اهتماماتهم لرفع دافعيتهم ومشاركتهم","تقديم تكييف فردي لاحق لطالب واحد بعد ظهور صعوبته في فهم الدرس"],"a":1,"w":"يقوم UDL على ثلاثة أنواع من الخيارات: للتمثيل (كيف يُعرض المحتوى)، وللتعبير (كيف يُظهر الطالب تعلمه)، وللمشاركة (كيف يُحفَّز). وتقديم المفهوم الواحد بتمثيلات متعددة مخطط لها مسبقًا للجميع هو مبدأ التمثيل.","n":["هذا مبدأ تعدد وسائل التعبير والأداء.","صحيح: تمثيلات متعددة للمحتوى نفسه ومسبقًا.","هذا مبدأ تعدد وسائل المشاركة والتحفيز.","تكييف فردي لاحق، بينما UDL تصميم مسبق للجميع."],"c":"تعدد وسائل التمثيل","p":"في UDL: التمثيل = كيف أعرض، والتعبير = كيف يجيب، والمشاركة = كيف أحفّز."},{"id":"14-22","s":14,"i":"14.4","l":"تحليل","t":"قالت معلمة: «الطالبة غلا متعلمة سمعية؛ لذا سأقدم لها الدروس كلها شرحًا صوتيًا»، مع أن بيانات غلا تُظهر فهمًا أفضل للعلاقات الهندسية حين تُعرض برسوم. ما الحكم الأدق على قرار المعلمة؟","o":["مناسب؛ لأن مطابقة التدريس لنمط المتعلم ترفع تحصيله في المواد الدراسية كلها","مناسب؛ بشرط تعزيز غلا كلما أنهت الاستماع إلى الشرح الصوتي كاملًا دون مقاطعة","غير مناسب؛ لأن التدريس السمعي لا يصلح لذوي صعوبات التعلم في أي موقف","غير مناسب؛ فطريقة العرض تُختار وفق طبيعة المحتوى وبيانات الأداء لا وفق نمط ثابت"],"a":3,"w":"افتراض «نمط تعلم» ثابت يُملى عليه التدريس لا يستند إلى دليل كافٍ، والعلاقات الهندسية بطبيعتها مكانية تخدمها الرسوم، وبيانات غلا نفسها تؤكد ذلك. فالقرار الصحيح يتبع طبيعة المهمة وبيانات الاستجابة.","n":["فرضية مطابقة الأنماط الثابتة غير مدعومة، والبيانات تخالفها هنا.","التعزيز لا يصلح قرارًا قائمًا على افتراض خاطئ.","تعميم خاطئ؛ الشرح الصوتي قد يفيد في مواقف أخرى.","صحيح: المهمة والبيانات قبل التصنيف."],"c":"بيانات غلا تُظهر فهمًا أفضل بالرسوم","p":"عبارة «الطالب بصري أو سمعي» فخ؛ اختر العرض بحسب المهمة والبيانات."},{"id":"14-23","s":14,"i":"14.4","l":"تطبيق","t":"تشرح المعلمة درس «دورة الماء في الطبيعة» بقراءة فقراته من الكتاب، فتعجز الطالبات ذوات صعوبات التعلم عن ترتيب مراحل الدورة. ما التنويع الأنسب لطريقة العرض مع بقاء هدف الدرس؟","o":["حذف مرحلتي التكاثف والهطول من الدرس والاكتفاء بمرحلة التبخر لتخفيف المحتوى","عرض المراحل بمخطط دائري مرقّم مع تجربة تبخر مصغرة وشرح لفظي موجز يربط بينهما","تكرار قراءة الفقرة من الكتاب ثلاث مرات حتى تحفظ الطالبات ترتيب المراحل","عرض فيديو طويل عن الطقس والمناخ يتضمن مشاهد متنوعة عن الماء والسحب والأمطار"],"a":1,"w":"الهدف (ترتيب مراحل الدورة) ثابت، والحاجز في طريقة العرض اللفظية المجردة. فالمخطط المرقّم يمثل التسلسل بصريًا، والتجربة تقدم خبرة محسوسة، والشرح الموجز يربطهما؛ وهذا تنويع وظيفي في التمثيل دون مساس بالمحتوى.","n":["حذف أجزاء من الهدف تعديل في المحتوى لا تنويع في العرض.","صحيح: تمثيل بصري ومحسوس للهدف نفسه.","يكرر القناة التي فشلت دون تغيير طريقة الوصول.","مثيرات كثيرة غير مركزة تزيد الحمل المعرفي الدخيل."],"c":"تعجز عن ترتيب المراحل… مع بقاء هدف الدرس","p":"ثبّت الهدف، وغيّر طريق الوصول إليه."},{"id":"14-24","s":14,"i":"14.4","l":"معرفة","t":"أي الإجراءات الآتية يُعد تعديلًا في المحتوى لا تكييفًا في طريقة العرض؟","o":["تقديم مسائل الدرس نفسها مع قطع القيمة المنزلية ومقطع مرئي يوضح خطوات الحل","تكليف الطالب بجمع بلا إعادة تجميع بينما يحل زملاؤه مسائل بإعادة التجميع","تكبير خط ورقة العمل وتوزيع المسائل على صفحتين بمسافات واضحة بين كل مسألة","قراءة نص المسألة اللفظية على الطالب مع بقاء المطلوب الحسابي نفسه دون تغيير"],"a":1,"w":"التعديل يمس المحتوى أو مستوى التوقع ونواتج التعلم، أما التكييف فيغير الوسيلة أو طريقة الوصول مع ثبات المعيار. وإعطاء الطالب مهارة أدنى (جمع بلا إعادة تجميع) يغير ما يُتوقع منه تعلمه، فهو تعديل.","n":["المسائل نفسها بوسائل إضافية = تكييف عرض.","صحيح: يغيّر مستوى المهارة المطلوبة نفسها.","تنسيق الصفحة تكييف لا يمس المحتوى.","إزالة حاجز القراءة مع بقاء الاستدلال = تكييف."],"c":"بلا إعادة تجميع… وزملاؤه بإعادة التجميع","p":"اسأل: هل تغيّر ما يتعلمه الطالب (تعديل) أم كيف يصل إليه (تكييف)؟"},{"id":"14-25","s":14,"i":"14.4","l":"تحليل","t":"قارنت المعلمة بين طريقتين لتقديم مفهوم القيمة المنزلية للطالبة لين: تطبيق تفاعلي غني بالمؤثرات تفضّله لين، ولوحة منازل مع قطع محسوسة. وأظهرت ثلاثة قياسات قصيرة دقة أعلى بوضوح بعد استخدام اللوحة والقطع. ما القرار الأنسب؟","o":["اعتماد التطبيق لأن تفضيل الطالبة يرفع دافعيتها، وهذا كافٍ لتحسن تعلمها","الجمع بين الطريقتين في كل حصة لضمان تنوع العرض بغض النظر عن النتائج","اعتماد التطبيق لأن التقنية الحديثة أنسب لطلاب اليوم من الوسائل التقليدية","اعتماد اللوحة والقطع لأنها أظهرت فاعلية في بيانات لين مع مواصلة القياس"],"a":3,"w":"القرار في تنويع العرض يتبع بيانات التعلم لا التفضيل أو الحداثة. وثلاثة قياسات متسقة ترجّح اللوحة والقطع، مع الاستمرار في القياس للتأكد من ثبات الأثر، ويمكن توظيف التطبيق لاحقًا إن خدم الهدف.","n":["التفضيل لا يساوي دليلًا على التعلم الأفضل.","تنويع بلا نظر للنتائج قد يضيف مشتتات.","قيمة التقنية وظيفية لا لحداثتها.","صحيح: البيانات تحسم لا التفضيل."],"c":"ثلاثة قياسات… دقة أعلى بعد اللوحة","p":"عند تعارض التفضيل مع البيانات، اتبع البيانات."},{"id":"14-26","s":14,"i":"14.4","l":"معرفة","t":"أي الأنشطة الآتية «لا» يُعد تدريسًا متعدد الحواس بالمعنى الدقيق؟","o":["نطق الطالب صوت الحرف وهو يتتبعه بإصبعه على بطاقة بارزة وينظر إليه","عرض الكلمة الجديدة على الشاشة بلون مختلف عن بقية كلمات الجملة","كتابة الكلمة في الرمل مع نطق مقاطعها والنظر إلى نموذجها المكتوب","تصفيق مقاطع الكلمة ثم كتابة كل مقطع وقراءته بصوت مسموع"],"a":1,"w":"التدريس متعدد الحواس دمج منظم ومتزامن لقنوات بصرية وسمعية ولمسية وحركية يخدم المهارة نفسها. وتلوين الكلمة مثير بصري واحد قد يفيد في لفت الانتباه، لكنه لا يحقق التكامل بين القنوات.","n":["يجمع السمع والنطق واللمس والبصر لعلاقة الصوت بالرمز.","صحيح: قناة بصرية واحدة ليست تكاملًا حسيًا.","يجمع الحركة والنطق والبصر للكلمة نفسها.","يجمع الحركة والسمع والكتابة لمقاطع الكلمة."],"c":"بلون مختلف عن بقية الكلمات","p":"وسيلة بصرية واحدة لا تكفي للحكم بأن الدرس متعدد الحواس."},{"id":"14-27","s":14,"i":"14.4","l":"تطبيق","t":"يدرّس المعلم الطرح مع إعادة التجميع لطلاب لا يفهمون لماذا «نستلف» من منزلة العشرات، مع سلامة قدراتهم العقلية. أي طريقة عرض تبني المعنى بصورة أوضح؟","o":["استخدام قطع القيمة المنزلية ليفك الطالب عشرة بيده إلى عشر آحاد ثم يسجل ذلك بالرموز","تحفيظ الطلاب عبارة «إذا كان الرقم العلوي أصغر نستلف من الجار» وتطبيقها في كل مسألة","زيادة عدد مسائل الطرح المكتوبة حتى يعتاد الطلاب خطوات الاستلاف بالتكرار المستمر","عرض مقطع مصور سريع لحل مسائل طرح متنوعة ثم تكليفهم بحل مسائل مماثلة له"],"a":0,"w":"صعوبة فهم إجراء مجرد مع سلامة القدرة العقلية تشير إلى الحاجة إلى المحسوسات؛ ففك العشرة إلى آحاد باليد يحوّل «الاستلاف» من قاعدة محفوظة إلى خبرة ذات معنى، ثم يُربط ذلك بالرموز للانتقال نحو التجريد.","n":["صحيح: خبرة محسوسة تبني المعنى ثم تُربط بالرمز.","حفظ قاعدة لفظية دون معنى يُنتج أداءً هشًا.","تكرار إجراء غير مفهوم لا يبني المفهوم.","عرض سريع بلا ممارسة محسوسة لا يعالج غياب المعنى."],"c":"لا يفهمون لماذا «نستلف»","p":"مفهوم مجرد غير مفهوم ← محسوس ثم تمثيل ثم رمز."},{"id":"14-28","s":14,"i":"14.5","l":"معرفة","t":"ما المقصود بـ«أمانة التنفيذ» (Treatment Fidelity) عند تطبيق تدخل مدعوم بالبحوث؟","o":["التزام المعلم بالتدخل نفسه طوال العام دون تغيير مهما كانت النتائج","رضا الطالب وأسرته عن التدخل واقتناعهم بخطواته وأنشطته المختلفة","اختيار التدخل الذي ثبتت فاعليته في أكبر عدد من الدراسات المنشورة","تطبيق المكونات الجوهرية للتدخل وجرعته كما صُمم وخُطط له"],"a":3,"w":"أمانة التنفيذ تعني أن المكونات الجوهرية والجرعة (عدد الجلسات ومدتها) طُبقت كما صُممت، وهي شرط قبل الحكم على فاعلية أي تدخل؛ إذ لا يصح نسبة النتيجة إلى تدخل لم يُطبَّق فعليًا كما هو.","n":["الجمود رغم البيانات ليس أمانة؛ القرار يتبع الاستجابة.","الرضا مؤشر قبول لا مؤشر تطبيق.","هذا معيار لاختيار التدخل لا وصف لتنفيذه.","صحيح: المكونات + الجرعة كما خُطط."],"c":"أمانة التنفيذ","p":"قبل أن تحكم على التدخل، تأكد أنه نُفّذ كما صُمم."},{"id":"14-29","s":14,"i":"14.5","l":"تحليل","t":"طُبّق تدخل للطلاقة مع الطالب عبدالرحمن ثلاث مرات أسبوعيًا كما خُطط، وتؤكد ملاحظات التنفيذ الموثقة سلامة تطبيقه. وبعد ستة أسابيع جاءت نقاط بياناته الأسبوعية متقاربة ومستوية دون اتجاه صاعد نحو الهدف. ما القرار الأنسب؟","o":["تعديل شدة التدخل أو مكوناته بحسب نمط أخطائه ثم متابعة أثر التعديل","الاستمرار في التدخل كما هو حتى نهاية الفصل لأن تنفيذه سليم وموثق","خفض الهدف السنوي ليتناسب مع مستوى أدائه الحالي المستقر منذ أسابيع","فحص أمانة التنفيذ أولًا قبل اتخاذ أي قرار يتعلق بالتدخل وشدته"],"a":0,"w":"بعد التحقق من سلامة التنفيذ، يدل المسار المستوي على استجابة غير كافية، فتنتقل الأولوية إلى تعديل الشدة أو المكون المستهدف ومتابعة أثر التعديل. والاستمرار يهدر وقت الطالب، وخفض الهدف قفز إلى أشد القرارات قبل تحسين التدريس.","n":["صحيح: تنفيذ سليم + مسار مستوٍ = عدّل التدخل.","سلامة التنفيذ لا تبرر الاستمرار مع غياب التقدم.","خفض الهدف يسبق محاولة تحسين التدريس، وهذا ترتيب خاطئ.","فخ: الجذع يثبت أن التنفيذ فُحص ووُثّق."],"c":"سلامة التطبيق موثقة… والمسار مستوٍ","p":"التنفيذ سليم والتقدم مسطح ← غيّر الشدة أو المكون، لا الهدف."},{"id":"14-30","s":14,"i":"14.5","l":"تطبيق","t":"طُبّق برنامج قرائي مدعوم بالبحوث مع الطالبة رهف، لكن سجل الحصص يُظهر أنه نُفذ في نصف الجلسات المقررة فقط، وحُذف منه جزء الممارسة الموجهة لضيق الوقت، ولم تتحسن قراءتها. ما الإجراء الأول الأنسب؟","o":["استبدال البرنامج فورًا ببرنامج آخر مدعوم بالبحوث لأنه لم ينجح مع رهف","تعديل أهداف خطة رهف الفردية لأن ضعف استجابتها أصبح واضحًا للفريق","تنفيذ البرنامج بمكوناته وجرعته كما صُمم ثم الحكم على فاعليته بالبيانات","إضافة نظام تعزيز لرفع دافعية رهف نحو القراءة مع إبقاء الجدول الحالي"],"a":2,"w":"لا يُحكم على تدخل لم يُطبَّق كما صُمم؛ فنقص الجرعة وحذف مكون جوهري يجعلان النتيجة غير معبرة عن البرنامج. والإجراء الأول استعادة أمانة التنفيذ، ثم قراءة بيانات الاستجابة لاتخاذ القرار.","n":["يستبدل تدخلًا لم يُختبر فعليًا بعد.","يغيّر الأهداف قبل معالجة الخلل الواضح في التنفيذ.","صحيح: أصلح التنفيذ قبل الحكم.","يتجاهل الحذف والجرعة الناقصة، وهما القرينة الحاسمة."],"c":"نُفذ في نصف الجلسات وحُذفت الممارسة الموجهة","p":"ضعف التنفيذ يُصلَح أولًا، ثم يُحكم على التدخل."},{"id":"14-31","s":14,"i":"14.5","l":"تطبيق","t":"يخطط المعلم لتعليم طلابه ذوي صعوبات التعلم مهارة جديدة معقدة هي «كتابة فقرة إقناعية». أي خطة تتسق أكثر مع الممارسات المدعومة بالبحوث؟","o":["عرض نماذج فقرات جيدة وترك الطلاب يستنتجون عناصرها بأنفسهم ثم يكتبون فقراتهم مباشرة","تكليف الطلاب بكتابة فقرة مستقلة أولًا لمعرفة مستواهم ثم شرح أخطائهم عليها","شرح عناصر الفقرة الإقناعية شرحًا مفصلًا ثم تكليفهم بكتابتها واجبًا منزليًا","تحديد الهدف، ونمذجة التخطيط جهرًا، ثم كتابة موجهة بتغذية راجعة، فكتابة مستقلة"],"a":3,"w":"المهارة الجديدة المعقدة تحتاج تدريسًا صريحًا: هدفًا واضحًا، ونمذجة تكشف التفكير، وممارسة موجهة بتغذية راجعة فورية، ثم استقلالًا تدريجيًا. وأي خطة تقفز من العرض أو الشرح إلى العمل المستقل تُسقط المرحلة التي يحتاجها هؤلاء الطلاب.","n":["اكتشاف دون نمذجة صريحة لمهارة معقدة جديدة.","يبدأ بالاختبار قبل التعليم.","شرح ثم استقلال دون ممارسة موجهة.","صحيح: نمذجة ← ممارسة موجهة ← استقلال."],"c":"مهارة جديدة معقدة","p":"مهارة جديدة معقدة ← تدريس صريح متدرج نحو الاستقلال."},{"id":"14-32","s":14,"i":"14.5","l":"تطبيق","t":"تتعثر الطالبة جنى في القسمة المطولة عند خطوات مختلفة في كل مرة، وتريد معلمتها تحديد نقطة البدء في التدريس. ما الإجراء المدعوم بالبحوث الأنسب للبدء؟","o":["تقديم عدد أكبر من مسائل القسمة لترسيخ المهارة بالتكرار المستقل","الانتقال إلى الآلة الحاسبة لأن المهارة تفوق قدرة جنى الحالية بكثير","تحليل المهمة إلى خطوات متسلسلة ورصد الخطوة التي يبدأ عندها الخطأ","تعزيز كل إجابة نهائية صحيحة لرفع دافعيتها نحو مسائل القسمة المطولة"],"a":2,"w":"تحليل المهام يفكك المهارة المركبة إلى خطوات صغيرة قابلة للتعليم والتقييم، فيكشف موضع الخلل بدقة بدل الحكم على الأداء كله. وبعد تحديد الخطوة الحرجة تُدرَّس صراحةً مع سقالة تُسحب تدريجيًا.","n":["التكرار المستقل يرسّخ الأخطاء غير المشخصة.","يتجاوز المهارة بدل تعليمها.","صحيح: يجزّئ المهارة ويحدد موضع التعثر.","تعزيز الناتج لا يكشف الخطوة الخاطئة."],"c":"تتعثر عند خطوات مختلفة في كل مرة","p":"مهارة طويلة متعددة الخطوات ← حلّل المهمة قبل أن تدرّس."},{"id":"14-33","s":14,"i":"14.5","l":"معرفة","t":"أي مما يلي «لا» يُعد معيارًا معتمدًا للحكم على أن استراتيجية ما مدعومة بالبحوث؟","o":["تكرار نتائجها الإيجابية في دراسات محكمة ذات منهجية جيدة وعينات مناسبة","قرب الفئة والمهارة في تلك الدراسات من خصائص الطالب المستهدف","وضوح مكوناتها الجوهرية بما يسمح بتنفيذها بأمانة وقياس أثرها","انتشارها الواسع بين المعلمين وكثرة التوصية بها في مواقع التواصل"],"a":3,"w":"الحكم بأن الممارسة مدعومة بالبحوث يقوم على جودة الدليل وتكراره ومدى انطباقه على الطالب، مع وضوح مكوناتها لتنفيذها بأمانة وقياس أثرها. أما الشهرة والانتشار فمؤشرا رواج لا دليل فاعلية.","n":["التكرار في دراسات محكمة من أقوى مؤشرات الدليل.","انطباق الدليل على الطالب شرط في القرار المهني.","وضوح المكونات يتيح الأمانة والقياس.","صحيح: الشهرة ليست دليلًا علميًا."],"c":"«لا» يُعد معيارًا معتمدًا","p":"الشهرة والحداثة ليستا دليلًا؛ الدليل = جودة + تكرار + انطباق."},{"id":"14-34","s":14,"i":"14.5","l":"تطبيق","t":"بدأ المعلم تدخلًا لتحسين دقة قراءة الكلمات متعددة المقاطع لدى الطالب سعود، ويريد أن يحكم خلال أسابيع على مدى استجابته. أي طريقة لجمع البيانات أنسب؟","o":["قياس أسبوعي قصير لقراءة كلمات جديدة من النمط المستهدف ومقارنته بخط الأساس","اختبار تحصيلي شامل في نهاية الفصل يغطي مهارات القراءة كلها بالتفصيل","استبانة أسبوعية يجيب فيها سعود عن مدى استمتاعه بأنشطة التدخل وألعابه المختلفة","سجل بعدد الأنشطة وأوراق العمل التي أنجزها سعود في كل جلسة علاجية"],"a":0,"w":"الحكم على الاستجابة يحتاج بيانات متكررة، حساسة للتغير، مرتبطة مباشرة بالمهارة المستهدفة، ويمكن مقارنة مسارها بخط الأساس. أما الاختبار النهائي فمتأخر وعام، والاستبانة تقيس الرضا، والسجل يقيس النشاط لا التعلم.","n":["صحيح: متكرر، مباشر، قابل للمقارنة بخط الأساس.","متأخر وشامل، لا يوجّه قرارًا أثناء التدخل.","يقيس الرضا لا المهارة.","يقيس كمية العمل لا التقدم."],"c":"يحكم خلال أسابيع على استجابته","p":"متابعة التقدم = قياس قصير متكرر للمهارة نفسها."},{"id":"14-35","s":14,"i":"14.6","l":"تطبيق","t":"في نشاط تعاوني بالفصل العادي لإعداد تقرير عن «مراحل نمو النبات»، تعاني الطالبة أروى من صعوبة واضحة في القراءة. أي تكييف للدور يحقق مشاركتها الفاعلة؟","o":["إعفاؤها من النشاط الجماعي وتكليفها بورقة عمل فردية مبسطة في الوقت نفسه","تكليفها بجمع أوراق المجموعة وترتيب أدواتها لتشعر بالانتماء دون أي ضغط","تكليفها بتنظيم المراحل في خط زمني مصوّر يقدمه الفريق بعد تهيئتها للمفاهيم مسبقًا","مطالبتها بقراءة الفقرة الأولى من التقرير أمام الفصل لتعزيز ثقتها بنفسها"],"a":2,"w":"تكييف التدريس الجماعي يعني دورًا يلامس هدف التعلم الأساسي ويستثمر نقاط القوة، مع دعم مسبق للمفاهيم. أما الإعفاء فعزل، والدور الشكلي يجعلها متفرجة، والقراءة الجهرية أمام الزملاء تضاعف الإحباط.","n":["الإعفاء عزل يُفشل الدمج.","دور شكلي لا يبني تعلمًا.","صحيح: دور حقيقي مرتبط بالهدف + دعم مسبق.","يضعها في موقف حرج يستهدف نقطة ضعفها."],"c":"يحقق مشاركتها الفاعلة","p":"في العمل الجماعي: لا إعفاء ولا دور شكلي، بل دور حقيقي بسقالة."},{"id":"14-36","s":14,"i":"14.6","l":"معرفة","t":"ما الفرق الأدق بين التدريس الفردي الموجه في غرفة المصادر والتدريس الجماعي المتمايز في الفصل العادي؟","o":["الفردي يعزل الطالب عن أقرانه بصورة دائمة، والجماعي يخفض معايير المنهج للطالب","الفردي علاج مكثف لمهارة قاصرة محددة، والجماعي دمج بأدوار ودعم متمايز","الفردي يعتمد على الاكتشاف الحر، والجماعي يعتمد على التلقين المباشر من المعلم","لا فرق جوهري بينهما سوى عدد الطلاب، فالأهداف والاستراتيجيات فيهما واحدة"],"a":1,"w":"التدريس الفردي الموجه تدخل مؤقت مكثف قليل المشتتات يستهدف القصور المحدد بالتدريس المباشر والتغذية الراجعة الفورية، والتدريس الجماعي المتمايز يحقق الدمج الأكاديمي والاجتماعي بمهام متسقة الأهداف مختلفة الدعم. والنمطان يتكاملان ولا يتعارضان.","n":["التدريس الفردي مؤقت مستهدف، والعزل الدائم خطأ.","صحيح: علاج مكثف فرديًا، ودمج متمايز جماعيًا.","الفردي يعتمد التدريس المباشر لا الاكتشاف الحر.","يختلفان في الهدف والإجراء لا في العدد فقط."],"c":"التدريس الفردي الموجه… والجماعي المتمايز","p":"غرفة المصادر للعلاج المكثف المؤقت، والفصل للدمج بأدوار مدعومة."},{"id":"14-37","s":14,"i":"14.6","l":"تحليل","t":"لاحظ المشرف أن جلسات الطالب حمود في غرفة المصادر تُصرف في الغالب لإنهاء واجبات الفصل العادي، بينما لم تتغير بياناته في هدف فك الترميز منذ شهرين. ما التشخيص الأدق للخلل؟","o":["قصر مدة الجلسات، والحل زيادة ساعاته في غرفة المصادر مع الإبقاء على النشاط نفسه","صعوبة واجبات الفصل العادي، والحل تخفيض متطلباتها حتى ينجزها بسهولة","خروج الجلسات عن وظيفتها العلاجية؛ فينبغي تخصيصها لتدريس هدف فك الترميز في خطته","ضعف دافعية الطالب، والحل إضافة نظام نقاط على إنجاز الواجبات المدرسية"],"a":2,"w":"غرفة المصادر بيئة للتدريس الفردي الموجه نحو أهداف الخطة، وتحويلها إلى مكان لحل الواجبات يفرغها من محتواها العلاجي. وثبات بيانات فك الترميز مع غياب تدريسه هو النتيجة المتوقعة لهذا الخلل.","n":["زيادة الوقت على النشاط الخطأ لا تغير النتيجة.","يعالج الواجبات لا هدف فك الترميز.","صحيح: الوقت لا يُصرف على الهدف المقيس.","لا قرينة على ضعف الدافعية؛ المشكلة في محتوى الجلسات."],"c":"تُصرف لإنهاء واجبات الفصل العادي","p":"جلسة غرفة المصادر لهدف الخطة، لا لحل الواجبات."},{"id":"14-38","s":14,"i":"14.6","l":"تطبيق","t":"في اختبار تعبير يقيس «تنظيم الأفكار في فقرة مترابطة»، يعاني الطالب حمد من بطء شديد في الكتابة اليدوية ورداءة في رسم الحروف. أي تكييف مناسب؟","o":["الاكتفاء منه بكتابة جملتين بدل الفقرة مراعاةً لبطء كتابته اليدوية","إتاحة الكتابة بالحاسب أو الإملاء الصوتي مع بقاء معيار تنظيم الفقرة نفسه","تصحيح ورقته بمعيار أخف في الترابط والتنظيم مقارنة بزملائه في الصف","إعفاؤه من اختبار التعبير والاكتفاء بدرجات مشاركته الشفهية في الحصص"],"a":1,"w":"البناء المقاس تنظيم الأفكار لا الخط، فالكتابة اليدوية حاجز استجابة يمكن إزالته بتغيير طريقة الاستجابة مع ثبات المعيار. أما تقليل المطلوب أو تخفيف التصحيح فتعديل يمس الهدف، والإعفاء يلغي القياس.","n":["يخفض المطلوب، فهو تعديل لا تكييف.","صحيح: يغيّر طريقة الاستجابة ويحفظ البناء.","يغيّر معيار الحكم على البناء المقاس نفسه.","يلغي قياس الهدف بدل إزالة الحاجز."],"c":"يقيس «تنظيم الأفكار»… بطء الكتابة اليدوية","p":"حدد البناء المقاس أولًا؛ فإن لم يكن الخط فغيّر طريقة الاستجابة."},{"id":"14-39","s":14,"i":"14.6","l":"تحليل","t":"اقترح فريق المدرسة للطالبة مها قارئًا صوتيًا، ووقتًا إضافيًا، وقاعة منفصلة، وتقليل عدد الأسئلة، ومساعدًا يكتب عنها، لأنها «مشخصة بصعوبات تعلم»، بينما تُظهر بياناتها أن عائقها الوحيد بطء القراءة في الاختبارات غير القرائية. ما التقويم الأدق لهذا المقترح؟","o":["مناسب؛ لأن كثرة التكييفات تضمن أفضل أداء ممكن لمها في الاختبارات","مفرط؛ فالأنسب ما يزيل عائق القراءة وحده بأقل تدخل يحفظ استقلالها","مناسب؛ لأن تشخيص صعوبات التعلم يستلزم هذه القائمة لكل طالب مشخص","مفرط؛ والأنسب إلغاء التكييفات كلها حتى لا تعتاد مها على أي دعم"],"a":1,"w":"التكييف يُختار بحسب حاجز وظيفي محدد لا بحسب اسم التشخيص، وأفضل تكييف هو الأقل تدخلًا الذي يزيل الحاجز ويحافظ على الاستقلال. والتكييفات الزائدة قد تزيد الاعتماد، وبعضها (تقليل الأسئلة) قد يمس البناء المقاس.","n":["الكثرة ليست معيار جودة وقد تزيد الاعتماد.","صحيح: حاجز واحد ← دعم بقدره.","التشخيص لا يحدد قائمة تكييفات ثابتة.","يترك الحاجز الحقيقي بلا معالجة."],"c":"عائقها الوحيد بطء القراءة","p":"التكييف بقدر الحاجز: الأقل تدخلًا والأكثر حفظًا للاستقلال."},{"id":"14-40","s":14,"i":"14.6","l":"تطبيق","t":"يتقن الطالب نايف جمع الكسور في جلساته الفردية بغرفة المصادر، لكنه يتعثر حين يحلها ضمن مجموعة تعاونية في الفصل العادي. ما الإجراء الأول الأنسب؟","o":["نقل المهارة تدريجيًا إلى مجموعة صغيرة في غرفة المصادر ثم إلى نشاط صفي مدعوم","إعادة تدريس جمع الكسور من بدايته في الجلسات الفردية لترسيخه بصورة أعمق","إعفاؤه من الأنشطة الجماعية في الرياضيات والاكتفاء بجلساته الفردية الناجحة","زيادة عدد الجلسات الفردية الأسبوعية في غرفة المصادر على المهارة نفسها"],"a":0,"w":"المهارة متقنة فرديًا، فالمشكلة ليست في الاكتساب بل في نقل أثر التعلم بين البيئات. والتعميم لا يحدث تلقائيًا؛ يحتاج جسرًا متدرجًا من الفردي إلى مجموعة مصغرة ثم إلى النشاط الصفي مع سقالات مؤقتة.","n":["صحيح: جسر متدرج من الفردي إلى الجماعي.","يعيد تعليم ما أتقنه بدل معالجة التعميم.","عزل يحرمه من الدمج ولا يعالج التعميم.","مزيد من السياق نفسه لا ينقل المهارة إلى سياق آخر."],"c":"يتقنها فرديًا… ويتعثر ضمن مجموعة","p":"ينجح هنا ويفشل هناك ← خطط للتعميم بالتدرج بين البيئات."},{"id":"15-01","s":15,"i":"15.1","l":"معرفة","t":"عند تصميم الخطة التربوية الفردية، ما الفرق الأدق بين «المحتوى» و«طريقة التدريس»؟","o":["المحتوى يحدد ما سيتعلمه الطالب، والطريقة تحدد كيف تُعلَّم له المهارة بكفاءة","المحتوى يحدد زمن الجلسات وعددها، والطريقة تحدد المعلم المسؤول عن التنفيذ","المحتوى يحدد معيار نجاح الهدف، والطريقة تحدد أداة قياسه في نهاية العام الدراسي","المحتوى يُشتق من اسم التشخيص، والطريقة تُختار بحسب ما يتوافر من وسائل في المدرسة"],"a":0,"w":"المحتوى يجيب عن «ماذا سيتعلم الطالب؟» وطريقة التدريس تجيب عن «كيف نعلّمه هذه المهارة بكفاءة؟». وكلاهما يُبنى من بيانات الطالب والاحتياج ذي الأولوية لا من التشخيص أو المتاح، ثم ينتهي الربط بهدف قابل للقياس وأداة متابعة.","n":["صحيح: ماذا يتعلم ↔ كيف يُعلَّم.","الزمن والمسؤول عناصر تنظيمية للخدمة، لا محتوى ولا طريقة.","المعيار والأداة من عناصر الهدف والمتابعة.","التشخيص والمتاح لا يحددان المحتوى ولا الطريقة."],"c":"«المحتوى» و«طريقة التدريس»","p":"المحتوى = ماذا؟ والطريقة = كيف؟ والهدف = إلى أين؟"},{"id":"15-02","s":15,"i":"15.1","l":"تطبيق","t":"أظهر تحليل أخطاء الطالب مازن في الضرب متعدد الأرقام أنه يعرف حقائق الضرب ويفهم معناه، لكنه يخطئ في ترتيب الخطوات ووضع النواتج الجزئية في منازلها. أي ربط بين الهدف وطريقة التدريس أنسب؟","o":["هدف في حفظ حقائق الضرب، يُدرَّس ببطاقات خاطفة وتكرار يومي سريع مع قياس الزمن","هدف في تنفيذ خطوات الخوارزمية بدقة، يُدرَّس بأمثلة محلولة وقائمة خطوات وممارسة موجهة","هدف في فهم معنى الضرب، يُدرَّس بتكوين مجموعات متساوية من المكعبات والرسوم","هدف في حل المسائل اللفظية، يُدرَّس بتحليل لغة المسألة وتمثيل عناصرها بالرسم"],"a":1,"w":"تحليل الأخطاء حدد الحاجة بدقة: الحقائق والمفهوم سليمان، والضعف في الإجراء وتسلسله. فيُبنى الهدف على هذه المهارة، وتُختار طريقة تطابقها: تعليم صريح للخطوات بأمثلة محلولة وقائمة مرئية وممارسة موجهة ثم استقلال.","n":["الحقائق متقنة بنص الجذع.","صحيح: الهدف والطريقة يطابقان موضع الخطأ.","المفهوم سليم، فإعادة بنائه لا تعالج الإجراء.","لا قرينة في البيانات على ضعف في المسائل اللفظية."],"c":"يعرف الحقائق ويفهم المعنى… يخطئ في الخطوات","p":"حدد نوع الضعف: مفهوم أم حقائق أم إجراء أم لغة مسألة، ثم اختر الطريقة."},{"id":"15-03","s":15,"i":"15.1","l":"تحليل","t":"كتب معلم في خطة الطالب طلال الهدف الآتي: «أن يستخدم الطالب استراتيجية الخريطة الذهنية في دروس العلوم بفاعلية». ما الخلل الأبرز في هذه الصياغة؟","o":["تذكر مادة العلوم، والأصل أن تقتصر أهداف الخطة الفردية على القراءة والرياضيات","تصف وسيلة تدريس لا أداءً متوقعًا من الطالب، وتخلو من شرط ومعيار قابلين للقياس","تحدد استراتيجية واحدة، والأصل أن يذكر الهدف أكثر من استراتيجية لضمان التنويع","قصيرة جدًا، والأصل أن يصف الهدف أنشطة الحصة وأدواتها بالتفصيل"],"a":1,"w":"الهدف يصف ما سيؤديه الطالب من سلوك قابل للملاحظة والقياس، بشرط ومعيار للحكم على الإتقان. والاستراتيجية وسيلة لتحقيق الهدف لا الهدف نفسه، وكلمة «بفاعلية» وصف انطباعي لا معيار.","n":["أهداف الخطة تشمل ما يحتاجه الطالب للوصول إلى المنهج.","صحيح: وسيلة بلا سلوك ولا معيار.","عدد الاستراتيجيات ليس معيار جودة الهدف.","الأنشطة ليست أهدافًا، والإطالة لا تصلح الصياغة."],"c":"أن يستخدم… استراتيجية… بفاعلية","p":"إذا وصف الهدف الوسيلة أو عمل المعلم فليس هدفًا؛ الهدف أداء الطالب."},{"id":"15-04","s":15,"i":"15.1","l":"تطبيق","t":"هدف الطالبة أسيل في خطتها: «أن تقرأ كلمات جديدة ثلاثية المقاطع بدقة محددة». أي أداة متابعة تتسق مع هذا الهدف؟","o":["أسئلة فهم عن نص مسموع تقيس قدرتها على استخلاص الفكرة الرئيسة والتفاصيل","قائمة كلمات ثابتة تُقرأ كل أسبوع حتى تحفظها أسيل وترتفع دقتها فيها تدريجيًا","قوائم قصيرة متكافئة من كلمات جديدة ثلاثية المقاطع تُقرأ دوريًا وتُحسب دقتها","سجل ملاحظة يصف حماسها وثقتها بنفسها أثناء حصص القراءة الجهرية"],"a":2,"w":"أداة المتابعة يجب أن تقيس المهارة الواردة في الهدف نفسها: قراءة كلمات «جديدة» من النمط المستهدف. والقوائم المتكافئة المتجددة تقيس فك الترميز لا الحفظ، وتسمح بمتابعة دورية حساسة للتغير.","n":["تقيس الفهم السماعي، وهو بناء مختلف.","فخ: القائمة الثابتة تقيس الحفظ لا فك كلمات جديدة.","صحيح: تقيس المهارة نفسها بكلمات جديدة.","تقيس جوانب وجدانية لا الدقة."],"c":"كلمات جديدة ثلاثية المقاطع بدقة","p":"طابق اسم الهدف بما تقيسه الأداة كلمةً كلمة."},{"id":"15-05","s":15,"i":"15.1","l":"تطبيق","t":"تضمنت خطة الطالب عمر إجراءين: قراءة أسئلة اختبار الرياضيات عليه شفهيًا، وتكليفه بمعايير رياضيات من صف أدنى بدل معايير صفه. ما التصنيف الأدق لهذين الإجراءين؟","o":["كلا الإجراءين تكييف لأنهما يساعدان عمر على النجاح في مادة الرياضيات هذا العام","قراءة الأسئلة تكييف يحفظ البناء المقاس، ومعايير الصف الأدنى تعديل يغيّر التوقع","كلا الإجراءين تعديل لأنهما يغيران طريقة تقديم الاختبار والمنهج لعمر","قراءة الأسئلة تعديل في المحتوى، ومعايير الصف الأدنى تكييف في طريقة الوصول"],"a":1,"w":"قراءة الأسئلة تزيل حاجز القراءة مع بقاء المهارة الرياضية المقاسة، فهي تكييف. أما استبدال معايير الصف بمعايير صف أدنى فيغير ما يُتوقع من عمر تعلمه، فهو تعديل يحتاج مبررًا فرديًا موثقًا.","n":["المساعدة على النجاح ليست معيار التصنيف.","صحيح: تغيير في الوصول ↔ تغيير في التوقع.","قراءة الأسئلة لا تغير التوقع، فلا تُعد تعديلًا.","عكسٌ للمفهومين."],"c":"قراءة الأسئلة… ومعايير من صف أدنى","p":"التكييف يغيّر الطريق، والتعديل يغيّر الوجهة."},{"id":"15-06","s":15,"i":"15.1","l":"تحليل","t":"تقرأ الطالبة وعد حاليًا 20 كلمة صحيحة في الدقيقة من نص صفها، واقترح أحد أعضاء الفريق هدفًا سنويًا بأن تقرأ 22 كلمة صحيحة في الدقيقة «ليكون الهدف قابلًا للتحقيق». ما التقويم الأدق لهذا المقترح؟","o":["مناسب؛ لأن الأهداف المنخفضة تضمن نجاح الطالبة وترفع ثقتها بنفسها أمام زميلاتها","يخلط بين القابلية للتحقيق وانخفاض التوقع؛ فالهدف يصف نموًا ذا معنى من خط الأساس","مناسب؛ لأن أي هدف رقمي يكون قابلًا للقياس بغض النظر عن قيمته","غير مناسب؛ لأن أهداف الطلاقة لا تُصاغ بعدد الكلمات الصحيحة في الدقيقة"],"a":1,"w":"قابلية التحقيق لا تعني السهولة؛ بل طموحًا واقعيًا ينطلق من خط الأساس والزمن والخدمات المتاحة. وزيادة كلمتين خلال عام كامل لا تمثل تقدمًا ذا معنى، حتى لو كانت قابلة للقياس.","n":["يضحي بالنمو الحقيقي من أجل نجاح شكلي.","صحيح: قابل للتحقيق لا يعني منخفضًا.","قابلية القياس شرط لازم لا كافٍ.","عدد الكلمات الصحيحة في الدقيقة مقياس معروف للطلاقة."],"c":"من 20 إلى 22 «ليكون قابلًا للتحقيق»","p":"الهدف الجيد طموح واقعي، لا رقم يسهل بلوغه."},{"id":"15-07","s":15,"i":"15.1","l":"تطبيق","t":"يحب الطالب ثامر كرة القدم كثيرًا، وهدفه ذو الأولوية في خطته «فهم المقروء». كيف تُوظَّف اهتماماته توظيفًا صحيحًا في تصميم التدريس؟","o":["تغيير هدفه إلى مهارات حركية رياضية لأنها مجال اهتمامه وقوته الواضحة في المدرسة","اختيار نصوص عن كرة القدم تُدرَّس عليها استراتيجيات الفهم المستهدفة نفسها","جعل اللعب بالكرة مكافأة يومية بديلًا عن أنشطة الفهم الصعبة التي يتجنبها","الاكتفاء بقراءة حرة لمجلات رياضية دون تدريس استراتيجيات فهم محددة"],"a":1,"w":"الاهتمامات عامل دافعية يخدم الهدف ولا يستبدله؛ فتُستخدم لتخصيص الأمثلة والنصوص ورفع المشاركة، مع بقاء الهدف مبنيًا على الحاجة وتدريس الاستراتيجيات المستهدفة صراحةً.","n":["يستبدل الحاجة التعليمية بالاهتمام.","صحيح: الاهتمام يخدم الهدف.","يحول الاهتمام إلى بديل عن التعلم.","قراءة حرة بلا تدريس لا تعالج ضعف الفهم."],"c":"هدفه ذو الأولوية «فهم المقروء»","p":"الاهتمام يحدد «بماذا نُدرّب» أحيانًا، لا «ماذا نستهدف»."},{"id":"15-08","s":15,"i":"15.2","l":"معرفة","t":"أي مكونات الخطة التربوية الفردية يجيب عن السؤال: «كيف نعرف أن الخطة تعمل؟»","o":["مستوى الأداء الحالي ونقاط القوة والاحتياج","متابعة التقدم بأداة ووتيرة قياس محددتين","التكييفات التي تزيل حواجز الوصول والاستجابة","الخدمات المساندة وعدد جلسات غرفة المصادر"],"a":1,"w":"لكل مكوّن سؤاله: مستوى الأداء الحالي «أين الطالب الآن؟»، والهدف «إلى أين نريد أن يصل؟»، والتدريس والخدمات «كيف سنوصله؟»، والتكييفات «ما الحاجز الذي نزيله؟»، ومتابعة التقدم «كيف نعرف أن الخطة تعمل؟».","n":["يجيب عن «أين الطالب الآن؟».","صحيح: المتابعة تختبر أثر الخطة.","تجيب عن «ما الحاجز الذي نزيله؟».","تجيب عن «كيف سنوصله؟» لا عن أثر الخطة."],"c":"كيف نعرف أن الخطة تعمل؟","p":"احفظ سؤال كل مكوّن؛ فالاختبار يأتي غالبًا بالسؤال لا بالاسم."},{"id":"15-09","s":15,"i":"15.2","l":"تطبيق","t":"نسخ معلم معيار المنهج «يقرأ الطالب نصوصًا معلوماتية ويستخلص أفكارها» حرفيًا ليكون هدفًا سنويًا في خطة الطالب فهد، الذي تُظهر بياناته ضعفًا شديدًا في فك الكلمات متعددة المقاطع مع فهم سماعي جيد. ما التصويب الأنسب؟","o":["صياغة هدف فردي في فك الكلمات من خط أساسه، مع تكييف يتيح وصوله إلى محتوى صفه","الإبقاء على المعيار هدفًا كما هو لأن الخطة الفردية يجب أن تطابق المنهج حرفيًا","استبدال المعيار بمعايير قراءة من صفوف أدنى بكثير وإيقاف مشاركته في محتوى صفه","حذف أهداف القراءة من خطته والاكتفاء بتكييفات الوصول في المواد الأخرى"],"a":0,"w":"المنهج مرجع للوصول والتقدم، لكن الهدف الفردي يُشتق من أداء الطالب وحاجته ذات الأولوية ولا يُنسخ حرفيًا. فيُعالج العائق (فك الكلمات) بهدف قابل للقياس، ويستمر وصول فهد إلى محتوى صفه بتكييفات مناسبة دون خفض تلقائي للتوقعات.","n":["صحيح: هدف مفرَّد + وصول للمنهج.","النسخ الحرفي يتجاهل الفجوة الموثقة.","يخفض التوقعات ويعزل الطالب عن محتوى صفه.","يترك المهارة الأساسية بلا علاج."],"c":"نسخ معيار المنهج حرفيًا… ضعف في فك الكلمات","p":"الهدف يسترشد بالمنهج ويُفرَّد بالبيانات."},{"id":"15-10","s":15,"i":"15.2","l":"تحليل","t":"قرر فريق المدرسة تقديم الخدمة نفسها – حصتين أسبوعيًا في غرفة المصادر لتدريب عام على القراءة – لجميع طلاب صعوبات التعلم لأنها المتاحة في الجدول. ما الخلل الأهم في هذا القرار؟","o":["اختيار الخدمة بحسب المتاح لا بحسب حاجة كل طالب وهدفه وإمكان متابعة أثرها","قلة عدد الحصص، والأصل أن يحصل كل طالب على خمس حصص أسبوعيًا على الأقل في غرفة المصادر","اختيار القراءة مجالًا للخدمة، والأصل أن تبدأ الخدمات بالرياضيات لسهولة قياسها","عدم إشراك الأسرة في تحديد موعد الحصص داخل الجدول المدرسي الأسبوعي"],"a":0,"w":"الخدمات تُختار وفق الحاجة والهدف، لا وفق المتاح أو التشخيص وحده، ويجب أن ترتبط مباشرة بهدف موثق يمكن متابعة أثره. والخدمة الموحدة العامة تتجاهل اختلاف احتياجات الطلاب داخل الفئة.","n":["صحيح: الخدمة تتبع الحاجة لا الجدول.","لا يوجد عدد ثابت صحيح لكل الطلاب؛ الشدة تتبع الحاجة.","لا أولوية ثابتة لمادة على أخرى؛ الحاجة تحدد المجال.","تفصيل تنظيمي لا يعالج الخلل الجوهري."],"c":"الخدمة نفسها لجميع الطلاب لأنها المتاحة","p":"«الخدمة نفسها للجميع» و«لأنها متاحة» علامتا خطأ في أسئلة الخطة."},{"id":"15-11","s":15,"i":"15.2","l":"تطبيق","t":"أعدّت معلمة للطالبة نوف خطة تضم أربعة عشر هدفًا سنويًا تغطي كل ملاحظة ضعف ظهرت في التقييم. ما الإجراء الأنسب لتحسين الخطة؟","o":["الإبقاء على الأهداف كلها لأن كثرتها دليل على شمول الخطة وجودتها ودقة التقييم","توزيع الأهداف على معلمي المواد ليتولى كل معلم ما يخص مادته منفردًا","ترتيب الاحتياجات بحسب أثرها في الوصول للمنهج والتقدم والتركيز على ذات الأولوية","اختيار الأهداف الأسهل تحقيقًا لضمان نجاح نوف في نهاية العام الدراسي الحالي"],"a":2,"w":"لا تتحول كل ملاحظة إلى هدف مستقل؛ فالأهداف الكثيرة غير المرتبة تشتت التدريس. وتُعطى الأولوية للمهارات التي تمثل عائقًا مباشرًا أمام الوصول للمنهج والاستقلال، مع مراعاة أثرها وإمكان تحسينها بالتدريس.","n":["الكثرة لا تعني الجودة بل التشتت.","يفكك الخطة ويُضعف العمل الفريقي المتسق.","صحيح: أولويات بحسب الأثر.","السهولة ليست معيار أولوية."],"c":"أربعة عشر هدفًا تغطي كل ملاحظة ضعف","p":"الأولوية للحاجة الأكثر أثرًا، لا الأكثر عددًا ولا الأسهل."},{"id":"15-12","s":15,"i":"15.2","l":"معرفة","t":"أي الممارسات الآتية «لا» ينسجم مع مبدأ العمل الفريقي في تصميم الخطة التربوية الفردية؟","o":["انفراد معلم التربية الخاصة بكتابة الأهداف ثم إرسالها إلى الأسرة للتوقيع","إشراك معلم التعليم العام في تحليل متطلبات المنهج ومقارنتها بأداء الطالب","الاستماع إلى الطالب في نقاط قوته وما يساعده على التعلم بما يناسب عمره","أخذ ملاحظات الأسرة عن أداء الطالب في المنزل عند تحديد الاحتياجات"],"a":0,"w":"تصميم الخطة مسؤولية فريق: معلم التعليم العام يوضح متطلبات المنهج، والأسرة تقدم معلومات عن الأداء خارج المدرسة وتشارك في القرار، وصوت الطالب يفيد بحسب عمره. وانفراد معلم واحد بالأهداف يحوّل الأسرة إلى موقِّع لا شريك.","n":["صحيح: انفراد يُقصي الشركاء.","ممارسة فريقية سليمة تربط الخطة بالمنهج.","صوت الطالب يدعم الدافعية والاستقلال.","معلومات الأسرة تثري صورة الأداء."],"c":"«لا» ينسجم… انفراد… للتوقيع","p":"الخطة قرار فريق؛ والأسرة شريك لا متلقٍّ."},{"id":"15-13","s":15,"i":"15.2","l":"تحليل","t":"في خطة الطالب هادي: هدف سنوي في «حل المسائل اللفظية ذات الخطوتين»، وخدمة «تدريب على حقائق الجمع والطرح»، وأداة متابعة «اختبار سرعة في الحقائق الحسابية». ما التقويم الأدق لاتساق الخطة؟","o":["متسقة؛ لأن عناصرها جميعًا تنتمي إلى مجال الرياضيات نفسه وتخدم تحصيله فيه","متسقة؛ لأن الحقائق الحسابية متطلب كافٍ لحل أي مسألة لفظية مهما كان نوعها","ضعيفة الاتساق؛ فالخدمة والقياس لا يستهدفان المهارة الواردة في الهدف","ضعيفة الاتساق؛ لأن أهداف الرياضيات لا تُتابع باختبارات قصيرة متكررة"],"a":2,"w":"اتساق الخطة يعني إمكان تتبع كل خدمة وكل قياس إلى الحاجة والهدف نفسيهما. والهدف هنا فهم المسألة اللفظية وتمثيلها واختيار العملية، بينما الخدمة والقياس يستهدفان الحقائق؛ فلن تكشف المتابعة تقدمًا في الهدف الحقيقي.","n":["الانتماء لمادة واحدة لا يعني الاتساق.","الحقائق قد تكون متطلبًا لكنها لا تكفي لحل المسألة اللفظية.","صحيح: الخدمة والقياس بعيدان عن مهارة الهدف.","الاختبارات القصيرة المتكررة مناسبة للمتابعة."],"c":"هدف: مسائل لفظية… خدمة وقياس: حقائق","p":"تتبّع الخيط: حاجة ← هدف ← خدمة ← قياس؛ وأي انقطاع يعني ضعف الاتساق."},{"id":"15-14","s":15,"i":"15.3","l":"معرفة","t":"طبّقت المدرسة في بداية العام مقياسًا قصيرًا على جميع طلاب الصف الثاني لتحديد من قد يحتاج إلى فحص أعمق في القراءة. ما نوع هذا القياس؟","o":["قياس تشخيصي يحدد طبيعة صعوبة كل طالب ونمط أخطائه بدقة","قياس ختامي يحكم على مستوى إنجاز الطلاب بعد فترة تعلم","فرز (مسح) يحدد الحاجة إلى تقييم أعمق دون أن يقدم تشخيصًا","قياس تكويني يوجه تعديل الشرح أثناء الحصة بصورة فورية"],"a":2,"w":"الفرز إجراء أولي قصير يُطبَّق على الجميع ليجيب عن سؤال واحد: من يحتاج إلى فحص أعمق؟ ولا يفسر طبيعة الصعوبة؛ فذلك دور التقييم التشخيصي اللاحق.","n":["التشخيص يأتي بعد الفرز ويفسر نمط الخطأ.","الختامي بعد التعلم لا في بدايته.","صحيح: قصير، للجميع، يحدد من يُفحص.","التكويني أثناء التدريس لا لفرز الطلاب."],"c":"لجميع الطلاب… من قد يحتاج إلى فحص أعمق","p":"الفرز يجيب «من؟»، والتشخيص يجيب «ما طبيعة الصعوبة؟»."},{"id":"15-15","s":15,"i":"15.3","l":"معرفة","t":"طبّق معلم اختبارًا في فهم المقروء على طالب مرتين بفاصل قصير وفي ظروف متماثلة، فجاءت الدرجتان متقاربتين جدًا. ماذا تدعم هذه النتيجة؟","o":["صدق الاختبار في قياس فهم المقروء بصورة قاطعة ونهائية","معيارية الاختبار وصلاحية مقارنته بمجموعة مرجعية مناسبة","حساسية الاختبار للتغير ومناسبته لمتابعة التقدم الأسبوعي","ثبات القياس، ولا تكفي وحدها للحكم على صدق تفسير الدرجة"],"a":3,"w":"الثبات يتعلق باتساق نتائج القياس، والتقارب بين تطبيقين متماثلين دليل عليه. أما الصدق فيتعلق بمدى دعم الأدلة لتفسير الدرجة للغرض المقصود، وقد يكون الاختبار ثابتًا ويقيس شيئًا غير ما نريد.","n":["الثبات لا يثبت الصدق؛ هما مفهومان مختلفان.","المعيارية تتعلق بتوحيد الإجراءات والمقارنة بمجموعة.","تقارب درجتين متتاليتين لا يخبرنا عن الحساسية للتغير عبر التدخل.","صحيح: الاتساق = ثبات."],"c":"مرتين… فجاءت الدرجتان متقاربتين","p":"ثبات = اتساق؛ وصدق = صحة التفسير للغرض."},{"id":"15-16","s":15,"i":"15.3","l":"تطبيق","t":"في اختبار مقنن يقيس «سرعة إجراء العمليات الحسابية» خلال زمن محدد، طلب ولي أمر الطالب أنس منحه ضعف الوقت لأنه بطيء المعالجة. ما الإجراء الأنسب؟","o":["منحه ضعف الوقت ثم مقارنة درجته بمعايير الاختبار الأصلية كما يحدث مع زملائه عادةً","إلغاء تطبيق الاختبار عليه والاكتفاء بانطباع معلمه العام عن مستواه","عدم إضافة وقت يغيّر ما يقيسه الاختبار، وتفسير النتيجة مع مصادر بيانات أخرى","منحه وقتًا إضافيًا مع استبعاد الأسئلة التي لم يصل إليها من التصحيح"],"a":2,"w":"التكييف المناسب يزيل عائقًا غير مقصود دون أن يغير البناء المقاس. وهنا الزمن جزء من البناء نفسه، فإضافته تجعل مقارنة الدرجة بالمعايير الأصلية غير سليمة؛ فالأنسب الحفاظ على المعيارية وتفسير النتيجة ضمن مصادر متعددة.","n":["يفسد المعيارية ثم يقارن بمعايير لم يعد مطابقًا لها.","الانطباع لا يعوض القياس المنظم.","صحيح: يحفظ البناء ويكمل الصورة بمصادر أخرى.","يغير الزمن وطريقة التصحيح معًا، فيفقد الاختبار معناه."],"c":"يقيس «سرعة»… خلال زمن محدد","p":"الوقت الإضافي مقبول فقط إذا لم تكن السرعة هي ما يُقاس."},{"id":"15-17","s":15,"i":"15.3","l":"تحليل","t":"حصل الطالب عبدالعزيز على 65% في اختبار إملاء، وبتحليل البنود تبيّن أن معظم أخطائه في الكلمات المنتهية بالتاء المربوطة والتاء المفتوحة، مع دقة عالية في بقية الأنماط. ما القرار الأنسب لتصميم برنامجه؟","o":["إعادة تدريس منهج الإملاء كاملًا من بدايته لأن درجته الكلية دون المستوى المطلوب","اعتبار الدرجة مقبولة وعدم وضع أي هدف إملائي في خطته هذا الفصل الدراسي","هدف وتدريس صريح مركّز على التمييز بين التاءين مع متابعة دورية لهذا النمط","خفض عدد كلمات الإملاء الأسبوعية إلى النصف حتى ترتفع درجته الكلية"],"a":2,"w":"الدرجة الكلية تدل على فجوة لكنها لا تفسر طبيعتها، وتحليل البنود ونوع الخطأ حوّلها إلى احتياج محدد قابل للتدريس. فيُبنى هدف مركز وتدريس صريح للنمط ومتابعة حساسة له، بدل علاج عام أو تجاهل أو خفض للمطلوب.","n":["علاج عام لمهارات متقنة يهدر الوقت.","يتجاهل نمط خطأ واضحًا ومتكررًا.","صحيح: من الدرجة إلى نمط الخطأ إلى هدف.","يخفض المطلوب ولا يعالج النمط."],"c":"معظم أخطائه في التاء المربوطة والمفتوحة","p":"لا تقف عند النسبة؛ حلّل البنود لتعرف ماذا تعلّم."},{"id":"15-18","s":15,"i":"15.3","l":"تطبيق","t":"يريد المعلم أن يعرف هل أتقن الطالب زياد مهارة «جمع الكسور متحدة المقامات» وفق مستوى إتقان محدد، دون مقارنته بأقرانه. أي نوع من الاختبارات أنسب لهذا الغرض؟","o":["اختبار معياري المرجع يحدد موقعه بالنسبة إلى مجموعة معيارية مناسبة","مقياس فرز عام يحدد من يحتاج إلى تقييم أعمق في مادة الرياضيات","اختبار محكي المرجع يقارن أداءه بمستوى الإتقان المحدد للمهارة","استبانة اتجاهات تقيس ميله إلى مادة الرياضيات ومشاعره نحوها"],"a":2,"w":"الاختبار محكي المرجع يقارن أداء الطالب بمعيار أو مستوى إتقان محدد لمهارة بعينها، وهو ما يطلبه المعلم. أما معياري المرجع فيفسر الأداء نسبةً إلى مجموعة مرجعية، وهذا ما استبعده الجذع صراحةً.","n":["يقارن بالمجموعة، وهو ما لا يريده المعلم.","الفرز عام ولا يحكم على إتقان مهارة محددة.","صحيح: مقارنة بمعيار إتقان لا بأقران.","يقيس الاتجاه لا الإتقان."],"c":"وفق مستوى إتقان… دون مقارنته بأقرانه","p":"إتقان مهارة بمعيار = محكي المرجع؛ وموقع بين الأقران = معياري المرجع."},{"id":"15-19","s":15,"i":"15.3","l":"تحليل","t":"جاءت قياسات الطلاقة الأسبوعية الخمسة للطالبة ليان: 31، 34، 33، 36، ثم 22 كلمة صحيحة في الدقيقة، وفي يوم القياس الأخير كانت عائدة من غياب مرضي. ما القرار الأنسب؟","o":["خفض هدفها السنوي فورًا لأن القياس الأخير يدل على تراجع واضح في أدائها القرائي","تغيير التدخل كاملًا لأن القياس الأخير جاء أقل بوضوح من القياسات السابقة","الاعتماد على القياس الأخير وحده في التقرير لأنه الأحدث والأدق","عدم بناء قرار على النقطة الأخيرة وحدها، وإعادة القياس مع قراءة الاتجاه العام"],"a":3,"w":"القياسات المتكررة تكشف الاتجاه وتقلل أثر التذبذب العارض. والاتجاه هنا صاعد في أربعة قياسات، والنقطة الأخيرة شاذة ولها تفسير ظرفي (الغياب المرضي)؛ فالقرار الكبير لا يُبنى على قياس واحد متذبذب.","n":["قرار كبير من نقطة واحدة ظرفية.","يقطع تدخلًا يظهر اتجاهًا صاعدًا.","الأحدث ليس الأدق إذا تأثر بظرف عارض.","صحيح: الاتجاه أقوى من نقطة شاذة مفسَّرة."],"c":"كانت عائدة من غياب مرضي","p":"اقرأ الاتجاه لا النقطة، وأعد قياس النقطة الشاذة قبل أي قرار."},{"id":"15-20","s":15,"i":"15.3","l":"تطبيق","t":"أظهر فرز بداية العام أن الطالب سلطان «معرّض للخطر» في الرياضيات، ويريد معلمه تحديد المهارات الفرعية التي يبدأ بتدريسها. ما الخطوة الأنسب؟","o":["الاكتفاء بنتيجة الفرز وبدء تدريس منهج الرياضيات كاملًا من الوحدة الأولى","تطبيق اختبار ختامي لمادة الصف السابق لمعرفة درجته النهائية فيها بدقة","تطبيق تقييم تشخيصي يكشف المهارات الفرعية ونمط الأخطاء ليبني عليه الهدف","إحالته مباشرة إلى برنامج مكثف دون أي قياس إضافي لمهاراته الفرعية"],"a":2,"w":"الفرز يحدد الحاجة إلى فحص أعمق ولا يحدد ماذا نعلّم. والقرار المطلوب (اختيار المهارات الفرعية) يحتاج تقييمًا تشخيصيًا يكشف مواطن القوة والاحتياج ونمط الخطأ، ثم تُبنى عليه الأهداف والتدريس.","n":["الفرز لا يحدد المهارات الفرعية المطلوب تدريسها.","الختامي يحكم على إنجاز سابق لا على نقطة البدء.","صحيح: القرار المطلوب يحدد نوع القياس.","يتخذ قرارًا كبيرًا بلا بيانات تشخيصية."],"c":"تحديد المهارات الفرعية التي يبدأ بها","p":"ابدأ بسؤال: ما القرار الذي سأتخذه من النتيجة؟ ثم اختر الأداة."},{"id":"15-21","s":15,"i":"15.4","l":"معرفة","t":"بعد شهرين من إيقاف التدريب المكثف على جمع الأعداد ذات المنزلتين، طبّق المعلم قياسًا على الطالب منصور فوجده يؤدي المهارة بالدقة نفسها. أي مرحلة من مراحل تطور المهارة يتحقق منها هذا الإجراء؟","o":["التعميم: استخدام المهارة في مواد وسياقات وأشخاص جدد","الاكتساب: تعلّم الأداء الجديد أول مرة بالنمذجة والممارسة","المحافظة: استمرار الأداء بمرور الزمن بعد خفض التدريب","الطلاقة: أداء المهارة بكفاءة وسرعة مناسبتين مع الدقة"],"a":2,"w":"المحافظة تختبر استمرار الأداء بعد مرور الزمن وخفض التدريب المكثف، والقرينة هنا «بعد شهرين من الإيقاف» مع بقاء المهمة نفسها. ولو تغيّر السياق أو المادة مع بقاء المهارة لكان ذلك تعميمًا.","n":["التعميم يتطلب سياقًا جديدًا، والسياق هنا لم يتغير.","الاكتساب مرحلة سابقة تحققت أثناء التدريب.","صحيح: زمن لاحق + المهارة نفسها = محافظة.","الطلاقة تتعلق بالكفاءة والسرعة لا بالاستمرار عبر الزمن."],"c":"بعد شهرين من إيقاف التدريب","p":"زمن لاحق = محافظة، وسياق جديد = تعميم."},{"id":"15-22","s":15,"i":"15.4","l":"تطبيق","t":"يتعثر الطالب صالح في الضرب، وتُظهر البيانات أنه لا يفهم معنى «المجموعات المتساوية»، بينما يتقن حقائق الجمع. ما نقطة البدء الأنسب في تسلسل أهدافه؟","o":["إعادة تدريس حقائق الجمع كاملة لأنها تسبق الضرب في ترتيب المنهج الدراسي","حفظ جدول الضرب بالتكرار اليومي حتى يستغني عن فهم معنى العملية نفسها","الانتقال إلى القسمة لأنها الدرس التالي في ترتيب الكتاب المدرسي","بناء مفهوم المجموعات المتساوية بالمحسوس والتمثيل ثم ربطه برمز الضرب"],"a":3,"w":"المتطلب السابق المقصود هو المهارة ذات العلاقة الوظيفية التي يعيق نقصها التعلم الحالي، وهي هنا مفهوم المجموعات المتساوية. أما حقائق الجمع فمتقنة، والرجوع إليها لمجرد أنها أسبق في المنهج إفراط في الرجوع إلى الخلف.","n":["يعيد مهارة متقنة لمجرد أسبقيتها.","حفظ بلا معنى يترك الفجوة المفاهيمية قائمة.","قفز إلى الأمام فوق فجوة لم تُعالج.","صحيح: يعالج المتطلب الوظيفي الناقص فقط."],"c":"لا يفهم «المجموعات المتساوية»… يتقن الجمع","p":"ارجع إلى المتطلب الذي تثبت البيانات نقصه، لا إلى كل ما هو أسبق."},{"id":"15-23","s":15,"i":"15.4","l":"تحليل","t":"وضعت معلمة للطالبة سلمى هدفًا مرحليًا في رفع سرعة قراءة الكلمات متعددة المقاطع، مع أن بياناتها تُظهر دقة لا تتجاوز 60% في قراءة هذه الكلمات. ما الخلل في هذا التسلسل؟","o":["لا خلل؛ فالسرعة ترفع الدقة تلقائيًا مع كثرة الممارسة الموقوتة يوميًا","اختيار الكلمات متعددة المقاطع، والأولى العودة إلى تعليم الحروف المنفردة","إغفال المحافظة، والأولى قياس استمرار الأداء قبل وضع أي هدف جديد","القفز إلى الطلاقة قبل تثبيت الدقة؛ فالأولى بناء الدقة ثم رفع الكفاءة"],"a":3,"w":"مراحل تطور المهارة تبدأ بالاكتساب والدقة ثم الطلاقة؛ فالسرعة لا تعوض الأخطاء، ورفعها مع دقة منخفضة يرسّخ الخطأ. لذا يُثبَّت الأداء الصحيح أولًا، ثم تُبنى الكفاءة مع الحفاظ على الدقة.","n":["الممارسة الموقوتة مع أخطاء كثيرة ترسّخ الخطأ.","رجوع مفرط بلا دليل على ضعف الحروف.","المحافظة تأتي بعد الإتقان لا قبله.","صحيح: الدقة قبل السرعة."],"c":"رفع سرعة… مع دقة لا تتجاوز 60%","p":"لا تبدأ بالطلاقة إذا كانت الأخطاء كثيرة؛ ثبّت الدقة أولًا."},{"id":"15-24","s":15,"i":"15.4","l":"تطبيق","t":"تهدف خطة الطالب بدر إلى أن ينجز واجباته متعددة الخطوات باستقلال، وهو حاليًا لا يبدأ أي خطوة إلا حين يذكّره المعلم بها. أي تسلسل للأهداف المرحلية أنسب؟","o":["إنجاز المهمة دون تذكير ← استخدام قائمة الخطوات ← تذكير المعلم بكل خطوة من خطواتها","تذكير المعلم بكل خطوة طوال العام ← إنجاز جميع الواجبات في مواعيدها المحددة","حفظ خطوات المهمة شفهيًا ← اختبار تحريري فيها ← الانتقال إلى مهمة جديدة","قائمة خطوات بتذكير المعلم ← بتلميح مختصر ← استخدام ذاتي ← مراجعة الناتج دون تذكير"],"a":3,"w":"التسلسل من الدعم إلى الاستقلال يخفض المساعدة تدريجيًا وينقل مسؤولية التنظيم إلى الطالب: من تذكير كامل إلى تلميح، ثم استخدام ذاتي للأداة، ثم مراقبة ذاتية للناتج. والهدف ليس الاعتماد الدائم على قائمة أو معلم.","n":["ترتيب مقلوب يبدأ بالغاية وينتهي بأقصى دعم.","يُبقي الدعم ثابتًا فلا يبني الاستقلال.","حفظ الخطوات لا يعني تطبيقها في المهمة.","صحيح: دعم يتناقص حتى الاستقلال."],"c":"لا يبدأ إلا حين يذكّره المعلم","p":"تسلسل الدعم: كامل ← جزئي ← ذاتي ← مستقل."},{"id":"15-25","s":15,"i":"15.4","l":"معرفة","t":"في الهدف: «عند تقديم نص مناسب لمستواه، يحدد الطالب الفكرة الرئيسة ويدعمها بتفصيلين، في 4 من 5 فرص عبر ثلاثة قياسات متتالية»، ماذا تمثل عبارة «في 4 من 5 فرص عبر ثلاثة قياسات متتالية»؟","o":["الشرط الذي يصف السياق أو الظروف التي يُؤدى فيها السلوك","السلوك القابل للملاحظة الذي سيؤديه الطالب في الهدف","الاستراتيجية التي سيستخدمها المعلم لتدريس هذا الهدف","المعيار الذي يحدد مستوى الأداء المطلوب للحكم على الإتقان"],"a":3,"w":"عناصر الهدف القابل للقياس: الشرط (تحت أي ظروف؟) وهو «عند تقديم نص مناسب»، والسلوك (ماذا سيفعل؟) وهو «يحدد الفكرة ويدعمها»، والمعيار (إلى أي مستوى؟) وهو «4 من 5 فرص عبر ثلاثة قياسات».","n":["الشرط هو «عند تقديم نص مناسب لمستواه».","السلوك هو «يحدد الفكرة الرئيسة ويدعمها».","الهدف لا يتضمن استراتيجية المعلم أصلًا.","صحيح: يجيب عن «إلى أي مستوى؟»."],"c":"«في 4 من 5 فرص عبر ثلاثة قياسات»","p":"الشرط = متى وأين، والسلوك = ماذا، والمعيار = بأي مستوى."},{"id":"15-26","s":15,"i":"15.4","l":"تطبيق","t":"حقق الطالب يوسف معيار الإتقان في هدفه المرحلي الثاني خلال ثلاثة أسابيع بدلًا من ثمانية متوقعة، وثبت أداؤه عبر قياسات متتالية. ما القرار الأنسب؟","o":["الانتقال إلى الخطوة التالية ورفع مستوى التحدي وفق البيانات قبل الموعد المخطط","إبقاؤه على الهدف نفسه حتى نهاية الأسابيع الثمانية التزامًا بالجدول الزمني للخطة","إيقاف أهداف هذا المجال والاكتفاء بما حققه حتى نهاية العام الدراسي","إضافة تدريبات على الهدف نفسه لضمان رسوخه قبل أي انتقال مستقبلي"],"a":0,"w":"الانتقال بين الأهداف يُبنى على دليل الإتقان لا على مرور الزمن. والخطة تستجيب للبيانات في الاتجاهين؛ فكما يُعدَّل التدريس عند البطء، يُرفع التحدي ويُسرَّع التسلسل عند التقدم السريع الثابت.","n":["صحيح: الإتقان المستقر يفتح الانتقال.","يجعل الجدول الزمني سقفًا يعطل التقدم.","يوقف النمو بدل استثماره.","الثبات عبر قياسات متتالية تحقق، فالتدريب الإضافي هدر."],"c":"ثلاثة أسابيع بدل ثمانية… وثبت أداؤه","p":"الانتقال بالإتقان لا بالتقويم الزمني، في البطء والسرعة معًا."},{"id":"15-27","s":15,"i":"15.4","l":"تحليل","t":"اقترح معلم الأهداف المرحلية الآتية لهدف سنوي في فك الكلمات متعددة المقاطع للطالب عادل: إكمال عشر أوراق عمل، وحضور عشرين جلسة في غرفة المصادر، واستخدام تطبيق قرائي يوميًا. ما التقويم الأدق لهذه الأهداف المرحلية؟","o":["مناسبة؛ لأنها قابلة للعدّ والتوثيق الموضوعي بدقة وسهولة من قبل المعلم","مناسبة؛ لأنها موزعة زمنيًا وتغطي الفصل الدراسي كاملًا بانتظام","غير مناسبة؛ لأن الأهداف المرحلية لا تُكتب لمهارات القراءة أصلًا","تصف أنشطة وحضورًا وأدوات لا نواتج تعلم، فلا تثبت تقدم عادل نحو الهدف"],"a":3,"w":"الهدف المرحلي محطة تعلم ذات معنى تقرّب من الهدف السنوي وتُقاس بوضوح، مثل إتقان مكوّن ضروري بمعيار محدد. أما عدد الأوراق والجلسات واستخدام تطبيق فأنشطة وحضور ووسائل قد تكتمل كلها دون أن يتعلم الطالب.","n":["فخ: قابلية العدّ لا تجعل النشاط ناتج تعلم.","التوزيع الزمني لا يعني تقدمًا في المهارة.","الأهداف المرحلية تُستخدم في القراءة وغيرها.","صحيح: النشاط ليس ناتج تعلم."],"c":"إكمال أوراق… حضور جلسات… استخدام تطبيق","p":"اسأل: لو تحقق هذا الهدف المرحلي، هل نعرف أن الطالب تعلّم شيئًا؟"},{"id":"15-28","s":15,"i":"15.6","l":"معرفة","t":"أي العبارات الآتية أدق في وصف التخطيط الانتقالي للطلاب ذوي صعوبات التعلم؟","o":["إجراء يُنفذ في سنة التخرج فقط ويقتصر على البحث عن وظيفة مناسبة للطالب بعد المدرسة","عملية مستمرة تربط التعلم الحالي بالمرحلة التالية وبحياة الطالب بعد المدرسة","قائمة زيارات ميدانية لجهات العمل والجامعات تنظمها المدرسة قرب نهاية المرحلة","قرار يتخذه المعلم والأسرة مبكرًا بتحديد المستقبل المهني للطالب نيابة عنه"],"a":1,"w":"التخطيط الانتقالي عملية مستمرة لا حدث، ولا يقتصر على الوظيفة أو سنة التخرج؛ يبدأ من رؤية مستقبلية، ويستخدم التقييم لتحديد الفجوات، ثم يبني أهدافًا وخدمات وخبرات تزيد استقلال الطالب ومشاركته، والطالب محوره.","n":["يحصره في توقيت متأخر ومجال واحد.","صحيح: عملية مستمرة متمركزة حول الطالب.","الزيارات أنشطة لا خطة.","يُقصي الطالب عن قرار مستقبله."],"c":"وصف التخطيط الانتقالي","p":"الانتقال عملية لا حدث، والطالب محورها."},{"id":"15-29","s":15,"i":"15.6","l":"تطبيق","t":"ينتقل الطالب معاذ، ذو صعوبات التعلم، من المرحلة الابتدائية إلى المتوسطة في العام القادم. ما الإجراء الانتقالي الأنسب؟","o":["نقل المعلومات الضرورية عنه، وتعريفه بالبيئة الجديدة، وتدريبه على التنظيم الذاتي","الانتظار حتى بدء العام ليقيّم المعلم الجديد احتياجاته من الصفر دون أي معلومات سابقة عنه","إعادة تشخيصه كاملًا قبل الانتقال لأن التشخيص السابق لا يصلح للمرحلة المتوسطة","إرسال ملفه بجميع تفاصيله إلى كل معلمي المدرسة الجديدة دون تحديد أو تنسيق مسبق"],"a":0,"w":"الانتقال بين المراحل الدراسية جزء من التخطيط الانتقالي، ويركز على نقل المعلومات الضرورية وتعريف الطالب بالبيئة الجديدة وبناء الاستراتيجيات والاستقلال. والانتظار يهدر ما تراكم من بيانات، والإرسال غير المنضبط يخالف مراعاة الخصوصية والضرورة.","n":["صحيح: معلومات ضرورية + تهيئة + مهارات.","يقطع الاستمرارية ويهدر البيانات المتاحة.","لا مبرر لإعادة التشخيص لمجرد تغير المرحلة.","يتجاوز مبدأ الضرورة ويخالف مراعاة الخصوصية."],"c":"ينتقل من الابتدائية إلى المتوسطة","p":"انتقال المرحلة = معلومات ضرورية + تهيئة للبيئة + استقلال."},{"id":"15-30","s":15,"i":"15.6","l":"تطبيق","t":"تضمنت الخطة الانتقالية للطالب هشام ثلاثة بنود: «زيارة كلية تقنية»، و«تدريب على إدارة المواعيد يقدمه المرشد»، و«أن يسجل هشام مواعيده ويتابعها باستقلال في 9 من 10 أيام». ما التصنيف الأدق لهذه البنود؟","o":["الزيارة هدف، والتدريب نشاط، وتسجيل المواعيد خدمة مساندة يقدمها المرشد","الزيارة خدمة، والتدريب هدف، وتسجيل المواعيد نشاط تدريبي يومي","البنود الثلاثة أهداف انتقالية لأنها مدرجة في الخطة الانتقالية نفسها","الزيارة نشاط، والتدريب خدمة، وتسجيل المواعيد هدف قابل للقياس"],"a":3,"w":"الهدف يصف نتيجة أو أداءً للطالب يمكن قياسه، والنشاط خبرة تساعده على الوصول إليه، والخدمة دعم يقدمه طرف آخر. فالزيارة نشاط، والتدريب الذي يقدمه المرشد خدمة، وتسجيل المواعيد باستقلال وفق معيار هدف.","n":["الزيارة لا تصف أداءً يُقاس للطالب.","التدريب يقدمه المرشد، فهو خدمة لا هدف.","الإدراج في الخطة لا يجعل البند هدفًا.","صحيح: خبرة، ودعم، وأداء مقيس."],"c":"يسجل مواعيده… باستقلال في 9 من 10 أيام","p":"الهدف = ما يؤديه الطالب ويُقاس، والنشاط = خبرة، والخدمة = ما يقدمه غيره."},{"id":"15-31","s":15,"i":"15.6","l":"تطبيق","t":"الطالبة ريما في المرحلة الثانوية تستخدم قارئًا صوتيًا وتطمح إلى الالتحاق بالجامعة، لكنها لا تستطيع شرح احتياجاتها للمعلمين وتنتظر أن تطلب والدتها التسهيلات نيابة عنها. ما الهدف الانتقالي ذو الأولوية؟","o":["أن تتولى والدتها التواصل مع الجامعة مستقبلًا لضمان حصول ابنتها على التسهيلات","أن تتوقف عن استخدام القارئ الصوتي حتى تعتاد متطلبات الدراسة الجامعية","أن تحفظ تعريف الدفاع عن الذات وعناصره استعدادًا للمرحلة الجامعية القادمة","أن تشرح ريما احتياجاتها وتطلب التسهيلات المناسبة بنفسها باستقلال متزايد"],"a":3,"w":"تحليل الفجوة بين متطلبات الجامعة وأداء ريما يكشف أن الحاجز ليس أكاديميًا بل في الدفاع عن الذات. وتقرير المصير جوهر الانتقال؛ لأن الطالبة لن تجد بعد المدرسة من يدير متطلباتها نيابة عنها.","n":["يكرّس الاعتماد على الأسرة الذي هو أصل المشكلة.","ينزع دعمًا وظيفيًا تحتاجه للوصول.","معرفة التعريف لا تعني ممارسة المهارة.","صحيح: دفاع عن الذات يُمارس ويُقاس."],"c":"تنتظر أن تطلب والدتها التسهيلات نيابة عنها","p":"الاعتماد على الآخرين في طلب الدعم يستدعي هدفًا في الدفاع عن الذات."},{"id":"15-32","s":15,"i":"15.6","l":"تحليل","t":"يفخر فريق الخطة الانتقالية للطالب عمار بأنه عقد ستة اجتماعات ونظم أربع زيارات مهنية هذا العام، لكن عمار ما زال يحتاج تذكيرًا يوميًا لإنجاز مهامه، ولا يستطيع المقارنة بين خياراته المهنية. ما الحكم الأدق على فاعلية الخطة؟","o":["فعالة؛ لأن كثرة الاجتماعات والزيارات دليل على جودة التخطيط وجدية التنفيذ","فعالة؛ لأن الزيارات المهنية هدف انتقالي تحقق بالكامل خلال هذا العام الدراسي","ضعيفة الأثر؛ لأن الزيارات المهنية لا مكان لها في التخطيط الانتقالي أصلًا","ضعيفة الأثر؛ فالخطة تُقوَّم بما تغير في استقلال الطالب وقراراته لا بعدد الأنشطة"],"a":3,"w":"تقويم الخطة الانتقالية لا يكون بعدد الاجتماعات أو الزيارات، بل بما تغير في أداء الطالب: هل زاد استقلاله؟ هل أصبح قراره أوضح؟ هل قلّت حاجته إلى التذكير؟ والبيانات هنا تقول إن شيئًا من ذلك لم يتحقق.","n":["عدد الأنشطة لا يثبت النجاح.","الزيارة نشاط لا هدف.","الزيارات مفيدة إذا ارتبطت بهدف وسبقتها تهيئة وتبعها قياس.","صحيح: النتائج لا الأنشطة."],"c":"ما زال يحتاج تذكيرًا… لا يستطيع المقارنة","p":"قيّم الخطة بسؤال: ماذا تغيّر في الطالب؟"},{"id":"15-33","s":15,"i":"15.6","l":"تطبيق","t":"طلبت أسرة الطالب نواف من معلم صعوبات التعلم أن يختار له تخصصًا جامعيًا ويضمن قبوله فيه. ما الاستجابة المهنية الأنسب؟","o":["اختيار التخصص الأنسب لنواف بناءً على درجاته لأن المعلم أدرى بقدراته من غيره","توضيح أن دوره تقديم البيانات وتعليم المهارات والتنسيق، ودعم نواف ليقارن خياراته ويقرر","الاعتذار عن أي دور في التخطيط الانتقالي لأنه من مهام الجهات الخارجية وحدها","التواصل مع الجامعة للحصول على وعد بقبول نواف في التخصص الذي تريده أسرته"],"a":1,"w":"دور معلم صعوبات التعلم تربوي وتنسيقي: يقدم البيانات، ويربط الأهداف الانتقالية بالبرنامج، ويعلّم مهارات الدراسة والتنظيم والدفاع عن الذات، ويتابع التقدم. لكنه لا يختار مستقبل الطالب، ولا يضمن قبولًا، ولا يحل محل الجهات الأخرى.","n":["يصادر قرار الطالب، وهذا خارج حدود الدور.","صحيح: يبني قدرة الطالب على القرار.","يتخلى عن دور أساسي له في الخطة.","وعد خارج صلاحياته ولا يبني استقلال الطالب."],"c":"يختار له تخصصًا ويضمن قبوله","p":"المعلم يمكّن الطالب من القرار، ولا يقرر عنه."},{"id":"15-34","s":15,"i":"15.6","l":"معرفة","t":"أي مما يلي يُعد من خصائص التقييم الانتقالي الجيد؟","o":["يعتمد على مقياس ميول واحد يحدد المهنة الأنسب للطالب بصورة نهائية وحاسمة","مناسب للعمر، متعدد المصادر، يشمل القوة والاحتياج، ويرتبط بقرارات حقيقية","يُطبق مرة واحدة في بداية المرحلة الثانوية ولا يحتاج إلى أي تحديث لاحق","يركز على جوانب الضعف وحدها لأنها ما تحتاج الخطة الانتقالية إلى معالجته"],"a":1,"w":"التقييم الانتقالي جمع منظم لمعلومات مناسبة للعمر عن القوة والاهتمامات والتفضيلات والاحتياجات، من مصادر متعددة، يتكرر ويُحدَّث، ويرتبط مباشرة بالأهداف والخدمات؛ فهو لاتخاذ قرارات لا لجمع درجات.","n":["مقياس واحد لا يكفي، والقرار لا يكون نهائيًا.","صحيح: يجمع خصائص الجودة الأساسية.","التقييم يتكرر ويتحدث مع تغير الطالب.","نقاط القوة جزء أساسي من التخطيط."],"c":"خصائص التقييم الانتقالي الجيد","p":"التقييم الانتقالي الجيد: عمر مناسب + مصادر متعددة + قوة واحتياج + قرار."},{"id":"15-35","s":15,"i":"15.7","l":"تطبيق","t":"تبحث المعلمة عن تدخل لطالبة في الصف الخامس لديها ضعف في تنظيم الفقرة المكتوبة. أي صياغة بحث أنسب للوصول إلى مصادر مفيدة؟","o":["أفضل طرق تدريس صعوبات التعلم في جميع المواد الدراسية وجميع المراحل التعليمية المختلفة","أنشطة ممتعة وملونة جاهزة للطباعة لطلاب الصف الخامس الابتدائي","استراتيجيات تنظيم الفقرة المكتوبة لطلاب صعوبات التعلم في الصفوف العليا من الابتدائية","صعوبات التعلم: أسبابها وأنواعها وطرق تشخيصها الحديثة"],"a":2,"w":"البحث الجيد يبدأ بسؤال محدد يصف المهارة والفئة والمرحلة ونوع التدخل؛ فكلما كان أدق قلّ جمع مواد كثيرة غير مرتبطة بالهدف. والعبارات العامة أو الشكلية أو البعيدة عن القرار تنتج نتائج متفاوتة لا تخدم الحاجة.","n":["عامة جدًا وتنتج نتائج متفاوتة.","تبحث عن الشكل لا عن المهارة.","صحيح: مهارة + فئة + مرحلة + نوع تدخل.","تتعلق بالتشخيص لا بالتدخل المطلوب."],"c":"ضعف في تنظيم الفقرة… الصف الخامس","p":"كلمات البحث = المهارة المحددة + الفئة + المرحلة + نوع التدخل."},{"id":"15-36","s":15,"i":"15.7","l":"تحليل","t":"عثر المعلم على موقع يتصدر نتائج البحث يعرض «برنامجًا يعالج عسر القراءة نهائيًا في أسبوعين»، دون ذكر مؤلف أو مراجع، وفي أسفل الصفحة رابط لشراء البرنامج. ما الحكم الأدق على هذا المصدر؟","o":["ضعيف الموثوقية؛ لغياب الجهة والمراجع، ووجود غرض تسويقي، ووعود مطلقة","موثوق؛ لأن تصدّره نتائج البحث يعكس جودة محتواه العلمي ومصداقيته","موثوق؛ لأن تخصصه في عسر القراءة يجعله مناسبًا لكل الطلاب المشخصين","يُحكم عليه بعد شرائه وتطبيقه على جميع طلاب غرفة المصادر مدة فصل كامل"],"a":0,"w":"فحص الموثوقية يسأل: من المؤلف أو الجهة؟ هل توجد مراجع؟ هل للمحتوى غرض تسويقي؟ هل يمكن التحقق من الادعاءات؟ والموقع هنا يفشل في ذلك كله ويقدم وعدًا مطلقًا، وترتيب نتائج محرك البحث ليس ترتيبًا لجودة الأدلة.","n":["صحيح: مؤشرات ضعف الموثوقية مجتمعة.","الترتيب في البحث مؤشر انتشار لا جودة.","التخصص لا يغني عن الدليل ولا يعني ملاءمة الجميع.","يعرّض الطلاب لتجربة واسعة قبل التحقق من المصدر."],"c":"دون مؤلف أو مراجع… رابط لشراء","p":"لا مؤلف + لا مراجع + بيع + وعد مطلق = مصدر ضعيف."},{"id":"15-37","s":15,"i":"15.7","l":"تطبيق","t":"يستخدم المعلم أداة ذكاء اصطناعي لتوليد قصص قصيرة تدرّب طلابه على الكلمات متعددة المقاطع، ويفكر في إدخال أسماء طلابه ونتائج تشخيصهم ليحصل على قصص «مخصصة». ما الإجراء الأنسب؟","o":["توليد القصص دون بيانات شخصية، ثم مراجعة دقتها وملاءمتها للنمط المستهدف","إدخال بيانات الطلاب كاملة لأن التخصيص يرفع جودة القصص ويوفر وقت المعلم وجهده","استخدام القصص الناتجة مباشرة لأن أدوات الذكاء الاصطناعي دقيقة في اللغة العربية","الامتناع عن استخدام أي أداة ذكاء اصطناعي في إعداد المواد التعليمية مطلقًا"],"a":0,"w":"الذكاء الاصطناعي أداة مساعدة في توليد الأمثلة والمسودات، لكنه ليس مصدرًا نهائيًا للحقيقة؛ فيلزم مراجعة الدقة والتحيز والملاءمة للمهارة المستهدفة، وعدم إدخال بيانات شخصية حساسة دون ضوابط مناسبة.","n":["صحيح: توليد بلا بيانات حساسة ثم مراجعة.","يعرّض خصوصية الطلاب للخطر.","يعتمد الناتج دون تحقق بشري.","رفض مطلق يضيع فائدة ممكنة مع الضوابط."],"c":"إدخال أسماء طلابه ونتائج تشخيصهم","p":"مع الذكاء الاصطناعي: لا بيانات حساسة، ولا اعتماد قبل المراجعة."},{"id":"15-38","s":15,"i":"15.7","l":"معرفة","t":"ما الذي يجعل أداة ما «تقنية مساندة» (Assistive Technology) لطالب بعينه؟","o":["أنها جهاز إلكتروني حديث يعمل بالذكاء الاصطناعي أو بشاشة اللمس","أنها تعالج عائقًا وظيفيًا أو وصوليًا محددًا لديه وتزيد استقلاله","أنها مرتفعة التكلفة ومخصصة لذوي الإعاقة دون غيرهم من الطلاب","أنها تُستخدم في الفصل كله لعرض المحتوى على جميع الطلاب معًا"],"a":1,"w":"التصنيف يتحدد بالوظيفة لا بشكل الأداة أو سعرها: التقنية التعليمية تخدم التعلم عمومًا، أما التقنية المساندة فتعالج عائقًا وظيفيًا أو وصوليًا محددًا لدى الطالب، وتُقاس قيمتها بزيادة وصوله واستقلاله دون إلغاء المهارة المستهدفة.","n":["الحداثة وشكل الجهاز ليسا معيار التصنيف.","صحيح: الوظيفة الفردية هي المعيار.","السعر لا يحدد الوظيفة.","هذا وصف تقنية تعليمية عامة."],"c":"لطالب بعينه","p":"التقنية المساندة تُعرَّف بالعائق الذي تزيله لا بالجهاز."},{"id":"15-39","s":15,"i":"15.7","l":"تحليل","t":"قرأت معلمة دراسة محكمة تثبت فاعلية برنامج للفهم القرائي لدى طلاب جامعيين يتحدثون الإنجليزية، وتفكر في تطبيقه على طالبات صعوبات التعلم في الصف الرابع. ما الإجراء الأنسب؟","o":["فحص انطباق الدراسة عمرًا وفئةً ولغةً ومهارةً، والبحث عن أدلة أقرب لطالباتها","تطبيق البرنامج مباشرة لأن نشره في مجلة محكمة يثبت فاعليته لكل الفئات العمرية","رفض البرنامج لأن الدراسات الأجنبية لا يُستفاد منها في التعليم المحلي إطلاقًا","تطبيقه على جميع طالبات المدرسة أولًا ثم مقارنة نتائجهن بنتائج الدراسة"],"a":0,"w":"قوة الدليل لا تلغي فحص انطباقه؛ فعند قراءة بحث يُنظر إلى الفئة والعمر والمهارة وطبيعة التدخل وطريقة القياس ومدى قربها من حالة الطالب. والفارق هنا كبير في العمر والفئة واللغة، فيلزم البحث عن أدلة أقرب.","n":["صحيح: الجودة والانطباق معًا.","المحكمة لا تعني الانطباق على كل فئة.","رفض مطلق؛ الدراسات الأجنبية قد تفيد إذا انطبقت.","تعميم واسع قبل التحقق من الملاءمة."],"c":"طلاب جامعيين… طالبات الصف الرابع","p":"اسأل عن أي دراسة: على من؟ وفي أي عمر؟ ولأي مهارة؟"},{"id":"15-40","s":15,"i":"15.7","l":"تطبيق","t":"يحتاج الطالب فارس في الصف الأول المتوسط إلى تدريب على قراءة كلمات بمستوى الصف الثاني، والمواد المتاحة لهذا المستوى مليئة برسومات وشخصيات موجهة للأطفال الصغار، فصار يرفض استخدامها. ما الإجراء الأنسب؟","o":["تكييف شكل المادة وموضوعاتها بما يناسب عمره مع الإبقاء على مستوى المهارة المستهدفة","الاستمرار في المادة كما هي لأن مستوى المهارة فيها مناسب له تمامًا وهذا هو الأهم","استخدام نصوص صفه بمستواها الحالي لأنها تناسب عمره واهتماماته","إيقاف التدريب حتى تتوافر مواد جاهزة مناسبة لعمره ومستواه معًا"],"a":0,"w":"تُفحص المادة من حيث ملاءمة الأمثلة والصور والمفردات لعمر الطالب؛ فالمادة الطفولية لطالب أكبر قد تُضعف مشاركته حتى لو كانت مهارتها مناسبة. والحل تعديل الشكل مع الحفاظ على مستوى المهارة، لا التضحية بأحدهما.","n":["صحيح: شكل مناسب للعمر + مستوى مهارة مناسب.","يتجاهل أثر عدم الملاءمة العمرية على مشاركته.","نصوص أعلى من مستواه لا تتيح ممارسة ناجحة.","يوقف التعلم بدل تكييف المتاح."],"c":"رسومات موجهة للأطفال… فصار يرفض","p":"عدّل الشكل ليناسب العمر، واحفظ مستوى المهارة ليناسب الحاجة."},{"id":"16-01","s":16,"i":"16.1","l":"معرفة","t":"عند تعليم مفهوم القيمة المكانية وفق تسلسل (CRA)، ما الترتيب الصحيح للتمثيلات؟","o":["المجرد كالأرقام، ثم التمثيلي كالرسوم، ثم المحسوس للتحقق من الفهم.","المحسوس كالمكعبات، ثم التمثيلي كالرسوم، ثم المجرد كالأرقام.","التمثيلي كالرسوم، ثم المحسوس كالمكعبات، ثم المجرد بحسب ميول الطالب.","المحسوس كالمكعبات، ثم المجرد مباشرة، ثم التمثيلي للمراجعة فقط."],"a":1,"w":"في تسلسل CRA يبدأ الطالب بأشياء محسوسة، ثم صور أو مخططات، ثم رموز مجردة، مع ربط كل تمثيل بالآخر. ولا يعني ذلك مدة ثابتة لكل مرحلة؛ فالانتقال يتبع الفهم والبيانات.","n":["عكسٌ للتسلسل يبدأ بالتجريد الأصعب.","صحيح: من الأشياء إلى الصور إلى الرموز.","يقدّم الصور على المحسوس دون مسوّغ.","يقفز من المحسوس إلى الرمز دون جسر تمثيلي."],"c":"وفق تسلسل (CRA)","p":"CRA: محسوس ← تمثيلي ← مجرد، والانتقال بالبيانات لا بالزمن."},{"id":"16-02","s":16,"i":"16.1","l":"معرفة","t":"أي المواقف التالية يمثّل استراتيجية التفكير بصوت عالٍ (Think-Aloud) بدقة؟","o":["يقول المعلم وهو يحل: «أبحث عن المطلوب، ثم أحدد المعلومات المهمة، ثم أختار العملية».","يحل المعلم المسألة على السبورة بصمت، ثم يطلب من الطلاب نسخ خطوات الحل كاملة في دفاترهم.","يقرأ المعلم المسألة بصوت مرتفع وواضح، ثم يعلن الإجابة النهائية للطلاب مباشرة دون أي تعليق.","يطلب المعلم من الطلاب قراءة المسألة جماعيًا بصوت عالٍ قبل أن يحلها كل منهم بمفرده."],"a":0,"w":"التفكير بصوت عالٍ يجعل العمليات الذهنية الخفية مرئية للطالب: لماذا اختار المعلم هذه الخطوة؟ وكيف تحقق منها؟ وتظهر فائدته حين تكون المشكلة في التنظيم أو الاستراتيجية لا في معرفة الحقيقة الأساسية فقط.","n":["صحيح: يكشف القرارات الذهنية الخفية.","عرض للناتج دون إظهار التفكير.","قراءة جهرية لا تكشف عملية الحل.","«بصوت عالٍ» هنا قراءة جماعية لا إفصاح عن التفكير."],"c":"التفكير بصوت عالٍ (Think-Aloud)","p":"التفكير بصوت عالٍ يكشف «لماذا وكيف» قرّرت، لا الناتج فقط."},{"id":"16-03","s":16,"i":"16.1","l":"تطبيق","t":"تقرأ لمى النصوص المصوّرة بطلاقة ظاهرة، لكن تحليل أخطائها في قائمة كلمات منفردة من النمط الصوتي نفسه يكشف أنها تخمّن الكلمة من حرفها الأول. إذا كان الهدف فك الترميز، فما الإجراء الأنسب؟","o":["تشجيعها على الاستمرار في التخمين من السياق والصور؛ لأنه دليل على فهمها للمعنى.","زيادة النصوص المصوّرة في الحصص؛ لأنها تحقق فيها أعلى نسبة نجاح ممكنة.","الانتقال إلى تدريبات الفهم القرائي؛ لأنها تقرأ النصوص المصوّرة بطلاقة.","تعليم صريح للعلاقة بين الحرف والصوت ونمذجة الدمج، مع كلمات لا تسمح بالتخمين."],"a":3,"w":"اختيار طريقة العرض يتبع المكوّن الذي تظهر فيه الصعوبة. ولمى تعتمد على قرائن غير مستهدفة، فيُعرض النمط مباشرة وتُنمذج عملية دمج الأصوات، ثم تُقدَّم كلمات كافية دون صور أو سياق يسمح بالتخمين، مع قياس الدقة.","n":["التخمين يخفي ضعف فك الترميز ولا يعالجه.","نجاح ظاهري قائم على قرائن خارج المهارة.","يعالج مكوّنًا آخر غير موضع الصعوبة.","صحيح: يستهدف المكوّن المتعثر ويمنع القرائن البديلة."],"c":"تخمّن الكلمة من حرفها الأول","p":"إذا كان الهدف فك الترميز، فامنع القرائن التي تسمح بالتخمين."},{"id":"16-04","s":16,"i":"16.1","l":"تطبيق","t":"يرى عبدالله أن الثُّمن أكبر من الرُّبع؛ لأن العدد 8 أكبر من العدد 4. ما طريقة العرض الأنسب لمعالجة هذا الخطأ؟","o":["تحفيظه قاعدة «كلما كبر المقام صغر الكسر» وتطبيقها على تمارين كثيرة متنوعة.","زيادة عدد تمارين المقارنة من الشكل نفسه حتى يتقن الإجابة عنها دون خطأ.","تمثيل الكسرين بنماذج مساحة وعلى خط الأعداد، وربطهما بالرمز.","السماح له باستخدام الآلة الحاسبة لتحويل الكسور إلى أعداد عشرية ثم مقارنتها."],"a":2,"w":"مقارنة الكسور بحجم المقام وحده مفهوم خاطئ يُمنع بالتنقل بين تمثيلات مترابطة، كنماذج المساحة وخط الأعداد، مع ربطها بالرمز؛ فيرى الطالب أن الكسر يمثل علاقة، وأن تقسيم الكل إلى أجزاء أكثر يصغّر الجزء.","n":["قاعدة بلا معنى قد تنهار عند تغيّر المسألة.","تكرار للإجراء دون علاج الفهم الخاطئ.","صحيح: تمثيلات مترابطة تبني المعنى.","يتجاوز المفهوم المستهدف بدل بنائه."],"c":"الثُّمن أكبر من الرُّبع","p":"الخطأ المفاهيمي يُعالج بتمثيلات مترابطة تُظهر المعنى، لا بقاعدة محفوظة."},{"id":"16-05","s":16,"i":"16.1","l":"تطبيق","t":"طلب المعلم من بندر مراجعة نصه كاملًا، فأعاده دون أن يكتشف أي خطأ رغم كثرة أخطاء علامات الترقيم فيه. ما طريقة العرض الأنسب؟","o":["تصحيح جميع أخطائه بالقلم الأحمر وإعادة النص إليه ليتعلم منها بنفسه في المنزل.","نمذجة اكتشاف نوع واحد من الأخطاء بقائمة مراجعة قصيرة قبل المراجعة الشاملة.","تكليفه بنسخ نص نموذجي خالٍ من الأخطاء عدة مرات في المنزل.","تكرار طلب المراجعة الشاملة للنص حتى يعتاد اكتشاف الأخطاء وحده."],"a":1,"w":"عرض المراجعة والتحرير يقتضي تقديم قائمة محددة أو استراتيجية قصيرة، ونمذجة اكتشاف نوع محدد من الأخطاء قبل مطالبة الطالب بمراجعة النص كاملًا، ثم توسيع نطاق المراجعة وتلاشي الدعم تدريجيًا.","n":["يؤدي المهمة عنه ولا يعلّمه استراتيجية المراجعة.","صحيح: يبدأ بمراجعة محددة يمكن إتقانها.","النسخ لا يعلّم اكتشاف الأخطاء وتحريرها.","يكرر المهمة التي أخفق فيها دون تعليم."],"c":"أعاده دون أن يكتشف أي خطأ","p":"علّم المراجعة بنوع خطأ محدد وقائمة قصيرة قبل المراجعة الشاملة."},{"id":"16-06","s":16,"i":"16.1","l":"تطبيق","t":"علّمت معلمة طلابها أن كلمة «أكثر» تعني الجمع دائمًا، فأخطأ عمر في مسألة: «مع خالد 12 ريالًا، وهو يملك أكثر من سعد بـ 5 ريالات، فكم مع سعد؟». ما طريقة العرض الأنسب لتعليم المسائل اللفظية؟","o":["توسيع قائمة الكلمات المفتاحية وربط كل كلمة منها بعملية حسابية ثابتة لا تتغير.","تدريبه على مسائل كثيرة فيها كلمة «أكثر» حتى يحفظ الحالات المستثناة منها.","قراءة المسألة له وتحديد العملية المطلوبة، ثم تركه يحسب الناتج بنفسه.","نمذجة فهم الموقف وتمثيل العلاقة برسم، ثم اختيار العملية والتحقق من الحل."],"a":3,"w":"المسائل اللفظية تتطلب فهم العلاقات لا مطابقة كلمة بعملية؛ فينمذج المعلم فهم الموقف وتحديد المطلوب وتمثيل العلاقة برسم أو مخطط، ثم اختيار العملية والتحقق من معقولية الناتج.","n":["يعمّق الاعتماد على استراتيجية تنهار مع تغيّر اللغة.","حفظ للاستثناءات بدل فهم العلاقة.","يؤدي الجزء المستهدف عنه ويحصره في الحساب.","صحيح: المعنى والعلاقات قبل الكلمة المفتاحية."],"c":"«أكثر» تعني الجمع دائمًا","p":"في المسألة اللفظية: المعنى والعلاقات قبل الكلمة المفتاحية."},{"id":"16-07","s":16,"i":"16.1","l":"تحليل","t":"استخدمت معلمة في درس المحيط فيديو، ثم لعبة إلكترونية، ثم بطاقات ملوّنة، ثم أنشودة، دون أن تربط بينها أو بخطأ محدد لدى طالباتها، ولم يتحسن فهمهن. ما الخلل الأدق في ممارستها؟","o":["قلة عدد الوسائل المستخدمة؛ فالدرس يحتاج إلى وسائل إضافية تغطي أنماطًا أكثر.","تنويع عشوائي لا ينطلق من الهدف ولا من عائق محدد ولا يربط بين التمثيلات.","قِدم الوسائل المختارة؛ والأفضل استبدالها بتطبيقات أحدث وأكثر تفاعلية.","صعوبة الهدف على الطالبات؛ فينبغي خفضه حتى يناسب الوسائل المتاحة."],"a":1,"w":"تنويع العرض لا يعني استخدام أكبر عدد من الوسائل، بل اختيار تمثيلات مترابطة تخدم الهدف وتعالج عائقًا محددًا. والتنقل السريع بين وسائل بلا علاقة واضحة يزيد المشتتات والحمل المعرفي ولا يبني فهمًا.","n":["الكثرة ليست الحل؛ قد تزيد المشتتات.","صحيح: التنويع الجيد مقصود ومترابط.","التقنية الأحدث ليست أفضل تلقائيًا.","يخلط بين تنويع العرض وتعديل الهدف."],"c":"دون أن تربط بينها أو بخطأ محدد","p":"التنويع الجيد مقصود ومترابط؛ كل تمثيل يجيب: ما العائق الذي أزيله؟"},{"id":"16-08","s":16,"i":"16.1","l":"تحليل","t":"حقق يوسف دقة 100٪ في تمارين القيمة المكانية التي تدرّب عليها، ودقة 30٪ في تمارين جديدة للمهارة نفسها بصياغة مختلفة. ما الاستنتاج الأدق؟","o":["أتقن المهارة، والتمارين الجديدة أصعب من مستواه فلا تُحتسب في الحكم على أدائه.","يحتاج إلى خفض الهدف؛ لأن أداءه غير المستقر دليل على صعوبة المهارة عليه.","يحتاج إلى وسيلة أكثر جاذبية؛ لأن انخفاض دقته يعكس ضعف دافعيته للتعلم.","لم يصل إلى الإتقان؛ فنجاحه مقيّد بالأمثلة المألوفة ويحتاج إلى تعميم."],"a":3,"w":"النجاح في نموذج واحد أو أمثلة مدرَّبة لا يكفي للحكم على الإتقان. والفجوة الكبيرة بين الأمثلة المألوفة والجديدة تعني تعلمًا مرتبطًا بالشكل لا بالمفهوم، فيحتاج إلى ربط بالمعنى وأمثلة وسياقات متنوعة.","n":["المهارة نفسها بصياغة مختلفة تكشف إتقانًا هشًّا.","تعليم التعميم يسبق التفكير في خفض الهدف.","لا دليل على الدافعية؛ النمط يشير إلى حفظ الأمثلة.","صحيح: التعميم جزء من الإتقان."],"c":"نجاح في المألوف وإخفاق في الجديد","p":"النجاح في أمثلة مألوفة فقط ليس إتقانًا؛ اختبر التعميم بأمثلة جديدة."},{"id":"16-09","s":16,"i":"16.2","l":"معرفة","t":"ما المقصود بـ«الحكم الواقعي» الذي يبني عليه معلم صعوبات التعلم تعديل الدرس؟","o":["انطباع المعلم العام عن الطالب بعد خبرة طويلة في تدريسه ومعرفة شخصيته.","ما يقتضيه تشخيص صعوبات التعلم المسجل في ملف الطالب من تعديلات معتادة.","ما يفضّله الطالب من أنشطة وأساليب كما يعبّر عنه بنفسه في كل حصة دراسية.","قرار مهني يستند إلى أدلة قابلة للملاحظة والقياس كتحليل الأخطاء."],"a":3,"w":"الحكم الواقعي قرار مهني يستند إلى أدلة يمكن ملاحظتها أو قياسها: خط الأساس، وتحليل الأخطاء، وعينات العمل، والملاحظة المنظمة، ومقدار التلميح، والاهتمامات الموثقة. ولا يكفي الانطباع أو التشخيص أو التفضيل وحده.","n":["الانطباع ليس دليلًا قابلًا للقياس.","التشخيص وحده لا يحدد التعديل.","رأي الطالب مهم لكنه يُدمج مع بيانات الأداء.","صحيح: البيانات أساس التعديل."],"c":"«الحكم الواقعي»","p":"الحكم الواقعي = بيانات قابلة للملاحظة، لا انطباع ولا تشخيص وحده."},{"id":"16-10","s":16,"i":"16.2","l":"معرفة","t":"لماذا يحتاج المعلم إلى تحديد خط الأساس (Baseline) قبل تعديل الدرس لطالب ذي صعوبات تعلم؟","o":["ليحدد نوع صعوبة التعلم ويختار التعديل المرتبط بها مباشرة.","ليستغني عن القياس في أثناء تطبيق التعديل وبعد الانتهاء منه.","ليقارن الأداء بعد التعديل، ويحكم هل أحدث التغيير تحسنًا حقيقيًا.","ليقدّم للأسرة مبررًا لخفض أهداف ابنها في الخطة الفردية."],"a":2,"w":"خط الأساس يحدد نقطة البداية، فيسمح بمقارنة الأداء بعد التعديل وتحديد هل أدى التغيير إلى تحسن حقيقي أم أن الانطباع وحده هو الذي تغيّر.","n":["ليس هذا وظيفة خط الأساس، والتشخيص لا يحدد التعديل.","خط الأساس يتطلب القياس اللاحق ولا يلغيه.","صحيح: لا حكم على الأثر دون نقطة بداية.","ليس غرضه تبرير التوقعات المنخفضة."],"c":"قبل تعديل الدرس","p":"خط الأساس أولًا؛ وإلا فلن تعرف هل نجح التعديل."},{"id":"16-11","s":16,"i":"16.2","l":"تطبيق","t":"تحب ريم الطبخ، وتُظهر بياناتها أخطاء متكررة في جمع الكسور مختلفة المقامات. أرادت المعلمة توظيف اهتمامها في الدرس. أي التعديلات التالية أنسب؟","o":["مسائل من وصفات الطبخ تتضمن جمع كسور مختلفة المقامات، مع تعليم صريح ثم تعميم.","استبدال درس الكسور بنشاط طبخ عملي ممتع لا يتضمن أي مسائل مكتوبة أو حسابات.","اختيار مسائل طبخ سهلة لا تتضمن كسورًا حتى تستعيد ثقتها بنفسها أولًا.","الاقتصار على مسائل الطبخ في جميع الدروس القادمة؛ لأنها تزيد مشاركتها."],"a":0,"w":"الاهتمام يزيد الدافعية لكنه لا يلغي الحاجة إلى تدريس المهارة؛ فيُستخدم سياق الطبخ مع بقاء جمع الكسور هدفًا، ويُقدَّم تعليم صريح للإجراء، ثم يُنقل الطالب تدريجيًا إلى سياقات متنوعة لضمان التعميم.","n":["صحيح: الاهتمام بوابة مع بقاء المهارة.","يزيد المتعة ويُسقط المهارة المستهدفة.","يخفض المحتوى بدل إزالة العائق.","الاعتماد على سياق واحد يحدّ من التعميم."],"c":"اهتمام بالطبخ وأخطاء في جمع الكسور","p":"الاهتمام بوابة للدافعية مع بقاء المهارة المستهدفة، ثم عمّم."},{"id":"16-12","s":16,"i":"16.2","l":"تطبيق","t":"يخفق حمد في القسمة المطولة
