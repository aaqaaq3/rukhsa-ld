ة للتقييم المناسب، لا إطلاق تشخيص ولا التأجيل.","n":["الفروق الفردية تفسر تفاوت التوقيت، لا فقدان مهارة مكتسبة.","المعلم لا يصدر تشخيصًا من ملاحظاته.","يتكيف مع التراجع ويتجاهل دلالته بدل إحالته.","صحيح: فقدان مهارة يستدعي الرصد والإحالة."],"c":"صار… يكتفي بالإشارة ويفقد ضبط","p":"فقدان مهارة مكتسبة يستدعي توثيقًا وتواصلًا مع الأسرة وإحالة، لا انتظارًا ولا تشخيصًا."},{"id":"2-14","s":2,"i":"2.2","l":"تطبيق","t":"تجد لمى صعوبة في فهم الكسور المكتوبة بالرموز مثل ½ و¼، وتخلط بين البسط والمقام. أي تسلسل تعليمي أنسب لها؟","o":["تكرار كتابة الرموز وحفظ تعريفي البسط والمقام حتى تتقنهما وتستدعيهما بسرعة","عرض الرموز مع شرح لفظي مفصل، ثم تقديم أمثلة محسوسة إذا لم تفهم الشرح","تقسيم أشياء محسوسة مع النمذجة، ثم تمثيل الأجزاء بالرسم، ثم الانتقال إلى الرموز","حل مسائل رمزية أكثر بسرعة أكبر حتى تعتاد على شكل الكسور وطريقة كتابتها وقراءتها"],"a":2,"w":"عندما يواجه الطالب صعوبة في التجريد، يُنتقل من المحسوس والنمذجة إلى التمثيل ثم الرموز. فالمحسوسات تبني المعنى، والتمثيل يربطه بالصورة، ثم تأتي الرموز وقد صار لها مدلول.","n":["حفظ الرموز دون معنى لا يعالج صعوبة التجريد.","يعكس التسلسل ويجعل المحسوس علاجًا بعد الفشل.","صحيح: محسوس ثم تمثيل ثم رمز.","زيادة السرعة والكم تزيد العبء ولا تبني المفهوم."],"c":"صعوبة في فهم الكسور المكتوبة بالرموز","p":"صعوبة التجريد تُعالج بالمحسوس والنمذجة، ثم التمثيل، ثم الرموز."},{"id":"2-15","s":2,"i":"2.2","l":"تحليل","t":"في الصف الرابع طالبان: سعد ذو إعاقة حركية يجيب شفهيًّا عن مسائل التفكير بمستوى أقرانه لكنه يكتب ببطء شديد، وماجد ذو إعاقة فكرية بسيطة يحتاج تعليمًا صريحًا متدرجًا. أي استنتاج أدق عن أوجه التشابه والاختلاف بينهما وبين أقرانهما؟","o":["كلاهما يحتاج خفض الأهداف الأكاديمية وتبسيط المحتوى؛ لأن الإعاقة أيًّا كان نوعها تؤثر في جميع مجالات النمو لدى الطالب دون استثناء","يشتركان مع أقرانهما في الحاجات الأساسية ويختلفان في الوصول والدعم: سعد يحتاج تكييف الاستجابة وماجد أهدافًا أكثر وظيفية","كلاهما يحتاج التكييفات نفسها في الكتابة والوقت؛ لأنهما ينتميان إلى فئة ذوي الإعاقة التي تتشابه احتياجات أفرادها","سعد يحتاج أهدافًا وظيفية مبسطة بسبب بطء كتابته، وماجد يكفيه تكييف في طريقة الكتابة والوقت الإضافي"],"a":1,"w":"جميع الطلاب يتشاركون الحاجات الإنسانية والنمائية الأساسية، بينما تختلف طريقة الوصول وسرعة الاكتساب ومستوى الدعم. والإعاقة الحركية لا تعني قصورًا معرفيًّا، فيكفي سعد تكييف طريقة الاستجابة، أما ماجد فقد يحتاج أهدافًا أكثر وظيفية وتعليمًا صريحًا متدرجًا.","n":["الإعاقة لا تعني قصورًا في جميع المجالات، وسعد يفكر بمستوى أقرانه.","صحيح: تشابه في الحاجات واختلاف في الوصول والدعم.","التعميم الفئوي يتجاهل اختلاف حاجتيهما.","يعكس حاجتي الطالبين."],"c":"يجيب شفهيًّا… بمستوى أقرانه… إعاقة فكرية بسيطة","p":"وجود الإعاقة لا يساوي قصورًا في كل مجالات النمو؛ حدد الحاجة لكل طالب على حدة."},{"id":"2-16","s":2,"i":"2.2","l":"تحليل","t":"كتبت معلمة في تقرير نمائي: «شهد متأخرة في النمو الحركي الدقيق لأنها آخر طالبة في الفصل تعلمت ربط حذائها». ما الخلل في هذا الحكم؟","o":["كان ينبغي مقارنتها بأسرع طالبة في الفصل لا بمتوسط أداء زميلاتها في المهارة نفسها","بُني على مقارنة بزميلات فصل واحد دون الرجوع إلى المدى النمائي المتوقع وبيانات متعددة المصادر","ربط الحذاء مهارة حركية كبرى لا تدل على مستوى النمو الحركي الدقيق لدى الطالبة","الحكم سليم في مضمونه، لكنه يحتاج إلى إحالتها مباشرة إلى العلاج الوظيفي لتدريبها على المهارة"],"a":1,"w":"النمو الطبيعي إطار مرجعي ضمن مدى من التنوع، ومعدلات النمو فردية؛ فكون الطالبة الأخيرة في فصلها قد يقع ضمن المدى الطبيعي. والحكم المهني يحتاج مقارنة الأداء بمعالم نمائية عامة وبأداء الطالبة السابق وبيانات من أكثر من مصدر، لا بزميلات فصل واحد.","n":["يستبدل مقارنة سطحية بأخرى أسوأ.","صحيح: المقارنة السطحية بفصل واحد لا تكفي للحكم.","ربط الحذاء مهارة حركية دقيقة فعلًا.","يقر الحكم الخاطئ ثم يبني عليه إجراء."],"c":"آخر طالبة في الفصل","p":"لا تحكم على النمو بمقارنة طفل بزميل أو فصل واحد؛ قارن بالمدى النمائي وبيانات متعددة."},{"id":"2-17","s":2,"i":"2.3","l":"معرفة","t":"لماذا تُعد مرحلة الطفولة المبكرة (من الميلاد إلى 6 سنوات) أكثر المراحل حساسية للكشف والتدخل المبكر؟","o":["لسرعة النمو العصبي والحسي والحركي واللغوي فيها، وارتفاع مرونة الدماغ","لأن المطالب الأكاديمية والتنظيمية تظهر فيها بأوضح صورة مقارنة بغيرها","لأن التشخيص الذي يُبنى فيها يكون نهائيًّا ولا يتغير في المراحل اللاحقة","لأن الفروق الفردية بين الأطفال تكاد تنعدم في هذه المرحلة العمرية"],"a":0,"w":"تتميز الطفولة المبكرة بسرعة النمو العصبي والحسي والحركي واللغوي ومرونة عالية للدماغ، لذلك تُعد نافذة الكشف والتدخل المبكر. أما وضوح المطالب الأكاديمية فسمة سن المدرسة.","n":["صحيح: سرعة النمو ومرونة الدماغ.","هذه سمة الطفولة المتوسطة وسن المدرسة.","المؤشرات المبكرة للرصد لا للتشخيص النهائي.","الفروق الفردية قائمة في كل المراحل."],"c":"أكثر المراحل حساسية للكشف والتدخل","p":"الطفولة المبكرة للكشف والتدخل، والمدرسة للوصول والتعلم، والمراهقة للاستقلال والانتقال."},{"id":"2-18","s":2,"i":"2.3","l":"معرفة","t":"أي العبارات الآتية تعبر بدقة عن مفهوم «تقرير المصير» لدى المراهق ذي الإعاقة؟","o":["تعلم الاختيار واتخاذ القرار والدفاع عن الذات وتحمل المسؤولية بما يناسب قدراته","ترك المراهق يقرر كل شؤونه منفردًا دون أي تدخل من الأسرة أو المدرسة","تولي الأسرة والمعلمين اتخاذ القرارات المهمة عنه حمايةً له من الوقوع في الخطأ والإحباط","إطلاع المراهق على خطته الفردية بعد اعتمادها النهائي من فريق المدرسة"],"a":0,"w":"تقرير المصير يعني تنمية قدرة المراهق على الاختيار واتخاذ القرار والدفاع عن ذاته وتحمل مسؤولية مناسبة لقدراته، مع دعم بالقدر الضروري. وهو هدف يزداد أهمية في المراهقة والانتقال إلى الرشد.","n":["صحيح: اختيار وقرار ودفاع عن الذات بما يناسب القدرة.","يتجاهل الدعم المناسب ويحوّل المفهوم إلى انفراد مطلق.","حماية زائدة تُضعف الاستقلال وتناقض المفهوم.","الاطلاع بعد الاعتماد ليس مشاركة في القرار."],"c":"«تقرير المصير» لدى المراهق","p":"في المراهقة فضّل ما يزيد الاختيار والاستقلال بدل الحماية الزائدة."},{"id":"2-19","s":2,"i":"2.3","l":"تطبيق","t":"طفل في الرابعة يقرّب الكتب المصورة من عينيه كثيرًا، ويتعثر بالأشياء في الممرات، ولا يتابع الكرة بعينيه في أثناء اللعب. ما الإجراء الأول الأنسب للمعلمة؟","o":["إبلاغ الأسرة بأن طفلها لديه ضعف بصري ويحتاج إلى نظارة طبية في أقرب وقت","تدريبه على أنشطة تتبع بصري يومية مدة شهر كامل قبل التفكير في أي إحالة","اعتبار السلوك تشتتًا في الانتباه يُعالج ببرنامج لتعديل السلوك داخل الفصل","توثيق الملاحظات وإبلاغ الأسرة والإحالة إلى فحص بصري متخصص، مع استمرار الرصد"],"a":3,"w":"ضعف التتبع البصري أو صعوبة توجيه النظر نحو الوجوه والأشياء من مؤشرات الخطر التي تستدعي فحصًا بصريًّا متخصصًا. ودور المعلم الرصد والتوثيق والتواصل مع الأسرة والإحالة، لا التشخيص ولا تأخير الإحالة حين تكون المؤشرات قوية ومتكررة.","n":["يصدر تشخيصًا ووصفة علاجية من الملاحظة.","يؤخر الإحالة مع وجود مؤشرات متكررة.","يفسر مؤشرات بصرية بفرضية سلوكية دون فحص.","صحيح: رصد وتواصل مع الأسرة وفحص بصري متخصص."],"c":"يقرّب… يتعثر… لا يتابع الكرة بعينيه","p":"مؤشر حسي في الطفولة المبكرة يستدعي فحصًا متخصصًا مع استمرار الرصد، لا تشخيصًا."},{"id":"2-20","s":2,"i":"2.3","l":"تطبيق","t":"تشارك رهف، وهي طالبة ضعيفة سمع في الصف الخامس، في نقاش جماعي داخل مختبر العلوم المليء بأصوات الأجهزة، ويتحدث فيه أكثر من طالب في الوقت نفسه. ما الإجراء الأنسب لدعم مشاركتها؟","o":["إعفاؤها من النقاش الجماعي وتكليفها بتلخيص مكتوب للتجربة بدلًا منه في نهاية الحصة","خفض أهداف الدرس المعرفية لها؛ لأن ضعف السمع يحد من قدرتها على فهم المفاهيم العلمية","تقليل الضوضاء، وضمان رؤيتها لوجه المتحدث، وتنظيم أدوار الحديث، مع دعم بصري","إجلاسها بجوار المعلم ليعيد لها خلاصة النقاش بعد انتهائه بصوت واضح ومرتفع"],"a":2,"w":"الإعاقة السمعية قد تؤثر في الوصول إلى النقاشات الشفهية دون أن تعني ضعفًا معرفيًّا. لذلك يُدعم الوصول بتقليل الضوضاء ورؤية وجه المتحدث وتنظيم أدوار الحوار والدعم البصري والتقني وفق الخطة الفردية، بدل إقصائها أو خفض التوقعات.","n":["يحرمها المشاركة بدل إزالة عائق الوصول.","يخلط صعوبة الوصول للصوت بالقدرة المعرفية.","صحيح: إتاحة التواصل مع بقاء المشاركة.","يعطيها الخلاصة لاحقًا لكنه لا يتيح مشاركتها في أثناء النقاش."],"c":"أصوات الأجهزة… أكثر من طالب","p":"مع ضعف السمع: أزل حاجز الوصول إلى التواصل، ولا تخفض التوقعات."},{"id":"2-21","s":2,"i":"2.3","l":"تطبيق","t":"سلمان طالب في الصف الثالث المتوسط ذو إعاقة فكرية بسيطة، وتطلب أسرته أن تبقى جميع أهدافه أكاديمية «حتى لا يُحرم من المنهج». ما الأولوية التي ينبغي أن يناقش الفريق إضافتها إلى خطته في هذه المرحلة؟","o":["أهداف انتقالية تشمل مهارات الحياة وتقرير المصير والسلامة والتهيئة المهنية","أهداف أكاديمية مجردة إضافية تقربه من مستوى المرحلة الثانوية ومتطلباتها","أهداف للعب المشترك والانتباه للآخرين كما في مرحلة الطفولة المبكرة","تأجيل أي تخطيط لما بعد المدرسة حتى يتخرج من المرحلة الثانوية ويتضح مستقبله"],"a":0,"w":"تزداد في المراهقة أهمية الاستقلال وتقرير المصير والتخطيط الانتقالي والتوجيه المهني، والمراهق ذو الإعاقة الفكرية يحتاج إلى أهداف انتقالية تتضمن مهارات الحياة والسلامة والتهيئة المهنية. ويُناقش ذلك مع الأسرة بوصفها شريكًا، دون إلغاء الأهداف الأكاديمية المناسبة.","n":["صحيح: المراهقة استقلال وانتقال وتهيئة مهنية.","يتجاهل مطالب المرحلة الانتقالية ويحصر الخطة في التجريد.","يستعير أولويات مرحلة عمرية سابقة.","التخطيط الانتقالي عملية مبكرة لا تبدأ بعد التخرج."],"c":"الصف الثالث المتوسط… إعاقة فكرية بسيطة","p":"في المراهقة: استقلال وتقرير مصير وتخطيط انتقالي، مع شراكة الأسرة."},{"id":"2-22","s":2,"i":"2.3","l":"تطبيق","t":"لاحظت معلمة أن طالبة في الصف الأول المتوسط ذات إعاقة فكرية تعانق أشخاصًا لا تعرفهم، وتعطي معلوماتها الشخصية لمن يسألها بسهولة. أي هدف يتسق مع مطالب هذه المرحلة العمرية؟","o":["منعها من التفاعل مع الآخرين في المدرسة حمايةً لها من أي خطر محتمل","تأجيل هذه المهارات حتى تنضج من تلقاء نفسها في المرحلة الثانوية","الاكتفاء بإبلاغ أسرتها لتراقبها خارج المدرسة دون وضع هدف تعليمي","تعليمها صراحةً مهارات الخصوصية والحدود الشخصية والسلامة بما يناسب قدرتها"],"a":3,"w":"يُضاف إلى مطالب المراهقة البلوغ والتغيرات الجسدية والخصوصية والسلامة الشخصية، والطالبة ذات الإعاقة الفكرية تحتاج تعليمًا صريحًا لهذه المهارات. والحماية الزائدة أو التأجيل لا يبنيان الاستقلال ولا السلامة.","n":["حماية زائدة تعزلها ولا تعلمها المهارة.","المهارة لا تُكتسب تلقائيًّا، والخطر قائم الآن.","إشراك الأسرة مهم، لكنه لا يغني عن هدف تعليمي.","صحيح: تعليم صريح للخصوصية والسلامة."],"c":"تعانق أشخاصًا لا تعرفهم… معلوماتها الشخصية","p":"المراهقة تستدعي أهداف الخصوصية والسلامة والاستقلال بتعليم صريح، لا بالمنع."},{"id":"2-23","s":2,"i":"2.3","l":"تحليل","t":"تامر (13 سنة) ذو إعاقة فكرية يقرأ بمستوى الصف الأول. اقترح معلمه تدريبه على قصص مصورة موجهة لأطفال الروضة لأنها «تناسب مستواه»، واقترحت زميلته نصوصًا وظيفية قصيرة بالمستوى القرائي نفسه، مثل لافتات المحلات وقوائم المشتريات. أي الاقتراحين أدق، ولماذا؟","o":["اقتراح الزميلة؛ لأنه يبدأ من أدائه الحالي ويراعي في الوقت نفسه مطالب عمره واهتماماته","اقتراح المعلم؛ لأن مستوى الأداء الحالي وحده يحدد المحتوى والمادة التعليمية المناسبة له","الاقتراحان متكافئان؛ لأن كليهما مكتوب بالمستوى القرائي نفسه الذي يناسب أداءه الحالي","لا يصلح أيهما؛ لأن عمره الزمني يقتضي تدريبه على نصوص الصف السابع"],"a":0,"w":"العمر الزمني يحدد المطالب النمائية والاهتمامات المناسبة، بينما يحدد مستوى الأداء الحالي نقطة البداية التعليمية. واقتراح الزميلة يجمع الأمرين في نصوص وظيفية بمستوى مناسب، أما قصص الروضة فتتجاهل عمر المراهق ومطالب مرحلته.","n":["صحيح: يجمع الأداء الحالي ومطالب العمر.","الأداء يحدد البداية، لكنه لا يلغي مراعاة العمر والاهتمامات.","تساوي المستوى لا يجعل المادتين متكافئتين في الملاءمة العمرية.","يبني الهدف على العمر وحده ويتجاهل الأداء الحالي."],"c":"13 سنة… يقرأ بمستوى الصف الأول","p":"العمر يحدد المطالب، والأداء الحالي يحدد البداية؛ فاجمع بينهما."},{"id":"2-24","s":2,"i":"2.3","l":"تحليل","t":"قرأ معلم أن الطلاب ذوي اضطراب طيف التوحد «يفضلون العمل الفردي»، فقرر استبعاد يزن من جميع أنشطة المجموعات، مع أن ملاحظاته الموثقة تُظهر أن يزن يبادر بالتفاعل مع زميلين في الأنشطة المنظمة. ما الخلل الأساسي في القرار؟","o":["اعتماد المعلم على مصدر واحد، والأصح الرجوع إلى أكثر من كتاب عن خصائص اضطراب طيف التوحد","عدم استشارة الأسرة قبل الاستبعاد، مع أن القرار في ذاته سليم ومتسق مع خصائص الفئة","عدم استبعاده من الأنشطة الصفية الفردية أيضًا لتقليل مطالب التفاعل الاجتماعي عليه","تعميم خاصية محتملة للفئة على فرد تخالفها بياناته؛ فالقرار يُبنى على بيانات الطالب"],"a":3,"w":"لا توجد «شخصية نمائية واحدة» لكل فئة؛ فخصائص الفئة تساعد على توقع حاجات محتملة، لكن القرار التعليمي يُبنى على بيانات الطالب الفردية. وبيانات يزن تثبت قدرته على التفاعل في الأنشطة المنظمة، فاستبعاده يحرمه مشاركة ناجحة.","n":["تعدد الكتب لا يعالج خطأ التعميم على الفرد.","يقر قرارًا يخالف بيانات الطالب.","يضاعف الخطأ ويقلص فرص التعلم.","صحيح: الفئة تشير إلى احتمالات، وبيانات الطالب تحدد القرار."],"c":"ملاحظاته الموثقة تُظهر أن يزن يبادر","p":"الفئة تشير إلى احتمالات، وبيانات الطالب تحدد القرار."},{"id":"2-25","s":2,"i":"2.4","l":"معرفة","t":"أي المهارات الآتية «لا» تُعد من الوظائف التنفيذية؟","o":["التخطيط لمراحل مشروع طويل وتحديد مواعيد إنجازها","تمييز الحروف المتشابهة في الشكل تمييزًا بصريًّا","التحول المرن إلى استراتيجية أخرى عند تعثر الأولى","مراقبة الطالب لأدائه في أثناء العمل وتصحيح أخطائه"],"a":1,"w":"الوظائف التنفيذية تشمل التخطيط والتنظيم والبدء والمرونة وضبط الاستجابة والمراقبة الذاتية. أما تمييز الأشكال والحروف المتشابهة فمن عمليات الإدراك التي تُعنى بتفسير المدخلات البصرية والسمعية والمكانية.","n":["التخطيط من الوظائف التنفيذية.","صحيح: هذه عملية إدراك بصري لا وظيفة تنفيذية.","المرونة من الوظائف التنفيذية.","المراقبة الذاتية من الوظائف التنفيذية."],"c":"«لا» تُعد من الوظائف التنفيذية","p":"التخطيط والتنظيم والمرونة والمراقبة الذاتية وظائف تنفيذية، وتفسير المدخلات إدراك."},{"id":"2-26","s":2,"i":"2.4","l":"معرفة","t":"أي الأمثلة الآتية يمثل أثرًا غير مباشر للإعاقة؟","o":["تراجع مشاركة طالب ضعيف سمع في النقاش الصفي حين لا تتوفر له إتاحة مناسبة","صعوبة سماع طالب ضعيف سمع لبعض المعلومات المسموعة في أثناء الشرح","صعوبة رؤية طالب ضعيف بصر للنص المطبوع بخط صغير في الكتاب المدرسي","صعوبة تنقل طالب ذي إعاقة حركية بين الفصول والمرافق المدرسية دون كرسي متحرك"],"a":0,"w":"قد تبدأ الإعاقة بحاجز مباشر في الحس أو الحركة أو التواصل، ثم يظهر أثر ثانوي غير مباشر في المشاركة أو التعلم أو السلوك إذا لم تتوفر الإتاحة. فصعوبة السماع أثر مباشر، أما تراجع المشاركة لغياب الإتاحة فأثر غير مباشر.","n":["صحيح: أثر ثانوي ناتج عن غياب الإتاحة.","أثر مباشر لفقد السمع.","أثر مباشر لضعف البصر.","أثر مباشر للقصور الحركي."],"c":"أثرًا غير مباشر للإعاقة","p":"الأثر المباشر في الوظيفة المتأثرة نفسها، وغير المباشر في المشاركة والتعلم والسلوك."},{"id":"2-27","s":2,"i":"2.4","l":"تطبيق","t":"يفهم فهد شرح المعلم جيدًا، لكنه حين يُطلب منه: «افتح الكتاب صفحة 40، وحل التمرين الثالث، ثم انقل الناتج إلى الجدول» يفتح الكتاب فقط ثم يتوقف. ما الدعم الأنسب؟","o":["إعادة التعليمات الثلاث شفهيًّا بصوت أعلى ثم مطالبته بالبدء مباشرة","تقديم التعليمات خطوة بعد خطوة مع قائمة مكتوبة أو مصورة يرجع إليها","خفض عدد التمارين المطلوبة منه إلى تمرين واحد فقط في كل حصة دراسية","تنبيهه إلى ضرورة الإصغاء الجيد وتعزيزه إذا نفذ التعليمات كاملة"],"a":1,"w":"الطالب يفهم التعليمات لكنه يفقدها حين تكون طويلة ومتعددة الخطوات، وهذه سمة محدودية الذاكرة العاملة. ويُدعم بتجزئة التعليمات وتقديمها مكتوبة أو مصورة وربط الخطوات بمرئيات ثابتة، لا بزيادة الحمل الشفهي.","n":["التكرار الشفهي لا يخفف العبء على الذاكرة العاملة.","صحيح: تجزئة ودعم مرئي ثابت.","يخفض المطلوب بدل معالجة طريقة تقديم التعليمات.","يفترض ضعف إصغاء، والمشكلة في الاحتفاظ بالخطوات."],"c":"يفهم… يفتح الكتاب فقط ثم يتوقف","p":"نسيان الخطوة الثانية قرينة الذاكرة العاملة، وعلاجها التجزئة والدعم البصري."},{"id":"2-28","s":2,"i":"2.4","l":"تطبيق","t":"ترمي دانة أدواتها على الأرض في حصة الإملاء تحديدًا، فتُرسل إلى مكتب المرشدة حتى تنتهي الحصة، وقد تكرر ذلك أربع مرات في أسبوعين. ما الفرضية الوظيفية الأقرب، والإجراء الأنسب؟","o":["جذب الانتباه؛ يُتجاهل السلوك تمامًا في كل مرة حتى ينطفئ مع الوقت دون أي إجراء آخر","وظيفة حسية؛ تُوفر لها أدوات حسية تستخدمها في حصة الإملاء كلما شعرت بالتوتر","العناد؛ تُضاعف العقوبة في كل مرة حتى تلتزم بقواعد الصف وتكمل مهمة الإملاء مع زميلاتها","الهروب من المهمة؛ تُجمع بيانات ABC للتحقق، ثم تُضبط المهمة ويُعلَّم طلب الاستراحة بديلًا"],"a":3,"w":"يظهر السلوك عند مهمة بعينها وينتهي بخروج دانة منها، وهذه قرينة على وظيفة الهروب أو التجنب، والإرسال إلى المرشدة يحقق لها هذا الهروب. والمهني جمع بيانات السوابق والسلوك والنتائج للتحقق، ثم ضبط صعوبة المهمة وتعليم بديل تواصلي مقبول يؤدي الغرض.","n":["النتيجة خروج من المهمة لا حصول على انتباه.","السلوك مرتبط بمهمة محددة ونتيجة اجتماعية واضحة.","يفسر السلوك صفة ثابتة ويقفز إلى العقاب.","صحيح: سابق محدد ونتيجة تُنهي المهمة، فالوظيفة هروب."],"c":"في حصة الإملاء تحديدًا… حتى تنتهي الحصة","p":"سلوك يظهر عند مهمة صعبة وينتهي بالخروج منها وظيفته الهروب؛ حلّل الوظيفة قبل التدخل."},{"id":"2-29","s":2,"i":"2.4","l":"تطبيق","t":"تحصيل طالب ذي إعاقة سمعية منخفض في الدراسات الاجتماعية التي تعتمد حصصها على النقاش الشفهي، بينما أداؤه مرتفع في الرياضيات حين تُعرض المسائل كتابةً. ما الإجراء الأنسب قبل الحكم على قدرته في المادة؟","o":["فحص أثر الوصول إلى المعلومة المسموعة، وتوفير إتاحة بصرية وتواصلية، ثم إعادة تقدير أدائه","خفض أهدافه في الدراسات الاجتماعية؛ لأن الإعاقة السمعية تحد من قدرته على التحليل والاستنتاج","إحالته لتقييم صعوبة تعلم نوعية في المادة؛ لأن أداءه متفاوت تفاوتًا واضحًا بين المواد","نقل حصص الدراسات الاجتماعية إلى غرفة المصادر لتكرار الشرح الشفهي نفسه له"],"a":0,"w":"الإعاقات الحسية لا تعني بالضرورة انخفاض القدرة العقلية، لكن غياب الوصول الملائم للمعلومة قد يحد من التحصيل. وتباين أدائه بين مادة شفهية وأخرى مكتوبة قرينة على حاجز وصول، فيُفحص أثر الإتاحة قبل تفسير التحصيل.","n":["صحيح: الوصول قبل الحكم على القدرة.","يخلط حاجز الوصول بالقدرة ويخفض التوقعات.","يتجاهل حاجز الوصول السمعي الواضح في الموقف.","يكرر القناة الشفهية نفسها التي تشكل الحاجز."],"c":"على النقاش الشفهي… حين تُعرض المسائل كتابةً","p":"مع الإعاقة الحسية: افحص الوصول إلى المعلومة قبل تفسير التحصيل."},{"id":"2-30","s":2,"i":"2.4","l":"تطبيق","t":"يفقد بندر تركيزه بعد دقائق من بدء الشرح الطويل، ويلتفت إلى كل صوت في الممر، وتفوته أجزاء من التعليمات. أي الإجراءات الصفية أنسب لدعمه؟","o":["إطالة مدة الشرح وتكراره ليتمكن من التقاط ما فاته منه في المرة الأولى","تقديم التعليمات كلها دفعة واحدة في بداية الحصة ثم تركه يعمل منفردًا","منعه من أي حركة في أثناء الحصة حتى يعتاد الجلوس الطويل والتركيز مدة أطول في كل درس","تقسيم الشرح إلى وحدات قصيرة مع إشارات بصرية وتغذية راجعة سريعة وتقليل المشتتات"],"a":3,"w":"صعوبة الحفاظ على الانتباه أو توجيهه قد تُفقد الطالب أجزاء من التعليم، ويُستفاد معها من تقليل المشتتات وتقسيم المهمة والإشارات البصرية وفترات الحركة المنظمة والتغذية الراجعة القصيرة.","n":["يزيد المدة التي يعجز عن متابعتها.","يزيد الحمل دفعة واحدة على انتباه محدود.","يمنع فترات الحركة المنظمة التي قد تدعم الانتباه.","صحيح: تجزئة وإشارات وتغذية راجعة وتقليل مشتتات."],"c":"يفقد تركيزه… يلتفت إلى كل صوت","p":"صعوبة الانتباه تُدعم بتقليل المشتتات وتقسيم المهمة وإشارات واضحة وتغذية راجعة قصيرة."},{"id":"2-31","s":2,"i":"2.4","l":"تحليل","t":"كانت جود متحمسة للقراءة في الصف الأول، وبعد ثلاث سنوات من الإخفاق المتكرر صارت تقول «أنا غبية» وترفض القراءة أمام زميلاتها. فسّر أحد المعلمين ذلك بأنه «جزء من صعوبات التعلم نفسها». ما التحليل الأدق؟","o":["سمة حتمية لصعوبات التعلم لا تتغير مهما تغيرت ظروف التعلم والدعم المقدم لها","أثر غير مباشر لخبرات الفشل المتكررة، يحتاج خبرات نجاح وتدخلًا قرائيًّا مناسبًا","دليل على إعاقة فكرية مصاحبة يستدعي إعادة تصنيفها وتعديل خطتها بالكامل","عناد سلوكي يُعالج بإلزامها القراءة الجهرية أمام زميلاتها يوميًّا حتى تعتاد"],"a":1,"w":"تدني مفهوم الذات والتجنب ليسا سمتين حتميتين للإعاقة، بل كثيرًا ما يتأثران بخبرات الفشل والتنمر والعوائق البيئية. والتغير الزمني في حالة جود قرينة على أثر ثانوي يُعالج ببناء خبرات نجاح وتدخل قرائي مناسب.","n":["يجعل الأثر الثانوي صفة ثابتة، وهو خطأ شائع.","صحيح: أثر ثانوي لخبرات الفشل.","لا قرينة على قصور فكري أو تكيفي.","يزيد خبرات الفشل والإحراج بدل معالجتها."],"c":"كانت متحمسة… بعد ثلاث سنوات من الإخفاق","p":"العزلة والقلق وتدني مفهوم الذات ليست سمات حتمية للإعاقة؛ افحص الخبرات والبيئة."},{"id":"2-32","s":2,"i":"2.4","l":"تحليل","t":"سجّل معلم بيانات ABC لصراخ طالب في عشرة مواقف: في ثمانية منها حدث الصراخ حين كان المعلم منشغلًا مع مجموعة أخرى، وأعقبه توجه المعلم إليه والتحدث معه مدة طويلة. ما الاستنتاج والتدخل الأنسب؟","o":["وظيفة الهروب؛ تُخفض صعوبة المهام المقدمة له في أثناء العمل في المجموعات الصفية المختلفة","وظيفة حسية؛ يُوفر له ركن هادئ في الفصل يستخدمه كلما شعر بالحاجة إلى الصراخ أو بالتوتر الشديد","وظيفة الانتباه؛ يُعلَّم طريقة مقبولة لطلب الانتباه ويُعزز عليها، ويُقلل الانتباه بعد الصراخ","لا يمكن الاستنتاج من البيانات؛ فيُعاقب على الصراخ في كل مرة حتى تتضح وظيفته لاحقًا"],"a":2,"w":"تكرار السلوك حين ينشغل المعلم، وتلوه باهتمام طويل، نمط يرجح وظيفة الحصول على الانتباه. والتدخل الوظيفي يعلم بديلًا مقبولًا يؤدي الغرض نفسه ويعززه، مع تقليل تعزيز السلوك غير المرغوب.","n":["لا قرينة على مهمة صعبة يهرب منها.","النتيجة الاجتماعية واضحة في البيانات، فلا ترجيح للوظيفة الحسية.","صحيح: السابق انشغال المعلم والنتيجة اهتمام.","البيانات كافية لفرضية، والعقاب ليس الاستجابة الأولى."],"c":"حين كان المعلم منشغلًا… التحدث معه","p":"سلوك يزداد حين ينشغل الآخرون ثم يتبعه اهتمام وظيفته الانتباه؛ علّم بديلًا وعززه."},{"id":"2-33","s":2,"i":"2.5","l":"معرفة","t":"ما المقصود بالاحتياج التربوي للطالب ذي الإعاقة؟","o":["اسم الإعاقة المدون في تقرير التشخيص الذي تُحدد على أساسه الخدمات التي يحتاجها","قائمة الخدمات والبرامج المتاحة في المدرسة التي يمكن أن يستفيد منها الطالب ذو الإعاقة","الفرق بين درجته في اختبار الذكاء ومتوسط درجات أقرانه في العمر الزمني نفسه","فجوة ذات دلالة بين أدائه الحالي ومتطلبات التعلم أو المشاركة أو الاستقلالية المتوقعة منه"],"a":3,"w":"الاحتياج التربوي فجوة موثقة بين ما يستطيع الطالب أداءه الآن وما يُتوقع منه في سياقه العمري والتعليمي، ويُحدد من مصادر متعددة لا من اسم الإعاقة. والتشخيص معلومة مهمة، لكن طالبين بالتشخيص نفسه قد يحتاجان خدمات مختلفة.","n":["التشخيص لا يساوي الحاجة التعليمية.","يبدأ بالخدمة قبل تحديد الحاجة.","درجة الذكاء المنفردة لا تحدد الاحتياج التربوي.","صحيح: فجوة موثقة بين الأداء والمتطلبات."],"c":"الاحتياج التربوي","p":"الحاجة قبل الخدمة، والبيانات قبل القرار."},{"id":"2-34","s":2,"i":"2.5","l":"معرفة","t":"ما الفرق الأدق بين التصميم الشامل للتعلم (UDL) والتكييف (Accommodation)؟","o":["الأول يغير مستوى الهدف التعليمي لجميع الطلاب في الصف، والثاني يغير مستوى الهدف لطالب واحد فقط","الأول يُبنى في الدرس مسبقًا بخيارات لأوسع نطاق من المتعلمين، والثاني استجابة لطالب بعينه مع بقاء الهدف","الأول خطة فردية مكتوبة لطالب ذي إعاقة بعينه، والثاني تنويع في طرائق التدريس يُقدَّم لجميع الطلاب في الصف","لا فرق بينهما في الجوهر؛ فكلاهما يُقدَّم للطالب بعد أن يُخفق في الوصول إلى المحتوى الدراسي"],"a":1,"w":"التصميم الشامل للتعلم تصميم استباقي للدرس منذ البداية بخيارات متعددة للمشاركة وعرض المعلومات والتعبير عن التعلم. أما التكييف فتغيير في طريقة الوصول أو الاستجابة أو الوقت لطالب بعينه دون تغيير جوهر المهارة المقاسة.","n":["كلاهما لا يغير مستوى الهدف؛ فتغيير الهدف تعديل.","صحيح: استباقي للجميع مقابل فردي مع بقاء الهدف.","يعكس المفهومين؛ فالتصميم الشامل ليس خطة فردية.","التصميم الشامل استباقي لا يُنتظر فيه الإخفاق."],"c":"التصميم الشامل للتعلم… والتكييف","p":"التصميم الشامل قبل الدرس للجميع، والتكييف لطالب بعينه مع بقاء الهدف، والتعديل يغير الهدف."},{"id":"2-35","s":2,"i":"2.5","l":"تطبيق","t":"طالب لديه شلل دماغي بسيط يتعب سريعًا من الجلوس على الكرسي العادي فيميل جسمه، ويجد صعوبة في الوصول إلى معمل الحاسب في الدور العلوي. ما محور الاحتياج والاستجابة الأنسب؟","o":["احتياج بدني حركي؛ يُقيّم وظيفيًّا وتُوفر وضعية جلوس مناسبة ويُهيأ الوصول إلى المعمل","احتياج معرفي؛ يُبسط محتوى مادة الحاسب وتُختصر مهامها لتقليل الجهد المطلوب منه","احتياج نفسي؛ يُرشد لتنمية قدرته على تحمل التعب والصبر على الجلوس مدة أطول","احتياج اجتماعي؛ يُكلف زميل بمرافقته وحمل أدواته في جميع تنقلاته داخل المدرسة"],"a":0,"w":"الاحتياجات البدنية والحركية تشمل الوصول المادي والوضعية والجلوس والتنقل والتحمل، والهدف إزالة العائق البيئي وتمكين الطالب من المشاركة باستقلالية. ويُستجاب لها بتقييم وظيفي للبيئة وأثاث ووضعيات مناسبة وتهيئة مسارات الوصول.","n":["صحيح: الحاجة بدنية والاستجابة إزالة العائق.","يخفض المحتوى بسبب حاجز حركي لا معرفي.","يحوّل حاجة جسدية إلى مسألة نفسية.","المرافقة الدائمة قد تخلق اعتمادية ولا تزيل العائق."],"c":"يتعب سريعًا من الجلوس… الوصول إلى معمل","p":"الحاجز الحركي أو المكاني يُعالج بتهيئة البيئة والوضعية والتقنية، لا بخفض المحتوى."},{"id":"2-36","s":2,"i":"2.5","l":"تطبيق","t":"لتحسين مشاركة مشعل الاجتماعية، طلبت المعلمة من زميله أن يكتب له الإجابات ويتحدث نيابة عنه في المجموعات. ما التقويم الأدق لهذا الإجراء؟","o":["إجراء مناسب؛ لأنه يضمن حضور مشعل في المجموعة ومشاركته في الناتج النهائي دون أن يتعرض لأي إحراج أمام زملائه","إجراء مناسب ما دام الزميل متفوقًا دراسيًّا ويقدم الإجابات الصحيحة باسم المجموعة كلها","دعم الأقران مفيد إذا كان منظمًا، لكن هذه الصيغة تخلق اعتمادية؛ والأنسب أدوار تعاونية تتيح له المبادرة","الأنسب إخراج مشعل من المجموعات حتى يكتسب المهارات الاجتماعية منفردًا ثم يعود إليها"],"a":2,"w":"من استجابات الاحتياج الاجتماعي التدريب على المهارات والنمذجة ولعب الأدوار والتعلم التعاوني المنظم ودعم الأقران دون خلق اعتمادية. وحين يتحدث الزميل نيابة عن مشعل يُحرم من ممارسة المهارة التي يحتاجها.","n":["الحضور الشكلي ليس مشاركة حقيقية.","صحة الإجابات لا تعني أن مشعل يتعلم المهارة.","صحيح: دعم منظم يبني المبادرة لا الاعتمادية.","العزل يحرمه السياق الطبيعي لتعلم المهارة الاجتماعية."],"c":"يتحدث نيابة عنه","p":"جودة الدعم تُقاس بزيادة المشاركة والاستقلال، لا براحة الطالب."},{"id":"2-37","s":2,"i":"2.5","l":"تطبيق","t":"يتناول طالب ذو إعاقة دواءً موصوفًا، ولاحظ معلمه أنه ينام كثيرًا في الحصص الأولى منذ أسبوعين. ما التصرف المهني الأنسب للمعلم؟","o":["نصح الأسرة بتأخير موعد الجرعة اليومية إلى ما بعد انتهاء اليوم الدراسي حتى يزول النعاس عنه في الحصص","توثيق الملاحظة وتوقيتها، وإبلاغ الأسرة والممرض المدرسي وفق الخطة الصحية، دون اقتراح تغيير","خفض أهدافه الأكاديمية مؤقتًا إلى أن يزول النعاس من تلقاء نفسه دون إبلاغ أي جهة","نقل الحصص الأساسية إلى نهاية اليوم الدراسي والانتظار دون إبلاغ الأسرة أو الفريق"],"a":1,"w":"المعلم يحدد الاحتياجات التعليمية ويشارك الفريق، لكنه لا يصف دواءً أو علاجًا ولا يقترح تعديله. ودوره توثيق الملاحظة والتواصل مع الأسرة والجهة الصحية وفق الخطة الصحية المعتمدة.","n":["اقتراح توقيت الجرعة تدخل علاجي يتجاوز دور المعلم.","صحيح: توثيق وتواصل ضمن حدود الدور.","يخفض التوقعات بدل معالجة السبب عبر المختصين.","يحجب معلومة صحية مهمة عن الأسرة والفريق."],"c":"دواءً موصوفًا… ينام كثيرًا","p":"في الشأن الصحي: وثّق وتواصل وفق الخطة المعتمدة، ولا تصف علاجًا ولا دواءً."},{"id":"2-38","s":2,"i":"2.5","l":"تطبيق","t":"يرفض فيصل البدء في أي مهمة كتابية ويقول: «لن أنجح»، بينما تُظهر عينات أعماله أنه يكتب جملًا قصيرة صحيحة. ما الاستجابة الأنسب لاحتياجه؟","o":["إحالته فورًا إلى مختص نفسي لتشخيص اضطراب في المزاج قبل تكليفه بأي مهمة","بناء خبرات نجاح بمهام متدرجة تبدأ من قدرته الحالية، مع تعزيز الجهد والتقدم","إعفاؤه من المهام الكتابية حتى تتحسن دافعيته للكتابة من تلقاء نفسها","إلزامه بإكمال المهمة كاملة وحرمانه من الفسحة في كل مرة يرفض فيها البدء"],"a":1,"w":"الاحتياجات النفسية تشمل مفهوم الذات والدافعية وتحمل الإحباط، ومن الاستجابات المناسبة بناء خبرات نجاح واقعية وتعزيز الجهد والتقدم وإتاحة الخيارات. وعينات أعماله نقطة قوة يُبدأ منها، والإحالة تكون عند مؤشرات نفسية شديدة.","n":["يقفز إلى التشخيص دون مؤشرات شديدة.","صحيح: نجاح متدرج من نقطة قوته.","الإعفاء يحرمه خبرات النجاح التي يحتاجها.","العقاب يزيد الإحباط ولا يبني الدافعية."],"c":"«لن أنجح»… يكتب جملًا قصيرة صحيحة","p":"ابدأ من نقاط القوة لبناء الدافعية مع معالجة الحاجة."},{"id":"2-39","s":2,"i":"2.5","l":"تحليل","t":"يتضمن ملف عبدالله: تشخيص صعوبة تعلم، ودقة 45٪ في قراءة كلمات صفه جهريًّا، وملاحظة أنه يجيب عن أسئلة الفهم بدقة حين يُقرأ له النص، ويشارك بفاعلية في النقاش. ما الصياغة الأدق لاحتياجه؟","o":["احتياج في الفهم العام يستدعي تبسيط جميع النصوص المقدمة له في المواد الدراسية كافة","احتياج اجتماعي في المشاركة يستدعي تدريبه على مهارات التواصل والحوار مع أقرانه","احتياج أكاديمي في فك الترميز والقراءة الجهرية، مع قوة في الفهم الاستماعي والمشاركة","احتياج يحدده التشخيص وحده: خدمات صعوبات التعلم المعتادة المقدمة لجميع طلاب البرنامج"],"a":2,"w":"الاحتياج فجوة موثقة تُحدد من مصادر متعددة، ويبدأ التخطيط من نقاط القوة بقدر ما يبدأ من جوانب القصور. وبيانات عبدالله تحصر الفجوة في القراءة الجهرية وفك الترميز، بينما فهمه ومشاركته نقطتا قوة يمكن توظيفهما.","n":["البيانات تثبت سلامة فهمه حين يُقرأ له النص.","البيانات تصف مشاركة فعالة لا حاجة اجتماعية.","صحيح: يحدد الفجوة بدقة ويوظف نقاط القوة.","يشتق الحاجة من التشخيص لا من البيانات."],"c":"45٪… بدقة حين يُقرأ له","p":"صُغ الاحتياج من البيانات: الفجوة بدقة، ونقاط القوة بوضوح."},{"id":"2-40","s":2,"i":"2.5","l":"تحليل","t":"بعد ثمانية أسابيع من توفير قارئ شاشة لطالبة ضعيفة بصر، أظهرت البيانات أنها نادرًا ما تستخدمه وأن دقة فهمها القرائي لم تتغير، وأفادت بأنها تجد صعوبة في تشغيله. ما القرار الأنسب؟","o":["الاستمرار في الأداة نفسها دون تغيير؛ لأنها منصوص عليها في خطتها الفردية المعتمدة من الفريق","إيقاف جميع أشكال الدعم المقدمة لها؛ لأنها لم تستفد من الأداة التقنية خلال المدة الماضية","خفض هدف الفهم القرائي لديها؛ لأن الدعم التقني المقدم لم يحقق النتيجة المرجوة منه","مراجعة البيانات مع الفريق، وتدريبها على الأداة أو تجربة بديل أبسط كالتكبير، ثم متابعة الأثر"],"a":3,"w":"الخطة الفردية ليست وثيقة ثابتة؛ تُراجع حين تكشف البيانات عدم فاعلية الدعم. والتقنية المساندة تُختار بحسب الحاجة الوظيفية وفاعليتها في المشاركة والاستقلال، فإذا كان العائق في التشغيل يُعالج بالتدريب أو ببديل أنسب ثم يُتابع الأثر.","n":["وجود الأداة في الخطة لا يبرر استمرار دعم غير فعال.","يلغي الدعم بدل تعديله.","يخفض الهدف بسبب خلل في الدعم لا في قدرتها.","صحيح: البيانات تقود تعديل الدعم."],"c":"نادرًا ما تستخدمه… صعوبة في تشغيله","p":"إذا لم يحقق الدعم أثرًا فعدّله بالبيانات قبل أن تخفض الهدف أو توقف الخدمة."},{"id":"3-01","s":3,"i":"3.1","l":"معرفة","t":"أجاب طالب إجابة صحيحة عن 18 فقرة من 25 في اختبار للكسور. ماذا تمثل هذه النتيجة وحدها؟","o":["تقييمًا شاملًا يحدد احتياجات الطالب ونقاط قوته في مهارات الكسور","تشخيصًا لصعوبة في الرياضيات يحدد أهلية الطالب لخدمات التربية الخاصة","قياسًا يصف مقدار الأداء، ولا يكفي وحده لتفسير سبب الضعف أو لاتخاذ قرار","تقويمًا لفاعلية برنامج الرياضيات الذي يتلقاه الطالب في صفه"],"a":2,"w":"القياس إسناد قيمة رقمية لأداء وفق قواعد محددة، ويجيب عن «كم؟». والرقم وحده لا يتضمن حكمًا تربويًّا شاملًا؛ فهو يحتاج إلى دمج مع مصادر أخرى وتفسير حتى يصبح تقييمًا يقود إلى قرار.","n":["التقييم يدمج مصادر متعددة ويفسرها، والرقم وحده لا يفعل ذلك.","التشخيص يتطلب تقييمًا شاملًا ومعايير، لا درجة واحدة.","صحيح: قيمة كمية وفق قاعدة.","التقويم حكم على فاعلية برنامج، وهذه درجة طالب في اختبار."],"c":"18 من 25: قيمة كمية فقط","p":"رقم أو قيمة كمية وحدها = قياس."},{"id":"3-02","s":3,"i":"3.1","l":"معرفة","t":"ما المفهوم الذي يعني إصدار حكم على قيمة برنامج أو تدخل أو خطة وفاعليته، اعتمادًا على بيانات القياس والتقييم؟","o":["التقييم (Assessment)","التشخيص (Diagnosis)","القياس (Measurement)","التقويم (Evaluation)"],"a":3,"w":"التقويم حكم على قيمة برنامج أو تدخل أو خطة وفاعليته بناءً على بيانات القياس والتقييم، ويقود إلى الاستمرار أو التعديل أو الإنهاء. ويُخلط كثيرًا بالتقييم الذي يجمع البيانات عن الطالب ويفسرها.","n":["التقييم جمع بيانات عن الطالب وتفسيرها لاتخاذ قرار.","التشخيص تحديد طبيعة الحالة وانطباق المعايير والأهلية.","القياس إسناد قيمة رقمية للأداء وفق قواعد.","صحيح: حكم على الفاعلية."],"c":"حكم على قيمة برنامج وفاعليته","p":"الحكم على فاعلية برنامج أو تدخل = تقويم."},{"id":"3-03","s":3,"i":"3.1","l":"تحليل","t":"اختبار لقياس فهم المسائل الرياضية يعتمد على نصوص لغوية طويلة ومعقدة، ومعامل ثباته مرتفع. استخدمه الفريق للحكم على الفهم الرياضي لطالب لديه صعوبة قراءة شديدة. ما الخلل الأساسي في هذا الاستخدام؟","o":["انخفاض ثبات الاختبار، لأن نتائج الطالب قد تتغير عند إعادة تطبيقه بعد مدة","ضعف موضوعية التصحيح، لأن تقدير الفهم الرياضي يعتمد على حكم المصحح الشخصي","انخفاض القدرة التمييزية، لأن فقرات الاختبار لا تميز بين مستويات الطلاب","ضعف صدق التفسير لهذا الغرض، لأن حاجز القراءة قد يلوّث البناء الرياضي المقاس"],"a":3,"w":"الصدق يتعلق بسلامة تفسير الدرجة واستخدامها للغرض المقصود. وهنا قد تعكس الدرجة صعوبة القراءة لا الفهم الرياضي، فيضعف صدق التفسير مع أن الثبات مرتفع؛ لأن الثبات وحده لا يضمن أن الأداة تقيس البناء المطلوب لهذا الطالب.","n":["الموقف ينص على ثبات مرتفع.","لا قرينة على اختلاف المصححين.","لا قرينة على ضعف تمييز الفقرات.","صحيح: الصدق مرتبط بالغرض وبالطالب."],"c":"ثبات مرتفع وحاجز قراءة يلوّث القياس","p":"اتساق النتائج = ثبات، وملاءمة التفسير للغرض = صدق؛ والثبات لا يضمن الصدق."},{"id":"3-04","s":3,"i":"3.1","l":"تطبيق","t":"حصلت لمى على رتبة مئينية 30 في اختبار تحصيل مقنن في القراءة. كيف تشرح المعلمة هذه النتيجة لأسرتها بدقة؟","o":["أجابت إجابة صحيحة عن 30٪ من فقرات الاختبار الذي طُبّق عليها","أتقنت 30٪ من مهارات القراءة المقررة على طلاب صفها الدراسي","حصلت على 30 درجة خام من الدرجة الكلية للاختبار","أداؤها يساوي أداء نحو 30٪ من المجموعة المرجعية للاختبار أو يفوقه"],"a":3,"w":"الرتبة المئينية تصف موقع الطالب بالنسبة للمجموعة المرجعية: النسبة التقريبية ممن يقع أداء الطالب عند مستواهم أو فوقه بحسب تعريف الأداة. وهي ليست نسبة إجابات صحيحة ولا نسبة إتقان ولا درجة خامًا.","n":["خلط بين الرتبة المئينية والنسبة المئوية.","الرتبة المئينية ليست نسبة إتقان.","خلط بين الرتبة المئينية والدرجة الخام.","صحيح: موقع نسبي في مجموعة مرجعية."],"c":"رتبة مئينية في اختبار مقنن","p":"الرتبة المئينية = موقع نسبي في المجموعة المرجعية، لا نسبة إجابات صحيحة."},{"id":"3-05","s":3,"i":"3.1","l":"تطبيق","t":"حصل طلال على درجة معيارية تقل بدرجتين فقط عن الحد الذي تعتمده اللجنة في قرار أهلية، والخطأ المعياري للقياس في الأداة ملحوظ. ما الممارسة الأنسب؟","o":["عدّ الدرجة قطعية واتخاذ القرار بحسب موقعها من الحد مباشرة","إعادة تطبيق الاختبار نفسه في اليوم التالي واعتماد الدرجة الأعلى منهما","تعديل الحد الفاصل لهذا الطالب حتى تتجاوزه درجته فيستحق الخدمة","تفسير الدرجة ضمن نطاق ثقة، ودعم القرار ببيانات من مصادر أخرى"],"a":3,"w":"الخطأ المعياري للقياس يذكّر بأن الدرجة المرصودة تقدير يحيط به عدم يقين، فتُفسَّر ضمن نطاق لا كرقم قطعي. وعندما تقترب الدرجة من حد قرار مهم يصبح دعم القرار بمصادر إضافية أكثر أهمية.","n":["يتجاهل عدم اليقين المحيط بالدرجة.","انتقاء الدرجة الأعلى تحيز لا يعالج عدم اليقين.","تلاعب بمعيار القرار بدل تفسير الدرجة بحذر.","صحيح: الدرجة تقدير يحيط به خطأ."],"c":"درجة قريبة من الحد وخطأ معياري ملحوظ","p":"عند حدود القرار تذكّر الخطأ المعياري ونطاق الثقة وتعدد المصادر."},{"id":"3-06","s":3,"i":"3.1","l":"معرفة","t":"أي الأسئلة الآتية يجيب عنه اختبار مرجعي المعيار (Norm-Referenced)؟","o":["هل أتقن الطالب القسمة الطويلة وفق المحك المحدد في هدف خطته؟","كم تحسنت طلاقة الطالب مقارنة بأدائه هو في الأسبوع الماضي؟","أين يقع أداء الطالب مقارنة بعينة مرجعية من أقرانه في العمر أو الصف؟","ما نوع الأخطاء التي يرتكبها الطالب في قراءة الكلمات متعددة المقاطع؟"],"a":2,"w":"مرجعي المعيار يقارن أداء الطالب بأداء مجموعة مرجعية ممثلة، فيعطي موقعًا نسبيًّا ورتبًا ودرجات معيارية. أما مقارنة الأداء بمحك أو مهارة محددة فمرجعية المحك، ومقارنة الطالب بنفسه عبر الزمن مراقبة تقدم.","n":["هذا سؤال مرجعي المحك.","هذا سؤال مراقبة تقدم يقارن الطالب بنفسه.","صحيح: مقارنة بالأقران.","هذا سؤال تحليل أخطاء."],"c":"مقارنة بعينة مرجعية من الأقران","p":"مقارنة بالأقران = مرجعي المعيار، ومقارنة بمحك إتقان = مرجعي المحك."},{"id":"3-07","s":3,"i":"3.1","l":"تحليل","t":"طُبّقت أداة مسح ذات حساسية مرتفعة ونوعية متوسطة على طلاب الصف الأول، فصنّفت ثمانية منهم في نطاق خطر صعوبات القراءة. ما الاستنتاج الأدق؟","o":["الطلاب الثمانية جميعهم لديهم صعوبات تعلم، لأن حساسية الأداة المستخدمة مرتفعة جدًّا","الأداة تستبعد بدقة كل من ليس لديه خطر، فلا حاجة إلى أي تحقق إضافي بعدها","النوعية المتوسطة تعني أن الأداة تُفوّت كثيرًا من المعرضين للخطر فعلًا","قلّما تُفوّت الأداة المعرضين للخطر، لكن بعض المصنّفين قد يكونون إيجابيات كاذبة"],"a":3,"w":"الحساسية المرتفعة تعني التقاط أغلب من لديهم الخطر فعلًا (قلة الحالات المفوَّتة)، والنوعية المتوسطة تعني أن بعض من صُنّفوا في نطاق الخطر قد لا يكونون كذلك. لذلك تُعد النتيجة الإيجابية في المسح دعوة إلى متابعة وتقييم أعمق، لا تشخيصًا.","n":["المسح لا يشخّص مهما كانت خصائصه.","استبعاد غير المعرضين وظيفة النوعية، وهي متوسطة هنا.","خلط بين النوعية والحساسية.","صحيح: حساسية مرتفعة ونوعية متوسطة."],"c":"حساسية مرتفعة ونوعية متوسطة","p":"الحساسية تلتقط المعرضين للخطر، والنوعية تستبعد غيرهم؛ والمسح لا يساوي التشخيص."},{"id":"3-08","s":3,"i":"3.1","l":"تطبيق","t":"قال أحد أعضاء الفريق في اجتماع: «كل تقييم نجريه للطالب هو تشخيص في النهاية». ما الرد المهني الأدق؟","o":["التشخيص يحتاج تقييمًا جيدًا، لكن كثيرًا من التقييم غرضه التخطيط ومتابعة التقدم","العبارة صحيحة، لأن أي جمع للبيانات يهدف في النهاية إلى تحديد طبيعة الحالة","العبارة صحيحة إذا استُخدمت أدوات مقننة، وخاطئة إذا كانت الأدوات غير رسمية","التقييم والتشخيص مترادفان، والفرق بينهما في المسمى الإداري فقط"],"a":0,"w":"التقييم عملية شاملة لجمع البيانات وتفسيرها لاتخاذ قرار تربوي، وأغراضه متعددة: المسح، وتحديد المستوى الحالي، وبناء الخطة، ومتابعة التقدم، وتقويم البرامج. أما التشخيص فقرار أخص يحدد طبيعة الحالة وانطباق المعايير والأهلية؛ فكل تشخيص جيد يحتاج تقييمًا جيدًا، وليس كل تقييم غرضه التشخيص.","n":["صحيح: ليس كل تقييم هدفه التشخيص.","يتجاهل أغراض التقييم الأخرى كالتخطيط والمتابعة.","الغرض لا نوع الأداة هو ما يحدد العملية.","التشخيص قرار أخص يحدد الحالة والأهلية."],"c":"«كل تقييم نجريه هو تشخيص»","p":"حدد الغرض أولًا: مسح؟ تشخيص؟ تخطيط؟ متابعة تقدم؟ تقويم برنامج؟"},{"id":"3-09","s":3,"i":"3.2","l":"معرفة","t":"أي مما يلي يميز الاختبار المقنن (الرسمي) عن الأداة غير الرسمية؟","o":["إجراءات موحدة للتطبيق والتصحيح والتفسير، وعينة تقنين، وبيانات عن الصدق والثبات","ارتباطه المباشر بمحتوى الدروس اليومية ومرونته في التطبيق بحسب حاجة كل طالب على حدة","اعتماده على ملاحظة المعلم للطالب في المواقف الصفية دون تعليمات محددة","إمكانية تعديل فقراته وتعليماته بحرية مع بقاء صلاحية معاييره الأصلية"],"a":0,"w":"الأداة المقننة تُعد وفق خطوات علمية منهجية، ولها عينة معيارية ممثلة وتعليمات موحدة للتطبيق والتصحيح والتفسير، وتتوافر عنها بيانات سيكومترية، وتعطي درجات معيارية أو رتبًا للمقارنة. أما المرونة والارتباط المباشر بالمنهج فمن سمات الأدوات غير الرسمية.","n":["صحيح: هذه خصائص التقنين.","هذه خصائص الأدوات غير الرسمية.","هذا وصف لملاحظة غير مقننة.","التعديل الجوهري يُبطل المقارنة المعيارية."],"c":"ما يميز المقنن عن غير الرسمي","p":"المقنن للمقارنة المنظمة، وغير الرسمي لتوجيه التدريس اليومي."},{"id":"3-10","s":3,"i":"3.2","l":"معرفة","t":"أي العبارات أدق في وصف العلاقة بين تصنيف «رسمي/غير رسمي» وتصنيف «مباشر/غير مباشر» لأدوات التقييم؟","o":["تصنيفان مستقلان؛ فقد يكون الاختبار المقنن مباشرًا، وقد يكون المقياس المقنن غير مباشر","تصنيفان مترادفان؛ فكل أداة رسمية مباشرة، وكل أداة غير رسمية غير مباشرة","الأداة غير الرسمية مباشرة في كل الأحوال، أما الأداة الرسمية فهي غير مباشرة في كل الأحوال","التصنيفان يخصان أدوات السلوك وحدها، ولا ينطبقان على أدوات التحصيل"],"a":0,"w":"تصنيف رسمي/غير رسمي يصف بناء الأداة وإجراءاتها، وتصنيف مباشر/غير مباشر يصف مصدر المعلومة. فالطالب الذي يؤدي اختبار تحصيل مقنن بنفسه يقدم بيانات مباشرة، ومقياس التقدير المقنن الذي يعبئه ولي الأمر يقدم بيانات غير مباشرة.","n":["صحيح: أحدهما يصف بناء الأداة والآخر مصدر المعلومة.","خلط شائع بين التصنيفين.","تعميم خاطئ؛ فمقياس التقدير غير الرسمي مثلًا غير مباشر.","التصنيفان ينطبقان على أنواع الأدوات كلها."],"c":"العلاقة بين التصنيفين","p":"رسمي/غير رسمي = بناء الأداة، ومباشر/غير مباشر = مصدر المعلومة."},{"id":"3-11","s":3,"i":"3.2","l":"تطبيق","t":"تريد المعلمة متابعة دقة نايف في حل مسائل الجمع مع إعادة التجميع كل أسبوع، ورسم اتجاه أدائه نحو هدف خطته الفردية. أي الأدوات أنسب؟","o":["اختبار تحصيل مقنن يُطبَّق مرتين في بداية الفصل الدراسي ونهايته","قياسات قصيرة متكررة مستمدة من المنهج (CBM) تُسجَّل على رسم بياني","مقياس تقدير يعبئه ولي الأمر عن أداء الطالب في الواجبات المنزلية","مقابلة مع الطالب حول مشاعره تجاه مادة الرياضيات"],"a":1,"w":"القياس المعتمد على المنهج (CBM) قياسات موجزة متكررة بإجراءات متسقة، وقيمته في سلسلة الدرجات التي تُظهر المستوى والاتجاه ومعدل التحسن نحو الهدف، مما يسمح بتعديل التدخل مبكرًا.","n":["لقطتان متباعدتان لا تكشفان الاتجاه الأسبوعي.","صحيح: سلسلة قياسات تكشف الاتجاه.","بيانات غير مباشرة لا تقيس المهارة نفسها.","تفيد في فهم الدافعية لا في رصد تقدم المهارة."],"c":"متابعة أسبوعية ورسم الاتجاه نحو الهدف","p":"إذا كان الهدف التقدم فابحث عن قياس متكرر لا عن لقطة واحدة."},{"id":"3-12","s":3,"i":"3.2","l":"تطبيق","t":"يريد معلم توثيق جودة تنظيم فقرات طلابه الكتابية على مستويات أداء موصوفة (ضعيف، مقبول، جيد، متميز) لكل معيار. أي الأدوات أنسب؟","o":["قائمة شطب ترصد وجود المهارة أو غيابها في كل فقرة من فقرات الطالب","اختبار تحصيل مقنن في التعبير الكتابي يُطبّق مرة واحدة","سلم تقدير وصفي (Rubric) يحدد مستويات الأداء بمعايير واضحة","تسجيل السوابق والسلوك والنتائج (ABC) في أثناء حصة الكتابة"],"a":2,"w":"سلم التقدير الوصفي يحدد مستويات أداء موصوفة بمعايير واضحة، فيناسب تقدير جودة أداء مركب كالكتابة بصورة أكثر اتساقًا. أما قائمة الشطب فترصد وجود المهارة أو غيابها فقط.","n":["تعطي نعم/لا ولا تصف مستويات الجودة.","لا يقدّر جودة فقرات الطلاب الصفية بمعايير المعلم.","صحيح: مستويات أداء موصوفة.","أداة لتحليل السلوك لا لتقدير جودة الكتابة."],"c":"مستويات أداء موصوفة لكل معيار","p":"قائمة الشطب = موجود/غير موجود، وسلم التقدير = درجة أو مستوى."},{"id":"3-13","s":3,"i":"3.2","l":"تطبيق","t":"قدّم الأخصائي لطالب مهمة قراءة كلمات جديدة، ثم علّمه استراتيجية تقطيع المقاطع مدة قصيرة، ثم أعاد المهمة ليلاحظ مقدار تحسنه. ما نوع التقييم المستخدم؟","o":["القياس المعتمد على المنهج، لأنه يقيس أداء الطالب مرتين متتاليتين","التقييم مرجعي المعيار، لأنه يقارن أداء الطالب قبل التعليم وبعده مباشرة","تحليل المهمة، لأن الأخصائي جزّأ مهارة القراءة إلى خطوات","التقييم الديناميكي القائم على: اختبر، ثم علّم، ثم أعد الاختبار"],"a":3,"w":"التقييم الديناميكي يركز على قابلية التعلم والاستجابة للمساعدة، وقرينته وجود تعليم قصير داخل عملية التقييم ثم ملاحظة مقدار التحسن. وهو مفيد لفهم أثر الخبرة السابقة، لكنه لا يغني عن بقية مصادر التقييم.","n":["CBM سلسلة قياسات متكررة لا تعليم داخلها.","مرجعي المعيار يقارن الطالب بالأقران.","تحليل المهمة تجزئة للمهارة، لا اختبار ثم تعليم ثم إعادة.","صحيح: يقيس الاستجابة للمساعدة."],"c":"تعليم قصير بين تطبيقين للمهمة","p":"اختبر ← علّم ← أعد الاختبار = تقييم ديناميكي."},{"id":"3-14","s":3,"i":"3.2","l":"تطبيق","t":"لاحظت المعلمة أن حسامًا يقرّب الكتاب من عينيه كثيرًا ويشكو صداعًا عند القراءة. ما التصرف المهني الأنسب في ضوء أدوار الجهات ذات العلاقة بالتشخيص؟","o":["تشخيص ضعف بصري لديه بناءً على ملاحظاتها المتكررة، ثم تكبير المواد له تلقائيًّا","رفع الأمر إلى لجنة القبول والتسكين لتشخيص حالته البصرية وتحديد درجتها","انتظار أن تلاحظ الأسرة المشكلة بنفسها لأن البصر شأن صحي لا تعليمي","توثيق ملاحظاتها وأثرها التعليمي، وإحالته وفق الإجراءات إلى جهة صحية لفحص البصر"],"a":3,"w":"التشخيص الطبي والحسي من اختصاص الجهات الصحية المختصة، ودور المعلمة توثيق ما تلاحظه وأثره في التعلم والإحالة وفق الإجراءات. ولجان القبول والتسكين تصدر قرارات القبول في البرامج بناءً على التقارير الشاملة، لا التشخيص الطبي.","n":["المعلمة لا تشخّص حالة بصرية.","اللجنة تصدر قرار القبول لا التشخيص الطبي.","يؤخر الإحالة رغم أثر الحالة في التعلم.","صحيح: المعلومة الطبية لصاحب الاختصاص."],"c":"مؤشرات بصرية تحتاج تشخيصًا صحيًّا","p":"الجهة وفق الاختصاص: طبي/حسي ← جهة صحية، والمعلم يوثق الأثر ويحيل."},{"id":"3-15","s":3,"i":"3.2","l":"معرفة","t":"في المملكة العربية السعودية، ما الجهة المخولة بإصدار قرار قبول الطالب في برامج التربية الخاصة وتحديد البرنامج المناسب بناءً على التقارير الشاملة؟","o":["المستشفيات والمراكز الطبية التخصصية","اللجان الفرعية للقبول والتسكين في إدارة التعليم","وحدة الخدمات الإرشادية والتربوية في المدرسة","معلم التربية الخاصة بالاتفاق مع ولي الأمر"],"a":1,"w":"اللجان الفرعية للقبول والتسكين في إدارة التعليم هي الجهة الرسمية المخولة بإصدار قرار القبول في برامج التربية الخاصة وتحديد نوع البرنامج، اعتمادًا على التقارير الشاملة من الجهات الطبية والفريق المدرسي والأسرة.","n":["تقدم التشخيص والتقرير الطبي لا قرار القبول.","صحيح: جهة قرار القبول والتسكين.","تسهم في التقييم ومتابعة الأداء ولا تصدر قرار القبول.","قرار القبول لا ينفرد به المعلم والأسرة."],"c":"قرار القبول وتحديد البرنامج","p":"القبول والتسكين للجنة، والتشخيص الطبي للجهة الصحية، والبيانات التربوية للفريق المدرسي."},{"id":"3-16","s":3,"i":"3.2","l":"تحليل","t":"طبّق معلم اختبار قراءة مقننًا على طالب، فأعاد صياغة بعض الفقرات بلغة أبسط وسمح له بوقت مفتوح خلافًا للتعليمات، ثم حوّل درجته إلى رتبة مئينية من جداول المعايير الأصلية. ما الحكم الأدق على هذه النتيجة؟","o":["المقارنة المعيارية لم تعد صالحة كما هي، لأن شروط التطبيق تغيرت عن شروط التقنين","النتيجة أدق من التطبيق المعتاد، لأن التبسيط أزال أثر صعوبة الطالب عن الدرجة النهائية","النتيجة صالحة، لأن الرتبة المئينية تُستخرج من الجداول نفسها في كل الأحوال","ثبات الاختبار ارتفع، لأن الطالب حصل على وقت كافٍ للإجابة عن الفقرات"],"a":0,"w":"المعايير الأصلية مبنية على تطبيق موحد بتعليمات وزمن محددين؛ وإعادة صياغة الفقرات وفتح الوقت يغيّران معنى الدرجة، فلا تبقى مقارنتها بالعينة المعيارية صالحة كما هي. والصحيح استخدام التكييفات المسموح بها أو أداة بديلة مناسبة.","n":["صحيح: تغيّر الشروط يغيّر معنى الدرجة.","التبسيط غيّر البناء المقاس نفسه.","الجداول تفترض شروط التقنين الأصلية.","تغيير الشروط لا يرفع الثبات، بل يُضعف المقارنة."],"c":"تعديل الفقرات والزمن ثم استخدام المعايير الأصلية","p":"عدّلت الاختبار المقنن جوهريًّا؟ إذن لا تستخدم معاييره الأصلية بلا تحفظ."},{"id":"3-17","s":3,"i":"3.2","l":"تحليل","t":"أظهر اختبار تحصيل مقنن أن أداء أحمد في الرياضيات عند الرتبة المئينية 8، وتريد المعلمة تحديد ما ستدرّسه له في الأسابيع القادمة. ما الخطوة الأنسب؟","o":["الاكتفاء بالرتبة المئينية لأنها تحدد مستوى الطالب بدقة كافية للتخطيط","استكمال الصورة بأداة أداء مباشر مرتبطة بالمنهج، مع تحليل أخطائه","إعادة تطبيق الاختبار المقنن نفسه للتأكد من النتيجة قبل البدء في التخطيط","اختيار أهداف الصف الأدنى مباشرة لأن أداءه منخفض جدًّا مقارنة بأقرانه"],"a":1,"w":"الاختبار المقنن يجيب عن موقع الطالب مقارنة بأقرانه، لكنه لا يحدد المهارات التي لم يتقنها ولا نوع أخطائه. ولتخطيط التدريس تحتاج المعلمة أداءً مباشرًا مرتبطًا بالمنهج وتحليلًا للأخطاء يكشف ما ستعلّمه.","n":["تحدد الموقع النسبي لا المهارات التي يحتاجها.","صحيح: الأداة وفق الغرض.","تكرار الأداة نفسها لا يجيب عن سؤال التدريس.","قرار عام لا يستند إلى تحليل مهاراته."],"c":"رتبة مئينية وسؤال: ماذا ندرّس؟","p":"التدريس غدًا يحتاج أداءً مباشرًا وتحليل أخطاء، لا درجة معيارية وحدها."},{"id":"3-18","s":3,"i":"3.3","l":"معرفة","t":"ما الذي يميز نموذج الفريق «بين التخصصات» (Interdisciplinary) عن النموذج «متعدد التخصصات» (Multidisciplinary)؟","o":["يقدّم كل مختص تقريره منفصلًا، ثم تُجمع التقارير دون مناقشة مشتركة بينهم","يقيّم كل عضو مجاله مع تنسيق وتفسير مشترك أكبر للنتائج بين الأعضاء","يتبادل الأعضاء الأدوار التخصصية كلها، فيطبق أي عضو أي أداة","ينفرد عضو رئيس بالتقييم والقرار، ويكتفي بقية الأعضاء بالاطلاع"],"a":1,"w":"في النموذج متعدد التخصصات يقيّم كل مختص مجاله ثم تُجمع النتائج، وقد يبقى التكامل محدودًا. أما النموذج بين التخصصات فيضيف تنسيقًا وتفسيرًا مشتركًا أكبر مع بقاء الأدوار التخصصية واضحة.","n":["هذا أقرب إلى وصف النموذج متعدد التخصصات.","صحيح: تكامل أقوى مع أدوار واضحة.","حتى النموذج عبر التخصصات لا يلغي حدود الكفاءة.","ليس نموذجًا للعمل الجماعي أصلًا."],"c":"تنسيق وتفسير مشترك أكبر","p":"متعدد = تقارير تُجمع، وبين = تفسير مشترك، وعبر = تبادل مدروس لبعض الأدوار."},{"id":"3-19","s":3,"i":"3.3","l":"معرفة","t":"أي مما يلي «لا» يقع ضمن اختصاص أخصائي العلاج الوظيفي في الفريق؟","o":["تحسين التوازن والمشي والانتقال الآمن بين مرافق المدرسة","تحسين الإمساك بالقلم واستخدام أدوات الكتابة والمقص","تنمية مهارات العناية الذاتية كارتداء الملابس وتناول الطعام باستقلال","تنظيم المدخلات الحسية عند الحاجة لدعم مشاركة الطالب في الصف"],"a":0,"w":"العلاج الوظيفي يركز على المهارات الحركية الدقيقة والاستقلالية والوظائف اليومية، كاستخدام أدوات الكتابة والمقص والعناية الذاتية وتنظيم المدخلات الحسية عند الحاجة. أما الحركة الكبرى والتوازن والمشي والتنقل فمن اختصاص العلاج الطبيعي.","n":["صحيح: هذا من اختصاص العلاج الطبيعي.","من صميم العلاج الوظيفي: المهارات الدقيقة.","من اختصاص العلاج الوظيفي: الوظائف اليومية والاستقلالية.","ورد ضمن أدوار العلاج الوظيفي عند الحاجة."],"c":"«لا» يقع ضمن العلاج الوظيفي","p":"العلاج الوظيفي = مهارات دقيقة ووظيفية، والعلاج الطبيعي = حركة كبرى وتوازن."},{"id":"3-20","s":3,"i":"3.3","l":"تطبيق","t":"يحتاج الفريق إلى فهم الظروف الأسرية والاجتماعية لطالبة كثيرة الغياب، وربط أسرتها بمصادر الدعم المناسبة. أي الأعضاء أقرب إلى هذا الدور؟","o":["الأخصائي الاجتماعي أو المرشد الطلابي بحسب التنظيم، بالتعاون مع الأسرة","أخصائي العلاج الوظيفي بالتنسيق مع معلم التربية الخاصة في المدرسة","الأخصائي النفسي بتطبيق مقياس ذكاء فردي على الطالبة وتفسير نتيجته","مدير المدرسة بإصدار قرار إداري بشأن غيابها المتكرر"],"a":0,"w":"دراسة الظروف الأسرية والاجتماعية والاقتصادية وربط الأسرة بمصادر الدعم من صميم دور الأخصائي الاجتماعي أو المرشد الطلابي بحسب التنظيم، بالتعاون مع الأسرة التي تقدم التاريخ والسياق.","n":["صحيح: الجانب الأسري والاجتماعي.","اختصاصه المهارات الدقيقة والوظيفية.","الأداة لا تجيب عن سؤال الظروف الأسرية.","الدور الإداري لا يغني عن دراسة الحالة الاجتماعية."],"c":"ظروف أسرية واجتماعية ومصادر دعم","p":"اربط نوع المعلومة بصاحب الاختصاص: أسري واجتماعي ← الأخصائي الاجتماعي أو المرشد."},{"id":"3-21","s":3,"i":"3.3","l":"تطبيق","t":"ترى معلمة صعوبات التعلم أن تعثر طالب في الكتابة يعود إلى صعوبة تعلم، بينما يرى أخصائي العلاج الوظيفي أنه يعود أساسًا إلى ضعف المهارات الحركية الدقيقة. ما الإجراء الأنسب للفريق؟","o":["اعتماد رأي معلمة الصعوبات لأنها الأكثر تعاملًا مع الطالب في المهام الأكاديمية","إحالة القرار إلى مدير المدرسة بوصفه قائد الفريق وصاحب الصلاحية","التصويت بين الأعضاء فورًا والأخذ برأي الأغلبية لتجنب تأخير الخطة","تحديد موضع الخلاف ومراجعة بيانات الطرفين، وجمع بيانات تفصل بين التفسيرين"],"a":3,"w":"الخلاف المهني لا يُحسم بالرتبة أو بالتصويت السريع، بل بالعودة إلى سؤال التقييم والبيانات: تحديد موضع الخلاف، وفحص جودة كل مصدر، وجمع بيانات إضافية (كمقارنة الأداء في مهام لا تتطلب كتابة يدوية) عندما يؤثر الخلاف في قرار مهم.","n":["الخبرة اليومية لا تحسم خلافًا تفسيريًّا دون بيانات.","السلطة الإدارية لا تستبدل الحكم التخصصي.","التصويت السريع لا يعالج موضع الخلاف.","صحيح: الخلاف يُحسم بالبيانات."],"c":"تفسيران مختلفان لسبب تعثر الكتابة","p":"الخلاف داخل الفريق يُحل بالبيانات والسؤال وحدود الاختصاص، لا بالسلطة."},{"id":"3-22","s":3,"i":"3.3","l":"تطبيق","t":"حضرت والدة طالب اجتماع الخطة التربوية الفردية، فعرض عليها الفريق الخطة مكتملة وطلب توقيعها. ما التصحيح المهني لهذا الإجراء؟","o":["الاكتفاء بشرح الخطة للأم بعد توقيعها، لأن إعدادها من اختصاص الفريق المدرسي وحده","تأجيل توقيع الأم حتى يوقّع الطبيب على الخطة بوصفه صاحب القرار النهائي","إرسال الخطة إلى المنزل لتوقيعها دون اجتماع، توفيرًا لوقت الأسرة","إشراك الأسرة في تقديم التاريخ والملاحظات المنزلية وفي تحديد الأولويات والقرارات"],"a":3,"w":"الأسرة شريك أساسي في الفريق: تقدم التاريخ النمائي والسلوك في البيئة الطبيعية ومعلومات لا تظهر في المدرسة، وتشارك في الأهداف والقرارات والمتابعة المنزلية. واختزال دورها في التوقيع من الأخطاء المهنية الشائعة.","n":["يختزل دور الأسرة في الاطلاع والتوقيع.","الطبيب لا يحدد الخطة التربوية منفردًا.","يزيد إقصاء الأسرة من المشاركة.","صحيح: شريك لا جهة توقيع."],"c":"عرض الخطة مكتملة وطلب التوقيع","p":"الأسرة مصدر بيانات وشريك في القرار، لا جهة توقيع."},{"id":"3-23","s":3,"i":"3.3","l":"تحليل","t":"قدّمت أسرة تقريرًا طبيًّا يفيد بإصابة ابنها باضطراب فرط الحركة وتشتت الانتباه، وأوصى الطبيب في التقرير بإلحاقه بفصل خاص منفصل. كيف يتعامل الفريق مع هذه التوصية؟","o":["ينفّذ التوصية مباشرة، لأن الطبيب صاحب الاختصاص في تحديد البرنامج التربوي للطالب","يعدّه مصدرًا مهمًّا، ويحدد الخدمات والبيئة الأقل تقييدًا وفق أثر الحالة التعليمي","يتجاهل التقرير، لأن التشخيص الطبي لا صلة له بالقرارات التربوية","يطلب من الأخصائي النفسي اتخاذ القرار منفردًا بدلًا من الطبيب"],"a":1,"w":"وجود تشخيص طبي لا يحدد تلقائيًّا البرنامج التعليمي؛ فالمختص الصحي يقدم التشخيص والمحاذير، والفريق يترجم أثر الحالة الوظيفي إلى احتياجات وخدمات، ويختار البيئة الأقل تقييدًا التي تتيح التعلم مع الأقران إلى أقصى درجة مناسبة مع توفير الدعم.","n":["الطبيب يشخّص، ولا يحدد البرنامج التربوي منفردًا.","صحيح: الطبي معلومة، والقرار التربوي للفريق.","التقرير الطبي مصدر مهم في الصورة الشاملة.","يستبدل انفرادًا بانفراد آخر."],"c":"توصية طبية بقرار تربوي","p":"الطبيب يقدم التشخيص الطبي، والفريق يقرر الخدمات والبيئة التعليمية."},{"id":"3-24","s":3,"i":"3.3","l":"تحليل","t":"اقترح أحد الأعضاء الاكتفاء بالأخصائي النفسي والطبيب في فريق تقييم طالب يُشتبه بأن لديه صعوبة تعلم، معللًا ذلك بأن «تحديد الحالة مسألة نفسية وطبية». ما الخلل الأساسي في هذا الاقتراح؟","o":["يقلل عدد أعضاء الفريق، والأصل أن يضم الفريق التخصصات كلها في كل حالة","يُغفل بيانات المعلمَين عن الأداء الأكاديمي وفرص التعلم والاستجابة للتدريس","يستبعد مدير المدرسة، وهو صاحب القرار النهائي في تحديد أهلية الطالب للخدمات","يستبعد أخصائي العلاج الطبيعي، وهو عضو لازم في كل فريق تقييم"],"a":1,"w":"في صعوبات التعلم لا يكفي أن نعرف القدرات أو الحالة الصحية؛ نحتاج بيانات عن الأداء الأكاديمي ونمط الأخطاء وجودة التعليم السابق والاستجابة للتدخل، وهذه يملكها معلم التربية الخاصة ومعلم التعليم العام. وغيابهما قد يجعل نقص فرصة التعلم يُفسَّر على أنه إعاقة.","n":["كثرة الأعضاء ليست هدفًا؛ المطلوب الخبرات ذات الصلة.","صحيح: البيانات التربوية جوهرية في صعوبات التعلم.","الإدارة تسهّل الإجراءات ولا تحدد الأهلية بسلطتها.","يُستدعى عند وجود حاجة حركية لا في كل حالة."],"c":"الاكتفاء بالنفسي والطبي في صعوبة تعلم","p":"عدد الأعضاء يحدده سؤال التقييم، والمعلمان أساسيان في أي صعوبة أكاديمية."},{"id":"3-25","s":3,"i":"3.3","l":"تطبيق","t":"في فريق يعمل بنموذج «عبر التخصصات»، دُرّبت معلمة صعوبات التعلم على تنفيذ تمارين بسيطة لتحسين إمساك القلم تحت إشراف أخصائي العلاج الوظيفي. ما الحد المهني الواجب مراعاته؟","o":["تصبح المعلمة مؤهلة لتطبيق أدوات التقييم الوظيفي وكتابة التقرير التخصصي بنفسها","تنفذ المعلمة التمارين المدرّبة عليها، ويبقى التقييم والقرار التخصصي للأخصائي","تستغني المدرسة عن خدمة العلاج الوظيفي ما دامت المعلمة تنفذ التمارين","تتوقف المعلمة عن التمارين، لأن أي تبادل للأدوار يخالف حدود الاختصاص"],"a":1,"w":"النموذج عبر التخصصات يسمح بتبادل مدروس لبعض الاستراتيجيات بتدريب وإشراف، لكنه لا يجعل العضو مؤهلًا لتطبيق أدوات أو تشخيصات تخصصية خارج نطاقه؛ فتبقى المهام التخصصية لأصحابها.","n":["التدريب على تمرين لا يمنح تأهيلًا تخصصيًّا.","صحيح: تبادل مدروس مع بقاء الحدود.","التبادل يدعم الخدمة ولا يلغيها.","التبادل المدروس بإشراف مقبول في هذا النموذج."],"c":"تدريب وإشراف في نموذج عبر التخصصات","p":"تبادل الاستراتيجيات لا يلغي متطلبات التأهيل."},{"id":"3-26","s":3,"i":"3.4","l":"معرفة","t":"ما المقصود بتثليث البيانات (Data Triangulation) في تقييم الطالب؟","o":["تطبيق الأداة نفسها ثلاث مرات متتالية واعتماد متوسط الدرجات الثلاث","فحص الاستنتاج عبر مصادر وطرائق مستقلة ومتنوعة، دون اشتراط ثلاث أدوات بعينها","استخدام ثلاثة اختبارات مقننة تحديدًا قبل اتخاذ أي قرار تربوي بشأن الطالب","جمع آراء ثلاثة معلمين عن الطالب واعتماد الرأي الذي يتفق عليه اثنان منهم"],"a":1,"w":"تثليث البيانات يعني فحص الاستنتاج عبر مصادر أو طرائق مستقلة ومتنوعة؛ فإذا اتفقت الملاحظة والاختبار وعينات العمل على نمط واحد ارتفعت الثقة في الاستنتاج. ولا يُشترط حرفيًّا استخدام ثلاث أدوات بعينها، كما أن تكرار الأداة نفسها لا يُعد تثليثًا.","n":["تكرار الأداة نفسها لا يضيف مصدرًا مستقلًا.","صحيح: تنوع المصادر والطرائق.","لا يُشترط عدد محدد من الأدوات ولا نوع واحد منها.","آراء من نوع واحد، وحسمها بالأغلبية لا يفحص الاستنتاج."],"c":"فحص الاستنتاج عبر مصادر مستقلة","p":"التثليث = تقاطع مصادر وطرائق مستقلة، لا «ثلاث أدوات» حرفيًّا."},{"id":"3-27","s":3,"i":"3.4","l":"معرفة","t":"أي مصادر البيانات الآتية يُعد مصدرًا غير مباشر؟","o":["مقياس تقدير لسلوك الطالب يعبئه معلم الصف عن الشهر الماضي","تسجيل المعلمة عدد مرات مغادرة الطالب مقعده في أثناء الحصة","قراءة الطالب نصًّا قراءة جهرية مدة دقيقة أمام المعلمة","تحليل أخطاء الطالب في ورقة عمل أنجزها بنفسه داخل الصف"],"a":0,"w":"المصادر غير المباشرة تجمع المعلومات عبر تقارير الآخرين أو السجلات أو المقابلات دون مشاهدة الأداء لحظة حدوثه، ومنها مقاييس التقدير التي يعبئها المعلم أو ولي الأمر. أما الملاحظة المنظمة والقراءة الجهرية وتحليل عينات العمل فمصادر مباشرة.","n":["صحيح: تقرير مخبر لا مشاهدة لحظية.","ملاحظة مباشرة للسلوك لحظة حدوثه.","أداء مباشر للمهارة.","تحليل لعينة من أداء الطالب نفسه."],"c":"يعبئه معلم الصف عن الشهر الماضي","p":"مباشر = أداء الطالب نفسه، وغير مباشر = تقرير مخبر أو سجل."},{"id":"3-28","s":3,"i":"3.4","l":"تطبيق","t":"حصل عادل على درجة منخفضة جدًّا في اختبار تحصيل مقنن للرياضيات، بينما تُظهر أعماله الصفية وقياسات المنهج الأسبوعية أداءً قريبًا من مستوى صفه. ما الإجراء الأنسب؟","o":["اعتماد نتيجة الاختبار المقنن، لأنه الأداة الأعلى صدقًا وثباتًا بين المصادر","اعتماد الأعمال الصفية وحذف نتيجة الاختبار لأنها تخالف بقية الأدلة","فحص ظروف تطبيق الاختبار وطبيعة مهامه ومقارنة المصادر قبل أي قرار تصنيفي","حساب متوسط الدرجتين واعتماده مستوى أداء حاليًّا في الخطة الفردية"],"a":2,"w":"تعارض المصادر لا يُحل بحذف أحدها أو بأخذ المتوسط، بل بالسؤال عما يفسر التباين: ظروف التطبيق، وطبيعة المهام، والدعم المتاح في الصف، وحداثة البيانات. ولا يُتخذ قرار عالي الأهمية قبل تفسير التعارض.","n":["لا توجد أداة تحسم وحدها، والتعارض يحتاج تفسيرًا.","حذف الدليل المخالف دون تفسير تحيز.","صحيح: يفسّر التعارض قبل القرار.","المتوسط يخفي التعارض ولا يفسره."],"c":"اختبار منخفض جدًّا وأداء صفي جيد","p":"عند تعارض الأدلة اسأل: ما الذي يفسر التباين؟ ولا تحذف المصدر المخالف."},{"id":"3-29","s":3,"i":"3.4","l":"تطبيق","t":"أي العبارات الآتية أصلح لوصف مستوى الأداء الحالي في القراءة ضمن الخطة التربوية الفردية؟","o":["يقرأ 48 كلمة صحيحة في الدقيقة في نص من مستوى صفه، وتتركز أخطاؤه في المقاطع المركبة","يعاني ضعفًا واضحًا في القراءة، ويحتاج إلى دعم مكثف ومستمر في جميع مهاراتها الأساسية","مستواه في القراءة أقل من زملائه، ولديه صعوبة تعلم موثقة في التقرير","قراءته بطيئة وغير مرضية، ويبدو أنه لا يبذل جهدًا كافيًا في المنزل"],"a":0,"w":"المستوى الحالي الجيد يصف ما يستطيع الطالب فعله وما يحتاجه ببيانات قابلة للقياس ونمط أخطاء محدد، فيصلح خط أساس لصياغة هدف قابل للقياس. أما العبارات العامة والأحكام الشخصية فلا تقود إلى هدف أو تدخل محدد.","n":["صحيح: بيانات قابلة للقياس ونمط واضح.","عبارة عامة لا تحدد المهارة ولا المستوى.","مقارنة عامة واسم تشخيص لا يحددان ما يستطيعه.","حكم شخصي وتفسير غير مدعوم."],"c":"عدد كلمات صحيحة ونمط أخطاء محدد","p":"اكتب المستوى الحالي بأرقام ونمط أداء، لا بصفات عامة أو أحكام."},{"id":"3-30","s":3,"i":"3.4","l":"تطبيق","t":"لم تتحسن طلاقة معاذ بعد ستة أسابيع من تدخل مخطط بثلاث جلسات أسبوعيًّا، وعند المراجعة تبيّن أن ما نُفذ أقل من نصف الجلسات. ما القرار الأنسب؟","o":["عدّ الطالب غير مستجيب للتدخل، والانتقال إلى مستوى دعم أشد مباشرة","إيقاف التدخل لأنه أثبت عدم فاعليته خلال المدة المحددة له","معالجة أسباب ضعف التنفيذ واستكمال الجرعة المخططة مع استمرار القياس","إحالة الطالب لتقييم صعوبات التعلم، لأن البيانات تُظهر ضعف استجابته بوضوح"],"a":2,"w":"قيمة بيانات الاستجابة تعتمد على تنفيذ التدخل بجودة وجرعة كافية. وما دام أقل من نصف الجلسات قد نُفذ، فلا يمكن تفسير عدم التحسن بأنه ضعف استجابة لدى الطالب؛ بل تُعالج أسباب ضعف التنفيذ وتُستكمل الجرعة مع استمرار القياس.","n":["لا يُحكم بعدم الاستجابة قبل تنفيذ التدخل كما خُطط.","التدخل لم يُختبر فعليًّا حتى يُحكم بعدم فاعليته.","صحيح: دقة التنفيذ تسبق الحكم على الاستجابة.","بيانات ضعيفة التنفيذ لا تصلح أساسًا للإحالة."],"c":"نُفذ أقل من نصف الجلسات","p":"لا تفسّر ضعف الاستجابة قبل التحقق من دقة تنفيذ التدخل."},{"id":"3-31","s":3,"i":"3.4","l":"تحليل","t":"بلغ خط الأساس لطلاقة جنى 30 كلمة صحيحة في الدقيقة، والهدف 60 كلمة بعد عشرين أسبوعًا. وبعد ثمانية أسابيع من تدخل نُفّذ بسلامة، كانت آخر أربعة قياسات: 33، 34، 33، 35. ما القرار الأنسب؟","o":["الاستمرار دون تغيير، لأن القياسات الأخيرة تُظهر ارتفاعًا واضحًا عن خط الأساس","خفض الهدف إلى 40 كلمة في الدقيقة ليتوافق مع معدل تقدمها الحالي","مراجعة شدة التدخل أو طريقته، لأن الاتجاه أدنى من خط الهدف باستمرار","إيقاف القياس الأسبوعي لأنه لم يُظهر تغيرًا كبيرًا في الأداء"],"a":2,"w":"لتحقيق الهدف يلزم نمو قرابة كلمة ونصف أسبوعيًّا، أي نحو 42 كلمة في الأسبوع الثامن، بينما بقيت القياسات الأخيرة بين 33 و35. ومع تنفيذ التدخل بسلامة، فإن بقاء الاتجاه أدنى من خط الهدف باستمرار يستدعي مراجعة شدة التدخل أو طريقته مع استمرار القياس.","n":["الارتفاع الطفيف عن خط الأساس لا يكفي للوصول إلى الهدف.","خفض الهدف بدل تحسين التدخل يخفض التوقعات.","صحيح: اتجاه أدنى من الهدف مع تنفيذ سليم.","إيقاف القياس يحرم الفريق من بيانات القرار."],"c":"قياسات متتالية أدنى من خط الهدف","p":"راقب الاتجاه لا اللقطة: إذا بقي الميل أدنى من الهدف مع تنفيذ جيد فعدّل التدخل."},{"id":"3-32","s":3,"i":"3.4","l":"تحليل","t":"اقتنع أحد أعضاء الفريق بأن الطالب لديه صعوبة تعلم، فأخذ يستشهد بالدرجات المنخفضة ويتجاهل ملاحظات تفيد بتحسن أدائه مع تغيير طريقة التدريس. ما الخلل في هذا التفسير؟","o":["ضعف الثبات بين المصححين، لأن الدرجات المنخفضة صادرة عن أكثر من معلم","الخطأ المعياري للقياس، لأن الدرجات المنخفضة تقع ضمن نطاق ثقة واسع","تحيز التأكيد: انتقاء الأدلة المؤيدة وإهمال المخالفة بدل تفسير التباين","ضعف صدق المحتوى، لأن الاختبارات لم تمثل المنهج الدراسي تمثيلًا كاملًا"],"a":2,"w":"تحيز التأكيد هو انتقاء النتائج المؤيدة لرأي مسبق وتجاهل الأدلة المخالفة. والممارسة الصحيحة فحص الدليل المخالف وتفسير التباين، خاصة أن تحسن الأداء مع تغيير طريقة التدريس معلومة مهمة قد تغيّر الاستنتاج.","n":["لا قرينة على اختلاف المصححين.","الخطأ المعياري لا يفسر إهمال الأدلة المخالفة.","صحيح: انتقاء الأدلة المؤيدة.","المشكلة في طريقة التفسير لا في تمثيل الاختبار للمحتوى."],"c":"يستشهد بالمؤيد ويتجاهل المخالف","p":"لا تنتقِ النتيجة التي تعجبك؛ افحص الدليل المخالف وفسّر التباين."},{"id":"3-33","s":3,"i":"3.4","l":"تطبيق","t":"قررت معلمة اعتماد محك إتقان 80٪ لجميع أهداف الخطط الفردية لطلابها مهما اختلفت المهارات. ما الملاحظة المهنية الأدق؟","o":["القرار صحيح، لأن نسبة 80٪ هي المحك العالمي المعتمد للإتقان في التربية الخاصة","الأفضل اعتماد 100٪ لجميع الأهداف، لأن الإتقان الجزئي لا يُعد إتقانًا","المحك يُحدد مسبقًا بحسب الهدف والمهارة والأداة، ولا يوجد محك واحد يصلح للجميع","المحك غير ضروري في الأهداف، ويكفي ذكر المهارة والإطار الزمني"],"a":2,"w":"محك الإتقان يُحدد مسبقًا بحسب طبيعة الهدف والمهارة والأداة؛ فبعض المهارات تتطلب دقة شبه كاملة، وأخرى تُقاس بمعدل أو تكرار. ولا يوجد محك عالمي ثابت مثل 80٪ يصلح لكل المهارات، كما أن الهدف القابل للقياس يحتاج محكًّا واضحًا.","n":["لا يوجد محك إتقان عالمي ثابت لكل المهارات.","استبدال رقم ثابت برقم ثابت آخر يكرر الخطأ.","صحيح: المحك يتبع طبيعة الهدف.","الهدف القابل للقياس يحتاج محك أداء واضحًا."],"c":"80٪ لجميع الأهداف مهما اختلفت المهارات","p":"المحك يُشتق من الهدف والمهارة، ولا يوجد محك واحد لكل الأهداف."},{"id":"3-34","s":3,"i":"3.4","l":"تطبيق","t":"حصل طالب على درجة تقع عند انحرافين معياريين دون المتوسط في اختبار تحصيل مقنن للقراءة. ما التفسير الأدق لهذه النتيجة؟","o":["دليل كافٍ على وجود صعوبة تعلم في القراءة، دون حاجة إلى مصادر بيانات أخرى","أداء طبيعي لا يستدعي أي متابعة، لأن انخفاضه عن متوسط المجموعة المعيارية بسيط","أداء منخفض جدًّا مقارنة بالمجموعة المعيارية، وقرينة مهمة لا تشخّص وحدها","دليل على وجود إعاقة عقلية، لأن هذا الحد هو المعتمد وحده لتشخيصها"],"a":2,"w":"الدرجة عند انحرافين معياريين دون المتوسط تدل على أداء منخفض جدًّا مقارنة بالمجموعة المعيارية، وهي قرينة مهمة. لكنها لا تشخّص إعاقة أو صعوبة بمفردها، بل تُدمج مع التحصيل المباشر وتاريخ التعليم والاستجابة للتدخل والعوامل البديلة.","n":["الدرجة الواحدة لا تشخّص.","انحرافان معياريان دون المتوسط انخفاض كبير لا بسيط.","صحيح: قرينة قوية لا تشخيص منفرد.","الإعاقة العقلية تتطلب قصورًا تكيفيًّا مع بداية نمائية."],"c":"درجة واحدة عند انحرافين معياريين دون المتوسط","p":"انحرافان معياريان دون المتوسط = انخفاض قوي، لا تشخيص تلقائي."},{"id":"3-35","s":3,"i":"3.5","l":"معرفة","t":"أي العبارات أدق في وصف مبدأ السرية في عمل معلم التربية الخاصة؟","o":["لا تُشارَك معلومات الطالب مع أي شخص في أي ظرف، حتى عند وجود خطر على سلامته","تُشارَك المعلومات مع المخولين بقدر حاجتهم المهنية ووفق الإجراءات، دون منع واجب الحماية","يحق لجميع منسوبي المدرسة الاطلاع على ملف الطالب لأنهم يعملون في الجهة نفسها","تقتصر السرية على نتائج الاختبارات المقننة وحدها، ولا تشمل الملاحظات والصور والرسائل الرقمية"],"a":1,"w":"السرية أصل مهني يقوم على قاعدة الحاجة المهنية: تُشارَك المعلومات مع من يحتاجها لأداء دور مشروع ووفق الإجراءات المعتمدة. وهي ليست مطلقة؛ فعند وجود التزام نظامي متعلق بالسلامة أو الحماية تُتبع القنوات المختصة.","n":["السرية ليست مطلقة أمام متطلبات السلامة والحماية.","صحيح: سرية مهنية لا مطلقة.","العمل في المدرسة لا يعني وجود حاجة مهنية للمعلومة.","السرية تشمل الملفات الورقية والرقمية والصور والمحادثات."],"c":"وصف مبدأ السرية بدقة","p":"السرية على أساس الحاجة المهنية، ولا تمنع واجب الحماية والإبلاغ النظامي."},{"id":"3-36","s":3,"i":"3.5","l":"معرفة","t":"ما المقصود بالممارسة المبنية على الدليل في التربية الخاصة؟","o":["اعتماد التدخل الأكثر انتشارًا بين المعلمين وفي وسائل التواصل الاجتماعي","الجمع بين أفضل الأدلة المتاحة وخبرة الممارس وخصائص الطالب، مع متابعة الأثر","تطبيق أي تدخل نجح سابقًا مع طالب آخر من الفئة نفسها دون تعديل أو متابعة","الالتزام بتدخل واحد ثابت للفئة كلها ما دام قد ورد في دراسة منشورة"],"a":1,"w":"الممارسة المبنية على الدليل لا تعني اتباع التدخل الأشهر، بل الجمع بين أفضل الأدلة المتاحة وخبرة الممارس وخصائص الطالب وأولوياته، مع متابعة أثر التدخل عليه. والانتشار أو التجربة الشخصية لا يكفيان لإثبات الفاعلية.","n":["الانتشار ليس دليلًا على الفاعلية.","صحيح: دليل وخبرة وخصائص الطالب ومتابعة.","نجاحه مع طالب آخر لا يغني عن مراعاة خصائص الطالب.","يتجاهل الفردية ومتابعة الأثر."],"c":"المقصود بالممارسة المبنية على الدليل","p":"الأشهر ليس الأصح؛ اختر ما يدعمه الدليل ويناسب الطالب، ثم تابع أثره."},{"id":"3-37","s":3,"i":"3.5","l":"تطبيق","t":"في مجموعة محادثة تضم معلمي المدرسة، طلب أحد المعلمين صورة من تقرير تقييم طالب «للاطلاع فقط»، وهو لا يدرّس الطالب ولا يشارك في خطته. ما التصرف الأنسب؟","o":["إرسال التقرير بعد حذف اسم الطالب، لأن ذلك يحفظ خصوصيته بدرجة كافية","إرسال التقرير في رسالة خاصة بدل المجموعة، لأن المعلم من منسوبي المدرسة","الاعتذار عن مشاركة التقرير لغياب الحاجة المهنية، وعدم تداول بياناته في المجموعة","إرسال ملخص شفهي لأبرز نتائج التقرير بدل الصورة، تجنبًا للتوثيق الرقمي لبيانات الطالب"],"a":2,"w":"معيار مشاركة معلومات الطالب هو الحاجة المهنية لا مجرد العمل في المدرسة، والمعلم الذي طلب التقرير لا يدرّس الطالب ولا يشارك في خطته. كما أن مجموعات المحادثة العامة ليست قناة آمنة لتداول بيانات الطلاب.","n":["حذف الاسم لا يلغي غياب الحاجة المهنية، والسياق قد يكشف الهوية.","تغيير القناة لا يبرر مشاركة بلا حاجة مهنية.","صحيح: لا حاجة مهنية = لا مشاركة.","الملخص الشفهي يظل إفصاحًا عن معلومات الطالب."],"c":"«للاطلاع فقط» ولا يدرّس الطالب","p":"اسأل: هل لديه حاجة مهنية للمعلومة؟ إن لم توجد فلا مشاركة."},{"id":"3-38","s":3,"i":"3.5","l":"تطبيق","t":"طلب مدير المدرسة من معلمة صعوبات التعلم تطبيق مقياس ذكاء فردي مقنن على طالب لتسريع إجراءات الإحالة، وهي غير مدربة عليه. ما التصرف الأنسب؟","o":["توضيح حدود تأهيلها، وتقديم بياناتها التعليمية، وطلب مختص مؤهل لتطبيق المقياس","تطبيق المقياس بالاستعانة بدليله، لأن قراءة التعليمات بعناية تكفي لتطبيقه بدقة","تطبيق المقياس ثم عرض النتيجة على الأخصائي النفسي ليعتمدها","رفض المشاركة في تقييم الطالب كليًّا، لأن الطلب خارج اختصاصها"],"a":0,"w":"حسن النية لا يعوّض نقص الكفاءة؛ فالأدوات النفسية المقيدة يطبقها ويفسرها مختص مؤهل. والتصرف المهني أن توضح المعلمة حدود تأهيلها، وتسهم بما يقع في اختصاصها من بيانات تعليمية، وتطلب المختص المناسب.","n":["صحيح: حدود الكفاءة والإحالة للمؤهل.","قراءة الدليل لا تمنح التأهيل لأداة مقيدة.","اعتماد غيرها للنتيجة لا يصحح تطبيقًا غير مؤهل.","الرفض الكلي يحرم الفريق من بياناتها التعليمية."],"c":"مقياس ذكاء فردي ومعلمة غير مدربة عليه","p":"الكفاءة قبل التنفيذ: ما يتجاوز تأهيلك تحيله أو تستشير فيه."},{"id":"3-39","s":3,"i":"3.5","l":"تطبيق","t":"لجأ معلم إلى عرض أسماء الطلاب «الأكثر إزعاجًا» على لوحة في الفصل، فانخفض سلوك أحدهم سريعًا. ما التقييم المهني لهذا الإجراء؟","o":["إجراء غير مقبول لأنه يمس الكرامة، والأولى تدخل يحفظها ويستند إلى وظيفة السلوك","إجراء مقبول ما دام قد خفض السلوك، لأن الفاعلية هي المعيار الأول لاختيار التدخل","إجراء مقبول إذا وافقت عليه أسرة الطالب، لأن موافقتها تجعله مشروعًا","إجراء مقبول مؤقتًا، على أن يُستبدل بغيره بعد انتهاء الفصل الدراسي"],"a":0,"w":"التشهير والإحراج العلني يمسّان كرامة الطالب ويخالفان مبدأ عدم الإضرار حتى لو خفّضا السلوك مؤقتًا. والتدخل الأخلاقي يعرّف السلوك إجرائيًّا، ويجمع بيانات عن وظيفته، ويعلّم سلوكًا بديلًا بأقل قدر ضروري من التقييد.","n":["صحيح: الكرامة وعدم الإضرار.","النتيجة الإيجابية لا تبرر وسيلة مهينة.","موافقة الأسرة لا تجعل الإجراء غير المهني صحيحًا.","التشهير مرفوض ولو لمدة قصيرة."],"c":"تشهير خفّض السلوك سريعًا","p":"الفاعلية لا تبرر الوسيلة المهينة؛ الكرامة ثابتة حتى في إدارة السلوك."},{"id":"3-40","s":3,"i":"3.5","l":"تطبيق","t":"اكتشفت معلمة بعد إرسال تقرير تقييم إلى أسرة طالب أنها أدخلت درجة طالب آخر في أحد جداوله. ما التصرف الأنسب؟","o":["استبدال النسخة في الملف بنسخة مصححة دون إشارة إلى الخطأ تجنبًا لإرباك الأسرة","تصحيح التقرير بإجراء موثق يحفظ أثر المراجعة، وإبلاغ المعنيين وفق الإجراءات","الإبقاء على التقرير كما هو، لأن خطأ درجة واحدة لا يؤثر في القرار العام","انتظار أن تلاحظ الأسرة الخطأ بنفسها ثم تصحيحه عند السؤال عنه"],"a":1,"w":"الأمانة المهنية تقتضي عدم إخفاء الخطأ أو تعديل السجل لإظهاره بصورة أفضل، بل تصحيحه بوضوح يحافظ على أثر المراجعة، وإبلاغ المعنيين وفق الإجراءات، ثم معالجة السبب لمنع التكرار.","n":["الاستبدال الصامت إخفاء للخطأ يضر بالأمانة.","صحيح: تصحيح شفاف موثق.","خطأ في البيانات قد يؤثر في قرارات لاحقة.","تأجيل التصحيح حتى السؤال يخالف الأمانة المهنية."],"c":"خطأ في تقرير سبق إرساله","p":"عند الخطأ: تصحيح موثق وشفاف، لا إخفاء ولا انتظار."},{"id":"3-41","s":3,"i":"3.5","l":"تحليل","t":"يرى بعض أعضاء الفريق نقل طالب ذي صعوبة تعلم إلى فصل خاص طوال اليوم لأن ذلك «أسهل في التنظيم»، بينما تُظهر البيانات تقدمه في الفصل العام مع دعم غرفة المصادر. ما الحكم المهني الأدق؟","o":["يبقى في البيئة الأقل تقييدًا التي يتقدم فيها، فالراحة الإدارية لا تبرر تقييد مشاركته","يُنقل إلى الفصل الخاص، لأن البيئة الأقل تقييدًا تعني ما يناسب تنظيم المدرسة وإمكاناتها","يُدمج دمجًا كاملًا دون أي دعم، لأن البيئة الأقل تقييدًا تعني الدمج المطلق","يُترك القرار لولي الأمر وحده، لأن اختيار البيئة شأن أسري خالص"],"a":0,"w":"البيئة الأقل تقييدًا تعني تعليم الطالب مع أقرانه إلى أقصى درجة مناسبة مع توفير الدعم، والقرار فردي يستند إلى البيانات. وما دامت البيانات تُظهر تقدمه في الفصل العام مع دعم غرفة المصادر، فنقله لأسباب تنظيمية يقدّم راحة الممارس على حق الطالب.","n":["صحيح: البيانات تدعم البيئة الحالية الأقل تقييدًا.","تفسير خاطئ للبيئة الأقل تقييدًا لمصلحة الراحة الإدارية.","البيئة الأقل تقييدًا لا تعني الدمج المطلق دون دعم.","القرار تشاركي يستند إلى البيانات والفريق والأسرة."],"c":"«أسهل في التنظيم» مع بيانات تقدم في الفصل العام","p":"حقوق الطالب قبل راحة الممارس، والبيئة الأقل تقييدًا قرار فردي مبني على البيانات."},{"id":"3-42","s":3,"i":"3.5","l":"تطبيق","t":"تريد معلمة استخدام تطبيق مجاني للذكاء الاصطناعي على هاتفها الشخصي لصياغة تقارير طلابها، وذلك بإدخال أسمائهم ونتائج تقييماتهم وتشخيصاتهم. ما الإجراء الأنسب مهنيًّا؟","o":["استخدام التطبيق ما دام يوفر الوقت ويحسّن صياغة التقارير المهنية للطلاب","إدخال البيانات بعد إبلاغ الطلاب شفهيًّا بذلك في أثناء الحصة","حذف المحادثات من التطبيق بعد كل استخدام، لأن ذلك يكفي لحماية البيانات تمامًا","عدم إدخال بياناتهم الحساسة قبل التحقق من اعتماد الأداة وسياسات الخصوصية والحاجة"],"a":3,"w":"البيانات الرقمية للطلاب تحتاج قنوات وأدوات معتمدة وآمنة. وقبل إدخال أي بيانات حساسة في منصة أو أداة رقمية يجب التحقق من اعتمادها وسياسات الخصوصية والحاجة التعليمية الفعلية، وتجنب تخزينها على جهاز شخصي غير معتمد.","n":["الراحة التقنية لا تبرر مشاركة بيانات حساسة.","الإبلاغ الشفهي لا يحقق متطلبات الموافقة والسياسة.","الحذف اللاحق لا يمنع خروج البيانات إلى جهة غير معتمدة.","صحيح: الخصوصية والأمن قبل الراحة."],"c":"تطبيق مجاني على هاتف شخصي وبيانات حساسة","p":"التقنية المريحة ليست مبررًا لمشاركة بيانات حساسة."},{"id":"3-43","s":3,"i":"3.5","l":"تحليل","t":"أوصى معلم أسرة طالب بالتسجيل في مركز علاجي خاص يملكه أحد أقاربه، دون عرض بدائل أو بيانات تبيّن حاجة الطالب إلى خدماته. ما المبدأ الأخلاقي الأكثر تعرضًا للخطر؟","o":["السرية، لأن المعلم تحدث مع الأسرة عن حالة ابنها خارج اجتماع الفريق","حدود الكفاءة، لأن التوصية بأي خدمة خارجية ليست من عمل المعلم مطلقًا","الحياد وتجنب تضارب المصالح في التوصيات المقدمة للأسرة","العدالة في التقييم، لأن المركز الخاص قد يطبق أدوات غير مقننة"],"a":2,"w":"توصية المعلم بمركز يملكه قريبه، دون بدائل أو بيانات تثبت الحاجة، تجعل المنفعة الشخصية تؤثر أو تبدو مؤثرة في قرار يخص الطالب؛ وهذا جوهر تضارب المصالح الذي يُضعف الحياد ولو لم يقصد الممارس ذلك.","n":["الحديث مع أسرة الطالب نفسه عن حالته ليس إفصاحًا لغير المعني.","التوصية ممكنة مهنيًّا إذا بُنيت على حاجة وحياد.","صحيح: منفعة شخصية تؤثر في التوصية.","لا معلومات عن أدوات المركز، والخلل في دافع التوصية."],"c":"مركز يملكه أحد أقاربه دون بيانات أو بدائل","p":"تجنب أي منفعة تؤثر في حيادك أو تبدو كذلك."},{"id":"4-01","s":4,"i":"4.1","l":"معرفة","t":"أي الأوصاف الآتية أدق للبرنامج التربوي الفردي في سياق خدمات التربية الخاصة؟","o":["نموذج إداري يُعبّأ مرة واحدة عند قبول الطالب في البرنامج ثم يُحفظ في ملفه","قائمة أهداف موحدة لكل فئة إعاقة يختار منها المعلم ما يناسب صف الطالب","تقرير تشخيصي يصف نوع الإعاقة وشدتها ويحدد أسبابها الطبية بدقة","خطة مكتوبة تترجم تقييم طالب بعينه إلى أهداف وخدمات تُنفذ وتُقاس"],"a":3,"w":"البرنامج التربوي الفردي خطة مكتوبة فردية تحوّل نتائج التقييم إلى مستوى أداء حالي وأهداف قابلة للقياس وخدمات وتكييفات ومسؤوليات تنفيذ وآليات رصد ومراجعة. وقوته في اتساق مكوناته لا في طول الوثيقة.","n":["البرنامج دورة قرار ومتابعة، لا نموذج يُملأ ويُحفظ.","الأهداف تُشتق من بيانات الطالب لا من قالب الفئة.","التشخيص مصدر معلومات، وليس هو البرنامج.","صحيح: أداة تحوّل التقييم إلى تعليم يُتابَع."],"c":"أدق وصف للبرنامج التربوي الفردي","p":"البرنامج نظام قرار وتعليم ومتابعة لطالب بعينه، لا نموذج يُملأ ويُحفظ."},{"id":"4-02","s":4,"i":"4.1","l":"تطبيق","t":"ورد في مستوى الأداء الحالي لفيصل: «مستواه في الرياضيات ضعيف جدًا ولا يركز». ما التعديل الأنسب لهذه العبارة؟","o":["استبدالها بوصف قابل للقياس لأدائه ونمط أخطائه ونقاط قوته","إضافة اسم التشخيص ودرجة شدته كما وردا في تقرير قبوله بالبرنامج","إضافة توصية بزيادة حصص غرفة المصادر له في هذا الفصل الدراسي","حذفها لأن مستوى الأداء يُكتب بعد الانتهاء من صياغة الأهداف"],"a":0,"w":"مستوى الأداء الحالي يصف نقاط القوة والاحتياجات ببيانات قابلة للملاحظة أو القياس بدل أوصاف انطباعية مثل «ضعيف جدًا»، ويوفر خط الأساس الذي يُقارن به التقدم لاحقًا. ومنه تُشتق الأولويات والأهداف.","n":["صحيح: يصنع خط أساس يُقاس منه التقدم.","اسم التشخيص لا يصف الأداء ولا يصلح خط أساس.","قفز إلى الخدمة قبل وصف الأداء بدقة.","مستوى الأداء يسبق الأهداف وتُشتق منه."],"c":"«ضعيف جدًا ولا يركز»","p":"مستوى الأداء الحالي بيانات قابلة للقياس لا انطباعات."},{"id":"4-03","s":4,"i":"4.1","l":"تحليل","t":"كُتب في برنامج جود هدف: «أن تقرأ نصًا من مستوى صفها قراءة جهرية بمعدل 60 كلمة صحيحة في الدقيقة في ثلاثة قياسات متتالية بنهاية الفصل الدراسي»، بينما يبيّن مستوى أدائها الحالي أن طلاقتها مناسبة وأن حاجتها الأساسية في فهم المقروء. ما الخلل الرئيس في هذا الهدف؟","o":["يخلو من محك أداء واضح يُحكم به على تحقق الهدف في نهايته","قابل للقياس لكنه لا يستهدف الحاجة ذات الأولوية لديها","لا يحدد إطارًا زمنيًا لتحقيقه خلال المدة المقررة للبرنامج","يستخدم فعلًا غير قابل للملاحظة يصعب قياسه داخل الصف الدراسي"],"a":1,"w":"الهدف الجيد لا يكفي أن يكون قابلًا للقياس؛ بل يجب أن يرتبط مباشرة بخط الأساس والحاجة ذات الأولوية. وكل هدف مهم ينبغي أن يُتتبع جذره إلى حاجة واضحة في مستوى الأداء الحالي، والحاجة هنا في الفهم لا في الطلاقة.","n":["المحك موجود: معدل محدد في قياسات متتالية.","صحيح: انقطعت الحلقة بين الحاجة والهدف.","الإطار الزمني محدد بنهاية الفصل الدراسي.","القراءة الجهرية أداء ظاهر يمكن قياسه."],"c":"طلاقتها مناسبة وحاجتها في الفهم","p":"إذا انقطع الترابط بين الحاجة والهدف ففي البرنامج خلل."},{"id":"4-04","s":4,"i":"4.1","l":"تطبيق","t":"أظهرت بيانات ريم الأسبوعية في هدف الطرح بالاستلاف ثباتًا ستة أسابيع، ثم تبيّن أن جلساتها أُلغيت مرارًا ولم تُقدَّم الممارسة الموجهة كما خُطط لها. ما الخطوة الأولى الأنسب؟","o":["خفض الهدف إلى مستوى أسهل يتناسب مع أدائها الحالي في الطرح","ضبط تنفيذ التدخل كما خُطط له ثم مواصلة جمع البيانات","تغيير الاستراتيجية فورًا لأن البيانات تثبت عدم فاعليتها معها","طلب إعادة تشخيص ريم للتحقق من فئة إعاقتها قبل أي قرار"],"a":1,"w":"قبل الحكم على ضعف استجابة الطالب يجب فحص دقة تنفيذ التدخل؛ فإذا لم يُقدَّم كما خُطط فإن البيانات لا تعكس أثره الحقيقي. لذلك يُضبط التنفيذ أولًا ثم تُفسَّر البيانات اللاحقة.","n":["لا يُحكم على الهدف بينما التدخل لم يُنفذ أصلًا.","صحيح: دقة التنفيذ تُفحص قبل الحكم على الطالبة.","البيانات لا تقيس الاستراتيجية ما دامت لم تُطبق بدقة.","ضعف التنفيذ لا يستدعي مراجعة التشخيص."],"c":"أُلغيت الجلسات ولم تُقدَّم الممارسة","p":"تقدم ضعيف؟ افحص دقة التنفيذ قبل تغيير التدخل أو الهدف."},{"id":"4-05","s":4,"i":"4.1","l":"معرفة","t":"ما الترتيب الصحيح لمراحل إعداد البرنامج التربوي الفردي وتنفيذه؟","o":["مكان الخدمة ← أهداف ← تقييم ← مستوى أداء ← خدمات ← تنفيذ ← رصد تقدم ← مراجعة سنوية","أهداف ← خدمات وتكييفات ← تقييم ← مستوى أداء ← أولويات ← تنفيذ ← رصد تقدم ← مراجعة","تشخيص ← خدمات وتكييفات ← أهداف ← تنفيذ ← تقييم ← مستوى أداء ← رصد تقدم","تقييم ← مستوى أداء ← أولويات ← أهداف ← خدمات وتكييفات ← تنفيذ ← رصد تقدم ← مراجعة"],"a":3,"w":"التسلسل المنطقي يبدأ بالتقييم الشامل الذي يحدد مستوى الأداء الحالي، ومنه تُرتَّب الأولويات وتُصاغ الأهداف، ثم تُحدد الخدمات والتكييفات ومكان تقديمها، فالتنفيذ ورصد التقدم والمراجعة. وأي ترتيب يقفز فوق حلقة أساسية يُخل بالبرنامج.","n":["يبدأ بالمكان قبل البيانات ويحصر المراجعة في السنوية.","يصوغ الأهداف قبل معرفة مستوى الأداء.","يقفز من التشخيص إلى الخدمات ويؤخر التقييم.","صحيح: كل حلقة تُبنى على ما قبلها."],"c":"الترتيب الصحيح لمراحل الإعداد والتنفيذ","p":"بيانات ثم حاجة ثم هدف ثم دعم ثم قياس ثم مراجعة."},{"id":"4-06","s":4,"i":"4.1","l":"تطبيق","t":"في منتصف الفصل الدراسي أتقن سلمان هدف القراءة قبل موعده بكثير، وظهرت لديه حاجة جديدة في الكتابة أكدتها عينات عمله. ما الإجراء الأنسب؟","o":["الانتظار حتى موعد المراجعة الدورية القادمة ثم مناقشة التغييرات المقترحة","الاستمرار في هدف القراءة نفسه لضمان رسوخ المهارة حتى نهاية العام","تحديث الأهداف ذات الصلة في البرنامج وفق البيانات والإجراءات المعتمدة","العمل على الكتابة شفهيًا دون توثيقها في البرنامج حتى تتضح الصورة"],"a":2,"w":"يمكن تعديل مكونات البرنامج عند ظهور بيانات تدل على تقدم أسرع من المتوقع أو تغير في الاحتياجات، مع الالتزام بالمراجعات الدورية المعتمدة. فالإتقان المبكر يستدعي رفع التحدي، والحاجة الجديدة المؤكدة تستدعي هدفًا موثقًا.","n":["المراجعة ليست حدثًا دوريًا فقط حين تستدعي البيانات التغيير.","يهدر الوقت ويتجاهل تقدمًا أسرع من المتوقع.","صحيح: المراجعة تتبع البيانات لا الموعد الدوري فقط.","الحاجة مؤكدة بالبيانات، والتعديل يُوثق وفق الإجراءات."],"c":"أتقن مبكرًا وظهرت حاجة جديدة مؤكدة","p":"لا تنتظر المراجعة الدورية إذا أظهرت البيانات حاجة واضحة إلى التعديل."},{"id":"4-07","s":4,"i":"4.1","l":"تطبيق","t":"في اجتماع فريق البرنامج قال أحد الأعضاء: «ما دام مبدأ البيئة الأقل تقييدًا معتمدًا، فيجب أن يقضي نواف يومه كله في الفصل العام دون خدمة في غرفة المصادر»، مع أن بياناته تُظهر حاجة إلى تعليم صريح مكثف في فك الترميز. ما الرد المهني الأدق؟","o":["الرأي صحيح، فالمبدأ يُلزم بالفصل العام لكل طالب مهما كانت حاجته","المبدأ قرار فردي يوازن الاندماج وفاعلية التعليم وفق حاجته","الأصح نقله إلى غرفة المصادر طوال اليوم لأن حاجته في القراءة شديدة","يُترك القرار لمعلم التربية الخاصة وحده لأنه الأعلم بحاجة الطالب"],"a":1,"w":"مبدأ البيئة الأقل تقييدًا يعني تجنب التقييد غير الضروري مع ضمان تعليم مناسب وفعال بالدعم اللازم، وهو قرار فردي. لذلك يُحدد مقدار الخدمة ومكانها وفق بيانات نواف واحتياجه، وتُستبعد البدائل المطلقة في الاتجاهين.","n":["تعميم مطلق يخالف فردية القرار.","صحيح: البيئة الأقل تقييدًا لا تعني الفصل العام دائمًا.","إطلاق في الاتجاه المعاكس يفرض تقييدًا غير ضروري.","قرار المكان والخدمة قرار فريق لا فرد."],"c":"«يجب أن يقضي يومه كله في الفصل العام»","p":"احذر الإطلاق؛ مكان الخدمة قرار فردي يوازن الاندماج والفاعلية."},{"id":"4-08","s":4,"i":"4.1","l":"تحليل","t":"بيانات تركي في هدف «حل مسائل الضرب في عدد من رقم واحد»: خط الأساس 30%، ثم 35% و40% و38% و45% خلال خمسة أسابيع من تدخل نُفذ بدقة، والهدف 85% بعد اثني عشر أسبوعًا من البدء. ما القرار الأنسب؟","o":["الطالب يتقدم فعلًا، فيُستمر بالتدخل نفسه دون أي تعديل حتى نهاية المدة","التدخل غير مجدٍ، فيُخفض الهدف إلى 50% ليتناسب مع مستوى أدائه الحالي","البيانات متذبذبة، فيُنتظر حتى نهاية المدة ويُقرر بناءً على القياس الأخير","الاتجاه صاعد لكن ميله لا يكفي لبلوغ الهدف، فتُعدّل شدة التدخل أو مكوناته"],"a":3,"w":"تحسّن تركي نحو ثلاث نقاط أسبوعيًا، بينما يحتاج إلى نحو ست نقاط أسبوعيًا ليبلغ 85% في الأسابيع السبعة المتبقية. فالاتجاه صاعد لكنه غير كافٍ، ومع دقة التنفيذ يكون القرار تعديل شدة التدخل أو مكوناته، لا الانتظار ولا خفض الهدف.","n":["التقدم موجود لكنه لا يكفي لبلوغ الهدف في موعده.","خفض الهدف قبل تعديل التدخل قفز غير مبرر.","النتيجة الواحدة لقطة؛ القرار يعتمد على سلسلة البيانات.","صحيح: القرار مبني على الاتجاه والميل لا على نقطة واحدة."],"c":"من 30% إلى 45% والهدف 85%","p":"قارن ميل البيانات بخط الهدف؛ ضعف الميل مع تنفيذ جيد يعني تعديل التدخل."},{"id":"4-09","s":4,"i":"4.1","l":"معرفة","t":"في أي الحالات الآتية يكون تحويل إجابة الطالب من الكتابة إلى الشفهية تكييفًا مناسبًا؟","o":["حين يقيس الاختبار معرفة محتوى العلوم لا مهارة الكتابة","حين يقيس الاختبار قدرة الطالب على كتابة فقرة منظمة ومترابطة","حين يقيس الاختبار إملاء الكلمات التي درسها الطالب في الوحدة","في جميع الاختبارات ما دام لديه صعوبة في الكتابة"],"a":0,"w":"التكييف يغيّر طريقة الوصول أو الاستجابة دون تغيير جوهر المعيار. وتحويل الإجابة إلى الشفهية تكييف صالح حين نقيس معرفة المحتوى، لكنه يغيّر البناء المقاس إذا كانت الكتابة نفسها هي المهارة المستهدفة.","n":["صحيح: يزيل الحاجز ويحافظ على البناء المقاس.","الكتابة هنا هي البناء المقاس، فالتحويل يغيّره.","الإملاء مهارة كتابية مقاسة؛ الإجابة الشفهية تلغيها.","صلاحية التكييف تعتمد على البناء المقاس لا على الصعوبة وحدها."],"c":"تحويل الإجابة إلى الشفهية تكييفًا مناسبًا","p":"صلاحية التكييف تتحدد بالبناء المراد قياسه."},{"id":"4-10","s":4,"i":"4.2","l":"معرفة","t":"تواجه هيا صعوبة واضحة في الإمساك بالقلم واستخدام المقص وتزرير معطفها. أي أعضاء الفريق أقرب إلى تقييم هذه الحاجة؟","o":["أخصائي العلاج الطبيعي","أخصائي النطق واللغة","أخصائي العلاج الوظيفي","المرشد الطلابي بالمدرسة"],"a":2,"w":"أخصائي العلاج الوظيفي يقيّم الأداء الوظيفي المدرسي والمهارات الحركية الدقيقة والعناية الذاتية، ويقترح أدوات واستراتيجيات لزيادة الاستقلالية. ولا يُختار المختص من اسم الإعاقة بل من الحاجز الوظيفي الذي تكشفه البيانات.","n":["يركز على الحركة الكبرى والتوازن والتنقل.","يركز على الكلام واللغة والتواصل.","صحيح: المهارات الدقيقة والعناية الذاتية من اختصاصه.","يساند الجوانب النفسية والاجتماعية والتوافقية."],"c":"الإمساك بالقلم والمقص والتزرير","p":"مهارات دقيقة وعناية ذاتية: علاج وظيفي؛ حركة كبرى وتنقل: علاج طبيعي."},{"id":"4-11","s":4,"i":"4.2","l":"تطبيق","t":"يريد الفريق معرفة ما إذا كان عبدالله يستخدم في حصص الدراسات الاجتماعية استراتيجية فهم المقروء التي تعلمها في غرفة المصادر. من العضو الأقدر على تقديم بيانات مباشرة عن ذلك؟","o":["قائد المدرسة بحكم مسؤوليته عن الجداول","معلم الدراسات الاجتماعية
