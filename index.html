صصات يزداد التخطيط المشترك والتواصل المستمر، وتكون التدخلات مترابطة ومتفقًا عليها، مع بقاء المسؤولية المهنية والتنفيذ لكل مختص. ويختلف عن متعدد التخصصات بعمق التكامل، وعن عابر التخصصات بغياب إطلاق الأدوار.","n":["خطأ: يتميز باستقلال نسبي وتبادل تقارير، لا بتخطيط مشترك عميق.","صحيح: تخطيط مشترك وأدوار مهنية مميزة.","خطأ: يتطلب إطلاق أدوار ينفّذ فيه عضو مهام تخصص آخر، وهذا غير موجود.","خطأ: يخص معلمَين يدرّسان معًا في فصل واحد، لا فريق مختصين."],"c":"يخطط أعضاؤه معًا مع احتفاظ كل مختص بالتنفيذ","p":"تخطيط مشترك + تنفيذ تخصصي = بين التخصصات؛ أضف نقل الأدوار يصبح عابرًا."},{"id":"8-09","s":8,"i":"8.2","l":"تطبيق","t":"انتهت ثلاثة اجتماعات متتالية لفريق الطالب عبدالله بتوصيات عامة مثل «متابعة الطالب ودعمه»، ولم يتغير شيء في الفصل. ما التعديل الأنسب على إدارة الاجتماعات؟","o":["ختم كل اجتماع بقرارات تحدد المهمة والمسؤول والموعد ومؤشر المتابعة","زيادة عدد الاجتماعات إلى اجتماع أسبوعي لضمان المتابعة المستمرة للطالب","إسناد متابعة الطالب كاملة إلى معلم صعوبات التعلم بوصفه المختص","توسيع عضوية الفريق بإضافة مختصين جدد لإثراء النقاش في الاجتماع"],"a":0,"w":"الاجتماع الفعال لا يقاس بطوله أو تكراره، بل بانتهائه إلى مهام محددة ومسؤولين ومواعيد ومؤشرات متابعة. والتوصيات العامة لا تتحول إلى ممارسة في الفصل ما لم تُترجم إلى قرارات قابلة للتنفيذ والقياس.","n":["صحيح: من يفعل ماذا ومتى وكيف نقيس.","خطأ: كثرة الاجتماعات لا تعالج غياب القرارات المحددة.","خطأ: يلغي المسؤولية المشتركة ولا يحدد إجراءات قابلة للتنفيذ.","خطأ: المشكلة في مخرجات الاجتماع لا في عدد أعضائه."],"c":"توصيات عامة ... ولم يتغير شيء","p":"كل اجتماع ناجح ينتهي بـ: ماذا؟ من؟ متى؟ وكيف نتابع؟"},{"id":"8-10","s":8,"i":"8.2","l":"تحليل","t":"يحتاج الطالب فيصل فقط إلى تبادل معلومات بين معلم الفصل ومعلم صعوبات التعلم حول تكييف بسيط في الواجبات، فاقترح أحد الأعضاء تشكيل فريق عابر للتخصصات بتدريب متقاطع. ما التقييم الأدق لهذا الاقتراح؟","o":["غير متناسب؛ فدرجة التكامل تُختار وفق تعقيد الحاجة، والتنسيق البسيط يكفي","مناسب؛ لأن النموذج العابر للتخصصات أعلى النماذج جودة وأكثرها تكاملًا في جميع الحالات","مناسب؛ لأنه يضمن أن يتقن كل عضو في الفريق مهام زملائه جميعها","غير مناسب؛ لأن الفريق العابر لا يُستخدم مع الطلاب ذوي صعوبات التعلم"],"a":0,"w":"لا يوجد نموذج فريق هو الأفضل دائمًا؛ فدرجة التكامل تُختار وفق تعقيد حاجة الطالب وطبيعة المهام. والحاجة البسيطة يكفيها تنسيق مهني واضح، أما النموذج العابر فيُلجأ إليه عندما تتطلب الحاجة نقل مهارات عبر التخصصات بتدريب وإشراف.","n":["صحيح: النموذج يتبع تعقيد الحاجة.","خطأ: الأفضل هو الأنسب للحاجة، لا الأكثر تعقيدًا.","خطأ: إطلاق الأدوار لا يعني إتقان الجميع كل المهام، ولا مبرر له هنا.","خطأ: تعميم غير صحيح؛ فالنموذج ممكن عند الحاجة إليه."],"c":"يحتاج فقط إلى تبادل معلومات ... تكييف بسيط","p":"الأسلوب الأفضل ليس الأكثر تعقيدًا، بل الأنسب لحاجة الطالب."},{"id":"8-11","s":8,"i":"8.2","l":"تطبيق","t":"أظهر الطالب مشعل تحسنًا في القراءة خلال الفصل الدراسي الأول، فاقترح مدير المدرسة إنهاء خدمته في غرفة المصادر لتخفيف الجدول. ما الإجراء الأنسب؟","o":["إنهاء الخدمة مباشرة؛ لأن التحسن الظاهر في القراءة يدل على انتفاء حاجته إليها","قرار جماعي يستند إلى ثبات أدائه واستقلاله في الفصل العام بمشاركة الأسرة","إبقاء الخدمة كما هي حتى نهاية العام الدراسي أيًّا كانت بياناته","ترك القرار لمعلم صعوبات التعلم وحده؛ لأنه يملك بيانات التدخل"],"a":1,"w":"قرار إنهاء الخدمة أو تقليصها قرار جماعي يُبنى على تحقق المعايير وثبات الأداء والاستقلالية الأكاديمية وقدرة الطالب على النجاح في البيئة الأقل دعمًا، لا على تحسن مؤقت أو راحة إدارية أو جدول زمني.","n":["خطأ: التحسن المؤقت وحده لا يكفي لقرار الخروج من الخدمة.","صحيح: قرار جماعي على الإتقان والاستقلالية.","خطأ: القرار يتبع البيانات لا الجدول الزمني.","خطأ: إنهاء الخدمة أو تقليصها قرار جماعي."],"c":"تحسنًا ... لتخفيف الجدول","p":"الخروج من الخدمة: بيانات + استقلالية + ثبات + قرار جماعي."},{"id":"8-12","s":8,"i":"8.2","l":"تطبيق","t":"في اجتماع البرنامج التربوي الفردي للطالبة ريم، تكتفي المدرسة بعرض الخطة المكتملة على وليّ الأمر وطلب توقيعه. أي تعديل يحقق الشراكة الأسرية الفعلية؟","o":["إرسال نسخة من الخطة إلى الأسرة قبل الاجتماع بوقت كافٍ لقراءتها","شرح بنود الخطة لوليّ الأمر بلغة مبسطة واضحة والإجابة عن أسئلته قبل طلب توقيعه","تزويد الأسرة بتقرير شهري منتظم عن تقدم ابنتها في أهداف الخطة","إشراك الأسرة في تحديد الأولويات وصنع القرار ومراجعة واقعية التطبيق في المنزل"],"a":3,"w":"وليّ الأمر شريك أساسي في الفريق، وليس مجرد موقّع على خطة جاهزة؛ فهو يقدم معرفة بالسياق والأولويات وقابلية التطبيق خارج المدرسة. وأعمق مستويات الشراكة المشاركة في تحديد الأولويات وصنع القرار، وما سواها وسائل تدعمها.","n":["خطأ: يحسّن الاطلاع، لكنه يُبقي الأسرة متلقية لقرار جاهز.","خطأ: شرح جيد، لكنه نقل معلومات لا مشاركة في صنع القرار.","خطأ: متابعة مفيدة، لكنها لا تجعل الأسرة شريكًا في بناء الخطة.","صحيح: مشاركة في القرار لا مجرد اطلاع."],"c":"تكتفي بعرض الخطة المكتملة وطلب توقيعه","p":"الأسرة شريك في القرار، لا متلقٍّ للمعلومة ولا موقّع شكلي."},{"id":"8-13","s":8,"i":"8.2","l":"تطبيق","t":"يرفض معلم الفصل تطبيق التكييفات المتفق عليها للطالب سلمان، ويقول إنها «تميّزه عن زملائه». ما الإجراء الأنسب أولًا؟","o":["رفع الأمر فورًا إلى مدير المدرسة لإلزام المعلم بتطبيق الخطة المعتمدة كما هي","الاستماع لمخاوفه ومحاورته بالبيانات والبحث معه عن صيغة تطبيق عملية","تطبيق التكييفات في غرفة المصادر فقط بديلًا عن الفصل العام","إلغاء التكييفات مؤقتًا تجنبًا للخلاف المهني مع معلم الفصل"],"a":1,"w":"معالجة المقاومة المهنية تبدأ بالاستماع والحوار والأدلة والحلول العملية؛ فقد تكون مخاوف المعلم قابلة للمعالجة بصيغة تطبيق أقل لفتًا للنظر. وإذا استمر التعطيل بعد ذلك تُتبع الإجراءات النظامية.","n":["خطأ: التصعيد يأتي بعد الحوار والحلول العملية، لا قبلها.","صحيح: ابدأ بالاستماع والحوار والأدلة.","خطأ: ينقل المشكلة من الفصل ويضعف التعميم والمسؤولية المشتركة.","خطأ: يضحّي بحاجة الطالب لتفادي الخلاف."],"c":"يرفض ... «تميّزه عن زملائه»","p":"المقاومة: استمع ← حاور بالبيانات ← حلول عملية ← ثم الإجراء النظامي."},{"id":"8-14","s":8,"i":"8.2","l":"تحليل","t":"يضم فريق الطالبة جود خمسة مختصين، لكن كلًّا منهم يعمل وفق خطته الخاصة ولا يعرف ما يقدمه الآخرون، فتتلقى جود تعليمات متعارضة. ما التشخيص الأدق لوضع هذا الفريق؟","o":["فريق متعدد التخصصات يعمل بالصورة المطلوبة لهذا النموذج","فريق عابر للتخصصات يحتاج فقط إلى تقليل عدد أعضائه","تخصصات متجاورة يغيب عنها التنسيق حول هدف مشترك","فريق متكامل تحتاج الطالبة فقط إلى وقت للتكيف مع تعليماته"],"a":2,"w":"وجود عدة تخصصات لا يعني تلقائيًّا وجود عمل جماعي؛ فالعمل الجماعي يقوم على هدف مشترك وتنسيق يمنع الازدواجية والتعارض. وتعارض التعليمات التي تتلقاها الطالبة علامة على «جزر تخصصية» لا على فريق فعّال.","n":["خطأ: حتى متعدد التخصصات يدمج النتائج ويتخذ قرارًا مشتركًا، والتعارض دليل خلل.","خطأ: لا يوجد إطلاق أدوار، وعدد الأعضاء ليس أصل المشكلة.","صحيح: وجود التخصصات لا يساوي العمل الجماعي.","خطأ: يحمّل الطالبة نتيجة غياب التنسيق بين الكبار."],"c":"يعمل وفق خطته الخاصة ... تعليمات متعارضة","p":"كثرة الأسماء في الفريق لا تصنع فريقًا؛ الهدف المشترك والتنسيق يصنعانه."},{"id":"8-15","s":8,"i":"8.3","l":"تطبيق","t":"يريد معلم الرياضيات ومعلم صعوبات التعلم معرفة أنواع الأخطاء التي يقع فيها الطلاب في الطرح مع إعادة التجميع أثناء الحصة، دون أن يتدخل أحد في أداء الطلاب. أي نماذج التدريس التشاركي أنسب؟","o":["معلم يدرّس والآخر يتنقل لتقديم المساعدة الفورية للمتعثرين","تدريس بديل يسحب فيه أحدهما المتعثرين إلى مجموعة صغيرة","تدريس كفريق يتبادل فيه المعلمان شرح الأمثلة أمام الصف","معلم يدرّس والآخر يلاحظ وفق أداة تسجيل متفق عليها مسبقًا"],"a":3,"w":"عندما يكون الهدف جمع بيانات دقيقة عن استجابات الطلاب مع استمرار الدرس، فالنموذج الأنسب «معلم يدرّس وآخر يلاحظ» بأداة متفق عليها مسبقًا. أما تقديم المساعدة فقد يغيّر السلوك المراد قياسه.","n":["خطأ: المساعدة تغيّر الأداء الذي يُراد رصده.","خطأ: يغيّر ظروف الأداء ولا يخدم جمع البيانات عن الصف.","خطأ: كلاهما منشغل بالشرح، فلا أحد يجمع البيانات.","صحيح: جمع بيانات منظم أثناء الدرس."],"c":"معرفة أنواع الأخطاء ... دون أن يتدخل أحد","p":"جمع بيانات أثناء الدرس = واحد يدرّس وواحد يلاحظ بأداة محددة."},{"id":"8-16","s":8,"i":"8.3","l":"تطبيق","t":"درس علوم عن دورة الماء يتضمن تجربة قصيرة، وقراءة نص مصوّر، ونشاط ترتيب بطاقات المراحل، ويمكن تنفيذ الأنشطة الثلاثة بأي ترتيب. أي نماذج التدريس التشاركي يستثمر هذا البناء مباشرة؟","o":["التدريس الموازي","التدريس البديل","التدريس بالمحطات","معلم يدرّس والآخر يساعد"],"a":2,"w":"التدريس بالمحطات يناسب الدروس التي تنقسم إلى أنشطة متعددة مستقلة تتناوب عليها المجموعات، فيقود كل معلم محطة، وقد تعمل محطة باستقلال. والقرينة الحاسمة هنا «أنشطة متعددة يمكن تنفيذها بأي ترتيب».","n":["خطأ: يقدم المحتوى نفسه لمجموعتين، ولا يستثمر تعدد الأنشطة المستقلة.","خطأ: يخدم مجموعة صغيرة تحتاج دعمًا مؤقتًا، ولا قرينة على ذلك.","صحيح: أنشطة مستقلة تدور بينها المجموعات.","خطأ: يُبقي الصف كله في نشاط واحد يقوده معلم."],"c":"ثلاثة أنشطة يمكن تنفيذها بأي ترتيب","p":"أنشطة متعددة مستقلة يتناوب عليها الطلاب = محطات."},{"id":"8-17","s":8,"i":"8.3","l":"معرفة","t":"أي العبارات الآتية تصف التدريس البديل (Alternative Teaching) وصفًا صحيحًا؟","o":["يُقسم الصف إلى مجموعتين متقاربتين، ويدرّس كل معلم إحداهما المحتوى نفسه","يعمل معلم التربية الخاصة طوال العام مع الطلاب ذوي الصعوبات في ركن ثابت من الصف","يعمل أحد المعلمين مؤقتًا مع مجموعة صغيرة لغرض محدد، ويواصل الآخر مع بقية الصف","ينتقل الطلاب بين مراكز تعلم متعددة، ويشرف كل معلم على مركز منها"],"a":2,"w":"في التدريس البديل يتولى أحد المعلمين مجموعة صغيرة لفترة محدودة لإعادة التعليم أو التهيئة أو الإثراء، بينما يستمر الآخر مع المجموعة الكبرى. ويُشترط أن تكون المجموعة مرنة ومؤقتة حتى لا تتحول إلى عزل ثابت.","n":["خطأ: هذا وصف التدريس الموازي.","خطأ: هذا تجميع ثابت يسبب الوصم، والتدريس البديل مؤقت ومرن.","صحيح: مجموعة صغيرة مؤقتة لغرض محدد.","خطأ: هذا وصف التدريس بالمحطات."],"c":"التدريس البديل (Alternative Teaching)","p":"البديل: كبيرة + صغيرة مؤقتة؛ الموازي: مجموعتان والمحتوى نفسه."},{"id":"8-18","s":8,"i":"8.3","l":"تحليل","t":"لاحظت المشرفة التربوية أن المجموعة الصغيرة في التدريس البديل تضم الطلاب ذوي صعوبات التعلم أنفسهم مع معلم التربية الخاصة في كل حصة منذ بداية الفصل. ما الخلل الأهم في هذا التخطيط؟","o":["صغر حجم المجموعة الصغيرة بما يقلل فرص التفاعل والنقاش بين الطلاب فيها","تحوّل الدعم المؤقت إلى تجميع ثابت مرتبط بالتشخيص يسبب الوصم","تكرار التدريس البديل بدل التنويع بالتدريس الموازي","قصر الوقت المخصص للمجموعة الصغيرة داخل الحصة الواحدة"],"a":1,"w":"التدريس البديل دعم مرن مؤقت تحدده الحاجة الحالية والبيانات لا التشخيص. وعندما تضم المجموعة الصغيرة الطلاب أنفسهم دائمًا مع معلم التربية الخاصة، يتحول النموذج إلى عزل داخل الفصل ويضعف المسؤولية المشتركة.","n":["خطأ: صغر المجموعة مقصود في هذا النموذج.","صحيح: المرونة شرط التدريس البديل.","خطأ: الخلل الجوهري ليس في اسم النموذج بل في ثبات المجموعة وأعضائها.","خطأ: لا قرينة على الوقت؛ القرينة في ثبات الطلاب أنفسهم."],"c":"الطلاب أنفسهم ... في كل حصة","p":"المجموعة الصغيرة لا تساوي مجموعة ذوي الصعوبات؛ اجعلها مرنة بحسب الهدف والبيانات."},{"id":"8-19","s":8,"i":"8.3","l":"تحليل","t":"اتفق معلمان في بداية الأسبوع على استخدام التدريس بالمحطات في جميع حصصه «لأنه الأكثر تنويعًا»، ثم بدآ بعد ذلك تحديد أهداف الدروس. ما الخلل في هذا التخطيط؟","o":["اختيار النموذج سبق تحديد هدف الدرس وبيانات الطلاب اللذين يجب أن يحددانه","المحطات لا تناسب الطلاب ذوي صعوبات التعلم في أي درس","كان الأولى اختيار التدريس كفريق لأنه أعلى النماذج شراكة","عدم تقسيم زمن كل حصة بالتساوي بين المعلمَين"],"a":0,"w":"الخطة التشاركية تبدأ بهدف الدرس وبيانات الطلاب واحتياجاتهم، ثم يُختار النموذج والأدوار والتكييفات والتقويم. واختيار نموذج ثابت «للتنويع» قبل تحديد الأهداف يجعل الشكل يقود التعلم بدل العكس.","n":["صحيح: الهدف والبيانات أولًا ثم النموذج.","خطأ: تعميم غير صحيح؛ المحطات مناسبة متى خدمت الهدف.","خطأ: لا يوجد نموذج أفضل دائمًا؛ النماذج أدوات لا مراتب جودة.","خطأ: المساواة الشكلية في الوقت ليست معيار الشراكة."],"c":"اتفقا على المحطات ... ثم بدآ تحديد الأهداف","p":"لا تبدأ بالنموذج؛ ابدأ بالهدف والبيانات ثم اختر النموذج الذي يخدمهما."},{"id":"8-20","s":8,"i":"8.3","l":"تطبيق","t":"في اختبار قصير لمادة العلوم ضمن الفصل التشاركي، يحتاج الطالب فيصل إلى من يقرأ له الأسئلة، والقراءة ليست المهارة المقيسة. كيف يُتعامل مع ذلك في الخطة المشتركة؟","o":["تقليل عدد أسئلة الاختبار القصير بما يناسب مستواه القرائي الحالي","نقل اختباره إلى غرفة المصادر ليتولاه معلم التربية الخاصة وحده","إعفاؤه من الاختبار القصير والاكتفاء بملاحظة مشاركته الشفهية في أثناء الحصة","إدراج قراءة الأسئلة تكييفًا في الخطة؛ لأنه يزيل عائق الوصول ويُبقي الهدف"],"a":3,"w":"التكييف يغيّر طريقة الوصول أو الاستجابة دون تغيير جوهر الهدف، ولذلك تُعد قراءة الأسئلة مناسبة حين لا تكون القراءة هي المهارة المقيسة. ويُدرج التكييف في الخطة المشتركة ليطبقه المعلمان باتساق.","n":["خطأ: يغيّر المطلوب ولا يعالج عائق القراءة نفسه.","خطأ: ينقل المسؤولية بدل تخطيطها تشاركيًّا داخل الفصل.","خطأ: الإعفاء يحرمه من فرصة إظهار تعلمه في الهدف.","صحيح: تكييف يحافظ على جوهر الهدف."],"c":"القراءة ليست المهارة المقيسة","p":"أزل العائق غير المقصود، واحفظ المهارة المقيسة كما هي."},{"id":"8-21","s":8,"i":"8.3","l":"تحليل","t":"أظهرت بطاقات الخروج في درس تشاركي أن 14 طالبًا من أصل 26 لم يفهموا مفهوم الكسور المتكافئة. ما القرار التشاركي الأنسب؟","o":["تحويل الطلاب الأربعة عشر إلى معلم التربية الخاصة في مجموعة دائمة","الانتقال إلى الدرس التالي ومتابعة هؤلاء الطلاب في الواجبات المنزلية","إحالة الطلاب الذين لم يفهموا المفهوم إلى تقييم صعوبات التعلم","مراجعة التدريس وإعادة تعليم المفهوم للصف بطريقة مختلفة أولًا"],"a":3,"w":"عندما يتعثر أكثر من نصف الصف، فالتفسير الأقرب يرتبط بالتدريس العام لا بحاجات فردية، فيراجع المعلمان طريقة الشرح ويعيدان التعليم بأسلوب مختلف. وبعد ذلك يُقدَّم دعم مستهدف لمن تبقى لديه حاجة.","n":["خطأ: يحوّل مشكلة واسعة إلى تجميع ثابت ويحمّلها للطلاب.","خطأ: يتجاهل بيانات تقويم تكويني تستدعي تعديلًا فوريًّا.","خطأ: تعثر أكثر من نصف الصف يشير أولًا إلى التدريس لا إلى الطلاب.","صحيح: الصعوبة واسعة فراجِع التدريس العام."],"c":"14 طالبًا من أصل 26 لم يفهموا","p":"إذا تعثر عدد كبير، راجع التدريس قبل أن تبحث في الطلاب."},{"id":"8-22","s":8,"i":"8.4","l":"تطبيق","t":"طلب وليّ أمر من معلمة صعوبات التعلم أن تشرح له دلالة الدرجات الفرعية في تقرير مقياس ذكاء مقنن طُبّق على ابنته. ما التصرف الأنسب؟","o":["التنسيق مع الأخصائي النفسي لشرح الدلالات، مع ربطها هي بالأداء التربوي","شرح الدرجات الفرعية بنفسها؛ لأنها عضو أساسي في فريق البرنامج التربوي الفردي للطالبة","الاعتذار عن الإجابة وإحالة وليّ الأمر إلى مدير المدرسة مباشرة","طمأنة وليّ الأمر بأن الدرجات طبيعية ولا تدعو إلى أي قلق"],"a":0,"w":"تفسير أداة تخصصية كمقياس الذكاء المقنن يقوده المؤهل لها، أي الأخصائي النفسي، بينما تسهم معلمة صعوبات التعلم بربط النتيجة بالأداء التربوي ضمن حدود دورها. وحدود الاختصاص لا تمنع التعاون، بل تنظمه.","n":["صحيح: التفسير لصاحب الاختصاص والربط التربوي للمعلمة.","خطأ: عضوية الفريق لا تمنح صلاحية تفسير أداة خارج الاختصاص.","خطأ: يهمل حاجة الأسرة، والمختص هو الأخصائي لا الإدارة.","خطأ: حكم لا يستند إلى اختصاص ولا إلى تفسير مهني."],"c":"دلالة الدرجات الفرعية ... مقياس ذكاء مقنن","p":"تفسير أداة تخصصية = صاحب الاختصاص؛ والقرار التربوي الشامل = الفريق."},{"id":"8-23","s":8,"i":"8.4","l":"معرفة","t":"ما الدور الأدق لمنسق فريق البرنامج التربوي الفردي؟","o":["اتخاذ القرار النهائي في الخلافات المهنية بوصفه رئيس الفريق","تنظيم الأجندة والوقت والمشاركة والتوثيق والمتابعة دون احتكار القرار","تفسير نتائج تقييمات الأعضاء جميعها نيابة عنهم أمام الأسرة","تنفيذ أهداف الخطة داخل الفصول بدلًا من المعلمين المعنيين"],"a":1,"w":"منسق الفريق ميسّر للعملية: يحدد الأجندة ويدير الوقت ويضمن مشاركة متوازنة ويوثق القرارات ويتابعها، لكنه لا يكتسب سلطة تخصصية فوق الأعضاء. ويبقى القرار التربوي الشامل جماعيًّا مبنيًّا على البيانات.","n":["خطأ: المنسق ييسر ولا يفرض رأيه، والخلاف يحسمه الدليل.","صحيح: ميسّر للعملية لا مالك للقرار.","خطأ: كل مختص يفسّر ما يقع ضمن تخصصه.","خطأ: التنفيذ اليومي مسؤولية من يعمل في السياق."],"c":"الدور الأدق لمنسق الفريق","p":"المنسق ينظّم وييسّر ويتابع، ولا يحتكر القرار."},{"id":"8-24","s":8,"i":"8.4","l":"تطبيق","t":"اقترح معلم صعوبات التعلم استراتيجية التلميحات البصرية لتنظيم الطالبة جود في حصص الاجتماعيات، ووافق الفريق عليها. من المسؤول عن تطبيقها اليومي في الحصة؟","o":["معلم صعوبات التعلم بحضوره حصص الاجتماعيات يوميًّا لتطبيقها بنفسه","منسق الفريق؛ لأنه المسؤول عن متابعة تنفيذ جميع قرارات الفريق في الفصول","معلمة الاجتماعيات في سياقها الصفي، مع دعم المستشار ومتابعة الفريق","الأسرة عبر مراجعة التلميحات مع ابنتها في الواجبات المنزلية"],"a":2,"w":"بعد الاتفاق على الاستراتيجية، يتولى تطبيقها اليومي المعلم الذي يعمل في السياق الطبيعي، فهو الأقدر على التطبيق المستمر، بينما يقدم المستشار الدعم والتدريب، ويتابع الفريق الأثر. فالمستشار لا يحل محل المستشير في التنفيذ اليومي.","n":["خطأ: المستشار يدعم ويمكّن، ولا يحل محل المستشير.","خطأ: المتابعة غير التنفيذ اليومي داخل الحصة.","صحيح: المنفذ هو من يعمل في السياق اليومي.","خطأ: دور الأسرة داعم للتعميم، والسؤال عن التطبيق في الحصة."],"c":"تطبيقها اليومي في الحصة","p":"المستشار يمكّن، والمستشير ينفّذ في سياقه، والفريق يتابع."},{"id":"8-25","s":8,"i":"8.4","l":"تحليل","t":"تبادل أعضاء فريق الطالب سلمان تقرير تقييمه الكامل في مجموعة محادثة تضم معلمين لا يدرّسونه، بحجة «إطلاع الجميع على حالته». ما الخلل الأدق في هذا التصرف؟","o":["إرسال التقرير قبل أن يعتمده الأخصائي النفسي اعتمادًا رسميًّا","إخلال بالسرية؛ فالمعلومات تُتاح بقدر الحاجة المهنية لمن لهم دور مشروع","قيام عضو آخر غير منسق الفريق بإرسال التقرير إلى مجموعة المحادثة دون الرجوع إليه","لا خلل ما دام الهدف إطلاع المعلمين على حالة الطالب"],"a":1,"w":"حماية سرية المعلومات التزام مهني مشترك على كل عضو، فتُتداول بيانات الطالب بقدر الحاجة المهنية ولمن له دور مشروع في خدمته. وتداول التقرير الكامل مع غير المعنيين يعرّض الطالب للوصم ويخالف أخلاقيات العمل الجماعي.","n":["خطأ: لا قرينة على عدم الاعتماد؛ والمشكلة في دائرة الاطلاع.","صحيح: السرية بحسب الحاجة المهنية.","خطأ: السرية التزام كل عضو، والخلل فيمن اطلع لا فيمن أرسل.","خطأ: حسن النية لا يبرر كشف معلومات حساسة لغير المعنيين."],"c":"معلمين لا يدرّسونه","p":"اسأل: هل يحتاج هذا الشخص المعلومة لأداء دور مشروع مع الطالب؟"},{"id":"8-26","s":8,"i":"8.4","l":"تطبيق","t":"في اجتماع خطة الطالب مشعل بالصف الثالث المتوسط، طلب أن يكون هدفه الأول تنظيم واجباته ومواعيد تسليمها، بينما اقترح الفريق هدفًا في طلاقة القراءة. ما التصرف الأنسب؟","o":["مناقشة الأولويات معه وربط رأيه بالبيانات للوصول إلى قرار مشترك","تسجيل رأيه في المحضر والإبقاء على هدف الفريق دون نقاش","اعتماد هدفه مباشرة احترامًا لحقه في تقرير مصيره","تأجيل الأخذ برأيه حتى ينتقل إلى المرحلة الثانوية"],"a":0,"w":"يُشرك الطالب في فريقه عندما تسمح مرحلته وطبيعة القرار، فيعبّر عن أهدافه وتفضيلاته ويُناقَش في الخيارات، ثم يُربط صوته ببيانات أدائه. وهذا أعمق من مجرد سماع رأيه، وأدق من اعتماده دون فحص.","n":["صحيح: صوت الطالب شريك يُربط بالبيانات.","خطأ: الاستماع الشكلي لا يحقق مشاركة الطالب في القرار.","خطأ: صوت الطالب مهم، لكنه يُدمج مع البيانات ولا يحل محلها.","خطأ: مرحلته تسمح بمشاركته، والتأجيل يهمّش صوته."],"c":"طلب أن يكون هدفه الأول ... بينما اقترح الفريق","p":"صوت الطالب يزداد وزنه مع العمر، ويُدمج مع البيانات في قرار مشترك."},{"id":"8-27","s":8,"i":"8.4","l":"تحليل","t":"اتفق الفريق على أن «إعداد خطة تعميم مهارات الطالبة ريم» مسؤولية مشتركة بين جميع الأعضاء، ومضى شهر دون أن يبدأها أحد. ما التفسير الأدق لتعثر المهمة؟","o":["ضعف التزام الأعضاء المهني بما يستوجب مساءلتهم إداريًّا","صعوبة المهمة وتجاوزها خبرات أعضاء الفريق الحاليين","قلة الاجتماعات التي حالت دون متابعة إنجاز المهمة","غياب مسؤول محدد؛ فالشراكة في الهدف لا تغني عن تحديد صاحب المهمة"],"a":3,"w":"المسؤولية المشتركة عن الهدف لا تلغي مساءلة كل عضو عن مهمة محددة؛ فحين تُسند المهمة «للجميع» دون مسؤول رئيس وموعد، يتوقع كل عضو أن يبدأها غيره. والحل تعيين مسؤول رئيس مع تحديد إسهامات الآخرين وموعد التسليم.","n":["خطأ: يقفز إلى اللوم قبل إصلاح خلل التوزيع نفسه.","خطأ: لا قرينة على صعوبة المهمة؛ القرينة في غموض ملكيتها.","خطأ: المتابعة لا تنفع ما دام لا يوجد من يُسأل عن المهمة.","صحيح: لكل مهمة صاحب واضح."],"c":"مسؤولية مشتركة ... دون أن يبدأها أحد","p":"شارِك في الهدف، وحدّد لكل مهمة مسؤولًا وموعدًا."},{"id":"8-28","s":8,"i":"8.4","l":"تطبيق","t":"يحيل معلم اللغة العربية كل ما يخص الطالب فيصل إلى معلم صعوبات التعلم قائلًا: «هذا طالبكم». ما التصحيح الأنسب؟","o":["نقل فيصل إلى غرفة المصادر في جميع حصص اللغة العربية","إشراكه في التخطيط والتدريس والمتابعة بوصفه مسؤولًا مشتركًا عن فيصل","تزويد المعلم بنسخة من الخطة الفردية للاطلاع عليها","تولّي معلم صعوبات التعلم تصحيح أعمال فيصل في المادة"],"a":1,"w":"معلم التعليم العام مسؤول عن الطالب المدمج في فصله، ولا تنتقل المسؤولية كاملة إلى التربية الخاصة. والتصحيح الفعلي إشراكه في دورة التعليم كلها: التخطيط والتدريس والمتابعة، لا مجرد إطلاعه أو حضوره الاجتماعات.","n":["خطأ: يرسّخ نقل المسؤولية ويزيد العزل.","صحيح: معلم التعليم العام شريك في مسؤولية الطالب.","خطأ: الاطلاع وحده لا يجعله شريكًا فعليًّا.","خطأ: يعزز الاتكال ويخالف المسؤولية المشتركة."],"c":"يحيل كل ما يخص الطالب ... «هذا طالبكم»","p":"الطالب ذو الصعوبات طالب الفصل أيضًا؛ المسؤولية مشتركة لا محوّلة."},{"id":"8-29","s":8,"i":"8.5","l":"تطبيق","t":"في فصل تشاركي منذ بداية العام، تشرح معلمة الرياضيات جميع الدروس، وتتنقل معلمة صعوبات التعلم بين الطاولات لمساعدة الطالبات المتعثرات. ما التصحيح الأنسب؟","o":["تحسين أسلوب المساعدة الفردية بتلميحات أكثر تنظيمًا ووضوحًا","تخصيص معلمة صعوبات التعلم للطالبات المشخّصات فقط داخل الفصل","إعادة توزيع الأدوار دوريًّا لتشترك المعلمتان في القيادة والتخطيط والتقويم","إعداد قائمة مسبقة بالطالبات اللاتي يحتجن إلى المساعدة في كل حصة وترتيب أولوياتهن"],"a":2,"w":"نموذج «معلم يدرّس وآخر يساعد» مفيد عند الحاجة، لكن تحوّله إلى الشكل الدائم يرسّخ عدم التكافؤ ويجعل معلمة التربية الخاصة مساعدة لا شريكة. والتصحيح تدوير الأدوار ليشارك الطرفان في القيادة والتخطيط والتقويم وفق الهدف والخبرة.","n":["خطأ: يحسّن الدور الهامشي ولا يعالج اختلال الشراكة.","خطأ: يحصر دورها في فئة ويعمّق عدم التكافؤ.","صحيح: تدوير الأدوار يحقق الشراكة.","خطأ: تنظيم للمساندة لا تصحيح للأدوار."],"c":"منذ بداية العام ... تشرح جميع الدروس","p":"المساندة دور مؤقت مقبول، لكن ثباته طوال العام خلل في الشراكة."},{"id":"8-30","s":8,"i":"8.5","l":"معرفة","t":"في نموذج «معلم يدرّس وآخر يلاحظ»، ما الذي يجعل دور الملاحظ مهنيًّا فاعلًا لا هامشيًّا؟","o":["مراقبة انضباط الطلاب وتسجيل مخالفاتهم السلوكية طوال الحصة","كتابة انطباع عام عن سير الحصة لمناقشته لاحقًا عند الحاجة","جمع بيانات محددة متفق عليها مسبقًا يحللها المعلمان معًا لاتخاذ قرار","الجلوس قرب الطلاب ذوي الصعوبات لتوجيههم أثناء شرح زميله"],"a":2,"w":"الملاحظة في التدريس التشاركي دور مهني متى كانت منظمة: سؤال ملاحظة محدد، وسلوك أو مؤشر واضح، وطريقة تسجيل متفق عليها، ثم تحليل مشترك للبيانات. أما المراقبة العامة أو الانطباعات فتجعل الدور هامشيًّا.","n":["خطأ: مراقبة عامة للانضباط تحوّل المعلم إلى مراقب سلوك.","خطأ: الانطباع العام ليس بيانات صالحة لاتخاذ قرار.","صحيح: ملاحظة منظمة تخدم قرارًا.","خطأ: هذا دور مساندة لا ملاحظة، ويغيّر الأداء المرصود."],"c":"مهنيًّا فاعلًا لا هامشيًّا","p":"الملاحظة المهنية = سؤال محدد + أداة تسجيل + تحليل مشترك."},{"id":"8-31","s":8,"i":"8.5","l":"تطبيق","t":"يطلب معلم العلوم من معلم التربية الخاصة في الحصص التشاركية أن يتولى وحده التعامل مع أي سلوك صعب يصدر من أي طالب. ما الموقف الأنسب؟","o":["قبول الطلب؛ لأن إدارة السلوك الصعب من صميم تخصص معلم التربية الخاصة وخبرته","قبول الطلب في السلوكيات الصادرة عن الطلاب ذوي الإعاقة فقط","رفض التدخل في السلوك؛ لأن ضبط الفصل مسؤولية معلم المادة","عدّ إدارة الصف مسؤولية مشتركة مع توزيع أدوار متفق عليه في الخطة"],"a":3,"w":"إدارة الصف والسلوك في التدريس التشاركي مسؤولية مشتركة بين المعلمين، ويمكن توزيع الأدوار وفق الخطة والخبرة دون أن يتحول أحدهما إلى مراقب سلوكي. فلا يُحصر معلم التربية الخاصة في السلوك، ولا يتخلى عن دوره فيه.","n":["خطأ: الخبرة التخصصية لا تلغي مسؤولية الشريك الآخر.","خطأ: يحصر دوره في فئة ويجعله مراقبًا سلوكيًّا.","خطأ: يقع في الطرف المقابل ويهمل المسؤولية المشتركة.","صحيح: إدارة الصف مسؤولية مشتركة."],"c":"يتولى وحده ... أي سلوك صعب","p":"في التدريس التشاركي لا «طلابي وطلابك» ولا «مهمتي ومهمتك» دون اتفاق."},{"id":"8-32","s":8,"i":"8.5","l":"تطبيق","t":"في درس بالمحطات يقود كل معلم محطة، وتعمل المحطة الثالثة باستقلال دون معلم. من المسؤول عن جودة تعلّم الطلاب في المحطة المستقلة؟","o":["الطلاب أنفسهم؛ لأن المحطة مستقلة بطبيعتها","المعلم الأقرب مكانيًّا إلى المحطة أثناء الدوران","معلم المادة؛ لأنها تتناول المحتوى الأساسي للدرس","المعلمان معًا: بتصميم مهمتها بوضوح ومتابعة نتائجها"],"a":3,"w":"المسؤولية المشتركة في التدريس التشاركي تشمل جودة المهام ونتائجها حتى لو لم يقف أحد المعلمين عندها طوال الوقت. ونجاح المحطة المستقلة يتطلب مهمة واضحة يمكن إنجازها دون اعتماد مفرط على المعلم، ومتابعة لما أنجزه الطلاب.","n":["خطأ: استقلال النشاط لا يلغي المسؤولية التعليمية.","خطأ: المسؤولية لا تُحدَّد بالموقع داخل الصف.","خطأ: يعيد تقسيم المسؤولية على أساس المسمى الوظيفي.","صحيح: تصميم ومتابعة مشتركان."],"c":"المحطة الثالثة تعمل باستقلال","p":"غياب المعلم عن المحطة لا يعني غياب مسؤوليته عنها."},{"id":"8-33","s":8,"i":"8.5","l":"تحليل","t":"بعد درس تشاركي، جمعت معلمة التربية الخاصة بيانات الملاحظة، فقالت لها معلمة الفصل: «حلّليها أنتِ وأخبريني بالنتيجة فقط». ما التقييم الأدق لهذا التصرف؟","o":["مقبول؛ لأن من جمعت البيانات هي الأقدر على تفسيرها وحدها","مقبول؛ لأن تحليل البيانات من الاختصاص الأصيل للتربية الخاصة","مخالف للشراكة؛ فتحليل البيانات وقرار التعديل مسؤولية المعلمتين معًا","مخالف؛ لأن تحليل البيانات مسؤولية معلمة الفصل وحدها بوصفها صاحبة الفصل"],"a":2,"w":"التقويم وتحليل البيانات واتخاذ قرار التدريس اللاحق مسؤولية مشتركة في التدريس التشاركي، حتى لو جمع أحد المعلمين البيانات. فالشراكة تشمل دورة التدريس كاملة: التخطيط والتنفيذ والتقويم.","n":["خطأ: جمع جزء من البيانات لا يجعل القرار فرديًّا.","خطأ: التقويم في التدريس التشاركي مسؤولية الشريكين.","صحيح: التحليل والقرار مشتركان.","خطأ: يكرر الخطأ نفسه بنسبة القرار إلى طرف واحد."],"c":"«حلّليها أنتِ وأخبريني بالنتيجة فقط»","p":"من جمع البيانات لا ينفرد بالقرار؛ التحليل والتعديل للشريكين."},{"id":"8-34","s":8,"i":"8.5","l":"تطبيق","t":"في حصة تدريس كفريق، تكررت مقاطعة كل معلم لشرح زميله حتى تشتت الطلاب. ما الإجراء الأنسب للحصص القادمة؟","o":["التحول الدائم إلى نموذج «معلم يدرّس وآخر يساعد» في بقية الحصص","الاتفاق المسبق على تسلسل الحوار وإشارات الانتقال ودور كل معلم في كل جزء","تقسيم الحصة إلى نصفين يشرح كل معلم نصفًا منفصلًا عن الآخر","اقتصار مشاركة معلم التربية الخاصة على تعليق ختامي في آخر الحصة"],"a":1,"w":"التدريس كفريق يحتاج تناغمًا وتخطيطًا مرتفعين؛ فيتفق المعلمان مسبقًا على سير الحوار وتبادل الأدوار وإشارات الانتقال حتى يكمل كل منهما الآخر بدل أن يقاطعه. والتخطيط المشترك صمام الأمان لنجاح هذا النموذج.","n":["خطأ: يهرب من المشكلة بتثبيت دور هامشي لأحد المعلمين.","صحيح: التخطيط المسبق ينظم القيادة المشتركة.","خطأ: يلغي التكامل الذي يقوم عليه التدريس كفريق.","خطأ: يهمّش أحد الشريكين بدل تنظيم الحوار."],"c":"تكررت مقاطعة كل معلم لشرح زميله","p":"صوتان أمام الصف يحتاجان مسارًا متفقًا عليه قبل الحصة."},{"id":"8-35","s":8,"i":"8.5","l":"معرفة","t":"أي العبارات تحدد أدوار المعلمَين في التدريس الموازي (Parallel Teaching) تحديدًا صحيحًا؟","o":["يدرّس كل منهما المحتوى الأساسي نفسه لمجموعة أصغر وفق هدف مشترك","يدرّس كل منهما محتوى مختلفًا لمجموعته بحسب مستوى طلابها واحتياجاتهم","يدرّس أحدهما الصف ويعمل الآخر مع مجموعة صغيرة مؤقتًا","يقود المعلمان الشرح معًا أمام الصف كاملًا بتبادل متكامل"],"a":0,"w":"في التدريس الموازي يُقسم الصف إلى مجموعتين متقاربتين، ويقدم كل معلم المحتوى أو الأهداف نفسها في الوقت نفسه؛ لزيادة فرص المشاركة وتقليل حجم المجموعة. ولذلك يتفق المعلمان مسبقًا على الهدف ومعيار النجاح حتى لا تختلف فرص التعلم بين المجموعتين.","n":["صحيح: مجموعتان والمحتوى نفسه.","خطأ: الموازي يقدم المحتوى نفسه لا محتويين مختلفين.","خطأ: هذا وصف التدريس البديل.","خطأ: هذا وصف التدريس كفريق."],"c":"التدريس الموازي (Parallel Teaching)","p":"الموازي = مجموعتان + المحتوى نفسه + الوقت نفسه."},{"id":"8-36","s":8,"i":"8.6","l":"تطبيق","t":"يغادر الطالب سلمان مقعده كلما طُلب منه حل مسائل كتابية طويلة، وتشير بيانات الملاحظة إلى أن السلوك يتكرر للتخلص من المهمة. أي نماذج الاستشارة أنسب لهذه الحالة؟","o":["استشارة تركز على اختيار عقوبة رادعة تمنع تكرار السلوك مستقبلًا","إحالة مباشرة لتقييم اضطراب تشتت الانتباه وفرط الحركة لدى الطالب","الاستشارة السلوكية القائمة على البيانات ووظيفة السلوك وتعليم بديل مناسب","استشارة إرشادية تكتفي بنقل معلومات عامة عن الدافعية وأساليب التحفيز إلى المعلم"],"a":2,"w":"عندما تكون المشكلة سلوكية متكررة وتظهر وظيفتها (الهروب من مهمة صعبة)، فالاستشارة السلوكية هي الأنسب: تعريف السلوك، وتحليل بياناته وعلاقاته الوظيفية، ثم تعديل المهمة وتعليم سلوك بديل. وهي لا تعني البحث عن عقوبة.","n":["خطأ: الاستشارة السلوكية لا تعني اختيار عقوبة، والعقوبة قد تعزز الهروب.","خطأ: البيانات تشير إلى وظيفة سلوكية محددة، والإحالة ليست نموذجًا استشاريًّا.","صحيح: بيانات + وظيفة + سلوك بديل.","خطأ: معلومات عامة لا ترتبط بالبيانات ولا بوظيفة السلوك."],"c":"يتكرر للتخلص من المهمة","p":"مشكلة سلوكية متكررة ذات وظيفة واضحة = استشارة سلوكية قائمة على البيانات."},{"id":"8-37","s":8,"i":"8.6","l":"معرفة","t":"بدأ المستشار اللقاء بعرض خمس استراتيجيات جاهزة قبل أن يصف معلم الفصل المشكلة أو سياقها. ما المهارة الاستشارية التي أغفلها؟","o":["التوثيق المكتوب لتوصيات اللقاء وتوزيعها على المعنيين","الاستماع النشط والأسئلة التوضيحية لبناء فهم مشترك للمشكلة","التفاوض مع الإدارة حول الموارد اللازمة لتنفيذ الحلول","متابعة دقة التنفيذ وجمع بيانات عن أثر الاستراتيجيات"],"a":1,"w":"الاستماع النشط والأسئلة التوضيحية وإعادة الصياغة نقطة البداية في الاستشارة التعاونية؛ فهي تبني فهمًا مشتركًا للمشكلة وتحترم خبرة المستشير بسياقه. وتقديم الحلول قبل ذلك يحوّل الاستشارة إلى وصفة أحادية من الخبير.","n":["خطأ: التوثيق يأتي بعد الاتفاق على الحل.","صحيح: افهم قبل أن تقترح.","خطأ: لا يتصل بالخلل الحاصل في بداية اللقاء.","خطأ: مرحلة لاحقة لا يُوصل إليها دون فهم المشكلة."],"c":"قبل أن يصف معلم الفصل المشكلة","p":"الأسئلة التوضيحية تسبق الافتراضات، والفهم يسبق الحل."},{"id":"8-38","s":8,"i":"8.6","l":"تحليل","t":"نجحت استراتيجية لتحسين بدء المهام لدى الطالبة جود أسبوعين، ثم تراجعت نتائجها، وتبيّن من الملاحظة أن المعلمة صارت تطبق نصف خطواتها فقط. ما الاستنتاج الأدق؟","o":["لا يُحكم بفشلها قبل معالجة دقة التنفيذ وعوائقه ومراجعة البيانات","الاستراتيجية فقدت فاعليتها ويجب استبدالها بأخرى أقوى أثرًا في سلوك الطالبة","الطالبة اعتادت الاستراتيجية فلم تعد تؤثر في سلوكها","التراجع مؤشر على مشكلة جديدة تستدعي إحالتها للتقييم"],"a":0,"w":"تُفحص دقة التنفيذ قبل الحكم بأن الاستراتيجية غير فعالة؛ فإذا طُبق نصف الخطوات فقط فالخلل قد يكون في التنفيذ لا في الاستراتيجية. ولذلك يناقش المستشار مع المعلمة العوائق ويقدم الدعم، ثم تُراجع البيانات.","n":["صحيح: دقة التنفيذ تُفحص أولًا.","خطأ: لا يمكن الحكم على استراتيجية لم تُنفذ كما صُممت.","خطأ: تفسير يتجاهل قرينة التنفيذ الناقص.","خطأ: يقفز إلى الإحالة قبل فحص التفسير الأقرب."],"c":"صارت تطبق نصف خطواتها فقط","p":"قبل أن تقول «الخطة فشلت»، اسأل: هل طُبّقت كما صُممت؟"},{"id":"8-39","s":8,"i":"8.6","l":"تطبيق","t":"تريد والدة الطالبة ريم أن يكون هدف الفصل حفظ جدول الضرب، بينما ترى المعلمة أولوية حل مسائل الجمع اللفظية. ما الاستراتيجية الأنسب لإدارة هذا الاختلاف؟","o":["التفاوض بالاستماع لمسوّغات الطرفين وربطها ببيانات ريم لبناء هدف مشترك","اعتماد رأي المعلمة؛ لأنها الأدرى بالمنهج وتسلسل مهاراته","اعتماد رأي الأم؛ لأن الأسرة شريك أساسي في القرار التربوي ولها أولوية فيه","تأجيل الهدفين كليهما حتى يتفق الطرفان من تلقاء نفسيهما"],"a":0,"w":"عند اختلاف الأولويات بين البيت والمدرسة، يُستخدم التفاوض المهني الذي يركز على المصالح والهدف المشترك: يُستمع لمسوّغات كل طرف، ثم تُربط ببيانات الطالبة لبناء هدف قابل للقياس يلتزم به الطرفان.","n":["صحيح: تفاوض على المصالح والبيانات.","خطأ: يفرض قرارًا ويهمل الأسرة شريكًا في تحديد الأولويات.","خطأ: الشراكة لا تعني التسليم برأي طرف دون بيانات.","خطأ: يعطّل تعلم الطالبة ويترك الخلاف بلا إدارة."],"c":"تريد والدة ... بينما ترى المعلمة","p":"اختلاف الأولويات يُدار بالتفاوض والبيانات، لا بفرض رأي أحد الطرفين."},{"id":"8-40","s":8,"i":"8.6","l":"تحليل","t":"تأخر الطالب عبدالله عن تسليم واجب واحد لأول مرة هذا الفصل، فاقترح أحد الأعضاء عقد اجتماع فريق كامل وبدء دورة حل المشكلة. ما التقييم الأدق لهذا الاقتراح؟","o":["مناسب؛ لأن أي مشكلة مهما صغرت تستدعي تطبيق النموذج كاملًا","مناسب؛ لأن التأخر في الواجبات مؤشر مبكر على صعوبة تعلم","غير متناسب؛ يكفي إجراء صفي بسيط مع رصد الموقف وتصعيده إن تكرر","غير مناسب؛ لأن الواجبات المنزلية خارج نطاق عمل الفريق"],"a":2,"w":"تُختار الاستجابة الاستشارية بما يتناسب مع حجم المشكلة ودرجة تكرارها؛ فالمشكلة البسيطة التي حدثت مرة واحدة يكفيها إجراء صفي مناسب مع رصدها، ولا يُلجأ إلى نموذج حل مشكلات كامل إلا عند التكرار أو التعقيد.","n":["خطأ: مستوى الاستجابة يتناسب مع حجم المشكلة وتكرارها.","خطأ: موقف واحد لا يكفي دليلًا على أي نمط.","صحيح: استجابة متناسبة مع الحاجة.","خطأ: التعليل خاطئ؛ فالواجبات قد تدخل في عمل الفريق إذا ظهرت مشكلة متكررة."],"c":"واجب واحد لأول مرة","p":"لا تعقّد العملية دون دليل؛ الحجم والتكرار يحددان مستوى الاستجابة."},{"id":"8-41","s":8,"i":"8.6","l":"تطبيق","t":"أتقن الطالب فيصل في غرفة المصادر استراتيجية «اقرأ، غطِّ، اكتب، قارن» لتعلم الإملاء، لكنه لا يستخدمها في واجبات الفصل. ما الاستراتيجية الأنسب؟","o":["زيادة جلسات التدريب على الاستراتيجية في غرفة المصادر حتى تصبح تلقائية لديه","تزويد معلم الفصل بملخص مكتوب للاستراتيجية وخطواتها فقط","عدّ المهارة متقنة لأنها ظهرت في بيئة التدريب","التنسيق مع معلم الفصل لبرمجة التعميم في مواقف طبيعية وتلاشي التلميح"],"a":3,"w":"التعميم لا يحدث تلقائيًّا؛ بل يحتاج تنسيقًا بين غرفة المصادر والفصل العام (والأسرة عند الحاجة)، وتخطيطًا لاستخدام المهارة في مواقف طبيعية متعددة، مع تقليل التلميحات تدريجيًّا ومتابعة استقلال الطالب.","n":["خطأ: المهارة متقنة في بيئة التدريب، والمشكلة في نقلها.","خطأ: نقل معلومات دون تنسيق تطبيق فعلي ومتابعة.","خطأ: الإتقان في بيئة واحدة لا يعني التعميم.","صحيح: التعميم يُخطط له بالتنسيق."],"c":"أتقن في غرفة المصادر ... لا يستخدمها في الفصل","p":"نجاح في بيئة واحدة = خطط للتعميم عبر الأشخاص والبيئات."},{"id":"8-42","s":8,"i":"8.6","l":"معرفة","t":"ما الضابط الصحيح لاستخدام العصف الذهني التعاوني في اجتماع فريق العمل؟","o":["نقد كل بديل فور طرحه توفيرًا لوقت الاجتماع المحدود","اعتماد البديل الذي ينال أكثر أصوات الأعضاء في الاجتماع دون الرجوع إلى البيانات","قصر طرح البدائل على الأعضاء الأكثر خبرة في الفريق","توليد بدائل متعددة دون نقد أولي، ثم فرزها بالبيانات واختيار الأنسب"],"a":3,"w":"العصف الذهني التعاوني استراتيجية لتوليد أكبر عدد من البدائل بمشاركة الجميع ودون نقد أولي، ثم تُفرز البدائل وتُقارن بالبيانات ويُختار الأنسب لحاجة الطالب. والنقد المبكر أو التصويت المجرد يُفقدانه قيمته.","n":["خطأ: النقد المبكر يقتل توليد البدائل.","خطأ: كثرة الأصوات ليست معيارًا مهنيًّا للاختيار.","خطأ: يُقصي إسهامات بقية الأعضاء والأسرة.","صحيح: توليد حر ثم فرز بالبيانات."],"c":"الضابط الصحيح للعصف الذهني التعاوني","p":"ولّد بلا نقد، ثم احكم بالبيانات."},{"id":"9-01","s":9,"i":"9.1","l":"معرفة","t":"عند تعليم مهارة مركّبة بأسلوب التسلسل التنازلي (Backward Chaining)، أي الإجراءات التالية يمثّل هذا الأسلوب بدقة؟","o":["يتعلّم الطالب الخطوة الأولى حتى يتقنها، ثم تُضاف إليها الخطوة التالية فالتي تليها.","يتدرّب الطالب على جميع خطوات المهمة في كل محاولة، مع مساعدته عند مواضع التعثر.","ينتظر المعلم ثواني محددة قبل تقديم المساعدة ليتيح للطالب فرصة المبادرة الذاتية.","ينفّذ المعلم الخطوات الأولى ويترك الأخيرة للطالب، ثم يتراجع معه تدريجيًا نحو البداية."],"a":3,"w":"في التسلسل التنازلي يؤدي المعلم الخطوات الأولى ويُترك للطالب إتمام الخطوة الأخيرة، فيحصل على تعزيز فوري بإنهاء المهمة، ثم تُضاف الخطوات السابقة تدريجيًا. ويناسب غالبًا الطالب الذي يتقن البدايات ويتعثر في إنهاء المهمة.","n":["هذا وصف التسلسل التصاعدي (الأمامي) لا التنازلي.","هذا تدريب على المهمة كاملة، ولا يبدأ من النهاية.","هذا وصف التأخير الزمني، وهو أسلوب لتلاشي التلقين.","صحيح: يبدأ الطالب من آخر خطوة فيُنهي المهمة بنفسه."],"c":"التسلسل التنازلي (Backward Chaining)","p":"التصاعدي يبدأ من الخطوة الأولى، والتنازلي يبدأ من الأخيرة ليُنهي الطالب المهمة بنفسه."},{"id":"9-02","s":9,"i":"9.1","l":"تطبيق","t":"يتقن سلمان شراء وجبة في موقف محاكاة داخل غرفة المصادر بدقة عالية، لكنه يتردد ويخطئ عند الشراء الفعلي من مقصف المدرسة. ما الإجراء الأنسب؟","o":["زيادة جلسات المحاكاة في غرفة المصادر حتى يصل إلى إتقان تام لا خطأ فيه.","إعادة تحليل مهمة الشراء إلى خطوات أصغر وتعليمها له من البداية مرة أخرى في الغرفة.","تأجيل الشراء الفعلي إلى أن يتمكن من وصف خطواته لفظيًا دون أي خطأ.","نقل التدريب تدريجيًا إلى المقصف نفسه مع دعم مؤقت يُسحب كلما تحسّن أداؤه."],"a":3,"w":"سلمان اكتسب المهارة، والمشكلة في تعميمها إلى البيئة الطبيعية. والإجراء الأكثر مباشرة هو التدريب في البيئة المستهدفة نفسها بدعم مؤقت يتلاشى؛ فالمحاكاة مرحلة تأسيس لا نهاية البرنامج.","n":["يزيد التدريب في بيئة متقنة أصلًا ولا يعالج الانتقال.","يفترض ضعفًا في الاكتساب، والمهارة مكتسبة فعلًا.","المعرفة اللفظية لا تساوي الأداء الوظيفي في الموقف الحقيقي.","صحيح: يعالج التعميم في البيئة التي يخفق فيها."],"c":"يتقن في المحاكاة ويخطئ في المقصف","p":"أتقن في مكان وأخفق في آخر = مشكلة تعميم؛ درِّب في البيئة المستهدفة."},{"id":"9-03","s":9,"i":"9.1","l":"تطبيق","t":"تعرف ريم خطوات تجهيز حقيبتها المدرسية جيدًا، لكنها لا تبدأ أي خطوة حتى تشير إليها المعلمة. ما الإجراء الأنسب؟","o":["تقديم تلقين لفظي كامل قبل كل خطوة لضمان أدائها الخطوات دون أخطاء.","إعادة تعليمها الخطوات بالنمذجة الكاملة؛ لأنها لم تتقن تسلسل المهمة بعد على ما يبدو.","وضع خطة لتلاشي التلقين، كتأخير المساعدة تدريجيًا، وتعزيز مبادرتها.","تكليف زميلة بتذكيرها بكل خطوة بدلًا من المعلمة لتخفيف العبء عنها."],"a":2,"w":"ريم تعرف المهارة، فالمشكلة اعتماد على الملقّن لا نقص في المعرفة. والحل خطة تلاشٍ منظمة (مثل التأخير الزمني) تنقل السيطرة من إشارة المعلمة إلى المثيرات الطبيعية، مع تعزيز البدء الذاتي.","n":["يزيد الاعتماد على الملقّن بدل خفضه.","المشكلة ليست نقص معرفة؛ فهي تعرف الخطوات.","صحيح: يعالج الاعتماد على الملقّن مباشرة.","ينقل الاعتماد إلى شخص آخر ولا يبني الاستقلال."],"c":"لا تبدأ أي خطوة حتى تشير إليها","p":"ينتظر الإشارة رغم معرفته بالمهمة = اعتماد على الملقّن، والحل تلاشٍ مخطط."},{"id":"9-04","s":9,"i":"9.1","l":"معرفة","t":"هدف عبدالله في خطته: «يغسل يديه باستقلال قبل الأكل». أي الإجراءات التالية يُعدّ تكييفًا يحافظ على جوهر هذا الهدف؟","o":["تغيير الهدف إلى «يغسل يديه بمساعدة جسدية من المعلم قبل الأكل».","الاكتفاء بأن يذكر خطوات الغسل لفظيًا بالترتيب بدل أدائها فعليًا.","تثبيت بطاقات مصوّرة لخطوات الغسل قرب المغسلة يستعين بها بنفسه.","حذف خطوة استخدام الصابون من المهمة لتقصيرها وتسهيلها عليه."],"a":2,"w":"التكييف يغيّر الأداة أو طريقة الوصول أو البيئة دون المساس بجوهر المطلوب؛ فالبطاقات تساعد عبدالله على أن يغسل يديه باستقلال كما ينص الهدف. أما خفض مستوى الاستقلال أو استبدال الأداء بالوصف أو حذف خطوة أساسية فتعديل يغيّر الهدف نفسه.","n":["يخفض مستوى الاستقلال، فهو تعديل للهدف.","يستبدل الأداء بالوصف، فيغيّر جوهر المهارة.","صحيح: تغيّرت أداة الوصول وبقي المطلوب كما هو.","يحذف مكوّنًا جوهريًا من المهارة، فهو تعديل."],"c":"تكييفًا يحافظ على جوهر هذا الهدف","p":"التكييف يغيّر «كيف» يصل الطالب، والتعديل يغيّر «ماذا» يُطلب منه."},{"id":"9-05","s":9,"i":"9.1","l":"تطبيق","t":"يتدرّب فيصل على الذهاب وحده من بوابة المدرسة إلى محطة الحافلات القريبة، والطريق يتضمن عبور شارع مزدحم. بمَ ينبغي أن تبدأ الخطة؟","o":["تعليم قواعد السلامة وعبور الطريق في بيئة مضبوطة، ثم التدريب الميداني المتدرّج.","تدريبه على المسار كاملًا منذ اليوم الأول ليعتاد على الموقف الحقيقي سريعًا.","الاكتفاء بشرح المسار بالصور داخل الصف حتى نهاية الفصل الدراسي.","الطلب من أسرته مرافقته يوميًا إلى أن يكبر ويصبح قادرًا وحده."],"a":0,"w":"وجود خطر حقيقي يجعل السلامة أولوية تسبق الاستقلال الميداني؛ فتُؤسَّس قواعد السلامة والمكونات الأساسية في بيئة مضبوطة، ثم يُنقل التدريب تدريجيًا إلى المسار الحقيقي مع تلاشي الدعم.","n":["صحيح: السلامة شرط يسبق الاستقلال الميداني.","يقدّم الاستقلال على السلامة رغم وجود خطر حقيقي.","لا ينقل المهارة إلى البيئة الطبيعية مطلقًا.","يلغي التدريب ويؤجل الاستقلال دون خطة."],"c":"عبور شارع مزدحم","p":"عند وجود خطر: سلامة أولًا، ثم انتقال ميداني متدرّج مع تلاشي الدعم."},{"id":"9-06","s":9,"i":"9.1","l":"تحليل","t":"أتقنت جود ترتيب سريرها بأداء 100٪ من الخطوات في ثلاث جلسات متتالية، وبعد إجازة استمرت ثلاثة أسابيع دون أي ممارسة انخفض أداؤها في المكان نفسه إلى 60٪. ما التفسير الأدق والإجراء المترتب عليه؟","o":["خلل في الاكتساب الأولي؛ فتُعاد المهارة من بدايتها بتلقين جسدي كامل.","ضعف في الصيانة؛ فتُضاف فرص ممارسة دورية متباعدة مع قياس استمرار الأداء.","ضعف في التعميم؛ فتُنقل إلى بيئة جديدة لم تتدرّب فيها من قبل.","الهدف أعلى من قدرتها؛ فيُستبدل في الخطة بهدف أسهل منه."],"a":1,"w":"الصيانة تعني استمرار الأداء عبر الزمن. وبما أن جود أتقنت المهارة ثم تراجعت بعد انقطاع في البيئة نفسها، فالمشكلة ليست اكتسابًا ولا تعميمًا، والعلاج تنظيم ممارسة دورية متباعدة وقياس استمرار المهارة.","n":["الإتقان المتكرر سابقًا ينفي ضعف الاكتساب.","صحيح: التراجع ظهر مع الزمن في البيئة نفسها.","التراجع حدث في المكان نفسه، فليس مشكلة تعميم.","أداؤها المتقن سابقًا يثبت أن الهدف في متناولها."],"c":"انخفض أداؤها بعد إجازة دون ممارسة","p":"تراجع مع مرور الزمن = صيانة، وتعثّر عند تغيّر المكان = تعميم."},{"id":"9-07","s":9,"i":"9.1","l":"تحليل","t":"اقترح عضو في الفريق لنورة هدف «تصنيف الخرز حسب اللون» لتوافر أدواته وسهولة قياسه، بينما تشكو أسرتها من اعتمادها الكامل عليهم في ارتداء ملابسها كل صباح. ما الحكم الأدق على الهدف المقترح؟","o":["مناسب؛ لأن توافر الأدوات وسهولة القياس هما الأساس الذي تُبنى عليه أهداف الخطة الفردية.","مناسب؛ لأن مهارات التصنيف يجب أن تكتمل قبل أي مهارة للعناية بالذات.","ضعيف الأولوية؛ لأن الأهداف تُختار وفق حاجتها الوظيفية لا سهولة التدريس.","غير مناسب؛ لأن مهارات الحياة اليومية مسؤولية الأسرة وحدها لا المدرسة."],"a":2,"w":"المهارة الوظيفية ذات فائدة مباشرة في حياة الطالب، ولذلك تُحدَّد أولويات الأهداف وفق حاجته في بيئاته الحالية والمستقبلية. وارتداء الملابس حاجة يومية ملحّة لنورة، بينما يقوم المقترح على سهولة التدريس وتوافر المواد.","n":["عوامل عملية مساعدة لا تتقدم على حاجة الطالبة.","شرط لا سند له، ويؤخر حاجة يومية ملحّة.","صحيح: معيار الأولوية الحاجة الفعلية في حياتها.","الحكم صحيح والتعليل خاطئ؛ فالأسرة شريك لا مسؤول وحيد."],"c":"لتوافر أدواته وسهولة قياسه","p":"الهدف الوظيفي يُختار وفق حاجة الطالب وبيئته، لا وفق سهولة تدريسه."},{"id":"9-08","s":9,"i":"9.2","l":"معرفة","t":"ما الفرق الجوهري بين التربية البدنية المعدّلة (Adapted Physical Education) والعلاج الطبيعي (Physical Therapy)؟","o":["الأولى يقدّمها أخصائي العلاج الطبيعي، والثاني يقدّمه معلم التربية الخاصة في الصف.","الأولى برنامج تربوي يكيّف النشاط وأدواته وقواعده للمشاركة، والثاني خدمة علاجية تخصصية.","الأولى تُعفي الطالب من النشاط البدني، والثاني يعوّضه عنه بتمارين داخل المدرسة.","لا فرق بينهما إلا في مكان التنفيذ؛ فكلاهما يعالج الخلل الحركي ذاته بالطريقة نفسها."],"a":1,"w":"التربية البدنية المعدّلة برنامج تربوي تعليمي يعدّل القواعد والأدوات والبيئة لتحقيق مشاركة آمنة ولياقة ومهارات حركية وظيفية. أما العلاج الطبيعي فخدمة علاجية تأهيلية يقودها أخصائي مرخّص، ويقتصر دور معلم التربية الخاصة فيها على تطبيق التوصيات والتنسيق.","n":["عكسٌ للأدوار؛ فالعلاج الطبيعي من اختصاص أخصائي مرخّص.","صحيح: تكييف ودمج تربوي مقابل علاج وتأهيل تخصصي.","التربية البدنية المعدّلة تكيّف المشاركة ولا تعني الإعفاء.","يخلط بين برنامج تربوي وخدمة علاجية تخصصية."],"c":"الفرق الجوهري","p":"التربية البدنية المعدّلة = تكييف ودمج، والعلاج الطبيعي = علاج تخصصي."},{"id":"9-09","s":9,"i":"9.2","l":"تطبيق","t":"في أثناء حصة نشاط حركي مكيّف ظهر على خالد ضيق مفاجئ في التنفس وإرهاق شديد. ما الإجراء الأول الأنسب؟","o":["خفض شدة النشاط قليلًا ومواصلة الحصة مع مراقبة استجابته عن قرب.","إعطاؤه دواءً متوفرًا في المدرسة ليرتاح، ثم استكمال التمرين معه.","توثيق الأعراض في سجل المتابعة أولًا، ثم إبلاغ الأسرة نهاية اليوم.","إيقاف النشاط وتأمين الطالب واتباع خطة الطوارئ الصحية المعتمدة."],"a":3,"w":"عند ظهور أعراض صحية طارئة تكون الأولوية المطلقة لسلامة الطالب: إيقاف النشاط واتباع خطة الطوارئ والبروتوكول المدرسي المعتمد. ولا يجوز للمعلم إعطاء دواء أو إجراء طبي باجتهاد شخصي خارج الخطة الصحية.","n":["يستمر في النشاط رغم أعراض طارئة تستدعي الإيقاف.","تجاوز لحدود الدور؛ فالمعلم لا يعطي دواءً باجتهاده.","التوثيق مهم لكنه لا يسبق تأمين الطالب في الطارئ.","صحيح: السلامة تسبق إكمال النشاط."],"c":"ضيق مفاجئ في التنفس","p":"عند الطارئ الصحي: أوقف النشاط واتبع خطة الطوارئ، ولا تجتهد طبيًا."},{"id":"9-10","s":9,"i":"9.2","l":"تطبيق","t":"يشعر بندر، ولديه إعاقة حركية بسيطة، بالحرج في حصة كرة السلة فيطلب الجلوس جانبًا، ولا يوجد مانع طبي من مشاركته. ما الإجراء الأنسب؟","o":["تكييف قواعد النشاط أو أدواته أو دوره فيه ليشارك بأمان وفاعلية.","إعفاؤه من الحصة احترامًا لرغبته وتجنبًا لإحراجه أمام زملائه.","إشراكه بالقواعد نفسها دون أي تغيير حتى لا يشعر بالتمييز عن غيره.","تكليفه بتسجيل النقاط طوال العام بديلًا دائمًا عن المشاركة الحركية."],"a":0,"w":"الإعفاء الكلي من النشاط غير صحيح ما لم تفرضه حالة طبية أو خطة معتمدة. والإجراء المهني تعديل القواعد أو الأدوات أو الدور داخل النشاط ليشارك بندر مشاركة فاعلة وآمنة تقلل الحرج وتنمي قدراته.","n":["صحيح: التكييف أفضل من الإلغاء متى كان النشاط آمنًا.","إعفاء دون مبرر طبي يؤدي إلى العزلة والخمول.","يتجاهل حاجته الفردية فيبقى الحرج والإخفاق.","دور دائم بلا حركة صورة مقنّعة من الإعفاء."],"c":"لا يوجد مانع طبي من مشاركته","p":"التكييف لا يعني الإعفاء؛ بل تعديل طريقة المشاركة."},{"id":"9-11","s":9,"i":"9.2","l":"معرفة","t":"في خطة لتنمية القدرات البدنية لطالب يحتاج رعاية بدنية خاصة، أيّ المهام التالية «لا» تدخل ضمن دور معلم التربية الخاصة؟","o":["صياغة أهداف حركية وظيفية قابلة للقياس ضمن الخطة الفردية.","تحديد جرعة الدواء المناسبة للطالب وتعديلها وفق ملاحظاته الصفية.","تكييف أدوات النشاط ومسافاته وزمنه بما يناسب قدرات الطالب.","تطبيق التوصيات المعتمدة من المختصين ومتابعة أثرها بالبيانات."],"a":1,"w":"دور المعلم تخطيط وتكييف وتدريس ومتابعة، لا تشخيص طبي ولا وصف علاج. وتحديد جرعات الدواء وتعديلها يتجاوز حدود اختصاصه وقد يعرّض الطالب للخطر، فمرجعه الخطة الصحية والمختص.","n":["من صميم دوره التخطيطي التربوي.","صحيح: الدواء وجرعته اختصاص طبي خالص.","التكييف التربوي جزء أصيل من دوره.","تطبيق التوصيات والمتابعة من مهامه المشروعة."],"c":"«لا» تدخل ضمن دور معلم التربية الخاصة","p":"المعلم يكيّف ويدرّس ويتابع، ولا يشخّص ولا يصف علاجًا."},{"id":"9-12","s":9,"i":"9.2","l":"تطبيق","t":"لدى سلطان إجراء صحي روتيني موثّق في خطته الصحية ويستطيع تنفيذه، لكنه ينسى موعده فتذكّره المعلمة كل يوم. ما الإجراء الأنسب لدعم استقلاله بأمان؟","o":["تدريبه على ضبط منبّه بنفسه لتنفيذ ما تسمح به خطته.","تفويضه بتحديد موعد الإجراء وطريقته بنفسه وفق شعوره كل يوم.","استمرار تذكير المعلمة له يوميًا لضمان الانتظام وعدم النسيان.","نقل مسؤولية التذكير كاملة إلى الأسرة لأنها الأدرى بحالته."],"a":0,"w":"العناية الصحية الذاتية تعني تمكين الطالب من إدارة ما يستطيعه من شؤونه الصحية وفق خطة معتمدة. والمنبّه الذي يضبطه سلطان بنفسه دعم ذاتي يقلل الاعتماد على الراشد دون أن يمنحه قرارات علاجية خارج خطته.","n":["صحيح: أداة ذاتية تزيد الاستقلال ضمن حدود الخطة.","يتجاوز حدود الخطة الصحية ويهدد السلامة.","يُبقي الاعتماد على الراشد دون تلاشٍ.","لا ينمّي استقلاله، والمشكلة تحدث في المدرسة."],"c":"ينسى موعده فتذكّره المعلمة","p":"الاستقلال الصحي: أداة يستخدمها الطالب ذاتيًا ضمن حدود خطته المعتمدة."},{"id":"9-13","s":9,"i":"9.2","l":"تحليل","t":"قارن معلم بين هدفين لطالبة لديها ضعف في قوة القبضة: الأول «تزيد عدد مرات الضغط على كرة مطاطية»، والثاني «تفتح علبة طعامها وتغلقها بنفسها في الفسحة». ما الحكم الأدق؟","o":["الأول أولى؛ لأن تقوية العضلة يجب أن تكتمل قبل أي هدف وظيفي.","الثاني أولى؛ لأنه يربط القدرة البدنية بوظيفة يومية ذات معنى.","الأول أولى؛ لأنه أسهل في القياس والمتابعة وأقل حاجة إلى التنسيق مع الآخرين.","الهدفان متكافئان؛ لأن كليهما يستهدف قوة القبضة بالدرجة نفسها."],"a":1,"w":"القدرات البدنية تُنمّى لخدمة المشاركة والاستقلال الوظيفي. والهدف الثاني يحوّل تحسن القبضة إلى أداء ذي معنى في روتين الطالبة ويمكن قياس أثره، بينما الأول تمرين مجرد قد لا ينتقل إلى الحياة اليومية.","n":["التدريب المجرد أقل أولوية من النشاط المرتبط بوظيفة.","صحيح: الهدف البدني الأقوى ما يخدم وظيفة حقيقية.","سهولة القياس لا تحدد أولوية الهدف.","يتجاهل الفرق بين التمرين المجرد والأداء الوظيفي."],"c":"تفتح علبة طعامها وتغلقها بنفسها","p":"الهدف البدني الأقوى ما يرفع الاستقلال في نشاط يومي ذي معنى."},{"id":"9-14","s":9,"i":"9.2","l":"تحليل","t":"تبيّن من ملاحظة منظمة أن رهف تؤدي نصف خطوات روتين العناية الشخصية بنفسها، لكن المساعِدة تؤدي الروتين كاملًا عنها توفيرًا للوقت. ما التشخيص الأدق للموقف؟","o":["رهف غير جاهزة للاستقلال بعد، والمساعدة الكاملة هي الإجراء الآمن لها حاليًا.","المشكلة في دافعيتها، فيُضاف نظام تعزيز مع إبقاء المساعدة كما هي.","الروتين معقّد عليها، فيُحذف من خطتها ويُستبدل بهدف أكاديمي.","المساعدة تفوق حاجتها؛ فتؤدي ما تتقنه وتُدرَّب على الباقي تدريجيًا."],"a":3,"w":"المساعدة الكاملة ليست الإجراء الأول إذا كان الطالب يستطيع أداء جزء من المهمة؛ لأنها تصنع اعتمادًا على الراشد. والصحيح إعادة توزيع المساعدة لتؤدي رهف ما تتقنه، مع تدريب متدرج على بقية الخطوات وتلاشي الدعم، وحفظ خصوصيتها وكرامتها.","n":["البيانات تثبت قدرتها على جزء كبير من المهمة.","لا دليل على ضعف الدافعية؛ الخلل في حجم المساعدة.","يحرمها من مهارة وظيفية تستطيع جزءًا منها.","صحيح: يُبنى الاستقلال على ما تستطيعه فعلًا."],"c":"تؤدي نصف الخطوات بنفسها","p":"لا تسحب المهمة كاملة من طالب يستطيع جزءًا منها؛ ابنِ عليه."},{"id":"9-15","s":9,"i":"9.3","l":"معرفة","t":"طلب تركي من معلمه بأسلوب مهذّب وقتًا إضافيًا في الاختبار، موضحًا أن القراءة تستغرق منه وقتًا أطول من زملائه. إلى أي مكونات تقرير المصير ينتمي هذا السلوك أساسًا؟","o":["الدفاع عن النفس (Self-Advocacy).","التنظيم الذاتي (Self-Regulation).","الوعي الذاتي (Self-Awareness).","حل المشكلات (Problem Solving)."],"a":0,"w":"الدفاع عن النفس موجّه للخارج: معرفة الاحتياج والتعبير عنه وطلب التكييف المناسب باحترام. أما التنظيم الذاتي فموجّه للداخل كمراقبة الأداء وتصحيح الأخطاء، والوعي الذاتي فهم الطالب لقوته واحتياجه.","n":["صحيح: تعبير مناسب عن الحاجة وطلب للتكييف.","موجّه للداخل: مراقبة الأداء وتصحيحه، لا طلب الدعم.","معرفة الحاجة أساس يسبق الطلب، لكنه ليس الطلب نفسه.","يتضمن توليد بدائل وتقويمها، وليس جوهر الموقف هنا."],"c":"طلب وقتًا إضافيًا بأسلوب مهذّب","p":"طلب تكييف أو حق = دفاع عن النفس، ومراقبة الأداء وتصحيحه = تنظيم ذاتي."},{"id":"9-16","s":9,"i":"9.3","l":"معرفة","t":"ما نقطة البداية العملية الأنسب لبناء مهارات تقرير المصير لدى طالب ذي إعاقة؟","o":["تدريبه مباشرة على قيادة اجتماع خطته التربوية الفردية.","تقييم وعيه بذاته: نقاط قوته واحتياجاته وميوله.","منحه حرية مطلقة في اختيار أنشطته دون أي ضوابط.","سحب الدعم المقدّم له دفعة واحدة ليعتمد على نفسه."],"a":1,"w":"يبدأ بناء تقرير المصير بتقييم وعي الطالب بذاته ونقاط قوته واحتياجاته وميوله؛ لأن معرفة الذات تدعم اختيار أهداف واقعية، ثم تأتي مهارات تحديد الأهداف واتخاذ القرار والتنظيم الذاتي والدفاع عن النفس.","n":["من أعلى صور التطبيق، لكنه ليس نقطة البداية.","صحيح: الوعي الذاتي حجر الأساس.","تقرير المصير اختيار واعٍ مسؤول لا حرية فوضوية.","سحب الدعم يكون تدريجيًا لا فجأة."],"c":"نقطة البداية العملية","p":"تقرير المصير يبدأ بالوعي بالذات، وينتهي بالدفاع عن النفس وقيادة الحياة."},{"id":"9-17","s":9,"i":"9.3","l":"تطبيق","t":"تختار معلمة لمى كل تفاصيل مشروعها، من الموضوع حتى طريقة العرض، لتجنيبها الأخطاء وتوفير الوقت، مع أن لمى قادرة على المفاضلة بين البدائل. ما التصحيح الأنسب لهذه الممارسة؟","o":["تصميم فرص اختيار متدرجة وآمنة، مع تدريبها على المفاضلة ونقل القرار إليها.","ترك المشروع لها كاملًا دون أي توجيه من المعلمة حتى تتعلم من أخطائها وحدها.","الإبقاء على الطريقة نفسها مع شرح أسباب قرارات المعلمة لها بعد كل خطوة.","تحويل اتخاذ القرارات إلى أسرتها بدلًا من المعلمة لتخفيف العبء."],"a":0,"w":"إنجاز المهام نيابة عن الطالب بحجة السرعة خطأ محوري يحدّ من تقرير المصير. ودور المعلم الميسّر أن يصنع فرصًا حقيقية للاختيار ويعلّم المفاضلة، ثم ينقل جزءًا متدرجًا من المسؤولية مع دعم يخفّ عند الإمكان.","n":["صحيح: ينقل المسؤولية تدريجيًا مع الدعم.","التمكين لا يعني التخلي عن التدريس والدعم.","يُبقي القرار عند الراشد، فلا يُنمّي تقرير المصير.","ينقل السيطرة إلى راشد آخر ويُبقي لمى متلقية."],"c":"تختار المعلمة كل تفاصيل مشروعها","p":"تمكين الطالب لا يعني تركه وحده؛ بل نقل القرار إليه تدريجيًا مع الدعم."},{"id":"9-18","s":9,"i":"9.3","l":"تطبيق","t":"يستعد الفريق لاجتماع الخطة التربوية الفردية لماجد في المرحلة المتوسطة. أي الإجراءات التالية يجسّد تقرير المصير بأعلى صوره؟","o":["دعوته إلى الجزء الأخير من الاجتماع ليطّلع على القرارات التي اتخذها الفريق بعد مناقشتها.","إبلاغه بأهدافه الجديدة بعد الاجتماع بلغة مبسطة تناسب عمره.","إعداده مسبقًا ليعرض نقاط قوته وتطلعاته ويشارك في مناقشة أهدافه.","استبعاده من الاجتماع حفاظًا على وقته وتجنبًا لإحراجه أمام الفريق."],"a":2,"w":"إشراك الطالب في اجتماع خطته وإعداده مسبقًا لعرض نقاط قوته وتحدياته وتطلعاته من أعلى صور تقرير المصير؛ فيصبح متحدثًا باسم نفسه وشريكًا في القرار، لا متلقيًا له ولا حاضرًا حضورًا شكليًا.","n":["حضور شكلي يتلقى فيه القرار ولا يصنعه.","يُبلَّغ بالقرار بعد اتخاذه دون أي مشاركة.","صحيح: مشاركة فاعلة معدّة مسبقًا.","يُغيّب صوت الطالب كليًا عن خطته."],"c":"تقرير المصير بأعلى صوره","p":"مشاركة الطالب في خطته فاعلة ومعدّة مسبقًا، لا حضور شكلي."},{"id":"9-19","s":9,"i":"9.3","l":"تطبيق","t":"اختار يوسف ترتيبًا غير مناسب لأداء واجباته المسائية فتأخر في تسليم أحدها، والخطأ لا يمسّ سلامته ويمكن تداركه. ما الاستجابة الأنسب من المعلم؟","o":["مساعدته على مراجعة نتيجة قراره واستخلاص ما يتعلمه منه.","سحب حق الاختيار منه وتحديد ترتيب واجباته عنه حتى نهاية الفصل.","تجاهل الموقف تمامًا كي لا يشعر بالإحباط من خطئه أمام المعلم.","إبلاغ أسرته لتتولى تنظيم وقته في المنزل بدلًا منه من الآن."],"a":0,"w":"القرار الخاطئ فرصة تعليمية ما دام لا يهدد السلامة، وليس سببًا لسحب كل الخيارات؛ فمراجعة النتيجة واستخلاص الدروس تبني اتخاذ القرار والتقويم الذاتي وتحمّل المسؤولية.","n":["صحيح: الخطأ الآمن فرصة تعليمية.","يعاقبه بسحب الخيارات بدل تعليمه.","يفوّت فرصة تعلّم تحمّل النتائج ومراجعتها.","ينقل القرار إلى الراشد ويضعف وكالته."],"c":"لا يمسّ سلامته ويمكن تداركه","p":"الخطأ الآمن فرصة للتعلّم، لا مبرر لسحب الاختيار."},{"id":"9-20","s":9,"i":"9.3","l":"تحليل","t":"تسجّل شهد يوميًا عدد المسائل التي تحلها بدقة، وتلاحظ في سجلها تراجعًا مستمرًا منذ أسبوعين، لكنها تواصل استخدام الطريقة نفسها دون تغيير. ما المكوّن الناقص في تنظيمها الذاتي؟","o":["المراقبة الذاتية وتسجيل الأداء اليومي بانتظام.","الدفاع عن النفس والتعبير عن احتياجاتها للآخرين.","التقويم الذاتي واتخاذ إجراء تصحيحي بناءً على بياناتها.","الاختيار بين بديلين متاحين في كل مهمة تؤديها."],"a":2,"w":"التنظيم الذاتي دورة تخطيط ومراقبة وتقويم وتعديل. وشهد تراقب وتسجل، لكنها لا تستخدم بياناتها للحكم على فاعلية طريقتها وتعديلها؛ فالمكوّن الناقص التقويم الذاتي والإجراء التصحيحي.","n":["موجودة فعلًا؛ فهي تسجل أداءها يوميًا.","مكوّن آخر لتقرير المصير لا يعالج حلقة التعديل.","صحيح: حلقة التعديل هي المفقودة.","الاختيار وحده لا يكمل دورة التنظيم الذاتي."],"c":"تواصل الطريقة نفسها رغم التراجع","p":"المراقبة دون تعديل نصف تنظيم ذاتي؛ البيانات يجب أن تقود إلى قرار."},{"id":"9-21","s":9,"i":"9.3","l":"تحليل","t":"يرفض عمر أي مساعدة في مهام يعجز عنها فعلًا، ويقول إنه «مستقل». ما التفسير الأدق لسلوكه في ضوء مفهوم تقرير المصير؟","o":["لا يُعدّ تقرير مصير مكتملًا؛ لأنه يشمل معرفة متى يطلب الدعم وكيف.","يُعدّ تقرير مصير متقدمًا؛ لأن رفض الدعم في كل المواقف دليل على الاستقلال التام.","يُعدّ عجزًا متعلمًا؛ لأنه يعتمد على الآخرين في أداء مهامه كلها.","يُعدّ دفاعًا عن النفس؛ لأنه يعبّر عن رغبته أمام الآخرين بوضوح."],"a":0,"w":"تقرير المصير يتضمن الاستخدام الواعي للدعم: أن يعرف الطالب متى يحتاج مساعدة وكيف يطلبها لتحقيق هدفه. ورفض المساعدة في مهام يعجز عنها يعيق التعلم، ولا يمثل الدفاع عن النفس الذي يعني التعبير المناسب عن الحاجة.","n":["صحيح: الاستقلال يشمل الطلب الواعي للدعم.","الاستقلال لا يعني رفض كل دعم.","يناقض الموقف؛ فهو يرفض المساعدة لا ينتظرها.","الدفاع عن النفس تعبير مناسب عن الحاجة لا رفض مطلق."],"c":"يرفض أي مساعدة في مهام يعجز عنها","p":"الاستقلال الحقيقي يشمل الطلب الواعي للمساعدة عند الحاجة."},{"id":"9-22","s":9,"i":"9.4","l":"معرفة","t":"أي الصياغات التالية تمثّل هدفًا لما بعد المرحلة الثانوية (Post-secondary Goal) في الخطة الانتقالية لمشعل؟","o":["بعد التخرج سيلتحق مشعل ببرنامج تدريب مهني في صيانة الأجهزة.","سيكتب مشعل سيرة ذاتية مبسطة خلال الفصل الدراسي الحالي بإشراف معلمه.","سيشارك مشعل في نشاط محاكاة لمقابلة وظيفية داخل المدرسة هذا العام.","سيجمع المعلم معلومات عن برامج التدريب المهني المتاحة لمشعل وأسرته."],"a":0,"w":"هدف ما بعد الثانوية يصف ما يُتوقع أن يفعله الطالب بعد مغادرة المدرسة في التعليم أو التدريب أو التوظيف أو الحياة المستقلة، ويكون قابلًا للقياس. أما كتابة السيرة الذاتية ومحاكاة المقابلة فأهداف أو أنشطة سنوية تمهد له.","n":["صحيح: يصف نتيجة قابلة للقياس بعد مغادرة المدرسة.","هدف سنوي داعم يتحقق داخل المدرسة.","نشاط انتقالي، لا نتيجة بعد التخرج.","إجراء يقوم به المعلم، لا هدف للطالب."],"c":"هدفًا لما بعد المرحلة الثانوية","p":"بعد التخرج + نتيجة قابلة للقياس = هدف ما بعد الثانوية."},{"id":"9-23","s":9,"i":"9.4","l":"معرفة","t":"أي العبارات التالية أدق في وصف التقييم الانتقالي (Transition Assessment)؟","o":["اختبار مقنن واحد يُطبّق في نهاية المرحلة الثانوية لتحديد المهنة المناسبة للطالب.","عملية مستمرة تجمع بيانات الميول والقدرات والتفضيلات والاحتياجات من مصادر متعددة.","استبانة ميول يعبّئها الطالب مرة واحدة ويُبنى عليها مساره المستقبلي كاملًا.","تقرير طبي يحدد نوع الإعاقة ودرجتها ويقترح الوظائف الملائمة لها مباشرة."],"a":1,"w":"التقييم الانتقالي عملية مستمرة لجمع بيانات عن ميول الطالب واهتماماته ونقاط قوته وتفضيلاته ومهاراته الوظيفية من مصادر متعددة، وهو الخطوة الأولى قبل بناء الأهداف، ويستمر مع التنفيذ لتحديث الخطة.","n":["ليس اختبارًا واحدًا ولا يُؤجَّل إلى النهاية.","صحيح: مستمر ومتعدد المصادر ويسبق الأهداف.","مصدر واحد في مرة واحدة لا يكفي للتخطيط.","التشخيص لا يحدد المسار؛ البيانات الفردية هي الأساس."],"c":"وصف التقييم الانتقالي","p":"التقييم الانتقالي مستمر ومتعدد المصادر، ويسبق صياغة الأهداف."},{"id":"9-24","s":9,"i":"9.4","l":"تطبيق","t":"عبدالرحمن في الصف الأول الثانوي، قلق من مستقبله ولا يرى صلة بين دراسته والعمل، ولا تتوافر لدى الفريق معلومات عن ميوله المهنية. ما الخطوة الأولى الأنسب؟","o":["تسجيله مباشرة في تدريب ميداني بأقرب جهة عمل إلى المدرسة.","صياغة هدف توظيف له بناءً على المهن الشائعة بين زملائه.","بدء تقييم انتقالي لميوله وقدراته من مصادر متعددة.","تزويده بقائمة وظائف مناسبة لنوع إعاقته ليختار منها."],"a":2,"w":"الإجراء الأول في التخطيط الانتقالي هو التقييم الانتقالي متعدد المصادر للميول والقدرات والاحتياجات؛ فهو الذي يحدد نقطة البداية، ثم تُصاغ أهداف ما بعد الثانوية وتُربط بها المواد الحالية والخبرات.","n":["يقفز إلى خبرة غير مرتبطة بهدف أو بيانات.","هدف لا ينطلق من ميوله وقدراته الفردية.","صحيح: لا تخطيط انتقالي دون بيانات.","يبني المسار على التشخيص لا على الطالب."],"c":"لا تتوافر معلومات عن ميوله المهنية","p":"أول خطوة انتقالية = تقييم انتقالي متعدد المصادر."},{"id":"9-25","s":9,"i":"9.4","l":"تطبيق","t":"تفضّل أسرة هيا التحاقها بعمل مكتبي تراه آمنًا، بينما تُظهر هيا اهتمامًا واضحًا بمجال الطهي. ما الإجراء الأنسب من الفريق؟","o":["اعتماد اختيار الأسرة لأنها المسؤولة وحدها عن قرارات ابنتها المستقبلية.","تيسير حوار مبني على تفضيلات هيا وبيانات قدراتها ومتطلبات المجالين.","اعتماد اختيار هيا فورًا دون مناقشة أي بيانات احترامًا لحقها في القرار.","اختيار مجال ثالث محايد متوافر في المدرسة لتجنب الخلاف بين الطرفين."],"a":1,"w":"التخطيط المتمحور حول الطالب يضع رغباته وتفضيلاته في مركز القرار مع مشاركة الأسرة والفريق، ويختبرها ببيانات واقعية وخبرات استكشافية للوصول إلى قرار مستنير، لا بفرض رأي طرف واحد.","n":["الأسرة شريك لا صاحب قرار منفرد.","صحيح: صوت الطالبة والبيانات أساس القرار المستنير.","تقرير المصير اختيار مستنير بالبيانات لا اختيار مجرد.","يتجاهل ميول الطالبة ويقدّم المتاح على المناسب."],"c":"تفضيل الأسرة يخالف اهتمام هيا","p":"عند تعارض الرغبات: صوت الطالب + بيانات واقعية + حوار مع الأسرة."},{"id":"9-26","s":9,"i":"9.4","l":"تحليل","t":"هدف سعد لما بعد الثانوية العمل في مستودع لمتجر تجزئة، لكن الأنشطة الانتقالية المخططة له هذا العام تقتصر على زيارات لمعارض فنية ومشاركات في مسابقات رياضية. ما الخلل الأدق في خطته؟","o":["قلة عدد الأنشطة؛ فكثرة الزيارات الميدانية هي معيار جودة الخطة الانتقالية.","الهدف المستقبلي غير مناسب؛ فينبغي تغييره ليتوافق مع الأنشطة المتاحة.","لا خلل؛ فالأنشطة المتنوعة تنمّي شخصيته وتكفي للإعداد لأي مسار مهني.","غياب الاتساق؛ فالأنشطة لا ترتبط بمهارات أو خبرات تدعم هدفه المهني مباشرة."],"a":3,"w":"الأنشطة والخدمات الانتقالية خطوات منظمة تقود إلى هدف ما بعد الثانوية، ولذلك يجب أن ترتبط مباشرة بمهارات العمل في المستودع وخبراته. ونجاح الخطة لا يُقاس بكثرة الأنشطة بل باتساقها مع النتيجة المستهدفة.","n":["المشكلة في الارتباط بالهدف لا في العدد.","يقلب المنطق؛ الأنشطة تُبنى على الهدف لا العكس.","النشاط الجيد عمومًا لا يكفي إن لم يخدم النتيجة.","صحيح: كل نشاط يجب أن يخدم الهدف المستقبلي."],"c":"أنشطة لا صلة لها بهدف المستودع","p":"كل نشاط انتقالي يجب أن يخدم هدف ما بعد الثانوية مباشرة."},{"id":"9-27","s":9,"i":"9.4","l":"تحليل","t":"يحصل فهد على درجات جيدة في المواد الدراسية، لكن بيانات التقييم الانتقالي تُظهر عجزه عن إدارة مصروفه واستخدام وسائل النقل، وهدفه بعد المدرسة العمل والعيش باستقلال. ما الاستنتاج الأدق؟","o":["جاهزيته للانتقال مكتملة؛ لأن التحصيل الأكاديمي المرتفع هو أقوى مؤشر على النجاح بعد المدرسة.","يكفيه مزيد من الدروس النظرية عن المال والمواصلات داخل الصف الدراسي.","يحتاج أهدافًا للحياة المستقلة تُدرَّب في مواقف واقعية؛ فالتحصيل وحده لا يكفي.","هذه المهارات خارج نطاق الخطة الانتقالية، وتُترك للأسرة بعد تخرجه."],"a":2,"w":"الخدمات الانتقالية تستهدف التعليم والتدريب والتوظيف والحياة المستقلة جميعها. وبيانات فهد تكشف حاجزًا في مهارات الحياة المستقلة يهدد هدفه، فتُدرج له أهداف في إدارة المال والتنقل تُدرَّب في مواقف واقعية.","n":["النجاح الأكاديمي وحده لا يثبت الجاهزية للعمل والحياة.","التدريب النظري لا يغني عن الخبرة الواقعية.","صحيح: الجاهزية تشمل الحياة المستقلة لا التحصيل وحده.","الحياة المستقلة مجال انتقالي رئيس في الخطة."],"c":"درجات جيدة مع عجز عن إدارة المصروف","p":"النجاح الأكاديمي وحده لا يثبت الجاهزية للعمل أو الحياة المستقلة."},{"id":"9-28","s":9,"i":"9.4","l":"تطبيق","t":"يحتاج طلال، ليحقق هدفه المهني، إلى تدريب على مهام عمل في بيئة حقيقية وإلى استمرار الدعم بعد تخرجه، وهو ما لا تستطيع المدرسة توفيره وحدها. ما الإجراء الأنسب؟","o":["الاكتفاء بمحاكاة بيئة العمل داخل المدرسة؛ لأنها تغني عن الخبرة الحقيقية.","تنسيق منظم مع جهات التدريب والتوظيف المجتمعية لتوفير الخبرة واستمرار الدعم.","إحالة ملفه إلى جهة توظيف ونقل مسؤولية المدرسة عن انتقاله إليها بالكامل.","تأجيل التدريب العملي إلى ما بعد تخرجه حين يصبح مسؤولًا عن نفسه."],"a":1,"w":"عندما يحتاج تحقيق الهدف الانتقالي إلى خبرة أو خدمة أو استمرارية تتجاوز ما توفره المدرسة، يصبح التنسيق بين المدرسة والأسرة والجهات المجتمعية ومؤسسات التدريب والتوظيف ضروريًا، مع بقاء مسؤولية المدرسة قائمة.","n":["المحاكاة مفيدة للتأسيس ولا تغني عن الواقع.","صحيح: التنسيق بين الجهات يمنع انقطاع الخدمات.","التنسيق لا يعني نقل مسؤولية المدرسة.","الخدمات الانتقالية تُخطط وتُنفذ قبل مغادرة المدرسة."],"c":"لا تستطيع المدرسة توفيره وحدها","p":"حاجة تتجاوز حدود المدرسة = تنسيق بين الجهات، لا نقل للمسؤولية."},{"id":"9-29","s":9,"i":"9.5","l":"معرفة","t":"ما المقصود بالتدريب المجتمعي المدمج (Community-Referenced Instruction) في إعداد الطلاب للحياة العملية؟","o":["تمثيل مواقف العمل وأدواره داخل المدرسة قبل النزول إلى الميدان الحقيقي.","مرافقة موظف في بيئة عمل حقيقية لملاحظة مهامه دون أدائها.","تعليم المهارة لأول مرة بخطوات محددة داخل بيئة صفية مضبوطة.","ممارسة المهارات في البيئات الطبيعية التي سيستخدمها الطالب فعلًا."],"a":3,"w":"التدريب المجتمعي المدمج استراتيجية تُمارَس فيها المهارات في البيئات الطبيعية التي سيستخدمها الطالب مستقبلًا، كالتدرب على المواصلات في المحطة الفعلية، وهو أقوى جسر بين المدرسة وسوق العمل.","n":["هذا وصف المحاكاة المهنية (Job Simulation).","هذا وصف الملاحظة المهنية (Job Shadowing).","هذا وصف التدريب المباشر في بداية التعلم.","صحيح: المهارة في مكانها الحقيقي."],"c":"التدريب المجتمعي المدمج","p":"التدريب المجتمعي = المهارة في مكانها الحقيقي، والمحاكاة = تمثيلها داخل المدرسة."},{"id":"9-30","s":9,"i":"9.5","l":"تطبيق","t":"يعرف أنس خطوات ترتيب الأرفف في متجر، لكنه لم يتدرب في الميدان بعد، ويُظهر خوفًا واضحًا من الخطأ أمام الزبائن. ما الاستراتيجية الأنسب في هذه المرحلة؟","o":["إرساله مباشرة إلى المتجر ليواجه خوفه في الموقف الحقيقي دفعة واحدة.","إعفاؤه من التدريب الخارجي والاكتفاء بالشرح النظري داخل الصف.","المحاكاة المهنية مع تغذية راجعة، ثم الانتقال التدريجي إلى الميدان.","تأجيل أي تدريب حتى يزول خوفه من تلقاء نفسه مع مرور الوقت."],"a":2,"w":"المحاكاة المهنية تعيد تمثيل بيئة العمل داخل المدرسة، فتكسر حاجز الرهبة وتتيح إتقان الخطوات الأساسية في بيئة آمنة مع تغذية راجعة، ثم يُنقل الطالب تدريجيًا إلى التدريب الميداني الحقيقي.","n":["يتجاهل الرهبة ويرفع احتمال الفشل والانسحاب.","الإعفاء يرسّخ الاتكالية ويمنع نقل التعلم.","صحيح: بيئة آمنة تكسر الرهبة قبل الميدان.","انتظار سلبي لا يعالج الخوف ولا يبني المهارة."],"c":"لم يتدرب ميدانيًا ويخاف الخطأ","p":"قبل الميدان مع رهبة الخطأ = محاكاة مهنية آمنة ثم نزول متدرّج."},{"id":"9-31","s":9,"i":"9.5","l":"تطبيق","t":"اقترح أحد أعضاء الفريق إعفاء أروى من أي تدريب مهني خارجي بسبب صعوبة بسيطة لديها في قراءة التعليمات المكتوبة. ما الموقف المهني الأنسب؟","o":["قبول الإعفاء حمايةً لها من الإحباط والفشل المتوقع في بيئة العمل.","قبول الإعفاء مؤقتًا إلى أن تتقن قراءة جميع التعليمات المكتوبة دون أي مساعدة.","نقلها إلى مسار لا يتطلب أي قراءة دون تقييم ميولها وقدراتها.","رفض الإعفاء، وتوفير تعليمات بصرية أو تقنية مساعدة مع تدرج في التدريب."],"a":3,"w":"الإعفاء من التدريب يرسّخ الاتكالية ويعزل الطالبة، بينما تذلّل التعليمات البصرية والتقنيات المساعدة عائق القراءة في بيئة العمل؛ فالقرار الصحيح تكييف وتدرج مع أهداف مهنية واقعية.","n":["الإعفاء يرسّخ الاتكالية ويحرمها من الخبرة.","يربط التدريب بشرط قد يؤخره طويلًا دون مبرر.","يقرر المسار من الصعوبة لا من بياناتها وميولها.","صحيح: التكييف يزيل الحاجز دون عزل."],"c":"إعفاء بسبب صعوبة بسيطة في القراءة","p":"الإعفاء من أضعف البدائل؛ التكييف والتقنية يزيلان الحاجز دون عزل."},{"id":"9-32","s":9,"i":"9.5","l":"تطبيق","t":"ينجز نايف مهام التدريب المهني بجودة عالية، لكن مشرف الموقع يشكو تأخره المتكرر عن موعد بدء العمل. ما الهدف الأنسب لإضافته إلى خطته؟","o":["رفع جودة أدائه الفني في المهام إلى مستوى أعلى من مستواه الحالي.","زيادة عدد ساعات التدريب اليومية في موقع العمل نفسه.","تدريبه على مهارات التواصل مع الزملاء داخل موقع العمل.","إدارة الوقت وروتين الاستعداد للحضور مع قياس التزامه بالمواعيد."],"a":3,"w":"المهارة المهنية تشمل السلوك المهني والتنظيم لا المهارة الفنية وحدها، وإدارة الوقت تؤثر في الاستمرار الوظيفي. وبما أن الحاجز التزام زمني، فالهدف الأنسب إدارة الوقت وروتين الاستعداد مع قياس الالتزام الفعلي.","n":["جودة أدائه عالية أصلًا، فليس هذا هو الحاجز.","يزيد الكم ولا يعالج الالتزام بالمواعيد.","مهارة مهمة لكنها لا تطابق مشكلة التأخر.","صحيح: يستهدف الحاجز المذكور مباشرة."],"c":"تأخره المتكرر عن موعد بدء العمل","p":"حدّد الحاجز المهني بدقة (فني، سلوك عمل، تواصل) ثم استهدفه مباشرة."},{"id":"9-33","s":9,"i":"9.5","l":"تحليل","t":"يرتب سامي المنتجات بدقة في غرفة المصادر، لكن أخطاءه ترتفع في المتجر الحقيقي، وتُظهر الملاحظة أن الخطأ يزداد مع ازدحام المكان وكثرة الأصوات، لا في خطوات المهمة نفسها. ما التفسير والإجراء الأدق؟","o":["المهارة غير مكتسبة بعد؛ فيُعاد تعليمها من البداية داخل غرفة المصادر بخطوات أصغر.","الطالب غير مناسب لهذا المجال؛ فيُنقل فورًا إلى مجال مهني آخر.","الحاجز بيئي لا مهاري؛ فيُجرَّب تكييف مناسب في الموقع ويُقاس أثره.","الدافعية منخفضة؛ فيُضاعف التعزيز مع إبقاء ظروف الموقع كما هي."],"a":2,"w":"البيانات تربط الخطأ بالازدحام والضوضاء لا بخطوات المهمة، فالحاجز بيئي. والإجراء الأكثر مباشرة تحليل هذا الحاجز وتجربة تكييف مناسب في موقع العمل نفسه وقياس أثره على الأداء، بدل إعادة تعليم مهارة مكتسبة.","n":["أداؤه الدقيق في غرفة المصادر ينفي ضعف الاكتساب.","قرار متسرع يتجاهل حاجزًا قابلًا للتكييف.","صحيح: الخطأ مرتبط بظروف المكان لا بالمهارة.","لا دليل على ضعف الدافعية، والبيانات تشير إلى البيئة."],"c":"يزداد الخطأ مع ازدحام المكان وكثرة الأصوات","p":"إذا ارتبط الخطأ بظروف المكان لا بخطوات المهمة، فعالج البيئة."},{"id":"9-34","s":9,"i":"9.5","l":"تحليل","t":"أي البيانات التالية تمثّل الدليل الأقوى على أن مهارة مهنية تعلّمتها دانة أصبحت معمَّمة؟","o":["أداؤها المهارة في موقع العمل مع مشرفين ومواد تختلف عن ظروف التدريب.","شرحها خطوات المهارة للمعلمة بدقة وتسلسل صحيح دون أن تحتاج إلى أي تذكير.","تكرارها المهارة عشر مرات متتالية دون أي خطأ داخل غرفة المصادر نفسها.","حصولها على درجة مرتفعة في اختبار كتابي شامل عن خطوات المهارة ومفاهيمها."],"a":0,"w":"التعميم أداء المهارة المكتسبة في مواقف أو أماكن أو مع أشخاص يختلفون عن ظروف التدريب الأصلية؛ ولذلك فالأداء في موقع العمل مع مشرفين ومواد مختلفة هو الدليل الأقوى، أما الشرح والتكرار والاختبار الورقي فلا تثبت نقل المهارة.","n":["صحيح: انتقال الأداء عبر الأشخاص والمواد والبيئة.","المعرفة اللفظية لا تثبت الأداء في الواقع.","التكرار في السياق نفسه لا يثبت التعميم.","الاختبار الورقي لا يقيس النقل إلى بيئة العمل."],"c":"أصبحت معمَّمة","p":"التعميم يُثبت بالأداء عبر أشخاص ومواد وأماكن جديدة، لا بالشرح أو التكرار."},{"id":"9-35","s":9,"i":"9.6","l":"معرفة","t":"أي العبارات التالية تميّز التأهيل عن التعليم بدقة في سياق خدمة الطلاب ذوي الإعاقة؟","o":["التأهيل يقتصر على علاج الحالة الطبية للطالب، والتعليم يتولى بقية الجوانب كلها.","التأهيل يبدأ بعد انتهاء التعليم المدرسي للطالب، ولا يتداخل معه زمنيًا مطلقًا.","التأهيل أوسع؛ إذ يستهدف التكيف والاستقلال والأداء الحياتي والمهني.","التأهيل والتعليم مترادفان في التربية الخاصة، لا يختلفان إلا في الاسم المستخدم."],"a":2,"w":"التعليم يركز على إكساب المعرفة والمهارة الأكاديمية، أما التأهيل فعملية منظمة متكاملة لتنمية القدرات وتعويض القصور، تستهدف التكيف والاستقلالية والأداء الحياتي والمهني في المدرسة والمنزل والمجتمع والعمل.","n":["التأهيل ليس مجرد علاج لحالة أو قصور.","التأهيل عملية مستمرة تتكامل مع المدرسة.","صحيح: التعليم أضيق من التأهيل.","يتجاهل اتساع التأهيل وشموله."],"c":"تميّز التأهيل عن التعليم","p":"التعليم يُكسب المعرفة، والتأهيل يبني التكيف والاستقلال في الحياة والعمل."},{"id":"9-36","s":9,"i":"9.6","l":"تطبيق","t":"طالب يعاني قلقًا شديدًا وخوفًا من الفشل ومفهوم ذات سلبيًا، ويرفض تقبّل إعاقته، مع أن مهاراته الأكاديمية مناسبة. أي أنواع التأهيل يستهدف حاجته الأساسية مباشرة؟","o":["التأهيل النفسي.","التأهيل المهني.","التأهيل التربوي الأكاديمي.","التهيئة والتكيف البيئي."],"a":0,"w":"التأهيل النفسي يركز على تقبل الذات والإعاقة وبناء الثقة وخفض القلق ومواجهة الخوف من الفشل وتنمية المرونة. ونوع التأهيل يُختار من الحاجز الوظيفي المذكور لا من اسم الإعاقة.","n":["صحيح: يبني التقبل والثقة والمرونة.","يستهدف الإعداد للعمل، لا القلق وتقبّل الذات.","مهاراته الأكاديمية مناسبة، فليست الحاجة الأساسية.","يزيل حواجز المكان والأدوات لا الحواجز النفسية."],"c":"قلق وخوف من الفشل ورفض للإعاقة","p":"حدّد الحاجز ثم نوع التأهيل: قلق وتقبّل = نفسي، علاقات ومشاركة = اجتماعي."},{"id":"9-37","s":9,"i":"9.6","l":"تطبيق","t":"يعاني وليد في المرحلة المتوسطة ضعفًا حادًا في القراءة انعكس على ثقته بنفسه وأدى إلى انسحابه من التفاعل مع زملائه. ما الخطة الأنسب؟","o":["التركيز على القراءة وحدها؛ لأن تحسنها سيعالج ثقته وعلاقاته بزملائه تلقائيًا.","إحالته إلى الدعم النفسي وحده وتأجيل أي تدخل في القراءة حتى تتحسن ثقته.","إعفاؤه من أنشطة القراءة الصفية كلها حتى لا تتأثر صورته أمام زملائه.","خطة تأهيل متكاملة: تدخل تربوي في القراءة، ودعم نفسي، وفرص نجاح اجتماعي."],"a":3,"w":"عندما تتعدد آثار الصعوبة يكون التأهيل المتكامل أصح من التدخل الأحادي: تدخل تربوي لتحسين القراءة، ودعم نفسي لبناء الثقة، وتدخل اجتماعي يمنح وليدًا فرص نجاح وتفاعل في أنشطة لا تعتمد كليًا على القراءة.","n":["تدخل أحادي يتجاهل الآثار النفسية والاجتماعية.","يؤجل معالجة الحاجز الأصلي المسبب للمشكلة.","الإعفاء يعمّق الفجوة ولا يبني المهارة.","صحيح: تعدد الآثار يستلزم تكامل التدخلات."],"c":"ضعف القراءة انعكس على ثقته وتفاعله","p":"عندما تتعدد آثار الصعوبة، فالتأهيل المتكامل أصح من التدخل الأحادي."},{"id":"9-38","s":9,"i":"9.6","l":"تطبيق","t":"أنهى شاب ذو إعاقة المرحلة الثانوية ويرغب في العمل، فاقترح أحد أعضاء الفريق توظيفه مباشرة في أول وظيفة شاغرة. ما الإجراء الأنسب وفق مبادئ التأهيل المهني؟","o":["قبول الاقتراح؛ لأن الحصول على أي وظيفة بسرعة هو مؤشر نجاح التأهيل.","إلحاقه بدورة تدريبية عامة لا ترتبط بمجال محدد قبل البحث عن عمل.","اختيار الوظيفة وفق نوع إعاقته المسجل في ملفه دون تقييم إضافي.","تقييم ميوله وقدراته ومواءمتها مع متطلبات الوظيفة قبل التوظيف."],"a":3,"w":"التأهيل المهني يبدأ بتقييم الميول والقدرات والمواءمة مع متطلبات العمل، ثم المحاكاة والتدريب الميداني والمتابعة بعد التوظيف. ونجاحه الأعمق يتحقق بالمواءمة بين قدرات الشخص ومتطلبات العمل واستمراره فيه.","n":["النجاح الأعمق مواءمة واستمرار لا دخول سريع.","تدريب بلا تقييم ولا هدف مهني محدد.","التشخيص وحده لا يحدد الخدمة ولا المهنة.","صحيح: التأهيل المهني يبدأ بالتقييم والمواءمة."],"c":"توظيفه مباشرة في أول وظيفة شاغرة","p":"التأهيل المهني: تقييم ← مواءمة ← تدريب ← توظيف ← متابعة."},{"id":"9-39","s":9,"i":"9.6","l":"تطبيق","t":"ضمن خطة تأهيل متعددة التخصصات لطالبة لديها حاجات حركية وتعليمية، ما الدور الأنسب لمعلم التربية الخاصة؟","o":["تولّي جميع التدخلات بنفسه لتوحيد التنفيذ وتقليل عدد المختصين المشاركين في الخطة.","تنفيذ الأهداف التربوية المتفق عليها وتقديم بياناتها والتنسيق ضمن اختصاصه.","تعديل توصيات العلاج الطبيعي بما يتناسب مع جدول الحصص المدرسية.","تحديد البرنامج النفسي المناسب لها ومتابعته بدلًا من المختص النفسي."],"a":1,"w":"الفريق متعدد التخصصات ضروري عند تعدد الحاجات، لكن التكامل لا يلغي الحدود المهنية لكل تخصص؛ فدور المعلم تنفيذ الأهداف والاستراتيجيات التربوية وتقديم البيانات والتنسيق، بينما يقود كل مختص ما يقع ضمن اختصاصه.","n":["التكامل لا يعني أن يقوم شخص واحد بكل الأدوار.","صحيح: دور تربوي وبياني وتنسيقي.","تعديل التوصية التخصصية يقوده المختص المؤهل.","تجاوز لحدود الاختصاص المهني."],"c":"خطة تأهيل متعددة التخصصات","p":"التكامل لا يعني ذوبان الأدوار؛ فلكل تخصص حدوده."},{"id":"9-40","s":9,"i":"9.6","l":"تحليل","t":"التزم الفريق بتنفيذ خدمة تأهيلية لطالب طوال فصل دراسي كامل كما خُطط لها، لكن بيانات المتابعة لم تُظهر أي تحسن في الأداء المستهدف. ما القرار الأدق؟","o":["مضاعفة مدة الخدمة نفسها تلقائيًا؛ لأن التنفيذ كان منتظمًا ودقيقًا طوال الفصل.","مراجعة البيانات وملاءمة الخدمة والهدف، ثم تعديل الخطة مع المختصين.","إيقاف التأهيل كليًا؛ لأن الطالب لم يستفد من الخدمة المقدّمة له.","الاستمرار دون تغيير؛ لأن الالتزام بالخطة المكتوبة هو معيار النجاح."],"a":1,"w":"الاستمرار في خطة غير فعالة رغم أن البيانات تبين عدم التقدم خطأ شائع؛ فالتنفيذ وحده لا يكفي إذا غابت النتيجة، والقرار المبني على البيانات يسبق الاستمرار أو الإيقاف أو التغيير الكبير.","n":["زيادة الجرعة دون تحليل قد تكرر خطة غير ملائمة.","صحيح: غياب النتيجة يستدعي فحص الملاءمة.","قرار متطرف يسبق تحليل سبب عدم التقدم.","النجاح يقاس بالنتائج لا بالالتزام الشكلي."],"c":"لم تُظهر أي تحسن","p":"التنفيذ وحده لا يكفي؛ غياب النتيجة يستدعي مراجعة الملاءمة وتعديل الخطة."},{"id":"10-01","s":10,"i":"10.1","l":"معرفة","t":"ما الذي يميز التواصل التبادلي (Two-way Communication) بين المدرسة والأسرة؟","o":["استخدام أكثر من قناة اتصال في الوقت نفسه لضمان وصول رسائل المدرسة إلى الأسرة.","إرسال المدرسة تقارير منتظمة ومفصلة إلى الأسرة عن أداء الطالب في جميع المواد الدراسية.","اتصال المدرسة بالأسرة فور حدوث أي مشكلة سلوكية أو أكاديمية لدى الطالب في الصف.","تدفق منتظم للمعلومات في الاتجاهين، تؤثر فيه ملاحظات الأسرة في الممارسة المدرسية."],"a":3,"w":"التواصل التبادلي تدفق منتظم للمعلومات من المدرسة إلى الأسرة والعكس، بحيث تفهم الأسرة ما يجري وتستطيع الرد، وتؤثر ملاحظاتها في القرارات والدعم. أما كثرة التقارير أو سرعة الإبلاغ أو تعدد القنوات فقد تبقى اتصالًا أحادي الاتجاه.","n":["تعدد القنوات وسيلة لا يضمن التبادلية.","تقارير كثيرة لكنها أحادية الاتجاه.","تواصل علاجي مرتبط بالمشكلات.","صحيح: اتجاهان وأثر في الممارسة."],"c":"التواصل التبادلي","p":"معيار جودة التواصل: فهم متبادل + قدرة على الرد + أثر في القرار."},{"id":"10-02","s":10,"i":"10.1","l":"معرفة","t":"ما الفرق الجوهري بين التواصل الاستباقي والتواصل العلاجي مع أسر الطلاب؟","o":["الاستباقي يكون مكتوبًا عبر التقارير، والعلاجي يكون شفهيًّا عبر اللقاءات المباشرة.","الاستباقي يسبق المشكلات لبناء الثقة منذ بداية العام، والعلاجي رد فعل بعد وقوعها.","الاستباقي تتولاه إدارة المدرسة، والعلاجي يتولاه معلم التربية الخاصة وحده.","الاستباقي خاص بالطلاب ذوي الإعاقة، والعلاجي خاص بالطلاب ذوي صعوبات التعلم."],"a":1,"w":"التواصل الاستباقي يبدأ منذ بداية العام وقبل ظهور المشكلات، ويهدف إلى بناء الثقة والوقاية والتكامل، فيترك لدى الأسرة اطمئنانًا وشراكة. أما العلاجي فرد فعل متأخر بعد وقوع المشكلة، وغالبًا يولّد القلق والدفاعية.","n":["الفرق ليس في شكل القناة.","صحيح: التوقيت والغرض هما الفارق.","الفرق ليس في الجهة المنفذة.","الفرق ليس في فئة الطلاب."],"c":"الاستباقي ... العلاجي","p":"ابدأ التواصل الإيجابي من اليوم الأول قبل أن تحتاجه لمشكلة."},{"id":"10-03","s":10,"i":"10.1","l":"معرفة","t":"ما الترتيب الصحيح لاستراتيجية «الشطيرة الإيجابية» (Positive Sandwich) عند نقل ملاحظة إلى ولي الأمر؟","o":["نقطة قوة أو إنجاز ← عرض التحدي بموضوعية ← ختام بالتشجيع والدعم.","عرض التحدي بموضوعية ← ذكر نقطة قوة ← طلب التزام الأسرة بخطة علاجية.","تشجيع عام ← عرض التحدي بالتفصيل ← تحديد العقوبة المناسبة للطالب.","عرض التحدي بموضوعية ← مقارنة الطالب بأقرانه ← ذكر نقطة قوة لديه."],"a":0,"w":"تبدأ الشطيرة الإيجابية بذكر إنجاز أو نقطة قوة، ثم يُعرض التحدي بموضوعية، ثم تُختم بالتشجيع والدعم والثقة. وهذا الترتيب يقلل دفاعية ولي الأمر ويبقي التركيز على مصلحة الطالب.","n":["صحيح: قوة ← تحدٍّ ← تشجيع.","البدء بالتحدي يرفع الدفاعية.","العقوبة ليست جزءًا من الاستراتيجية.","المقارنة بالأقران محبطة وغير مهنية."],"c":"الشطيرة الإيجابية","p":"ابدأ بالقوة، واعرض التحدي بموضوعية، واختم بالدعم."},{"id":"10-04","s":10,"i":"10.1","l":"تطبيق","t":"دخل والد الطالب فهد غاضبًا إلى غرفة المصادر بعد تدني درجة ابنه، وبدأ يتهم المدرسة بالتقصير. ما الإجراء الأول الأنسب؟","o":["عرض سجل الدرجات والأدلة فورًا لإثبات أن المدرسة أدت دورها كاملًا.","الإنصات الفعال لمخاوفه واحتواء انفعاله قبل عرض البيانات والخطوات.","طلب تأجيل اللقاء إلى موعد رسمي لاحق بحضور مدير المدرسة ووكيلها.","توضيح أن تدني الدرجة سببه قلة متابعة الأسرة لابنها في المنزل."],"a":1,"w":"عند استقبال ولي أمر غاضب أو قلق، يكون الإجراء الأول الإنصات الفعال واحتواء الانفعال قبل التبرير أو عرض الأدلة؛ فالهدف من اللقاء حل المشكلة لا إثبات الخطأ. وبعد خفض التوتر تُعرض البيانات ويُتفق على الخطوات.","n":["التبرير المبكر يزيد التوتر ويحوّل اللقاء إلى جدال.","صحيح: إنصات واحتواء ثم بيانات وخطوات.","التأجيل الرسمي قد يُفهم صدًّا ويؤخر الحل.","لوم الأسرة خطأ مهني يهدم الشراكة."],"c":"دخل ... غاضبًا","p":"ولي أمر غاضب ← أنصت واحتوِ أولًا، ثم البيانات والحلول."},{"id":"10-05","s":10,"i":"10.1","l":"تطبيق","t":"يرسل المعلم تقارير أسبوعية مفصلة لأسرة الطالبة ريم، لكن الأسرة لم ترد على أي تقرير منذ شهرين. ما الإجراء الأنسب لتعزيز الشراكة؟","o":["الاستمرار في التقارير نفسها أسبوعيًّا لأنها توثق تقدم الطالبة بانتظام ودقة.","تحويل التقارير إلى صيغة أطول تتضمن تفاصيل أكثر عن كل مهارة على حدة.","التواصل مع الأسرة لمعرفة القناة والتوقيت الأنسب وإتاحة مساحة منتظمة لردها.","إبلاغ إدارة المدرسة بعدم تجاوب الأسرة لاتخاذ الإجراء النظامي المناسب."],"a":2,"w":"المشكلة ليست في غياب المعلومات، بل في غياب التبادلية؛ فالأسرة لا ترد. والإجراء الأنسب معرفة الحاجز (القناة أو التوقيت أو الوصول) والاتفاق على وسيلة تتيح لها الرد والمشاركة، بدل تفسير صمتها بعدم الاهتمام.","n":["الاستمرار يكرّس اتصالًا أحادي الاتجاه.","زيادة التفاصيل لا تعالج غياب الرد.","صحيح: تحديد الحاجز وفتح مساحة للرد.","يفسر الصمت بعدم الاهتمام قبل فهم الحواجز."],"c":"لم ترد على أي تقرير","p":"عدم استجابة الأسرة ← افحص القناة والتوقيت والحواجز قبل الحكم."},{"id":"10-06","s":10,"i":"10.1","l":"تطبيق","t":"أثناء اجتماع مع أسرة الطالب سعد، استخدم أعضاء الفريق مصطلحات مثل «المعالجة الفونولوجية» و«الذاكرة العاملة»، فبدت الأسرة مرتبكة. ما الإجراء الأنسب؟","o":["إعادة صياغة المعلومات بلغة واضحة وأمثلة والتحقق من فهم الأسرة في الحال.","إرسال قائمة بتعريفات المصطلحات إلى الأسرة بعد انتهاء الاجتماع.","الاستمرار في عرض النتائج ثم دعوة الأسرة لطرح أسئلتها في نهاية الاجتماع.","الاكتفاء بإبلاغ الأسرة بالنتيجة النهائية دون الدخول في أي تفاصيل فنية."],"a":0,"w":"الفهم شرط للمشاركة في القرار أثناء الاجتماع نفسه؛ لذا تُعاد صياغة المعلومات بلغة واضحة وأمثلة مع التحقق من الفهم، دون التضحية بالدقة. أما الشرح اللاحق أو تأجيل الأسئلة فيترك الأسرة خارج القرار وقت اتخاذه.","n":["صحيح: تبسيط وتحقق من الفهم أثناء القرار.","مفيد لاحقًا، لكنه لا يمكّن الأسرة من المشاركة الآن.","تأجيل الأسئلة يُبقي الالتباس حتى بعد القرار.","حجب التفاصيل يُضعف الشراكة والشفافية."],"c":"بدت الأسرة مرتبكة","p":"مصطلحات معقدة ← بسّط وتحقق من الفهم في اللحظة نفسها."},{"id":"10-07","s":10,"i":"10.1","l":"تطبيق","t":"أراد المعلم إبلاغ أسرة الطالب ماجد بنتائج تقييم تتضمن معلومات حساسة عن حالته. أي الممارسات أنسب للحفاظ على الخصوصية والثقة؟","o":["إرسال النتائج في رسالة نصية سريعة ليطّلع عليها الوالدان فورًا.","مناقشتها في لقاء خاص عبر قناة معتمدة وبلغة واضحة غير وصمية.","إرفاق النتائج في مجموعة أولياء أمور الصف مع إخفاء اسم الطالب.","تسليم النتائج للطالب في ظرف مغلق ليوصلها إلى أسرته في المساء."],"a":1,"w":"المعلومات الحساسة تتطلب الخصوصية والقنوات المعتمدة ومشاركة أقل قدر لازم مع الأشخاص المخولين، مع لغة واضحة غير وصمية. واللقاء الخاص يسمح بالشرح والاستماع لأسئلة الأسرة، بخلاف الرسائل السريعة أو القنوات الجماعية أو تحميل الطالب المسؤولية.","n":["الرسالة السريعة لا تناسب معلومات حساسة ومعقدة.","صحيح: خصوصية وقناة معتمدة ولغة غير وصمية.","المجموعات الجماعية تهدد السرية حتى مع إخفاء الاسم.","يحمّل الطالب معلومات لا يُفترض أن ينقلها."],"c":"معلومات حساسة عن حالته","p":"معلومة حساسة ← لقاء خاص + قناة معتمدة + لغة غير وصمية."},{"id":"10-08","s":10,"i":"10.1","l":"تطبيق","t":"تقول والدة الطالب عمر، الذي لديه صعوبة تعلم في القراءة: «ابني ذكي لكنه مهمل ولا يريد أن يقرأ». ما الاستجابة الأنسب من المعلم؟","o":["تأكيد رأي الأم وتشجيعها على حزم أكبر في متابعة قراءته يوميًّا في المنزل.","تزويد الأم بتقرير التشخيص الكامل لتقرأ عن حالة ابنها بنفسها وتفهمها.","لقاء هادئ يوضح طبيعة الصعوبة بلغة مبسطة، ويبرز قوته ويقترح دعمًا منزليًّا ميسرًا.","إخبار الأم بأن المشكلة سببها الحقيقي ضعف المتابعة المنزلية في السنوات الدراسية السابقة."],"a":2,"w":"الموقف يحتاج إلى تصحيح مفهوم الأسرة دون لوم؛ فتوضيح طبيعة صعوبات التعلم بلغة مبسطة، واستعراض نقاط القوة، وتقديم استراتيجيات منزلية ميسرة، يحول اللوم إلى شراكة داعمة.","n":["يرسخ تفسيرًا خاطئًا ويزيد الضغط على الطالب.","تقرير معقد دون شرح لا يبني الفهم.","صحيح: تصحيح المفهوم وتحويل اللوم إلى شراكة.","لوم الأسرة خطأ مهني يهدم الثقة."],"c":"مهمل ولا يريد أن يقرأ","p":"حين تلوم الأسرة طفلها: بسّط طبيعة الصعوبة، وأبرز القوة، وقدّم أداة عملية."},{"id":"10-09","s":10,"i":"10.1","l":"تحليل","t":"راجع معلم صعوبات التعلم سجل اتصالاته بالأسر خلال الفصل، فوجد أن تسعة من كل عشرة اتصالات كانت لإبلاغ مشكلات سلوكية أو تدنٍّ في الدرجات، وأن الأسر صارت تتردد في الرد عليه. ما التفسير الأدق لهذا النمط؟","o":["خلل في قناة الاتصال المستخدمة، ويُعالج بالانتقال إلى تطبيق إلكتروني جديد ومعتمد.","تواصل فعال؛ لأنه منتظم ويبقي الأسر على اطلاع دائم بمشكلات أبنائها أولًا بأول.","ضعف في دافعية الأسر نحو تعليم أبنائها، ويحتاج إلى إشعارات رسمية من الإدارة.","تواصل علاجي مرتبط بالأزمات يولّد الدفاعية، ويحتاج إلى تواصل دوري يبرز النجاحات."],"a":3,"w":"النمط الموصوف تواصل علاجي مرتبط بالأزمات، وهو رد فعل متأخر يولد القلق والدفاعية لدى الأسر ويفسر ترددها في الرد. والتحسين الجوهري بناء تواصل دوري استباقي متوازن يتضمن التقدم ونقاط القوة إلى جانب الاحتياجات.","n":["تغيير القناة لا يغير مضمون الرسائل السلبي.","الانتظام في نقل المشكلات وحدها ليس فعالية.","يلوم الأسر قبل مراجعة نمط التواصل نفسه.","صحيح: تواصل أزم
