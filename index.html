 في الفصل العام","أخصائي النطق واللغة في المدرسة","الأخصائي النفسي من خلال المقاييس المقننة"],"a":1,"w":"معلم التعليم العام يقدم معلومات مباشرة عن أداء الطالب في المنهج والصف العام والمشاركة، ويجمع بيانات عن التعميم في الصف. فالعضو الأنسب للمعلومة هو من يراها أو يقيسها مباشرة.","n":["دوره تنظيمي، ولا يرصد أداء الطالب داخل الحصة مباشرة.","صحيح: يملك بيانات مباشرة عن الأداء والتعميم في الصف.","لا يرتبط اختصاصه بمتابعة الاستراتيجية داخل الحصة.","المقاييس لا ترصد استخدام الاستراتيجية في سياق الصف."],"c":"في حصص الدراسات الاجتماعية","p":"حدّد نوع المعلومة، ثم اختر من يراها أو يقيسها مباشرة."},{"id":"4-12","s":4,"i":"4.2","l":"تطبيق","t":"تعذّر حضور والد سارة اجتماع إعداد برنامجها رغم دعوته، فقال أحد الأعضاء: «الاجتماع باطل ولا يجوز المضي فيه». ما التصرف الأدق؟","o":["المضي في إقرار البرنامج دون حاجة إلى إشراك الأسرة في أي مرحلة لاحقة","إلغاء الاجتماع نهائيًا وإيقاف الخدمات حتى يحضر الوالد بنفسه","اتباع الإجراءات المعتمدة وتوثيق محاولات إشراكه دون حكم مسبق بالبطلان","تكليف المرشد الطلابي بالتوقيع نيابة عن الوالد لإكمال الإجراء"],"a":2,"w":"ولي الأمر شريك رئيس، لكن غيابه لا يعني تلقائيًا بطلان الاجتماع؛ فالأصل بذل محاولات مناسبة وموثقة لإشراكه واتباع الإجراءات المعتمدة، دون إطلاق حكم واحد على كل الحالات. ولا يصح تجاهل الأسرة ولا تعطيل الخدمات.","n":["يُسقط دور الأسرة بوصفها شريكًا أساسيًا.","غياب ولي الأمر لا يعني تلقائيًا بطلان الاجتماع.","صحيح: يحفظ حق الأسرة ويلتزم بالإجراءات.","التوقيع ليس إجراءً شكليًا ينوب فيه أي عضو."],"c":"تعذّر حضور الوالد رغم دعوته","p":"غياب ولي الأمر: اتبع الإجراءات المعتمدة ووثّق محاولات الإشراك."},{"id":"4-13","s":4,"i":"4.2","l":"تحليل","t":"في اجتماع الفريق اقترح قائد المدرسة أن يكتب بنفسه أهداف القراءة لطالب، وأن يحدد ساعات خدمته في غرفة المصادر بحسب توفر المعلمين فقط. ما التقويم الأدق لهذا المقترح؟","o":["مقبول، لأن قائد المدرسة صاحب الصلاحية الأعلى في اعتماد البرنامج","مقبول جزئيًا؛ فيكتب الأهداف ويترك تحديد الساعات لمعلم التربية الخاصة","مرفوض، لأن الإدارة لا يحق لها حضور اجتماعات فريق البرنامج أصلًا","يتجاوز الدور الإداري؛ فالأهداف والخدمات قرار فريق مبني على البيانات"],"a":3,"w":"قائد المدرسة أو من يمثله يضمن توفير الموارد والكوادر والوقت والالتزام بالإجراءات، ولا يكتب الأهداف التخصصية بدل المختصين. والخدمات تُحدد وفق حاجة الطالب وأهدافه لا وفق توفرها فقط.","n":["القرار التربوي لا يُحسم بالرتبة بل بالبيانات والاختصاص.","كتابة الأهداف التخصصية خارج الدور الإداري.","الإدارة عضو في الفريق بدور تنظيمي مهم.","صحيح: يحدد حدود الدور وموضع القرار."],"c":"يكتب الأهداف بنفسه وفق توفر المعلمين","p":"الإدارة موارد وإجراءات؛ والأهداف والخدمات قرار فريق بالبيانات."},{"id":"4-14","s":4,"i":"4.2","l":"معرفة","t":"كشفت البيانات حاجة طالب إلى تقييم معرفي مقنن ضمن دراسة حالته. من المختص بإجراء هذا التقييم؟","o":["المرشد الطلابي لارتباط التقييم بالجانب النفسي","الأخصائي النفسي المؤهل لتطبيق هذه المقاييس","معلم التربية الخاصة لأنه الأقرب إلى الطالب يوميًا","قائد المدرسة بوصفه المسؤول عن إحالات الطلاب"],"a":1,"w":"الأخصائي النفسي يجري التقييمات النفسية والمعرفية التي تقع ضمن اختصاصه ويفسر نتائجها، أما المرشد الطلابي فيساند الجوانب النفسية والاجتماعية والتوافقية دون التقييم المقنن. ثم يترجم الفريق أثر النتائج إلى احتياجات تربوية.","n":["وجود كلمة «نفسي» لا يجعل التقييم المقنن من دوره.","صحيح: التقييم المقنن ضمن حدود تأهيله.","القرب من الطالب لا يمنح تأهيلًا لتطبيق المقاييس.","دوره إداري تنظيمي لا تقييمي."],"c":"تقييم معرفي مقنن","p":"التقييم النفسي أو المعرفي المقنن للأخصائي النفسي المؤهل لا للمرشد."},{"id":"4-15","s":4,"i":"4.2","l":"تطبيق","t":"اختلف معلم التربية الخاصة وأخصائي النطق واللغة حول أولوية هدف لبندر؛ فالمعلم يقدّم فك الترميز، والأخصائي يقدّم اللغة الاستقبالية. ما الخطوة الأولى الأنسب لحسم الخلاف؟","o":["تحديد موضع الخلاف بدقة ثم الرجوع إلى البيانات لدى كل منهما","التصويت الفوري بين أعضاء الفريق واعتماد رأي الأغلبية الحاضرة","اعتماد رأي العضو الأقدم خبرة في التعامل مع هذا الطالب تحديدًا","إضافة الهدفين معًا دون ترتيب لهما تجنبًا لأي خلاف داخل الفريق"],"a":0,"w":"حل الخلاف يبدأ بتحديد موضعه: هل هو في حقيقة أم تفسير أم هدف أم خدمة؟ ثم الرجوع إلى أحدث الأدلة وأكثرها مباشرة، ومراعاة من يملك الخبرة في الجزء المختلف عليه، وجمع بيانات إضافية إن لزم، ثم التوثيق.","n":["صحيح: الخلاف يُحسم بالبيانات وحدود الاختصاص.","التصويت لا يحسم سؤالًا تجيب عنه البيانات.","الأقدمية ليست معيارًا لحسم القرار التربوي.","يتهرب من تحديد الأولوية ويشتت التدريس."],"c":"اختلفا حول أولوية الهدف","p":"الخلاف لا يُحسم بالرتبة أو الأغلبية بل بالبيانات والاختصاص."},{"id":"4-16","s":4,"i":"4.2","l":"تحليل","t":"أحضرت أسرة رهف تقريرًا من طبيب يوصي بأن «تتلقى رهف خدمة غرفة المصادر خمس حصص أسبوعيًا في القراءة». ما التعامل الأدق مع هذه التوصية؟","o":["تنفيذ التوصية حرفيًا لأن التقرير الطبي يحدد الخدمة التعليمية المطلوبة","إهمال التوصية لأن التقارير الطبية لا علاقة لها بالبرنامج التربوي","ترك القرار للأسرة وحدها لأنها صاحبة التقرير المقدم إلى المدرسة","دمج المعلومات الطبية بالبيانات التربوية ليقرر الفريق الخدمة المناسبة"],"a":3,"w":"المعلومة الطبية قد تكون ضرورية لفهم الحالة والحواجز، لكنها لا تكتب وحدها أهداف البرنامج أو تفاصيل خدماته. والفريق يترجم أثر الحالة في التعلم إلى احتياجات وخدمات تربوية بناءً على بيانات متعددة ووفق الإجراءات.","n":["الطبي لا يساوي قرارًا تربويًا منفردًا.","لا يُتجاهل التقرير الطبي؛ فقد يوضح الحاجة.","الأسرة شريك في القرار لا منفردة به.","صحيح: المعلومة الطبية تُثري القرار ولا تحسمه منفردة."],"c":"تقرير طبيب يحدد عدد الحصص","p":"لا تتجاهل التقرير الطبي ولا تحوّله إلى قرار تعليمي آلي."},{"id":"4-17","s":4,"i":"4.2","l":"تطبيق","t":"شارك مشعل، وهو في المرحلة المتوسطة، في اجتماع مراجعة برنامجه. أي الأدوار الآتية أنسب له في الاجتماع؟","o":["التعبير عن تفضيلاته وما يساعده والمشاركة بما يناسب قدرته","تحديد الخدمات التي يحتاجها واعتمادها نيابة عن بقية أعضاء الفريق","الاكتفاء بالحضور والاستماع دون إبداء أي رأي في أهدافه وخطته","إدارة الاجتماع وتوزيع المهام على أعضاء الفريق بنفسه"],"a":0,"w":"يمكن إشراك الطالب كلما سمح عمره وقدرته في معرفة أهدافه وتقدمه والتعبير عن تفضيلاته، وتزداد أهمية صوته في مهارات تقرير المصير والاستقلال والانتقال. وإشراكه لا يعني تحميله مسؤولية القرار وحده.","n":["صحيح: شريك مناسب لقدراته لا صاحب قرار منفرد.","إشراكه لا يعني تحميله مسؤولية القرار وحده.","مشاركة شكلية تُهدر صوته في تقرير المصير.","تتجاوز دوره المناسب لعمره وقدرته."],"c":"شارك الطالب في اجتماع برنامجه","p":"صوت الطالب مهم في تفضيلاته وتقرير مصيره، والقرار الشامل للفريق."},{"id":"4-18","s":4,"i":"4.3","l":"معرفة","t":"ورد في تقرير تقييم مها أن رتبتها المئينية في الفهم القرائي 25. ما الاستنتاج الصحيح من هذه النتيجة؟","o":["تصف موقع أدائها مقارنة بالمجموعة المرجعية","أجابت إجابة صحيحة عن ربع أسئلة الاختبار تقريبًا","تكشف سبب صعوبتها في الفهم وتحدد هدفها مباشرة","تُلزم الفريق بتقديم خدمة خاصة لها في الفهم حتمًا"],"a":0,"w":"الرتبة المئينية موقع نسبي داخل المجموعة المرجعية وليست نسبة إجابات صحيحة، وهي تصف الأداء مقارنة بمرجع ولا تفسر السبب وحدها. لذلك تُعد دليلًا ضمن صورة أوسع يُترجم إلى أثر تعليمي وحاجة.","n":["صحيح: الرتبة المئينية موقع نسبي.","خلط شائع؛ الرتبة المئينية ليست نسبة إجابات صحيحة.","الدرجة تصف الأداء ولا تفسر السبب ولا تحدد الهدف وحدها.","أي انخفاض يُفحص أثره واحتياجه قبل تقرير الخدمة."],"c":"رتبتها المئينية 25","p":"الرتبة المئينية موقع نسبي، لا نسبة إجابات صحيحة."},{"id":"4-19","s":4,"i":"4.3","l":"تطبيق","t":"يحمل خالد وماجد تشخيص صعوبات تعلم في القراءة، فاقترح أحد الإداريين توحيد برنامجيهما توفيرًا للوقت. ما الرد المهني الأدق؟","o":["يُقبل توحيد الأهداف ويُكتفى بالاختلاف في عدد الحصص الأسبوعية لكل منهما","يُقبل التوحيد لأن التشخيص الواحد يعني احتياجات تعليمية متطابقة لهما","يُرفض لأن الأنظمة تمنع تشابه أي هدف بين طالبين في المدرسة نفسها","يُبنى كل برنامج من بيانات صاحبه، فقد يختلفان رغم التشخيص الواحد"],"a":3,"w":"التشخيص يصف نمطًا أو حالة، أما البرنامج فيجيب عمّا يحتاجه هذا الطالب تحديدًا. وطالبان يحملان التشخيص نفسه قد يحتاجان أهدافًا وخدمات مختلفة لاختلاف أدائهما الحالي ونقاط قوتهما وسياقهما.","n":["الأهداف نفسها يجب أن تُشتق من بيانات كل طالب.","التشخيص لا يساوي البرنامج ولا يحدد الاحتياج وحده.","تعليل مطلق غير صحيح؛ العبرة بالبيانات لا بمنع التشابه.","صحيح: الفردية شرط أساسي في البرنامج."],"c":"التشخيص نفسه واقتراح التوحيد","p":"البرنامج يُبنى على الطالب لا على قالب التشخيص."},{"id":"4-20","s":4,"i":"4.3","l":"تطبيق","t":"أظهر تقييم هتان فهمًا شفهيًا قويًا للنصوص المسموعة، مع ضعف واضح في فك الترميز يحد من قراءته المستقلة. ما التوظيف الأنسب لهذه النتائج في برنامجه؟","o":["الاكتفاء بالتعلم الشفهي في جميع المواد لأن نمط تعلمه سمعي ثابت","التركيز على فك الترميز وحده في كل الأهداف وإغفال قوته الشفهية","اعتبار قوته الشفهية دليلًا على أن صعوبته في القراءة مؤقتة وستزول","استثمار فهمه الشفهي للوصول إلى المحتوى مع تعليم فك الترميز صراحة"],"a":3,"w":"نقاط القوة ليست فقرة تجميلية؛ بل تُستخدم لاختيار طريقة التدريس وتوفير مسارات وصول إلى المحتوى. ومع ذلك لا تعالج القوة الصعوبة تلقائيًا، فيُعلَّم فك الترميز صراحة بوصفه حاجة ذات أولوية.","n":["يعتمد «نمط تعلم» ثابتًا ويهمل الحاجة القرائية.","يهمل نقطة قوة يمكن توظيفها في الوصول والدافعية.","وجود قوة في مجال لا ينفي الحاجة في مجال آخر.","صحيح: يبني على القوة ويعالج الحاجة معًا."],"c":"فهم شفهي قوي وضعف في فك الترميز","p":"ابنِ على القوة وعالج الحاجة مباشرة، ولا تحصر الطالب في «نمط تعلم»."},{"id":"4-21","s":4,"i":"4.3","l":"تحليل","t":"أظهر اختبار مقنن حديث أن أداء عمر في الحساب ضمن المتوسط، بينما تُظهر عينات عمله وملاحظات معلمه أخطاء متكررة في المسائل متعددة الخطوات. ما القرار المهني الأدق؟","o":["اعتماد نتيجة الاختبار المقنن وحدها لأنها الأدق والأكثر موضوعية","اعتماد ملاحظات المعلم وحدها لأنها الأقرب إلى أدائه الفعلي اليومي","فحص اختلاف متطلبات المهام وسياقها وجمع بيانات موجهة قبل الحكم","حساب متوسط المصدرين واعتماده خط أساس لهدف الحساب في البرنامج"],"a":2,"w":"عندما تتعارض النتائج لا نختار ما يوافق توقعنا؛ بل نفحص السياق ومتطلبات كل مهمة وجودة الأداة وحداثة البيانات، ثم نجمع ما يلزم. وقد يفسر الاختلاف أن الاختبار لم يتضمن مسائل متعددة الخطوات كالتي تظهر في الصف.","n":["إهمال البيانات الصفية لصالح الاختبار المقنن خطأ شائع.","انتقاء مصدر واحد دون تفسير التعارض.","صحيح: التعارض يستدعي التفسير لا الانتقاء.","دمج آلي لا يفسر سبب الاختلاف ولا يحدد الحاجة."],"c":"اختبار ضمن المتوسط وعينات بأخطاء متكررة","p":"نتائج متعارضة: افحص السياق وجودة البيانات واجمع بيانات موجهة."},{"id":"4-22","s":4,"i":"4.3","l":"معرفة","t":"ما المقصود بالتثليث (Triangulation) عند بناء البرنامج على نتائج التقييم؟","o":["البحث عن تقارب الأدلة من مصادر وطرق تقييم متعددة","تطبيق ثلاثة اختبارات مقننة على الطالب قبل أي قرار","مشاركة ثلاثة أعضاء من الفريق في تفسير النتائج","جمع البيانات في ثلاث جلسات متتالية خلال أسبوع واحد"],"a":0,"w":"التثليث لا يعني استخدام ثلاثة اختبارات حرفيًا، بل البحث عن تقارب الأدلة من مصادر وطرق متعددة: اختبار مقنن، وملاحظة، وعينات عمل، وقياس تقدم، ومعلومات الأسرة. وكلما تقاربت الأدلة كان القرار أقوى.","n":["صحيح: تقارب الأدلة لا عدد الاختبارات.","لا يشترط ثلاثة اختبارات حرفيًا.","يخلط بين التثليث وعدد أعضاء الفريق.","عدد الجلسات ليس جوهر التثليث."],"c":"المقصود بالتثليث","p":"التثليث تقارب أدلة من مصادر متعددة، لا رقم ثلاثة."},{"id":"4-23","s":4,"i":"4.3","l":"تطبيق","t":"كشف تقييم يوسف عن ثماني حاجات، منها: فك الترميز، والطلاقة، والإملاء، وتنظيم الأدوات، وجمال الخط، وسرعة الإنجاز. كيف يحدد الفريق أهداف برنامجه؟","o":["كتابة هدف مستقل لكل حاجة من الحاجات الثماني لضمان شمول البرنامج","اختيار أسهل الحاجات ليحقق الطالب نجاحًا سريعًا يرفع دافعيته","ترتيب الحاجات حسب أثرها في التعلم والمشاركة واختيار أهداف محورية","اختيار الحاجات الأكثر شيوعًا لدى الطلاب الذين يحملون تشخيصه"],"a":2,"w":"تُرتب الاحتياجات بحسب أثرها في التعلم والمشاركة والاستقلال، والأولوية الأعلى غالبًا للمهارة الأساسية التي تعوق عدة مجالات أو تمنع تقدمًا لاحقًا. فالجودة في اختيار أهداف محورية قابلة للمتابعة لا في عددها.","n":["كثرة الأهداف تشتت التدريس وتضعف المتابعة.","السهولة ليست معيار الأولوية.","صحيح: ليست كل فجوة هدفًا.","يبني على قالب التشخيص لا على بيانات الطالب."],"c":"ثماني حاجات","p":"رتّب الحاجات بأثرها، واختر الأهداف المحورية لا الأكثر عددًا."},{"id":"4-24","s":4,"i":"4.3","l":"تطبيق","t":"عند إعداد برنامج نورة الجديد وجد الفريق أن آخر تقييم شامل لها أُجري قبل عامين، وتشير ملاحظات معلمتها الحالية إلى تغير واضح في أدائها. ما الإجراء الأنسب؟","o":["بناء البرنامج على التقييم السابق لأنه أشمل وأدق من ملاحظات المعلمة","تحديث البيانات بتقييم موجه لأدائها الحالي قبل صياغة الأهداف","نسخ أهداف البرنامج السابق مع رفع نسب الإتقان المطلوبة فيها","الاكتفاء بملاحظات المعلمة الحالية وحدها مصدرًا لمستوى الأداء"],"a":1,"w":"عندما تكون البيانات قديمة أو لا تمثل الأداء الحالي يُستكمل التقييم قبل القرار المهم؛ فمستوى الأداء الحالي يجب أن يصف أين الطالبة الآن. ولا تُملأ الفجوة بالتخمين أو بنسخ البرنامج السابق.","n":["البيانات القديمة قد لا تمثل الأداء الحالي.","صحيح: لا يُبنى قرار مهم على بيانات لا تمثل الحاضر.","يتجاهل التغير ويبني على افتراض لا على بيانات.","مصدر واحد لا يكفي لبناء مستوى أداء شامل."],"c":"تقييم قبل عامين وتغير واضح","p":"بيانات قديمة أو متعارضة: تحقق قبل القرار، ولا تخمّن."},{"id":"4-25","s":4,"i":"4.3","l":"تحليل","t":"اقتُرح نقل توصيات تقرير الأخصائي النفسي كما هي إلى خانة الأهداف في برنامج راكان، ومنها: «تنمية الذاكرة العاملة» و«تحسين الانتباه». ما الخلل في هذا الإجراء؟","o":["لا خلل فيه؛ فتوصيات المختص تتحول تلقائيًا إلى أهداف للبرنامج","الخلل أن التقرير النفسي لا قيمة له في بناء البرنامج التربوي","التوصيات لا تصبح أهدافًا قبل ترجمتها إلى أداء يُقاس","الخلل في عدد التوصيات فقط، والأصح الاكتفاء بواحدة منهما"],"a":2,"w":"نسخ توصيات التقرير حرفيًا كأهداف خطأ شائع؛ فالعبارتان لا تحددان سلوكًا قابلًا للملاحظة ولا محكًا ولا سياقًا. ويجب أولًا تحديد الأثر التعليمي للحاجة، مثل فقد خطوات التعليمات الطويلة، ثم صياغة هدف أداء مرتبط به.","n":["التشخيص والتوصيات لا تتحول آليًا إلى أهداف.","التقرير مصدر مهم يُفسَّر ويُدمج لا يُهمل.","صحيح: الترجمة التربوية حلقة لازمة.","العدد ليس المشكلة؛ المشكلة غياب الأداء القابل للقياس."],"c":"نقل التوصيات كما هي إلى الأهداف","p":"التشخيص يصف، والبرنامج يترجم الوصف إلى أداء قابل للقياس."},{"id":"4-26","s":4,"i":"4.4","l":"معرفة","t":"كُتب في خطة درس «الفكرة الرئيسة»: «ينمذج المعلم تفكيره بصوت مسموع، ثم يوجه الطلاب في ممارسة مشتركة». إلى أي عناصر التخطيط تنتمي هذه العبارة؟","o":["الهدف التعليمي للدرس","أداة التقويم في الدرس","التكييف الفردي للطالب","الاستراتيجية التدريسية"],"a":3,"w":"الهدف هو الأداء المراد إتقانه، والنشاط هو المهمة التي يمارس من خلالها الطالب الهدف، والاستراتيجية هي طريقة التدريس المنظمة كالنمذجة ثم الممارسة الموجهة، والتقويم طريقة التحقق من التعلم. والخلط بينها خطأ شائع في الاختبار.","n":["الهدف يصف أداء الطالب المتوقع لا إجراءات المعلم.","التقويم طريقة التحقق من حدوث التعلم.","التكييف تغيير في الوصول لطالب بعينه عند الحاجة.","صحيح: تصف كيف ينظم المعلم التعليم."],"c":"ينمذج المعلم ثم يوجه الممارسة","p":"النشاط ما يفعله الطالب، والاستراتيجية كيف ينظم المعلم التعليم."},{"id":"4-27","s":4,"i":"4.4","l":"تطبيق","t":"يدرس طلاب الصف الخامس «القسمة الطويلة»، وتُظهر بيانات بدر أنه لا يتقن حقائق الضرب اللازمة لها. ماذا يخطط معلم غرفة المصادر؟","o":["تدريس صفحة القسمة الحالية نفسها كما في الفصل حرفيًا دون أي تغيير","استبدال القسمة بأهداف في الجمع لأنه أسهل ويناسب مستواه الحالي","تعليم حقائق الضرب اللازمة للوصول إلى القسمة وربطها بمسائل الصف","تأجيل الرياضيات كلها حتى يرتفع مستواه في القراءة أولًا"],"a":2,"w":"قد تكون الأولوية في غرفة المصادر لمعالجة مهارة سابقة أساسية تعوق وصول الطالب إلى المنهج، مع الحفاظ على ارتباط وظيفي واضح بالمنهج العام. فالبرنامج الفردي والمنهج يتكاملان ولا يسيران في مسارين منفصلين.","n":["غرفة المصادر لا تكرر درس الفصل حرفيًا بالضرورة.","يفصل الطالب عن المنهج ويخفض الغاية دون مبرر.","صحيح: يبني جسرًا بين مستواه وغاية المنهج.","لا علاقة للقراءة بالمتطلب المفقود هنا."],"c":"لا يتقن حقائق الضرب اللازمة","p":"عالج المهارة السابقة اللازمة للوصول، واربطها بغاية المنهج."},{"id":"4-28","s":4,"i":"4.4","l":"تطبيق","t":"الهدف في خطة جود: «أن تميّز بين الاسم والفعل في جمل قصيرة». أي الأنشطة الآتية أكثر اتساقًا مع هذا الهدف؟","o":["تلوين رسومات لحيوانات تؤدي أفعالًا مختلفة في صورة كبيرة","نسخ الجمل القصيرة من الكتاب بخط جميل في دفتر الواجبات","تصنيف كلمات جمل جديدة إلى أسماء وأفعال مع تعليل مختصر","الاستماع إلى أنشودة عن أقسام الكلام وترديدها جماعيًا"],"a":2,"w":"التخطيط يبدأ بالهدف ثم يُختار نشاط يجعل الطالبة تمارس المهارة نفسها ويتيح للمعلمة رؤية الأداء وقياسه. والنشاط قد يكون جذابًا لكنه ضعيف إذا استهلك جهد الطالبة في متطلبات جانبية.","n":["نشاط جذاب لا يتطلب التمييز المستهدف.","يمارس مهارة جانبية هي النسخ.","صحيح: تمارس الهدف نفسه ويمكن ملاحظة أدائها.","ترديد جماعي لا يكشف أداء الطالبة ولا يمارس التمييز."],"c":"أن تميّز بين الاسم والفعل","p":"اختر النشاط الأقرب إلى ممارسة الهدف نفسه، لا الأكثر متعة."},{"id":"4-29","s":4,"i":"4.4","l":"تحليل","t":"تُظهر بيانات عبدالرحمن في كتابة الفقرة أنه حقق 90% من معايير قائمة الخطوات مع وجود نموذج أمامه في آخر أربع جلسات، وما زالت الخطة تنص على تقديم النموذج نفسه في كل جلسة. ما الخلل في التخطيط؟","o":["غياب خطة لخفض الدعم تدريجيًا نحو الأداء المستقل رغم ثبات الإتقان","ارتفاع نسبة الإتقان المطلوبة، والأنسب خفضها إلى مستوى أدنى","قلة الدعم المقدم، والأنسب إضافة نموذج ثانٍ أكثر تفصيلًا للفقرة","عدم الانتقال إلى مهارة جديدة لا ترتبط بالكتابة على الإطلاق"],"a":0,"w":"السقالات مؤقتة ويُخطط لتلاشيها منذ البداية. وثبات الإتقان مع النموذج في جلسات متتالية قرينة على أن الخطوة التالية خفض الدعم تدريجيًا ومراقبة الأداء المستقل، لا إبقاء المساعدة الدائمة التي تولّد الاعتماد.","n":["صحيح: الدعم الثابت بعد الإتقان يولّد الاعتماد.","الأداء مرتفع أصلًا؛ المشكلة في الدعم لا المحك.","يزيد الدعم في وقت ينبغي فيه خفضه.","الخطوة التالية الاستقلال في المهارة نفسها لا تركها."],"c":"90% في أربع جلسات والنموذج مستمر","p":"بعد الإتقان مع الدعم، خطّط للاستقلال لا لمزيد من المساعدة."},{"id":"4-30","s":4,"i":"4.4","l":"معرفة","t":"أي الممارسات الآتية تعكس التصميم الشامل للتعلم (UDL) بصورة صحيحة؟","o":["تخطيط بدائل متعددة للتمثيل والمشاركة والتعبير منذ تصميم الدرس","تصنيف كل طالب نمطًا بصريًا أو سمعيًا ثابتًا وتدريسه وفقه دائمًا","تقديم تقنية مساعدة فردية لطالب بعد ظهور الحاجز لديه في الدرس","خفض أهداف الدرس للطلاب ذوي الصعوبات منذ بداية التخطيط له"],"a":0,"w":"التصميم الشامل للتعلم إطار وصول مرن يخطط منذ البداية لطرائق متعددة للمشاركة وتمثيل المعلومات والعمل والتعبير بما يخدم الهدف. ولا يعني تصنيف الطلاب في أنماط تعلم ثابتة، ولا يلغي الحاجة إلى تدخلات فردية عند الضرورة.","n":["صحيح: مرونة استباقية في التصميم.","التصميم الشامل لا يقوم على أنماط تعلم ثابتة.","هذا دعم فردي لاحق، والتصميم الشامل استباقي للجميع.","التصميم الشامل يقلل الحواجز مع الحفاظ على الهدف."],"c":"التصميم الشامل للتعلم","p":"التصميم الشامل بدائل مرنة من البداية للجميع، لا أنماط تعلم ثابتة."},{"id":"4-31","s":4,"i":"4.4","l":"تطبيق","t":"خطط المعلم لنشاط تعاوني في حل المسائل اللفظية، فلاحظ أن زميل زياد في المجموعة يحل المسائل ويكتفي زياد بنسخ الإجابات. ما التعديل الأنسب على النشاط؟","o":["إلغاء التعلم التعاوني نهائيًا من خطط زياد في جميع المواد الدراسية","ترك الوضع كما هو لأن النسخ من الزميل نوع من التعلم بالنمذجة","تحديد أدوار ومسؤولية فردية يؤدي فيها زياد جزءًا يُقيَّم عليه","نقل زياد إلى مجموعة أخرى دون أي تغيير في بنية النشاط نفسه"],"a":2,"w":"التعلم التعاوني ليس مجرد جلوس في مجموعات؛ بل يحتاج هدفًا واضحًا وأدوارًا ومسؤولية فردية وفرص مشاركة حقيقية. والفخ الأكبر لطالب صعوبات التعلم أن يؤدي الزميل المهمة بدلًا منه.","n":["إلغاء مطلق يحرمه فوائد النشاط إذا أُحسن تنظيمه.","الزميل يؤدي المهمة بدل الطالب، وهذا ليس نمذجة.","صحيح: المسؤولية الفردية شرط التعلم التعاوني الفعال.","تغيير المجموعة لا يعالج غياب المسؤولية الفردية."],"c":"الزميل يحل وزياد ينسخ","p":"تعاون بلا مسؤولية فردية يعني زميلًا يتعلم وطالبًا ينسخ."},{"id":"4-32","s":4,"i":"4.4","l":"تطبيق","t":"في منتصف درس «جمع الكسور المتشابهة» يريد المعلم معرفة ما إذا كان طلابه يحتاجون إلى إعادة النمذجة قبل الانتقال إلى الممارسة المستقلة. ما الإجراء الأنسب؟","o":["تأجيل الحكم إلى الاختبار النهائي للوحدة لضمان دقة البيانات","سؤال الطلاب جماعيًا «هل فهمتم؟» والاكتفاء بإجابتهم الجماعية","الانتقال مباشرة إلى الممارسة المستقلة لأن الخطة الزمنية لا تسمح","طرح مسألتين قصيرتين يحلهما كل طالب وتحليل إجاباته لتحديد الخطوة التالية"],"a":3,"w":"التقويم التكويني جزء من التدريس، ويخبر المعلم: أستمر؟ أعيد النمذجة؟ أزيد الممارسة؟ أغير المثال؟ ومهمة قصيرة يؤديها كل طالب تنتج بيانات فردية قابلة للتحليل، بخلاف السؤال الجماعي أو انتظار الاختبار النهائي.","n":["انتظار الاختبار النهائي يفوّت التصحيح في وقته.","الإجابة الجماعية لا تكشف أداء كل طالب.","يتجاهل البيانات التي تحدد جاهزية الطلاب.","صحيح: تقويم تكويني فردي يقود القرار."],"c":"في منتصف الدرس قبل الانتقال","p":"لا تنتظر الاختبار النهائي لتكتشف أن الطالب لم يفهم الخطوة الأولى."},{"id":"4-33","s":4,"i":"4.4","l":"تحليل","t":"أتقنت لمى استخراج الفكرة الرئيسة في نصوص «لغتي» داخل غرفة المصادر، لكنها لا تستخدم المهارة في نصوص العلوم، كما تراجع أداؤها بعد أسبوعين من توقف التدريب. ما التعديل الأنسب على التخطيط؟","o":["إعادة تدريس المهارة من البداية بنصوص «لغتي» نفسها لضمان إتقانها","خفض الهدف إلى استخراج الفكرة الرئيسة في النصوص القصيرة فقط","زيادة الدعم في غرفة المصادر وتأجيل نصوص العلوم إلى العام القادم","مراجعة تراكمية موزعة وتطبيق المهارة في نصوص العلوم مع معلمتها"],"a":3,"w":"البيانات تكشف مشكلتين: ضعف التعميم عبر المحتوى، وضعف الاحتفاظ بعد توقف التدريب. والتخطيط الفعال يتضمن مراجعة تراكمية موزعة لمنع النسيان، وتطبيق المهارة في مواد وسياقات جديدة بالتنسيق مع معلم التعليم العام.","n":["المهارة مكتسبة؛ المشكلة في النقل والاحتفاظ.","خفض الهدف لا يعالج سبب التراجع.","يحصر النجاح في بيئة واحدة ويؤجل التعميم.","صحيح: يعالج التعميم والاحتفاظ معًا."],"c":"لا تستخدمها في العلوم وتراجعت بعد أسبوعين","p":"بعد الإتقان: مراجعة تراكمية للاحتفاظ، وتنويع المحتوى للتعميم."},{"id":"4-34","s":4,"i":"4.5","l":"معرفة","t":"تستخدم المعلمة سبورة تفاعلية مع جميع طالبات الفصل لعرض الدروس، بينما تستخدم ريم وحدها برنامج تحويل النص إلى كلام لتجاوز صعوبتها في فك الترميز. ما التصنيف الأدق للأداتين؟","o":["السبورة تقنية تعليمية عامة، وبرنامج ريم تقنية مساعدة","كلتاهما تقنية مساعدة لأنهما تُستخدمان داخل الفصل الدراسي نفسه","السبورة تقنية مساعدة، وبرنامج ريم تكييف لا علاقة له بالتقنية","كلتاهما تصميم شامل للتعلم لأنهما تعرضان المحتوى بطرق متعددة"],"a":0,"w":"التقنية المساعدة تُختار أو تُخصص لزيادة الأداء الوظيفي لحاجة فردية وحاجز محدد، أما التقنية التعليمية العامة فتُستخدم لتحسين التعليم والتفاعل لجميع المتعلمين. وقد تصبح الأداة العامة مساعدة إذا خُصص استخدامها لإزالة حاجز فردي.","n":["صحيح: المنطلق عام في الأولى وفردي في الثانية.","مكان الاستخدام لا يحدد نوع التقنية.","عكسٌ للمفهومين؛ البرنامج تقنية مساعدة توظَّف تكييفًا.","التصميم الشامل نهج تصميم استباقي لا اسم لأداة بعينها."],"c":"لجميع الطالبات مقابل ريم وحدها","p":"حاجة فردية وحاجز وظيفي: تقنية مساعدة؛ استخدام عام: تقنية تعليمية."},{"id":"4-35","s":4,"i":"4.5","l":"تطبيق","t":"أبلغت أسرة عبدالعزيز المدرسة باستعدادها لشراء جهاز لوحي متقدم لمساعدته في الكتابة. ما الإجراء الأول الأنسب للفريق؟","o":["قبول الشراء فورًا ثم اختيار التطبيقات المناسبة بعد استلام الجهاز","تحديد المهمة الكتابية والحاجز والهدف المطلوب قبل اختيار الأداة","اختيار أشهر تطبيق كتابة يستخدمه الطلاب في المدارس الأخرى","رفض العرض لأن الأدوات منخفضة التقنية أفضل دائمًا من المتقدمة"],"a":1,"w":"البرنامج الفعال يبدأ بالحاجز لا بالجهاز: ما المهمة التي يريد الطالب إنجازها؟ وما الذي يمنعه؟ ثم تُدرس البدائل وتُجرب. وقد يكون الحل منخفض التقنية أو عاليها، فالأفضل ما يحسن الأداء الوظيفي ويناسب الطالب والبيئة.","n":["يبدأ بالأداة قبل معرفة الحاجة.","صحيح: الحاجز والهدف قبل الجهاز.","الشهرة ليست معيارًا لملاءمة الأداة.","حكم مطلق؛ مستوى التقنية يُختار وفق الحاجة."],"c":"استعداد لشراء جهاز متقدم","p":"ابدأ بالمهمة والحاجز والهدف، ثم اختر الأداة."},{"id":"4-36","s":4,"i":"4.5","l":"تحليل","t":"يستخدم خالد برنامج تحويل النص إلى كلام بنجاح في حصص العلوم، فاقترح أحد المعلمين تشغيله له أيضًا في اختبار يقيس مهارة فك الترميز نفسها. ما الحكم الأدق؟","o":["مناسب، لأن ما يصلح تكييفًا في مادة يصلح في جميع الاختبارات الأخرى","غير مناسب في الحالتين، لأن الأدوات الصوتية تحرم الطالب من التعلم","غير مناسب في هذا الاختبار لأنه يؤدي المهارة المقاسة عنه","مناسب بشرط أن يُعطى خالد وقتًا إضافيًا في أثناء الاختبار"],"a":2,"w":"تحويل النص إلى كلام تكييف مناسب للوصول إلى محتوى العلوم حين لا تكون القراءة هي البناء المقاس، لكنه يفسد قياس فك الترميز لأنه يقرأ بدل الطالب. والقاعدة: افصل بين المهارة المستهدفة والحاجز الذي نريد إزالته.","n":["صلاحية التكييف تتبع البناء المقاس في كل موقف.","في العلوم يزيل حاجز الوصول دون تغيير الهدف.","صحيح: يفصل بين المهارة المستهدفة والحاجز المراد إزالته.","الوقت الإضافي لا يمنع الأداة من القراءة عنه."],"c":"اختبار يقيس فك الترميز نفسها","p":"لا تجعل التقنية تلغي المهارة التي تريد قياسها."},{"id":"4-37","s":4,"i":"4.5","l":"تطبيق","t":"تفقد غادة موضعها في السطر أثناء القراءة، فجرّبت المعلمة دليل سطر ورقيًا فتحسنت دقتها واستقلالها، بينما يقترح زميل شراء قارئ إلكتروني متقدم بدلًا منه. ما القرار الأنسب؟","o":["الاستمرار بدليل السطر ما دام يحقق الوظيفة مع متابعة البيانات","شراء القارئ الإلكتروني لأن الأداة الأحدث تكون أكثر فاعلية دائمًا","استخدام الأداتين معًا لضمان أعلى قدر ممكن من الدعم لغادة","إيقاف الدليل الورقي لأنه قد يُشعرها بالاختلاف عن زميلاتها"],"a":0,"w":"التقنية الأفضل ليست الأغلى ولا الأحدث، بل التي تحسن الأداء الوظيفي وتناسب الطالب والبيئة ويمكن استخدامها باستمرار. وأداة بسيطة كدليل السطر قد تتفوق على جهاز متقدم إذا حققت الوظيفة بكفاءة واستقلالية.","n":["صحيح: أبسط حل فعال مثبت الأثر.","الأعلى تقنية ليس بالضرورة الأفضل.","دعم زائد بلا حاجة قد يقلل الاستقلال.","لا بيانات على رفضها، والأداة أثبتت أثرها."],"c":"دليل ورقي حسّن الدقة والاستقلال","p":"أبسط حل فعال يزيد الاستقلال مقدَّم على الأحدث."},{"id":"4-38","s":4,"i":"4.5","l":"معرفة","t":"أي مما يلي «لا» يصلح مؤشرًا على فاعلية تقنية مساعدة بعد تجربتها مع الطالب؟","o":["تحسن دقة أدائه في المهام التي كانت تتأثر بالحاجز","كثرة الساعات التي يشغّل فيها الطالب الجهاز أسبوعيًا","انخفاض اعتماده على المساعدة البشرية في إنجاز المهمة","استخدامه الأداة في سياقات مناسبة خارج غرفة المصادر"],"a":1,"w":"فاعلية التقنية تُقاس بالأداء والكفاءة والاستقلال والمشاركة والتعميم، لا بمجرد تشغيل الجهاز أو عدد ساعات استخدامه. فالنجاح هو انتقال أثر الأداة إلى الأداء الحقيقي في البيئات المستهدفة.","n":["مؤشر صالح: جودة الأداء.","صحيح: مجرد الاستخدام لا يثبت تحسن الأداء.","مؤشر صالح: الاستقلال.","مؤشر صالح: التعميم."],"c":"«لا» يصلح مؤشرًا على الفاعلية","p":"النجاح يُقاس بالأداء والاستقلال لا بساعات الاستخدام."},{"id":"4-39","s":4,"i":"4.5","l":"تحليل","t":"جُرّب لأنس تطبيق للإملاء الصوتي فنجح في غرفة المصادر الهادئة، لكنه لم يعمل جيدًا في الفصل بسبب الضوضاء، ولا يتوافر اتصال بالشبكة في بعض القاعات. ما الذي أغفله الفريق عند الاختيار؟","o":["مراعاة البيئة التي ستُستخدم فيها الأداة وتوافقها معها","اختيار أداة أعلى تقنية من الإملاء الصوتي تتناسب مع حداثة الفصل","تحديث تشخيص أنس بدقة قبل تجربة أي أداة كتابية معه","الحصول على موافقة قائد المدرسة على شراء التطبيق مسبقًا"],"a":0,"w":"اختيار التقنية يراعي الطالب والبيئة والمهمة والأداة معًا: أين ستُستخدم؟ هل تعمل مع أجهزة المدرسة واتصالها؟ من سيدعمها؟ ونجاح الأداة في بيئة هادئة لا يضمن نجاحها في الفصل، لذلك تُجرب في السياق الحقيقي قبل اعتمادها.","n":["صحيح: البيئة ركن في اختيار التقنية.","المشكلة في التوافق مع البيئة لا في مستوى التقنية.","التشخيص ليس سبب الإخفاق؛ الأداة نجحت في بيئة أخرى.","الإجراء الإداري لا يعالج عدم ملاءمة البيئة."],"c":"نجح في الهدوء وأخفق في الفصل","p":"جرّب الأداة في البيئة الحقيقية التي ستُستخدم فيها."},{"id":"4-40","s":4,"i":"4.5","l":"تطبيق","t":"توقف بندر عن استخدام قارئ النصوص الذي أثبتت التجربة فاعليته في غرفة المصادر، وذكر أنه يُحرج من وضع السماعات أمام زملائه في الفصل. ما الاستجابة المهنية الأنسب؟","o":["إلزامه باستخدام القارئ ما دامت البيانات قد أثبتت فاعليته معه","مناقشة القبول معه وتجريب بديل أكثر اندماجًا يؤدي الوظيفة","إلغاء التقنية من برنامجه نهائيًا والاكتفاء بقراءته المستقلة","تجاهل رأيه لأن الطالب لا يشارك في قرارات التقنية المساعدة"],"a":1,"w":"من أسباب هجر التقنية الوصمة الاجتماعية، والاستجابة المهنية اختيار حل أكثر اندماجًا ومشاركة الطالب في القرار. فقبول الطالب وسهولة الاستخدام عاملان أساسيان في استمرار الأداة، لا الفاعلية في غرفة المصادر وحدها.","n":["الإلزام يتجاهل سبب الهجر وقد يعمّقه.","صحيح: قبول الطالب عامل في استمرار التقنية.","يترك الحاجز دون حل.","صوت الطالب جزء من القرار ومن نجاح الأداة."],"c":"يُحرج من السماعات أمام زملائه","p":"الأداة التي لا يقبلها الطالب لن يستخدمها؛ أشركه في الاختيار."},{"id":"4-41","s":4,"i":"4.5","l":"تطبيق","t":"وفّر الفريق لدانة برنامج معالجة نصوص مع خاصية التنبؤ بالكلمات، وبعد شهر لم يتحسن إنتاجها الكتابي، ثم تبيّن أنها لم تتلقَّ أي تدريب على استخدامه. ما الإجراء الأنسب؟","o":["استبدال البرنامج بجهاز أحدث لأن البيانات أثبتت فشل الأداة الحالية","تدريبها ومن يدعمها على استخدامه في مهام حقيقية ثم قياس أثره","الحكم بأن دانة لا تستفيد من التقنية والعودة إلى الكتابة اليدوية","زيادة مدة استخدامها البرنامج يوميًا دون تغيير في طريقة الدعم"],"a":1,"w":"الأداة بلا تدريب قد تفشل؛ لذلك يُدرَّب الطالب داخل المهمة الحقيقية، ويُدرَّب المعلمون والأسرة إذا كانوا مسؤولين عن الدعم، ثم تُقاس الفاعلية. فالحكم على الأداة قبل توفير التدريب حكم على شروط غير مكتملة.","n":["البيانات لا تقيس الأداة ما دامت لم تُستخدم بتدريب كافٍ.","صحيح: التدريب جزء من الخدمة.","حكم متسرع قبل توفير شروط النجاح.","زيادة الاستخدام دون تدريب لا تعالج السبب."],"c":"لم تتلقَّ أي تدريب على استخدامه","p":"لا تحكم على التقنية قبل تدريب الطالب ومن يدعمه عليها."},{"id":"5-01","s":5,"i":"5.1","l":"معرفة","t":"أي العبارات الآتية تعبّر بدقة عن مفهوم التدخل المبكر؟","o":["برنامج تعليمي عام يقدَّم لجميع أطفال ما قبل المدرسة لتسريع اكتسابهم المهارات الأكاديمية قبل الصف الأول.","فحص سريع لجميع الأطفال قبل الالتحاق بالروضة لتحديد من تظهر لديهم مؤشرات نمائية تستدعي المتابعة أو الإحالة.","جلسات علاجية فردية يقدمها مختص في مركز متخصص للطفل الذي ثبت تشخيصه بإعاقة محددة دون غيره.","منظومة خدمات منسقة للأطفال الصغار ذوي الإعاقة أو التأخر أو المعرضين للخطر ولأسرهم، تدعم النمو والمشاركة مبكرًا."],"a":3,"w":"التدخل المبكر نظام دعم منسق يستهدف الأطفال الصغار ذوي الإعاقة أو التأخر النمائي أو المعرضين للخطر، ويشمل أسرهم، ويهدف إلى دعم النمو والوظائف اليومية وتقليل أثر الصعوبات قبل اتساع الفجوة. أما الفحص فجزء من الكشف المبكر، والجلسة المنفردة أحد مكونات التدخل لا كله، والتعليم المبكر العام موجّه لجميع الأطفال.","n":["هذا تعليم مبكر عام لجميع الأطفال، لا دعم لاحتياجات نمائية خاصة.","هذا وصف للكشف المبكر والمسح، وهو مدخل للتدخل لا التدخل نفسه.","يختزل التدخل في جلسة منفصلة ويشترط التشخيص المسبق.","صحيح: منظومة منسقة تشمل الطفل والأسرة."],"c":"منظومة خدمات منسقة للطفل والأسرة","p":"التدخل المبكر منظومة دعم للطفل والأسرة، وليس فحصًا ولا جلسة ولا تشخيصًا."},{"id":"5-02","s":5,"i":"5.1","l":"معرفة","t":"وفق ما تعتمده أدلة وزارة التعليم في المملكة العربية السعودية، ما الفئة العمرية التي توجَّه إليها خدمات التدخل المبكر للأطفال ذوي الإعاقة والمعرضين للخطر؟","o":["الأطفال من الولادة حتى سن التاسعة.","الأطفال من الولادة حتى سن الثالثة فقط.","الأطفال دون سن السادسة.","الأطفال من الثالثة حتى نهاية الصف الثالث."],"a":2,"w":"تستهدف خدمات التدخل المبكر في السياق السعودي الأطفال دون سن السادسة، مع تنظيم خدمات خاصة في رياض الأطفال للفئة من 3 إلى 6 سنوات. أما حد الثالثة فيرتبط بإطار IDEA Part C الأمريكي وخطة IFSP، ولا يُعمَّم قاعدةً سعودية، كما لا يُعتمد «حتى 9 سنوات» تحديدًا عامًّا للتدخل المبكر.","n":["تحديد غير معتمد للتدخل المبكر في هذا المعيار.","هذا حد إطار IDEA Part C الأمريكي، لا القاعدة السعودية.","صحيح: دون السادسة في السياق السعودي.","يخلط بين التدخل المبكر والصفوف الأولية في المدرسة."],"c":"أدلة وزارة التعليم في المملكة","p":"في الرخصة السعودية: التدخل المبكر لما دون السادسة، والثالثة حدّ أمريكي يخص IFSP."},{"id":"5-03","s":5,"i":"5.1","l":"معرفة","t":"يُستشهد بالمرونة العصبية مبررًا علميًّا للتدخل المبكر. ما العبارة الأدق عنها؟","o":["تستمر مدى الحياة، لكنها تكون مرتفعة جدًّا في الطفولة المبكرة.","تبلغ ذروتها في السنوات الأولى ثم تتوقف تمامًا بعد سن السادسة.","تقتصر على الأطفال غير المعرضين للخطر ولا تظهر لدى ذوي الإعاقة.","تضمن زوال الإعاقة إذا بدأ التدخل قبل نهاية السنة الثالثة."],"a":0,"w":"الصواب تصحيح خرافة «النافذة المغلقة»: المرونة العصبية مستمرة طوال العمر، لكنها مرتفعة في السنوات الأولى، ولذلك يُعد البدء المبكر استثمارًا لفرصة تعلم عالية. كما أن التدخل المبكر يقلل الأثر ويحسن المسار النمائي ولا يضمن إزالة الإعاقة.","n":["صحيح: مستمرة ومرتفعة في الطفولة المبكرة.","خطأ شائع: المرونة العصبية لا تنتهي عند السادسة.","لا أساس لحصرها في فئة دون أخرى.","وعد مطلق؛ التدخل يقلل الأثر ولا يضمن زوال الإعاقة."],"c":"العبارة الأدق عن المرونة العصبية","p":"استبعد «تتوقف تمامًا» و«تضمن زوال الإعاقة»؛ الصياغة العلمية هنا غير مطلقة."},{"id":"5-04","s":5,"i":"5.1","l":"تطبيق","t":"أم ريم (سنتان ونصف) قلقة لأن ابنتها لا تستخدم سوى كلمات قليلة وتبكي لتطلب ما تريد، وقد نصحها أحد الأقارب بالانتظار حتى دخول المدرسة. ما الإجراء الأنسب مهنيًّا؟","o":["طمأنة الأم بأن الفروق الفردية بين الأطفال واسعة، ومتابعة نمو الكلام عند دخول الروضة.","انتظار صدور تشخيص نهائي لنوع الاضطراب قبل تقديم أي دعم تربوي لها.","تسجيل ريم في برنامج مكثف لتعليم الحروف والأرقام حتى تعوّض تأخرها قبل المدرسة.","تقييم مناسب للتواصل ودعم مبكر يعلّم ريم طريقة طلب وظيفية داخل روتين الأسرة."],"a":3,"w":"لدى ريم حاجة وظيفية حالية؛ فهي تبكي لتطلب احتياجاتها، وهذا يؤثر في مشاركتها اليومية. والانتظار غير المبرر يفوّت فرصة الدعم في مرحلة نمو سريع، والاستجابة الأقوى تجمع تقييمًا مناسبًا ودعمًا وظيفيًّا داخل الروتين بمشاركة الأسرة، دون تعليق الدعم على تسمية تشخيصية.","n":["انتظار سلبي رغم وجود أثر وظيفي واضح.","لا يُعلَّق الدعم الآمن على اكتمال التشخيص.","هدف أكاديمي لا يعالج حاجة التواصل الوظيفية.","صحيح: تقييم ودعم وظيفي مبكر داخل الروتين."],"c":"تبكي لتطلب ما تريد","p":"حاجة واضحة ذات أثر وظيفي = تدخل مبكر الآن، لا انتظار حتى المدرسة."},{"id":"5-05","s":5,"i":"5.1","l":"تطبيق","t":"تعلّم عبدالله (3 سنوات) في المركز أن يطلب الماء بإشارة، لكن أسرته تذكر أنه لا يستخدمها في البيت. ما الخطوة الأقوى؟","o":["زيادة عدد الجلسات في المركز حتى تثبت الإشارة لديه.","تحليل فرص الطلب في روتين المنزل وتدريب الأسرة على استثمارها.","استبدال الإشارة بكلمة منطوقة لأنها أسهل على أفراد الأسرة في الفهم.","إيقاف الهدف مؤقتًا لأنه لم يتحقق في جميع البيئات بعد."],"a":1,"w":"المهارة مكتسبة داخل الجلسة، فالمشكلة في التعميم لا في التعلم. والحل الأدق إدخال المهارة في الروتين الطبيعي كالوجبات واللعب، وتمكين الأسرة من خلق فرص طلب متكررة ومتابعة استخدامها.","n":["زيادة الجلسات لا تعالج غياب الفرص في المنزل.","صحيح: التعميم يحتاج روتينًا طبيعيًّا وأسرة مدرَّبة.","يغيّر الوسيلة دون مبرر من البيانات.","إيقاف هدف ناجح جزئيًّا يهدر ما تعلمه."],"c":"في المركز ... لا يستخدمها في البيت","p":"ينجح في الجلسة ولا يظهر في المنزل = مشكلة تعميم ← روتين وأسرة."},{"id":"5-06","s":5,"i":"5.1","l":"تطبيق","t":"تضمنت خطة التدخل المبكر للطفلة جود تمارين منزلية منفصلة مدتها ساعة يوميًّا، فأبلغت الأم أنها لا تستطيع الالتزام بسبب عملها ورعاية إخوتها. ما الإجراء الأنسب؟","o":["التأكيد للأم أن نجاح الخطة مرهون بالتزامها الكامل بالمدة المحددة.","نقل جميع الأهداف إلى المركز لأن الأسرة لا تستطيع التطبيق في المنزل.","إعادة تصميم الدعم ليُدمج في روتين الأسرة القائم كالوجبات واللبس.","تقليص الأهداف إلى هدف واحد يختاره الفريق دون مناقشة الأسرة."],"a":2,"w":"الممارسة المرتكزة على الأسرة تراعي مواردها وروتينها، ولا تحمّلها برنامجًا غير قابل للتطبيق. ودمج الأهداف في مواقف يومية متكررة يزيد فرص الممارسة والتعميم دون عبء إضافي، ويحافظ على الأسرة شريكًا في القرار.","n":["يحمّل الأسرة برنامجًا غير واقعي ويلومها ضمنًا.","يُقصي الأسرة ويضعف التعميم.","صحيح: تكييف الدعم مع روتين الأسرة ومواردها.","قرار أحادي يتجاهل شراكة الأسرة في الأولويات."],"c":"لا تستطيع الالتزام بسبب عملها","p":"عند تعذر التطبيق: كيّف الدعم مع روتين الأسرة بدل زيادة العبء أو إقصائها."},{"id":"5-07","s":5,"i":"5.1","l":"تحليل","t":"طفل عمره سنتان لديه تأخر حركي واضح يؤثر في تنقله داخل البيت. اقترح بعض أعضاء الفريق الانتظار ستة أشهر لمعرفة هل سيلحق بأقرانه تلقائيًّا، واقترح آخرون بدء دعم حركي آمن داخل الروتين مع قياس التقدم. ما التحليل الأدق؟","o":["الانتظار أنسب؛ لأن التدخل قبل وضوح التشخيص قد يؤدي إلى تقديم خدمات غير ضرورية للطفل.","لا مفاضلة بينهما قبل أن يحدد الطبيب المختص سبب التأخر الحركي بدقة.","المقترحان متكافئان؛ لأن كليهما يتضمن متابعة نمو الطفل وتطوره بمرور الوقت.","الدعم المبكر أنسب؛ لأن الحاجة الحالية واضحة والدعم تحكمه بيانات قابلة للمراجعة."],"a":3,"w":"عند وجود حاجة واضحة ذات أثر وظيفي، يُفضَّل الدعم المبكر الآمن المتابَع بالبيانات على الانتظار السلبي. فالدعم هنا لا يدّعي تشخيصًا، بل يستجيب للحاجة ويُراجع، بينما يفوّت الانتظار فرصة تعلم في مرحلة نمو سريع.","n":["يبرر الانتظار السلبي رغم الأثر الوظيفي الحالي.","الدعم التربوي الآمن لا يُعلَّق على معرفة السبب.","المتابعة السلبية لا تكافئ الدعم الفعلي.","صحيح: حاجة حالية ودعم آمن تحكمه البيانات."],"c":"تأخر حركي واضح يؤثر في تنقله","p":"بين الانتظار والدعم المبكر المتابَع بالبيانات، اختر الدعم."},{"id":"5-08","s":5,"i":"5.1","l":"تحليل","t":"تضمنت خطة تدخل مبكر لطفل لديه تأخر تواصلي الهدف الآتي: «أن يحفظ الطفل أسماء عشرة ألوان خلال شهر». ما الخلل الأبرز في هذا الهدف؟","o":["أنه بعيد عن حاجة الطفل الوظيفية في التواصل والمشاركة اليومية.","أنه غير قابل للقياس لأن عدد الألوان كبير جدًّا على عمر الطفل وقدراته.","أنه لا يحدد اسم المختص الذي سيتولى تدريب الطفل عليه.","أن مدة الشهر قصيرة وينبغي أن تمتد إلى فصل دراسي كامل."],"a":0,"w":"الهدف الجيد في التدخل المبكر وظيفي يرتبط بالروتين وأولوية الطفل والأسرة، مثل أن يطلب الطفل حاجته بكلمة أو إشارة في مواقف متعددة. أما حفظ الألوان فمهارة أكاديمية معزولة لا تعالج حاجته التواصلية الحالية، حتى لو كانت قابلة للقياس.","n":["صحيح: هدف غير وظيفي لا يخدم حاجة التواصل.","الهدف قابل للقياس فعلًا؛ فالخلل ليس هنا.","تحديد المنفذ لا يصلح مضمون الهدف.","تعديل المدة لا يصلح هدفًا غير وظيفي."],"c":"تأخر تواصلي ... يحفظ أسماء عشرة ألوان","p":"اسأل عن كل هدف: هل يظهر في حياة الطفل اليومية ويخدم حاجته؟"},{"id":"5-09","s":5,"i":"5.2","l":"معرفة","t":"ما الفرق الأدق بين التأخر النمائي (Developmental Delay) والتأخر النمائي الشامل (GDD)؟","o":["التأخر النمائي مؤقت يزول دائمًا مع النمو، أما الشامل فدائم ويعني وجود إعاقة ذهنية مؤكدة لدى الطفل.","التأخر النمائي قد يكون في مجال واحد أو أكثر، والشامل تأخر مهم في مجالين أو أكثر لدى طفل صغير.","التأخر النمائي يشترط مجالين أو أكثر، أما الشامل فيشمل جميع مجالات النمو دون أي استثناء.","التأخر النمائي تشخيص طبي نهائي، أما الشامل فوصف تربوي تكتبه معلمة الروضة وحدها."],"a":1,"w":"التأخر النمائي تأخر ملحوظ في اكتساب مهارات متوقعة في مجال واحد أو أكثر، أما التأخر النمائي الشامل فيُستخدم عند وجود تأخر مهم في مجالين نمائيين أو أكثر لدى الطفل الصغير (غالبًا قبل الخامسة)، ويستدعي تقييمًا شاملًا. ولا يحدد أيٌّ من المصطلحين المآل وحده.","n":["لا يُحدَّد المآل من كلمة «تأخر»، ولا يعني الشامل إعاقة مؤكدة.","صحيح: مجال أو أكثر مقابل مجالين فأكثر.","قلب للتعريفين: اشتراط المجالين يخص الشامل.","كلاهما وصف نمائي، والمعلمة لا تشخّص منفردة."],"c":"مجال واحد أو أكثر / مجالين أو أكثر","p":"GDD = تأخر مهم في مجالين فأكثر لدى طفل صغير ← تقييم شامل متعدد المجالات."},{"id":"5-10","s":5,"i":"5.2","l":"معرفة","t":"أي مما يلي يُعد مثالًا على عامل خطر بيولوجي يستدعي المتابعة النمائية؟","o":["الحرمان الشديد من فرص اللعب والتفاعل في المنزل.","الخداج الشديد وانخفاض وزن الطفل عند الولادة.","تعلّم الطفل لغتين في المنزل منذ الولادة.","سوء التغذية الناتج عن ظروف معيشية صعبة."],"a":1,"w":"يندرج الخداج الشديد وانخفاض وزن الولادة ونقص الأكسجين وبعض المضاعفات حول الولادة ضمن الخطر البيولوجي، بينما يُعد الحرمان الشديد وسوء التغذية والإهمال خطرًا بيئيًّا أو اجتماعيًّا. أما ثنائية اللغة فليست خطرًا ولا اضطرابًا بحد ذاتها.","n":["خطر بيئي/اجتماعي لا بيولوجي.","صحيح: خطر بيولوجي يرفع الحاجة للمتابعة.","ثنائية اللغة ليست عامل خطر ولا اضطرابًا.","يُصنَّف ضمن الخطر البيئي/الاجتماعي."],"c":"عامل خطر بيولوجي","p":"خداج/وزن منخفض/نقص أكسجين = بيولوجي؛ حرمان/إهمال/سوء تغذية = بيئي."},{"id":"5-11","s":5,"i":"5.2","l":"تطبيق","t":"لاحظت معلمة الروضة أن سلمان (4 سنوات) كان يستخدم جملًا قصيرة، ثم توقف عن استخدام معظم كلماته خلال الأسابيع الأخيرة. ما الإجراء الأنسب؟","o":["متابعته شهرين آخرين لمعرفة هل التوقف مرحلة عابرة.","إعطاؤه تدريبات نطق إضافية يومية في الصف حتى يستعيد كلماته المفقودة.","إبلاغ الأسرة فورًا والتوصية بتقييم متخصص سريع مع توثيق زمن التراجع.","إخبار الأسرة بأن هذا التراجع علامة مؤكدة على اضطراب طيف التوحد."],"a":2,"w":"فقد المهارات المكتسبة من أقوى علامات الإنذار، وهو أهم دلالة من مجرد بطء ثابت في الاكتساب، ويستدعي تقييمًا سريعًا. ودور المعلمة هنا التوثيق وإبلاغ الأسرة والتوصية بتقييم متخصص، دون تأجيل ودون إصدار تشخيص.","n":["الانتظار مع التراجع يؤخر تقييمًا مستعجلًا.","الدعم الصفي وحده لا يكفي مع علامة إنذار.","صحيح: تراجع = إبلاغ وتقييم سريع وتوثيق.","تشخيص متسرع يتجاوز حدود دور المعلمة."],"c":"توقف عن استخدام معظم كلماته","p":"فقد مهارة مكتسبة = علامة إنذار ← إحالة وتقييم سريع."},{"id":"5-12","s":5,"i":"5.2","l":"تطبيق","t":"فيصل طفل وُلد خديجًا وعمره الآن سنة ونصف، ويتطور بصورة مناسبة لعمره المصحح ولا تظهر لديه مؤشرات تأخر حالية. ما القرار الأنسب؟","o":["تصنيفه طفلًا ذا إعاقة نمائية لأن الخداج الشديد سبب معروف للإعاقة النمائية.","إيقاف المتابعة لأن أداءه الحالي مناسب لعمره المصحح.","إلحاقه ببرنامج تدخل مكثف في جميع مجالات النمو تحسبًا للتأخر.","استمرار المراقبة النمائية المنظمة وفق توصيات الفريق دون وضع تشخيص."],"a":3,"w":"الخداج عامل خطر يرفع الحاجة إلى المتابعة لكنه ليس تشخيصًا. ومع نمو مناسب للعمر المصحح، القرار الأدق هو استمرار المراقبة المنظمة، لا وصمه بإعاقة، ولا إلغاء المتابعة، ولا فرض خدمات مكثفة بلا حاجة تثبتها البيانات.","n":["يحوّل عامل الخطر إلى تشخيص.","عامل الخطر يبرر استمرار المتابعة.","خدمة مكثفة بلا حاجة مثبتة بالبيانات.","صحيح: مراقبة منظمة دون تشخيص."],"c":"مناسبة لعمره المصحح","p":"عامل خطر بلا تأخر حالي = مراقبة منظمة، لا تشخيص ولا خدمة مكثفة."},{"id":"5-13","s":5,"i":"5.2","l":"تطبيق","t":"طفل في الروضة يتحدث قليلًا بالعربية، وتذكر أسرته أنه يتواصل بطلاقة بلغة أخرى في المنزل. ما الإجراء الأنسب قبل الحكم على نموه اللغوي؟","o":["إحالته لتقييم اضطراب اللغة لأن مفرداته في لغة الروضة محدودة.","عدم تقديم أي دعم لغوي حتى يتقن العربية بالتعرض الطبيعي.","نصح الأسرة بإيقاف لغة المنزل حتى تتحسن لغته العربية.","جمع بيانات عن أدائه في لغتيه وسياقاته وفرص تعرضه لكل منهما."],"a":3,"w":"تعلّم أكثر من لغة لا يُعد اضطرابًا بحد ذاته، ولا تُفسَّر قلة المفردات في لغة الروضة وحدها على أنها اضطراب لغوي. والخطوة الصحيحة جمع معلومات عن أداء الطفل في لغاته وسياقاته وفرص تعرضه، مع استمرار دعم التواصل.","n":["يفسر ضعف لغة الروضة وحده على أنه اضطراب.","حرمانه من الدعم انتظار غير مبرر.","إيقاف لغة المنزل توصية غير مهنية.","صحيح: تقييم عادل عبر اللغتين والسياقات."],"c":"يتواصل بطلاقة بلغة أخرى","p":"ثنائي اللغة: قيّم أداءه عبر لغاته وسياقاته قبل أي حكم."},{"id":"5-14","s":5,"i":"5.2","l":"تحليل","t":"طفل لديه شلل دماغي يفهم التعليمات الشفهية جيدًا لكن حركته محدودة، فاقترح عضو في الفريق تبسيط الأنشطة المعرفية له لأن «الإعاقة الحركية تصاحبها غالبًا إعاقة ذهنية». ما التحليل الأدق لهذا المقترح؟","o":["غير دقيق؛ فنوع الإعاقة لا يحدد القدرات المعرفية، والأولى تكييف وسيلة الاستجابة.","مقبول احتياطيًّا إلى أن يحسم تقييم معرفي مقنن مستوى قدراته الفعلية بدقة.","دقيق؛ لأن الشلل الدماغي يؤثر في جميع مجالات النمو بالدرجة نفسها.","غير دقيق؛ لأن الطفل يحتاج إلى العلاج الطبيعي وحده دون أي أنشطة معرفية أو لغوية."],"a":0,"w":"نوع الإعاقة لا يحدد تلقائيًّا مستوى القدرات المعرفية، والبيانات الحالية تدل على فهم جيد؛ فخفض المحتوى بناءً على افتراض يضر بفرص تعلمه. والصواب تكييف وسيلة الاستجابة والبيئة وتوفير فرص المشاركة.","n":["صحيح: لا افتراض من نوع الإعاقة؛ كيّف وسيلة الاستجابة.","خفض للتوقعات بلا بيانات، والبيانات الحالية تدل على فهم جيد.","تعميم خاطئ على جميع المجالات.","يحصر احتياجه في مجال واحد ويتجاهل تعلمه."],"c":"يفهم التعليمات الشفهية جيدًا","p":"لا تستنتج القدرة المعرفية من نوع الإعاقة؛ ابنِ على البيانات وكيّف الوصول."},{"id":"5-15","s":5,"i":"5.2","l":"تحليل","t":"سجّلت معلمة الروضة الملاحظات الآتية عن أربعة أطفال. أيها يرفع مستوى القلق أكثر ويستدعي تقييمًا شاملًا متعدد المجالات؟","o":["طفل ظهرت لديه نوبة غضب واحدة عند انتهاء وقت اللعب في يوم مزدحم.","طفل يتأخر بوضوح في اللغة والحركة والمهارات التكيفية معًا عبر المواقف.","طفل فضّل اللعب منفردًا في أيامه الأولى بالروضة ثم بدأ يشارك أقرانه تدريجيًّا.","طفل ينطق بعض الأصوات بصورة غير واضحة لكن كلامه مفهوم لأسرته ومعلمته."],"a":1,"w":"ما يرفع مستوى القلق هو النمط المستمر، وتعدد المجالات المتأثرة، والأثر الوظيفي. والتأخر في عدة مجالات يستدعي تقييمًا أشمل لترابط النمو، بينما لا تحمل نوبة الغضب المنفردة أو التكيف التدريجي أو النطق المفهوم الدلالة نفسها.","n":["سلوك منفرد في موقف واحد لا يعني اضطرابًا.","صحيح: تعدد المجالات مع الاستمرار ← تقييم شامل.","تكيف تدريجي متوقع مع بداية الروضة.","قد يحتاج متابعة لكنه أقل دلالة من تأخر متعدد المجالات."],"c":"اللغة والحركة والمهارات التكيفية معًا","p":"الاستمرار + تعدد المجالات + الأثر الوظيفي = أولوية أعلى للتقييم."},{"id":"5-16","s":5,"i":"5.3","l":"معرفة","t":"ما المعيار الذي يُحسم به تصنيف إجراء ما ضمن مستويات الوقاية (الأولية والثانوية والثالثية)؟","o":["اسم البرنامج والجهة المقدمة له وتخصصات العاملين فيه.","مدة البرنامج وعدد جلساته وكثافة الخدمات المقدمة فيه.","حالة المستهدف وتوقيت التدخل والغرض من الإجراء.","وجود تشخيص رسمي أو خطة تربوية فردية لدى المستفيد."],"a":2,"w":"لا تُصنَّف الوقاية باسم البرنامج، بل بثلاثة أسئلة: من المستهدف (الجميع، فئة معرضة للخطر، حالة قائمة)؟ ومتى يحدث التدخل (قبل المشكلة، عند بدايتها، بعد ثبوتها)؟ وما غرضه (منع الحدوث، الاكتشاف والاحتواء، تقليل الأثر)؟ ولا يكفي وجود تشخيص أو IEP للتمييز بين المستويات.","n":["الاسم والجهة لا يحددان المستوى؛ وهذا الفخ الأشهر.","الكثافة تصف شدة التدخل لا مستوى الوقاية.","صحيح: المستهدف والتوقيت والغرض.","التشخيص أو IEP ليس الفيصل بين المستويات."],"c":"يُحسم به تصنيف","p":"من المستهدف؟ متى؟ لماذا؟ = مفاتيح تصنيف مستوى الوقاية."},{"id":"5-17","s":5,"i":"5.3","l":"معرفة","t":"أي الأمثلة الآتية يمثل الوقاية الثالثية؟","o":["تقنية مساعدة لطالب لديه إعاقة حركية قائمة لزيادة استقلاله.","مسح للوعي الصوتي يتبعه تدخل قصير لمجموعة معرضة للخطر.","برنامج توعية بالسلامة المرورية لجميع طلاب المدرسة.","تطعيم جميع الأطفال للوقاية من مرض معدٍ قد يسبب إعاقة لاحقًا."],"a":0,"w":"الوقاية الثالثية تتعامل مع حالة قائمة بهدف تقليل المضاعفات والعجز الوظيفي وزيادة الاستقلال والمشاركة، ومن أمثلتها التأهيل والتكييفات والتقنية المساعدة. أما التوعية والتطعيم فوقاية أولية، والمسح مع التدخل الموجّه وقاية ثانوية.","n":["صحيح: حالة قائمة وتقليل أثر وظيفي.","وقاية ثانوية: كشف مبكر وتدخل موجّه.","وقاية أولية: للجميع قبل حدوث المشكلة.","وقاية أولية: منع سبب قابل للوقاية."],"c":"إعاقة حركية قائمة","p":"حالة قائمة + تقليل الأثر والمضاعفات = وقاية ثالثية."},{"id":"5-18","s":5,"i":"5.3","l":"تطبيق","t":"في الأسابيع الأولى من الصف الأول، لاحظت المعلمة أن مجموعة من الطلاب يكررون أخطاء في تمييز الأصوات وتقطيع الكلمات. أي الإجراءات الآتية يجسد منطق الوقاية الثانوية؟","o":["توثيق النمط وتطبيق مسح قصير ثم تدخل موجّه مع متابعة التقدم.","تقديم تعليم قراءة عالي الجودة لجميع طلاب الصف دون استثناء.","تحويل الطلاب إلى خدمات التربية الخاصة لتشخيص صعوبات التعلم.","انتظار نهاية الفصل الدراسي للتأكد من استمرار الأخطاء لديهم."],"a":0,"w":"ظهرت مؤشرات مبكرة لدى فئة محددة، والوقاية الثانوية جوهرها كشف مبكر وتدخل موجّه ومتابعة استجابة. أما التعليم الجيد للجميع فمنطق أولي، والتحويل للتشخيص قفزة فوق جمع الأدلة، والانتظار يخالف فلسفة الاستباق.","n":["صحيح: مؤشر مبكر ← مسح وتدخل موجّه ومتابعة.","منطق أولي للجميع، لا يستهدف المؤشرات الظاهرة.","قفز إلى التشخيص قبل جمع الأدلة والتدخل.","الانتظار حتى الفشل خطأ مهني متكرر."],"c":"مجموعة ... يكررون أخطاء في الأسابيع الأولى","p":"مؤشرات أولية لدى فئة = وقاية ثانوية: مسح + تدخل موجّه + متابعة."},{"id":"5-19","s":5,"i":"5.3","l":"تطبيق","t":"أظهر مسح سمعي في الروضة نتيجة غير طبيعية لدى الطفلة هيا، ولا يوجد لديها أي تشخيص سابق. ما الإجراء الأنسب؟","o":["عدّها ذات إعاقة سمعية وإعداد خطة تربوية فردية لها.","تقديم تأهيل سمعي فوري ومكثف لها بوصفه وقاية ثالثية لحالتها السمعية.","إعادة المسح نفسه بعد عام كامل للتأكد من ثبات النتيجة.","إحالتها لتقييم سمعي متخصص مع استمرار الدعم التعليمي الملائم."],"a":3,"w":"المسح أداة كشف أولي تحدد من يحتاج إلى تقييم أعمق، ولا تثبت الإعاقة وحدها. والإجراء الصحيح الإحالة لتقييم سمعي متخصص، مع استمرار الدعم التعليمي المناسب في أثناء ذلك، دون قفز إلى تشخيص أو تأهيل أو تأجيل طويل.","n":["يحوّل نتيجة مسح إلى تشخيص وخطة.","لا توجد حالة مثبتة حتى يُقدَّم تأهيل ثالثي.","تأجيل طويل يضيّع وقتًا مهمًّا.","صحيح: المسح يقود إلى تقييم أعمق مع استمرار الدعم."],"c":"مسح سمعي ... لا يوجد تشخيص سابق","p":"المسح يكشف الاحتمال ولا يشخّص ← إحالة لتقييم متخصص."},{"id":"5-20","s":5,"i":"5.3","l":"تطبيق","t":"لم يُظهر الطالب معاذ تقدمًا ملحوظًا في الطلاقة القرائية خلال تدخل المستوى الثاني (Tier 2) في نموذج الاستجابة للتدخل، مع أن التدخل نُفّذ كما خُطط له. ما الخطوة الأنسب؟","o":["مراجعة البيانات وزيادة شدة التدخل أو الانتقال إلى مستوى أعلى وفق النظام.","عدّ عدم الاستجابة دليلًا كافيًا على وجود صعوبة تعلم وإحالته فورًا لتشخيص نهائي.","إعادته إلى المستوى الأول لأن التدخل الموجّه لم يحقق أي أثر لديه.","إيقاف التدخل لأن الاستمرار في برنامج غير فعال يهدر وقت الطالب."],"a":0,"w":"بعد التأكد من جودة التنفيذ، تبرر البيانات تعديل الجرعة أو الشدة أو الانتقال إلى مستوى دعم أعلى وفق النظام، مع اتباع إجراءات التقييم عند الحاجة. ولا يعني ضعف الاستجابة تشخيصًا مباشرًا، كما أن خفض الدعم أو إيقافه لا يتبع منطق البيانات.","n":["صحيح: البيانات تقود إلى زيادة الشدة وفق النظام.","ضعف الاستجابة لا يساوي تشخيصًا مباشرًا.","خفض الدعم يعاكس ما تشير إليه البيانات.","الإيقاف يترك الحاجة دون استجابة."],"c":"نُفّذ كما خُطط له","p":"لا استجابة مع تنفيذ جيد ← زد الشدة أو المستوى وفق النظام، لا تشخيص فوري."},{"id":"5-21","s":5,"i":"5.3","l":"تطبيق","t":"لدى الطالب سلطان عامل خطر أسري، لكن أداءه الأكاديمي والسلوكي ضمن المتوقع حاليًّا. ما القرار الأنسب من منظور وقائي؟","o":["متابعته ورصد أدائه مع تعزيز العوامل الواقية دون تصنيفه.","وضعه مباشرة في المستوى الثالث من نموذج الاستجابة للتدخل.","إعداد خطة تربوية فردية له تحسبًا لظهور صعوبات لاحقة.","عدم اتخاذ أي إجراء ما دام أداؤه الحالي ضمن المتوقع."],"a":0,"w":"عامل الخطر يزيد احتمال ظهور صعوبة لكنه لا يثبتها، ويبرر الرصد والمتابعة والدعم الوقائي المناسب. والعوامل الواقية، مثل البيئة التعليمية الداعمة والاستجابة الأسرية الجيدة، تقلل أثر المخاطر؛ أما التصنيف أو الخطة الفردية فقرارات غير مبررة هنا.","n":["صحيح: رصد ومتابعة وعوامل واقية دون تصنيف.","يحوّل الاحتمال إلى تدخل مكثف غير مبرر.","الخطة الفردية تحتاج أهلية لا مجرد خطر.","عامل الخطر يبرر المتابعة لا الإهمال."],"c":"عامل خطر ... أداؤه ضمن المتوقع","p":"عامل الخطر احتمال لا تشخيص ← رصد ومتابعة وعوامل واقية."},{"id":"5-22","s":5,"i":"5.3","l":"تحليل","t":"في مدرسة برنامجان: «برنامج الوقاية المبكرة» ويقدّم تأهيلًا وتكييفات لطلاب لديهم إعاقات قائمة للحد من المضاعفات، و«نادي السلامة» ويُقدَّم لجميع الطلاب لخفض إصابات الرأس قبل حدوثها. ما التصنيف الأدق؟","o":["«الوقاية المبكرة» أولية بدلالة اسمه، و«نادي السلامة» وقاية ثانوية.","«الوقاية المبكرة» ثانوية لأنه مبكر، و«نادي السلامة» ليس وقاية.","كلاهما وقاية أولية؛ لأنهما يُقدَّمان داخل المدرسة لطلابها.","«الوقاية المبكرة» ثالثية رغم اسمه، و«نادي السلامة» وقاية أولية."],"a":3,"w":"التصنيف يتبع حالة المستهدف وتوقيت التدخل وغرضه لا اسم البرنامج. فالبرنامج الذي يخدم حالات قائمة ويحد من مضاعفاتها ثالثي مهما كان اسمه، والبرنامج الموجّه للجميع قبل وقوع الإصابة أولي حتى لو لم يحمل كلمة «وقاية».","n":["فخ الاسم: الاسم لا يحدد المستوى.","كلمة «مبكر» لا تجعله ثانويًّا، والسلامة للجميع وقاية أولية.","مكان التقديم ليس معيار تصنيف.","صحيح: التصنيف بالغرض والتوقيت لا بالاسم."],"c":"إعاقات قائمة ... لجميع الطلاب قبل حدوثها","p":"صنّف البرنامج من وظيفته وتوقيته، لا من اسمه."},{"id":"5-23","s":5,"i":"5.4","l":"معرفة","t":"ما الفرق الأدق بين التشخيص (Diagnosis) وتحديد الأهلية (Eligibility) في التدخل المبكر؟","o":["المصطلحان مترادفان؛ فكل تشخيص طبي يمنح الطفل أهلية تلقائية لجميع الخدمات.","التشخيص قرار تربوي يتخذه فريق الروضة، أما الأهلية فقرار طبي يصدره الطبيب المختص وحده.","التشخيص يحدد طبيعة الحالة وفق معايير، والأهلية قرار خدمي باستحقاق الخدمة وفق النظام.","التشخيص يسبق المسح دائمًا، والأهلية تُحدَّد قبل إجراء أي تقييم شامل للطفل."],"a":2,"w":"التشخيص يصف طبيعة الحالة أو الاضطراب عند توافر معايير مناسبة، وقد يكون طبيًّا أو نفسيًّا أو نمائيًّا. أما الأهلية فقرار خدمي/نظامي يُبنى على المعايير المعتمدة ونتائج التقييم، وليست مرادفة للتشخيص الطبي وحده.","n":["خطأ شائع: التشخيص لا يمنح أهلية تلقائية.","يعكس الجهتين؛ الأهلية قرار خدمي لا طبي.","صحيح: وصف للحالة مقابل قرار باستحقاق الخدمة.","يقلب التسلسل؛ المسح والتقييم يسبقان القرار."],"c":"التشخيص ... تحديد الأهلية","p":"التشخيص يصف الحالة، والأهلية تقرر استحقاق الخدمة وفق النظام."},{"id":"5-24","s":5,"i":"5.4","l":"تطبيق","t":"لاحظت أسرة طفل في الثالثة أنه لا ينفذ التعليمات البسيطة ولا يتفاعل مع أقرانه، فتواصلت مع برنامج التدخل المبكر. ما الترتيب الأدق لمسار القرار والخدمة؟","o":["تحديد الأهلية ← مسح أولي ← بناء الخطة ← تقييم شامل ← التنفيذ والمتابعة.","مسح أولي ← تقييم شامل ← تحديد الأهلية ← بناء الخطة ← التنفيذ والمتابعة.","تقييم شامل ← بناء الخطة ← مسح أولي ← تحديد الأهلية ← التنفيذ والمتابعة.","بناء الخطة ← التنفيذ والمتابعة ← مسح أولي ← تقييم شامل ← تحديد الأهلية."],"a":1,"w":"يبدأ المسار بالإحالة أو القلق، ثم المسح الأولي للفرز، ثم التقييم الشامل متعدد المصادر لتحديد الأداء والاحتياجات، ثم تحديد الأهلية وفق المعايير، ثم بناء الخطة وتنفيذها ومتابعتها وصولًا إلى الانتقال. وأي ترتيب يضع القرار أو الخطة قبل البيانات يقفز فوق الأدلة.","n":["الأهلية لا تسبق المسح والتقييم.","صحيح: فرز ← تقييم ← أهلية ← خطة ← متابعة.","الخطة لا تُبنى قبل المسح وتحديد الأهلية.","تنفيذ قبل أي تقييم يخالف التسلسل المهني."],"c":"الترتيب الأدق لمسار القرار","p":"مؤشر ← مسح ← تقييم شامل ← أهلية ← خطة ← تنفيذ ومتابعة ← انتقال."},{"id":"5-25","s":5,"i":"5.4","l":"تطبيق","t":"طفلان في الرابعة لديهما التشخيص نفسه؛ أحدهما يتواصل بجمل قصيرة ويحتاج دعمًا في المهارات الحركية الدقيقة، والآخر يتواصل بالإشارة ويستقل في الأكل واللبس. ما القرار الأنسب في تحديد خدماتهما؟","o":["تقديم حزمة الخدمات نفسها لهما لأن تشخيصهما واحد.","تقديم الخدمات المعتادة لهذا التشخيص ثم تعديلها بعد عام.","تحديد خدمات كل منهما وفق احتياجاته الوظيفية وبيانات أدائه.","البدء بالخدمة الأشهر لهذا التشخيص ثم إضافة غيرها عند الحاجة."],"a":2,"w":"التشخيص يثري الفهم لكنه لا يحدد البرنامج وحده؛ فالخدمة تُختار من الحاجة الوظيفية والهدف. واختلاف الأداء بين الطفلين في التواصل والحركة الدقيقة والعناية بالذات يفرض خدمات فردية مختلفة.","n":["خطأ شائع: التشخيص نفسه لا يعني البرنامج نفسه.","ينطلق من التشخيص ويؤجل الفردية بلا مبرر.","صحيح: الخدمة من الحاجة الوظيفية والبيانات.","شهرة الخدمة ليست معيار اختيار."],"c":"التشخيص نفسه ... أداء مختلف","p":"اختر الخدمة من الحاجة الوظيفية والهدف، لا من اسم التشخيص."},{"id":"5-26","s":5,"i":"5.4","l":"تطبيق","t":"وصل إلى الروضة تقرير طبي يفيد بأن الطفلة لمى لديها إعاقة سمعية، وتلاحظ المعلمة ضعف تواصلها ومشاركتها مع أقرانها. ما الخطوة الأنسب لبناء خدماتها؟","o":["الاكتفاء بالتقرير الطبي في تحديد أهدافها وخدماتها.","نقلها إلى مركز متخصص لأن الروضة الدامجة لا تناسب حالتها.","تقديم الخدمات المقررة عادةً لجميع الأطفال ذوي الإعاقة السمعية في المرحلة نفسها.","تقييم أدائها الوظيفي في الاستماع واللغة والمشاركة ودمجه مع التقرير."],"a":3,"w":"معرفة التشخيص لا تكفي لبناء الخدمة؛ إذ يجب تقييم الأداء الوظيفي في الاستماع واللغة والمشاركة، ثم اختيار المعينات والتدخلات التي تحقق أهدافها اليومية. والتقرير الطبي مصدر مهم يُدمج مع البيانات التربوية والوظيفية.","n":["التقرير الطبي لا يحدد الخطة وحده.","قرار مكاني متسرع لا تسنده بيانات.","خدمة موحدة للفئة تتجاهل الفردية.","صحيح: أداء وظيفي يُدمج مع التقرير الطبي."],"c":"تقرير طبي ... ضعف تواصلها ومشاركتها","p":"التقرير الطبي + الأداء الوظيفي = أساس اختيار الخدمة."},{"id":"5-27","s":5,"i":"5.4","l":"معرفة","t":"أي الأطفال الآتين «لا» يُعد من الفئات المستهدفة بالتدخل المبكر لمجرد الحالة الموصوفة؟","o":["طفل لديه تأخر واضح في اللغة والتفاعل الاجتماعي.","طفل يتعلم لغتين في المنزل ويتطور بصورة طبيعية فيهما.","طفل يعيش حرمانًا شديدًا من فرص التحفيز والتفاعل.","طفل وُلد خديجًا مع نقص في الأكسجين عند الولادة ومضاعفات بعدها."],"a":1,"w":"تشمل الفئات المستهدفة: الأطفال ذوي الإعاقات أو الحالات النمائية المعروفة، وذوي التأخر النمائي، والمعرضين لخطر بيولوجي كالخداج ونقص الأكسجين، والمعرضين لخطر بيئي كالحرمان والإهمال، ومن تظهر لديهم مؤشرات إنذار. أما ثنائية اللغة مع نمو طبيعي فليست خطرًا ولا سببًا مرضيًّا للتأخر.","n":["تأخر نمائي: فئة مستهدفة.","صحيح: ثنائية اللغة مع نمو طبيعي ليست مسوغًا.","خطر بيئي/اجتماعي: فئة مستهدفة.","خطر بيولوجي: فئة مستهدفة."],"c":"«لا» ... لمجرد الحالة الموصوفة","p":"المستهدفون: إعاقة، تأخر، خطر بيولوجي، خطر بيئي، مؤشرات إنذار؛ لا ثنائية اللغة بذاتها."},{"id":"5-28","s":5,"i":"5.4","l":"تحليل","t":"أشار مسح نمائي أولي إلى خطر في اللغة لدى طفل في الرابعة. ثم أظهر التقييم الشامل أن فهمه مناسب لعمره، وتعبيره أقل من المتوقع قليلًا، وأن أسرته تتحدث معه قليلًا بسبب ظروف عملها. ما التفسير الأدق؟","o":["نتيجة المسح كافية لتأكيد اضطراب لغوي، والتقييم الشامل لا يلغي دلالتها التشخيصية.","يُعدّ الطفل ذا تأخر نمائي شامل لأن المسح والتقييم كليهما أظهرا ضعفًا.","لا توجد أي حاجة ما دام فهمه مناسبًا لعمره، فتُغلق متابعته نهائيًّا.","يُعتمد التقييم الشامل: لا يتأكد اضطراب، مع متابعة ودعم لزيادة فرص التفاعل."],"a":3,"w":"المسح فرز أولي، والتقييم الشامل متعدد المصادر هو المعتمد في تفسير البيانات. والصورة هنا لا تؤكد اضطرابًا، لكنها تكشف قلة فرص التفاعل اللغوي، وهذه حاجة تستدعي دعمًا ومتابعة، لا تشخيصًا ولا إغلاقًا للملف.","n":["المسح لا يشخّص، والتقييم الأعمق مقدَّم عليه.","الشامل يتطلب تأخرًا مهمًّا في مجالين فأكثر.","تجاهل لضعف التعبير وقلة فرص التفاعل.","صحيح: التقييم الشامل يوجّه دعمًا ومتابعة."],"c":"ثم أظهر التقييم الشامل","p":"عند تعارض المسح والتقييم الشامل، اعتمد التقييم الشامل وتابع."},{"id":"5-29","s":5,"i":"5.4","l":"تحليل","t":"اقترح عضو في فريق التدخل المبكر لطفل يصعب عليه طلب احتياجاته: «لنشترِ له جهاز تواصل لوحيًّا متطورًا أولًا، ثم نحدد الأهداف بحسب ما يتيحه الجهاز». ما الخلل في هذا المقترح؟","o":["يختار الوسيلة قبل تحديد الحاجة والهدف، والتقنية المساعدة وسيلة لا غاية.","أجهزة التواصل البديل والمعزز تمنع تطور الكلام المنطوق لدى الأطفال الصغار.","قرار التقنية المساعدة من اختصاص الأسرة وحدها دون مشاركة الفريق.","الأجهزة اللوحية لا تُستخدم في التدخل المبكر قبل بلوغ سن المدرسة."],"a":0,"w":"التسلسل المهني يبدأ بالحاجة الوظيفية ثم الهدف ثم اختيار الخدمة أو الأداة، والتقنية المساعدة تُختار وفق الحاجة وتُقاس فاعليتها. كما أن التواصل البديل والمعزز لا يمنع تطور الكلام، بل قد يدعمه.","n":["صحيح: الحاجة والهدف أولًا، والأداة وسيلة.","خرافة: التواصل البديل لا يمنع الكلام.","القرار تشاركي بين الأسرة والفريق.","لا يوجد قيد عمري كهذا."],"c":"أولًا ... ثم نحدد الأهداف","p":"حاجة ← هدف ← أداة أو خدمة؛ لا تبدأ بالجهاز."},{"id":"5-30","s":5,"i":"5.5","l":"معرفة","t":"أي العبارات الآتية تميّز بدقة بين «الاستراتيجية» و«النموذج» في التدخل المبكر؟","o":["الاستراتيجية خطة لتحقيق هدف محدد، والنموذج إطار أوسع ينظم فلسفة الخدمة والأدوار والبيئة.","الاستراتيجية حزمة متكاملة من الأهداف والخدمات، والنموذج طريقة إجرائية لتنفيذ نشاط واحد محدد.","الاستراتيجية خاصة بالمختصين في المراكز، والنموذج خاص بالأسرة في المنزل والروتين اليومي.","لا فرق جوهريًّا بينهما؛ فكلاهما يصف ما ينفذه المعلم مع الطفل في الجلسة اليومية."],"a":0,"w":"يُميَّز بين أربعة مفاهيم: الأسلوب كيفية إجرائية محددة، والاستراتيجية خطة منظمة لتحقيق هدف محدد، والبرنامج حزمة مترابطة من أهداف وخدمات ومتابعة، والنموذج إطار أوسع ينظم فلسفة تقديم الخدمة وأدوار الأسرة والمختصين والبيئة.","n":["صحيح: خطة لهدف مقابل إطار تنظيمي أوسع.","خلط بين البرنامج والأسلوب.","تقسيم بحسب المنفّذ لا أساس له.","ينفي فرقًا جوهريًّا قائمًا بين المفهومين."],"c":"الاستراتيجية ... النموذج","p":"الأسلوب أضيق، ثم الاستراتيجية، ثم البرنامج، والنموذج إطار ينظم الخدمة."},{"id":"5-31","s":5,"i":"5.5","l":"معرفة","t":"ما المقصود بـ«التلميح والتلاشي» (Prompting & Fading) في التدخل المبكر؟","o":["تقديم نتيجة محببة فور أداء السلوك المرغوب لزيادة احتمال تكراره لاحقًا.","تقديم مساعدة مناسبة لأداء المهارة ثم تقليلها تدريجيًّا حتى الأداء المستقل.","تفكيك المهارة المركبة إلى خطوات صغيرة متتابعة قابلة للتدريس والقياس.","عرض المهارة أمام الطفل أو باستخدام قرين ليقلدها ثم يمارسها في مواقف متعددة."],"a":1,"w":"التلميح مساعدة تُقدَّم ليؤدي الطفل المهارة بنجاح، والتلاشي تقليلها تدريجيًّا حتى يؤديها باستقلال؛ فالهدف النهائي الاستقلالية لا الاعتماد على المساعدة. أما البدائل الأخرى فتصف التعزيز الإيجابي وتحليل المهمة والنمذجة.","n":["هذا تعريف التعزيز الإيجابي.","صحيح: مساعدة ثم سحب تدريجي نحو الاستقلال.","هذا تعريف تحليل المهمة.","هذا تعريف النمذجة."],"c":"التلميح والتلاشي","p":"التلميح يضمن النجاح، والتلاشي يبني الاستقلال."},{"id":"5-32","s":5,"i":"5.5","l":"تطبيق","t":"تريد معلمة التدخل المبكر تعليم الطفل بدر غسل يديه باستقلال، لكنه يتشتت ويتوقف عندما تُعرض عليه المهارة كاملة دفعة واحدة. ما الاستراتيجية الأنسب للبدء؟","o":["تكرار عرض المهارة كاملة يوميًّا حتى يحفظ تسلسلها بالملاحظة والتقليد.","تحليل المهمة إلى خطوات صغيرة متتابعة وتعليمها مع تلميح يُسحب تدريجيًّا.","تأجيل تعليم المهارة حتى يصبح أكبر سنًّا وأقدر على الانتباه والتركيز.","أداء المعلمة المهارة عنه يوميًّا مع وصف كل خطوة لفظيًّا أثناء التنفيذ أمامه."],"a":1,"w":"تحليل المهمة يفكك المهارة المركبة إلى خطوات صغيرة قابلة للتعلم والقياس (فتح الماء، تبليل اليدين، الصابون، الفرك، الشطف، التجفيف)، ويمكن تعليمها بتسلسل أمامي أو خلفي مع تلميح يُسحب تدريجيًّا وصولًا إلى الاستقلال.","n":["العرض الكامل المتكرر لا يعالج تشتته أمام المهارة المركبة.","صحيح: تجزئة المهارة مع تلميح متلاشٍ.","تأجيل بلا مبرر لمهارة وظيفية مهمة.","أداء المهمة عنه يكرّس الاعتماد."],"c":"يتشتت عندما تُعرض عليه المهارة كاملة","p":"مهارة مركبة تربك الطفل ← تحليل مهمة + تلميح ثم تلاشٍ."},{"id":"5-33","s":5,"i":"5.5","l":"تطبيق","t":"يبكي الطفل نواف بشدة كلما طُلب منه الانتقال من اللعب إلى نشاط آخر في الروضة. ما الاستراتيجية الأنسب للبدء بها؟","o":["السماح له بمواصلة اللعب حتى يقرر الانتقال إلى النشاط التالي بنفسه.","إنهاء اللعب فجأة في كل مرة حتى يعتاد التغيير دون تمهيد مسبق.","جدول بصري وتنبيه مسبق قبل الانتقال مع تعزيز الاستجابة المرنة.","نقله إلى جلسات فردية بعيدًا عن أقرانه لتقليل المثيرات حوله."],"a":2,"w":"الجداول البصرية تُظهر تسلسل الأنشطة والانتقالات، فتزيد قدرة الطفل على التنبؤ وتقلل قلق الانتقال. ويكمّلها التنبيه المسبق والانتقال التدريجي وتعزيز الاستجابة المرنة، بدل المفاجأة أو التجنب أو العزل.","n":["تجنب للمطلب يعزز البكاء ولا يبني المهارة.","المفاجأة تزيد القلق ولا تعلّم الانتقال.","صحيح: التنبؤ البصري يقلل قلق الانتقال.","العزل يفقده فرص المشاركة ولا يعالج السبب."],"c":"كلما طُلب منه الانتقال","p":"صعوبة الانتقال ← جدول بصري + تنبيه مسبق + تعزيز المرونة."},{"id":"5-34","s":5,"i":"5.5","l":"تطبيق","t":"هدف الطفلة رغد في خطتها أن تتبادل الأدوار مع أقرانها أثناء اللعب، لكنها تتلقى حاليًّا جلسات فردية فقط في غرفة منفصلة. ما التعديل الأنسب؟","o":["تركها تلعب مع أقرانها بحرية دون هدف أو توجيه حتى تتعلم تلقائيًّا.","زيادة الجلسات الفردية لأن التدخل الفردي أفضل دائمًا من الجماعي.","استبدال الهدف بهدف معرفي يناسب طبيعة الجلسات الفردية الحالية.","إضافة نشاط لعب جماعي منظم مع أقرانها ودعم مناسب يخدم الهدف."],"a":3,"w":"التدخل الفردي ليس دائمًا أفضل من الجماعي؛ فالجماعة تتيح فرص التفاعل والتعميم عندما تناسب الهدف. وهدف تبادل الأدوار مع الأقران يحتاج نشاطًا جماعيًّا منظمًا مع دعم، لا عزلًا ولا لعبًا بلا هدف.","n":["اللعب الفعال في التدخل ليس تركًا بلا هدف.","حكم مطلق يتجاهل طبيعة الهدف.","يغيّر الهدف ليناسب الخدمة بدل العكس.","صحيح: سياق جماعي منظم يطابق هدف التفاعل."],"c":"تتبادل الأدوار مع أقرانها","p":"اختر شكل التدخل فرديًّا أو جماعيًّا وفق الهدف، لا وفق العادة."},{"id":"5-35","s":5,"i":"5.5","l":"تحليل","t":"يتلقى طفل خمس ساعات أسبوعيًّا في المركز منذ أربعة أشهر دون تقدم ملحوظ في هدفه التواصلي، وتشير الملاحظة إلى أن الاستراتيجية لا تُطبَّق كما خُطط لها. ما القرار الأدق؟","o":["مضاعفة الساعات أسبوعيًّا لأن الجرعة الحالية غير كافية لتحقيق الهدف.","استبدال البرنامج ببرنامج أشهر حقق نتائج جيدة مع أطفال آخرين.","فحص دقة التنفيذ وتحسينها أولًا ثم مراجعة الملاءمة والشدة بالبيانات.","إعادة تقييم الطفل لتغيير تشخيصه لأنه لم يستجب للبرنامج الحالي."],"a":2,"w":"إذا غاب التقدم، يُفحص أولًا مدى تنفيذ الاستراتيجية كما خُطط لها؛ فلا يمكن الحكم على فاعلية تدخل لم يُطبَّق بدقة. كما أن الشدة ليست عدد الساعات فقط، وزيادة الجرعة بلا جودة لا تضمن نتيجة أفضل.","n":["زيادة الساعات مع تنفيذ ضعيف لا تعالج المشكلة.","الشهرة ليست معيارًا، والمشكلة في التنفيذ.","صحيح: جودة التنفيذ أولًا ثم الملاءمة والشدة.","يحمّل الطفل المسؤولية بدل مراجعة الخطة."],"c":"لا تُطبَّق كما خُطط لها","p":"غياب التقدم ← افحص دقة التنفيذ قبل تغيير البرنامج أو زيادة الساعات."},{"id":"5-36","s":5,"i":"5.5","l":"تحليل","t":"تفاضل أسرة بين نموذجين لطفلها: النموذج المركزي الذي يوفر تخصصات وتجهيزات، والنموذج المنزلي الذي يركز على تدريب الأسرة داخل الروتين. ما التحليل الأدق؟","o":["لا نموذج أفضل للجميع؛ يُختار وفق حاجة الطفل والأسرة، وقد يُدمج بينهما.","المنزلي أفضل دائمًا؛ لأنه يحقق التعميم ولا يحتاج إلى مختصين.","المركزي أفضل دائمًا؛ لأن خدماته أكثر تخصصًا وكثافة وتجهيزًا.","يُختار الأقرب لسكن الأسرة؛ لأن القرب يضمن انتظام الحضور ومن ثم التقدم."],"a":0,"w":"لكل نموذج قوة وتحدٍّ: المركزي يوفر تخصصات وتجهيزات لكنه مهدد بضعف التعميم إذا انفصل عن المنزل، والمنزلي يرفع التعميم لكنه يحتاج أسرة مشاركة وتنظيمًا جيدًا. والقرار فردي يراعي حاجة الطفل وأولويات الأسرة وموارد البيئة، وقد يكون النموذج المدمج هو الأنسب.","n":["صحيح: قرار فردي وقد يكون مدمجًا.","حكم مطلق؛ البيئة الطبيعية لا تعني غياب المختص.","حكم مطلق يتجاهل خطر ضعف التعميم.","القرب عامل ثانوي لا يضمن الملاءمة."],"c":"تفاضل أسرة بين نموذجين","p":"لا يوجد نموذج واحد أفضل للجميع؛ القرار فردي وسياقي."},{"id":"5-37","s":5,"i":"5.6","l":"معرفة","t":"ما السمة المميزة للفريق عابر التخصصات (Transdisciplinary) في التدخل المبكر؟","o":["يتشارك الأعضاء في التخطيط ووضع الأهداف، ويبقى تنفيذ كل خدمة غالبًا ضمن تخصص صاحبها.","يُجري كل مختص تقييمه وتدخله من زاوية تخصصه باستقلال نسبي، مع تبادل التقارير والمعلومات.","تخطيط مشترك ونقل منظم لبعض الاستراتيجيات بالتدريب والتشاور، مع مقدم خدمة رئيسي غالبًا.","يتولى عضو واحد أدوار المختصين الآخرين جميعها ويحل محلهم في التقييم والعلاج."],"a":2,"w":"الفريق عابر التخصصات يتميز بالتخطيط المشترك ونقل بعض الاستراتيجيات بين التخصصات عبر تدريب وتشاور منظم، وقد يستخدم مقدم خدمة رئيسيًّا ينفذ استراتيجيات متفقًا عليها تحت إشراف بقية الفريق. أما الاستقلال النسبي فسمة الفريق متعدد التخصصات، وبقاء التنفيذ داخل كل تخصص مع أهداف مشتركة سمة الفريق متداخل التخصصات.","n":["هذه سمة الفريق متداخل التخصصات.","هذه سمة الفريق متعدد التخصصات.","صحيح: تخطيط مشترك ونقل استراتيجيات ومقدم خدمة رئيسي.","مقدم الخدمة الرئيسي ليس بديلًا عن بقية المختصين."],"c":"عابر التخصصات","p":"متعدد = استقلال نسبي، متداخل = تخطيط مشترك، عابر = نقل أدوار ومقدم خدمة رئيسي بإشراف."},{"id":"5-38","s":5,"i":"5.6","l":"تطبيق","t":"طفل في الثالثة يرفض ملمس بعض الملابس، ويجد صعوبة في الإمساك بالملعقة أثناء الأكل. مع أي مختص يتشاور المعلم أولًا؟","o":["أخصائي العلاج الطبيعي.","أخصائي النطق والتخاطب.","أخصائي العلاج الوظيفي.","الأخصائي النفسي."],"a":2,"w":"العلاج الوظيفي يركز على المهارات الحركية الدقيقة واستخدام اليدين والعناية الذاتية والاحتياجات الحسية والمشاركة في أنشطة الحياة اليومية، وهذه مكونات الموقف. وتُدمج توصياته في روتين اللبس والوجبات.","n":["يركز على الحركة الكبرى والتوازن والوضعية.","يركز على التواصل واللغة والكلام والبلع.","صحيح: حسي + حركة دقيقة + عناية ذاتية.","يختص بالتقييم النفسي والسلوكي عند الحاجة."],"c":"ملمس الملابس ... الإمساك بالملعقة","p":"دقيق/حسي/عناية ذاتية = علاج وظيفي؛ مشي/توازن/وضعية = علاج طبيعي."},{"id":"5-39","s":5,"i":"5.6","l":"تطبيق","t":"طفلة في الروضة تتعثر باستمرار ولا تحافظ على توازنها أثناء المشي في الساحة. ما الإجراء الأنسب للمعلمة؟","o":["تدريبها يوميًّا على المشي فوق خط مرسوم في الساحة دون الرجوع إلى أي مختص في الفريق.","إحالتها إلى أخصائي العلاج الوظيفي لأنه المسؤول عن جميع المشكلات الحركية.","التنسيق مع أخصائي العلاج الطبيعي لتقييم التوازن والمشي، مع تأمين البيئة مؤقتًا.","إبلاغ الأسرة بأن لدى الطفلة ضعفًا عضليًّا يحتاج إلى علاج دوائي عاجل."],"a":2,"w":"الحركة الكبرى والتوازن والمشي والوضعية من اختصاص العلاج الطبيعي، والإجراء الأنسب التنسيق معه لتقييمها مع تكييف البيئة مؤقتًا للسلامة. والمعلمة لا تشخّص ولا تقترح علاجًا طبيًّا، ولا تحوّل كل مشكلة حركية إلى العلاج الوظيفي.","n":["تدخل علاجي دون تقييم مختص.","خلط شائع؛ الوظيفي للمهارات الدقيقة والعناية الذاتية.","صحيح: حركة كبرى وتوازن ← علاج طبيعي مع سلامة.","تشخيص وعلاج طبي خارج حدود دورها."],"c":"تتعثر ... لا تحافظ على توازنها","p":"مشي وتوازن ووضعية ← العلاج الطبيعي."},{"id":"5-40","s":5,"i":"5.6","l":"تطبيق","t":"أوصى أخصائي العلاج الطبيعي بوضعية جلوس معينة لطفل، وأوصى أخصائي العلاج الوظيفي بوضعية مختلفة أثناء الأنشطة الصفية. ما الإجراء الأنسب للمعلم؟","o":["اعتماد توصية العلاج الطبيعي وحدها لأن الوضعية والجلوس من صميم تخصصه.","الدعوة إلى اجتماع تشاوري بين المختصين للوصول إلى خطة موحدة آمنة.","تطبيق التوصيتين بالتناوب يوميًّا ثم مقارنة النتائج بعد أسبوعين.","ترك القرار للأسرة لأنها الأعرف بما يريح طفلها."],"a":1,"w":"التعارض بين توصيات الفريق يُحل بالتشاور والدليل لا بالسلطة أو الاختيار العشوائي. والعلاج الطبيعي والوظيفي يتعاونان في الجلوس والوضعية، فلا تُجعل الحدود جامدة، والمطلوب خطة موحدة آمنة تحقق مصلحة الطفل.","n":["حسم أحادي يتجاهل اشتراك التخصصين في الوضعية.","صحيح: تشاور يقود إلى خطة موحدة آمنة.","تجريب عشوائي قد يضر الطفل.","الأسرة شريك، لكن القرار هنا تشاركي يراعي السلامة والدليل."],"c":"توصيتان مختلفتان بشأن الوضعية","p":"تعارض التوصيات ← اجتماع تشاوري قائم على الدليل ومصلحة الطفل."},{"id":"5-41","s":5,"i":"5.6","l":"تطبيق","t":"لاحظ معلم التدخل المبكر أن طفلًا يتناول دواءً بانتظام صار شديد النعاس صباحًا وتراجع تفاعله في الأنشطة. ما الإجراء الأنسب؟","o":["الاتفاق مع الأسرة على تقليل جرعة الصباح قليلًا حتى يعود نشاطه المعتاد.","توثيق الملاحظة ومشاركتها مع الأسرة والفريق والإحالة إلى الطبيب.","تأجيل أنشطة الطفل الصباحية إلى ما بعد الظهر دون إبلاغ أحد.","إبلاغ الأسرة بأن الدواء غير مناسب لحالة طفلها وينبغي إيقافه."],"a":1,"w":"المعلم لا يشخّص طبيًّا ولا يعدّل الجرعات أو الخطط الطبية، بل يرصد ويوثق ويشارك الفريق والأسرة، ويُحال الأمر إلى الطبيب صاحب الاختصاص في القرارات الدوائية.","n":["تعديل الجرعة قرار طبي خارج اختصاص المعلم.","صحيح: توثيق ومشاركة وإحالة للطبيب.","يخفي معلومة مهمة عن الفريق والأسرة.","حكم طبي لا يملكه المعلم."],"c":"يتناول دواءً ... شديد النعاس","p":"أي قرار يخص الدواء أو التشخيص الطبي ← الطبيب، والمعلم يوثق ويحيل."},{"id":"5-42","s":5,"i":"5.6","l":"تطبيق","t":"في فريق عابر التخصصات، اختيرت معلمة التدخل المبكر مقدمةَ خدمة رئيسية (PSP) لأسرة طفل لديه احتياجات تواصلية وحركية. أي الإجراءات الآتية يقع ضمن حدود دورها؟","o":["تقييم مهارات الطفل الحركية ووضع خطة علاج طبيعي بديلة عن الأخصائي.","الاقتصار على تنظيم المواعيد بين الأسرة والمختصين دون تنفيذ أي استراتيجية.","اتخاذ قرارات الخطة منفردة لأنها نقطة الاتصال الوحيدة بالأسرة.","تنفيذ استراتيجيات تواصل وحركة متفق عليها بإشراف وتشاور مستمر من الفريق."],"a":3,"w":"مقدم الخدمة الرئيسي نقطة اتصال أساسية للأسرة، ينفذ استراتيجيات مدرَّبًا عليها ومتفقًا عليها بدعم وإشراف بقية التخصصات. ولا يصبح بديلًا عن المختصين أو صاحب قرار منفرد، كما أن دوره أوسع من التنسيق الإداري.","n":["تجاوز للكفاءة المهنية؛ فهي ليست بديلًا عن المختص.","يحصر الدور في التنسيق ويُفرغه من مضمونه.","القرار في الفريق تشاركي لا فردي.","صحيح: تنفيذ استراتيجيات متفق عليها بإشراف."],"c":"مقدمة خدمة رئيسية","p":"مقدم الخدمة الرئيسي نقطة اتصال تنفذ استراتيجيات متفقًا عليها بإشراف، لا بديل عن المختصين."},{"id":"5-43","s":5,"i":"5.6","l":"تحليل","t":"في اجتماع فريق التدخل المبكر، قرأ كل مختص تقريره المنفصل، وانتهى الاجتماع دون أهداف مشتركة، ثم تلقت الأسرة ثلاث قوائم توصيات متعارضة. ما التشخيص الأدق لخلل عمل الفريق؟","o":["غياب التكامل؛ فتعدد التخصصات لم يتحول إلى أهداف مشتركة وأدوار واضحة.","قلة عدد المختصين؛ فالفريق يحتاج إلى أعضاء أكثر لتغطية الجوانب كلها.","تقصير الأسرة؛ لأنها لم تطلب توحيد التوصيات أثناء الاجتماع نفسه أو بعده.","طول التقارير؛ ويكفي اختصارها ليصبح الاجتماع فعالًا ومنظمًا."],"a":0,"w":"تعدد التخصصات لا يعني التكامل بالضرورة؛ فالمطلوب أن يدمج الاجتماع المعلومات في خطة واحدة مترابطة بأهداف مشتركة وأدوار واضحة ورسائل متسقة للأسرة، لا أن يصبح سلسلة تقارير منفصلة.","n":["صحيح: الخلل في غياب الأهداف المشتركة والتنسيق.","كثرة المختصين ليست دليل جودة.","يلوم الأسرة على خلل في عمل الفريق.","الشكل ليس أصل المشكلة؛ المضمون مجزأ."],"c":"تقارير منفصلة ... توصيات متعارضة","p":"اجتماع الفريق الجيد ينتهي بأهداف مشتركة وأدوار واضحة، لا بتقارير متجاورة."},{"id":"5-44","s":5,"i":"5.6","l":"تحليل","t":"طفل كان يمشي ويستخدم كلمات عدة، ثم ظهر لديه خلال أيام تراجع مفاجئ في المشي والكلام. اقترح أعضاء الفريق إجراءات مختلفة؛ أيها ينبغي أن يسبق غيره؟","o":["زيادة جلسات العلاج الطبيعي والنطق لاستعادة المهارات المفقودة.","إشراك الطبيب أو الفريق الطبي لاستبعاد الأسباب الصحية أولًا.","تطبيق تقييم وظيفي للسلوك لمعرفة سبب امتناعه عن الكلام.","مراجعة الأهداف التربوية وخفضها بما يناسب مستواه الحالي."],"a":1,"w":"التراجع المفاجئ في مهارات مكتسبة يستوجب استبعاد الأسباب الصحية أولًا، والطبيب أو الفريق الطبي هو صاحب الاختصاص في التشخيص العضوي والأزمات الصحية. وبعد ذلك تُبنى بقية القرارات التربوية والعلاجية على الصورة الكاملة.","n":["علاج قبل معرفة السبب قد يؤخر التدخل الطبي.","صحيح: تراجع مفاجئ ← استبعاد الأسباب الصحية أولًا.","يفترض سببًا سلوكيًّا قبل استبعاد العضوي.","خفض الأهداف يتجاهل خطورة التراجع."],"c":"تراجع مفاجئ خلال أيام","p":"تراجع مفاجئ في مهارة مكتسبة ← الطبيب أولًا لاستبعاد الأسباب الصحية."},{"id":"6-01","s":6,"i":"6.1","l":"معرفة","t":"أي العبارات الآتية تعبّر بدقة عن مفهوم التعليم الشامل (Inclusive Education)؟","o":["إلحاق الطالب ذي الإعاقة بالفصل العام بعد أن يثبت جاهزيته لمواكبة المنهج القائم دون تغيير","ضمان حضور جميع الطلاب ومشاركتهم وتعلّمهم وانتمائهم في بيئة مشتركة مع إزالة الحواجز","نقل جميع الخدمات المساندة إلى داخل الفصل العام وإلغاء غرفة المصادر وأي خدمة فردية خارجه","تقديم المحتوى والأساليب وأدوات التقويم نفسها لجميع الطلاب تحقيقًا للمساواة الكاملة بينهم"],"a":1,"w":"التعليم الشامل نهج حقوقي إصلاحي يجعل النظام المدرسي يتكيف مع تنوع المتعلمين، فيزيل الحواجز ويوفر الدعم والتكييفات والخدمات المساندة وفق الحاجة الفردية. ولا يتحقق بمجرد الوجود الجسدي في الفصل، بل بالمشاركة الحقيقية والتقدم والانتماء.","n":["هذا هو الدمج التقليدي الذي يُلقي عبء التكيف على الطالب لا على النظام.","صحيح: حضور ومشاركة وتعلّم وانتماء مع إزالة الحواجز.","الشمول لا يلغي غرفة المصادر؛ فهي خدمة مساندة ضمن سلسلة بدائل تُستخدم وفق الحاجة.","هذه مساواة جامدة، والعدالة التعليمية تعني تقديم ما يحتاجه كل طالب."],"c":"مفهوم التعليم الشامل","p":"الشمول = حضور + مشاركة + تعلّم + انتماء، والنظام هو الذي يتكيف لا الطالب."},{"id":"6-02","s":6,"i":"6.1","l":"معرفة","t":"مرّ تعليم ذوي الإعاقة بمراحل تاريخية متعاقبة. أي المراحل الآتية تقوم على إعادة تصميم المدرسة ومناهجها وممارساتها لتقليل الحواجز أمام الجميع، بدل مطالبة الطالب بالتكيف مع النظام القائم؟","o":["الدمج (Integration/Mainstreaming)","الفصل (Segregation)","الاستبعاد (Exclusion)","الشمول (Inclusion)"],"a":3,"w":"الفارق الحاسم بين الدمج والشمول هو اتجاه التكيف: في الدمج يُطلب من الطالب مواكبة النظام القائم، وفي الشمول تعيد المدرسة تصميم بيئتها ومناهجها وممارساتها لتقليل الحواجز أمام جميع المتعلمين.","n":["الدمج يُلحق الطالب بالتعليم العام مع بقاء عبء التكيف عليه.","الفصل تعليم منفصل في مؤسسات أو فصول خاصة بعيدًا عن الأقران.","الاستبعاد إبقاء الطالب خارج النظام التعليمي أصلًا.","صحيح: المدرسة تعيد تصميم نفسها لتستوعب التنوع."],"c":"إعادة تصميم المدرسة بدل مطالبة الطالب بالتكيف","p":"من يتكيف؟ الطالب ← دمج، والمدرسة والنظام ← شمول."},{"id":"6-03","s":6,"i":"6.1","l":"تطبيق","t":"في حصة علوم بفصل يطبق التعليم الشامل، يبقى سلمان (طالب ذو صعوبات تعلم) في مقعده يكتب ملخص الدرس، بينما ينفذ زملاؤه تجربة عملية في مجموعات. ما الإجراء الأنسب لتحقيق الشمول الفعلي؟","o":["إسناد دور ذي قيمة إلى سلمان في إحدى المجموعات مع دعم يمكّنه من المشاركة الفعلية","الإبقاء على مهمة التلخيص لأنها أنسب لمستواه مع تعزيزه على إنجازها كاملة","نقل سلمان إلى غرفة المصادر وقت التجارب ليتلقى شرحًا فرديًا للمحتوى نفسه","السماح له بمشاهدة المجموعات من مقعده ليتعرّف خطوات التجربة قبل أن يشارك"],"a":0,"w":"الشمول لا يتحقق بوجود سلمان في الغرفة نفسها، بل بمشاركته الفعلية في النشاط المشترك. لذا يُصمَّم له دور ذو قيمة داخل المجموعة، ويُقدَّم له الدعم في السياق المشترك بدل العزل أو خفض التوقعات.","n":["صحيح: مشاركة حقيقية بدور أصيل مع دعم مناسب.","يكرّس حضورًا بلا مشاركة ويخفض التوقعات دون مبرر.","سحب تلقائي يحرمه من التعلم مع أقرانه دون بيانات تبرره.","مشاهدة دون دور تُبقيه في وجود مكاني لا شمول فعّال."],"c":"يبقى في مقعده بينما زملاؤه في مجموعات","p":"لا تسأل أين يجلس الطالب فقط؛ اسأل: هل يشارك ويتعلم وينتمي؟"},{"id":"6-04","s":6,"i":"6.1","l":"تطبيق","t":"تخطط معلمة الفصل ومعلمة صعوبات التعلم لدرس رياضيات مشترك، وتريدان تقسيم الطالبات إلى مجموعتين متقاربتين تدرّس كل منهما المحتوى نفسه في الوقت نفسه لزيادة فرص المشاركة. أي أنماط التدريس التشاركي يحقق ذلك؟","o":["التدريس بالمحطات","التدريس المتوازي","التدريس البديل","التدريس كفريق"],"a":1,"w":"في التدريس المتوازي يُقسَّم الصف إلى مجموعتين متقاربتين، وتدرّس كل معلمة المحتوى نفسه في الوقت نفسه، فتصغر المجموعة وتزيد فرص المشاركة والاستجابة لكل طالبة.","n":["المحطات تدوير للمجموعات بين محطات تعلم يقود كل معلم محطة منها.","صحيح: مجموعتان متقاربتان والمحتوى نفسه بالتزامن.","البديل مجموعة كبيرة وأخرى صغيرة مؤقتة لهدف علاجي أو إثرائي محدد.","التدريس كفريق قيادة مشتركة أمام المجموعة نفسها دون تقسيم."],"c":"مجموعتان متقاربتان، المحتوى نفسه، الوقت نفسه","p":"متوازي = مجموعتان والمحتوى نفسه بالتزامن، وبديل = مجموعة صغيرة مؤقتة لهدف محدد."},{"id":"6-05","s":6,"i":"6.1","l":"تحليل","t":"في فصل يطبق التدريس التشاركي منذ بداية العام، تتولى معلمة التعليم العام الشرح في كل الحصص، بينما تتنقل معلمة التربية الخاصة بين مقاعد الطالبات ذوات صعوبات التعلم وحدهن لمساعدتهن. ما الخلل الأساسي في هذا التطبيق؟","o":["نمط «واحد يدرّس وواحد يدعم» مرفوض في التدريس التشاركي، ويجب استبعاده من خطة الفصل","تثبيت الأدوار جعل معلمة التربية الخاصة مساعدة دائمة مسؤولة عن فئة محددة","كان ينبغي سحب الطالبات ذوات الصعوبات إلى غرفة المصادر بدل دعمهن داخل الفصل","تنقّل معلمة التربية الخاصة يشتت الطالبات، والأصح أن تجلس بجوار من تدعمهن طوال الحصة"],"a":1,"w":"التدريس التشاركي شراكة مخطط لها تتقاسم فيها المعلمتان التخطيط والتدريس والمسؤولية عن جميع الطالبات. ونمط «واحد يدرّس وواحد يدعم» مقبول بحد ذاته، لكن تثبيته طوال العام يجعل معلمة التربية الخاصة مساعدة دائمة، ويحوّل الطالبات ذوات الصعوبات إلى مسؤوليتها وحدها.","n":["النمط مقبول ضمن أنماط التدريس التشاركي إذا تبادلت المعلمتان الأدوار.","صحيح: المسؤولية مشتركة عن جميع الطالبات والأدوار متبادلة.","يعالج الخلل بالعزل، والمشكلة في توزيع الأدوار لا في مكان الدعم.","يرسّخ المساعدة اللصيقة ويُبقي المسؤولية محصورة في فئة واحدة."],"c":"الشرح في كل الحصص … ذوات الصعوبات وحدهن","p":"التدريس التشاركي = تخطيط مشترك + أدوار متبادلة + مسؤولية عن جميع الطلاب."},{"id":"6-06","s":6,"i":"6.1","l":"تحليل","t":"عرض أحد أعضاء الفريق دليلًا على نجاح تجربة الشمول للطالب يزن، فقال: «يقضي يزن 95% من يومه الدراسي في الفصل العام». ما التقييم الأدق لهذا الدليل؟","o":["يثبت الحضور المكاني فقط، ويلزم معه بيانات عن مشاركة يزن وتقدمه وانتمائه","يكفي لإثبات النجاح، لأن البيئة الأقل تقييدًا تحققت لديه بدرجة شبه كاملة","يكفي لإثبات النجاح إذا أضيف إليه رضا الأسرة عن وجوده في الفصل العام","يدل على ضرورة إلغاء الوقت المتبقي خارج الفصل حتى يكتمل الشمول"],"a":0,"w":"نجاح الشمول يُقاس بأبعاد متعددة عبر الزمن: الحضور والمشاركة والتعلم والانتماء والاستقلال. ونسبة الوقت في الفصل العام تصف الحضور وحده، فقد يكون الطالب حاضرًا طوال اليوم دون دور أو تقدم.","n":["صحيح: الشمول متعدد الأبعاد ولا يُختزل في الوقت.","يخلط بين نسبة الوقت ونجاح الشمول؛ والبيئة الأقل تقييدًا ليست مرادفًا للشمول.","رضا الأسرة منظور مهم، لكنه لا يقيس المشاركة والتعلم.","الخدمة خارج الفصل قد تكون مبررة، والشمول لا يُقاس بالدقائق."],"c":"95% من يومه الدراسي في الفصل العام","p":"نسبة الوقت ومكان الجلوس ليسا دليلًا كافيًا؛ اطلب بيانات المشاركة والتقدم والانتماء."},{"id":"6-07","s":6,"i":"6.1","l":"تطبيق","t":"انتقلت الطالبة جود إلى المدرسة ومعها تقرير يفيد بأن لديها صعوبات تعلم في القراءة، فاقترح أحد أعضاء الفريق إلحاقها مباشرة ببرنامج منفصل طوال اليوم «لأن حالتها معروفة». ما الإجراء الأنسب؟","o":["جمع بيانات عن أدائها الحالي واحتياجاتها والدعم الممكن قبل تحديد بيئتها التعليمية","اعتماد المقترح مؤقتًا حتى تتكيف جود مع المدرسة ثم إعادة النظر فيه","إلحاقها بالفصل العام طوال اليوم دون أي خدمات لأن الشمول يرفض الخدمة الفردية","اعتماد التشخيص الوارد في التقرير أساسًا كافيًا لتحديد البيئة المناسبة لها"],"a":0,"w":"التشخيص معلومة مفيدة، لكنه لا يحدد مكان التعليم. وقرار البيئة الأقل تقييدًا قرار فردي يوازن بين الأداء الحالي والاحتياجات والدعم الممكن وجودة المشاركة؛ لذا تُجمع البيانات أولًا قبل أي قرار إقصائي.","n":["صحيح: قرار البيئة فردي ومبني على البيانات لا على التشخيص.","يبدأ بالبيئة الأشد تقييدًا دون بيانات، ويجعل العودة إلى الفصل استثناءً.","الشمول لا يرفض الخدمات الفردية متى بررتها الحاجة.","التشخيص معلومة لا قرار مكان، والقرار يُبنى على الأداء الحالي."],"c":"مباشرة … «لأن حالتها معروفة»","p":"التشخيص ≠ قرار مكان؛ البيانات الفردية أولًا ثم البيئة الأقل تقييدًا المناسبة."},{"id":"6-08","s":6,"i":"6.1","l":"تطبيق","t":"ترى معلمة أن «العدل» يقتضي منح جميع طالبات الفصل الوقت نفسه في اختبار التاريخ، مع أن الطالبة نورة لديها بطء معالجة موثق في خطتها الفردية، والاختبار لا يقيس السرعة. ما الإجراء الأنسب؟","o":["توحيد الوقت لجميع الطالبات لأن أي اختلاف بينهن يُخلّ بتكافؤ الفرص","منح نورة الوقت الإضافي الموثق في خطتها مع إبقاء الأسئلة ومعايير التصحيح نفسها","تخفيض عدد أسئلة نورة إلى النصف بدل منحها وقتًا إضافيًا في الاختبار","إعفاء نورة من الاختبار وتقدير درجتها من أعمالها الصفية خلال الفصل"],"a":1,"w":"العدالة التعليمية (Equity) تعني تقديم ما تحتاجه كل طالبة لتحصل على فرصة تعلم وتقويم عادلة، لا إعطاء الجميع الشيء نفسه. وما دام الاختبار لا يقيس السرعة، فالوقت الإضافي الموثق يزيل حاجز بطء المعالجة دون تغيير الهدف.","n":["خلط بين المساواة والعدالة؛ العدالة تقديم ما تحتاجه كل طالبة.","صحيح: العدالة دعم وفق الحاجة مع ثبات الهدف.","يغيّر نطاق ما يُقاس، والحاجز المحدد زمني.","إعفاء غير مبرر، والحاجز يُعالج بتكييف بسيط موثق."],"c":"بطء معالجة موثق … الاختبار لا يقيس السرعة","p":"العدالة ≠ المساواة: أعطِ كل طالب ما يحتاجه مع ثبات ما يُقاس."},{"id":"6-09","s":6,"i":"6.2","l":"معرفة","t":"أي الإجراءات الآتية يُعد تعديلًا (Modification) لا تكييفًا (Accommodation)؟","o":["السماح للطالب بالإجابة شفهيًا عن أسئلة اختبار العلوم بدل كتابة الإجابات","تقديم الاختبار نفسه للطالب في غرفة هادئة بعيدًا عن مشتتات القاعة","تكبير خط ورقة العمل وزيادة المسافات بين سطورها مع بقاء أسئلتها كما هي","تكليف الطالب بمسائل جمع بسيطة بينما يحل زملاؤه مسائل ضرب متعددة الخطوات"],"a":3,"w":"التعديل يغيّر ما يُتوقع من الطالب تعلمه أو مستوى التعقيد أو المعيار نفسه، كاستبدال مسائل ضرب متعددة الخطوات بمسائل جمع بسيطة. أما التكييف فيغيّر طريقة العرض أو الاستجابة أو البيئة أو الزمن مع بقاء الهدف المقاس.","n":["تكييف استجابة؛ فالكتابة ليست المهارة المقاسة في اختبار العلوم.","تكييف بيئة؛ الاختبار والهدف لم يتغيرا.","تكييف عرض يغيّر الشكل لا المحتوى.","صحيح: تغيّر مستوى المحتوى المتوقع تعلمه."],"c":"تعديلًا لا تكييفًا","p":"اسأل: هل تغيّر «ماذا» يتعلم الطالب؟ فهو تعديل. أم «كيف» يصل ويستجيب؟ فهو تكييف."},{"
