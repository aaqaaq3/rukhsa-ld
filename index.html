<head>

<meta name="description" content="٧٤٨ سؤالًا محاكيًا لاختبار الرخصة المهنية للمعلمين – التربية الخاصة (صعوبات التعلم)، مع تغذية راجعة لكل سؤال. إعداد الدكتور محمد قرموش.">

<meta property="og:description" content="٧٤٨ سؤالًا محاكيًا لاختبار الرخصة المهنية – التربية الخاصة (صعوبات التعلم)، مع تغذية راجعة لكل سؤال. إعداد الدكتور محمد قرموش.">

<title>محاكي رخصة صعوبات التعلم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700;800&display=swap">
<style>
/* Layout: one app column (max 760px), quiz screens get a sticky progress bar; standards as a two-column list that stacks on phones */
:root {
  --bg: #F1F4F3;
  --surface: #FFFFFF;
  --surface-2: #E6ECEA;
  --ink: #13282B;
  --muted: #566B6E;
  --line: #D3DDDB;
  --accent: #0A6B66;
  --accent-ink: #FFFFFF;
  --accent-soft: #D5EBE8;
  --ok: #1D7443;
  --ok-soft: #DDF0E3;
  --bad: #AF2A1E;
  --bad-soft: #FAE3DF;
  --flag: #9A6200;
  --flag-soft: #F8EBCF;
  --shadow: 0 1px 2px rgba(19,40,43,.06), 0 6px 18px rgba(19,40,43,.06);
  --font-display: "Noto Kufi Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  --font-body: "IBM Plex Sans Arabic", "Geeza Pro", "Segoe UI", Tahoma, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1618; --surface: #142124; --surface-2: #1B2C30; --ink: #E2ECEA; --muted: #93A7A9; --line: #263A3E;
    --accent: #3BB0A8; --accent-ink: #052220; --accent-soft: #123735;
    --ok: #52C483; --ok-soft: #10301E; --bad: #F07C70; --bad-soft: #3A1A16; --flag: #E2A740; --flag-soft: #33270F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1618; --surface: #142124; --surface-2: #1B2C30; --ink: #E2ECEA; --muted: #93A7A9; --line: #263A3E;
  --accent: #3BB0A8; --accent-ink: #052220; --accent-soft: #123735;
  --ok: #52C483; --ok-soft: #10301E; --bad: #F07C70; --bad-soft: #3A1A16; --flag: #E2A740; --flag-soft: #33270F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.75; }
#app { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.5; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 16px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row.end { justify-content: flex-end; }
.grow { flex: 1 1 auto; }

/* hero */
.hero { display: grid; gap: 10px; padding-block: 8px 4px; }
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--accent); }
.byline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 14.5px; }
.byline .who { font-family: var(--font-display); font-weight: 700; color: var(--ink); }
.byline .who span { color: var(--accent); }
.byline .ai { font-size: 12.5px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.hero h1 { font-size: clamp(26px, 6vw, 36px); font-weight: 800; }
.hero p { color: var(--muted); max-width: 62ch; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: grid; gap: 0; }
.stat b { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.4; }
.stat span { font-size: 12.5px; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0,1fr)); } }

/* panels */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.panel h2 { font-size: 19px; font-weight: 700; }
.panel .lead { color: var(--muted); font-size: 14.5px; }
.field { display: grid; gap: 6px; }
.field > label, .field > .lbl { font-size: 13.5px; font-weight: 600; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14.5px; min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.resume { border-color: var(--accent); background: var(--accent-soft); box-shadow: none; }

.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding-top: 6px; }
.section-title h2 { font-size: 20px; }

/* standards list */
.stds { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
@media (max-width: 600px) { .stds { grid-template-columns: minmax(0,1fr); } }
.std { text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 4px 12px; align-items: start; }
.std:hover { border-color: var(--accent); }
.std .no { grid-row: span 2; width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-family: var(--font-display); font-weight: 700; display: grid; place-items: center; font-size: 16px; }
.std .t { font-weight: 600; font-size: 15px; line-height: 1.6; }
.std .m { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); }
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.bar.ok > i { background: var(--ok); }

/* standard page */
.back { justify-self: start; background: none; border: none; color: var(--accent); font-weight: 600; padding: 4px 0; }
.inds { display: grid; gap: 8px; }
.ind { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 10px; align-items: start; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--surface); text-align: start; }
.ind[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.ind .box { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line); margin-top: 4px; display: grid; place-items: center; font-size: 13px; color: var(--accent-ink); }
.ind[aria-pressed="true"] .box { background: var(--accent); border-color: var(--accent); }
.ind .code { font-weight: 700; color: var(--accent); }
.ind .cnt { font-size: 12.5px; color: var(--muted); white-space: nowrap; margin-top: 3px; }

/* quiz */
.qbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; display: grid; gap: 8px; margin-inline: -16px; padding-inline: 16px; border-bottom: 1px solid var(--line); }
.qbar .row { justify-content: space-between; }
.qbar .pos { font-weight: 700; }
.tally { display: flex; gap: 6px; }
.tally span { font-size: 13px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.tally .t-ok { background: var(--ok-soft); color: var(--ok); }
.tally .t-bad { background: var(--bad-soft); color: var(--bad); }
.linkbtn { background: none; border: none; color: var(--muted); font-weight: 600; padding: 6px 0; min-height: 40px; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; box-shadow: var(--shadow); }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
.chip.acc { background: var(--accent-soft); color: var(--accent); }
.flagbtn { margin-inline-start: auto; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 12px; font-size: 12.5px; font-weight: 600; color: var(--muted); min-height: 32px; }
.flagbtn[aria-pressed="true"] { background: var(--flag-soft); color: var(--flag); border-color: var(--flag); }
.indtext { font-size: 13px; color: var(--muted); line-height: 1.7; }
.stem { font-family: var(--font-body); font-size: 18.5px; font-weight: 600; line-height: 1.85; }
.opts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.opt { width: 100%; text-align: start; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: start; line-height: 1.75; font-size: 16px; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .let { width: 30px; height: 30px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; font-size: 15px; margin-top: 1px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .let { background: var(--accent); color: var(--accent-ink); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .let { background: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .let { background: var(--bad); color: var(--surface); }
.opt[disabled] { cursor: default; }
.onote { font-size: 14px; color: var(--muted); padding: 6px 14px 0; padding-inline-start: 56px; line-height: 1.7; }
.onote.r { color: var(--ok); }
.onote.w { color: var(--bad); }
.fb { border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.fb.ok { border-color: var(--ok); }
.fb.bad { border-color: var(--bad); }
.fb-head { font-family: var(--font-display); font-weight: 700; font-size: 16.5px; }
.fb.ok .fb-head { color: var(--ok); }
.fb.bad .fb-head { color: var(--bad); }
.fb dl { margin: 0; display: grid; gap: 4px; }
.fb dt { font-size: 13px; font-weight: 700; color: var(--accent); }
.fb dd { margin: 0 0 6px; }
.tip { border-top: 1px dashed var(--line); padding-top: 10px; font-size: 14.5px; }
.tip b { color: var(--flag); }
.qnav { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 6px; }
.qnav button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; min-height: 38px; font-size: 13.5px; font-weight: 600; }
.qnav button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.qnav button.cur { outline: 2px solid var(--ink); }
.qnav button.fl { border-color: var(--flag); color: var(--flag); }
.confirm { border: 1px solid var(--flag); background: var(--flag-soft); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; }

/* results */
.score { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 18px; align-items: center; }
.ring { width: 118px; height: 118px; }
.ring circle { fill: none; stroke-width: 10; }
.ring .trk { stroke: var(--surface-2); }
.ring .val { stroke: var(--accent); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; }
.ring text { fill: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.verdict { font-family: var(--font-display); font-size: 20px; font-weight: 700; }
.brk { display: grid; gap: 8px; }
.brk-row { display: grid; grid-template-columns: minmax(0, 1fr) 90px; gap: 4px 12px; align-items: center; font-size: 14px; }
.brk-row .bar { grid-column: 1 / -1; }
.brk-row .v { text-align: end; color: var(--muted); font-weight: 600; }
.rev { display: grid; gap: 10px; }
.rev details { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.rev summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0,1fr); gap: 10px; align-items: start; }
.rev summary::-webkit-details-marker { display: none; }
.rev .mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px; margin-top: 2px; }
.rev .mark.ok { background: var(--ok-soft); color: var(--ok); }
.rev .mark.bad { background: var(--bad-soft); color: var(--bad); }
.rev .mark.skip { background: var(--surface-2); color: var(--muted); }
.rev .body { padding: 0 14px 14px; display: grid; gap: 10px; }
.rev .ans { font-size: 14.5px; }
.rev .ans .r { color: var(--ok); font-weight: 600; }
.rev .ans .w { color: var(--bad); font-weight: 600; }
.foot { font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
@media (prefers-reduced-motion: no-preference) {
  .qcard, .panel { animation: rise .22s ease-out; }
  @keyframes rise { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
  .bar > i { transition: width .4s ease; }
}
</style>
</head>

ريقة جمع معلومات التقييم من مصادر متنوعة وتفسيرها بغرض اتخاذ القرارات التربوية"},{"id":"3.5","text":"يصف الممارسات المهنية والأخلاقية في التربية الخاصة"}]},{"n":4,"title":"البرنامج التربوي الفردي وإجراءات تنفيذه","indicators":[{"id":"4.1","text":"يوضح مفهوم البرنامج التربوي الفردي وأهميته ومكوناته وإجراءات إعداده وتنفيذه ومراجعته"},{"id":"4.2","text":"يصف أدوار أعضاء فريق عمل البرنامج التربوي الفردي"},{"id":"4.3","text":"يبني البرنامج التربوي الفردي بناءً على نتائج تشخيص الطلاب وخصائصهم"},{"id":"4.4","text":"يخطط لأنشطة التعلم في ضوء محتوى المنهج وغاياته"},{"id":"4.5","text":"يصمم البرامج الفعالة التي توظف مصادر متنوعة، بما في ذلك أدوات التقنية المساعدة"}]},{"n":5,"title":"مفهوم التدخل المبكر والممارسات التطبيقية","indicators":[{"id":"5.1","text":"يبيّن مفهوم التدخل المبكر وأهميته ومبرراته"},{"id":"5.2","text":"يوضح اضطرابات الطفولة المبكرة (تأخر النمو والإعاقة)"},{"id":"5.3","text":"يوضح مفهوم الوقاية ومستوياتها وإجراءاتها"},{"id":"5.4","text":"يحدد الفئات المستهدفة في التدخل المبكر، وأسس تشخيصهم، وعلاقة التشخيص بتقديم الخدمات"},{"id":"5.5","text":"أساليب وبرامج واستراتيجيات ونماذج التدخل المبكر لذوي الإعاقة"},{"id":"5.6","text":"يحدد دور كل عضو في فريق العمل ببرامج التدخل المبكر"}]},{"n":6,"title":"مفهوم التعليم الشامل وتطبيقاته","indicators":[{"id":"6.1","text":"يوضح مفهوم التعليم الشامل لذوي الإعاقة وصعوبات التعلم وتطبيقاته"},{"id":"6.2","text":"يبيّن طرق وصول الطلاب إلى المنهج العام من خلال التكييفات والتعديلات التعليمية"},{"id":"6.3","text":"يوضح مفهوم الوصول الشامل (Universal Access) ومبادئه"},{"id":"6.4","text":"يحدد احتياجات الطلاب من التقنية المساعدة (Assistive Technology)"},{"id":"6.5","text":"يوضح نظام الدعم المتعدد المستويات (MTSS) وإجراءات تنفيذه"},{"id":"6.6","text":"يبيّن دور المعلم المساعد في الفصل الدراسي"}]},{"n":7,"title":"برامج دعم السلوك الإيجابي (PBS)","indicators":[{"id":"7.1","text":"يوضح دعم السلوك الإيجابي (PBS) وأسسه النظرية والأساليب العلمية في تعديل السلوك"},{"id":"7.2","text":"يميز بين السلوك الإنساني السوي ومهارات السلوك التكيفي ومظاه التاريخي لمجال صعوبات التعلم"},{"id":"11.2","text":"يبين النظريات المفسرة لصعوبات التعلم والمفاهيم التي تبنتها تلك النظريات"},{"id":"11.3","text":"يشرح التعريفات والمفاهيم التي يقوم عليها مجال صعوبات التعلم"},{"id":"11.4","text":"الأنظمة والتشريعات التي يقوم عليها مجال صعوبات التعلم"},{"id":"11.5","text":"مستجدات وقضايا محتوى المواد الدراسية وتطبيقاتها مع الطلاب ذوي صعوبات التعلم"},{"id":"11.6","text":"الدليل التنظيمي والإجرائي للتربية الخاصة ودليل معلم/معلمة صعوبات التعلم"},{"id":"11.7","text":"أسباب صعوبات التعلم والعوامل المؤثرة"},{"id":"11.8","text":"اللغة الأكاديمية المتعلقة بمجال صعوبات التعلم"}]},{"n":12,"title":"معرفة الخصائص العامة للطلاب ذوي صعوبات التعلم","indicators":[{"id":"12.1","text":"يميز بين الاختلافات والفروق الفردية بين الطلاب ذوي صعوبات التعلم ومراعاتها في بيئة التعلم"},{"id":"12.2","text":"الخصائص النمائية والمعرفية والأكاديمية والاجتماعية والنفسية لذوي صعوبات التعلم"},{"id":"12.3","text":"المقارنة التشخيصية والتربوية بين الطلاب ذوي صعوبات التعلم والفئات الأخرى والطلاب العاديين"},{"id":"12.4","text":"تحديد القدرات والمواهب المختلفة لطلاب صعوبات التعلم واستثمار نقاط القوة في بيئة التعلم"},{"id":"12.5","text":"المؤشرات المبكرة والمعرضون لخطر صعوبات التعلم"}]},{"n":13,"title":"معرفة كيفية تعلم الطلاب ذوي صعوبات التعلم","indicators":[{"id":"13.1","text":"معرفة وفهم محتوى المواد الدراسية المرتبطة بصعوبات التعلم"},{"id":"13.2","text":"يوضح ما يُتوقع من الطلاب تعلمه نتيجة لكل نشاط"},{"id":"13.3","text":"استخدام طرق لتشجيع الأفكار الإيجابية لدى الطلاب ذوي صعوبات التعلم فيما يخص قدراتهم على التعلم، وتشجيع السلوكات فوق المعرفية مثل التأمل والتدبر ومراقبة تعلمهم"},{"id":"13.4","text":"ربط مهارات وخصائص صعوبات التعلم بتأثيراتها في الحياة اليومية"},{"id":"13.5","text":"الأبحاث المعاصرة في التدريس الفاعل لصعوبات التعلم"},{"id":"13.6","text":"المشكلات النمائية والمعرفية وعلاقتها بالتعثر الأكاديمي"}]},{"n":14,"title":"معرفة طرق التدريس الخاصة بصعوبات التعلم","indicators":[{"id":"14.1","text":"نظريات التعلم وتطبيقاتها في تدريس الطلاب ذوي صعوبات التعلم"},{"id":"14.2","text":"يحدد القضايا التدريسية وتطور طرق واستراتيجيات التدريس"},{"id":"14.3","text":"يطبق استراتيجيات التدريس المناسبة للقراءة والكتابة والرياضيات في ضوء العمليات النفسية المؤثرة في التعلم"},{"id":"14.4","text":"استخدام نطاق واسع من الطرق لتقديم محتوى المنهج"},{"id":"14.5","text":"يطبق استراتيجيات التعلم والتدريس المدعومة بالبحوث للطلاب ذوي صعوبات التعلم"},{"id":"14.6","text":"يكيّف طرق التدريس الفردي والجماعي بما يلائم الطلاب ذوي صعوبات التعلم"}]},{"n":15,"title":"تصميم برامج التعلم المتكاملة في مجال صعوبات التعلم","indicators":[{"id":"15.1","text":"الربط بين المحتوى وطرق التدريس لتصميم خطة تربوية فردية واضحة وقابلة للتحقيق"},{"id":"15.2","text":"تصميم الخطة التربوية الفردية في ضوء محتوى المنهج واحتياجات الطالب ذي صعوبات التعلم"},{"id":"15.3","text":"يبين الأساليب المستخدمة لتطبيق الاختبارات والاستفادة من النتائج في تصميم برامج التعلم"},{"id":"15.4","text":"يبني الأهداف بطريقة تسلسلية تسهل اكتساب وتطوير مهارات ذوي صعوبات التعلم"},{"id":"15.6","text":"يصف البرامج الانتقالية، ومراحل إعداد الخطط الانتقالية، وآلية تقديمها وتقويمها للطلاب ذوي صعوبات التعلم، ويحدد طبيعة دوره فيها"},{"id":"15.7","text":"يستخدم المصادر المناسبة لدعم برامج التعلم والتدريس، ويعرف كيفية الوصول إلى المواد التي تساعده على تطبيق برامج التعلم"}]},{"n":16,"title":"التهيئة لفرص التعلم للطلاب ذوي صعوبات التعلم","indicators":[{"id":"16.1","text":"يستخدم أساليب وطرق عرض متنوعة توضح المفاهيم الأساسية للقراءة والكتابة والرياضيات"},{"id":"16.2","text":"يُجري تعديلات على الدروس بناءً على أحكام واقعية مستقاة من اهتمامات وقدرات الطلاب ذوي صعوبات التعلم"},{"id":"16.3","text":"يطبق مع الطلاب ذوي صعوبات التعلم طرقًا تمكّنهم من أن يكونوا فاعلين ومبادرين في العملية التعليمية"},{"id":"16.4","text":"يهيئ البيئة التربوية المناسبة وفقًا لاحتياجات الطلاب ذوي صعوبات التعلم، ويستخدم المصادر والأدوات والتقنية المتنوعة ويعدّلها ويقوّمها لدعم تعلمهم"},{"id":"16.5","text":"يعرف طرق تعديل الأهداف للخطة التربوية الفردية لكل طالب حسب حاجاته وقدراته"}]},{"n":17,"title":"التعزيز لتعلم الطلاب ذوي صعوبات التعلم","indicators":[{"id":"17.1","text":"يربط المهارة الجديدة مع التعلم السابق ليساعد الطلاب ذوي صعوبات التعلم على رؤية تقدمهم مع مرور الوقت"},{"id":"17.2","text":"يستخدم التعزيز المناسب لكل مرحلة من مراحل التعلم"},{"id":"17.3","text":"يوظف الطرق والأساليب الخاصة بتعزيز تعلم الطلاب ذوي صعوبات التعلم"},{"id":"17.4","text":"يطبق أساليب تحفيزية تسهّل احتفاظ الطلاب ذوي صعوبات التعلم بالمهارات وتنمّي قدرتهم على تعميمها في بيئات التعلم وغيرها"}]},{"n":18,"title":"المعرفة بمفهوم وأساليب قياس وتشخيص وتقويم الطلاب ذوي صعوبات التعلم","indicators":[{"id":"18.1","text":"يوضح محكات ومعايير التعرف على الطلاب ذوي صعوبات التعلم"},{"id":"18.2","text":"يستخدم أدوات القياس والتشخيص الرسمية وغير الرسمية في مجال صعوبات التعلم"},{"id":"18.3","text":"يطبق نطاقًا واسعًا من أساليب تقويم تعلم الطلاب ذوي صعوبات التعلم وتنمية فهمهم، ويحلل البيانات التي حصل عليها، ويستخدمها في تصميم وتعديل الخطة التربوية الفردية"},{"id":"18.4","text":"يختار الطرق المناسبة لتقويم تعلم الطلاب ذوي صعوبات التعلم فيما سبق تدريسه"},{"id":"18.5","text":"يوظف نتائج التقويم لمزيد من التخطيط للتدريس والتعلم وتعديل الخطط المستقبلية"},{"id":"18.6","text":"يطبق قواعد وأسس وأهداف التقويم للطلاب ذوي صعوبات التعلم بناءً على اللوائح والأنظمة الخاصة بتقويمهم الصادرة من وزارة التعليم"},{"id":"18.7","text":"يعرف تأثير الممارسات الخاطئة في عملية القياس والتشخيص للطلاب ذوي صعوبات التعلم، ويعدل أساليب التقويم وفقًا لاحتياجاتهم"},{"id":"18.8","text":"يستخدم أساليب تقويم متنوعة مع مراعاة مزايا وعيوب كل أسلوب"},{"id":"18.9","text":"يعد أدوات تقويم واضحة ومناسبة لتقويم التحصيل الدراسي للطلاب ذوي صعوبات التعلم"}]}],"q":[{"id":"1-01","s":1,"i":"1.1","l":"معرفة","t":"عرّف أحد المعلمين في لقاء تعريفي التربية الخاصة بأنها «الفصول والمعاهد المنفصلة التي يُعلَّم فيها الطلاب ذوو الإعاقة». أي التعريفات الآتية يصحح هذا الفهم بدقة؟","o":["برامج تعليمية تُقدَّم داخل الفصل العام حصرًا، لضمان وجود جميع الطلاب ذوي الإعاقة مع أقرانهم طوال اليوم","خدمات علاجية وطبية تُقدَّم للطلاب ذوي الإعاقة بديلًا عن المنهج الدراسي المعتاد في المدرسة","خدمات تربوية مصممة فرديًّا لتلبية احتياجات لا يوفرها البرنامج العام وحده، وقد تُقدَّم في بيئات متعددة","مناهج مبسطة موحدة تُطبَّق على كل فئة من فئات الإعاقة بحسب التشخيص الوارد في ملف الطالب"],"a":2,"w":"جوهر التربية الخاصة نوع الخدمة ودرجة تفريدها وملاءمتها لحاجة الطالب، لا المكان الذي تُقدَّم فيه. فقد تُقدَّم في الفصل العام أو غرفة المصادر أو الفصل الخاص أو بيئة أكثر تخصصًا، وتشمل التكييفات والتعديلات والخدمات المساندة التي لا يوفرها البرنامج العام وحده.","n":["يصحح خطأ العزل بخطأ معاكس؛ فحصر الخدمة في الفصل العام يتجاهل سلسلة البدائل.","يخلط الخدمات المساندة بالعلاج الطبي ويجعلها بديلًا عن التعليم.","صحيح: يربط المفهوم بالتفريد والحاجة لا بالمكان.","التوحيد بحسب الفئة يناقض التفريد الذي يقوم عليه المفهوم."],"c":"الفصول والمعاهد المنفصلة","p":"التربية الخاصة تُعرَّف بنوع الخدمة ودرجة تفريدها، لا بمكان تقديمها."},{"id":"1-02","s":1,"i":"1.1","l":"تطبيق","t":"ترفض معلمة الرياضيات قراءة المسائل اللفظية بصوت مسموع لفيصل (ذي صعوبة في القراءة) في الاختبار، بحجة أن العدل يقتضي معاملة جميع الطلاب بالطريقة نفسها، مع أن الاختبار يقيس مهارة حل المسائل لا القراءة. ما الموقف الأكثر اتساقًا مع فلسفة التربية الخاصة؟","o":["قراءة المسائل له مع بقاء مهارة الحل المقيسة؛ فالعدالة تقديم ما يحتاجه للوصول إلى الهدف","إعفاؤه من المسائل اللفظية والاكتفاء بالمسائل الرقمية المباشرة التي لا تتطلب منه أي قراءة","إبقاء إجراء الاختبار كما هو للجميع، ثم مراعاة صعوبته في القراءة عند تقدير درجته النهائية","تكليفه بتدريب قرائي مكثف قبل موعد الاختبار بدلًا من تقديم أي تكييف له في أثنائه"],"a":0,"w":"العدالة التعليمية تعني تقديم ما يحتاجه كل طالب لتحقيق فرصة عادلة، لا تقديم الشيء نفسه للجميع. وما دامت القراءة ليست المهارة المقيسة، فإن قراءة المسائل تزيل عائق الوصول دون أن تخفض الهدف، فتقيس قدرة فيصل الحقيقية على الحل.","n":["صحيح: يزيل عائق الوصول مع بقاء الهدف.","يحذف جزءًا من المطلوب، فيتحول إلى تعديل لا تستدعيه الحاجة.","يُبقي العائق ثم يعوّض بالتقدير، فلا يقيس المهارة بدقة.","التدريب القرائي مفيد، لكنه لا يحل مشكلة الوصول في الاختبار الحالي."],"c":"يقيس مهارة حل المسائل لا القراءة","p":"العدالة تقديم ما يحتاجه كل طالب للوصول إلى الهدف نفسه، لا تقديم الشيء نفسه للجميع."},{"id":"1-03","s":1,"i":"1.1","l":"تطبيق","t":"تحمل المساعدة حقيبة جود (طالبة في الصف السادس ذات إعاقة) وترتب أدواتها وتجيب عنها حين يسألها أحد، بدافع الشفقة عليها، مع أن جود قادرة على تعلم كثير من ذلك. أي توجيه يعكس فلسفة الانتقال من الرعاية إلى التمكين؟","o":["استمرار المساعدة في أداء المهام عنها حفاظًا على راحتها وتجنبًا لإحراجها أمام زميلاتها","تكليف زميلة متطوعة بتولي هذه المهام عنها لتتفرغ المساعدة لخدمة طالبات أخريات","تعليم جود تنظيم أدواتها والتعبير عن احتياجاتها بنفسها، مع خفض المساعدة تدريجيًّا","إعفاء جود من المهام التنظيمية كلها والتركيز على أهدافها الأكاديمية فقط"],"a":2,"w":"تنتقل فلسفة التربية الخاصة من الرعاية والشفقة إلى التمكين: الاستقلال والمشاركة والدفاع عن الذات. لذلك يُعلَّم الطالب ما يستطيع تعلمه، وتُقدَّم المساعدة بالقدر الضروري ثم تُسحب تدريجيًّا.","n":["يكرس الاعتمادية والشفقة، وهما عكس التمكين.","ينقل الاعتمادية من المساعدة إلى الزميلة ولا يعلّم المهارة.","صحيح: يبني الاستقلال ويسحب المساعدة تدريجيًّا.","الإعفاء يحرمها مهارات استقلالية هي من أهداف التربية الخاصة."],"c":"بدافع الشفقة… قادرة على تعلم","p":"إذا ورد «التمكين» فابحث عن الاستقلال والمشاركة، لا عن مزيد من المساعدة."},{"id":"1-04","s":1,"i":"1.1","l":"تطبيق","t":"يعلّم معلم صعوبات التعلم عبدالله استراتيجية من أربع خطوات لحل المسائل اللفظية. نمذج المعلم الاستراتيجية مرتين وهو يفكر بصوت مرتفع، وتابعه عبدالله باهتمام. ما الخطوة التالية الأنسب؟","o":["تكليفه بورقة عمل من عشر مسائل يحلها منفردًا للتأكد من إتقانه الاستراتيجية","نمذجة الاستراتيجية مرة ثالثة بمسائل أصعب قبل إشراكه في أي حل","إرسال المسائل واجبًا منزليًّا ليتدرب عليها مع أسرته ثم مناقشتها في الحصة التالية","حل مسائل مشابهة مع عبدالله بتلميحات وتغذية راجعة فورية قبل أن يحلها وحده"],"a":3,"w":"التدريس المباشر المنظم يسير من النمذجة إلى الممارسة الموجهة ثم الممارسة المستقلة. والممارسة الموجهة تتيح للطالب التطبيق بدعم وتلميحات وتغذية راجعة تمنع ترسخ الأخطاء قبل الاستقلال.","n":["يقفز إلى الممارسة المستقلة قبل التحقق من الأداء الموجّه.","يطيل النمذجة ويؤخر مشاركة الطالب في التطبيق.","ينقل التدريب الأول إلى المنزل قبل ضبط الأداء في الصف.","صحيح: ممارسة موجهة بعد النمذجة."],"c":"نمذج المعلم الاستراتيجية مرتين","p":"نمذجة ثم ممارسة موجهة ثم ممارسة مستقلة؛ لا تقفز إلى الاستقلال مباشرة."},{"id":"1-05","s":1,"i":"1.1","l":"تحليل","t":"سلمان طالب ذو صعوبة تعلم في الرياضيات، يدرس في الفصل العام بدعم من معلم صعوبات التعلم داخل الحصة. تُظهر بيانات ستة أسابيع أنه يحقق 85٪ من أهدافه الفردية ويشارك بفاعلية مع أقرانه. طلب والده نقله إلى فصل خاص «ليحظى بعناية أكبر». ما القرار الأكثر اتساقًا مع مبدأ البيئة الأقل تقييدًا؟","o":["إبقاؤه في بيئته الحالية مع الدعم، ومناقشة بيانات تقدمه مع والده في اجتماع الفريق","نقله إلى الفصل الخاص احترامًا لرغبة الأسرة بوصفها شريكًا أساسيًّا في القرار التربوي","نقله إلى غرفة المصادر في جميع حصص الرياضيات حلًّا وسطًا يرضي الفريق والأسرة","إيقاف الدعم داخل الحصة ما دام يحقق معظم أهدافه، والاكتفاء بمتابعة درجاته"],"a":0,"w":"البيئة الأقل تقييدًا هي التي تتيح أكبر مشاركة مناسبة مع الأقران مع بقاء التعليم فعالًا والدعم كافيًا، والبيانات هنا تثبت أن البيئة الحالية تحقق ذلك. والشراكة مع الأسرة تعني مناقشة البيانات معها، لا الانتقال إلى بيئة أكثر تقييدًا دون حاجة مثبتة.","n":["صحيح: البيانات تؤكد فاعلية البيئة الأقل تقييدًا.","الشراكة لا تعني تنفيذ طلب يزيد التقييد بلا مبرر من البيانات.","يزيد التقييد بلا حاجة؛ فالحل الوسط ليس معيارًا تربويًّا.","النجاح تحقق بالدعم، وإيقافه يتجاهل سبب النجاح."],"c":"يحقق 85٪ من أهدافه ويشارك بفاعلية","p":"لا تنتقل إلى بيئة أكثر تقييدًا ما دامت البيانات تثبت نجاح البيئة الأقل تقييدًا."},{"id":"1-06","s":1,"i":"1.1","l":"تحليل","t":"راجع مشرف خطة طالب في الصف الثاني الثانوي ذي صعوبة تعلم، فوجد أن جميع أهدافها أكاديمية مرتبطة بمقررات الفصل الحالي، ولا تتضمن أي إشارة إلى ما بعد المرحلة الثانوية. ما الخلل الأبرز في الخطة في ضوء أهداف التربية الخاصة؟","o":["إغفال الأهداف المستقبلية: الإعداد للانتقال وتنمية المهارات المهنية الملائمة لميوله","إغفال هدف الكشف والتدخل المبكرين لتقليل اتساع الفجوات الأكاديمية المتراكمة لديه منذ سنوات","كثرة الأهداف الأكاديمية بما يتجاوز ما يحتمله طالب في مثل مرحلته الدراسية","خلوها من تعديل محتوى المقررات بما يتناسب مع تشخيص صعوبة التعلم لديه"],"a":0,"w":"من أهداف التربية الخاصة الإعداد للانتقال بين المراحل وما بعد المدرسة، وتنمية المهارات المهنية والوظيفية الملائمة لقدرات الفرد وميوله. والطالب في المرحلة الثانوية يقترب من هذا الانتقال، فغياب هذا البعد هو الخلل الأوضح.","n":["صحيح: يقترب من التخرج ولا توجد أهداف انتقالية.","الكشف المبكر هدف صحيح لكنه لا يناسب طالبًا في المرحلة الثانوية.","لا قرينة في الموقف على أن عدد الأهداف مبالغ فيه.","صعوبة التعلم لا تستلزم تعديل المحتوى تلقائيًّا؛ فالقرار يُبنى على البيانات."],"c":"الصف الثاني الثانوي… ما بعد المرحلة","p":"كلما اقترب الطالب من نهاية مرحلته، فتش في خطته عن الأهداف الانتقالية والمهنية."},{"id":"1-07","s":1,"i":"1.2","l":"معرفة","t":"أي المحطات الآتية يمثل بداية التنظيم الإداري المؤسسي لخدمات التربية الخاصة في المملكة، لا بداية تقديم الخدمة نفسها؟","o":["افتتاح معهد النور للمكفوفين بالرياض عام 1380هـ","افتتاح أول معهد للأمل للصم عام 1384هـ","صدور القواعد التنظيمية لمعاهد وبرامج التربية الخاصة عام 1422هـ","إنشاء إدارة التربية الخاصة بوزارة المعارف عام 1382هـ"],"a":3,"w":"افتتاح معهد النور عام 1380هـ هو البداية الرسمية للتعليم الحكومي المنظم، أما إنشاء إدارة التربية الخاصة عام 1382هـ فيمثل بدء التنظيم المؤسسي والإداري الذي يشرف على الخدمات. ويكثر الخلط بين المحطتين في الاختبار.","n":["هذه بداية تقديم الخدمة الحكومية المنظمة، لا بداية التنظيم الإداري.","يمثل توسع الخدمات المنظمة لتشمل الإعاقة السمعية.","محطة تنظيمية لاحقة ضمن مرحلة التوسع والدمج، وليست البداية.","صحيح: 1382هـ بداية التنظيم الإداري."],"c":"بداية التنظيم الإداري… لا بداية الخدمة","p":"1380هـ بداية الخدمة الحكومية (معهد النور)، و1382هـ بداية التنظيم الإداري."},{"id":"1-08","s":1,"i":"1.2","l":"معرفة","t":"يُعدّ معلم خطًّا زمنيًّا لتطور التربية الخاصة في المملكة. أي الأحداث الآتية جاء بعد افتتاح أول معهد للأمل للصم؟","o":["افتتاح معهد النور للمكفوفين بالرياض","افتتاح معاهد التربية الفكرية","إنشاء إدارة التربية الخاصة بوزارة المعارف","المبادرات الأهلية في تعليم المكفوفين طريقة برايل"],"a":1,"w":"التسلسل الوارد في الخط الزمني: معهد النور (1380هـ) ثم إدارة التربية الخاصة (1382هـ) ثم معهد الأمل للصم (1384هـ) ثم معاهد التربية الفكرية. أما المبادرات الأهلية في تعليم برايل فسبقت التأسيس الحكومي كله.","n":["أول محطة حكومية، وقد سبقت معهد الأمل.","صحيح: جاءت بعد معهد الأمل ووسّعت الخدمة للإعاقة الفكرية.","سبقت معهد الأمل بعامين.","تنتمي إلى مرحلة الجهود الفردية قبل التأسيس الحكومي."],"c":"بعد افتتاح أول معهد للأمل","p":"رتّب المحطات: النور ثم الإدارة ثم الأمل ثم التربية الفكرية."},{"id":"1-09","s":1,"i":"1.2","l":"تطبيق","t":"يُعدّ معلم عرضًا عن مراحل تطور التربية الخاصة في المملكة، ويريد مثالًا مدرسيًّا يجسد مرحلة التمكين والشمولية في إطار رؤية السعودية 2030. أي مثال أنسب؟","o":["إلحاق فصول وبرامج خاصة بمدارس التعليم العام بدلًا من الاعتماد على المعاهد المستقلة المنفصلة عنها","تهيئة المباني والمنصات الرقمية للوصول الشامل، وإشراك الطلاب ذوي الإعاقة في القرارات المتعلقة بهم","افتتاح معهد مستقل جديد لكل فئة من فئات الإعاقة في كل منطقة تعليمية لتوفير بيئة متخصصة","تولي جمعيات أهلية تعليم المكفوفين طريقة برايل في غياب برامج حكومية منظمة"],"a":1,"w":"تتميز مرحلة التمكين والشمولية بالتركيز على الحقوق والوصول الشامل والتقنيات المساندة وتمكين الأشخاص ذوي الإعاقة في التعليم والعمل والمجتمع. لذلك يجسدها مثال يجمع إزالة الحواجز والمشاركة في القرار.","n":["سمة مرحلة التوسع والدمج، لا التمكين.","صحيح: وصول شامل وتمكين ومشاركة في القرار.","نمط المعاهد المنفصلة يرتبط بمرحلة التأسيس.","يصف مرحلة الجهود الفردية والخيرية."],"c":"مرحلة التمكين والشمولية","p":"الحقوق والوصول والتمكين قرائن المرحلة الحديثة، والبرامج الملحقة قرينة التوسع والدمج."},{"id":"1-10","s":1,"i":"1.2","l":"تطبيق","t":"صممت معلمة لوحة زمنية لتطور التربية الخاصة، ووضعت عبارة «ظهور غرف المصادر وبرامج صعوبات التعلم داخل مدارس التعليم العام» تحت مرحلة «التأسيس وإنشاء المعاهد». ما التصحيح المناسب؟","o":["إبقاؤها في مكانها؛ لأن المعاهد في مرحلة التأسيس هي التي احتضنت أولى غرف المصادر في المملكة","نقلها إلى مرحلة التمكين والشمولية؛ لأنها تعبّر عن حق الطالب ذي الإعاقة في التعلم مع أقرانه في المدرسة","نقلها إلى مرحلة التوسع والدمج؛ لأنها تعبّر عن التحول من المعاهد المستقلة إلى البرامج داخل المدارس","نقلها إلى مرحلة الجهود الفردية والخيرية؛ لأن غرف المصادر بدأت بمبادرات أهلية"],"a":2,"w":"غلب على مرحلة التأسيس نمط المعاهد والفصل عن مدارس التعليم العام، أما مرحلة التوسع والدمج فشهدت التحول إلى البرامج الملحقة بالمدارس وظهور غرف المصادر وبرامج صعوبات التعلم. لذلك موضع العبارة الصحيح هو التوسع والدمج.","n":["مرحلة التأسيس ارتبطت بالمعاهد المنفصلة لا بغرف المصادر.","الحقوق والتمكين سمة المرحلة الحديثة، وظهور غرف المصادر سبقها.","صحيح: غرف المصادر قرينة التوسع والدمج.","الجهود الأهلية ارتبطت بتعليم المكفوفين وبرايل قبل 1380هـ."],"c":"غرف المصادر… داخل مدارس التعليم العام","p":"«المعهد» يقودك إلى التأسيس، و«البرنامج الملحق وغرفة المصادر» إلى التوسع والدمج."},{"id":"1-11","s":1,"i":"1.2","l":"تحليل","t":"قال معلم في نقاش مهني: «مرحلة التمكين والشمولية لم تُضف جديدًا؛ فهي مجرد استمرار لزيادة عدد البرامج الملحقة بالمدارس». ما الرد الأدق على هذا الرأي؟","o":["أضافت بعدًا حقوقيًّا أوسع: الحقوق والوصول الشامل والتقنيات المساندة والتمكين في التعليم والعمل","الرأي صحيح؛ فالفرق بين المرحلتين ينحصر في عدد البرامج الملحقة وعدد الطلاب المستفيدين منها","أعادت الاعتماد على المعاهد المتخصصة المستقلة بعد أن ثبت ضعف البرامج الملحقة بمدارس التعليم العام","ألغت جميع الخدمات المتخصصة خارج الفصل العام، ونقلت كل الطلاب إليه طوال اليوم مهما كانت احتياجاتهم"],"a":0,"w":"مرحلة التوسع والدمج اتجاه تنظيمي وسّع البرامج داخل مدارس التعليم العام، أما مرحلة التمكين والشمولية فتحول فلسفي أوسع يركز على الحقوق والوصول وإزالة الحواجز والتمكين. لذلك لا يصح اختزال الفرق في زيادة عددية.","n":["صحيح: الفرق فلسفي حقوقي لا عددي.","يختزل التحول الفلسفي في زيادة عددية، وهو خطأ شائع.","يعكس اتجاه التطور؛ فالمرحلة الحديثة لم تعد إلى المعاهد.","الشمول لا يعني إلغاء الخدمات المتخصصة ولا الفصل العام لكل طالب."],"c":"مجرد استمرار لزيادة عدد البرامج","p":"الدمج توسع تنظيمي في البرامج، والشمول والتمكين تحول فلسفي حقوقي أوسع."},{"id":"1-12","s":1,"i":"1.3","l":"معرفة","t":"ورد في تقرير عن الطالبة ريم ثلاث عبارات: (1) تلف في شبكية العين، (2) عدم قدرتها على قراءة الكتاب المطبوع بالخط العادي، (3) عدم توفير المدرسة نسخًا مكبرة أو رقمية من الكتب. ما المصطلحات التي تصف العبارات الثلاث على الترتيب؟","o":["عجز (Disability)، ثم ضعف (Impairment)، ثم عائق بيئي (Handicap)","ضعف (Impairment)، ثم عجز (Disability)، ثم عائق بيئي (Handicap)","ضعف (Impairment)، ثم عائق بيئي (Handicap)، ثم عجز (Disability)","عائق بيئي (Handicap)، ثم عجز (Disability)، ثم ضعف (Impairment)"],"a":1,"w":"الضعف خلل في بنية العضو أو وظيفته (تلف الشبكية)، والعجز قيد وظيفي في أداء نشاط نتيجة الضعف (عدم القدرة على قراءة المطبوع)، والعائق البيئي صعوبة تنشأ من تفاعل الحالة مع حواجز البيئة (غياب النسخ المكبرة). فالتفكير فيها سلسلة: بنية ثم وظيفة ثم بيئة.","n":["يجعل القيد الوظيفي سابقًا للخلل العضوي، والعكس هو الصحيح.","صحيح: بنية ثم نشاط ثم بيئة.","يخلط بين غياب النسخ (بيئة) وعدم القدرة على القراءة (نشاط).","يعكس السلسلة كلها؛ فالتلف العضوي ضعف لا عائق."],"c":"تلف… عدم قدرة… عدم توفير","p":"عضو أو بنية = ضعف، ونشاط أو وظيفة = عجز، وبيئة أو حاجز = عائق."},{"id":"1-13","s":1,"i":"1.3","l":"تطبيق","t":"يُعدّ الفريق تقريرًا عن مازن، ويحتاج إلى وصف قدرته على العناية بنفسه، واستخدام النقود في المقصف، والتنقل داخل الحي، والتواصل في المواقف اليومية. تحت أي مفهوم تندرج هذه المهارات؟","o":["التعميم (Generalization)","الدمج الشامل (Inclusion)","السلوك التكيفي (Adaptive Behavior)","التكييف (Accommodation)"],"a":2,"w":"السلوك التكيفي قدرة الفرد على الاستقلالية ومواجهة متطلبات الحياة اليومية والاجتماعية، مثل العناية بالذات والتواصل واستخدام موارد المجتمع. أما التعميم فانتقال مهارة متعلمة إلى مواقف أو بيئات جديدة.","n":["التعميم انتقال مهارة إلى بيئة جديدة، لا مجموعة مهارات الحياة نفسها.","الدمج الشامل يصف تهيئة النظام لاستيعاب الطلاب، لا مهارات الفرد.","صحيح: استقلالية وعناية بالذات وتواصل يومي.","التكييف تغيير في طريقة الوصول، ويُخلط لفظيًّا بالسلوك التكيفي."],"c":"العناية بنفسه… التنقل… المواقف اليومية","p":"الاستقلالية والعناية بالذات والتواصل اليومي = سلوك تكيفي."},{"id":"1-14","s":1,"i":"1.3","l":"تطبيق","t":"عمر في الصف الرابع، تحصيله منخفض في جميع المواد بصورة متقاربة، ويحتاج وقتًا أطول وتبسيطًا في معظم المهام، وتشير نتائج تقييمه إلى قدرة عقلية دون المتوسط لا تبلغ حد الإعاقة الفكرية، ولا توجد ظروف بيئية أو أسرية تفسر انخفاضه. أي المصطلحات أقرب إلى وصف حالته؟","o":["صعوبات التعلم (Learning Disabilities)","بطء التعلم (Slow Learner)","التأخر الدراسي","الإعاقة الفكرية البسيطة"],"a":1,"w":"بطء التعلم انخفاض عام نسبي في القدرة على التعلم يصاحبه تحصيل منخفض متقارب عبر المواد. أما صعوبات التعلم فصعوبة نوعية في مهارة أو أكثر مع قدرة مناسبة، والتأخر الدراسي يرتبط بعوامل بيئية أو أسرية أو تعليمية مع سلامة القدرة.","n":["صعوبات التعلم نوعية في مهارات محددة، لا انخفاض عام في كل المواد.","صحيح: انخفاض عام متقارب مع قدرة دون المتوسط.","التأخر الدراسي يفترض سلامة القدرة ووجود عوامل بيئية، وكلاهما غير متحقق.","الموقف ينص على أن قدرته لا تبلغ حد الإعاقة الفكرية."],"c":"منخفض في جميع المواد بصورة متقاربة","p":"نوعي محدد = صعوبات تعلم، وعام متقارب = بطء تعلم، وسبب بيئي مع قدرة سليمة = تأخر دراسي."},{"id":"1-15","s":1,"i":"1.3","l":"تطبيق","t":"انتقل سعد بين ثلاث مدارس خلال عامين، وانقطع عن الدراسة فصلًا دراسيًّا كاملًا بسبب ظروف أسرية، فانخفض تحصيله في عدة مواد، بينما تشير الملاحظات إلى قدرة عقلية سليمة وفهم جيد لما يُشرح له. أي العبارات أدق في وصف حالته؟","o":["صعوبات تعلم؛ لأن انخفاض التحصيل في عدة مواد دراسية يكفي وحده لإثباتها","بطء تعلم؛ لأن انخفاض تحصيله شمل أكثر من مادة دراسية بصورة متقاربة خلال العامين الأخيرين","أقرب إلى التأخر الدراسي؛ لارتباط انخفاضه بعوامل بيئية وتعليمية مع سلامة القدرة","إعاقة فكرية بسيطة؛ لأن تحصيله تراجع رغم انتظامه الحالي في المدرسة"],"a":2,"w":"التأخر الدراسي انخفاض في التحصيل قد يرتبط بعوامل بيئية أو أسرية أو تعليمية مع سلامة القدرة العقلية الأساسية، وهذا ما تصفه قرائن الانتقال والانقطاع. ولا تُثبت صعوبات التعلم بمجرد انخفاض التحصيل، بل تحتاج تقييمًا شاملًا واستبعاد الأسباب البديلة.","n":["انخفاض التحصيل وحده لا يثبت صعوبات التعلم.","بطء التعلم يقترن بقدرة دون المتوسط، والموقف يذكر قدرة سليمة.","صحيح: عوامل بيئية وانقطاع مع قدرة سليمة.","لا قرينة على قصور في الأداء العقلي أو السلوك التكيفي."],"c":"انقطع… ظروف أسرية… قدرة عقلية سليمة","p":"إذا وُجد سبب بيئي أو تعليمي واضح مع قدرة سليمة ففكّر في التأخر الدراسي قبل غيره."},{"id":"1-16","s":1,"i":"1.3","l":"تحليل","t":"قدّم معلم لطالبين اختبار وحدة الكسور: سمح للأول بأن تُقرأ له الأسئلة وأن يجيب شفهيًّا مع بقاء الأسئلة ومعيار التصحيح كما هي، وقدّم للثاني أسئلة على جمع الأعداد الصحيحة بدلًا من الكسور. ما الوصف الأدق للإجراءين؟","o":["الأول تعديل، والثاني تكييف","كلاهما تكييف؛ لأن الهدف منهما تسهيل الاختبار","كلاهما تعديل؛ لأن شكل الاختبار تغير في الحالتين","الأول تكييف، والثاني تعديل"],"a":3,"w":"التكييف يغير طريقة الوصول أو الاستجابة دون تغيير المحتوى أو المعيار، وهذا ما حدث مع الأول. أما التعديل فيغير المحتوى أو مستوى المعيار نفسه، وهذا ما حدث مع الثاني حين استُبدل بالكسور محتوى أدنى.","n":["يعكس المفهومين؛ فالقراءة والإجابة الشفهية لا تمسان المعيار.","التسهيل ليس معيار التمييز؛ واستبدال المحتوى تعديل.","تغير الشكل وحده لا يجعل الإجراء تعديلًا ما دام المعيار باقيًا.","صحيح: الطريقة تغيرت للأول، والمحتوى تغير للثاني."],"c":"بقاء الأسئلة ومعيار التصحيح… بدلًا من الكسور","p":"اسأل: هل تغير ما يتعلمه الطالب ومستواه (تعديل) أم طريقة الوصول فقط (تكييف)؟"},{"id":"1-17","s":1,"i":"1.3","l":"تحليل","t":"تفخر مدرسة بأن جميع طلاب صعوبات التعلم فيها يقضون اليوم كاملًا في الفصول العامة، لكن الملاحظة الصفية أظهرت أنهم يجلسون في آخر الصف وينسخون من السبورة دون تكييفات أو دعم أو مشاركة في النقاش. ما التقويم الأدق لهذا الواقع؟","o":["دمج شامل ناجح؛ لأن الطلاب لا يُخرجون من الفصل العام في أي حصة من حصص اليوم","تطبيق سليم لمبدأ البيئة الأقل تقييدًا تكفي معه متابعة درجات الاختبارات الدورية","دليل على أن هؤلاء الطلاب يحتاجون جميعًا إلى نقلهم إلى فصل خاص ملحق بالمدرسة","وجود مكاني لا يرقى إلى الدمج الشامل؛ لغياب تهيئة البيئة والدعم والمشاركة الفعلية"],"a":3,"w":"الدمج الشامل لا يعني مجرد الوجود المكاني، بل يتطلب تهيئة المدرسة والمنهج وطرائق التدريس، وتوفير الدعم، والمشاركة الأكاديمية والاجتماعية. والحل هنا تهيئة البيئة لا نقل الطلاب جماعيًّا إلى بيئة أكثر تقييدًا.","n":["يساوي الدمج بالمكان، وهو الخطأ الذي يحذر منه المصدر.","البيئة الأقل تقييدًا تشترط تعليمًا فعالًا ودعمًا كافيًا.","يقفز إلى الأشد تقييدًا جماعيًّا بدل تهيئة البيئة الحالية.","صحيح: الوجود وحده ليس دمجًا شاملًا."],"c":"ينسخون… دون تكييفات أو دعم أو مشاركة","p":"الدمج الشامل = وجود + مشاركة + دعم + تهيئة للنظام."},{"id":"1-18","s":1,"i":"1.4","l":"معرفة","t":"اعتمدت الأمم المتحدة اتفاقية حقوق الأشخاص ذوي الإعاقة (CRPD) عام 2006م. ما التحول الفلسفي الأبرز الذي تمثله هذه الاتفاقية؟","o":["الانتقال من النموذج الحقوقي إلى النموذج الطبي العلاجي القائم على التشخيص","الانتقال من التعليم الدامج إلى التعليم في المعاهد المتخصصة","الانتقال من النموذج الرعائي القائم على الإحسان إلى النموذج الحقوقي","الانتقال من التعليم الأكاديمي إلى التأهيل المهني وحده"],"a":2,"w":"تُعد الاتفاقية أبرز وثيقة دولية في مجالها، وفلسفتها الانتقال بالنظرة إلى ذوي الإعاقة من متلقين للرعاية والإحسان إلى أصحاب حقوق وكرامة وقدرة على المشاركة. ومن مبادئها التعليم الدامج للجميع.","n":["يعكس الاتجاه؛ فالاتفاقية تبتعد عن النظرة العلاجية الرعائية.","الاتفاقية تؤكد التعليم الدامج لا العودة إلى المعاهد.","صحيح: من الإحسان إلى الحقوق.","لا تحصر الاتفاقية حقوق الشخص في التأهيل المهني."],"c":"اتفاقية حقوق… التحول الفلسفي","p":"CRPD = نموذج حقوقي: كرامة ومساواة وتمكين وتعليم دامج."},{"id":"1-19","s":1,"i":"1.4","l":"معرفة","t":"يكتب باحث فقرة عن وثيقة دولية صدرت عام 1994م، نادت بشعار «مدارس للجميع»، وأكدت حق الطفل ذي الإعاقة في التعلم داخل مدارس التعليم العام بجوار أقرانه. أي وثيقة يقصد؟","o":["اتفاقية حقوق الأشخاص ذوي الإعاقة","نظام حقوق الأشخاص ذوي الإعاقة","القواعد التنظيمية لمعاهد وبرامج التربية الخاصة","إعلان سالامانكا"],"a":3,"w":"إعلان سالامانكا (1994م) وثيقة تاريخية غيرت وجه التربية الخاصة عالميًّا بدعوتها إلى «المدارس للجميع» وتعزيز التعليم الدامج. أما الاتفاقية فاعتُمدت عام 2006م، والنظام والقواعد وثيقتان محليتان.","n":["وثيقة دولية حقوقية لكنها اعتُمدت عام 2006م.","نظام وطني سعودي، لا وثيقة دولية.","وثيقة إجرائية محلية صادرة عن وزارة التعليم.","صحيح: 1994م و«مدارس للجميع»."],"c":"1994م… «مدارس للجميع»","p":"سالامانكا = مدارس للجميع، وCRPD = الإطار الحقوقي الشامل."},{"id":"1-20","s":1,"i":"1.4","l":"تطبيق","t":"يريد معلم صعوبات التعلم معرفة الإجراءات المعتمدة لإنهاء خدمة طالب في البرنامج وانتقاله إلى التعليم العام دون خدمة. إلى أي مرجع يعود أولًا؟","o":["الدليل التنظيمي والقواعد الإجرائية للتربية الخاصة الصادرة عن وزارة التعليم","اتفاقية حقوق الأشخاص ذوي الإعاقة بوصفها أعلى مرجع حقوقي دولي في المجال","نظام حقوق الأشخاص ذوي الإعاقة بوصفه المظلة التشريعية الوطنية الأحدث","إعلان سالامانكا بوصفه المرجع الدولي الأول للتعليم الدامج"],"a":0,"w":"الأسئلة الإجرائية اليومية، مثل نصاب المعلم وآلية الانتقال من برامج التربية الخاصة إلى التعليم العام، مرجعها الأدلة والقواعد التنظيمية لوزارة التعليم. أما الاتفاقيات والأنظمة فتضع الحقوق والمبادئ العامة ولا تفصّل الإجراء المدرسي.","n":["صحيح: الإجراء المدرسي مرجعه الدليل التنظيمي.","مرجع حقوقي عام لا يحدد إجراءات الانتقال داخل البرنامج.","يضمن الحقوق العامة، لكن الإجراء التفصيلي في الأدلة التنظيمية.","إعلان دولي للمبادئ، لا يتضمن إجراءات تشغيلية محلية."],"c":"الإجراءات المعتمدة… وانتقاله إلى التعليم العام","p":"إجراء أو آلية أو تنظيم برنامج يقودك إلى الدليل التنظيمي، وحق أو كرامة أو تمكين إلى الإطار الحقوقي."},{"id":"1-21","s":1,"i":"1.4","l":"تطبيق","t":"نُقل فصل خالد، وهو طالب يستخدم كرسيًّا متحركًا، إلى الطابق الثاني في مبنى لا يوجد فيه مصعد، فأصبح يتغيب عن الحصص. ما الإجراء الأكثر اتساقًا مع الإطار الحقوقي للتشريعات؟","o":["نقله إلى مدرسة أخرى مهيأة للكراسي المتحركة ولو ابتعد عن زملائه ومدرسة حيه","إعفاؤه من حضور الحصص التي تُعقد في الطابق العلوي وتعويضها بأوراق عمل منزلية","تكليف زملائه بحمله على الدرج يوميًّا في بداية الدوام ونهايته","توفير ترتيبات تيسيرية معقولة كنقل الفصل إلى الطابق الأرضي، ليبقى مع أقرانه"],"a":3,"w":"تكفل التشريعات الحديثة الوصول الشامل والترتيبات التيسيرية المعقولة: تعديلات مناسبة لا تشكل عبئًا غير مبرر، تمكّن الشخص من ممارسة حقه في التعليم باستقلالية ومع أقرانه. ونقل الفصل إلى الطابق الأرضي مثال مباشر على ذلك.","n":["ينقل المشكلة إلى الطالب بدل تهيئة البيئة الحالية.","يحرمه حقه في التعليم مع أقرانه بدل إزالة الحاجز.","حل غير آمن ويُضعف استقلاليته وكرامته.","صحيح: إزالة الحاجز مع بقائه مع أقرانه."],"c":"كرسيًّا متحركًا… لا يوجد فيه مصعد","p":"حاجز مكاني أو صعوبة وصول يقودك إلى الترتيبات التيسيرية المعقولة وإمكانية الوصول."},{"id":"1-22","s":1,"i":"1.4","l":"تحليل","t":"قرر مدير مدرسة عدم إشراك طلاب صعوبات التعلم في الرحلات والأنشطة اللاصفية «حفاظًا على النظام»، واحتج بأن الدليل التنظيمي لا ينص صراحةً على الرحلات. ما التحليل الأدق لهذا القرار؟","o":["قرار نظامي سليم؛ لأن الدليل التنظيمي لم يذكر الرحلات المدرسية صراحة في نصوصه","قرار تربوي مقبول إذا وافقت عليه أسر الطلاب كتابيًّا قبل موعد كل رحلة","قرار يُحسم برأي معلم التربية الخاصة بوصفه المرجع النظامي الأعلى في المدرسة","قرار مخالف؛ فالإطار النظامي يكفل المشاركة دون تمييز، والدمج يشمل الأنشطة اللاصفية"],"a":3,"w":"غياب نص تفصيلي في الدليل لا يبيح التمييز؛ فالأنظمة الحديثة تكفل الحقوق الأساسية وتكافؤ الفرص، والدمج الحقيقي يمتد إلى الأنشطة المدرسية واللاصفية والاجتماعية. والاجتهاد الإداري الداخلي لا يتقدم على الحقوق المكفولة نظامًا.","n":["يفهم سكوت الدليل إذنًا بالتمييز، وهو استنتاج خاطئ.","موافقة الأسر لا تجعل الحرمان من الحق ممارسة تربوية سليمة.","الرأي الفردي ليس مرجعًا نظاميًّا يتقدم على الأنظمة.","صحيح: الحق في المشاركة لا يتوقف على نص تفصيلي."],"c":"عدم إشراك… لا ينص صراحةً","p":"المرجع الرسمي مقدم على الاجتهاد الشخصي، والحق العام لا يُسقطه سكوت الدليل."},{"id":"1-23","s":1,"i":"1.5","l":"معرفة","t":"وفق نظرية بياجيه في النمو المعرفي، لماذا يحتاج بعض الطلاب ذوي الإعاقة الفكرية إلى المحسوسات والخبرات المباشرة مدة أطول من أقرانهم؟","o":["لأن التعلم لديهم لا يحدث إلا بالتعزيز المادي المباشر","لأنهم قد يتأخرون في الانتقال إلى مرحلة العمليات المجردة","لأن منطقة النمو القريب لديهم أوسع منها لدى أقرانهم","لأن حاجاتهم إلى الأمان والانتماء لم تُشبع بعد"],"a":1,"w":"يرى بياجيه أن الطفل يمر بمراحل متسلسلة: الحس حركية، وما قبل العمليات، والعمليات المادية، والعمليات المجردة. والطالب ذو الإعاقة الفكرية قد يتأخر في بلوغ التجريد، فيحتاج إلى المحسوسات والخبرات المباشرة لفترة أطول.","n":["تفسير سلوكي لا صلة له بمراحل بياجيه.","صحيح: تأخر الانتقال إلى التجريد.","منطقة النمو القريب مفهوم فيجوتسكي، ولا تفسر الحاجة إلى المحسوس.","تفسير إنساني (ماسلو) لا يتعلق بمراحل النمو المعرفي."],"c":"بياجيه… المحسوسات… مدة أطول","p":"بياجيه = مراحل نمو وانتقال من المحسوس إلى المجرد."},{"id":"1-24","s":1,"i":"1.5","l":"تطبيق","t":"أرادت معلمة تطبيق مفهوم التعزيز السلبي مع طالب يتأخر في إكمال مهامه الصفية. أي الإجراءات الآتية يمثل تعزيزًا سلبيًّا؟","o":["إعفاؤه من الواجب المنزلي في اليوم الذي يُكمل فيه مهامه الصفية بدقة","منحه نجمة في لوحة التعزيز كلما أكمل مهمة صفية بدقة","خصم خمس دقائق من فسحته في كل مرة يتأخر فيها عن إكمال المهمة المطلوبة","تكليفه بمهمة إضافية في كل مرة يتأخر فيها عن زملائه"],"a":0,"w":"التعزيز السلبي إزالة مثير غير مرغوب بعد السلوك لزيادة احتمال تكراره، كإزالة الواجب المنزلي عند إكمال المهام. وهو يختلف عن العقاب الذي يهدف إلى تقليل السلوك، سواء بإضافة مثير مزعج أو بسحب شيء مرغوب.","n":["صحيح: إزالة غير المرغوب لزيادة السلوك.","إضافة شيء مرغوب تعزيز إيجابي لا سلبي.","سحب شيء مرغوب لتقليل السلوك عقاب لا تعزيز.","إضافة شيء مزعج لتقليل السلوك عقاب لا تعزيز."],"c":"تعزيزًا سلبيًّا","p":"التعزيز إيجابيًّا كان أو سلبيًّا يزيد السلوك، أما العقاب فيقلله."},{"id":"1-25","s":1,"i":"1.5","l":"تطبيق","t":"لا تستطيع ليان قراءة الكلمات ثلاثية المقاطع منفردة، لكنها تقرؤها بدقة حين تقدم لها المعلمة تلميحًا للمقطع الأول. ما القرار التدريسي الأنسب في ضوء نظرية فيجوتسكي؟","o":["الانتقال إلى الكلمات رباعية المقاطع؛ لأنها نجحت في الثلاثية حين ساعدتها المعلمة","العودة إلى الكلمات ثنائية المقاطع حتى تتمكن من الثلاثية دون أي مساعدة","العمل في هذا المستوى بدعم موجّه، ثم سحب التلميحات تدريجيًّا مع تقدم أدائها","الإبقاء على التلميحات بالمستوى نفسه طوال الفصل الدراسي لضمان نجاحها"],"a":2,"w":"منطقة النمو القريب هي المسافة بين ما يؤديه الطالب منفردًا وما يؤديه بمساعدة شخص أكثر خبرة، وفيها يحدث التعلم الأمثل. والسقالات دعم مؤقت موجّه يُخفض تدريجيًّا حتى يصل الطالب إلى الاستقلال.","n":["النجاح بالمساعدة لا يعني الإتقان المستقل؛ فالقفز سابق لأوانه.","يتراجع إلى مستوى متقن ويهدر منطقة التعلم الفعلية.","صحيح: تعليم في منطقة النمو القريب مع سحب السقالات.","السقالات مؤقتة بطبيعتها، وإبقاؤها يخلق اعتمادية."],"c":"منفردة… حين تقدم لها تلميحًا","p":"ما يؤديه الطالب بالمساعدة لا منفردًا هو منطقة النمو القريب؛ قدّم السقالات ثم اسحبها."},{"id":"1-26","s":1,"i":"1.5","l":"تطبيق","t":"تريد معلمة تعليم سارة طلب المساعدة بأسلوب مناسب في أثناء العمل في المجموعات. أي الإجراءات يوظف نظرية التعلم الاجتماعي لباندورا بصورة مباشرة؟","o":["أن تحصل سارة على مكافأة فورية كلما طلبت المساعدة بأسلوب مناسب دون أن يُعرض عليها نموذج","أن تُهيأ لسارة بيئة صفية آمنة خالية من السخرية قبل مطالبتها بطلب المساعدة من زميلاتها","أن تُعرض على سارة خريطة توضح العلاقات بين خطوات طلب المساعدة في صورة كلية","أن تشاهد سارة زميلة تطلب المساعدة بأدب فتلقى استجابة إيجابية، ثم تُمنح فرصة لتقليدها"],"a":3,"w":"تقوم نظرية باندورا على التعلم بالملاحظة والنمذجة، وقد يحدث التعلم دون تعزيز مباشر من خلال رؤية سلوك الآخرين ونتائجه. لذلك فإن مشاهدة نموذج من الأقران يُعزَّز ثم التقليد هو التطبيق المباشر للنظرية.","n":["تعزيز مباشر دون نموذج، وهو تطبيق سلوكي.","اهتمام بالأمان والقبول، وهو منظور إنساني.","إدراك العلاقات والصورة الكلية أقرب إلى الجشطلت.","صحيح: ملاحظة نموذج ونتيجة سلوكه ثم التقليد."],"c":"نظرية التعلم الاجتماعي لباندورا","p":"«يشاهد نموذجًا ثم يقلده» = تعلم اجتماعي."},{"id":"1-27","s":1,"i":"1.5","l":"تحليل","t":"يتعرض نواف (طالب ذو صعوبة تعلم) لسخرية متكررة من زملائه، فتراجعت مشاركته وأصبح يرفض القراءة أمامهم. قرر معلمه مضاعفة الواجبات القرائية له «لتعويض ما فاته». ما الخلل في هذا القرار في ضوء نظرية ماسلو؟","o":["تجاهل حاجته إلى الأمان والانتماء التي يسبق إشباعها التعلم الأكاديمي الفعال","تجاهل حاجته إلى تعزيز مادي فوري يزيد احتمال قراءته أمام زملائه في الصف","تجاهل مرحلة نموه المعرفي التي تتطلب المحسوسات قبل الانتقال إلى التجريد","تجاهل حاجته إلى تجزئة النصوص لتخفيف العبء الواقع على ذاكرته العاملة"],"a":0,"w":"يرى ماسلو أن التعلم الأكاديمي الفعال لا يتحقق دون إشباع الحاجات الأساسية كالأمان والانتماء والتقدير. والطالب الذي يتعرض للسخرية يحتاج أولًا بيئة آمنة خالية من التنمر يشعر فيها بالقبول، ومضاعفة الواجبات تتجاهل جذر المشكلة.","n":["صحيح: الأمان والانتماء قبل المطالبة الأكاديمية.","تفسير سلوكي لا يعالج السخرية التي هي أصل التراجع.","لا قرينة في الموقف على صعوبة في التجريد.","قد يفيد عمومًا، لكنه لا يفسر التراجع المرتبط بالسخرية."],"c":"سخرية متكررة… تراجعت مشاركته","p":"عند غياب الأمان والقبول، عالج الحاجة النفسية قبل زيادة المطالب الأكاديمية."},{"id":"1-28","s":1,"i":"1.5","l":"تحليل","t":"يعرف ياسر حقائق الضرب حين يُسأل عنها منفردة، لكنه يتأخر كثيرًا في استدعائها في أثناء حل المسائل. اقترح أحمد زيادة المكافآت عند كل إجابة سريعة، واقترح ماجد ممارسة استرجاع موزعة وربط الحقائق بأنماط مألوفة. أي الاقتراحين أدق في معالجة المشكلة، ولماذا؟","o":["اقتراح أحمد؛ لأن التعزيز يزيد سرعة أي استجابة مهما كان مصدر الصعوبة لدى الطالب","الاقتراحان متكافئان؛ لأن كليهما يستند إلى مبادئ النظرية السلوكية في تعديل الأداء","لا يصلح أيهما؛ لأن المشكلة في إدراك العلاقات الكلية وفق نظرية الجشطلت","اقتراح ماجد؛ لأن المشكلة في الاسترجاع، وهي عملية تفسرها نظرية معالجة المعلومات"],"a":3,"w":"الصعوبة الموصوفة ليست في المعرفة نفسها بل في استدعائها وقت الحاجة، والاسترجاع من عمليات معالجة المعلومات إلى جانب الانتباه والترميز والتخزين. لذلك تستهدف الممارسة الاسترجاعية الموزعة والربط بالمعرفة السابقة العملية المركزية، بينما لا يعالجها التعزيز وحده.","n":["التعزيز لا يعالج مشكلة استرجاع معلومة مخزنة.","الاقتراحان من منظورين مختلفين وليسا متكافئين.","لا قرينة على مشكلة في إدراك الكل والعلاقات.","صحيح: يستهدف عملية الاسترجاع مباشرة."],"c":"يعرف… لكنه يتأخر في استدعائها","p":"حدد العملية المركزية في الموقف أولًا، ثم اختر النظرية التي تفسرها مباشرة."},{"id":"1-29","s":1,"i":"1.6","l":"معرفة","t":"أي العبارات الآتية عن انتشار فئات التربية الخاصة صحيحة وفق محتوى المؤشر؟","o":["الإعاقة الفكرية مرتفعة الانتشار في المجتمع، وغالب حالاتها تقع في المستوى الشديد","اضطراب طيف التوحد ارتفعت معدلات تشخيصه في العقود الأخيرة، ويظهر لدى الذكور بمعدلات أعلى","الإعاقات الحسية الشديدة والمتعددة أكثر عددًا من صعوبات التعلم في الخدمات المدرسية","صعوبات التعلم من أقل الفئات عددًا في المدارس، لكنها تتطلب أكثر التجهيزات والخبرات تخصصًا"],"a":1,"w":"مفاتيح الانتشار في المؤشر: صعوبات التعلم من أكثر الفئات عددًا مدرسيًّا، والتوحد ارتفعت معدلات تشخيصه ويظهر لدى الذكور أكثر، والإعاقة الفكرية منخفضة نسبيًّا وغالب حالاتها بسيطة، والإعاقات الحسية الشديدة والمتعددة أقل عددًا لكنها تتطلب تجهيزات تخصصية أكبر.","n":["يعكس المفتاح؛ فالفكرية منخفضة نسبيًّا وغالبها بسيط.","صحيح: يطابق مفتاح التوحد في المؤشر.","الحسية الشديدة أقل عددًا من صعوبات التعلم.","يعكس الوصفين؛ فصعوبات التعلم من أكثر الفئات عددًا."],"c":"انتشار فئات التربية الخاصة","p":"الأكثر عددًا مدرسيًّا صعوبات التعلم، والتشخيص المتزايد مع غلبة الذكور التوحد."},{"id":"1-30","s":1,"i":"1.6","l":"معرفة","t":"عند تمييز الإعاقة الفكرية عن غيرها من الفئات، ما المفتاح الذي ينبغي أن يُبنى عليه التصنيف؟","o":["قصور ذو دلالة في الأداء الفكري والسلوك التكيفي معًا يظهر خلال فترة النمو","درجة ذكاء منخفضة في اختبار واحد بصرف النظر عن مهارات الحياة اليومية","انخفاض التحصيل الدراسي في مادة أو مادتين مع سلامة بقية المجالات","صعوبات مستمرة في التواصل الاجتماعي مع أنماط سلوكية مقيدة ومتكررة"],"a":0,"w":"الإعاقة الفكرية قصور ذو دلالة في الأداء الفكري والسلوك التكيفي يظهر خلال فترة النمو، ويؤثر في مجالات مفاهيمية واجتماعية وعملية. لذلك لا تُحدد بدرجة ذكاء منفردة، ولا تُخلط بصعوبة أكاديمية نوعية أو بمفتاح التوحد.","n":["صحيح: أداء فكري وسلوك تكيفي معًا.","درجة الذكاء المنفردة لا تكفي للتصنيف.","هذا أقرب إلى صعوبة نوعية لا إعاقة فكرية.","هذا مفتاح اضطراب طيف التوحد."],"c":"تمييز الإعاقة الفكرية","p":"الإعاقة الفكرية = أداء فكري + سلوك تكيفي، وليست رقم ذكاء منفردًا."},{"id":"1-31","s":1,"i":"1.6","l":"تطبيق","t":"في إدارة تعليم، عدد الطلاب المكفوفين قليل مقارنة بطلاب صعوبات التعلم، فاقترح أحد المسؤولين توجيه ميزانية التجهيزات كلها إلى برامج صعوبات التعلم «لأنها الأكثر عددًا». ما القرار الأكثر مهنية؟","o":["اعتماد الاقتراح؛ لأن توزيع الموارد بحسب عدد المستفيدين هو الأعدل بين جميع فئات التربية الخاصة","تقسيم ميزانية التجهيزات بالتساوي بين الفئتين بصرف النظر عن نوع التجهيزات التي تحتاجها كل فئة","الجمع بين حجم الفئة وشدة احتياجها ونوع الخدمة؛ فقلة العدد لا تلغي الحاجة إلى برايل والتقنيات","تحويل الطلاب المكفوفين إلى غرف مصادر صعوبات التعلم لتوحيد التجهيزات وتقليل التكلفة"],"a":2,"w":"الانتشار أداة لفهم حجم الظاهرة والتخطيط، لكنه لا يقيس وحده شدة الحاجة؛ فبعض الفئات أقل عددًا وتحتاج تجهيزات وخبرات تخصصية أكبر. لذلك يجمع التخطيط المهني بين العدد وشدة الاحتياج ونوع الخدمة.","n":["يجعل العدد وحده معيار التوزيع، وهو خطأ شائع.","المساواة الحسابية تتجاهل اختلاف طبيعة التجهيزات.","صحيح: العدد لا يغني عن تحليل الاحتياج.","يتجاهل حاجات الوصول الخاصة بالإعاقة البصرية."],"c":"«لأنها الأكثر عددًا»","p":"الفئة الأكثر عددًا ليست بالضرورة الأكثر احتياجًا لكل نوع من الموارد."},{"id":"1-32","s":1,"i":"1.6","l":"تطبيق","t":"قرأت معلمة أن صعوبات التعلم أكثر الفئات انتشارًا في المدارس، فلما لاحظت انخفاض درجات طالب جديد في القراءة كتبت في تقريرها: «على الأرجح من ذوي صعوبات التعلم لأنها الفئة الأشيع». ما الإجراء الأصح؟","o":["اعتماد ما كتبته؛ لأن احتمال انتمائه إلى الفئة الأشيع هو الأعلى إحصائيًّا","جمع بيانات متعددة وتقييم فردي شامل يستبعد التفسيرات البديلة قبل أي تصنيف","إلحاقه بغرفة المصادر مباشرة ثم التحقق من تصنيفه في نهاية العام الدراسي","تصنيفه مؤقتًا من ذوي صعوبات التعلم إلى أن يثبت العكس في اختبار لاحق"],"a":1,"w":"بيانات الانتشار تصف جماعة وتفيد في التخطيط، ولا تصلح أداة لتشخيص فرد. وصعوبات التعلم لا تُثبت من انخفاض التحصيل وحده، بل تحتاج تقييمًا شاملًا واستبعاد التفسيرات البديلة.","n":["يحول نسبة جماعية إلى تشخيص فردي.","صحيح: التقييم الفردي لا النسبة الجماعية.","يقدم الخدمة قبل التقييم ويؤجل التحقق.","التصنيف المؤقت بلا بيانات يظل تشخيصًا من الشيوع."],"c":"«لأنها الفئة الأشيع»","p":"الانتشار يصف الجماعة، والتصنيف والخطة يُبنيان على بيانات الفرد."},{"id":"1-33","s":1,"i":"1.6","l":"تحليل","t":"ارتفع عدد الطلاب المشخصين باضطراب طيف التوحد في إحدى المناطق خلال خمس سنوات، بعد حملات توعية واسعة وتدريب الكوادر على أدوات كشف أحدث. استنتج أحد المسؤولين أن «أسباب الاضطراب أصبحت أكثر شيوعًا بالقدر نفسه». ما التحليل الأدق؟","o":["الاستنتاج صحيح؛ لأن زيادة أعداد المشخصين تعني زيادة الحالات الحقيقية بالنسبة نفسها تمامًا","الزيادة تعني أن معايير التشخيص لم تتغير، وأن الحالات الجديدة أشد من الحالات السابقة","الزيادة قد تعكس تحسن الوعي والكشف وتغير الأدوات، ولا تثبت وحدها زيادة مماثلة في الحدوث","الزيادة دليل على خطأ التشخيصات الجديدة، فيجب إلغاؤها والعودة إلى الأدوات السابقة"],"a":2,"w":"أرقام الانتشار والتشخيص لا تُقرأ بمعزل عن طريقة إنتاجها؛ فالتوعية وتطوير أدوات الكشف وتغير المعايير قد ترفع أعداد المشخصين دون أن يعني ذلك زيادة مماثلة في الحدوث. والاستنتاج المهني يميز بين أعداد التشخيص والانتشار الحقيقي.","n":["يتجاهل أثر التوعية والأدوات في رفع أعداد المشخصين.","لا قرينة على شدة الحالات، والأدوات تغيرت فعلًا.","صحيح: يميز أعداد التشخيص من الحدوث الفعلي.","يقفز إلى رفض التشخيصات دون دليل على خطئها."],"c":"بعد حملات توعية… أدوات كشف أحدث","p":"زيادة المشخصين لا تساوي تلقائيًّا زيادة الحدوث؛ اسأل عن الوعي والأدوات والمعايير."},{"id":"1-34","s":1,"i":"1.7","l":"معرفة","t":"أي مما يلي «لا» يُعد من الخدمات المساندة (Related Services)، بل من أنماط تقديم خدمات التربية الخاصة؟","o":["غرفة المصادر","العلاج الوظيفي","خدمات النطق والتخاطب","الخدمات النفسية والإرشادية"],"a":0,"w":"أنماط تقديم الخدمة تحدد البيئة التعليمية ودرجة الدمج، مثل الفصل العادي مع الدعم وغرفة المصادر والفصل الخاص الملحق. أما الخدمات المساندة فدعم تخصصي يكمل العملية التعليمية ويساعد الطالب على الاستفادة من برنامجه، ويحدد الفريق نوعها ومدتها وفق الاحتياج.","n":["صحيح: غرفة المصادر نمط لتقديم الخدمة لا خدمة مساندة.","خدمة مساندة تُعنى بالحركة الدقيقة ومهارات الحياة اليومية.","خدمة مساندة تُعنى بالكلام واللغة والتواصل البديل.","خدمة مساندة تُعنى بالتقييم النفسي والإرشاد ودعم الأسرة."],"c":"«لا» يُعد من الخدمات المساندة","p":"نمط الخدمة يحدد أين يتعلم الطالب، والخدمة المساندة دعم تخصصي ليستفيد مما يتعلمه."},{"id":"1-35","s":1,"i":"1.7","l":"تطبيق","t":"يمسك تركي القلم بصعوبة، ولا يستطيع قص الأشكال أو تزرير ملابسه بعد حصة التربية البدنية، بينما يمشي ويصعد الدرج ويحافظ على توازنه دون مشكلة. أي خدمة مساندة يقترحها الفريق؟","o":["العلاج الوظيفي","العلاج الطبيعي","خدمات النطق والتخاطب","التأهيل المهني والمهارات الانتقالية"],"a":0,"w":"العلاج الوظيفي ينمي المهارات الحركية الدقيقة والتآزر البصري الحركي ومهارات الحياة اليومية كالتزرير. أما العلاج الطبيعي فيستهدف الحركة الكبرى كالمشي والتوازن، وهي سليمة لدى تركي.","n":["صحيح: حركة دقيقة ومهارات حياة يومية.","يستهدف المشي والتوازن، وهما سليمان لديه.","لا قرينة على مشكلة في الكلام أو اللغة.","يتعلق بالميول المهنية والانتقال، لا بالحركة الدقيقة."],"c":"القلم… قص… تزرير… يمشي دون مشكلة","p":"العلاج الطبيعي للحركة الكبرى كالمشي والتوازن، والوظيفي للحركة الدقيقة والحياة اليومية."},{"id":"1-36","s":1,"i":"1.7","l":"تطبيق","t":"نورة طالبة ذات صعوبة تعلم في الرياضيات، تحقق أهدافها في بقية المواد مع أقرانها، وتحتاج إلى تدريس علاجي مركّز في مجموعة صغيرة أربع حصص أسبوعيًّا. ما نمط تقديم الخدمة الأنسب لها؟","o":["الفصل الخاص الملحق بالمدرسة العادية","المدرسة الخاصة النهارية المستقلة","الفصل العادي مع الاستعانة بغرفة المصادر","الفصل العادي دون أي خدمة إضافية مع متابعة درجاتها"],"a":2,"w":"في نمط غرفة المصادر يقضي الطالب معظم يومه في الفصل العادي، ويخرج لفترات محددة لتلقي دعم أكاديمي علاجي مركز فرديًّا أو في مجموعات صغيرة، وهو يناسب خصوصًا صعوبات التعلم. ولا تبرر حاجة نورة المحدودة بيئة أكثر تقييدًا.","n":["يناسب من لا تكفيه خدمات الفصل العادي وغرفة المصادر.","للحالات الشديدة والمعقدة التي تحتاج بيئة متخصصة.","صحيح: معظم اليوم في الفصل وعلاج مركز لفترات محددة.","يتجاهل حاجتها الموثقة إلى تدريس علاجي مركز."],"c":"أربع حصص أسبوعيًّا… بقية المواد مع أقرانها","p":"فترات محددة وعلاج أكاديمي مركز ومعظم اليوم في الفصل العادي = غرفة المصادر."},{"id":"1-37","s":1,"i":"1.7","l":"تطبيق","t":"يظهر على هيا (طالبة ذات صعوبة تعلم) قلق شديد قبل الاختبارات يصل إلى البكاء والانسحاب من الأنشطة، ويرى الفريق أنها تحتاج إلى إرشاد فردي وتنسيق خطة دعم مع أسرتها. أي خدمة مساندة هي الأنسب؟","o":["الخدمات الصحية والتمريضية المدرسية","الخدمات النفسية والإرشادية","العلاج الوظيفي لتنظيم المعالجة الحسية","خدمات النطق والتخاطب لتحسين التعبير"],"a":1,"w":"تشمل الخدمات النفسية والإرشادية القياس والتقييم النفسي، والإرشاد الفردي والجماعي، ودعم المشكلات الانفعالية والسلوكية، وتقديم الاستشارات للأسر. وهذا ما تصفه قرائن القلق والحاجة إلى إرشاد وتنسيق مع الأسرة.","n":["تُعنى بالحالات الصحية المزمنة والأدوية والإسعاف.","صحيح: قلق وإرشاد واستشارة للأسرة.","يرتبط بالتكامل الحسي والحركة الدقيقة، لا بقلق الاختبار.","لا قرينة على مشكلة لغوية أو كلامية."],"c":"قلق شديد… إرشاد فردي… أسرتها","p":"إرشاد ومشكلات انفعالية واستشارة للأسرة = خدمات نفسية وإرشادية."},{"id":"1-38","s":1,"i":"1.7","l":"تطبيق","t":"طالب ذو ضعف سمعي يعتمد على معين سمعي، لاحظ معلمه أنه لم يعد يستجيب للأصوات في الصف كما كان، ويُشتبه في خلل بضبط المعين. أي خدمة مساندة هي الأنسب للتعامل مع هذه المشكلة؟","o":["خدمات النطق والتخاطب","الخدمات الصحية والتمريضية المدرسية","الخدمات النفسية والإرشادية","الخدمات السمعية المتخصصة"],"a":3,"w":"من أدوار الخدمات السمعية المتخصصة تقييم السمع ومعايرة المعينات السمعية والتدريب السمعي. أما النطق والتخاطب فيعالج اضطرابات الكلام واللغة، ولا يتولى ضبط المعين نفسه.","n":["قريب من المجال، لكنه يعالج الكلام واللغة لا ضبط المعين.","تتابع الحالات الصحية المزمنة والأدوية، لا الأجهزة السمعية.","لا قرينة على مشكلة انفعالية تفسر تراجع الاستجابة.","صحيح: معايرة المعين من صميم الخدمات السمعية."],"c":"خلل بضبط المعين","p":"المعين السمعي ومعايرته والتدريب السمعي = خدمات سمعية متخصصة."},{"id":"1-39","s":1,"i":"1.7","l":"تحليل","t":"لمى طالبة في الفصل العادي تحقق أهدافها الأكاديمية بتكييفات بسيطة، لكنها تعاني اضطرابًا في اللغة التعبيرية يجعلها لا تشارك في النقاش ولا تعبر عن احتياجاتها. اقترح عضو في الفريق نقلها إلى فصل خاص ملحق «لتتلقى رعاية أشمل». ما التحليل الأدق للاقتراح؟","o":["الاقتراح مناسب؛ لأن الفصل الخاص الملحق يوفر خدمات أشمل وأكثر تركيزًا لأي طالبة لديها أكثر من احتياج واحد","الحاجة تواصلية تُلبّى بإضافة خدمة النطق والتخاطب مع بقائها في بيئتها؛ فالنقل يزيد التقييد بلا مبرر","الأنسب نقلها إلى غرفة المصادر طوال اليوم الدراسي لتتلقى تدريسًا أكاديميًّا علاجيًّا مكثفًا","الأنسب إيقاف التكييفات الأكاديمية لأنها تحقق أهدافها، والانتظار حتى تتحسن لغتها تلقائيًّا"],"a":1,"w":"يجب التمييز بين نمط تقديم الخدمة (البيئة ودرجة الدمج) والخدمة المساندة (دعم تخصصي يمكّن الطالب من الاستفادة من برنامجه). ولمى ناجحة أكاديميًّا في بيئتها، وحاجتها تواصلية محددة، فالأنسب إضافة خدمة مساندة داخل البيئة الأقل تقييدًا لا تغيير البيئة.","n":["يربط شمولية الخدمة بالمكان ويزيد التقييد بلا حاجة.","صحيح: خدمة مساندة لا تغيير للبيئة.","مشكلتها ليست أكاديمية، والبقاء طوال اليوم ينافي فكرة غرفة المصادر.","يتجاهل حاجة تواصلية قائمة ويؤخر التدخل."],"c":"تحقق أهدافها… اضطرابًا في اللغة التعبيرية","p":"اسأل: هل المشكلة في ملاءمة البيئة نفسها أم في حاجة تخصصية يمكن دعمها داخلها؟"},{"id":"1-40","s":1,"i":"1.8","l":"معرفة","t":"أي العبارات الآتية تعبّر بدقة عن مفهوم الممارسة المبنية على الدليل (Evidence-Based Practice)؟","o":["تطبيق نتائج أحدث دراسة منشورة كما وردت على جميع الطلاب دون تعديل أو مراجعة لملاءمتها لهم","الاعتماد على الخبرة الصفية المتراكمة للمعلم وتوصيات زملائه من ذوي الخبرة الطويلة","قرار مهني يدمج أفضل دليل بحثي متاح والخبرة المهنية وخصائص الطالب وأسرته وبيانات استجابته","تبني الممارسات الأكثر رواجًا وانتشارًا في المدارس المتميزة وعلى منصات المعلمين"],"a":2,"w":"الممارسة المبنية على الدليل ليست تطبيقًا آليًّا لنتيجة بحث واحد، بل قرار مهني يجمع أفضل دليل متاح والخبرة المهنية وخصائص الطالب وأسرته وبيئته، مع التحقق من أثر التدخل ببيانات المتابعة. وإذا تعارض البحث مع بيانات الطالب تُراجع دقة التنفيذ والملاءمة ثم يُعدَّل القرار.","n":["تبسيط خاطئ؛ فالحداثة ليست دليلًا، والتطبيق الحرفي يتجاهل الفردية.","الخبرة مكون مهم لكنها لا تكفي وحدها.","صحيح: دليل وخبرة وخصائص الطالب وبيانات.","الرواج لا يساوي الفاعلية المثبتة."],"c":"الممارسة المبنية على الدليل","p":"الممارسة المبنية على الدليل = دليل موثوق + خبرة مهنية + خصائص الطالب والسياق + بيانات متابعة."},{"id":"1-41","s":1,"i":"1.8","l":"تطبيق","t":"لاحظ معلم صعوبات التعلم ضعف الطلاقة القرائية لدى خمسة طلاب في غرفة المصادر رغم التدريس المعتاد، فصاغ سؤالًا: «هل يحسّن تدريب يومي قصير على القراءة المتكررة طلاقتهم؟». ما الخطوة التالية في بحثه الإجرائي؟","o":["قياس خط الأساس، كعدد الكلمات المقروءة صحيحة في الدقيقة، قبل بدء التدريب","تطبيق التدريب فورًا ثم سؤال الطلاب في نهايته عن مدى استفادتهم منه","البحث عن دراسة تثبت نجاح القراءة المتكررة ونشر نتائجها بين زملائه","تطبيق التدريب أسبوعين ثم مقارنة أداء الطلاب بأداء أفضل قارئ في صفهم"],"a":0,"w":"البحث الإجرائي دراسة تطبيقية منظمة لمشكلة واقعية: تحديد المشكلة، ثم صياغة السؤال، ثم جمع خط أساس، ثم التدخل والمتابعة والتحليل واتخاذ القرار. ودون خط أساس لا يمكن الحكم على التغير الذي أحدثه التدريب.","n":["صحيح: لا تقويم للأثر دون خط أساس.","يعتمد على الانطباع بدل القياس قبل التدخل وبعده.","مراجعة الأدبيات مفيدة، لكنها لا تجيب عن سؤاله في بيئته.","المقارنة بأفضل طالب لا تقيس تغير أداء الطلاب أنفسهم."],"c":"صاغ سؤالًا… الخطوة التالية","p":"في البحث الإجرائي: مشكلة، ثم سؤال، ثم خط أساس، ثم تدخل ومتابعة، ثم قرار."},{"id":"1-42","s":1,"i":"1.8","l":"تطبيق","t":"استخدمت معلمة أداة ذكاء اصطناعي لتلخيص دراسة حول تدريس الفهم القرائي، وتريد كذلك إدخال تقارير طالباتها بأسمائهن ودرجاتهن لتقترح الأداة أهدافًا فردية لهن. ما التصرف المهني الأنسب؟","o":["اعتماد الملخص لأنه صادر عن أداة دقيقة، وإدخال التقارير لتوفير الوقت في كتابة الأهداف الفردية","مراجعة الملخص مقابل الدراسة الأصلية، وعدم إدخال بيانات الطالبات في أداة غير مصرح بها","إدخال التقارير بعد حذف الأسماء فقط، ثم اعتماد الأهداف التي تقترحها الأداة دون مراجعة مهنية","التوقف عن قراءة الدراسات المعقدة والاكتفاء بما تقترحه الأداة من استراتيجيات جاهزة"],"a":1,"w":"يمكن الاستعانة بأدوات الذكاء الاصطناعي في التنظيم والتلخيص الأولي، لكن مخرجاتها ليست مصدرًا علميًّا بذاتها ويجب التحقق منها بالرجوع إلى الأصل. ولا تُدخل بيانات شخصية أو حساسة للطلاب في أدوات غير مصرح بها، ويبقى القرار التربوي مسؤولية مهنية بشرية.","n":["يجعل الأداة مرجعًا نهائيًّا ويفرط في الخصوصية.","صحيح: تحقق من الأصل وحماية للخصوصية.","يعالج الأسماء جزئيًّا لكنه يتخلى عن المراجعة المهنية للقرار.","يستبدل الأداة بالتحقق العلمي بدل أن يستعين بها."],"c":"تقارير طالباتها بأسمائهن ودرجاتهن","p":"الأداة تساعد ولا تقرر: تحقق من الأصل، واحمِ بيانات الطلاب."},{"id":"1-43","s":1,"i":"1.8","l":"تطبيق","t":"يجتمع معلمو صعوبات التعلم في المدرسة أسبوعيًّا لتبادل أوراق العمل والأنشطة الجاهزة فقط. أي تعديل يحوّل هذا الاجتماع إلى مجتمع تعلم مهني فعّال؟","o":["زيادة عدد الاجتماعات إلى مرتين أسبوعيًّا لتبادل كمية أكبر من المواد والأنشطة الجاهزة","الانطلاق من مشكلة تعلم مشتركة، وتحليل بيانات الطلاب والأدلة، وتجريب إجراء ومتابعة أثره","دعوة مدرب خارجي في كل اجتماع لتقديم محاضرة عن أحدث الاستراتيجيات في المجال","تخصيص الاجتماع لتوزيع المهام الإدارية ومتابعة إنجاز سجلات البرنامج وملفات الطلاب الورقية والإلكترونية"],"a":1,"w":"مجتمع التعلم المهني الفعّال يدور حول مشكلة تعليمية مشتركة، ويعتمد على بيانات الطلاب بدل الانطباعات، ويراجع الأدلة، ويتفق على إجراء قابل للتنفيذ والقياس، ثم يتابع النتائج ويعدل الممارسة.","n":["يزيد الكم ولا يغير طبيعة الاجتماع.","صحيح: مشكلة وبيانات ودليل وتجريب ومتابعة.","التدريب مفيد، لكن المحاضرات وحدها لا تربط التعلم ببيانات الطلاب.","يحوّل الاجتماع إلى عمل إداري لا تعلم مهني."],"c":"لتبادل أوراق العمل… فقط","p":"مجتمع التعلم المهني = مشكلة مشتركة + بيانات + دليل + إجراء + متابعة أثر."},{"id":"1-44","s":1,"i":"1.8","l":"تحليل","t":"طبق معلم برنامجًا قرائيًّا تدعمه مراجعات منهجية قوية، على أن يُنفذ ثلاث جلسات أسبوعيًّا، لكنه اختصره إلى جلسة واحدة لضيق الوقت. بعد ثمانية أسابيع تحسن أربعة طلاب، وبقي طالب خامس دون تقدم يُذكر. ما الإجراء الأدق؟","o":["الحكم بأن البرنامج غير فعال، وإيقافه لجميع الطلاب الخمسة، ثم البحث عن برنامج بديل أحدث منه وأكثر شهرة","الاستمرار بالجلسة الأسبوعية نفسها دون أي تغيير؛ لأن البرنامج مثبت بحثيًّا بمراجعات منهجية","إحالة الطالب الخامس لتقييم إعاقة فكرية بسبب عدم استجابته للبرنامج مثل زملائه الأربعة","فحص دقة التنفيذ والجرعة أولًا، ثم مراجعة ملاءمة البرنامج لهذا الطالب وتعديل القرار وفق بياناته"],"a":3,"w":"دقة التنفيذ عامل مهم قبل الحكم على فشل التدخل، والجرعة هنا خُفضت إلى ثلثها. فإذا تعارضت نتيجة البحث مع بيانات طالب، لا يُرفض العلم ولا يُتجاهل الطالب، بل تُراجع دقة التنفيذ والجرعة والملاءمة ثم يُعدَّل القرار.","n":["يعمم فشل حالة واحدة على برنامج نجح مع أربعة طلاب.","الدليل البحثي لا يغني عن بيانات الطالب ودقة التنفيذ.","يقفز إلى تفسير تشخيصي قبل فحص أسباب أقرب في الموقف.","صحيح: الجرعة اختُصرت، فتُفحص الدقة قبل الحكم."],"c":"اختصره إلى جلسة واحدة","p":"قبل الحكم بفشل تدخل مثبت، افحص دقة التنفيذ والجرعة وملاءمته للطالب."},{"id":"2-01","s":2,"i":"2.1","l":"معرفة","t":"تنتج متلازمة داون عن وجود كروموسوم زائد في الزوج رقم 21. كيف تُصنَّف هذه الحالة ضمن الأسباب العامة للإعاقة؟","o":["سبب قبل الولادة من العوامل الوراثية والصبغية","سبب قبل الولادة من العوامل البيئية المشوهة للجنين","سبب أثناء الولادة من مضاعفات المخاض وعسر الولادة","سبب بعد الولادة من العوامل المكتسبة في الطفولة المبكرة"],"a":0,"w":"الاضطرابات الصبغية (الكروموسومية) مثل متلازمة داون ومتلازمة إكس الهش من العوامل الوراثية والجينية التي تقع قبل الولادة، إذ تنشأ منذ تكوين البويضة الملقحة. وتختلف عن المشوهات البيئية كالعدوى والأدوية والإشعاع التي تتعرض لها الأم في أثناء الحمل.","n":["صحيح: خلل صبغي منذ الإخصاب.","التوقيت صحيح، لكن المشوهات عوامل بيئية لا صبغية.","الحالة لا ترتبط بالمخاض أو الولادة.","الخلل الصبغي ليس مكتسبًا بعد الميلاد."],"c":"كروموسوم زائد في الزوج رقم 21","p":"خلل صبغي أو جيني = قبل الولادة وراثي، وعدوى أو دواء في أثناء الحمل = قبل الولادة بيئي."},{"id":"2-02","s":2,"i":"2.1","l":"معرفة","t":"أي البرامج الآتية يُعد مثالًا على الوقاية الأولية من الإعاقة؟","o":["فحص حديثي الولادة للكشف عن قصور الغدة الدرقية الخلقي مبكرًا","الكشف المبكر عن ضعف السمع لدى أطفال رياض الأطفال في المدارس","الفحص الطبي قبل الزواج للحد من الأمراض الوراثية والدموية","العلاج الطبيعي لطفل مصاب بالشلل الدماغي لمنع المضاعفات"],"a":2,"w":"الوقاية الأولية تهدف إلى منع حدوث الإعاقة من الأساس بإزالة المسببات أو تقليل التعرض لها، ومن أمثلتها الفحص قبل الزواج والتطعيم والتثقيف الصحي وحمض الفوليك. أما فحوص الكشف المبكر فوقاية ثانوية، والعلاج بعد وجود الإعاقة وقاية ثالثية.","n":["كشف مبكر، فهو وقاية ثانوية.","كشف مبكر، فهو وقاية ثانوية.","صحيح: يمنع الحدوث قبل وقوعه.","تقليل أثر إعاقة قائمة، فهو وقاية ثالثية."],"c":"الوقاية الأولية","p":"أولية = منع، وثانوية = كشف مبكر، وثالثية = تقليل أثر إعاقة موجودة."},{"id":"2-03","s":2,"i":"2.1","l":"تطبيق","t":"أصيبت أم بداء القطط (التوكسوبلازما) في أثناء حملها، ووُلد طفلها في موعده دون مضاعفات ولادة، ثم اكتُشفت لديه مشكلات بصرية في عامه الأول. كيف يُصنَّف هذا العامل زمنيًّا؟","o":["سبب قبل الولادة؛ لأن العدوى أصابت الأم في أثناء الحمل","سبب بعد الولادة؛ لأن المشكلات البصرية اكتُشفت في عامه الأول","سبب أثناء الولادة؛ لأن العدوى انتقلت إلى الطفل في قناة الولادة","سبب وراثي جيني؛ لأن العدوى انتقلت من الأم إلى جنينها مباشرة"],"a":0,"w":"التصنيف الزمني يعتمد على توقيت حدوث العامل لا توقيت ظهور الأثر. وداء القطط من الأمراض المعدية لدى الأم التي تُعد من العوامل المشوهة للجنين خلال الحمل، فيُصنف سببًا قبل الولادة حتى لو اكتُشف أثره لاحقًا.","n":["صحيح: العبرة بتوقيت حدوث العامل.","يخلط بين توقيت ظهور الأثر وتوقيت حدوث العامل.","الموقف ينفي مضاعفات الولادة، والعدوى حدثت في أثناء الحمل.","انتقال العدوى من الأم ليس وراثة جينية."],"c":"في أثناء حملها… في عامه الأول","p":"الزمن يحسم تصنيف السبب: متى حدث العامل، لا متى ظهر أثره."},{"id":"2-04","s":2,"i":"2.1","l":"تطبيق","t":"تعسرت ولادة طفل، فاستُخدم الملقط بطريقة غير دقيقة، فأصيب بنزيف دماغي اكتُشف في أيامه الأولى. كيف يُصنَّف هذا السبب؟","o":["أثناء الولادة؛ إصابة رضية ميكانيكية مرتبطة بعملية الولادة","بعد الولادة؛ إصابة دماغية رضية اكتُشفت بعد خروجه من الرحم","قبل الولادة؛ لأن عسر الولادة يرتبط بظروف الحمل ومضاعفاته","بعد الولادة؛ لأن النزيف حدث للطفل وهو خارج الرحم"],"a":0,"w":"الإصابات الرضية الميكانيكية الناتجة عن استخدام أدوات الولادة كالملقط أو الشفط بطريقة غير دقيقة من أسباب «أثناء الولادة»؛ لأنها مرتبطة بعملية الولادة ومضاعفاتها. ولا يغير اكتشافها في الأيام الأولى تصنيفها.","n":["صحيح: مرتبطة بأدوات الولادة وعمليتها.","إصابات الدماغ الرضية بعد الولادة تنتج عن حوادث لاحقة لا عن أدوات الولادة.","عسر الولادة من مضاعفات المخاض لا من ظروف الحمل.","وجود الطفل خارج الرحم لا يجعل السبب لاحقًا للولادة."],"c":"تعسرت ولادة… استُخدم الملقط","p":"المخاض والولادة وأدواتها أسباب «أثناء الولادة» حتى لو اكتُشف الأثر بعدها."},{"id":"2-05","s":2,"i":"2.1","l":"تطبيق","t":"طفل في الثالثة يعيش في منزل قديم يتقشر دهانه، وتراجعت قدراته المعرفية، وكشفت الفحوص ارتفاع نسبة الرصاص في دمه. ما التصنيف الزمني لهذا السبب، وما مستوى الوقاية الذي تمثله إزالة الدهان القديم من منازل الحي قبل تعرض الأطفال له؟","o":["سبب بعد الولادة، والإزالة وقاية ثانوية","سبب قبل الولادة، والإزالة وقاية أولية","سبب بعد الولادة، والإزالة وقاية أولية","سبب بعد الولادة، والإزالة وقاية ثالثية"],"a":2,"w":"التسمم بالرصاص الناتج عن تقشر الدهان القديم من الأسباب المكتسبة بعد الولادة. وإزالة مصدر التعرض قبل حدوث التسمم تمنع الحالة من الأساس، فهي وقاية أولية.","n":["الثانوية كشف مبكر، والإزالة هنا تمنع التعرض نفسه.","التسمم حدث للطفل بعد ميلاده.","صحيح: سبب مكتسب، وإزالة المسبب تمنع الحدوث.","الثالثية تقلل أثر إعاقة موجودة، والإزالة تسبق التعرض."],"c":"قبل تعرض الأطفال له","p":"منع التعرض للمسبب وقاية أولية، مهما كان توقيت السبب نفسه."},{"id":"2-06","s":2,"i":"2.1","l":"تطبيق","t":"نفذت وحدة الصحة المدرسية برنامجًا لفحص السمع والبصر لجميع طلاب الصف الأول الابتدائي، بهدف اكتشاف المشكلات مبكرًا قبل أن تؤثر في تعلمهم. ما مستوى الوقاية الذي يمثله البرنامج؟","o":["وقاية أولية","وقاية ثالثية","وقاية ثانوية","ليس وقاية بل تشخيص طبي نهائي"],"a":2,"w":"الوقاية الثانوية تهدف إلى الاكتشاف المبكر للحالة والتدخل السريع لوقف تطورها أو الحد من تفاقمها، ومن أمثلتها برامج الكشف المبكر عن اضطرابات السمع والبصر والفحوص الدورية في الصحة المدرسية. وعبارة «قبل أن تؤثر» لا تجعله وقاية أولية؛ لأنه لا يمنع حدوث المشكلة بل يكتشفها.","n":["الأولية تمنع حدوث الحالة، والفحص يكتشفها بعد حدوثها.","الثالثية تقلل أثر إعاقة ثابتة موجودة.","صحيح: كشف مبكر للحد من التفاقم.","الفحص يحدد من يحتاج تقييمًا أعمق ولا يُعد تشخيصًا نهائيًّا."],"c":"بهدف اكتشاف المشكلات مبكرًا","p":"الفحص للكشف المبكر وقاية ثانوية، ولو جاء قبل ظهور أثر الحالة في التعلم."},{"id":"2-07","s":2,"i":"2.1","l":"تحليل","t":"يتضمن ملف طالب في الصف الثالث أنه وُلد قبل الأسبوع 37 من الحمل بوزن أقل من 2500 غرام، وكتب معلمه في تقريره: «سبب صعوبته في القراءة هو الولادة المبكرة». ما التحليل الأدق لهذه العبارة؟","o":["العبارة دقيقة؛ لأن الولادة المبكرة تؤدي حتمًا إلى صعوبات في التعلم لدى جميع من يولدون قبل اكتمال الحمل","العبارة دقيقة في جوهرها، لكن الأدق نسبة الصعوبة إلى انخفاض الوزن عند الولادة لا إلى الولادة المبكرة","العبارة خاطئة؛ لأن الولادة المبكرة تُصنف ضمن أسباب ما قبل الولادة لا أسباب أثناء الولادة","الولادة المبكرة وانخفاض الوزن عاملا خطورة لا يثبتان وحدهما سبب الصعوبة؛ فتُضم المعلومة إلى بيانات أشمل"],"a":3,"w":"عامل الخطورة يزيد احتمال حدوث مشكلة لكنه لا يعني حتميتها، ووجوده في التاريخ النمائي لا يكفي للحكم على السبب أو نوع الصعوبة. ودور المعلم توظيف المعلومة لفهم الخلفية ودعم الإحالة والتخطيط ضمن بيانات أشمل، لا إصدار حكم سببي طبي.","n":["يحول الاحتمال إلى حتمية.","يستبدل عامل خطر بآخر ويبقى في الحكم السببي نفسه.","المصدر يصنف الولادة المبكرة ضمن أسباب أثناء الولادة، وليس هذا موضع الخلل أصلًا.","صحيح: عامل خطر لا سبب حتمي."],"c":"«سبب صعوبته… هو الولادة المبكرة»","p":"عامل الخطر يزيد الاحتمال، ولا يساوي السبب ولا التشخيص."},{"id":"2-08","s":2,"i":"2.1","l":"تحليل","t":"في ورشة عن الوقاية من الإعاقة عُرض برنامجان: الأول تقديم حمض الفوليك للنساء قبل الحمل وفي أسابيعه الأولى، والثاني تقديم علاج وظيفي وبرنامج تربوي فردي لطالبة لديها سنسنة مشقوقة (Spina Bifida). ما التصنيف الأدق للبرنامجين؟","o":["الأول وقاية ثانوية، والثاني وقاية ثالثية","الأول وقاية أولية، والثاني وقاية ثانوية","كلاهما وقاية ثانوية؛ لأنهما يرتبطان بعيوب الأنبوب العصبي","الأول وقاية أولية، والثاني وقاية ثالثية"],"a":3,"w":"نقص حمض الفوليك يرتبط بعيوب الأنبوب العصبي كالسنسنة المشقوقة، وتقديمه قبل الحمل يمنع الحالة أو يقلل خطرها، فهو وقاية أولية. أما العلاج الوظيفي والبرنامج التربوي الفردي لطالبة لديها الحالة فعلًا فيهدفان إلى تقليل الأثر ومنع المضاعفات، فهما وقاية ثالثية.","n":["حمض الفوليك لا يكشف حالة بل يمنعها.","البرنامج الثاني يتعامل مع إعاقة قائمة، فهو ثالثي لا ثانوي.","ارتباطهما بالحالة نفسها لا يوحد مستوى الوقاية؛ فالهدف هو الحاسم.","صحيح: الأول يمنع، والثاني يقلل أثر حالة قائمة."],"c":"قبل الحمل… لطالبة لديها سنسنة مشقوقة","p":"صنّف الوقاية بهدف الإجراء: منع، أم كشف مبكر، أم تقليل أثر حالة قائمة."},{"id":"2-09","s":2,"i":"2.2","l":"معرفة","t":"لاحظت معلمة رياض أطفال أن أطفال فصلها مرّوا جميعًا بالمناغاة ثم الكلمة الأولى ثم الجمل القصيرة، لكن أعمار بلوغهم هذه المحطات اختلفت من طفل إلى آخر. أي مبادئ النمو يفسر ذلك بدقة؟","o":["النمو يسير من المركز إلى الأطراف ومن العام إلى الخاص","النضج البيولوجي وحده يحدد توقيت ظهور كل مهارة لدى الطفل","التسلسل النمائي أكثر ثباتًا من العمر الدقيق لاكتساب المهارة","كل تفاوت في توقيت اكتساب المهارة مؤشر على اضطراب نمائي"],"a":2,"w":"من مبادئ النمو أن المهارات تظهر غالبًا في ترتيب متوقع، بينما يختلف العمر الدقيق لاكتسابها بين الأطفال ضمن مدى طبيعي؛ لأن معدلات النمو فردية. لذلك لا يُفسر كل تفاوت في التوقيت على أنه اضطراب.","n":["مبدأ صحيح لكنه يخص اتجاه النمو لا ثبات التسلسل.","النمو نتاج تفاعل البيولوجيا مع الخبرة والبيئة.","صحيح: ترتيب ثابت وتوقيت متفاوت.","التفاوت ضمن المدى الطبيعي ليس اضطرابًا."],"c":"مرّوا جميعًا… اختلفت أعمار بلوغهم","p":"التسلسل أكثر ثباتًا من التوقيت، ومعدلات النمو فردية."},{"id":"2-10","s":2,"i":"2.2","l":"معرفة","t":"يتحكم الرضيع في رأسه ورقبته أولًا، ثم في جذعه فيجلس، ثم في ساقيه فيقف ويمشي. أي اتجاه نمائي يجسده هذا التسلسل؟","o":["من المركز إلى الأطراف","من الرأس إلى القدمين","من الاستجابات الخاصة إلى العامة","من المهارات الدقيقة إلى الكبرى"],"a":1,"w":"للنمو اتجاهات عامة، منها أنه يسير من الرأس إلى القدمين، ومن المركز إلى الأطراف، ومن الاستجابات العامة إلى الأكثر تخصصًا ودقة. والتحكم في الرأس ثم الجذع ثم الساقين مثال مباشر على الاتجاه من الرأس إلى القدمين.","n":["اتجاه صحيح لكنه يخص التحكم من الجذع نحو الذراعين والأصابع.","صحيح: رأس ثم جذع ثم ساقان.","يعكس الاتجاه؛ فالنمو من العام إلى الخاص.","يعكس الاتجاه؛ فالحركات الكبرى تسبق الدقيقة عادة."],"c":"رأسه… ثم جذعه… ثم ساقيه","p":"من الرأس إلى القدمين، ومن المركز إلى الأطراف، ومن العام إلى الخاص."},{"id":"2-11","s":2,"i":"2.2","l":"تطبيق","t":"ريم طالبة في الصف الثاني لديها ضعف في اللغة التعبيرية، ولاحظت معلمتها أنها تنسحب من اللعب الجماعي وتبكي حين لا يفهمها زملاؤها. ما التوجه الأنسب لخطة دعمها؟","o":["معالجة الانسحاب بالإرشاد النفسي وحده؛ لأنه سمة شخصية مستقلة عن ضعفها اللغوي","تأجيل الأهداف الاجتماعية كلها حتى تتحسن لغتها التعبيرية تحسنًا كاملًا","دعم تواصلها التعبيري في مواقف اللعب والتفاعل نفسها؛ فمجالات النمو مترابطة","إحالتها لتشخيص إعاقة فكرية؛ لأن تأخر اللغة يصاحبه انسحاب اجتماعي في الغالب"],"a":2,"w":"مجالات النمو مترابطة؛ فضعف التواصل قد ينعكس على المشاركة الاجتماعية والتنظيم الانفعالي. لذلك يكون الدعم الأنسب في تنمية التواصل داخل المواقف الاجتماعية الطبيعية، بدل معالجة كل مجال بمعزل عن الآخر.","n":["يفصل السلوك عن سببه التواصلي الظاهر في الموقف.","يؤخر دعمًا تحتاجه الآن ويتجاهل الترابط.","صحيح: يعالج المجالين المترابطين معًا.","يقفز إلى تشخيص بلا قرائن على قصور معرفي أو تكيفي."],"c":"ضعف في اللغة التعبيرية… حين لا يفهمها","p":"مجالات النمو مترابطة: ابحث عن أثر الضعف في مجال على المجالات الأخرى."},{"id":"2-12","s":2,"i":"2.2","l":"تطبيق","t":"طبقت معلمة رياض أطفال قائمة فحص مختصرة (Screening) على أطفال فصلها، فأظهرت أن طفلين قد يحتاجان إلى متابعة في النمو اللغوي. ما الاستخدام الصحيح لهذه النتيجة؟","o":["إبلاغ الأسرتين بأن طفليهما مصابان باضطراب لغوي يحتاج إلى علاج متخصص عاجل خارج المدرسة","التواصل مع أسرتيهما والإحالة إلى تقييم أعمق، مع مواصلة الرصد في المواقف الصفية","تجاهل النتيجة لأن القائمة مختصرة ولا يُعتمد عليها في أي قرار تربوي","إلحاقهما ببرنامج علاجي لغوي مكثف دون انتظار أي تقييم إضافي لحالتهما"],"a":1,"w":"الفحص إجراء مختصر لتحديد من قد يحتاج إلى تقييم أعمق، ولا يثبت التشخيص وحده. لذلك تُستخدم نتيجته للتواصل مع الأسرة والإحالة إلى تقييم شامل، مع استمرار الرصد.","n":["يحول نتيجة الفحص إلى تشخيص نهائي.","صحيح: الفحص بوابة للتقييم لا تشخيص.","يهدر وظيفة الفحص في الكشف المبكر.","يقرر الخدمة قبل التقييم الذي يحدد الحاجة."],"c":"قائمة فحص مختصرة… قد يحتاجان","p":"الرصد غير الفحص، والفحص غير التشخيص؛ فالفحص يحدد من يحتاج تقييمًا أعمق."},{"id":"2-13","s":2,"i":"2.2","l":"تطبيق","t":"كان نواف (5 سنوات) يستخدم جملًا من ثلاث كلمات ويستأذن لدخول دورة المياه، ثم صار خلال شهرين يكتفي بالإشارة ويفقد ضبط الإخراج أحيانًا. ما الإجراء المهني الأنسب للمعلمة؟","o":["الانتظار حتى نهاية العام؛ لأن معدلات النمو تختلف من طفل إلى آخر","إبلاغ الأسرة بأن طفلها لديه اضطراب نمائي محدد لتبدأ علاجه مبكرًا لدى المختصين","خفض أهدافه في اللغة والاستقلالية إلى مستوى أدائه الحالي والاكتفاء بذلك","توثيق الملاحظات والتواصل مع الأسرة والإحالة إلى التقييم المناسب دون إبطاء"],"a":3,"w":"فقدان مهارة سبق اكتسابها مؤشر يستدعي الانتباه، وليس من قبيل الفروق الفردية في التوقيت. والإجراء المهني جمع البيانات والتواصل مع الأسرة والإحال
