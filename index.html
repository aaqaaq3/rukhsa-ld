id":"6-10","s":6,"i":"6.2","l":"معرفة","t":"قرر فريق الخطة الفردية للطالب عبدالله منحه فترات راحة قصيرة منظمة، وتقسيم الاختبار الطويل على جلستين في يومين متتاليين، مع بقاء الأسئلة نفسها. إلى أي أنواع التكييفات ينتمي هذا القرار؟","o":["تكييف طريقة العرض","تكييف الزمن والجدولة","تكييف طريقة الاستجابة","تكييف البيئة والمكان"],"a":1,"w":"تُصنف التكييفات الشائعة أربعة أنواع: العرض، والاستجابة، والبيئة، والزمن والجدولة. وفترات الراحة وتقسيم الاختبار على جلستين تغيّر متى يُؤدى العمل وكم يستغرق، دون تغيير الأسئلة أو الهدف.","n":["العرض يخص طريقة تقديم المعلومة، كالتنسيق البصري أو النص المسموع.","صحيح: تغيّر الوقت وتوزيع المهمة فقط.","الاستجابة تخص طريقة إظهار التعلم، كالإجابة الشفهية أو الحاسوب.","البيئة تخص مكان الأداء وظروفه، كالغرفة الهادئة والمقعد المناسب."],"c":"فترات راحة … تقسيم الاختبار على جلستين","p":"العرض = كيف تصل المعلومة، الاستجابة = كيف يُظهر التعلم، البيئة = أين، الزمن = متى وكم."},{"id":"6-11","s":6,"i":"6.2","l":"تطبيق","t":"في اختبار إملاء هدفه قياس قدرة الطالب على كتابة الكلمات كتابة صحيحة، طلبت أسرة الطالب فيصل أن يستخدم برنامجًا يحوّل الكلام إلى نص مزوّدًا بالتصحيح الإملائي التلقائي. ما القرار الأنسب؟","o":["عدم اعتماد البرنامج في هذا الاختبار لأنه يؤدي مهارة الإملاء المقاسة نيابة عن فيصل","اعتماده لأن كل تقنية مساعدة مذكورة في الخطة تُعد تكييفًا مشروعًا في أي اختبار","اعتماده بشرط أن يُمنح فيصل وقتًا أقل من زملائه تحقيقًا لتكافؤ الفرص بينهم","إعفاء فيصل من اختبار الإملاء كليًا والاكتفاء بتقدير المعلم لمستواه الكتابي"],"a":0,"w":"التكييف يزيل حاجزًا غير مقصود مع الحفاظ على البناء المقاس. وفي اختبار يقيس الإملاء، فإن برنامج التصحيح التلقائي يكتب الكلمات صحيحة بدل الطالب، فيُفسد صدق القياس ويتحول من تكييف إلى إلغاء للمهارة.","n":["صحيح: التكييف لا يجوز أن يؤدي المهارة المقاسة.","صلاحية التقنية تتوقف على البناء المقاس، وهي هنا تلغي المهارة نفسها.","شرط لا علاقة له بصدق القياس، والبرنامج ما زال يكتب الإملاء عنه.","إعفاء غير مبرر؛ يمكن البحث عن دعم لا يستبدل المهارة."],"c":"اختبار إملاء … التصحيح الإملائي التلقائي","p":"قبل اعتماد أي دعم اسأل: هل يزيل عائقًا جانبيًا أم يؤدي المهارة المقاسة نفسها؟"},{"id":"6-12","s":6,"i":"6.2","l":"تطبيق","t":"بعد أسبوعين من بداية العام، اقترح معلم الرياضيات خفض أهداف الطالب خالد إلى مستوى صف أدنى، لأن درجته في أول اختبار كانت منخفضة، ولم تُجرَّب معه أي تكييفات بعد. ما الإجراء الأنسب أولًا؟","o":["اعتماد خفض الأهداف لأن الاختبار الأول دليل كافٍ على صعوبة المنهج العام عليه","رفض تعديل أهدافه مستقبلًا لأن أهداف طلاب صعوبات التعلم لا تُعدَّل في أي حال","تكليف خالد بواجبات إضافية من المستوى نفسه حتى يلحق بزملائه في الصف","تجريب تكييفات وتدريس مناسب مع جمع البيانات قبل النظر في تعديل الأهداف"],"a":3,"w":"التعديل ليس الخطوة الأولى عند التعثر. يبدأ المعلم بتحديد الحاجز وتجريب التكييفات والتدريس المناسب مع متابعة البيانات، ولا يُنظر في تعديل الأهداف إلا إذا أثبتت البيانات الفردية أن الهدف غير ممكن رغم ذلك.","n":["قفز إلى التعديل من نقطة بيانات واحدة دون تجريب الوصول.","القرار فردي، وقد يُبرَّر التعديل لاحقًا إذا أثبتته البيانات.","يزيد الكم دون تحديد الحاجز أو تعديل التدريس.","صحيح: الوصول والتدريس أولًا، والتعديل لا يكون إلا ببيانات."],"c":"لم تُجرَّب معه أي تكييفات بعد","p":"لا تنتقل من صعوبة الوصول إلى خفض الهدف مباشرة: حاجز ← تكييف وتدريس ← بيانات ← قرار."},{"id":"6-13","s":6,"i":"6.2","l":"تحليل","t":"بعد فصل دراسي كامل من تدخل مكثف موثق، وتكييفات ثبتت فاعليتها في إزالة حواجز الوصول، ما زالت بيانات تقدم الطالبة لمى في الرياضيات بعيدة جدًا عن هدف الصف. ما القرار الأدق؟","o":["مراجعة فريق الخطة للبيانات، وتحديد ما إذا كان تعديل الهدف مبررًا لها فرديًا","مضاعفة التكييفات الحالية، لأن التكييف الكافي يغني في كل الأحوال عن تعديل الهدف","الاستمرار بالهدف نفسه دون مراجعة، لأن تعديل الأهداف يتعارض مع مبدأ الشمول","خفض الهدف من قِبل معلمة الرياضيات منفردة في خطة تحضيرها اليومية"],"a":0,"w":"هنا توافرت شروط النظر في التعديل: تدخل مكثف موثق، وتكييفات فعالة، وبيانات تقدم تُظهر بقاء الفجوة. عندها يراجع فريق الخطة البيانات ويقرر فرديًا ما إذا كان تعديل الهدف مبررًا، لا قبل ذلك ولا بقرار شخص منفرد.","n":["صحيح: التعديل يصبح ممكنًا بعد التدخل والبيانات وبقرار الفريق.","التكييفات أزالت حاجز الوصول، ومضاعفتها لا تعالج ضعف تعلم الهدف نفسه.","التعديل المبرر بالبيانات لا يتعارض مع الشمول.","تعديل الأهداف قرار فريق موثق، لا قرار فردي غير رسمي."],"c":"تدخل مكثف موثق، وتكييفات ثبتت فاعليتها","p":"التعديل مشروع بعد التدخل والتكييف والبيانات، وبقرار فريق موثق لا قبل ذلك."},{"id":"6-14","s":6,"i":"6.2","l":"تحليل","t":"يستخدم الطالب تركي في دروس الكتابة «مخططًا جاهزًا» يتضمن جملًا مكتملة يرتبها ويلصقها، فتخرج فقراته جيدة، مع أن هدف الدرس أن يتعلم تنظيم أفكاره في فقرة. ما التفسير الأدق لهذا الدعم؟","o":["تكييف ناجح ينبغي استمراره، لأن جودة الفقرات الناتجة ارتفعت بوضوح","تعديل مقبول، لأنه أبقى تركي في نشاط الصف نفسه مع زملائه","دعم يؤدي المهارة المستهدفة نيابة عن تركي بدل أن يزيل حاجزًا","تكييف عرض، لأنه غيّر طريقة تقديم المعلومات إلى تركي فقط"],"a":2,"w":"الدعم الجيد يزيل حاجز الوصول ويترك العمل المعرفي المستهدف للطالب. وحين يكون الهدف تعلّم تنظيم الأفكار، فإن تقديم جمل مكتملة يرتبها الطالب يؤدي المهارة نفسها عنه، فيلزم مراجعة الدعم ليصبح سقالة تُسحب تدريجيًا.","n":["جودة المنتج لا تعني تعلم المهارة إذا أدّاها الدعم بدل الطالب.","البقاء في النشاط لا يبرر دعمًا يلغي الهدف.","صحيح: الدعم يقوم بالتفكير المطلوب بدل الطالب.","الدعم لم يغيّر العرض فقط، بل قدّم الجمل والتنظيم جاهزين."],"c":"جملًا مكتملة … هدف الدرس تنظيم أفكاره","p":"إذا أدّى الدعم المهارة المقصودة بدل الطالب فقد فسد؛ راجعه أو اخفضه."},{"id":"6-15","s":6,"i":"6.2","l":"تحليل","t":"اقترح أحد المعلمين في لجنة الاختبارات أن يُمنح كل طالب ذي صعوبات تعلم وقتًا إضافيًا قدره 50% في جميع الاختبارات «توحيدًا للإجراء». ما الملاحظة المهنية الأدق على هذا المقترح؟","o":["مقدار الوقت يُحدد فرديًا وفق الحاجة الموثقة وطبيعة المهمة وسياسة الاختبار","المقترح مناسب لأنه يوحّد التكييف ويمنع التفاوت بين طلاب صعوبات التعلم في المدرسة","الأفضل منح وقت مفتوح بلا حد حتى يُنهي كل طالب جميع الأسئلة","الوقت الإضافي تعديل للمنهج، فلا يُمنح إلا بقرار يعدّل أهداف الطالب"],"a":0,"w":"اعتبار 50% قاعدة ثابتة خطأ شائع؛ فمقدار الوقت الإضافي يتحدد وفق الحاجة الموثقة لكل طالب وطبيعة المهمة وما تسمح به سياسة الاختبار. كما أن الوقت الإضافي لا يناسب أصلًا مهمة تكون السرعة فيها جزءًا من المهارة المقاسة.","n":["صحيح: لا نسبة موحدة؛ القرار فردي وموثق.","يجعل التكييف قاعدة فئوية ثابتة لا قرارًا فرديًا.","يتجاهل الحاجة الموثقة وقد يُدخل عوامل غير مرتبطة بالهدف.","الوقت الإضافي تكييف زمني لا يغيّر الهدف المقاس."],"c":"كل طالب … 50% في جميع الاختبارات","p":"لا تكييفات بالجملة: كل تكييف يُربط بحاجز فردي وهدف وبيانات."},{"id":"6-16","s":6,"i":"6.3","l":"معرفة","t":"صممت إدارة مدرسة جديدة مداخلها وممراتها ودورات المياه منذ البداية بحيث يستخدمها أكبر عدد ممكن من الطلاب والزوار دون حاجة إلى تعديلات لاحقة. أي المفاهيم الآتية يمثّله هذا الإجراء بدقة؟","o":["التصميم الشامل للتعلم (UDL)","التقنية المساعدة (AT)","التصميم الشامل (UD)","التكييف الفردي (Accommodation)"],"a":2,"w":"التصميم الشامل (UD) يعني تصميم المنتجات والبيئات منذ البداية لتكون قابلة للاستخدام من أوسع نطاق ممكن من الناس، دون حاجة قدر الإمكان إلى تصميم متخصص لاحق، وهو ما فعلته المدرسة في مرافقها.","n":["UDL يخص تصميم أهداف التعلم ومواده وطرقه وتقويمه لا المبنى.","التقنية المساعدة أداة تمكين فردية تُستخدم عند الحاجة.","صحيح: تصميم البيئة للجميع منذ البداية.","التكييف استجابة لحاجة طالب محدد لا تصميم مسبق للجميع."],"c":"مرافق مصممة منذ البداية لأكبر عدد","p":"منذ البداية للجميع: بيئة أو منتج ← UD، وتعلّم ← UDL."},{"id":"6-17","s":6,"i":"6.3","l":"تطبيق","t":"تخطط معلمة لدرس عن دورة الماء في فصل يضم طالبات متفاوتات في القراءة والانتباه والتعبير. أي الممارسات الآتية يتسق مع التصميم الشامل للتعلم (UDL)؟","o":["تصنيف الطالبات إلى بصريات وسمعيات وحركيات، وتدريس كل فئة بالنمط الذي يناسبها","عرض المفاهيم بنص وصور وتسجيل صوتي، وإتاحة أكثر من طريقة لإظهار الفهم","ترك اختيار المهمة لكل طالبة دون ضوابط مرتبطة بهدف الدرس","إعداد الدرس بطريقة واحدة، ثم تعديله لمن تتعثر بعد انتهائه"],"a":1,"w":"التصميم الشامل للتعلم يبني المرونة في الدرس منذ التخطيط عبر وسائل متعددة للتمثيل والمشاركة والفعل والتعبير، مرتبطة بأهداف التعلم. ولا يعني تصنيف الطلاب في أنماط تعلم ثابتة، ولا ترك الاختيار بلا ضوابط.","n":["UDL لا يقوم على أنماط تعلم ثابتة، بل على خيارات مرنة للجميع.","صحيح: تمثيل متعدد وطرق تعبير متعددة منذ التخطيط.","المرونة في UDL منظمة ومرتبطة بأهداف التعلم.","هذه استجابة لاحقة بعد الإخفاق لا تصميم استباقي."],"c":"متفاوتات في القراءة والانتباه والتعبير","p":"UDL = خيارات مرنة مرتبطة بالهدف منذ التخطيط، لا أنماط تعلم ثابتة."},{"id":"6-18","s":6,"i":"6.3","l":"تطبيق","t":"رفعت معلمة ورقة عمل على منصة المدرسة بصيغة صورة ممسوحة ضوئيًا، فلم تستطع الطالبة رهف، التي تعتمد على برنامج قارئ الشاشة، الاستفادة منها، وقالت المعلمة: «الملف رقمي فهو متاح». ما الإجراء الأنسب؟","o":["تكليف زميلة بقراءة الورقة على رهف في كل مرة تُرفع فيها مادة","إعفاء رهف من ورقة العمل وتعويضها بنشاط آخر أسهل منها","طباعة الصورة بحجم أكبر وإرسالها ورقيًا إلى منزل رهف","إعادة إنتاج الورقة بصيغة نصية منظمة تقرؤها أدوات الوصول"],"a":3,"w":"الرقمنة لا تساوي الوصول الرقمي. فالصورة الممسوحة لا يقرؤها قارئ الشاشة، والحاجز في بنية المحتوى نفسه، وإصلاحه بإنتاج نص منظم يحقق وصولًا مستقلًا ومستدامًا بدل الحلول البشرية المتكررة.","n":["يصنع اعتمادًا على شخص ويترك الحاجز الرقمي قائمًا.","يحرمها من المحتوى ويخفض التوقعات بدل إزالة الحاجز.","التكبير لا يعالج حاجتها إلى نص يقرؤه البرنامج.","صحيح: يعالج بنية المحتوى الرقمي نفسه."],"c":"صورة ممسوحة ضوئيًا … قارئ الشاشة","p":"النسخة الإلكترونية ≠ محتوى قابل للوصول؛ افحص قابلية الاستخدام الفعلية."},{"id":"6-19","s":6,"i":"6.3","l":"تطبيق","t":"صممت معلمة دروسها وفق التصميم الشامل للتعلم بنصوص مسموعة ومرئية وخيارات متعددة للتعبير، ومع ذلك ما زال الطالب ماجد يحتاج إلى أداة تكبير خاصة لا يحتاجها غيره. ما الموقف الأنسب؟","o":["عدم توفيرها، لأن التصميم الشامل للتعلم يغني عن أي دعم فردي","إعادة تصميم الدروس كلها من جديد حتى يستغني ماجد عن الأداة","تأجيل توفيرها حتى يحتاج إليها عدد أكبر من طلاب الفصل","توفيرها له، فالدعم الفردي يكمل التصميم الشامل ولا يناقضه"],"a":3,"w":"التصميم الأكثر وصولًا يقلل الحاجة إلى بعض التكييفات الفردية لكنه لا يلغيها. فإذا بقيت لدى طالب حاجة محددة، تُلبّى بالدعم المناسب دون تأخير، ولا يُفترض أن التصميم العام كافٍ للجميع.","n":["UDL يقلل الحاجة إلى التكييفات الفردية لكنه لا يلغيها.","يؤخر حق ماجد الحالي، وحاجته الفردية قائمة الآن.","الحاجة الفردية لا يُشترط لتلبيتها كثرة المستفيدين.","صحيح: الدعم الفردي يكمل التصميم العام."],"c":"ما زال يحتاج أداة لا يحتاجها غيره","p":"UDL يقلل التكييفات ولا يلغيها: الحاجة الفردية الباقية تُلبّى فورًا."},{"id":"6-20","s":6,"i":"6.3","l":"معرفة","t":"شكّلت مدرسة فريقًا لتدقيق الحواجز (Barrier Audit) في مبناها ومنصاتها وموادها. أي الترتيبات الآتية لخطوات العمل هو الأدق؟","o":["اقتراح البدائل وتنفيذها ← رصد العوائق ← تحديد النطاق ← تحليل أثرها ← متابعة الأثر","رصد العوائق ← اقتراح البدائل وتنفيذها ← تحديد النطاق ← متابعة الأثر ← تحليل أثرها","تحديد النطاق ← رصد العوائق ← تحليل أثرها ← اقتراح البدائل وتنفيذها ← متابعة الأثر","تحديد النطاق ← اقتراح البدائل وتنفيذها ← رصد العوائق ← تحليل أثرها ← متابعة الأثر"],"a":2,"w":"تدقيق الحواجز فحص منظم يبدأ بتحديد النطاق، ثم رصد العوائق المادية والحسية والرقمية والمعرفية واللغوية والتقويمية، وتحليل أثرها، ثم اقتراح البدائل وتنفيذها، وينتهي بمتابعة أثر التغيير لأن الوصول عملية مستمرة.","n":["يبدأ بالحلول قبل فهم المشكلة ونطاقها.","يؤخر تحديد النطاق وتحليل الأثر إلى ما بعد التنفيذ.","صحيح: فهم المشكلة يسبق الحل، والمتابعة تختم الدورة.","ينفذ البدائل قبل رصد العوائق التي يُفترض أنها تعالجها."],"c":"تدقيق الحواجز (Barrier Audit)","p":"شخّص قبل أن تعالج: نطاق ← رصد ← تحليل ← حلول ← متابعة."},{"id":"6-21","s":6,"i":"6.3","l":"تحليل","t":"تُظهر سجلات غرفة المصادر أن ستة طلاب من صفوف مختلفة طلبوا خلال شهر واحد مساعدة فردية لتسليم واجباتهم على المنصة الإلكترونية، وتبيّن أن خطوات التسليم فيها طويلة ومتشعبة. ما التفسير الأدق لهذه البيانات؟","o":["حاجز متكرر في تصميم المنصة، فمعالجته في التصميم العام أولى من تكرار الحل الفردي","الطلاب الستة يحتاجون تقييمًا لاضطراب الانتباه يفسر عجزهم عن اتباع خطوات التسليم","المشكلة تدريبية بحتة، ويكفي تدريب الطلاب الستة على استخدام المنصة","البيانات غير مفيدة، لأن الطلاب من صفوف مختلفة ولا يجمعهم معلم واحد"],"a":0,"w":"تكرار الطلب نفسه من طلاب في صفوف مختلفة يستخدمون منصة واحدة يدل على حاجز في تصميم المنصة لا في الأفراد. والوصول الشامل يحوّل معرفة الحالات الفردية إلى تحسين التصميم العام، مع إبقاء الدعم الفردي لمن يحتاجه في أثناء ذلك.","n":["صحيح: حاجز نظامي متكرر يُعالج استباقيًا.","ينسب المشكلة إلى الطلاب مع أن نمط البيانات يشير إلى النظام.","التدريب لا يعالج تعقيد التصميم الذي سيواجه غيرهم أيضًا.","تنوع الصفوف يقوّي دلالة أن الحاجز في المنصة المشتركة."],"c":"ستة طلاب من صفوف مختلفة … خطوات طويلة","p":"حاجز يتكرر عند كثيرين ← عالجه في التصميم العام لا بحلول فردية متكررة."},{"id":"6-22","s":6,"i":"6.4","l":"معرفة","t":"أي العبارات الآتية تعبّر بدقة عن مفهوم التقنية المساعدة (Assistive Technology)؟","o":["الأجهزة الإلكترونية المتقدمة التي توفرها المدرسة لطلاب التربية الخاصة دون غيرهم من الطلاب","كل تقنية تعليمية يستخدمها المعلم في الفصل لتحسين تعلم جميع الطلاب دون استثناء","أي أداة أو جهاز أو نظام يزيد القدرات الوظيفية للطالب أو يحافظ عليها أو يحسّنها","البرمجيات التي تخفض مستوى المحتوى الدراسي ليتناسب مع قدرات الطالب المحدودة"],"a":2,"w":"التقنية المساعدة أي أداة أو قطعة معدات أو نظام يُستخدم لزيادة القدرات الوظيفية للطالب ذي الإعاقة أو المحافظة عليها أو تحسينها. وقيمتها في إزالة عائق حقيقي، فقد تكون بسيطة جدًا كنافذة القراءة، أو متقدمة كقارئ الشاشة.","n":["قد تكون التقنية المساعدة بسيطة غير إلكترونية، كماسك القلم ونافذة القراءة.","هذه تقنية تعليمية عامة، ولا تصبح مساعدة إلا حين تُوظَّف لعائق فردي محدد.","صحيح: المعيار تحسين الأداء الوظيفي لا نوع الأداة.","خفض المحتوى تعديل، والتقنية المساعدة تمكين وظيفي."],"c":"مفهوم التقنية المساعدة","p":"التقنية المساعدة تُعرَّف بوظيفتها للفرد، لا بسعرها أو حداثتها أو كونها إلكترونية."},{"id":"6-23","s":6,"i":"6.4","l":"تطبيق","t":"اجتمع فريق الخطة الفردية لاختيار تقنية مساعدة للطالب سعود الذي يتعثر في الكتابة. أي سير عمل للفريق يتسق مع إطار SETT؟","o":["اختيار أداة مناسبة لصعوبات الكتابة عمومًا، ثم تدريب سعود ومعلميه على استخدامها","دراسة خصائص سعود وبيئات الكتابة ومهامها، ثم اقتراح الأدوات وتجريبها","تطبيق اختبار SETT المقنن لتحديد درجة سعود ومستوى التقنية المطابق لهذه الدرجة","مراجعة الأجهزة المتوفرة في المدرسة، ثم اختيار أنسبها لاحتياجات سعود الكتابية"],"a":1,"w":"إطار SETT الذي طورته جوي زبالا إطار تعاوني لاتخاذ القرار، يبني فيه الفريق فهمًا مشتركًا للطالب (Student) والبيئات (Environments) والمهام (Tasks)، ثم ينتقل إلى الأدوات (Tools) التي قد تشمل أجهزة واستراتيجيات وخدمات.","n":["يبدأ بالأداة ويختارها من الفئة قبل فهم الطالب والبيئة والمهام.","صحيح: الطالب والبيئات والمهام قبل الأدوات.","SETT إطار تعاوني لتنظيم القرار وليس اختبارًا مقننًا.","التوفر لا يثبت الملاءمة، والأدوات تأتي آخرًا في SETT."],"c":"يتسق مع إطار SETT","p":"في SETT تأتي الأدوات آخرًا: Student ← Environments ← Tasks ← Tools."},{"id":"6-24","s":6,"i":"6.4","l":"تطبيق","t":"يرى معلم أن الطالبة شهد «تحتاج إلى جهاز لوحي لأنها من ذوات صعوبات التعلم»، دون أن يحدد ما الذي تعجز عن أدائه تحديدًا. ما الخطوة الأولى الأنسب؟","o":["توفير أحدث جهاز لوحي متاح، ثم تدريبها على تطبيقاته المختلفة","تحديد المهام التي تتعثر فيها شهد وطبيعة العائق الوظيفي في كل منها","تجربة الجهاز اللوحي المتوفر في المدرسة أسبوعًا كاملًا ثم الحكم على فائدته","اعتماد الجهاز في خطتها لأن صعوبات التعلم تستلزم تقنية رقمية"],"a":1,"w":"قرار التقنية المساعدة يبدأ بالعائق والمهمة لا باسم الجهاز أو التشخيص؛ فقد يكون عائق شهد في القراءة أو الكتابة أو التنظيم، ولكل منها حل مختلف. لذلك يُحدد أولًا ما لا تستطيع أداءه بالدقة أو السرعة أو الاستقلال المطلوب.","n":["يبدأ بالأداة ويجعل الحداثة معيارًا بدل الملاءمة.","صحيح: العائق والمهمة قبل الجهاز.","التجربة تأتي بعد تحديد العائق، والتوفر ليس دليل ملاءمة.","التشخيص وحده لا يحدد الأداة، ولا أداة واحدة تناسب الجميع."],"c":"دون أن يحدد ما الذي تعجز عنه","p":"ابدأ بالعائق لا بالجهاز: ما المهمة التي لا يستطيع الطالب أداءها بكفاءة؟"},{"id":"6-25","s":6,"i":"6.4","l":"تطبيق","t":"توقف الطالب راكان عن استخدام جهاز تكبير كبير الحجم في الفصل رغم فاعليته الفنية الثابتة، وأخبر معلمه أن زملاءه يعلّقون عليه ساخرين. ما الإجراء الأنسب؟","o":["إلزامه باستخدام الجهاز في كل الحصص ما دامت فاعليته الفنية ثابتة ومجرّبة","سحب الجهاز وتوثيق أن راكان رفض التقنية المساعدة المقدمة له","البحث مع راكان عن بديل يؤدي الوظيفة نفسها بقبول اجتماعي أكبر","قصر استخدام الجهاز على غرفة المصادر بعيدًا عن أنظار زملائه"],"a":2,"w":"الأداة التي لا تُستخدم لا تحقق فائدتها مهما كانت فعالة فنيًا. والوصمة الاجتماعية سبب شائع لترك التقنية، لذا يُشرك الطالب في البحث عن بديل يحقق الوظيفة نفسها بقبول اجتماعي أعلى، بدل لومه أو إلزامه.","n":["يتجاهل أن القبول شرط للاستخدام الفعلي.","يلوم الطالب ويترك العائق دون حل.","صحيح: يوازن بين الوظيفة والقبول بإشراك الطالب.","يحرمه من الوصول في الفصل حيث يحتاج إلى الأداة."],"c":"رغم فاعليته الفنية … زملاؤه يعلّقون ساخرين","p":"إذا ترك الطالب الأداة فلا تتهمه بالرفض؛ افحص القبول والتدريب والملاءمة والبيئة."},{"id":"6-26","s":6,"i":"6.4","l":"تحليل","t":"جرّب الفريق برنامج تحويل الكلام إلى نص مع الطالبة سارة في كتابة التقارير، فارتفع عدد الكلمات التي تنتجها من 40 إلى 120 كلمة، لكن تنظيم الجمل ودقتها انخفضا، ولا تستطيع مراجعة النص وتصحيحه بمفردها. ما الاستنتاج الأدق؟","o":["الأداة ناجحة ويُعتمد استخدامها، لأن الإنتاج الكتابي لسارة تضاعف ثلاث مرات","الأداة فاشلة ويجب إيقافها فورًا، والعودة بسارة إلى الكتابة اليدوية","المشكلة في سارة لا في الأداة، فهي تحتاج تقييمًا لاضطراب الانتباه","الحكم بعدة مؤشرات وظيفية، وتحديد التدريب أو الدعم اللازم لمراجعة النص"],"a":3,"w":"الحكم على فاعلية التقنية المساعدة يقوم على أكثر من مؤشر وظيفي: الدقة والسرعة والاستقلال وجودة المنتج وقبول الطالب. وقد حسّنت الأداة الكمية لكنها لم تحقق المهمة كاملة، فيحدد الفريق التدريب أو الدعم اللازم للمراجعة قبل قرار الاعتماد أو الاستبدال.","n":["يعتمد مؤشرًا واحدًا ويتجاهل تدهور الدقة والاستقلال.","يحكم قبل فحص ما يمكن أن يعالجه التدريب أو الدعم.","ينقل المشكلة إلى الطالبة دون دليل، والبيانات تخص ملاءمة الأداة.","صحيح: الفاعلية دقة وسرعة واستقلال في المهمة كاملة."],"c":"ارتفع عدد الكلمات … لكن الدقة انخفضت","p":"لا تحكم على الأداة بمؤشر واحد؛ قارن الدقة والسرعة والاستقلال في المهمة كاملة."},{"id":"6-27","s":6,"i":"6.4","l":"تحليل","t":"قال أحد أعضاء فريق التقنية المساعدة: «القاعدة العلمية أن نبدأ دائمًا بالتقنية المنخفضة، وأن نجرّب كل أداة أسبوعين بالضبط». ما التقييم الأدق لهذه العبارة؟","o":["دقيقة؛ فالتدرج من البسيط إلى المعقد بمدة موحدة يضمن عدالة المقارنة بين الأدوات","دقيقة في شقها الأول فقط؛ فالبدء بالتقنية المنخفضة ملزم، أما مدة التجربة فمرنة","غير دقيقة؛ فالمعيار أقل حل فعّال، ومدة التجربة تحددها المهمة وكفاية البيانات","دقيقة في شقها الثاني فقط؛ فمدة الأسبوعين ملزمة، أما مستوى التقنية فمرن"],"a":2,"w":"لا توجد قاعدة علمية مطلقة تفرض البدء بالتقنية المنخفضة؛ فالأفضل أقل حل تعقيدًا يحقق الحاجة بفاعلية، وقد تكون التقنية العالية الأنسب من البداية. ولا توجد مدة تجربة موحدة، بل تُحدد وفق المهمة وتكرار الاستخدام والتدريب وكمية البيانات اللازمة لقرار موثوق.","n":["لا قاعدة مطلقة للبدء بالتقنية المنخفضة، ولا مدة تجربة موحدة.","قد تكون التقنية العالية هي الأنسب من البداية إذا اقتضاها العائق.","صحيح: لا قاعدة مطلقة؛ الملاءمة والبيانات هما المعيار.","لا توجد مدة تجربة ثابتة عالميًا."],"c":"«دائمًا» … «أسبوعين بالضبط»","p":"احذر القواعد المطلقة في التقنية المساعدة؛ المعيار الملاءمة الوظيفية والبيانات."},{"id":"6-28","s":6,"i":"6.4","l":"تطبيق","t":"قرر فريق الخطة الفردية أن الطالب عمر يحتاج إلى برنامج لقراءة النصوص في مواد المحتوى، فثُبّت البرنامج على جهازه. وبعد شهر تبيّن أنه لا يستخدمه، لأن أحدًا لم يدرّبه هو ولا معلميه على تشغيله. ما الإجراء الأنسب؟","o":["سحب البرنامج منه، لأن عدم استخدامه دليل كافٍ على أن عمر لا يحتاج إليه","استبدال البرنامج بآخر أحدث منه يتمتع بمزايا وخصائص أكثر","إلزام عمر باستخدامه، وتسجيل امتناعه في سجل المتابعة السلوكية","تدريب عمر ومعلميه وأسرته على البرنامج ثم متابعة استخدامه وفاعليته"],"a":3,"w":"خدمات التقنية المساعدة لا تقتصر على توفير الجهاز، بل تشمل التقييم الوظيفي، والحصول على الأداة وتكييفها، والتنسيق، وتدريب الطالب وأسرته والمهنيين العاملين معه، ثم متابعة الفاعلية. وقبل الحكم على الأداة يُتحقق من التدريب والملاءمة.","n":["الحكم دون تدريب ظلم للأداة والطالب؛ فالتدريب جزء من الخدمة.","الحداثة ليست معيارًا، والمشكلة غياب التدريب لا البرنامج.","يحوّل مشكلة خدمة ناقصة إلى مشكلة سلوكية.","صحيح: التدريب والمتابعة من خدمات التقنية المساعدة."],"c":"لم يدرّبه أحد هو ولا معلميه","p":"توفير الجهاز ليس نهاية القرار: تدريب + متابعة + مراجعة."},{"id":"6-29","s":6,"i":"6.5","l":"معرفة","t":"أي العبارات الآتية تصف نظام الدعم المتعدد المستويات (MTSS) بدقة؟","o":["إطار مدرسي لجميع الطلاب يدمج التقييم والتدخل في مستويات متدرجة الشدة","برنامج علاجي خاص بطلاب صعوبات التعلم يسبق تحويلهم إلى غرفة المصادر","اسم حديث للاستجابة للتدخل (RTI) يقتصر على الجانب الأكاديمي وحده","نظام يصنّف الطلاب في ثلاث فئات ثابتة وفق نتائج الفحص الذي يُجرى في بداية العام"],"a":0,"w":"MTSS إطار مدرسي شامل يدمج التقييم والتدريس والتدخلات الأكاديمية والسلوكية والاجتماعية الوجدانية في مستويات متدرجة الشدة، ويعتمد على الفحص وقياس التقدم واتخاذ القرار المبني على البيانات لتحسين نتائج جميع الطلاب.","n":["صحيح: نظام شامل قائم على البيانات وتدرج الشدة.","MTSS نظام لجميع الطلاب لا برنامج لفئة واحدة.","MTSS مظلة أشمل قد تضم RTI الأكاديمي وPBIS السلوكي.","المستويات درجات شدة دعم متغيرة لا تصنيفات ثابتة."],"c":"نظام الدعم المتعدد المستويات (MTSS)","p":"MTSS مظلة مدرسية لجميع الطلاب، والمستويات شدة دعم لا هوية طالب."},{"id":"6-30","s":6,"i":"6.5","l":"معرفة","t":"يريد فريق المدرسة معرفة ما إذا كانت الطالبة دانة تتحسن في أثناء تدخل القراءة الذي تتلقاه، وبأي معدل. أي أنواع البيانات يجيب عن هذا السؤال مباشرة؟","o":["الفحص الشامل (Universal Screening)","قياس التقدم (Progress Monitoring)","التقييم التشخيصي المتعمق","قياس سلامة التنفيذ (Fidelity)"],"a":1,"w":"قياس التقدم جمع متكرر ومنظم لبيانات الأداء بمقاييس حساسة للنمو، يبيّن مستوى الطالب ومعدل تحسنه واستجابته للتدخل، فيوجّه قرار الاستمرار أو التعديل أو التكثيف.","n":["الفحص الشامل يكشف من قد يكون معرضًا للخطر بين جميع الطلاب.","صحيح: يقيس المستوى ومعدل النمو والاستجابة.","التشخيصي يحدد المهارة الدقيقة أو نمط الخطأ لا معدل النمو.","سلامة التنفيذ تبيّن هل نُفذ التدخل كما خُطط، لا مدى تحسن الطالبة."],"c":"تتحسن في أثناء التدخل، وبأي معدل","p":"فحص = خطر، تشخيص = طبيعة الحاجة، تقدم = استجابة ومعدل نمو، سلامة تنفيذ = صلاحية التفسير."},{"id":"6-31","s":6,"i":"6.5","l":"تحليل","t":"أظهر فحص منتصف العام أن 14 طالبًا من أصل 25 في أحد فصول الصف الثاني لم يبلغوا المستوى المتوقع في الطلاقة القرائية، بينما نتائج بقية فصول الصف الثاني في المدرسة جيدة. ما الإجراء الأنسب أولًا؟","o":["إحالة الطلاب الأربعة عشر إلى التقييم لتحديد أهليتهم لخدمات صعوبات التعلم","نقل الطلاب الأربعة عشر جميعًا إلى المستوى الثالث لتكثيف الدعم لهم","فحص جودة التعليم الأساسي وتنفيذه في هذا الفصل قبل تقديم تدخلات فردية","إعادة الفحص بالأداة نفسها بعد أسبوع للتأكد من صحة الدرجات"],"a":2,"w":"حين يتعثر عدد كبير من طلاب فصل واحد بينما تنجح الفصول المماثلة، يكون الاحتمال الأقوى خللًا في جودة التعليم الأساسي أو تنفيذه في ذلك الفصل. لذا يُفحص المستوى الأول أولًا قبل تفسير المشكلة بوصفها حالات فردية.","n":["يحوّل مشكلة نظامية محتملة إلى إحالات فردية.","يقفز إلى أعلى شدة دون فحص المستوى الأول أو بيانات أخرى.","صحيح: التعثر الواسع في سياق واحد يشير إلى المستوى الأول.","يؤجل القرار، والنمط المتركز في فصل واحد يستدعي فحص التعليم فيه."],"c":"14 من 25 … بقية الفصول جيدة","p":"تعثر واسع في فصل ← راجع المستوى الأول قبل الإحالات الفردية."},{"id":"6-32","s":6,"i":"6.5","l":"تطبيق","t":"لم تتحسن درجات الطالب بندر بعد ثمانية أسابيع من تدخل المستوى الثاني، وتبيّن من سجل الجلسات أنه حضر 9 جلسات فقط من أصل 24 جلسة مخططة، بسبب تعارض موعدها مع أنشطة أخرى. ما القرار الأنسب؟","o":["نقله إلى المستوى الثالث لأن عدم تحسنه يعني حاجته إلى دعم أكثف","إحالته إلى التقييم الشامل لأن عدم الاستجابة يثبت وجود صعوبة","إيقاف التدخل واستبداله ببرنامج آخر لأنه أثبت عدم فاعليته معه","معالجة انتظام الجلسات المخططة أولًا ثم الحكم على استجابته للتدخل"],"a":3,"w":"قبل القول إن الطالب لم يستجب، يجب التحقق من أنه تلقى التدخل بالجرعة والجودة المخططتين. وحضور بندر أقل من نصف الجلسات يجعل بيانات الاستجابة غير صالحة للتفسير، فيُصحح التنفيذ أولًا ثم يُعاد الحكم.","n":["يكثّف الدعم قبل التأكد من تلقيه الجرعة المخططة.","عدم الاستجابة ليس تشخيصًا، ولم يتلقَّ التدخل كما خُطط أصلًا.","لا يمكن الحكم على تدخل لم يُنفذ بالجرعة المخططة.","صحيح: سلامة التنفيذ قبل تفسير الاستجابة."],"c":"حضر 9 جلسات فقط من أصل 24","p":"لا تحكم بعدم الاستجابة قبل أن تسأل: هل تلقى الطالب التدخل كما خُطط؟"},{"id":"6-33","s":6,"i":"6.5","l":"تطبيق","t":"بلغ الطالب أحمد هدفه في تدخل المستوى الثاني للرياضيات، وحافظ على أدائه في خمسة قياسات متتالية للتقدم. ما القرار الأنسب؟","o":["إبقاء التدخل كما هو بقية العام حتى لا يتراجع أداؤه المكتسب","إيقاف كل متابعة لأدائه لأنه لم يعد من الطلاب المعرضين لخطر التعثر","خفض شدة الدعم تدريجيًا مع مواصلة مراقبة أدائه ضمن المستوى الأول","تسجيل أحمد في ملفه بوصفه طالب مستوى ثانٍ بصورة دائمة"],"a":2,"w":"الانتقال بين المستويات ديناميكي في الاتجاهين. فإذا أغلق الطالب الفجوة وثبت أداؤه، تُخفض شدة الدعم تدريجيًا مع استمرار المراقبة لضمان عدم الانتكاس، ولا يُبقى الدعم ثابتًا دون حاجة.","n":["يُبقي شدة دعم لم تعد البيانات تبررها.","الخفض يكون تدريجيًا مع استمرار المراقبة.","صحيح: الدعم مرن ينخفض بالبيانات مع المتابعة.","المستويات شدة دعم متغيرة لا تسمية دائمة."],"c":"بلغ هدفه وحافظ عليه في خمسة قياسات","p":"المستويات ليست اتجاهًا صاعدًا فقط؛ التحسن الثابت يعني خفض الدعم تدريجيًا مع المراقبة."},{"id":"6-34","s":6,"i":"6.5","l":"تحليل","t":"تُظهر بيانات قياس التقدم الأسبوعية للطالبة وعد في تدخل قراءة مستهدف، مُنفَّذ بسلامة عالية، أنها تتحسن، لكن خط اتجاه أدائها يشير إلى أنها لن تبلغ الهدف بنهاية المدة المحددة. ما القرار الأدق؟","o":["تعديل التدخل أو تكثيفه بناءً على معدل النمو مع متابعة أثر التغيير","الاستمرار دون تغيير، لأن أي تحسن في البيانات يعني أن التدخل يحقق المطلوب","خفض الهدف ليتوافق مع معدل نموها الحالي في القراءة","انتظار نهاية المدة لاتخاذ القرار بناءً على القياس الأخير"],"a":0,"w":"القرار في MTSS يُبنى على معدل النمو لا على مجرد وجود تحسن. وما دام التنفيذ سليمًا وخط الاتجاه لن يغلق الفجوة، فالأدق تعديل الاستراتيجية أو زيادة الجرعة أو تقليل حجم المجموعة مثلًا، ثم متابعة أثر التغيير.","n":["صحيح: معدل النمو غير الكافي يستدعي التعديل أو التكثيف.","الاتجاه الإيجابي وحده لا يكفي إن لم يُغلق الفجوة.","يخفض التوقعات بدل تعديل الدعم.","يهدر الوقت ويعتمد على نقطة واحدة بدل خط الاتجاه."],"c":"تتحسن لكنها لن تبلغ الهدف","p":"التحسن غير الكافي ≠ نجاح؛ قارن خط الاتجاه بالهدف ثم عدّل أو كثّف."},{"id":"6-35","s":6,"i":"6.5","l":"تحليل","t":"تشتبه أسرة الطالبة لجين وعدد من معلماتها اشتباهًا جادًا في وجود إعاقة لديها، فقالت منسقة نظام الدعم المتعدد المستويات: «لا يمكن طلب التقييم الشامل قبل أن تُكمل لجين المستويات الثلاثة كلها». ما التقييم الأدق لهذا الموقف؟","o":["صحيح؛ لأن عدم الاستجابة في المستوى الثالث هو الدليل الوحيد على الإعاقة","صحيح؛ لأن الوصول إلى المستوى الثالث يعني تلقائيًا أهلية التربية الخاصة","غير صحيح؛ فالأصح إلغاء المستويات وتقييم كل طالبة متعثرة تقييمًا شاملًا","غير صحيح؛ فنظام MTSS لا ينبغي أن يؤخر التقييم اللازم عند الاشتباه الجاد"],"a":3,"w":"MTSS لا يستبدل التقييم الشامل ولا يُستخدم لتعطيله. فعند وجود اشتباه جاد بإعاقة تُتبع إجراءات التقييم وفق الأنظمة المعمول بها، مع استمرار تقديم الدعم الذي تحتاجه الطالبة في أثناء ذلك.","n":["عدم الاستجابة معلومة ضمن بيانات أوسع، وليست الدليل الوحيد.","المستوى الثالث شدة دعم لا قرار أهلية.","يُفرّط في MTSS، والوقاية والتدخل المبكر يقللان الإحالات غير الضرورية.","صحيح: MTSS لا يُستخدم لتعطيل التقييم."],"c":"اشتباه جاد … قبل أن تُكمل المستويات كلها","p":"MTSS للوقاية والتدخل المبكر، لا لتأخير التقييم عند الاشتباه الجاد."},{"id":"6-36","s":6,"i":"6.6","l":"معرفة","t":"أي المهام الآتية «لا» تقع ضمن الدور المهني للمعلم المساعد في الفصل الدراسي؟","o":["تعديل أهداف الخطة الفردية للطالب حين يراها غير مناسبة","تطبيق التكييفات المخطط لها مع الطالب في أثناء النشاط الصفي","تسجيل ملاحظات موضوعية عن أداء الطالب ونقلها إلى المعلم","تقديم تلميحات متدرجة للطالب وفق الخطة المعتمدة من المعلم"],"a":0,"w":"المعلم المساعد عنصر تربوي مساند ينفذ الدعم المخطط ويطبق التكييفات ويجمع البيانات تحت إشراف المعلم المؤهل. أما التخطيط والتشخيص واعتماد الأهداف أو تعديلها فقرارات رسمية للمعلم والفريق، ودور المساعد فيها تقديم البيانات والاقتراح.","n":["صحيح: تعديل الأهداف قرار رسمي للمعلم والفريق.","هذه مهمة من صميم دوره التنفيذي تحت الإشراف.","جمع البيانات الموضوعية من مهامه الأساسية.","تقديم السقالات والتلميحات المخططة جزء من دوره."],"c":"«لا» تقع ضمن الدور المهني","p":"تنفيذ ومساندة وملاحظة = مساعد، وتخطيط وتشخيص واعتماد وتعديل = معلم أو فريق."},{"id":"6-37","s":6,"i":"6.6","l":"تطبيق","t":"توقفت الطالبة غلا عن حل مسألة عند خطوة سبق أن أتقنتها في حصص سابقة. ما أول ما ينبغي أن تفعله المعلمة المساعدة؟","o":["منحها وقت انتظار للمحاولة، ثم أخف تلميح لازم عند الحاجة","حل الخطوة أمامها بسرعة حتى لا تتأخر عن زميلاتها في الحصة","تقديم نموذج كامل محلول لمسألة مماثلة قبل أن تحاول بنفسها","إبلاغ المعلمة بأن غلا لم تتقن الخطوة وتحتاج إلى إعادة تدريسها"],"a":0,"w":"مبدأ عمل المساعد أقل قدر لازم من المساعدة: يبدأ بوقت انتظار يتيح المحاولة المستقلة، ثم يقدم تلميحًا بسيطًا عند الحاجة، ولا ينتقل إلى دعم أكبر إلا إذا لم تنجح التلميحات الأخف.","n":["صحيح: أقل مساعدة لازمة بعد فرصة للمحاولة.","يؤدي المهمة عنها ويبني الاتكالية.","مساعدة أكبر من الحاجة لمهارة سبق إتقانها.","استنتاج متسرع؛ التعثر العابر لا يعني فقدان المهارة."],"c":"خطوة سبق أن أتقنتها","p":"انتظر ← لمّح بأخف تلميح ← زِد الدعم عند الحاجة فقط؛ لا تبدأ بالحل."},{"id":"6-38","s":6,"i":"6.6","l":"تطبيق","t":"استوقف والد الطالب ريان المعلمَ المساعد عند باب المدرسة، وطلب منه أن يشرح له تشخيص ابنه، وأن يوافق على حذف أحد أهداف خطته الفردية. ما التصرف الأنسب؟","o":["شرح التشخيص للوالد بحكم معرفته اليومية الدقيقة بريان","حذف الهدف مؤقتًا إلى أن يجتمع الفريق ويعتمد الحذف رسميًا","إحالة الطلب باحترام إلى معلم التربية الخاصة أو الفريق","الاعتذار عن الحديث دون إبلاغ أحد حفاظًا على السرية"],"a":2,"w":"تفسير التشخيص وتعديل أهداف الخطة الفردية معلومات وقرارات رسمية تتجاوز الدور التنفيذي للمعلم المساعد. والتصرف المهني أن يحيل الطلب إلى المعلم أو الفريق المختص وفق القنوات الرسمية، مع الحفاظ على علاقة إيجابية بالأسرة.","n":["تفسير التشخيص يتجاوز الدور التنفيذي للمساعد.","تغيير الخطة منفردًا خطأ ولو كان مؤقتًا.","صحيح: القرارات الرسمية تُحال إلى المعلم أو الفريق.","السرية لا تعني تجاهل الطلب؛ يُحال إلى القناة المختصة."],"c":"يشرح التشخيص ويوافق على حذف هدف","p":"طلبات التشخيص وتعديل الخطة تُحال إلى المعلم أو الفريق المختص."},{"id":"6-39","s":6,"i":"6.6","l":"تطبيق","t":"كتبت المعلمة المساعدة في سجل المتابعة اليومي: «كانت الطالبة مشاعل كسولة اليوم ولم تتعاون». ما أفضل إعادة صياغة لهذه الملاحظة؟","o":["بدت غير راغبة في العمل اليوم بسبب ضعف دافعيتها المعتاد في حصص الرياضيات","كانت أقل تعاونًا من أمس، وتحتاج إلى قدر أكبر من الحزم معها في الحصص القادمة","بدأت المهمة بعد 6 دقائق، وأكملت مسألتين من ثماني بعد تلميحين لفظيين","يبدو أنها تعاني اضطرابًا في الانتباه يجعلها كسولة في أغلب الحصص"],"a":2,"w":"دور المساعد جمع بيانات موضوعية قابلة للقياس يستخدمها المعلم في القرار، كزمن البدء وعدد المسائل المكتملة ونوع التلميح المقدم، بدل الأحكام الشخصية مثل «كسولة» أو التفسيرات التشخيصية.","n":["تفسير ذاتي لا يصف سلوكًا قابلًا للقياس.","مقارنة انطباعية وتوصية خارج دور المساعد.","صحيح: وصف قابل للملاحظة والقياس.","تشخيص منفرد يتجاوز دور المساعد."],"c":"«كسولة اليوم ولم تتعاون»","p":"سجّل ما يُرى ويُعد (زمن، عدد، نوع تلميح)، لا الصفات والأحكام."},{"id":"6-40","s":6,"i":"6.6","l":"تحليل","t":"تُظهر بيانات أسبوعين أن الطالب عبدالعزيز ينجز 90% من مهامه حين تجلس المعلمة المساعدة ملاصقة له، و30% حين تبتعد عنه، وأنه نادرًا ما يتفاعل مع زملائه في الأنشطة الجماعية. ما التفسير الأدق؟","o":["يحتاج إلى بقاء المساعدة بجواره طوال اليوم لأن أداءه معها مرتفع","الدعم صنع اعتمادًا على المساعدة، فيلزم خفض القرب والتلميح تدريجيًا","يحتاج إلى نقله إلى غرفة المصادر لأن أداءه في الفصل دون مساعدة منخفض","المهام أعلى من قدراته، ويجب تعديل أهدافه بما يناسب أداءه المستقل"],"a":1,"w":"الفارق الكبير بين أدائه مع القرب الملاصق ودونه، مع ضعف تفاعله مع أقرانه، يدل على أن الدعم تحول إلى اعتماد. ونجاح المساعد يُقاس بانتقال الطالب نحو الاستقلال، لذا يُخطط لخفض القرب والتلميح تدريجيًا مع دعم غير ملفت داخل الأنشطة المشتركة.","n":["يكرّس الاتكالية ويعزل الطالب عن أقرانه.","صحيح: القرب المستمر صنع اتكالية وأعاق تفاعل الأقران.","يعالج الاعتماد بالعزل لا بسحب الدعم المخطط.","أداؤه المرتفع مع الدعم يدل على إمكان التعلم لا على عدم مناسبة الهدف."],"c":"90% ملاصقة له و30% حين تبتعد","p":"القرب المستمر قد يصنع اتكالية؛ اخفض القرب والتلميح تدريجيًا وراقب البيانات."},{"id":"6-41","s":6,"i":"6.6","l":"تطبيق","t":"لاحظت المعلمة المساعدة على مدى أسبوع أن البطاقة البصرية المقررة في خطة الطالبة هتون لا تساعدها على بدء المهام. ما التصرف الأنسب؟","o":["استبدال البطاقة بتلميح لفظي تراه أنسب دون الرجوع إلى المعلمة","إيقاف استخدام البطاقة نهائيًا لأنها أثبتت عدم جدواها مع هتون","الاستمرار في البطاقة دون إبلاغ أحد لأن تعديل الخطة ليس من دورها","توثيق المواقف ونتائجها ورفعها إلى المعلمة لتقرر مراجعة التكييف"],"a":3,"w":"حين يبدو التكييف غير فعال، يوثق المساعد ما يحدث بملاحظات موضوعية ويرفعها إلى المعلمة المشرفة، لأن تعديل الخطة مسؤولية المعلمة والفريق. وكتمان البيانات خطأ، كما أن التغيير المنفرد خطأ.","n":["تغيير الخطة من تلقاء المساعد خطأ.","إلغاء تكييف معتمد قرار ليس من صلاحياتها.","عدم التعديل لا يعني كتمان البيانات عن المعلمة.","صحيح: المساعد يوثق ويقترح، والمعلم يقرر."],"c":"البطاقة المقررة في خطتها لا تساعدها","p":"تكييف غير فعال؟ وثّق وارفع إلى المعلم؛ لا تغيّر منفردًا ولا تكتم."},{"id":"6-42","s":6,"i":"6.6","l":"معرفة","t":"يرتبط دور المعلم المساعد بمفهوم منطقة التطور الوشيك (ZPD) لدى فيجوتسكي. ما المعيار الأدق لنجاح المساعد في ضوء هذا المفهوم؟","o":["كمية المهام التي ينجزها الطالب بمساعدته خلال اليوم الدراسي","مقدار تقدم الطالب نحو الأداء المستقل مع سحب الدعم تدريجيًا","سرعة إنجاز الطالب للمهام مقارنة بزملائه في الفصل نفسه","بقاء المساعد قريبًا من الطالب في الأنشطة جميعها دون انقطاع"],"a":1,"w":"يقدّم المساعد قدرًا مناسبًا من الدعم حين تكون المهمة أعلى قليلًا من قدرة الطالب المستقلة، ثم يقلله كلما اكتسب الطالب الكفاءة. لذلك يُقاس نجاحه بمدى انتقال الطالب نحو الأداء المستقل، لا بكمية ما ينجزه نيابة عنه.","n":["النجاح لا يُقاس بما يُنجز نيابة عن الطالب.","صحيح: الدعم مؤقت يُسحب كلما زادت الكفاءة.","السرعة ليست غاية الدعم في منطقة التطور الوشيك.","القرب الدائم يخالف مبدأ سحب الدعم تدريجيًا."],"c":"منطقة التطور الوشيك (ZPD)","p":"نجاح المساعد = طالب أكثر استقلالًا، لا مهام أكثر تُنجز بمساعدته."},{"id":"7-01","s":7,"i":"7.1","l":"معرفة","t":"كلما تذمّر الطالب فيصل في أثناء حل واجب الرياضيات المنزلي أعفته والدته من إكماله، فازداد تذمّره في الأسابيع التالية. أي المفاهيم الآتية يفسّر زيادة التذمر؟","o":["العقاب السلبي","التعزيز الإيجابي","الإطفاء","التعزيز السلبي"],"a":3,"w":"التعزيز بنوعيه يزيد احتمال السلوك، والسلبي منه إزالة مثير منفر بعد الاستجابة. فإعفاء فيصل من الواجب بعد التذمر أزال مطلبًا منفرًا، فازداد التذمر مستقبلًا؛ وهذا تعزيز سلبي لا عقاب.","n":["العقاب يخفض السلوك، والسلوك هنا ازداد.","لم يُضف مثير مرغوب، بل أُزيل مطلب منفر.","الإطفاء وقف للمعزز فينخفض السلوك، وهنا المعزز مستمر.","صحيح: إزالة مطلب منفر بعد السلوك زادت السلوك."],"c":"أعفته من إكماله فازداد تذمره","p":"إيجابي = إضافة، وسلبي = إزالة، والتعزيز بنوعيه يزيد السلوك."},{"id":"7-02","s":7,"i":"7.1","l":"معرفة","t":"تمنح المعلمة الطالب تركي نجمة كلما مضى ربع ساعة من الحصة دون أن يُصدر أصواتًا مزعجة، بغض النظر عن أي سلوك آخر يؤديه. أي إجراءات التعزيز التفاضلي يمثل ذلك؟","o":["تعزيز السلوك البديل (DRA)","تعزيز السلوك غير المتوافق (DRI)","تعزيز المعدل المنخفض (DRL)","تعزيز غياب السلوك (DRO)"],"a":3,"w":"في DRO يُقدَّم التعزيز إذا لم يظهر السلوك المستهدف خلال فترة محددة، دون اشتراط سلوك بعينه. وهذا ما تفعله المعلمة حين تعزز مرور ربع ساعة دون أصوات مزعجة.","n":["DRA يعزز سلوكًا بديلًا محددًا يحقق الوظيفة نفسها.","DRI يعزز سلوكًا محددًا يستحيل حدوثه مع السلوك المشكل.","DRL يعزز خفض معدل سلوك مقبول أصلًا لا غيابه.","صحيح: المعيار غياب السلوك خلال فترة محددة."],"c":"دون أصوات مزعجة … بغض النظر عن غيره","p":"DRA بديل وظيفي، وDRI نقيض، وDRO غياب خلال فترة، وDRL خفض معدل."},{"id":"7-03","s":7,"i":"7.1","l":"تحليل","t":"رصد المعلم خروج الطالب سلمان من مقعده 6 مرات في حصة مدتها 45 دقيقة، و4 مرات في نشاط مدته 15 دقيقة. أي الاستنتاجات الآتية أدق؟","o":["السلوك في الحصة الطويلة أكثر، لأن عدد مرات الخروج فيها أكبر","المعدل في النشاط القصير أعلى، فهو نحو ضعف معدله في الحصة الطويلة","السلوك متقارب في الموقفين، لأن الفرق بين العددين مرتان فقط","لا تمكن المقارنة إلا بقياس مدة كل خروج من المقعد بالدقائق"],"a":1,"w":"عند اختلاف مدة الملاحظة يُستخدم المعدل لا التكرار الخام: 6 ÷ 45 ≈ 0.13 مرة في الدقيقة، و4 ÷ 15 ≈ 0.27 مرة في الدقيقة. إذن معدل الخروج في النشاط القصير نحو ضعف معدله في الحصة الطويلة، مما يستدعي فحص طبيعة ذلك النشاط.","n":["التكرار الخام مضلل عند اختلاف مدة الملاحظة.","صحيح: نحو 0.27 مرة في الدقيقة مقابل نحو 0.13.","يقارن أعدادًا خامًا ويتجاهل اختلاف الزمن.","المعدل يعالج اختلاف الزمن دون حاجة إلى قياس المدة."],"c":"6 مرات في 45 دقيقة، و4 في 15","p":"اختلفت مدة الملاحظة؟ قارن بالمعدل (العدد ÷ الزمن) لا بالعدد الخام."},{"id":"7-04","s":7,"i":"7.1","l":"تطبيق","t":"وصف معلم سلوك الطالب ماجد في نموذج الإحالة بأنه «عدواني ومستفز». أي الصياغات الآتية تمثل تعريفًا إجرائيًا مناسبًا لهذا السلوك؟","o":["يدفع زملاءه بيديه أو يركل كراسيهم في أثناء الوقوف في الطابور","يُظهر ميولًا عدائية واضحة تجاه زملائه في أغلب المواقف المدرسية","يتعمد استفزاز الآخرين لأنه يشعر بالغيرة من نجاحهم الدراسي","سلوكه غير مقبول ويحتاج إلى حزم أكبر من جميع معلميه"],"a":0,"w":"التعريف الإجرائي يصف السلوك بأفعال مرئية قابلة للملاحظة والقياس، بحيث يتفق ملاحظان على حدوثه وعدّه. أما الصفات العامة والدوافع المفترضة والأحكام فلا تصلح أساسًا للقياس ولا للتدخل.","n":["صحيح: أفعال مرئية قابلة للعد في سياق محدد.","«ميول عدائية» صفة عامة لا تُلاحظ ولا تُعد.","يفترض دافعًا داخليًا بدل وصف الفعل.","حكم وتوصية لا تعريف للسلوك."],"c":"«عدواني ومستفز»","p":"عرّف السلوك بما يُرى ويُعد، لا بالصفات أو الدوافع المفترضة."},{"id":"7-05","s":7,"i":"7.1","l":"تحليل","t":"سجّلت المعلمة بيانات (ABC) للطالب عبدالله أسبوعين: في 11 حادثة من 13 مزّق ورقة العمل بعد تقديم مسائل القسمة الطويلة، وكانت النتيجة إخراجه من الحصة إلى غرفة هادئة يجلس فيها وحده حتى نهايتها. ما الفرضية الوظيفية الأرجح؟","o":["الحصول على انتباه المعلمة","الهروب من المهمة الصعبة","الحصول على شيء أو نشاط مرغوب","التعزيز التلقائي الحسي"],"a":1,"w":"نمط البيانات واضح: السابق مسائل قسمة صعبة، والنتيجة المتكررة الخروج من الحصة وإنهاء المطلب دون انتباه أو شيء مادي. لذا فالفرضية الأرجح أن الهروب يحافظ على السلوك، فيُبنى التدخل على تعديل المهمة وتعليم طلب المساعدة أو الاستراحة.","n":["يُترك وحده بعد السلوك، فلا انتباه يحافظ عليه.","صحيح: النتيجة المتكررة إنهاء المطلب الصعب.","لا شيء ماديًا ولا نشاطًا مرغوبًا يحصل عليه.","السلوك مرتبط بمطلب محدد ونتيجة بيئية، لا بأثر حسي ذاتي."],"c":"بعد مسائل القسمة … إخراجه وحده","p":"انظر إلى ما يتبع السلوك باتساق: إنهاء مطلب = هروب، وتفاعل = انتباه، وشيء = حصول."},{"id":"7-06","s":7,"i":"7.1","l":"تطبيق","t":"أكد التقييم الوظيفي أن الطالبة رهف تصرخ في الأنشطة الجماعية للحصول على انتباه معلمتها. أي الإجراءات الآتية يمثل تعزيزًا تفاضليًا للسلوك البديل (DRA) بدقة؟","o":["تعليمها رفع بطاقة «أحتاجك» وتلبيتها سريعًا مع تقليل الانتباه للصراخ","تعزيزها كلما مرت عشر دقائق دون صراخ بغض النظر عن أي سلوك آخر تؤديه","تعزيزها حين تتحدث همسًا مع مجموعتها لأن الهمس لا يجتمع مع الصراخ","تعزيزها إذا قلّ صراخها إلى مرتين في الحصة بدل خمس مرات"],"a":0,"w":"DRA يعزز سلوكًا بديلًا مناسبًا يحقق الوظيفة نفسها التي كان يحققها السلوك المشكل. وبما أن الوظيفة الانتباه، فإن رفع بطاقة «أحتاجك» والاستجابة لها سريعًا يمنح رهف طريقًا مقبولًا للانتباه، مع تقليل الانتباه الذي يتبع الصراخ.","n":["صحيح: بديل مقبول يحقق الوظيفة نفسها (الانتباه).","هذا DRO لأنه يعزز غياب السلوك.","هذا أقرب إلى DRI، ولا يعلّمها طريقة مقبولة لطلب الانتباه.","هذا DRL، والصراخ ليس سلوكًا مقبولًا يُكتفى بخفض معدله."],"c":"للحصول على انتباه معلمتها … (DRA)","p":"DRA = علّم بديلًا يحقق الوظيفة نفسها، وعززه بسرعة واتساق أكثر من السلوك المشكل."},{"id":"7-07","s":7,"i":"7.1","l":"تحليل","t":"يضرب الطالب يزن رأسه بالطاولة بقوة، وتشير البيانات إلى أن انتباه البالغين يحافظ على السلوك، فاقترح أحد المعلمين «تجاهله تمامًا حتى ينطفئ». ما التقييم الأدق لهذا المقترح؟","o":["مناسب؛ لأن الإطفاء هو الإجراء الأصح لكل سلوك يحافظ عليه الانتباه","غير مناسب؛ فالسلوك خطر ويتطلب خطة أمان متكاملة تعلّم بديلًا بإشراف مهني","مناسب؛ بشرط أن يلتزم جميع المعلمين بالتجاهل مهما اشتدت النوبة","غير مناسب؛ والأصح معاقبته فور كل ضربة حتى يتوقف عنها"],"a":1,"w":"الإطفاء وقف للمعزز المحافظ على السلوك، وقد تصاحبه زيادة مؤقتة في الشدة؛ لذا لا يُستخدم آليًا مع سلوك خطر كضرب الرأس. الأولوية للسلامة، ثم خطة متكاملة تعلّم طريقة مناسبة لطلب الانتباه وتعيد ترتيب النتائج تحت إشراف مهني.","n":["الإطفاء لا يُطبق آليًا، ولا مع السلوك الخطر.","صحيح: السلامة أولًا، ثم خطة وظيفية متكاملة.","الاتساق لا يبرر ترك سلوك مؤذٍ دون حماية.","العقاب لا يعلّم بديلًا ولا يعالج الوظيفة."],"c":"يضرب رأسه بقوة … «تجاهله تمامًا»","p":"سلوك خطر؟ السلامة وخطة متكاملة قبل أي إطفاء أو تجاهل."},{"id":"7-08","s":7,"i":"7.1","l":"معرفة","t":"أي العبارات الآتية تعبّر بدقة عن دعم السلوك الإيجابي (PBS)؟","o":["برنامج حوافز يمنح الطلاب جوائز مادية مقابل الهدوء والطاعة داخل الفصل الدراسي","إطار وقائي قائم على وظيفة السلوك والبيانات يعدّل البيئة ويعلّم البدائل","منهج يرفض أي نتائج تتبع السلوك، ويكتفي بالنصح والتوجيه اللفظي للطالب","أسلوب يركز على معاقبة السلوك المشكل فور وقوعه لمنع تكراره مستقبلًا"],"a":1,"w":"يقوم دعم السلوك الإيجابي على الانتقال من الاستجابة العقابية المتأخرة إلى الوقاية المسبقة، وفهم العلاقة الوظيفية بين البيئة والسلوك، وتعليم مهارات بديلة تحقق الغاية نفسها، مستفيدًا من مبادئ تحليل السلوك التطبيقي ضمن إطار يحترم كرامة الطالب.","n":["يختزل PBS في المكافآت، ويستهدف الامتثال لا المهارات.","صحيح: وقاية ووظيفة وبيانات وتعليم بديل.","PBS يرتب النتائج لصالح البديل ولا يرفضها.","هذا نهج عقابي لاحق، وPBS وقائي استباقي."],"c":"دعم السلوك الإيجابي (PBS)","p":"PBS = وقاية + وظيفة + تعليم بديل + بيانات، لا مكافآت ولا عقوبات فقط."},{"id":"7-09","s":7,"i":"7.1","l":"معرفة","t":"يستند دعم السلوك الإيجابي إلى عدة أسس نظرية. أي هذه الأسس يفسّر زيادة احتمال السلوك أو نقصانه بالنتائج التي تتبعه؟","o":["التعلم بالملاحظة والنمذجة","المنظور البيئي السلوكي","الإشراط الإجرائي","الإشراط الكلاسيكي (الاستجابي)"],"a":2,"w":"الإشراط الإجرائي يركز على أثر النتائج في زيادة السلوك أو خفضه، وعليه تقوم إجراءات التعزيز والإطفاء والتعزيز التفاضلي. ويكمله التعلم بالملاحظة في تعليم أنماط جديدة، والمنظور البيئي في تعديل الظروف قبل اللجوء إلى الإجراءات اللاحقة.","n":["يفسر اكتساب السلوك بمشاهدة النموذج.","يركز على السياق والظروف التي يحدث فيها السلوك.","صحيح: النتائج تحدد احتمال تكرار السلوك.","يفسر الاستجابات بالاقتران بين المثيرات السابقة لا بالنتائج."],"c":"بالنتائج التي تتبعه","p":"النتائج تغيّر احتمال السلوك ← إشراط إجرائي، والمشاهدة ← تعلم بالملاحظة."},{"id":"7-10","s":7,"i":"7.2","l":"معرفة","t":"تتدرب الطالبة مشاعل على حساب ثمن مشترياتها من المقصف والباقي من النقود، وقراءة الساعة لمعرفة الوقت المتبقي من الفسحة. إلى أي مجالات السلوك التكيفي تنتمي هذه المهارات أساسًا؟","o":["المجال المفاهيمي","المجال الاجتماعي","المجال العملي","مجال الوظائف التنفيذية"],"a":0,"w":"يتضمن السلوك التكيفي ثلاثة مجالات: المفاهيمي (اللغة والقراءة والكتابة والمفاهيم العددية والوقت والمال والتوجيه الذاتي)، والاجتماعي، والعملي. وحساب النقود وقراءة الوقت لتلبية متطلبات الحياة اليومية مهارات مفاهيمية.","n":["صحيح: النقود والوقت مفاهيم وظيفية في الحياة اليومية.","الاجتماعي يخص العلاقات والقواعد الاجتماعية والحذر.","العملي يخص العناية بالذات والسلامة والروتين وتنظيم الحياة اليومية.","الوظائف التنفيذية ليست أحد مجالات السلوك التكيفي الثلاثة."],"c":"حساب الثمن والباقي وقراءة الساعة","p":"مال ووقت وقراءة وظيفية ← مفاهيمي، وعلاقات وقواعد ← اجتماعي، وعناية بالذات وروتين ← عملي."},{"id":"7-11","s":7,"i":"7.2","l":"معرفة","t":"أي العبارات الآتية تميّز بدقة بين السلوك السوي والسلوك التكيفي؟","o":["السوي والتكيفي مترادفان، وكلاهما يعني خلو الطالب من أي سلوك مزعج في المدرسة","السوي يخص المهارات العملية، والتكيفي يخص الالتزام بالقواعد الاجتماعية فقط","السوي يُقاس بالمقاييس المقننة، والتكيفي يُحكم عليه بملاحظة المعلم وحدها","السوي يُحكم عليه بملاءمته للعمر والسياق، والتكيفي بكفايات الأداء اليومي"],"a":3,"w":"السلوك السوي استجابات تتناسب في طبيعتها وشدتها وتكرارها مع العمر والسياق الثقافي والاجتماعي، بينما السلوك التكيفي مجموعة المهارات المفاهيمية والاجتماعية والعملية التي يستخدمها الفرد في حياته اليومية لتحقيق الاستقلال والتوافق.","n":["متداخلان لكنهما ليسا مترادفين.","يخلط المفهومين، والتكيفي يشمل المفاهيمي والاجتماعي والعملي.","التكيفي يُقدَّر بأدوات ومصادر متعددة لا بملاحظة واحدة.","صحيح: السوي ملاءمة معيارية، والتكيفي استقلال يومي."],"c":"تميّز بين السوي والتكيفي","p":"السوي ← مناسب للعمر والسياق، والتكيفي ← كفايات الحياة اليومية، وغير التكيفي ← يعيق."},{"id":"7-12","s":7,"i":"7.2","l":"تطبيق","t":"انفعلت الطالبة وعد مرة واحدة وصرخت في وجه زميلتها بعد أن مزّقت الزميلة دفترها، فكتبت المعلمة في سجلها: «سلوك غير تكيفي ونمط عدواني». ما الإجراء الأنسب؟","o":["إحالة وعد مباشرة إلى تقييم اضطراب سلوكي وانفعالي لديها","اعتماد الوصف في السجل لأن شدة الموقف تكفي وحدها للحكم","معاقبة وعد أمام زميلاتها حتى لا يتكرر سلوكها العدواني","جمع بيانات من مواقف ومصادر متعددة قبل الحكم بوجود نمط"],"a":3,"w":"الحكم بأن السلوك غير تكيفي يقتضي مراعاة التكرار والشدة والاستمرارية والأثر المعيق، وجمع معلومات من أكثر من موقف ومصدر. والانفعال العابر في موقف مستفز لا يكفي لوصم الطالبة بنمط عدواني.","n":["لا يُشخَّص اضطراب من موقف واحد.","الانفعال العابر لا يكفي للحكم على نمط مستمر.","عقاب علني دون فهم للسياق، ويزيد الوصم.","صحيح: الحكم على النمط يحتاج تكرارًا وبيانات متعددة."],"c":"مرة واحدة … بعد أن مزّقت دفترها","p":"موقف واحد ≠ نمط؛ لا حكم ولا تشخيص قبل بيانات متعددة المواقف والمصادر."},{"id":"7-13","s":7,"i":"7.2","l":"تحليل","t":"تبيّن من ملف الطالب بندر (11 سنة) أن لديه صعوبة شديدة في القراءة والكتابة، بينما هو مستقل في العناية بنفسه، ويرتب أدواته، ويتعامل مع النقود، وعلاقاته بأقرانه جيدة. ما الاستنتاج الأدق؟","o":["القصور القرائي الشديد يكفي للاشتباه بالإعاقة الفكرية وطلب تقييمها","استقلاله في الحياة اليومية ينفي حاجته إلى تدخل أكاديمي متخصص","القصور أكاديمي محدد، ولا دليل على عجز تكيفي شامل يرجّح الإعاقة الفكرية","الصعوبة الأكاديمية الشديدة تعني حتمًا قصورًا في المجال المفاهيمي"],"a":2,"w":"يُشترط في الإعاقة الفكرية قصور في الأداء العقلي وقصور في السلوك التكيفي خلال فترة النمو، أما صعوبات التعلم فلا يُشترط فيها عجز تكيفي شامل. واستقلال بندر في العناية بالذات والنقود والعلاقات يدل على أن قصوره أكاديمي محدد يحتاج تدخلًا متخصصًا في القراءة والكتابة.","n":["الإعاقة الفكرية تستلزم قصورًا تكيفيًا لا يظهر هنا.","الكفاءة التكيفية لا تلغي الحاجة الأكاديمية المحددة.","صحيح: صعوبات التعلم لا تستلزم عجزًا تكيفيًا شاملًا.","تعامله مع النقود دليل على كفاءة مفاهيمية وظيفية."],"c":"صعوبة قراءة شديدة … مستقل في حياته اليومية","p":"صعوبات تعلم + استقلال يومي جيد ← لا تفترض إعاقة فكرية."},{"id":"7-14","s":7,"i":"7.2","l":"تحليل","t":"تستطيع الطالبة شهد (12 سنة) أن تذكر خطوات ترتيب حقيبتها وتؤديها بدقة حين يُطلب منها، لكنها لا ترتبها في نهاية اليوم إلا إذا ذكّرتها المعلمة، بينما تفعل زميلاتها ذلك باستقلال. ما التحليل الأدق؟","o":["قصور مهارة يتطلب إعادة تعليم خطوات ترتيب الحقيبة من البداية","قصور أداء لا مهارة، فيُستهدف الأداء المستقل وتلاشي التذكير","سلوك غير تكيفي يستلزم تقييمًا وظيفيًا شاملًا قبل أي إجراء معها","سلوك سوي لا يحتاج إلى تدخل، لأن معظم الأطفال ينسون أحيانًا"],"a":1,"w":"التمييز بين قصور المهارة وقصور الأداء يوجّه التدخل. فشهد تعرف الخطوات وتؤديها بدقة عند الطلب، والمشكلة في أدائها المستقل في الموقف الطبيعي، فيُعالج ذلك بإشارات طبيعية وتلاشٍ منظم للتذكير وتعزيز الأداء المستقل، لا بإعادة تعليم المهارة.","n":["المهارة مكتسبة، وإعادة تعليمها لا تعالج المشكلة.","صحيح: تعرف وتستطيع، لكنها لا تؤدي باستقلال.","لا سلوك معيق هنا؛ المشكلة غياب الأداء المستقل.","زميلاتها يؤدينه باستقلال، واعتمادها اليومي على التذكير يحتاج تدخلًا."],"c":"تؤديها بدقة حين يُطلب … إلا إذا ذكّرتها","p":"يعرف ولا يؤدي ← قصور أداء (تلاشٍ وتعزيز)، ولا يعرف ← قصور مهارة (تعليم مباشر)."},{"id":"7-15","s":7,"i":"7.2","l":"تطبيق","t":"لا تعرف الطالبة لمى (ذات إعاقة فكرية بسيطة) خطوات استعارة كتاب من مكتبة المدرسة، وهي مهارة يؤديها أقرانها باستقلال. ما المدخل التدريسي الأنسب؟","o":["شرح الخطوات لها شفهيًا مرة واحدة، ثم ملاحظة أدائها في المكتبة بعد ذلك","تحليل المهارة إلى خطوات وتدريسها بالنمذجة ثم ممارستها في المكتبة","تكليف زميلة باستعارة الكتب نيابة عنها تجنبًا لإحراجها أمام الآخرين","تعزيزها إذا استعارت كتابًا بمفردها دون تقديم تعليم مسبق لها"],"a":1,"w":"حين تكون المهارة التكيفية غير مكتسبة، فالمدخل الأنسب التدريس المباشر: تحليل المهمة إلى خطوات، ثم النمذجة فالممارسة الموجهة فالمستقلة، مع التوجيه ثم التلاشي، والتدريب في البيئة الطبيعية لضمان التعميم.","n":["شرح واحد لا يكفي لبناء مهارة متعددة الخطوات.","صحيح: تحليل مهمة وتعليم مباشر وممارسة في البيئة الطبيعية.","يلغي فرصة التعلم ويزيد الاعتماد.","لا يُعزَّز سلوك لم يُكتسب بعد؛ المهارة تحتاج تعليمًا أولًا."],"c":"لا تعرف خطوات الاستعارة","p":"مهارة تكيفية مفقودة ← تحليل مهمة + نمذجة + ممارسة + تلاشٍ + تعميم."},{"id":"7-16","s":7,"i":"7.2","l":"تطبيق","t":"لا يستخدم الطالب نايف مغسلة الفصل باستقلال مع أنه يفعل ذلك في المنزل، وتبيّن أن المغسلة مرتفعة ولا يصل إلى صنبورها دون مساعدة. ما الإجراء الأنسب أولًا؟","o":["تعديل البيئة لتتيح له أداء المهارة قبل افتراض قصور تكيفي لديه","تسجيل قصور في المجال العملي من السلوك التكيفي في ملفه المدرسي","تدريبه على مهارة غسل اليدين من البداية باستخدام تحليل المهمة","تكليف مرافق بمساعدته في كل مرة يحتاج فيها إلى استخدام المغسلة"],"a":0,"w":"تقييم السلوك التكيفي يجب أن يراعي متطلبات البيئة وفرص الأداء. فنايف يؤدي المهارة في المنزل، وعدم أدائها في المدرسة سببه عائق مادي، فيُعدّل المكان أولًا ثم يُتابع استقلاله.","n":["صحيح: أزل العائق البيئي ثم قيّم الأداء.","العائق بيئي، والحكم بالقصور يتجاهل غياب فرصة الأداء.","المهارة مكتسبة كما يظهر من أدائه في المنزل.","يصنع اعتمادًا ويترك العائق البيئي قائمًا."],"c":"يفعل ذلك في المنزل … المغسلة مرتفعة","p":"قبل الحكم بقصور تكيفي اسأل: هل أتاحت البيئة فرصة الأداء؟"},{"id":"7-17","s":7,"i":"7.2","l":"تطبيق","t":"في تقييم السلوك التكيفي للطالب سعود، قدّرت أسرته مهاراته الاجتماعية بدرجة مرتفعة، وقدّرها معلمه بدرجة منخفضة. ما الإجراء الأنسب؟","o":["اعتماد تقدير المعلم لأنه أكثر موضوعية وخبرة من تقدير الأسرة في هذا المجال","اعتماد تقدير الأسرة لأنها تلاحظ سعود ساعات أطول بكثير من المعلم","تحليل اختلاف متطلبات البيئتين وفرص الأداء، وجمع أمثلة سلوكية محددة من الطرفين","حساب متوسط التقديرين واعتماده درجة نهائية لمهاراته الاجتماعية"],"a":2,"w":"اختلاف تقديرات المصادر قد يكون ذا معنى، إذ تختلف متطلبات المنزل والمدرسة وفرص الأداء فيهما. لذلك يُفسَّر الاختلاف بجمع أمثلة سلوكية محددة والملاحظة في أكثر من بيئة، ضمن تقييم متكامل لا يعتمد على مصدر واحد.","n":["يلغي مصدرًا مهمًا دون تفسير الاختلاف.","طول الملاحظة لا يلغي اختلاف السياق.","صحيح: الاختلاف معلومة سياقية تُفسَّر ولا تُلغى.","المتوسط يطمس دلالة الاختلاف بين البيئتين."],"c":"الأسرة: مرتفعة … المعلم: منخفضة","p":"اختلاف المصادر يُفسَّر بالسياق، ولا يُحسم باختيار أحدها أو بمتوسطهما."},{"id":"7-18","s":7,"i":"7.3","l":"معرفة","t":"أي المواقف الآتية يمثل إجراء تشكيل السلوك (Shaping)؟","o":["تعليم الطالب خطوات تجهيز الحقيبة خطوة بعد أخرى وربطها في تسلسل وظيفي","تقديم تلميح جسدي للطالب، ثم إيمائي، ثم سحب التلميح حتى يؤدي باستقلال","تعزيز الطالب إذا مضت عشر دقائق دون أن يقاطع زملاءه في أثناء النقاش","تعزيز الطالب كلما رفع صوته قليلًا حتى يبلغ المستوى المسموع المطلوب"],"a":3,"w":"التشكيل تعزيز تفاضلي لتقريبات متتابعة تقترب تدريجيًا من السلوك النهائي، وقد يبني شكلًا جديدًا للاستجابة أو مستوى جديدًا لأحد أبعادها كشدة الصوت أو مدته.","n":["ربط خطوات مهارة مركبة تسلسل لا تشكيل.","سحب المساعدة تدريجيًا تلاشٍ لا تشكيل.","تعزيز غياب السلوك خلال فترة DRO.","صحيح: تقريبات متتابعة نحو استجابة نهائية."],"c":"يمثل تشكيل السلوك","p":"اقتراب تدريجي لاستجابة واحدة ← تشكيل، وربط خطوات ← تسلسل، وسحب مساعدة ← تلاشٍ."},{"id":"7-19","s":7,"i":"7.3","l":"تطبيق","t":"تعلّم معلمة الطالب عمر (ذو إعاقة فكرية) ارتداء معطفه، وهو لا يستطيع بعدُ أداء أي خطوة بمفرده، وتريد أن يختبر منذ الجلسة الأولى إنهاء المهمة بنفسه والوصول مباشرة إلى نتيجتها الطبيعية. أي الإجراءات الآتية يحقق ذلك؟","o":["التسلسل الخلفي","التسلسل الأمامي","تشكيل السلوك","تلاشي التلقين"],"a":0,"w":"في التسلسل الخلفي تؤدي المعلمة الخطوات السابقة أو تساعد فيها، ويُدرَّب الطالب على الخطوة الأخيرة أولًا، فيصل مباشرة إلى النتيجة الطبيعية للمهمة في كل محاولة، ثم تُضاف الخطوات السابقة تدريجيًا.","n":["صحيح: الطالب يؤدي الخطوة الأخيرة أولًا ثم تُضاف ما قبلها.","يبدأ بالخطوة الأولى، فيتأخر وصول الطالب إلى نهاية المهمة.","التشكيل يبني استجابة واحدة بالتقريبات لا سلسلة خطوات.","التلاشي سحب للمساعدة ولا يحدد ترتيب تعليم الخطوات."],"c":"إنهاء المهمة بنفسه منذ الجلسة الأولى","p":"التسلسل الخلفي = الطالب يُنهي السلسلة أولًا فيصل مباشرة إلى المعزز الطبيعي."},{"id":"7-20","s":7,"i":"7.3","l":"تطبيق","t":"بعد أن سحبت المعلمة التلميح اللفظي دفعة واحدة في تدريب مهارة جديدة، ارتفعت أخطاء الطالبة جود من خطأ واحد إلى ستة أخطاء في الجلسة. ما الإجراء الأنسب؟","o":["الاستمرار دون تلميح، لأن الأخطاء جزء طبيعي من التعلم المستقل","إعادة التلميح اللفظي الكامل بصورة دائمة حتى نهاية العام الدراسي","العودة مؤقتًا إلى مستوى تلميح يضمن النجاح، ثم سحبه بخطوات أصغر","إيقاف تدريب المهارة واستبدالها بمهارة أخرى أسهل منها بكثير"],"a":2,"w":"التلقين دعم مؤقت يُسحب تدريجيًا، لكن السحب المفاجئ قد يرفع الأخطاء. والبيانات هنا تدل على أن التلاشي كان أسرع من المناسب، فيُعاد مؤقتًا مستوى التلميح الذي يضمن النجاح، ثم يُسحب بخطوات أصغر وفق البيانات.","n":["يترك الطالبة تكرر الأخطاء فيترسخ النمط الخاطئ.","يلغي هدف الاستقلال ويصنع اعتمادًا على التلقين.","صحيح: يعدّل سرعة التلاشي ويحافظ على هدف الاستقلال.","المشكلة في سرعة التلاشي لا في مناسبة المهارة."],"c":"سحبت التلميح دفعة واحدة … ارتفعت الأخطاء","p":"ارتفعت الأخطاء بعد التلاشي؟ ارجع خطوة وتلاشَ بخطوات أصغر، ولا تُلغِ الهدف."},{"id":"7-21","s":7,"i":"7.3","l":"تطبيق","t":"أتقن الطالب راكان طلب المساعدة بعبارة مناسبة، وما زال يحصل على ملصق مع كل طلب منذ ثلاثة أسابيع. ما الخطوة الأنسب الآن؟","o":["الاستمرار في التعزيز المستمر، لأنه الأنسب في جميع مراحل التعلم","إيقاف الملصقات فجأة، لأن السلوك أصبح متقنًا ولم يعد يحتاج إلى تعزيز","الانتقال تدريجيًا إلى تعزيز متقطع ونتائج طبيعية مع متابعة الثبات","زيادة قيمة الملصقات لضمان استمرار السلوك مدة أطول"],"a":2,"w":"التعزيز المستمر مفيد في الاكتساب الأولي، أما بعد ثبات السلوك فيُنتقل تدريجيًا إلى تعزيز متقطع ونتائج طبيعية، مما يدعم المحافظة ويزيد مقاومة الانطفاء، مع متابعة البيانات لضمان ثبات السلوك.","n":["التعزيز المستمر أنسب للاكتساب الأولي لا للمحافظة.","الإيقاف المفاجئ قد يُضعف سلوكًا لم يُبرمج للمحافظة.","صحيح: ترقيق تدريجي نحو المعززات الطبيعية.","يزيد الاعتماد على المعزز الاصطناعي بدل ترقيقه."],"c":"أتقن … ملصق مع كل طلب","p":"اكتساب ← تعزيز مستمر، ومحافظة ← ترقيق تدريجي وتعزيز متقطع ونتائج طبيعية."},{"id":"7-22","s":7,"i":"7.3","l":"تحليل","t":"أتقنت الطالبة ريم في غرفة المصادر مهارة طلب التوضيح، وما زالت تستخدمها هناك بعد شهرين من خفض التعزيز، لكنها لا تستخدمها في الفصل العام مع معلماتها الأخريات. ما التحليل الأدق؟","o":["تحققت المحافظة عبر الزمن، ولم يتحقق التعميم إلى بيئة وأشخاص جدد","تحقق التعميم إلى بيئة جديدة، ولم تتحقق المحافظة على المهارة عبر الزمن","لم تتحقق المحافظة ولا التعميم، ويجب إعادة تعليم المهارة من البداية","تحققت المحافظة والتعميم معًا، والمشكلة في دافعية ريم داخل الفصل"],"a":0,"w":"المحافظة استمرار السلوك عبر الزمن بعد خفض التدخل، والتعميم ظهوره مع أشخاص وبيئات ومواد جديدة. وريم مستمرة في غرفة المصادر بعد شهرين (محافظة)، لكنها لم تنقل المهارة إلى الفصل العام (لا تعميم)، فيُبرمج التعميم صراحة.","n":["صحيح: المحافظة استمرار زمني، والتعميم انتقال سياقي.","يعكس المفهومين: الاستمرار زمني، والانتقال سياقي.","المهارة مستمرة في بيئة التدريب، فالمحافظة متحققة.","عدم ظهور المهارة في الفصل هو غياب التعميم نفسه."],"c":"تستخدمها هناك … لا تستخدمها في الفصل","p":"استمرار عبر الزمن = محافظة، وظهور في ظروف جديدة = تعميم."},{"id":"7-23","s":7,"i":"7.3","l":"تطبيق","t":"تطرح الطالبة نورة أسئلة مناسبة عن الدرس، لكنها تسأل أكثر من 12 سؤالًا في الحصة مما يعطل الشرح، والمعلمة لا تريد منعها من السؤال. ما الإجراء الأنسب؟","o":["تجاهل أسئلتها جميعًا حتى تتوقف عن طرحها في الحصص القادمة (الإطفاء)","تعزيزها إذا لم تطرح أي سؤال طوال الحصة الدراسية (DRO)","تعزيزها إذا لم تتجاوز أسئلتها عددًا مناسبًا متفقًا عليه (DRL)","سحب نقطة منها عن كل سؤال تطرحه في الحصة (تكلفة الاستجابة)"],"a":2,"w":"DRL يعزز انخفاض معدل سلوك مقبول في أصله لكنه يحدث بكثرة، حتى يبلغ مستوى مناسبًا. والسؤال عن الدرس سلوك مرغوب، والمطلوب خفض تكراره لا إلغاؤه، لذا يُعزَّز بقاؤه ضمن حد متفق عليه.","n":["يستهدف إلغاء سلوك مقبول في أصله.","يعزز غياب سلوك نريد إبقاءه بمعدل مناسب.","صحيح: خفض المعدل لا إلغاء السلوك.","يعاقب كل سؤال ولو كان مناسبًا."],"c":"أسئلة مناسبة … لا تريد منعها","p":"سلوك مقبول لكنه كثير ← DRL: نقلل ولا نلغي."},{"id":"7-24","s":7,"i":"7.3","l":"معرفة","t":"يطبق معلم نظام نقاط معلنًا يكسب فيه الطلاب نقاطًا على السلوكيات المستهدفة، وينص النظام على أن يفقد الطالب نقطتين محددتين إذا استخدم ألفاظًا مسيئة. ما الإجراء الذي يمثله فقد النقطتين؟","o":["الاستبعاد المؤقت من التعزيز (Time-out)","التعزيز السلبي (Negative Reinforcement)","تكلفة الاستجابة (Response Cost)","الإطفاء (Extinction)"],"a":2,"w":"تكلفة الاستجابة فقدان مقدار محدد من معزز مكتسب بعد سلوك محدد ضمن نظام واضح ومعلن، وتحتاج إلى ضوابط تضمن تناسبها وعدم إهانة الطالب، مع بقاء تعزيز السلوك المناسب حاضرًا.","n":["الاستبعاد فقد مؤقت لفرصة الوصول إلى التعزيز لا خصم معزز مكتسب.","التعزيز السلبي يزيد السلوك بإزالة مثير منفر.","صحيح: فقد مقدار محدد من معزز مكتسب ضمن نظام واضح.","الإطفاء وقف للمعزز الذي يحافظ على السلوك نفسه."],"c":"يفقد نقطتين محددتين ضمن نظام معلن","p":"خصم من معزز مكتسب = تكلفة استجابة، وإبعاد مؤقت عن فرصة التعزيز = استبعاد."},{"id":"7-25","s":7,"i":"7.3","l":"تحليل","t":"طبّق معلم إجراء تعزيز غياب السلوك (DRO) مع الطالب حمد لخفض المقاطعة، وبعد أسبوعين قال: «نجح الإجراء؛ أشعر أن مقاطعاته قلّت»، ولم يكن قد سجّل أي بيانات قبل التدخل. ما الخلل الأساسي في هذا الحكم؟","o":["إجراء DRO لا يصلح لخفض المقاطعة، والأصح استخدام الإطفاء معها","غياب خط أساس يُقارن به الأداء، فلا يمكن تقدير التغير الناتج عن التدخل","أسبوعان مدة قصيرة، وأقل مدة مقبولة للحكم على أي تدخل ستة أسابيع","المعلم لم يُشرك الأسرة في تطبيق الإجراء في المنزل بالتوازي"],"a":1,"w":"خط الأساس قياس لمستوى السلوك قبل التدخل، وهو نقطة المقارنة التي تسمح بتقدير التغير. والحكم بالنجاح من «شعور» المعلم دون بيانات قبلية وبعدية حكم انطباعي، والبيانات هي الفيصل في الحكم على نجاح الخطة.","n":["DRO مناسب لخفض المقاطعة، والخلل في طريقة الحكم لا في الإجراء.","صحيح: لا حكم على الفاعلية دون مقارنة بخط أساس.","لا مدة ثابتة؛ فالحكم يقوم على البيانات مقارنة بخط الأساس.","الإشراك قد يفيد التعميم، لكنه ليس سبب ضعف الحكم هنا."],"c":"«أشعر» … لم يسجّل بيانات قبل التدخل","p":"لا نجاح بلا مقارنة: خط أساس قبل التدخل، ثم بيانات مستمرة بعده."},{"id":"7-26","s":7,"i":"7.4","l":"تطبيق","t":"طالبان من ذوي اضطراب فرط الحركة وتشتت الانتباه (ADHD) في فصل واحد يتركان مقعديهما كثيرًا. تُظهر بيانات (ABC) أن الأول يتركه ليقترب من زملائه ويحادثهم، والثاني يتركه كلما طالت مهمة الكتابة. ما القرار الأنسب؟","o":["تطبيق خطة واحدة على الطالبين لأن تشخيصهما واحد وسلوكهما متشابه","بناء تدخل لكل طالب يطابق وظيفة سلوكه رغم تشابه تشخيصهما","نقل الطالبين إلى مقعدين قرب المعلم بوصفه الحل المعتمد لهذه الفئة","تطبيق الوقت المستقطع على الطالبين عند كل ترك للمقعد"],"a":1,"w":"تعديل السلوك عملية فردية؛ فالسلوك نفسه قد يحتاج تدخلًا مختلفًا إذا اختلفت وظيفته. فالأول يسعى إلى التفاعل مع الأقران، فيُعلَّم طريقة مقبولة لذلك، والثاني يهرب من مهمة كتابة طويلة، فتُجزأ المهمة ويُعلَّم طلب الاستراحة.","n":["التشخيص وشكل السلوك لا يحددان التدخل؛ الوظيفة هي الحاسمة.","صحيح: الوظيفة لا التشخيص تحدد التدخل.","يختار الحل من الفئة لا من وظيفة السلوك.","قد يمنح الثاني الهروب من الكتابة فيقوّي سلوكه."],"c":"الأول ليحادث زملاءه، والثاني كلما طالت الكتابة","p":"طالبان بالتشخيص نفسه قد يحتاجان تدخلين مختلفين إذا اختلفت الوظيفة."},{"id":"7-27","s":7,"i":"7.4","l":"تطبيق","t":"تظهر لدى الطالب زياد (ذو اضطراب طيف التوحد) نوبات بكاء حين يُطلب منه فجأة ترك نشاط الحاسوب والانتقال إلى حصة أخرى. ما الإجراء الوقائي الأنسب؟","o":["تجاهل نوبات البكاء كليًا حتى يعتاد زياد على الانتقال المفاجئ بين الأنشطة","حرمانه من الحاسوب في اليوم التالي إذا بكى عند الانتقال","تهيئة الانتقال مسبقًا بجدول بصري وتنبيه زمني قبل انتهاء النشاط","إبقاؤه في نشاط الحاسوب معظم اليوم تجنبًا لنوبات الانتقال"],"a":2,"w":"مع طلاب اضطراب طيف التوحد تفيد التهيئة للانتقال والجداول البصرية وتقليل الغموض. والقرينة أن النوبات تحدث عند الانتقال المفاجئ، فالتدخل الأنسب قبلي وقائي يجعل الانتقال متوقعًا.","n":["يُبقي السابق المثير دون معالجة ولا يعلّم شيئًا.","إجراء عقابي لاحق لا يعالج غموض الانتقال.","صحيح: تدخل قبلي يقلل الغموض.","يحرمه من التعلم ولا يبني مهارة الانتقال."],"c":"يُطلب منه فجأة الانتقال","p":"توحد + انتقال مفاجئ ← تهيئة مسبقة وجدول بصري وتنبيه زمني."},{"id":"7-28","s":7,"i":"7.4","l":"تطبيق","t":"تدخل الطالبة دانة (ذات اضطراب سلوكي وانفعالي) في جدال متصاعد مع معلمتها كلما صححت أخطاءها أمام الصف. ما النهج الأنسب للتعامل مع هذا النمط؟","o":["تشديد العقوبة على كل جدال حتى تدرك دانة حدود سلطة المعلمة في الصف","الامتناع عن تصحيح أخطائها نهائيًا تجنبًا لأي تصعيد محتمل معها","الرد على كل اعتراض منها بحجج مفصلة أمام الصف حتى تقتنع بخطئها","بناء علاقة داعمة وقواعد واضحة وتعليم تنظيم الانفعال دون صراع قوة"],"a":3,"w":"في الاضطرابات السلوكية والانفعالية تفيد العلاقة الداعمة والقواعد الواضحة المتسقة وتعليم التنظيم الانفعالي وحل المشكلات، مع تجنب صراع القوة. ويبقى التصحيح قائمًا، لكن بصورة موجزة وخاصة لا تتحول إلى مواجهة.","n":["يغذي صراع القوة ويصعّد الموقف.","يحرمها من التغذية الراجعة ويخفض التوقعات.","يطيل الجدال العلني ويحوّله إلى صراع قوة.","صحيح: علاقة وقواعد وتنظيم انفعالي دون صراع قوة."],"c":"جدال متصاعد كلما صححت أمام الصف","p":"اضطراب سلوكي وانفعالي ← تجنب صراع القوة، وعلّم تنظيم الانفعال ضمن علاقة داعمة."},{"id":"7-29","s":7,"i":"7.4","l":"تحليل","t":"يُخرج المعلم الطالب سلطان من حصة القراءة إلى الممر كلما رمى كتابه، وتُظهر البيانات أن رمي الكتاب ازداد من مرتين إلى سبع مرات أسبوعيًا منذ بدء هذا الإجراء. ما التفسير الأرجح؟","o":["إخراجه يحقق له الهروب من القراءة، فيعزز السلوك بدل أن يخفضه","الإجراء فعال لكنه يحتاج إلى مدة أطول قبل أن يظهر أثره في السلوك","الزيادة فورة إطفاء متوقعة تدل على قرب نجاح الإجراء مع سلطان","لدى سلطان اضطراب سلوكي شديد لا تنفع معه الإجراءات الصفية"],"a":0,"w":"الوقت المستقطع فقد مؤقت لفرصة التعزيز، لكنه إذا طُبق على سلوك وظيفته الهروب منح الطالب ما يريده فزاد السلوك. وارتفاع رمي الكتاب بعد الإجراء دليل على أن الإخراج أصبح معززًا سلبيًا، فيُعاد بناء التدخل على الوظيفة.","n":["صحيح: النتيجة حققت وظيفة الهروب.","البيانات تُظهر زيادة مستمرة لا تأخرًا في الأثر.","لا إطفاء هنا؛ فالمعزز (الهروب) ما زال يُقدَّم.","يتجاهل البيانات ويحمّل الطالب ما سببه الإجراء."],"c":"يُخرجه من حصة القراءة … ازداد الرمي","p":"قبل أي استبعاد اسأل: هل يمنح الطالب الهروب الذي يريده؟"},{"id":"7-30","s":7,"i":"7.4","l":"معرفة","t":"متى يُستهدف السلوك النمطي لدى طالب من ذوي اضطراب طيف التوحد بإجراءات الخفض؟","o":["حين يختلف عن سلوك أقرانه ويلفت أنظارهم إليه في الفصل","حين يتكرر أكثر من مرة واحدة خلال الحصة الدراسية الواحدة","حين تطلب الأسرة أو المعلم إيقافه لأنه سلوك غير مألوف","حين يسبب أذى أو يعيق التعلم أو المشاركة بصورة ذات دلالة"],"a":3,"w":"السلوك النمطي لا يُخفض لمجرد أنه مختلف أو غير مألوف، بل يُتدخل فيه عندما يسبب أذى للطالب أو لغيره، أو يعيق تعلمه أو مشاركته بصورة ذات دلالة. أما غير المؤذي وغير المعيق فيُراقب أثره.","n":["الاختلاف وحده ليس مبررًا للخفض.","التكرار وحده لا يحدد الحاجة؛ المعيار الأثر الوظيفي.","عدم الألفة ليس معيارًا مهنيًا للتدخل.","صحيح: الأثر الوظيفي هو المعيار."],"c":"متى يُستهدف السلوك النمطي بالخفض","p":"لا تخفض السلوك لأنه مختلف؛ اخفضه إذا آذى أو أعاق."},{"id":"7-31","s":7,"i":"7.4","l":"تحليل","t":"لاحظ معلم أن الطالب خالد (8 سنوات) يعكس بعض الحروف المتشابهة في أثناء الكتابة، فكتب في تقريره: «لديه خلل بصري مكاني واضح». ما التقييم الأدق لهذا الاستنتاج؟","o":["دقيق؛ لأن عكس الحروف المتشابهة علامة مؤكدة على وجود خلل بصري مكاني لديه","دقيق؛ بشرط أن يتكرر العكس في أكثر من حصة وأكثر من مادة خلال الأسبوع","متسرع؛ فعكس الحروف ليس دليلًا مباشرًا على خلل بصري مكاني، ويحتاج تقييمًا مناسبًا","متسرع؛ لأن عكس الحروف في هذه السن دليل مؤكد على عسر القراءة لا على خلل بصري"],"a":2,"w":"عكس الحروف ليس دليلًا مباشرًا على خلل بصري مكاني؛ فقد تظهر هذه الأخطاء لأسباب نمائية أو لغوية وقرائية متعددة. لذا يُحلَّل نوع الأخطاء وسياقها ويُجرى تقييم قرائي ولغوي مناسب قبل أي استنتاج.","n":["قد تظهر أخطاء العكس لأسباب نمائية أو لغوية وقرائية متعددة.","التكرار لا يحوّل العكس إلى دليل على خلل بصري مكاني.","صحيح: لا استنتاج سببي من مؤشر واحد.","يستبدل استنتاجًا متسرعًا بآخر مثله."],"c":"يعكس بعض الحروف … «خلل بصري مكاني»","p":"مؤشر واحد لا يكفي لاستنتاج سبب؛ حلّل الأخطاء وقيّم تقييمًا مناسبًا."},{"id":"7-32","s":7,"i":"7.4","l":"تطبيق","t":"رغم تطبيق المعلمة استراتيجيات صفية وقائية مدة شهر، استمر الطالب أحمد في رمي أدواته عدة مرات يوميًا بما يعيق تعلمه وتعلم زملائه. ما الإجراء الأنسب الآن؟","o":["إجراء تقييم وظيفي منهجي (FBA) وبناء خطة تدخل سلوكي (BIP) على نتائجه","الاستمرار في الاستراتيجيات نفسها شهرًا آخر دون جمع بيانات إضافية عنه","الانتقال إلى إجراء عقابي أشد لأن الاستراتيجيات الوقائية لم تنجح معه","نقل أحمد إلى فصل آخر لعل تغيير المعلمة يخفض سلوكه"],"a":0,"w":"لا يلزم تقييم وظيفي منهجي لكل مخالفة بسيطة، لكنه يُستخدم خصوصًا حين يكون السلوك متكررًا أو شديدًا أو معقدًا، أو حين تفشل التدخلات الصفية الأولية. وقد تحققت الشروط هنا، فيُبنى على نتائجه خطة تدخل تشمل الوقاية وتعليم البديل والتعزيز والمتابعة.","n":["صحيح: سلوك متكرر معيق وفشل التدخل الأولي يستدعيان FBA.","يكرر ما ثبت عدم كفايته دون بيانات.","التصعيد العقابي دون فهم الوظيفة قد يعزز السلوك.","قرار مكاني لا يقوم على فهم وظيفة السلوك."],"c":"رغم استراتيجيات وقائية مدة شهر","p":"FBA ليس لكل مخالفة؛ يبرز مع السلوك المتكرر أو الشديد أو بعد فشل التدخلات الأولية."},{"id":"7-33","s":7,"i":"7.4","l":"تطبيق","t":"يرفض الطالب ياسر (ذو صعوبات تعلم في الرياضيات) الخروج إلى السبورة لحل المسائل أمام زملائه، ويحتدّ إذا أُلزم بذلك، بينما يحل مسائل مماثلة في مقعده بدقة مقبولة. ما الإجراء الأنسب؟","o":["إلزامه بالحل على السبورة يوميًا حتى يعتاد على مواجهة زملائه في الصف","إتاحة مشاركة أقل إحراجًا تحفظ الهدف الرياضي، ثم توسيعها تدريجيًا","إعفاؤه من الرياضيات الصفية وتكليفه بها واجبًا منزليًا فقط","سحب نقطة منه كلما رفض الخروج إلى السبورة في الحصة"],"a":1,"w":"مع طلاب صعوبات التعلم يعالج التدخل صعوبة المهمة والإحراج بالدعم المتدرج والتكييفات التي لا تغيّر الهدف. فياسر يتقن المسائل في مقعده، والحاجز هو الأداء العلني المحرج، فتُعدّل طريقة المشاركة مع بقاء الهدف الرياضي.","n":["يزيد الإحراج والتصعيد ولا يخدم الهدف الرياضي.","صحيح: خفض الإحراج مع ثبات الهدف.","يحرمه من التعلم الصفي ويتجاوز الحاجز الحقيقي.","عقاب لا يعالج الإحراج ولا يعلّم بديلًا."],"c":"أمام زملائه … يحل في مقعده بدقة","p":"صعوبات تعلم + رفض علني ← خفف الإحراج وعدّل المشاركة دون خفض الهدف."},{"id":"7-34","s":7,"i":"7.5","l":"معرفة","t":"أي القواعد الصفية الآتية أكثر اتساقًا مع مبادئ الإدارة الصفية الفعالة؟","o":["«ارفع يدك وانتظر الإذن قبل أن تتحدث»","«لا تكن مزعجًا ولا تُحدث فوضى في الفصل»","«كن طالبًا محترمًا ومثاليًا في كل الأوقات»","«من يخالف القواعد يُحرم من الفسحة فورًا»"],"a":0,"w":"القواعد الفعالة قليلة وواضحة وإيجابية الصياغة وقابلة للملاحظة والتعليم؛ تخبر الطالب بما يفعله لا بما يتجنبه، ثم تُعلَّم وتُمارس ويُقدَّم عليها تغذية راجعة.","n":["صحيح: موجزة وإيجابية الصياغة وقابلة للملاحظة.","صياغة سلبية عامة لا تحدد السلوك المطلوب.","عامة غير قابلة للملاحظة أو القياس.","عقوبة لا قاعدة، ولا تعلّم السلوك المتوقع."],"c":"مبادئ الإدارة الصفية الفعالة","p":"القاعدة الجيدة تقول للطالب ماذا يفعل، بصياغة موجبة قابلة للملاحظة."},{"id":"7-35","s":7,"i":"7.5","l":"تطبيق","t":"يستغرق انتقال طلاب غرفة المصادر من العمل الفردي إلى العمل في مجموعات نحو عشر دقائق تكثر فيها المشاحنات والتجول، لأنهم ينتظرون المعلمة لتوزيع المواد وتحديد أماكنهم. ما الإجراء الأنسب؟","o":["معاقبة أكثر الطلاب إثارة للفوضى في أثناء الانتقال لردع بقية زملائهم","إلغاء العمل في المجموعات والاكتفاء بالعمل الفردي طوال الحصة الدراسية","رفع الصوت بالتعليمات في أثناء الانتقال حتى يسمعها جميع الطلاب","تصميم روتين انتقال بإشارة مسبقة وتجهيز المواد والأماكن قبل النشاط"],"a":3,"w":"الانتقالات من أكثر اللحظات قابلية لظهور المشكلات، والقرينة أن الفوضى سببها الانتظار والغموض. والإجراء الوقائي الأنسب إعادة تصميم الانتقال بروتين معلن وإشارة مسبقة وتجهيز المواد والأماكن لتقليل زمن الانتظار.","n":["علاج لاحق لا يمس سبب المشكلة، وهو الانتظار والغموض.","يحرم الطلاب من التعلم التعاوني بدل تنظيم الانتقال.","يزيد الضوضاء ولا يقلل زمن الانتظار.","صحيح: يعالج بنية الانتقال وقائيًا."],"c":"ينتظرون المعلمة لتوزيع المواد وتحديد الأماكن","p":"فوضى عند الانتقال ← روتين وإشارة مسبقة وتقليل الانتظار قبل أي عقوبة."},{"id":"7-36","s":7,"i":"7.5","l":"تحليل","t":"تُظهر بيانات أسبوعين أن 15 طالبًا من 22 في أحد الفصول يخرجون عن المهمة في الدقائق العشرين الأولى من الحصة، وهي فترة شرح متواصل. ما التفسير الأدق والإجراء المترتب عليه؟","o":["الطلاب الخمسة عشر يحتاجون خططًا سلوكية فردية لأن سلوكهم يعيق التعلم","المشكلة في دافعية الطلاب، ويكفي نظام عقوبات صارم للخارجين عن المهمة","مشكلة صفية مرتبطة بتصميم التدريس، فيُراجع الشرح وتُزاد فرص الاستجابة","يُحال الطلاب الخمسة عشر إلى المرشد لتقييم اضطراب الانتباه لديهم"],"a":2,"w":"حين يخرج معظم الصف عن المهمة في فترة محددة هي الشرح الطويل، يكون السبب الأرجح في تصميم التدريس لا في الأفراد. لذا تُراجع البيئة والتدريس، فيُقسَّم الشرح وتُزاد فرص الاستجابة والمشاركة، قبل بناء أي خطط فردية.","n":["يفردن مشكلة واسعة قبل مراجعة البيئة والتدريس.","يلوم الطلاب ويتجاهل ارتباط المشكلة بالشرح الطويل.","صحيح: مشكلة واسعة مرتبطة بفترة محددة، فيُراجع التدريس.","إحالات فردية لمشكلة يرجح أن سببها تدريسي."],"c":"15 من 22 … في فترة الشرح المتواصل","p":"مشكلة صفية واسعة ← راجع التدريس والبيئة قبل لوم الأفراد."},{"id":"7-37","s":7,"i":"7.5","l":"تطبيق","t":"صحّح المعلم الطالب عبدالرحمن أمام الصف بتعليق طويل عن احترام القواعد، فاحتدّ عبدالرحمن وتصاعد الجدال بينهما. ما الاستجابة التصحيحية الأنسب في المواقف المماثلة؟","o":["تصحيح موجز هادئ وخاص قدر الإمكان يوجّهه إلى السلوك المتوقع","تصحيح علني مفصل يوضح للصف كله عاقبة مخالفة القواعد الصفية المعلنة","تجاهل مخالفاته كلها تجنبًا لأي جدال معه في المستقبل","إرساله إلى الإدارة فور أي مخالفة دون أي نقاش معه"],"a":0,"w":"الاستجابة التصحيحية الفعالة موجزة وهادئة ومحترمة وموجهة إلى السلوك المتوقع، وتكون خاصة قدر الإمكان. أما التعليق العلني الطويل فيحوّل الموقف إلى صراع ومصدر انتباه، فيزيد التصعيد.","n":["صحيح: موجز ومحترم وموجّه إلى السلوك.","يكرر ما سبب التصعيد ويحوّل التصحيح إلى مواجهة.","يترك السلوك دون توجيه ويُضعف اتساق القواعد.","إقصاء سريع لا يعلّم السلوك المتوقع."],"c":"أمام الصف بتعليق طويل … تصاعد الجدال","p":"التصحيح الجيد: قصير، هادئ، خاص، ويحدد ما ينبغي فعله."},{"id":"7-38","s":7,"i":"7.5","l":"تطبيق","t":"عُلّقت على الجدار المقابل لطاولة الطالبة أريج في غرفة المصادر لوحات ووسائل كثيرة من دروس سابقة، وتلاحظ المعلمة تشتتها المستمر بالنظر إليها. ما الإجراء الأنسب أولًا؟","o":["إضافة وسائل ملونة جديدة تجذب انتباهها إلى موضوع الدرس الحالي بدل القديمة","نقل أريج إلى غرفة منفصلة خالية من أي وسائل تعليمية","تنبيهها لفظيًا كلما نظرت إلى الجدار حتى تعتاد التركيز","تقليل الوسائل غير ذات الصلة والإبقاء على ما يحتاجه الدرس الحالي"],"a":3,"w":"ازدحام الجدران بالوسائل قد يرفع الحمل المعرفي البصري لدى بعض الطلاب. والإجراء الأنسب تعديل البيئة بعرض الوسائل ذات الصلة وقت الحاجة وتقليل الزائد، دون تحويل الفصل إلى بيئة فقيرة تعليميًا.","n":["يزيد الحمل البصري الذي سبب التشتت.","عزل وإفقار للبيئة بدل تنظيمها.","يعالج النتيجة ويترك المثير المشتت قائمًا.","صحيح: تعديل المثير البصري قبل أي إجراء آخر."],"c":"لوحات كثيرة من دروس سابقة … تشتتها","p":"تشتت بصري ← نظّم المثيرات وقلّل غير المرتبط بالدرس، ولا تعزل الطالب."},{"id":"7-39","s":7,"i":"7.5","l":"معرفة","t":"أي مما يلي «لا» يُعد مؤشرًا على فاعلية الإدارة الصفية في التربية الخاصة؟","o":["صمت الطلاب التام أغلب وقت الحصة مع قلة مشاركتهم","ارتفاع الزمن التعليمي الفعّال الذي ينخرط فيه الطلاب","انسيابية الانتقالات بين الأنشطة دون فوضى أو انتظار طويل","تزايد استقلال الطلاب في أداء الروتين الصفي اليومي"],"a":0,"w":"مقياس الإدارة الصفية الفعالة زيادة الانخراط في التعلم والأمان والاستقلال، لا مجرد الصمت. فالهدوء المصحوب بقلة المشاركة قد يدل على إدارة تقليدية صارمة تحقق امتثالًا مؤقتًا لا تعلمًا.","n":["صحيح: الصمت ليس مقياس الإدارة الفعالة.","مؤشر مهم على كفاءة الإدارة الصفية.","دليل على روتين ناجح وإدارة وقائية.","الاستقلال من غايات الإدارة الفعالة."],"c":"«لا» يُعد مؤشرًا على الفاعلية","p":"الإدارة الفعالة تُقاس بالانخراط والاستقلال والأمان، لا بالصمت."},{"id":"7-40","s":7,"i":"7.5","l":"تحليل","t":"طبّق معلم نظام نقاط في فصله منذ شهر دون تحسن في السلوك، وعند سؤال الطلاب تبيّن أنهم لا يعرفون على أي سلوك يحصلون على النقاط؛ فالمعلم يمنحها «حين يراهم ملتزمين». ما الخلل الأساسي؟","o":["انخفاض قيمة المعززات المقدمة، والحل زيادة الجوائز في نهاية الأسبوع","عدم مناسبة أنظمة النقاط لطلاب التربية الخاصة من حيث المبدأ","قصر المدة، فأنظمة النقاط تحتاج عامًا كاملًا حتى تظهر نتائجها","غموض السلوكيات المستهدفة ومعايير الكسب، وعدم تعليمها للطلاب"],"a":3,"w":"يعمل التعزيز حين يعرف الطالب السلوك الذي ينبغي تكراره. وعبارة «حين يراهم ملتزمين» معيار غامض لا يحدد سلوكًا قابلًا للملاحظة، فلا يربط الطلاب بين سلوكهم والنقطة. لذا تُحدد السلوكيات المستهدفة ومعايير الكسب وتُعلَّم بوضوح.","n":["قيمة المعزز مهمة، لكن الطلاب لا يعرفون ما الذي يُعزَّز أصلًا.","الأنظمة الرمزية مفيدة إذا وضحت معاييرها.","لا مدة ثابتة، والخلل في وضوح العلاقة بين السلوك والنقطة.","صحيح: وضوح العلاقة بين السلوك والتعزيز شرط الفاعلية."],"c":"لا يعرفون على أي سلوك يحصلون عليها","p":"التعزيز بلا معيار واضح لا يعلّم شيئًا: حدد السلوك، وعلّمه، ثم عززه."},{"id":"7-41","s":7,"i":"7.5","l":"تطبيق","t":"في أثناء نشاط جماعي في مختبر العلوم، تقف المعلمة عند طاولة مجموعة واحدة طوال الوقت، فتتصاعد مشكلات في المجموعات الأخرى دون أن تنتبه لبوادرها. ما الإجراء الأنسب؟","o":["تعيين قائد في كل مجموعة يبلغ المعلمة بأسماء زملائه المخالفين أولًا بأول","الإشراف النشط بالتنقل المنتظم ومسح المختبر بالنظر والتفاعل والتغذية الراجعة","الاكتفاء بمتابعة المجموعة الأضعف لأنها الأحوج إلى الدعم والتوجيه","إيقاف النشاط عند أول مشكلة وإعادة الطلاب جميعًا إلى مقاعدهم"],"a":1,"w":"الإشراف النشط يشمل الحركة المنتظمة بين الطلاب، ومسح المكان بالنظر، والتفاعل معهم، وتقديم التغذية الراجعة والتعزيز؛ فيلتقط المعلم بوادر المشكلات مبكرًا قبل تصاعدها.","n":["ينقل المراقبة إلى الطلاب ويفتح بابًا للصراع بينهم.","صحيح: مراقبة وقائية متحركة وتفاعلية.","يكرس المشكلة نفسها: غياب المراقبة عن بقية المجموعات.","علاج لاحق يحرم الطلاب من التعلم بدل الوقاية."],"c":"تقف عند مجموعة واحدة طوال الوقت","p":"الإشراف النشط = تحرّك + مسح + تفاعل + تغذية راجعة، وقاية قبل التصعيد."},{"id":"8-01","s":8,"i":"8.1","l":"معرفة","t":"أي العبارات الآتية تصف الاستشارة التربوية (Educational Consultation) في التربية الخاصة وصفًا أدق؟","o":["عملية تعاونية غير مباشرة غالبًا، يمكّن فيها المستشارُ المستشيرَ من دعم الطالب","توجيهات يصدرها معلم التربية الخاصة لمعلم الفصل ليلتزم بتنفيذها كما هي حرفيًّا","خدمة مباشرة يقدمها المختص للطالب في غرفة المصادر بدلًا من معلم الفصل العام","اجتماع دوري يتبادل فيه أعضاء الفريق تقاريرهم دون الحاجة إلى قرار مشترك"],"a":0,"w":"الاستشارة التربوية عملية تفاعلية تعاونية بين مستشار ومستشير، غايتها تمكين المستشير (معلمًا كان أو وليّ أمر) من مساعدة الطالب بكفاءة، ولذلك تكون غير مباشرة غالبًا. ونجاحها يظهر في انتقال الأثر إلى أداء المستشير ثم إلى تقدم الطالب.","n":["صحيح: تمكين غير مباشر للمستشير.","خطأ: الاستشارة ليست أوامر من خبير إلى تابع، بل شراكة قائمة على الندية.","خطأ: هذا تدريس مباشر، أما الاستشارة فغير مباشرة غالبًا وتمر عبر المستشير.","خطأ: تبادل التقارير وحده لا يحقق غاية الاستشارة في تمكين المستشير."],"c":"تصف الاستشارة التربوية وصفًا أدق","p":"إذا دعم المختص الطالبَ عبر شخص آخر دون تدخل مباشر معه، ففكّر في الاستشارة التربوية."},{"id":"8-02","s":8,"i":"8.1","l":"تطبيق","t":"تلتقي معلمة صعوبات التعلم أسبوعيًّا بمعلمة الرياضيات لتدريبها على استخدام بطاقات خطوات الحل مع الطالبة ريم داخل الفصل، ثم تتابع تطبيقها، دون أن تتولى هي تدريس ريم في تلك الحصص. أي المفاهيم يصف هذه الممارسة بدقة؟","o":["تدريس تشاركي تتقاسم فيه المعلمتان تدريس الفصل نفسه","تدريس علاجي مباشر تقدمه معلمة صعوبات التعلم للطالبة داخل الفصل","فريق متعدد التخصصات يجري فيه كل عضو تقييمًا مستقلًّا","استشارة تربوية تقدم دعمًا غير مباشر للطالبة عبر معلمتها"],"a":3,"w":"القرينة أن معلمة الصعوبات تدرّب زميلتها وتتابعها، بينما تبقى معلمة الرياضيات هي من يقدم الدعم للطالبة؛ وهذا جوهر الاستشارة غير المباشرة. أما التدريس التشاركي فيتطلب أن يشترك المعلمان فعليًّا في التدريس داخل الفصل نفسه.","n":["خطأ: لا يوجد تدريس متزامن مشترك؛ فمعلمة الصعوبات لا تدرّس في الحصة.","خطأ: معلمة الصعوبات لا تتعامل مع الطالبة مباشرة في هذا الموقف.","خطأ: لا توجد تقييمات مستقلة تُدمج نتائجها لاحقًا.","صحيح: تمكين المعلمة دون تدخل مباشر مع الطالبة."],"c":"دون أن تتولى هي تدريس ريم","p":"اسأل: من يقدّم الخدمة للطالب فعليًّا؟ إن كان المستشير بعد تمكينه، فهي استشارة."},{"id":"8-03","s":8,"i":"8.1","l":"تطبيق","t":"وصف معلم الفصل الطالب سلمان بأنه «مشتت ومهمل»، فبدأ الفريق مباشرة باقتراح برنامج تعزيز له. وفق دورة حل المشكلة، ما الإجراء الأنسب أولًا؟","o":["اعتماد برنامج التعزيز المقترح ثم تقويم أثره بعد شهر من بدء تطبيقه","صياغة المشكلة إجرائيًّا في سلوك قابل للقياس، ثم جمع البيانات","إحالة سلمان إلى الأخصائي النفسي لتقييم احتمال وجود اضطراب في الانتباه","صياغة هدف في البرنامج التربوي الفردي يعالج الإهمال والتشتت لديه"],"a":1,"w":"تبدأ دورة حل المشكلة بتحديد المشكلة تحديدًا دقيقًا قابلًا للقياس، ثم جمع البيانات وتحليلها، ثم التخطيط المشترك فالتنفيذ فالتقويم. ووصف «مشتت ومهمل» انطباع عام لا يصلح أساسًا لأي تدخل قبل تحويله إلى سلوك محدد.","n":["خطأ: يقفز إلى التنفيذ قبل تحديد المشكلة وجمع البيانات.","صحيح: الدورة تبدأ بتحديد المشكلة بدقة.","خطأ: الإحالة التشخيصية سابقة لأوانها، والمشكلة لم تُعرَّف بعد.","خطأ: الهدف يُكتب بعد تحديد مستوى الأداء والبيانات، و«مهمل» وصف غير قابل للقياس."],"c":"«مشتت ومهمل» ثم اقتراح برنامج مباشرة","p":"لا تدخّل قبل تعريف إجرائي للمشكلة وبيانات تصفها."},{"id":"8-04","s":8,"i":"8.1","l":"تطبيق","t":"بعد ستة أسابيع من الاستشارة بين معلم صعوبات التعلم ومعلم العلوم بشأن الطالب فيصل، أي البيانات الآتية أقوى دليل على نجاح الاستشارة؟","o":["انعقاد اللقاءات الاستشارية الستة كلها في مواعيدها دون أي تأجيل","تعبير معلم العلوم عن رضاه الكبير عن أسلوب الحوار في اللقاءات","تطبيق معلم العلوم الاستراتيجية باستقلال وتحسن دقة فيصل","اكتمال ملف استشاري منظم يضم محاضر اللقاءات وتوصياتها كاملة"],"a":2,"w":"يقاس نجاح الاستشارة بانتقال أثرها إلى أداء المستشير وانعكاس ذلك على تقدم الطالب بصورة قابلة للقياس، لا بعدد الاجتماعات أو الرضا أو جودة الوثائق؛ فهذه مؤشرات تنظيمية تدعم العملية ولا تثبت نتيجتها.","n":["خطأ: انتظام اللقاءات مؤشر تنظيمي لا يثبت الأثر.","خطأ: الرضا مهم، لكنه لا يدل على تغير الممارسة أو تعلم الطالب.","صحيح: الأثر في المستشير ثم في الطالب.","خطأ: التوثيق وسيلة متابعة وليس معيار نجاح."],"c":"أقوى دليل على نجاح الاستشارة","p":"نجاح الاستشارة = مستشير أكثر كفاءة + طالب يتحسن، لا عدد لقاءات."},{"id":"8-05","s":8,"i":"8.1","l":"تحليل","t":"في فريق الطالب عبدالله، تدرّب أخصائية النطق واللغة معلمَ صعوبات التعلم على تنفيذ تمارين الوعي الصوتي، وتشرف أسبوعيًّا على تطبيقه لها، ليقدمها هو ضمن جلساته اليومية. أي نماذج الفرق يمثله هذا الإجراء؟","o":["الفريق متعدد التخصصات القائم على تقييمات مستقلة تُدمج لاحقًا","الفريق عابر التخصصات القائم على إطلاق الأدوار (Role Release)","الفريق بين التخصصات القائم على تخطيط مشترك وتنفيذ منفصل","التدريس التشاركي القائم على شراكة معلمَين داخل الفصل نفسه"],"a":1,"w":"السمة الفارقة للفريق عابر التخصصات هي إطلاق الأدوار: يدرّب المختص عضوًا آخر على جزء من تدخلاته ويشرف عليه، فينفذه ضمن ضوابط مهنية. وهذا لا يلغي حدود الاختصاص؛ فالتدريب والإشراف شرطان أساسيان لنقل الدور.","n":["خطأ: لا يوجد هنا عمل مستقل ثم دمج، بل نقل مهارة عبر حدود التخصص.","صحيح: تدريب متقاطع وإشراف ونقل دور.","خطأ: في هذا النموذج ينفّذ كل مختص تدخلاته، أما هنا فقد نُقلت المهارة لعضو آخر.","خطأ: الموقف تدريب مهني بين تخصصين، لا تدريس متزامن في فصل."],"c":"تدرّب ... وتشرف أسبوعيًّا ليقدمها هو","p":"تدريب + إشراف + تنفيذ عضو من تخصص آخر = عابر التخصصات (Role Release)."},{"id":"8-06","s":8,"i":"8.1","l":"تطبيق","t":"اختلفت المرشدة الطلابية، وهي الأقدم خبرة في المدرسة، مع معلمة صعوبات التعلم حول البدء بهدف القراءة أو بهدف تنظيم الانتباه للطالبة جود. ما الأساس الأنسب لحسم الخلاف؟","o":["بيانات جود وأثر كل حاجة في تعلمها ومصلحتها التعليمية","رأي المرشدة الطلابية لأنها الأقدم خبرة والأعرف بالطالبات","رأي معلمة صعوبات التعلم لأنها المرجع الفني الأول في الفريق","رفع الخلاف فورًا إلى مدير المدرسة ليصدر قرارًا ملزمًا"],"a":0,"w":"الخلاف المهني داخل الفريق يُحسم بالرجوع إلى بيانات الطالبة والهدف المشترك ومصلحتها، لا بالأقدمية أو السلطة أو التخصص. ويُترك التصعيد النظامي لحين استنفاد الحوار المبني على الأدلة.","n":["صحيح: البيانات ومصلحة الطالبة تحسمان.","خطأ: الأقدمية لا تحسم الخلاف المهني.","خطأ: معلمة الصعوبات شريك فني، لا رئيس مطلق على الأعضاء.","خطأ: التصعيد الإداري السريع يضعف الثقة، ويأتي بعد الحوار والبيانات."],"c":"اختلفت ... وهي الأقدم خبرة","p":"الخلاف الفني تحسمه البيانات ومصلحة الطالب، لا الأقدمية ولا المنصب."},{"id":"8-07","s":8,"i":"8.1","l":"معرفة","t":"أي المواقف الآتية يمثل تقاطع الأدلة (Triangulation) في قرار فريق العمل؟","o":["اتفاق الملاحظة وعينات العمل وقياس التقدم وإفادة الأسرة على نمط واحد","إعادة تطبيق الاختبار التحصيلي نفسه مرتين متتاليتين للتأكد من دقة درجة الطالب","اعتماد تقرير الأخصائي النفسي وحده لأنه أدق الأدوات المقننة المتاحة","تسجيل ملاحظات معلم الفصل يوميًّا طوال شهر كامل في حصص اللغة فقط"],"a":0,"w":"تقاطع الأدلة يعني الاستناد إلى أكثر من مصدر وطريقة للتحقق من دقة القرار؛ فإذا اتفقت مصادر مستقلة على نمط واحد زادت الثقة وقلت أخطاء التشخيص. أما تكرار الأداة نفسها أو كثرة الملاحظات من مصدر واحد فلا يحقق ذلك.","n":["صحيح: مصادر وطرائق متعددة متقاربة.","خطأ: تكرار الأداة نفسها لا يضيف مصدرًا مستقلًّا.","خطأ: الاعتماد على مصدر واحد عكس تقاطع الأدلة.","خطأ: ملاحظات كثيرة لكنها من مصدر وطريقة وسياق واحد."],"c":"تقاطع الأدلة (Triangulation)","p":"تقاطع الأدلة = مصادر وأدوات مختلفة تتفق، لا كثرة بيانات من مصدر واحد."},{"id":"8-08","s":8,"i":"8.2","l":"معرفة","t":"فريق يخطط أعضاؤه معًا ويتبادلون المعلومات باستمرار ويتفقون على تدخلات مترابطة، مع احتفاظ كل مختص بتنفيذ ما يخص تخصصه. أي نماذج الفرق يصفه ذلك؟","o":["الفريق متعدد التخصصات (Multidisciplinary Team)","الفريق بين التخصصات (Interdisciplinary Team)","الفريق عابر التخصصات (Transdisciplinary Team)","التدريس التشاركي بين معلمين (Co-Teaching)"],"a":1,"w":"في الفريق بين التخ
