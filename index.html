ات ← دفاعية ← حاجة لتواصل متوازن."],"c":"تسعة من كل عشرة اتصالات ... مشكلات","p":"تواصل وقت المشكلات فقط = دفاعية؛ أضف الأخبار الإيجابية بانتظام."},{"id":"10-10","s":10,"i":"10.1","l":"تحليل","t":"تشير بيانات الطالبة جود إلى طلاقة قرائية مقبولة مع ضعف واضح في الفهم، بينما تشكو أسرتها من أن خطها غير مقروء في الواجبات وتطلب التركيز على الكتابة. ما الخطوة التي ينبغي أن تبدأ بها المعلمة؟","o":["شرح مبررات اختيار الفهم القرائي للأسرة بالتفصيل حتى تقتنع بأولويته.","مراجعة البيانات مع الأسرة والاستماع لأولويتها وتحديد هدف مشترك قبل المفاضلة.","قبول هدف الكتابة كما طلبته الأسرة حفاظًا على العلاقة معها وتجنبًا لأي خلاف محتمل.","تأجيل القرار إلى الاجتماع القادم حتى تهدأ وجهات النظر ويتضح الموقف أكثر."],"a":1,"w":"الخلاف حول أولوية الهدف يحتاج أساسًا مشتركًا: بيانات الطالبة وصوت الأسرة معًا. والبداية الصحيحة مراجعة البيانات والاستماع لسبب أهمية الكتابة للأسرة ثم تحديد الهدف المشترك، لا الإقناع الأحادي ولا التنازل ولا التأجيل.","n":["إقناع أحادي يتجاهل أولوية الأسرة.","صحيح: بيانات + صوت الأسرة ← هدف مشترك.","تنازل يتجاهل البيانات المهنية.","التأجيل لا يعالج الخلاف ويؤخر الدعم."],"c":"تطلب التركيز على الكتابة","p":"خلاف مع الأسرة ← بيانات + استماع + هدف مشترك قبل القرار."},{"id":"10-11","s":10,"i":"10.2","l":"معرفة","t":"في إطار IDEA Part C الذي نشأت فيه الخطة الأسرية الفردية (IFSP)، ما الفئة العمرية التي تُصمَّم لها، وإلى أي خطة ينتقل الطفل بعدها في السياق المدرسي؟","o":["من الولادة حتى السادسة، ثم ينتقل إلى خطة الدمج الشامل في المدرسة.","من سن الثالثة حتى السادسة، ثم ينتقل إلى خطة الانتقال المهني والحياتي للطالب.","من الولادة حتى سن الثالثة، ثم ينتقل إلى الخطة التربوية الفردية (IEP).","من سن المدرسة فما فوق، ثم ينتقل إلى خطة الخدمات المساندة المدرسية."],"a":2,"w":"تُصمَّم IFSP للرضع والأطفال الصغار ذوي الإعاقة أو المعرضين للخطر وأسرهم من الولادة حتى سن الثالثة في مرحلة التدخل المبكر، ثم يُخطَّط لانتقال الطفل إلى الخطة التربوية الفردية (IEP) في السياق المدرسي عند بلوغ الثالثة.","n":["مدّ غير صحيح لعمر IFSP في هذا الإطار.","هذا نطاق IEP في الإطار نفسه، لا IFSP.","صحيح: من الولادة حتى الثالثة ثم IEP.","سن المدرسة مجال IEP لا IFSP."],"c":"إطار IDEA Part C","p":"IFSP: من الولادة حتى الثالثة، والانتقال إلى IEP عند الثالثة."},{"id":"10-12","s":10,"i":"10.2","l":"معرفة","t":"من المسؤول الأساسي عن تنسيق تنفيذ خطة IFSP وضمان التواصل بين الأسرة وأعضاء الفريق؟","o":["أخصائي النطق والتخاطب.","طبيب الأطفال المتابع لحالة الطفل الصحية.","منسق الخدمة (Service Coordinator).","مدير مركز التدخل المبكر."],"a":2,"w":"منسق الخدمة حلقة الوصل التي تسهّل حصول الأسرة على الخدمات، وهو المسؤول عن تنسيق تنفيذ الخطة ومتابعتها وضمان التواصل بين الأسرة وأعضاء الفريق.","n":["أخصائي النطق يقدم خدمة تخصصية ضمن الفريق.","الطبيب يتولى الجوانب الطبية لا تنسيق الخطة.","صحيح: منسق الخدمة مسؤول التنسيق والمتابعة.","الإدارة ليست الدور المحدد لتنسيق IFSP."],"c":"تنسيق تنفيذ خطة IFSP","p":"IFSP + تنسيق ومتابعة = منسق الخدمة."},{"id":"10-13","s":10,"i":"10.2","l":"معرفة","t":"أي مما يلي «لا» يُعد من المكونات الأساسية لخطة IFSP؟","o":["ترتيب الطفل مقارنة بأقرانه في الفئة العمرية.","مخاوف الأسرة وأولوياتها ومواردها المتاحة.","الخدمات المطلوبة وتكرارها ومكان تقديمها.","وصف الأداء الحالي للطفل في مجالات النمو المختلفة."],"a":0,"w":"مكونات IFSP: الأداء الحالي للطفل، ومخاوف الأسرة وأولوياتها ومواردها، والنتائج والأهداف النمائية، والخدمات وتكرارها وموقع تقديمها في البيئة الطبيعية، ومنسق الخدمة. أما ترتيب الطفل بين أقرانه فليس عنصرًا في الخطة، ولا يخدم بناء نتائج وظيفية.","n":["صحيح: الترتيب بين الأقران ليس من مكونات الخطة.","مكوّن أساسي يميز IFSP.","مكوّن أساسي.","مكوّن أساسي."],"c":"«لا» يُعد من المكونات الأساسية","p":"IFSP: أداء حالي + أولويات الأسرة + نتائج + خدمات وبيئة + منسق خدمة."},{"id":"10-14","s":10,"i":"10.2","l":"تطبيق","t":"تقول أم الطفل يزن (سنة وتسعة أشهر) إن أصعب أوقات يومها وقت الاستحمام لأنه يبكي ولا يتعاون، وتتمنى أن يصبح وقتًا هادئًا. كيف يتعامل الفريق مع هذه المعلومة عند تصميم IFSP؟","o":["يعدّها شكوى أسرية عامة لا علاقة لها بأهداف النمو في الخطة.","يحللها مع الأسرة بوصفها أولوية وروتينًا طبيعيًّا تُبنى فيه نتيجة وظيفية.","يحيل الأم إلى أخصائي نفسي لعلاج قلقها قبل البدء في إعداد الخطة.","يقترح نقل تدريب الطفل إلى المركز حتى يتعلم التعاون مع المختص أولًا ثم مع أمه."],"a":1,"w":"الخطة الأسرية تبدأ من مخاوف الأسرة وأولوياتها وروتينها، وتحوّل الروتين اليومي كالاستحمام والطعام واللعب إلى فرص تعلم. لذا تُحلَّل هذه المعلومة مع الأسرة بوصفها أولوية يمكن أن تُبنى عليها نتيجة وظيفية قابلة للقياس.","n":["مخاوف الأسرة عنصر أساسي في الخطة لا هامش.","صحيح: أولوية أسرية + روتين طبيعي = نتيجة وظيفية.","يحوّل أولوية الأسرة إلى مشكلة فيها.","يبعد التدخل عن البيئة الطبيعية التي ظهرت فيها الحاجة."],"c":"أصعب أوقات يومها وقت الاستحمام","p":"في IFSP: أولوية الأسرة + روتين يومي = نقطة بداية النتيجة الوظيفية."},{"id":"10-15","s":10,"i":"10.2","l":"تطبيق","t":"طفلة عمرها سنتان تشير إلى ما تريده وتبكي إذا لم يُفهم طلبها، وأولوية أسرتها أن تطلب الماء والطعام. أي صياغة للنتيجة هي الأنسب في خطة IFSP؟","o":["أن تحسّن الطفلة مهاراتها اللغوية التعبيرية والاستقبالية بصورة ملحوظة خلال العام.","أن تطلب الطفلة الماء أو الطعام بكلمة أو إشارة أثناء الوجبات في معظم الفرص.","أن يقدم أخصائي التخاطب للطفلة جلسات منتظمة أسبوعيًّا في مركز التدخل المبكر.","أن تتعلم الأسرة استراتيجيات تحفيز اللغة من أخصائي التخاطب في زيارات منزلية."],"a":1,"w":"النتيجة الجيدة في IFSP تصف سلوكًا وظيفيًّا قابلًا للملاحظة والقياس داخل روتين طبيعي، ومرتبطًا بأولوية الأسرة. أما العبارة العامة فغير قابلة للقياس، والجلسات خدمة لا نتيجة، وتدريب الأسرة وسيلة لا تصف ما ستفعله الطفلة.","n":["عامة وغير قابلة للقياس.","صحيح: سلوك وظيفي في روتين وبمعيار.","تصف خدمة لا نتيجة.","وسيلة داعمة لا تصف أداء الطفلة."],"c":"أولوية أسرتها أن تطلب الماء والطعام","p":"النتيجة = ماذا سيفعل الطفل، وفي أي روتين، وبأي معيار."},{"id":"10-16","s":10,"i":"10.2","l":"تطبيق","t":"أم طفل عمره سنتان تشعر بإرهاق شديد، وتطلب نقل طفلها إلى مركز داخلي طوال اليوم. ما الإجراء الأول الأنسب للفريق؟","o":["الموافقة على طلبها فورًا لأن راحة الأسرة أولوية في الخطة.","فهم مصادر الضغط لدى الأسرة وإعادة تنظيم الأهداف بما يناسب روتينها.","إقناع الأم بأن المركز الداخلي يضر بالطفل وأن عليها تحمّل مسؤوليتها.","زيادة زيارات المختصين للمنزل لتخفيف العبء دون مناقشة أولويات الأسرة."],"a":1,"w":"الإجراء الأول فهم مصادر الضغط لدى الأسرة وإعادة تنظيم الأهداف بما يناسب روتينها، ثم دعم الأم وتمكينها داخل المنزل. فالهدف تمكين الأسرة والحفاظ على الطفل في بيئته الطبيعية لا عزله عنها، ولا لوم الأسرة أو زيادة العبء عليها.","n":["استجابة متسرعة تعزل الطفل عن بيئته الطبيعية.","صحيح: فهم الضغوط وإعادة تنظيم الأهداف.","لوم وتحميل للمسؤولية يهدم الشراكة.","زيادة الزيارات دون فهم الضغوط قد تضاعف العبء."],"c":"تشعر بإرهاق شديد","p":"أسرة مرهقة ← افهم الضغوط وأعد تنظيم الأهداف قبل أي قرار مكاني."},{"id":"10-17","s":10,"i":"10.2","l":"تطبيق","t":"يستعد الفريق لإجراء مقابلة تقييمية مع أسرة طفل في بداية تصميم IFSP. أي الممارسات أنسب لهذه المقابلة؟","o":["استخدام أسئلة مغلقة محددة لتوفير الوقت والحصول على إجابات دقيقة وسريعة.","عرض الأهداف التي أعدها الفريق مسبقًا وطلب موافقة الأسرة عليها في اللقاء نفسه قبل انتهائه.","التركيز على جمع التاريخ الطبي المفصل للطفل لأنه أساس تحديد الخدمات كلها.","الإنصات وطرح أسئلة مفتوحة عن روتين الأسرة وأولوياتها ومواردها باحترام لقيمها."],"a":3,"w":"المقابلة الأسرية أداة لجمع معلومات منظمة عن اهتمامات الأسرة ومواردها واحتياجاتها وبناء الثقة، ومكوناتها: الاستماع الفعال، والأسئلة المفتوحة، واحترام القيم الثقافية، وتحديد نقاط القوة. والخطأ الشائع فرض أهداف جاهزة دون الاستماع.","n":["الأسئلة المغلقة تحد من فهم السياق والأولويات.","فرض أهداف جاهزة هو الخطأ الشائع في المقابلة.","التاريخ الطبي جزء من الصورة لا أساسها الوحيد.","صحيح: إنصات وأسئلة مفتوحة واحترام ثقافي."],"c":"مقابلة تقييمية مع أسرة","p":"المقابلة الأسرية: اسمع أكثر مما تتكلم، واسأل أسئلة مفتوحة عن الروتين والأولويات."},{"id":"10-18","s":10,"i":"10.2","l":"تطبيق","t":"مضت ستة أشهر على تنفيذ خطة IFSP لطفل، وتشير البيانات إلى أنه حقق نتيجته الأولى في روتيني اللعب والوجبة. ما الإجراء الأنسب؟","o":["مراجعة البيانات مع الأسرة وتحديث النتائج والخدمات وفق التقدم والأولويات.","إبقاء الخطة كما هي حتى يحين موعد إعادة التقييم السنوي الشامل.","إيقاف الخدمات المقدمة كلها لأن الطفل حقق النتيجة المستهدفة في الخطة.","رفع صعوبة النشاط نفسه تدريجيًّا دون الرجوع إلى الأسرة أو مناقشتها في التعديل."],"a":0,"w":"تُراجع IFSP كل ستة أشهر على الأقل، مع إعادة تقييم سنوية. وعند تحقق النتيجة وظهور التعميم، تُستخدم البيانات مع الأسرة لتحديث الخطة بنتيجة تالية ذات أولوية أو مستوى استقلال أعلى، لا لتجميدها أو إيقافها.","n":["صحيح: مراجعة مشتركة وتحديث مبني على البيانات.","تجميد للخطة رغم حلول موعد المراجعة الدورية.","تحقق نتيجة لا يعني انتهاء جميع الاحتياجات.","قرار أحادي يتجاوز الأسرة في التخطيط."],"c":"مضت ستة أشهر ... حقق نتيجته","p":"IFSP تُراجع كل 6 أشهر على الأقل وتُحدَّث بالبيانات مع الأسرة."},{"id":"10-19","s":10,"i":"10.2","l":"تحليل","t":"راجعت مشرفة خطة IFSP لطفل فوجدت فيها: تقييمًا نمائيًّا شاملًا، وخمس جلسات أسبوعية في المركز لثلاثة مختصين، وأهدافًا كتبها كل مختص لتخصصه منفصلة، دون أي ذكر لروتين الأسرة أو أولوياتها. ما الخلل الأبرز؟","o":["غياب أولويات الأسرة وروتينها، وتجزئة الأهداف بين التخصصات بدل نتائج مشتركة.","قلة عدد الجلسات الأسبوعية مقارنة باحتياجات الطفل النمائية المتعددة والمتشابكة.","الاعتماد على تقييم نمائي شامل بدل تقييم طبي تشخيصي مفصل لحالة الطفل.","تقديم الخدمات في المركز بدل المستشفى حيث تتوافر تجهيزات تخصصية أكثر."],"a":0,"w":"IFSP خطة متمحورة حول الطفل والأسرة، تتضمن مخاوف الأسرة وأولوياتها ومواردها، وتنسق الخدمات حول نتائج مشتركة في البيئة الطبيعية. والخطة الموصوفة قائمة خدمات مجزأة يقودها المختصون، وهذا جوهر الخلل لا عدد الجلسات.","n":["صحيح: غياب الأسرة وتجزئة الأهداف.","كثرة الجلسات ليست دليلًا على جودة الخطة.","التقييم النمائي الشامل نقطة قوة لا خلل.","يبتعد أكثر عن البيئة الطبيعية."],"c":"دون أي ذكر لروتين الأسرة أو أولوياتها","p":"IFSP بلا أولويات الأسرة ونتائج مشتركة = قائمة خدمات لا خطة أسرية."},{"id":"10-20","s":10,"i":"10.2","l":"تحليل","t":"صاغ الفريق لطفلة عمرها سنة ونصف لديها تأخر نمائي نتيجةً في خطة IFSP نصها: «أن تكتب الطفلة الحروف الهجائية الأولى». ما التحليل الأدق لهذه النتيجة؟","o":["مناسبة؛ لأنها تهيئ الطفلة مبكرًا لمتطلبات المرحلة المدرسية القادمة.","مناسبة إذا أضيفت إليها نسبة إتقان ومدة زمنية محددة لقياس تحققها.","لا تناسب مرحلتها النمائية؛ والأولى أهداف لغوية واجتماعية وحركية وعناية بالذات.","غير مناسبة فقط؛ لأن تعليم الكتابة من اختصاص معلم الصف في المدرسة لا فريق التدخل المبكر."],"a":2,"w":"صياغة أهداف أكاديمية بحتة لطفلة في هذا العمر خطأ متكرر؛ لأنها لا تناسب المرحلة النمائية. والصواب التركيز على المهارات اللغوية والاجتماعية والحركية والعناية بالذات داخل الروتين اليومي. وإضافة معيار قياس لا تصلح هدفًا غير ملائم نمائيًّا.","n":["التهيئة المدرسية لا تبرر هدفًا غير ملائم نمائيًّا.","القياس لا يصلح هدفًا خاطئ المضمون.","صحيح: عدم ملاءمة نمائية وبديل وظيفي.","علة غير صحيحة؛ الخلل في الملاءمة النمائية."],"c":"سنة ونصف ... تكتب الحروف","p":"IFSP لطفل صغير ← أهداف نمائية وظيفية في الروتين، لا أكاديمية بحتة."},{"id":"10-21","s":10,"i":"10.2","l":"تحليل","t":"تضمنت خطة IFSP نتيجة نصها: «أن تتمكن الأم من تهدئة طفلها عند نوبات البكاء باستخدام استراتيجيتين متفق عليهما». اعترض أحد الأعضاء بأن هذه النتيجة لا مكان لها في الخطة لأنها لا تخص الطفل. ما التحليل الأدق؟","o":["الاعتراض غير دقيق؛ فخطة IFSP تتضمن نتائج أسرية تعين الأسرة على تلبية احتياجات طفلها.","الاعتراض صحيح؛ لأن نتائج الخطة تقتصر على مهارات الطفل النمائية وحدها.","الاعتراض صحيح؛ لأن النتائج الأسرية تُكتب في خطة مستقلة يعدها الأخصائي الاجتماعي وحده.","الاعتراض غير دقيق؛ لأن الأم وحدها تحدد نتائج الخطة دون أي دور للفريق في ذلك."],"a":0,"w":"من سمات IFSP أنها تشمل نتائج تخص الأسرة لا الطفل وحده، ويعبر عنها «بيان النتائج الأسرية» الذي يتضمن ما تريد الأسرة تحقيقه لنفسها ولطفلها. وهذه النتائج تزيد قدرة الأسرة على تلبية احتياجات طفلها اليومية، وتُصاغ بالشراكة مع الفريق.","n":["صحيح: النتائج الأسرية جزء أصيل من IFSP.","يحصر الخطة في الطفل ويتجاهل طبيعتها الأسرية.","لا فصل كهذا للنتائج الأسرية عن الخطة.","القرار تشاركي بين الأسرة والفريق لا فردي."],"c":"أن تتمكن الأم","p":"IFSP تتضمن نتائج للأسرة وللطفل معًا."},{"id":"10-22","s":10,"i":"10.3","l":"معرفة","t":"تتابع أسرة الطالب واجبات القراءة القصيرة في المنزل، وتستثمر وقت إعداد الطعام لتدريبه على القياس والعد. ما نوع المشاركة الأسرية الذي يمثله ذلك؟","o":["المشاركة التواصلية.","المشاركة المجتمعية التطوعية.","المشاركة في صنع القرار.","المشاركة المنزلية."],"a":3,"w":"المشاركة المنزلية هي الدعم والأنشطة التي تقوم بها الأسرة داخل المنزل لتعزيز التعلم المدرسي ومراجعة المهارات وتعميمها، ومن مؤشراتها: الواجبات، والروتين المنزلي، والتدريب البيتي.","n":["التواصلية تبادل معلومات وتقارير، لا تطبيق مهارات.","المجتمعية ترتبط بالفعاليات والتطوع العام.","صنع القرار يرتبط بأهداف الخطة وخدماتها.","صحيح: دعم التعلم وتعميمه داخل الروتين المنزلي."],"c":"في المنزل ... وقت إعداد الطعام","p":"تطبيق المهارة في البيت والروتين = مشاركة منزلية."},{"id":"10-23","s":10,"i":"10.3","l":"معرفة","t":"أي الأمثلة الآتية يمثل المشاركة الأسرية في صنع القرار؟","o":["مناقشة الأسرة أهداف الخطة الفردية ومشاركتها في اختيار الخدمات.","إرسال الأسرة ملاحظاتها اليومية عبر دفتر المتابعة.","حضور الأسرة معرض الأنشطة السنوي الذي تقيمه المدرسة.","تطبيق الأسرة نشاطًا منزليًّا قصيرًا اقترحه معلم غرفة المصادر لابنها."],"a":0,"w":"المشاركة في صنع القرار انخراط الأسرة عضوًا فاعلًا في وضع الخطة التربوية الفردية، وتحديد الأهداف، واختيار البدائل والخدمات؛ أي صلاحية فعلية في تصميم الخطة. أما المعرض فمشاركة مجتمعية، والدفتر مشاركة تواصلية، والنشاط المنزلي مشاركة منزلية.","n":["صحيح: تأثير فعلي في الأهداف والخدمات.","مشاركة تواصلية.","مشاركة مجتمعية تطوعية.","مشاركة منزلية."],"c":"المشاركة الأسرية في صنع القرار","p":"أهداف + خدمات + اختيار بين بدائل = صنع قرار."},{"id":"10-24","s":10,"i":"10.3","l":"معرفة","t":"ما الذي يميز المشاركة المجتمعية التطوعية عن المشاركة في صنع القرار؟","o":["المجتمعية أنشطة عامة وتطوع لا يرتبط مباشرة بالخطة الفردية، وصنع القرار تأثير في أهدافها.","المجتمعية تحدث داخل المدرسة وحدها، وصنع القرار يحدث خارجها في مؤسسات المجتمع المحلي المختلفة.","المجتمعية أعلى مستويات المشاركة الأسرية، وصنع القرار مستوى تمهيدي يسبق التواصل مع الأسرة.","المجتمعية تتطلب توقيع الأسرة على الخطة الفردية، وصنع القرار يكتفي بحضورها الاجتماعات."],"a":0,"w":"المشاركة المجتمعية التطوعية مشاركة في الأنشطة والفعاليات العامة والتطوع لإثراء المجتمع المدرسي، وهي نشاط عام لا يرتبط مباشرة بالخطة الفردية. أما صنع القرار فصلاحية فعلية في تحديد أهداف الخطة وخدماتها، وهو من أعمق صور المشاركة.","n":["صحيح: نشاط عام مقابل تأثير في الخطة الفردية.","المكان ليس معيار التمييز بين النوعين.","يقلب المستويات؛ صنع القرار من أعمقها.","التوقيع والحضور وحدهما لا يثبتان صنع القرار."],"c":"المجتمعية التطوعية ... صنع القرار","p":"تطوع وفعاليات = مجتمعية؛ أهداف الخطة وخدماتها = صنع قرار."},{"id":"10-25","s":10,"i":"10.3","l":"تطبيق","t":"تريد أم الطالبة شهد مساعدتها في استراتيجية التلخيص التي تتعلمها في غرفة المصادر، لكنها لا تعرف كيف تطبقها. ما الإجراء الأنسب وفق استراتيجية «الوالد بوصفه معلمًا مساعدًا» (Parent-as-Co-Teacher)؟","o":["نمذجة المعلمة للاستراتيجية، فملاحظة الأم، فالتطبيق الموجّه، ثم التغذية الراجعة.","إرسال ورقة تشرح خطوات الاستراتيجية بالتفصيل لتطبقها الأم في المنزل وحدها دون متابعة.","دعوة الأم إلى حضور حصص غرفة المصادر يوميًّا طوال الفصل الدراسي كاملًا.","تكليف الطالبة بشرح الاستراتيجية لأمها في المنزل لتعزيز فهمها هي أيضًا."],"a":0,"w":"تهدف الاستراتيجية إلى نقل أثر التدخل من غرفة المصادر إلى المنزل وتعميم المهارة، وتسير خطواتها: نمذجة المعلم، فملاحظة الأسرة، فالتطبيق الموجّه، ثم التغذية الراجعة والتقييم. والتدريب العملي أقوى من التعليمات المكتوبة وحدها.","n":["صحيح: نمذجة ← ملاحظة ← تطبيق موجّه ← تغذية راجعة.","التعليمات المكتوبة وحدها لا تبني الكفاءة العملية.","حضور طويل غير عملي ولا يتضمن تطبيقًا موجّهًا.","ينقل مهمة التدريب إلى الطالبة دون ضمان الدقة."],"c":"لا تعرف كيف تطبقها","p":"تدريب الأسرة الفعال: نمذجة ← ملاحظة ← ممارسة موجّهة ← تغذية راجعة."},{"id":"10-26","s":10,"i":"10.3","l":"تطبيق","t":"أسرة الطالب ياسر متحمسة لدعمه، فصارت تكلفه يوميًّا بساعة من أوراق العمل الإضافية حتى أصبح يرفض الدراسة ويبكي. ما التوجيه الأنسب للأسرة؟","o":["الاستمرار في الأوراق نفسها مع إضافة مكافأة بعد إكمالها لتقليل رفضه وبكائه.","نشاط قصير ممتع مرتبط بهدف واضح يُدمج في الروتين، مع تغذية راجعة متبادلة.","إيقاف أي دعم منزلي نهائيًّا وترك التعلم كله لغرفة المصادر والمدرسة.","تقليل الأوراق إلى النصف يوميًّا مع إبقاء طبيعتها ومحتواها كما هما."],"a":1,"w":"المشاركة المنزلية الفعالة قصيرة ومرنة وممتعة ومرتبطة بهدف واضح، ومن الأخطاء الشائعة إثقال الأسرة بواجبات طويلة تحول المنزل إلى صف صارم وتخلق صراعًا يوميًّا. والبديل نشاط قصير مدمج في الروتين مع تبادل الملاحظات.","n":["المكافأة لا تعالج طبيعة المهمة المرهقة.","صحيح: قصير وممتع وهادف ومدمج في الروتين.","يحرم الطالب من دعم منزلي مفيد.","يقلل الكم ولا يغير الطبيعة غير الوظيفية."],"c":"ساعة من أوراق العمل ... يرفض الدراسة","p":"الدعم المنزلي الجيد قصير وممتع ومرتبط بهدف، لا صف إضافي."},{"id":"10-27","s":10,"i":"10.3","l":"تطبيق","t":"عرض والد أحد طلاب غرفة المصادر، وهو مصمم جرافيك، أن يتطوع لتجهيز لوحات إرشادية مصورة في ممرات المدرسة. ما الاستجابة الأنسب من المعلم؟","o":["الاعتذار بلطف؛ لأن مشاركة الأسرة يجب أن ترتبط مباشرة بخطة ابنها الفردية وأهدافها.","عدّها مشاركة في صنع القرار وإشراكه في تحديد أهداف الطلاب الآخرين.","قبولها بشرط أن تُحسب بديلًا عن حضوره اجتماعات الخطة الفردية لابنه.","الترحيب بها بوصفها مشاركة تطوعية تثري البيئة المدرسية وتعزز انتماء الأسرة."],"a":3,"w":"المشاركة المجتمعية التطوعية صورة مشروعة من المشاركة الأسرية، تشمل الفعاليات والتطوع لخدمة المجتمع المدرسي، وتعزز الانتماء واستثمار طاقات الأهالي، ولو لم ترتبط مباشرة بالخطة الفردية. لكنها لا تحل محل مشاركة الأسرة في قرار ابنها، ولا تمنح صلاحية في خطط الآخرين.","n":["لا يشترط ارتباط كل مشاركة بالخطة الفردية.","تصنيف خاطئ يمس خصوصية الطلاب الآخرين.","التطوع لا يُغني عن المشاركة في قرار ابنه.","صحيح: تطوع يثري المدرسة ويعزز الانتماء."],"c":"يتطوع لتجهيز لوحات ... في ممرات المدرسة","p":"التطوع في المدرسة مشاركة مجتمعية مكمّلة، لا بديل عن صنع القرار."},{"id":"10-28","s":10,"i":"10.3","l":"تطبيق","t":"تشارك أسرة الطالبة رهف عبر رسائل أسبوعية فقط، ويرى الفريق أن الطالبة تحتاج إلى تعديل الخدمات المساندة في خطتها. ما الإجراء الأنسب؟","o":["إرسال القرار في الرسالة الأسبوعية القادمة مع شرح مبرراته وأثره المتوقع للأسرة بوضوح.","تأجيل التعديل حتى تتمكن الأسرة من حضور اجتماع حضوري في المدرسة.","دعوة الأسرة إلى مناقشة التعديل وبدائله مع الفريق بوسيلة تناسبها قبل القرار.","اتخاذ القرار داخل الفريق لأن الأسرة اختارت المشاركة التواصلية وحدها."],"a":2,"w":"المشاركة التواصلية تكفي لتبادل المعلومات، لكنها لا تكفي حين يحتاج الموقف إلى تأثير الأسرة في قرار يخص الخطة. والصواب إتاحة مشاركة حقيقية في صنع القرار بقناة مناسبة للأسرة، فالمشاركة تُقاس بوظيفتها لا بمكانها.","n":["إبلاغ بقرار متخذ لا مشاركة فيه.","اشتراط الحضور يؤخر الدعم دون مبرر.","صحيح: قرار يحتاج صنع قرار مشترك بقناة مناسبة.","يُقصي الأسرة من قرار يخص خطة ابنتها."],"c":"تعديل الخدمات المساندة في خطتها","p":"عندما يكون المطلوب قرارًا، لا يكفي التواصل؛ أشرك الأسرة في صنعه."},{"id":"10-29","s":10,"i":"10.3","l":"تحليل","t":"يبين سجل مشاركة أسرة الطالب مازن خلال الفصل: حضور 4 اجتماعات من 4، وتوقيع جميع المحاضر، وتنفيذ الأنشطة المنزلية بانتظام، ولا يتضمن أي محضر رأيًا أو مقترحًا للأسرة في أهداف الخطة. ما التفسير الأدق؟","o":["مشاركة منزلية قائمة يغيب عنها صنع القرار؛ فالحضور والتوقيع لا يثبتان التأثير.","مشاركة مكتملة وفاعلة؛ لأن الأسرة ملتزمة بالحضور والتوقيع والتنفيذ المنزلي بانتظام.","مشاركة مجتمعية؛ لأن الأسرة حاضرة في أنشطة المدرسة واجتماعاتها بانتظام.","ضعف في دافعية الأسرة يستدعي تنبيهها رسميًّا إلى أهمية إبداء رأيها في الخطة."],"a":0,"w":"البيانات تُظهر مشاركة منزلية فاعلة وحضورًا منتظمًا، لكن غياب أي أثر للأسرة في الأهداف يدل على أن مشاركتها في القرار شكلية؛ فالتوقيع والحضور وحدهما لا يثبتان صنع القرار. والمطلوب من الفريق إتاحة صوت حقيقي للأسرة لا لومها.","n":["صحيح: مشاركة منزلية مع صنع قرار شكلي.","يخلط بين الحضور والتأثير الفعلي.","حضور الاجتماعات ليس مشاركة مجتمعية.","يلوم الأسرة، والخلل في طريقة إدارة الفريق."],"c":"لا يتضمن أي محضر رأيًا للأسرة","p":"الحضور والتوقيع لا يساويان صنع القرار؛ ابحث عن أثر صوت الأسرة في الخطة."},{"id":"10-30","s":10,"i":"10.3","l":"تحليل","t":"يطبق الطالب استراتيجية حل المسائل الرياضية في غرفة المصادر، ثم ينساها فور عودته إلى المنزل. أي أشكال المشاركة الأسرية يعالج هذه المشكلة مباشرة؟","o":["المشاركة التواصلية عبر تقرير أسبوعي مفصل بدرجات الطالب وأخطائه في الرياضيات.","المشاركة المجتمعية عبر دعوة الأسرة إلى حضور فعاليات المدرسة العامة.","المشاركة في صنع القرار بإضافة هدف رياضي جديد إلى الخطة الفردية للطالب.","المشاركة المنزلية بدليل مبسط لتوظيف الاستراتيجية في مواقف يومية كالتسوق."],"a":3,"w":"المشكلة المحددة ضعف التعميم خارج غرفة المصادر، والمشاركة المنزلية هي المفتاح الأهم لتعميم المهارات في البيئة الطبيعية. لذا فالدليل المبسط لتوظيف الاستراتيجية في التسوق أو إعداد الطعام يطابق الوظيفة المطلوبة مباشرة.","n":["نقل الدرجات لا يوفر فرص تطبيق.","نشاط عام لا يرتبط بالمهارة المستهدفة.","الهدف قائم أصلًا؛ المشكلة في تعميمه.","صحيح: تعميم المهارة يحتاج تطبيقًا منزليًّا مدعومًا."],"c":"ينساها فور عودته إلى المنزل","p":"حدد وظيفة المشاركة أولًا: التعميم في البيت ← مشاركة منزلية."},{"id":"10-31","s":10,"i":"10.3","l":"تحليل","t":"تعتمد مدرسة طريقة واحدة لمشاركة جميع الأسر: اجتماعًا حضوريًّا شهريًّا في الساعة التاسعة صباحًا. ولاحظت معلمة صعوبات التعلم أن أسرًا عدة لا تحضر رغم تواصلها الجيد هاتفيًّا. ما التحليل الأدق؟","o":["غياب هذه الأسر دليل على ضعف اهتمامها، ويستدعي خفض توقعات مشاركتها.","الحل أن يتخذ الفريق القرارات عن الأسر الغائبة لتجنب تعطيل خطط أبنائها.","الطريقة عادلة؛ لأنها تُطبَّق على جميع الأسر بالتساوي ودون أي تمييز بينها.","توحيد الوسيلة لا يحقق العدالة؛ والمطلوب خيارات مرنة في القناة والتوقيت."],"a":3,"w":"عدم حضور الأسرة لا يثبت عدم اهتمامها، فقد توجد حواجز وقت أو وصول؛ والتواصل الهاتفي الجيد قرينة على ذلك. والعدالة تتطلب مرونة في الوصول لا تطابق الوسائل، مع الحفاظ على فرصة كل أسرة في التأثير في القرار.","n":["يحكم بعدم الاهتمام رغم قرينة التواصل الجيد.","يُلغي حق الأسرة في القرار.","المساواة الشكلية تُقصي أسرًا لها ظروف مختلفة.","صحيح: مرونة القناة والتوقيت تحفظ المشاركة."],"c":"لا تحضر رغم تواصلها الجيد هاتفيًّا","p":"العدالة في المشاركة = مرونة في الوصول، لا وسيلة واحدة للجميع."},{"id":"10-32","s":10,"i":"10.4","l":"معرفة","t":"ما الترتيب الصحيح لسحب المساعدة المتدرج (Prompt Fading) عند تدريب الطالب على مهارة جديدة؟","o":["مساعدة جزئية ← أداء مستقل ← مساعدة كاملة ← تلميح خفيف.","تلميح خفيف ← مساعدة جزئية ← مساعدة كاملة ← أداء مستقل.","أداء مستقل ← تلميح خفيف ← مساعدة جزئية ← مساعدة كاملة.","مساعدة كاملة ← مساعدة جزئية ← تلميح خفيف ← أداء مستقل."],"a":3,"w":"يُسحب الدعم متدرجًا: دعم كامل عند بدء المهارة، ثم جزئي، ثم تلميح بصري أو لفظي خفيف، ثم أداء مستقل، مع مراقبة قدرة الطالب على التعميم في مواقف جديدة.","n":["تسلسل مضطرب لا منطق تدريجيًّا فيه.","يبدأ بالأقل ثم يزيد، وهذا عكس التلاشي.","تسلسل معكوس يزيد الاعتماد.","صحيح: من الأكثر دعمًا إلى الاستقلال."],"c":"سحب المساعدة المتدرج","p":"كامل ← جزئي ← تلميح ← استقلال، ويُقرَّر الانتقال بالبيانات."},{"id":"10-33","s":10,"i":"10.4","l":"معرفة","t":"ما المقصود بتمكين الأسرة (Family Empowerment) في التربية الخاصة؟","o":["متابعة التزام الأسرة بتنفيذ تعليمات المعلم ومحاسبتها رسميًّا عند أي تقصير منها.","إكساب الأسرة المعرفة والمهارات والثقة لدعم طفلها والمشاركة في القرار.","تحويل الأسرة إلى معلم بديل يتولى التدريس المتخصص لطفلها في المنزل.","تزويد الأسرة بأكبر قدر ممكن من المعلومات النظرية عن إعاقة طفلها."],"a":1,"w":"تمكين الأسرة إكسابها المعرفة والمهارات والثقة والقدرة على استخدام مواردها لدعم طفلها والمشاركة الفاعلة في القرارات. ودور المعلم فيه التدريب والتنظيم والتمكين، لا المراقبة العقابية أو التقييم الإداري للأسرة.","n":["مراقبة إدارية عقابية، لا تمكين.","صحيح: معرفة ومهارة وثقة ومشاركة في القرار.","التمكين لا يحمّل الأسرة دور المختص.","المعلومات وحدها لا تبني القدرة العملية."],"c":"تمكين الأسرة","p":"التمكين = رفع قدرة الأسرة وثقتها، لا مراقبتها ولا تحويلها إلى مختص."},{"id":"10-34","s":10,"i":"10.4","l":"تطبيق","t":"تشكو والدة الطالبة دانة من أن جلسة القراءة المسائية التي تستغرق ساعة كاملة تنتهي غالبًا بالبكاء والصراخ، وتشعر بالعجز عن مساعدتها. ما التوجيه الأنسب؟","o":["الإصرار على إكمال الساعة كاملة يوميًّا حتى تعتاد الطالبة الالتزام والانضباط.","إيقاف القراءة المنزلية نهائيًّا وترك مهمة القراءة كلها لمعلمة غرفة المصادر.","الإنصات دون لوم، ثم تقسيم القراءة إلى فترات قصيرة ممتعة ومتابعة الأثر أسبوعيًّا.","إحالة الطالبة إلى المرشد الطلابي لعلاج رفضها للقراءة وتعديل سلوكها في المنزل والمدرسة."],"a":2,"w":"الموقف يحتاج إلى الإنصات للأم دون لوم، وإيقاف التكليف الطويل، وتقسيم القراءة إلى فترات قصيرة ممتعة، ثم متابعة الأثر أسبوعيًّا وتخفيف المساعدة تدريجيًّا. ومن الأمثلة الداعمة القراءة المشتركة 10–15 دقيقة يوميًّا دون ضغط، يقرأ فيها الوالد جزءًا والطالبة جزءًا.","n":["الإصرار يزيد التوتر والنفور ويقوض الشراكة.","يحرم الطالبة من دعم منزلي مفيد.","صحيح: إنصات ثم مهام قصيرة ممتعة ومتابعة.","يفسر المشكلة بالطالبة بدل تعديل طبيعة المهمة."],"c":"ساعة كاملة ... تنتهي بالبكاء","p":"صراع المذاكرة ← أنصت، وقصّر المهمة، واجعلها ممتعة، وتابع الأثر."},{"id":"10-35","s":10,"i":"10.4","l":"تطبيق","t":"يحل والد الطالب تركي واجبات الرياضيات عن ابنه كاملة حتى لا يتأخر في تسليمها. ما التوجيه الأنسب للوالد؟","o":["تدريبه على تقديم تلميحات وأسئلة موجهة ثم سحب الدعم تدريجيًّا.","منعه من تقديم أي مساعدة حتى يعتمد الطالب على نفسه تمامًا من الآن.","إقناعه بترك الواجبات للمدرسة لأنها مسؤولية المعلم لا الأسرة.","تكليف معلم خصوصي بحل الواجبات مع الطالب بدلًا من الوالد."],"a":0,"w":"حل المهام نيابة عن الطالب يكرس الاعتمادية ويخفي مستواه الحقيقي، والمنع الكامل للمساعدة يتركه دون دعم. والتوجيه الأنسب تدريب الوالد على التلميح والأسئلة الموجهة ثم سحب الدعم تدريجيًّا حتى الأداء المستقل.","n":["صحيح: تلميحات وأسئلة موجهة ثم سحب تدريجي.","الانتقال المفاجئ إلى انعدام الدعم يتركه دون سند.","يُقصي الأسرة من دورها الداعم.","يستبدل مساعدًا بآخر دون معالجة نمط المساعدة."],"c":"يحل ... الواجبات عن ابنه كاملة","p":"لا تمنع مساعدة الأسرة؛ درّبها على التلميح ثم سحب الدعم تدريجيًّا."},{"id":"10-36","s":10,"i":"10.4","l":"تطبيق","t":"يرغب الطالب بندر (14 عامًا) في الذهاب وحده إلى بقالة الحي المجاورة لشراء غرض بسيط، لكن أسرته ترفض خوفًا عليه من عبور الشارع. ما الإجراء الأنسب لتعزيز استقلاله؟","o":["تأييد الأسرة في منعه حتى يتقن قواعد السلامة المرورية نظريًّا بصورة كاملة.","أن تشتري الأسرة الغرض عنه وتصطحبه معها ليكتفي بالمشاهدة في كل مرة.","السماح له بالذهاب وحده فورًا لأن الاستقلال يُبنى بالتجربة المباشرة وحدها.","تحليل المخاطر مع الأسرة وتدريبه تدريجيًّا على خطوات آمنة بإشراف يتناقص."],"a":3,"w":"السلامة جزء من التخطيط للاستقلال، لكنها لا تعني منع المحاولة. فالإجراء الأنسب يحلل المخاطر، ويختار خطوات آمنة مناسبة لقدراته، ويدربه في الموقف الحقيقي بإشراف يتناقص بقدر ما تسمح البيانات، فيجمع بين الأمان وبناء الاستقلال.","n":["الشرح النظري وحده لا يبني الاستقلال، والمنع يلغي الفرصة.","يُبقيه متلقيًا سلبيًّا ويكرس الاعتماد.","يتجاهل خطرًا حقيقيًّا لم يُدرَّب عليه.","صحيح: استقلال مدعوم ومتدرج مع السلامة."],"c":"خوفًا عليه من عبور الشارع","p":"خطر حقيقي + هدف استقلالي ← تدريب متدرج بإشراف يتناقص، لا منع ولا مجازفة."},{"id":"10-37","s":10,"i":"10.4","l":"تطبيق","t":"بعد أسبوع من التدريب، صار الطالب ريان يرتب حقيبته بنجاح باستخدام لوحة مصورة ومساعدة مباشرة من أمه. ما الخطوة التالية الأنسب؟","o":["استمرار مساعدة الأم اليومية المباشرة لضمان عدم نسيان أي أداة مدرسية.","سحب اللوحة المصورة فورًا ليعتمد على ذاكرته وحدها في ترتيب الحقيبة.","الاكتفاء بتلميح لفظي، ثم مراجعته اللوحة بنفسه، وصولًا إلى الترتيب المستقل.","تكليف معلم الفصل بمراجعة الحقيبة يوميًّا عند وصول الطالب إلى المدرسة صباحًا."],"a":2,"w":"النجاح مع دعم ثابت يتطلب تلاشيًا منظمًا: من المساعدة المباشرة إلى تلميح لفظي، ثم مراجعة الطالب اللوحة بنفسه، حتى يرتب حقيبته مستقلًا ويطلب المساعدة عند الحاجة فقط. واللوحة أداة تنظيم ذاتي لا ينبغي سحبها فجأة.","n":["يكرس الاعتماد رغم ظهور النجاح.","سحب مفاجئ لأداة تدعم التنظيم الذاتي.","صحيح: تلاشٍ متدرج نحو الأداء المستقل.","ينقل الاعتماد من الأم إلى المعلم."],"c":"يرتب حقيبته بنجاح ... مساعدة مباشرة","p":"نجح بالدعم؟ ابدأ التلاشي المنظم، لا الاستمرار ولا السحب المفاجئ."},{"id":"10-38","s":10,"i":"10.4","l":"تطبيق","t":"تقارن والدة الطالب خالد مستوى قراءته بمستوى أخيه الأصغر أمامه، فأصبح يتجنب القراءة ويقول: «أنا لا أفهم مثل أخي». ما التوجيه الأنسب للأم؟","o":["تشجيعها على الاستمرار في المقارنة لأنها تحفز الطالب على بذل جهد أكبر في القراءة.","توجيهها إلى مقارنة خالد بأدائه السابق والاحتفاء بتقدمه مهما كان صغيرًا.","توجيهها إلى مقارنته بزملائه في الصف بدلًا من أخيه الأصغر في المنزل.","إخفاء نتائج خالد عن الأم حتى لا تتكرر المقارنة بينه وبين أخيه."],"a":1,"w":"المقارنة بالأقران أو الإخوة تُضعف الثقة والدافعية، والإجراء الصحيح مقارنة الطالب بأدائه السابق؛ فالاحتفاء بالتقدم الصغير يبني الثقة ويعزز الاستمرار. وحجب المعلومات عن الأسرة يضر الشراكة.","n":["المقارنة محبطة وتُضعف الدافعية.","صحيح: مقارنة بأدائه السابق والاحتفاء بالتقدم.","تغيير طرف المقارنة لا يزيل أثرها.","حجب البيانات يهدم الشفافية والشراكة."],"c":"تقارن ... بمستوى أخيه الأصغر","p":"قارن الطالب بنفسه، واحتفِ بالتقدم الصغير."},{"id":"10-39","s":10,"i":"10.4","l":"تطبيق","t":"تريد أسرة الطالبة لين تدريبها على اتخاذ القرار في المنزل، لكنها تتردد طويلًا عندما يُطلب منها اختيار ما تفعله في وقت فراغها. ما الاستراتيجية الأنسب للبدء؟","o":["ترك جميع قرارات وقت الفراغ لها لتتعلم من أخطائها بنفسها.","أن تختار الأسرة النشاط عنها دائمًا حتى تتجاوز ترددها الحالي.","عرض اختيارات محدودة كترتيب مهمتين مقبولتين، ثم توسيعها تدريجيًّا.","تأجيل تدريب اتخاذ القرار حتى تكبر وتزداد ثقتها بنفسها تلقائيًّا مع الوقت."],"a":2,"w":"الاختيارات المحدودة استراتيجية لتدريب اتخاذ القرار، مثل اختيار ترتيب مهمتين مقبولتين، ثم يُوسَّع نطاق الاختيار تدريجيًّا مع الحفاظ على نجاحها. فالاختيار جزء من الاستقلال وتقرير المصير، ويحتاج فرصًا مدعومة لا ترك الأمر كله لها ولا سلبه منها.","n":["قفزة تفوق قدرتها الحالية على الاختيار.","يسلبها فرصة التدريب ويكرس الاعتماد.","صحيح: اختيارات محدودة تتسع تدريجيًّا.","تأجيل بلا مبرر لمهارة تُبنى بالممارسة."],"c":"تتردد طويلًا عندما يُطلب منها اختيار","p":"لتعليم اتخاذ القرار: ابدأ باختيارين مقبولين ثم وسّع."},{"id":"10-40","s":10,"i":"10.4","l":"تحليل","t":"سجلت أسرة الطالب فراس أداءه في روتين الصباح المكون من ست خطوات: الأسبوع الأول نجح يومين من 5 مع تلميح في كل خطوة، والثاني 4 من 5 مع تلميح في أربع خطوات، والثالث 5 من 5 مع تلميح في ثلاث خطوات. وتقترح الأم إيقاف التلميحات كلها لأن «مدة التدريب المقررة انتهت». ما القرار الأدق؟","o":["إيقاف التلميحات كلها دفعة واحدة؛ لأن مدة التدريب المقررة قد انتهت فعلًا.","الاستمرار بالتلميحات نفسها حتى يكمل شهرًا آخر دون أي خطأ في الروتين.","العودة إلى التلميح في كل خطوة لضمان ثبات المهارة قبل البدء في التلاشي.","مواصلة سحب التلميح تدريجيًّا في الخطوات المتبقية وفق بيانات إتقان كل خطوة."],"a":3,"w":"معيار تلاشي الدعم هو أداء الطالب المستقر وبيانات نجاحه مع مستوى الدعم الحالي، لا مرور مدة زمنية ثابتة أو رغبة الأسرة. والبيانات هنا تُظهر تحسنًا مستمرًا مع بقاء حاجة إلى التلميح في ثلاث خطوات، فالقرار المناسب مواصلة سحب التلميح تدريجيًّا في الخطوات الثلاث المتبقية وفق إتقان كل منها، لا إيقافه دفعة واحدة.","n":["المبرر الزمني خاطئ، والسحب الدفعي يتجاهل خطوات لم تُتقن.","يتجاهل تحسنًا واضحًا ويؤخر الاستقلال.","تراجع في الدعم يعاكس اتجاه البيانات.","صحيح: التلاشي قرار مبني على بيانات الأداء."],"c":"تلميح في ثلاث خطوات ... مدة التدريب انتهت","p":"التلاشي يتبع بيانات الإتقان خطوة بخطوة، لا التقويم الزمني."},{"id":"10-41","s":10,"i":"10.4","l":"تحليل","t":"أبلغ المعلم أسرة الطالب نايف بأنه «أتقن» استراتيجية تنظيم الواجبات، مستندًا إلى أدائه الصحيح لها في غرفة المصادر خمس مرات متتالية. لكن الأسرة تلاحظ أنه لا يستخدمها في المنزل، ويؤكد معلم الفصل ذلك. ما التحليل الأدق؟","o":["المهارة متقنة ومعممة، وعدم استخدامها خارج غرفة المصادر مشكلة دافعية لديه.","ملاحظات الأسرة ومعلم الفصل أقل دقة من بيانات غرفة المصادر المنظمة والموثقة يوميًّا.","اكتُسبت في سياق واحد ولم تُعمَّم بعد؛ فيلزم تخطيط استخدامها في الفصل والمنزل.","يجب إعادة تدريس الاستراتيجية من البداية لأن الطالب لم يتعلمها فعليًّا بعد."],"a":2,"w":"النجاح داخل غرفة المصادر وحدها لا يساوي التعميم؛ فالتعميم قدرة الطالب على استخدام المهارة في بيئات ومواقف ومع أشخاص مختلفين. وبيانات الأسرة ومعلم الفصل تكشف أن المهارة مكتسبة لكنها غير معممة، فيلزم التخطيط لنقلها إلى الفصل العام والمنزل.","n":["يخلط بين الاكتساب والتعميم ويلوم الطالب.","بيانات الأسرة مصدر مهم من البيئة الطبيعية.","صحيح: مكتسبة في سياق واحد وتحتاج تخطيط تعميم.","المهارة مكتسبة فعلًا؛ المطلوب تعميمها لا إعادة تدريسها."],"c":"في غرفة المصادر ... لا يستخدمها في المنزل","p":"لا تعدّ المهارة معممة حتى تظهر في الفصل العام والمنزل والمجتمع."},{"id":"11-01","s":11,"i":"11.1","l":"معرفة","t":"بأي الأسماء التالية ارتبط اختيار مصطلح «صعوبات التعلم» في مؤتمر شيكاغو عام 1963م؟","o":["صموئيل أورتون","ألفريد شتراوس","هيلمر ميكلبست","صموئيل كيرك"],"a":3,"w":"يرتبط صموئيل كيرك باختيار مصطلح «صعوبات التعلم» في مؤتمر شيكاغو عام 1963م، وهو المصطلح الذي جمع حالات كانت توصف بتسميات متفرقة. ولا يعني ذلك أنه أول من درس هذه الحالات؛ فجذور المجال أقدم من المصطلح بعقود.","n":["أورتون يرتبط تاريخيًّا بعسر القراءة واللغة المكتوبة.","شتراوس يرتبط بالأطفال ذوي الإصابات الدماغية والبيئات قليلة المشتتات.","ميكلبست من الأسماء البارزة في اللغة واضطرابات التعلم، لا صاحب المصطلح.","صحيح: كيرك صاحب المصطلح الذي اختير في مؤتمر 1963م."],"c":"اختيار المصطلح ... عام 1963م","p":"1963م + مؤتمر شيكاغو + اختيار المصطلح = كيرك."},{"id":"11-02","s":11,"i":"11.1","l":"معرفة","t":"أي الإسهامات التالية يرتبط تاريخيًّا بألفريد شتراوس وزميلته لورا ليهتينن؟","o":["دراسة عسر القراءة وربطه باللغة المكتوبة وبالسيطرة النصفية للدماغ عند الأطفال","تأسيس جمعية أولياء الأمور التي تشكلت عقب مؤتمر شيكاغو مباشرة لخدمة الطلاب","وصف خصائص الأطفال ذوي الإصابات الدماغية وتصميم بيئات تعليمية قليلة المشتتات","تطوير نموذج الاستجابة للتدخل ومستويات الدعم المتدرجة في المدارس الحديثة"],"a":2,"w":"يرتبط ألفريد شتراوس، بالتعاون مع لورا ليهتينن، بوصف خصائص الأطفال ذوي الإصابات الدماغية وتصميم بيئات تعليمية قليلة المشتتات، وهو ما يضعه في الجذور الطبية العصبية المبكرة للمجال.","n":["إسهام يرتبط بصموئيل أورتون.","تأسيس الجمعية من ملامح المرحلة المؤسسية بعد المؤتمر.","صحيح: من أبرز إسهامات المرحلة الطبية العصبية المبكرة.","من سمات المرحلة المعاصرة لا المرحلة المبكرة."],"c":"شتراوس وليهتينن","p":"شتراوس = إصابة دماغية + بيئة قليلة المشتتات."},{"id":"11-03","s":11,"i":"11.1","l":"تحليل","t":"وصف مرجع قديم طفلًا بأن لديه «تلفًا دماغيًّا بسيطًا» يفسر تشتته وصعوبة تعلمه. ما الفهم الأدق لهذا الوصف اليوم؟","o":["تسمية تاريخية من المرحلة الطبية العصبية، لا ترادف المفهوم المعاصر","تشخيص معاصر دقيق يُعتمد عليه في تقارير القبول ببرامج صعوبات التعلم","مصطلح من المرحلة المعاصرة يرتبط بنموذج الاستجابة للتدخل ومستوياته","تسمية مرادفة لصعوبات التعلم أقرّها مؤتمر شيكاغو بديلًا رسميًّا عنها"],"a":0,"w":"مصطلح «تلف/خلل الدماغ البسيط» تسمية طبية تاريخية افترضت وجود إصابة دماغية طفيفة. ويُعرض لفهم تطور المجال، لكنه ليس مرادفًا دقيقًا للمفهوم المعاصر لصعوبات التعلم الذي لا يشترط إصابة دماغية ظاهرة.","n":["صحيح: تسمية تاريخية ضيقة لا تعريف حديث.","لم يعد يُستخدم تفسيرًا تشخيصيًّا دقيقًا.","ينتمي إلى الجذور المبكرة لا إلى المرحلة المعاصرة.","المؤتمر اختار مصطلح «صعوبات التعلم» لا هذه التسمية."],"c":"مرجع قديم ... تلفًا دماغيًّا بسيطًا","p":"لا تساوِ التسمية التاريخية القديمة بالمفهوم المعاصر."},{"id":"11-04","s":11,"i":"11.1","l":"تطبيق","t":"باحث في منتصف القرن العشرين ركّز على قياس الانتباه والذاكرة والإدراك واللغة، وصمّم برامج لتدريب هذه العمليات. إلى أي مرحلة تاريخية ينتمي عمله؟","o":["مرحلة التأسيس الطبي العصبي","مرحلة العمليات النفسية والنمائية","مرحلة التأسيس التربوي المؤسسي","المرحلة المعاصرة القائمة على البيانات"],"a":1,"w":"انتقلت مرحلة العمليات النفسية والنمائية بالتركيز من الدماغ إلى العمليات المؤثرة في اكتساب المهارات، كالانتباه والذاكرة والإدراك واللغة، فظهرت اختبارات هذه العمليات وبرامج تدريبها.","n":["تلك ركزت على إصابة الدماغ والتفسير العصبي.","صحيح: الانتباه والذاكرة والإدراك واللغة سمات هذه المرحلة.","تلك ركزت على المصطلح والهوية والحقوق والخدمات.","تلك تركز على التدخل المبكر ومراقبة التقدم والتقنية المساعدة."],"c":"الانتباه والذاكرة والإدراك واللغة","p":"عمليات (انتباه/ذاكرة/إدراك/لغة) = المرحلة النفسية النمائية."},{"id":"11-05","s":11,"i":"11.1","l":"تحليل","t":"لماذا اتجهت الممارسات المعاصرة إلى نموذج الاستجابة للتدخل (RTI) بدل الاعتماد الحصري على معيار التباين بين القدرة والتحصيل؟","o":["لأن معيار التباين ثبت أنه لا علاقة له بصعوبات التعلم على الإطلاق","لأن نموذج الاستجابة للتدخل اختبار ذكاء أدق من الاختبارات السابقة","لتقديم دعم مبكر متدرج ومراقبة التقدم بدل انتظار فشل أكاديمي كبير","لأن الأنظمة ألغت التقييم الشامل واكتفت بملاحظة المعلم الصفية وحدها"],"a":2,"w":"جاء نموذج الاستجابة للتدخل لتقليل الانتظار حتى يحدث فشل أكاديمي كبير؛ فهو يقدم تدريسًا عالي الجودة وتدخلًا متدرج الكثافة مع مراقبة متكررة للتقدم. ولا يلغي ذلك قيمة التباين بوصفه مفهومًا تاريخيًّا، ولا الحاجة إلى التقييم الشامل.","n":["التباين معيار تاريخي مهم، لكنه ليس الأداة الوحيدة.","النموذج تدخل متدرج ومراقبة تقدم، لا اختبار منفرد.","صحيح: تدخل مبكر + مستويات دعم + مراقبة تقدم.","التقييم الشامل ما زال أساس القرار."],"c":"بدل الاعتماد الحصري","p":"RTI = لا تنتظر الفشل: دعم مبكر + مستويات + بيانات."},{"id":"11-06","s":11,"i":"11.2","l":"تطبيق","t":"لا تتذكر جود اسم «المضلّع» عند سؤالها عنه، لكنها تذكره فور إعطائها المقطع الأول منه. ما التفسير الأرجح؟","o":["ضعف في الاسترجاع أكثر من فقد المعلومة من التخزين","المعلومة لم تُخزَّن أصلًا في الذاكرة طويلة المدى","ضعف في الانتباه منعها من استقبال المعلومة ابتداءً","قصور في اللوح البصري المكاني في الذاكرة العاملة"],"a":0,"w":"عندما يتذكر الطالب المعلومة بمجرد تقديم تلميح منظم، فهذه قرينة على أن المعلومة مخزنة نسبيًّا وأن الصعوبة في الوصول إليها. ويناسب ذلك تدريب الاسترجاع والمفاتيح الدلالية وخرائط الاستدعاء.","n":["صحيح: النجاح عند التلميح يدل على وجود المعلومة وصعوبة الوصول إليها.","لو لم تُخزَّن لما استدعاها التلميح فورًا.","لو لم تستقبلها لما ظهرت عند التلميح.","المهمة لفظية لا بصرية مكانية."],"c":"تذكره فور إعطائها المقطع الأول","p":"يتذكر عند التلميح = مشكلة استرجاع أكثر من تخزين."},{"id":"11-07","s":11,"i":"11.2","l":"معرفة","t":"أي سلوكيات الطالب التالية يعبّر عن «ما وراء المعرفة»؟","o":["يتوقف أثناء القراءة ويسأل نفسه: هل فهمت؟ ثم يعيد قراءة الفقرة","يحفظ تعريف المفهوم حرفيًّا كما ورد في الكتاب المدرسي دون تغيير","يقرأ الفقرة بسرعة ودقة عالية دون أن يخطئ في أي كلمة من كلماتها","ينفذ خطوات الحل كما كتبها المعلم على السبورة بالترتيب نفسه تمامًا"],"a":0,"w":"ما وراء المعرفة وعي المتعلم بتفكيره وقدرته على التخطيط والمراقبة والتقييم. فالطالب الذي يراقب فهمه ثم يغير استراتيجيته عند الحاجة يدير تفكيره، ولا يكتفي بأداء مهارة أكاديمية بعينها.","n":["صحيح: مراقبة الفهم وتعديل الاستراتيجية.","حفظ سطحي لا يتضمن إدارة التفكير.","طلاقة قرائية لا تعني مراقبة الفهم.","اتباع إجراء جاهز دون تخطيط أو مراقبة ذاتية."],"c":"يسأل نفسه: هل فهمت؟","p":"ما وراء المعرفة = أخطط، أراقب، أقيّم، أعدّل."},{"id":"11-08","s":11,"i":"11.2","l":"تحليل","t":"يفقد سلمان ترتيب الأصوات أثناء دمجها لقراءة كلمة جديدة، بينما يتتبع مسارات الخرائط ومواقع الأشكال بسهولة. أي مكوّن من مكونات الذاكرة العاملة في نموذج بادلي يبدو الأكثر تأثرًا؟","o":["اللوح البصري المكاني","المنفذ المركزي","الذاكرة طويلة المدى","الحلقة الصوتية"],"a":3,"w":"يتكون نموذج بادلي للذاكرة العاملة من حلقة صوتية للمعلومات اللفظية السمعية، ولوح بصري مكاني للأشكال والمسارات والمواقع، ومنفذ مركزي يتولى التنسيق. والتعثر في الاحتفاظ بتتابع الأصوات مع سلامة الأداء البصري المكاني يرجّح الحلقة الصوتية.","n":["أداؤه البصري المكاني سليم بحسب القرينة.","مكوّن التنسيق العام؛ وقصوره يظهر في المهام اللفظية والبصرية معًا.","ليست من مكونات الذاكرة العاملة، والمهمة احتفاظ آني أثناء المعالجة.","صحيح: تختص بالاحتفاظ بالمعلومات اللفظية السمعية كتتابع الأصوات."],"c":"ترتيب الأصوات ... بينما المسارات سليمة","p":"تتابع لفظي صوتي = حلقة صوتية؛ أشكال ومواقع = لوح بصري مكاني."},{"id":"11-09","s":11,"i":"11.2","l":"تطبيق","t":"بعد سنوات من الإخفاق في الكتابة، يرفض فهد المحاولة ويقول: «لن أستطيع مهما حاولت». أي إجراء ينسجم مع التفسير النظري لحالته؟","o":["زيادة كمية الكتابة اليومية المطلوبة منه لكسر رفضه بالتكرار والممارسة","إعفاؤه من الكتابة نهائيًّا حتى لا يتعرض لأي خبرة فشل جديدة في الصف","تذكيره بأن زملاءه ينجحون في المهمة نفسها بسهولة ودون عناء كل يوم","مهام قصيرة ينجح فيها، مع تغذية راجعة بنائية تربط نجاحه باستراتيجيته"],"a":3,"w":"العجز المتعلم استسلام متوقع ينتج عن خبرات فشل متراكمة. ويعالجه تصميم نجاحات صغيرة متدرجة وتغذية راجعة بنائية تربط النجاح بالجهد الفعال والاستراتيجية، فيستعيد الطالب توقع النجاح ودافعيته.","n":["يضاعف خبرات الفشل التي صنعت العجز.","يحرمه من المهارة ويثبّت توقعه بأنه لا يستطيع.","مقارنة تعمّق الإحباط ولا تبني الكفاءة.","صحيح: النجاحات الصغيرة والتغذية البنائية تعالج العجز المتعلم."],"c":"سنوات من الإخفاق ... لن أستطيع","p":"عجز متعلم = نجاحات صغيرة + تغذية راجعة بنائية."},{"id":"11-10","s":11,"i":"11.2","l":"تحليل","t":"قال معلم: «سأحدد نمط تعلّم كل طالب، فأدرّس البصري بالصور فقط والسمعي بالشرح فقط». ما الخلل في هذا القرار؟","o":["لا خلل فيه؛ فمطابقة نمط الطالب الحسي هي جوهر التدريس متعدد الحواس","متعدد الحواس دمجٌ للقنوات حول المهارة، لا مطابقة لأنماط تعلم ثابتة","الخلل أنه أغفل النمط الحركي الذي يناسب أغلب الطلاب ذوي صعوبات التعلم","الخلل أن تحديد نمط التعلم يتطلب اختبار ذكاء رسميًّا قبل بدء التدريس"],"a":1,"w":"التدريس متعدد الحواس يستخدم البصر والسمع والحركة واللمس بصورة مترابطة لتقوية الترميز، كرؤية الحرف ونطقه وسماعه وتتبعه باليد. ولا يعني ذلك وجود أنماط تعلم ثابتة يجب مطابقة كل طالب بها.","n":["يخلط بين الدمج الحسي ومطابقة أنماط ثابتة.","صحيح: الدمج المترابط للحواس، لا الفصل بينها وفق أنماط ثابتة.","يكرر الخطأ نفسه بإضافة نمط ثالث.","ربط لا أساس له بين نمط التعلم واختبار الذكاء."],"c":"بالصور فقط ... بالشرح فقط","p":"متعدد الحواس = دمج القنوات، لا مطابقة «نمط تعلم» ثابت."},{"id":"11-11","s":11,"i":"11.3","l":"تطبيق","t":"تغيّب نايف عن المدرسة فصلًا دراسيًّا كاملًا بسبب ظروف أسرية، وعاد بتحصيل منخفض في القراءة والرياضيات. ما الإجراء الأنسب قبل أي استنتاج؟","o":["إحالته مباشرة لتقييم صعوبات التعلم بسبب انخفاض تحصيله في مادتين","تصنيفه بطيء تعلم لأن ضعفه يظهر في أكثر من مجال دراسي في آن واحد","مراجعة تاريخه التعليمي وتقديم تعليم مكثف مناسب ومتابعة استجابته","منحه وقتًا إضافيًّا في جميع الاختبارات حتى نهاية العام الدراسي"],"a":2,"w":"انخفاض التحصيل وصف للنتيجة لا تفسير لسببها. والغياب الطويل قد يفسر الضعف، لذلك تُعالج فجوة فرص التعليم أولًا بتعليم مناسب، ثم تُتابع الاستجابة؛ فإن استمرت صعوبة نوعية رغم ذلك صار التقييم مبررًا.","n":["يقفز إلى التقييم قبل معالجة سبب واضح للضعف.","تصنيف متسرع لا تدعمه بيانات عن معدل تعلمه.","صحيح: نقص فرص التعلم تفسير بديل يُفحص ويُعالج أولًا.","تسهيل لا يعالج الفجوة التعليمية الناتجة عن الغياب."],"c":"تغيّب فصلًا دراسيًّا كاملًا","p":"قبل الحكم بصعوبة تعلم: افحص فرص التعليم، وقدّم تعليمًا جيدًا، وراقب الاستجابة."},{"id":"11-12","s":11,"i":"11.3","l":"تحليل","t":"طالبان: الأول يشارك بعمق في نقاش العلوم ويحل المسائل شفهيًّا، لكنه متعثر بشدة في القراءة منذ سنتين رغم التعليم المنتظم. والثاني يتقدم ببطء في القراءة والرياضيات والعلوم والمهارات اليومية. ما الحكم الأدق؟","o":["الأول أقرب إلى صعوبة نوعية، والثاني يستدعي تحليلًا مختلفًا لا تصنيفًا آليًّا","كلاهما من ذوي صعوبات التعلم لأن تحصيلهما منخفض في القراءة بوضوح ومنذ مدة","الأول بطيء تعلم، والثاني من ذوي صعوبات التعلم النمائية لاتساع مجالات تعثره","لا يمكن التمييز بين الطالبين إلا بدرجة ذكاء واحدة ذات حد فاصل ثابت ومحدد"],"a":0,"w":"صعوبات التعلم تتسم غالبًا بصعوبة نوعية أو تباين واضح بين جوانب الأداء، كقوة شفهية مع تعثر قرائي مستمر رغم التعليم المناسب. أما التقدم البطيء في معظم المجالات فيستدعي تحليلًا مختلفًا، ولا يصح الحسم بدرجة ذكاء واحدة.","n":["صحيح: التباين النوعي يميز صعوبات التعلم عن البطء العام.","انخفاض القراءة وحده لا يكفي، ونمطا الأداء مختلفان.","يعكس الوصفين؛ البطء العام صفة الثاني لا الأول.","القرار الحديث يعتمد صورة شاملة لا رقمًا واحدًا."],"c":"قوة شفهية وتعثر قرائي مقابل بطء عام","p":"ابحث عن التباين النوعي، لا عن انخفاض الدرجة فقط."},{"id":"11-13","s":11,"i":"11.3","l":"معرفة","t":"أي مما يلي مثال على صعوبات التعلم النمائية لا الأكاديمية؟","o":["أخطاء نمطية متكررة في تهجئة الكلمات المكتوبة","خلط مستمر في القيمة المكانية للأعداد عند الحساب","بطء ملحوظ في قراءة النصوص المكتوبة بصوت مرتفع","صعوبة تمييز الأصوات المتقاربة في الكلام المنطوق"],"a":3,"w":"تشمل الصعوبات النمائية عمليات أساسية كالانتباه والإدراك والذاكرة واللغة والتفكير، بينما تظهر الصعوبات الأكاديمية في القراءة والكتابة والتهجئة والرياضيات. والنوعان مترابطان؛ فضعف التمييز الصوتي قد يسهم لاحقًا في صعوبة القراءة.","n":["التهجئة مهارة أكاديمية.","القيمة المكانية مهارة رياضية أكاديمية.","قراءة النصوص مهارة أكاديمية.","صحيح: إدراك سمعي لغوي، وهو من العمليات النمائية."],"c":"النمائية لا الأكاديمية","p":"نمائية = عمليات (انتباه/إدراك/ذاكرة/لغة)، وأكاديمية = قراءة/كتابة/رياضيات."},{"id":"11-14","s":11,"i":"11.3","l":"تطبيق","t":"يخطئ طالب في الإملاء بخلط الأصوات المتقاربة، وأظهر فحص مدرسي أولي احتمال وجود ضعف سمعي لم يُصحَّح. ما الإجراء الأنسب أولًا؟","o":["تشخيصه بصعوبة تعلم في الإملاء لوضوح نمط أخطائه وتكرارها لديه","إحالته لتقييم السمع ومعالجته، ثم إعادة النظر في أدائه بعد ذلك","تكثيف تدريبات الوعي الصوتي معه دون الالتفات إلى مسألة السمع","استبعاده نهائيًّا من أي دعم تعليمي لوجود إعاقة حسية محتملة لديه"],"a":1,"w":"من عناصر تعريف صعوبات التعلم ألا تُفسَّر الحالة أساسًا بإعاقة حسية غير مصححة. لذلك يُفحص السمع ويُعالج أولًا، ثم يُعاد النظر في الأداء. ولا يعني الاستبعاد حرمان الطالب من الدعم أو استحالة تزامن الحالتين.","n":["يتجاهل عاملًا حسيًّا قد يفسر الأخطاء كلها.","صحيح: يُعالج التفسير الحسي البديل أولًا ثم يُعاد التقييم.","يعالج المظهر ويترك السبب المحتمل دون فحص.","الاستبعاد يمنع نسبة الصعوبة إلى تفسير خاطئ، ولا يحرم من الدعم."],"c":"ضعف سمعي لم يُصحَّح","p":"عامل حسي غير مصحح؟ عالجه أولًا ثم أعد التقييم."},{"id":"11-15","s":11,"i":"11.3","l":"تطبيق","t":"يصمّم عبدالله مجسمات علمية متقدمة ويقترح حلولًا إبداعية، لكنه يعجز عن تدوين أفكاره كتابيًّا بالسرعة والتنظيم المطلوبين. ما القرار الأنسب؟","o":["إيقاف أنشطة الإثراء مؤقتًا حتى يتقن مهارات الكتابة الأساسية إتقانًا تامًّا","تقييم مكونات الكتابة ودعمه بتدريس متخصص وتقنية مساعدة مع استمرار إثرائه","الاكتفاء بأنشطة الإثراء لأن موهبته العالية تعوّض ضعف الكتابة لديه مع الوقت","تفسير ضعف كتابته بقلة الدافعية لأنه قادر ومتميز في المجالات الأخرى كلها"],"a":1,"w":"قد تجتمع الموهبة مع صعوبة التعلم فيما يسمى الاستثنائية المزدوجة، فتخفي إحداهما الأخرى. ويحتاج الطالب مسارين متزامنين: معالجة الصعوبة المحددة بدعم مناسب، وإتاحة فرص الإثراء وتنمية الموهبة.","n":["حرمانه من الإثراء يزيد إحباطه ويهدر موهبته.","صحيح: مساران متزامنان: علاج الصعوبة وتنمية الموهبة.","الإثراء وحده لا يعالج الحاجة الأكاديمية الأساسية.","تفسير متسرع للتفاوت بالإهمال بدل تحليله."],"c":"حلول إبداعية ... يعجز عن التدوين","p":"الموهوب ذو الصعوبة: علاج وإثراء معًا."},{"id":"11-16","s":11,"i":"11.4","l":"تطبيق","t":"اقترح أحد المعلمين نشر التقرير التشخيصي لطالب في مجموعة المعلمين العامة على تطبيق المراسلة لتسهيل التعامل معه. ما الإجراء الأنسب؟","o":["نشر التقرير كاملًا في المجموعة لأن الهدف هو خدمة الطالب ومصلحته","حجب جميع المعلومات عن كل المعلمين حفاظًا على سرية بيانات الطالب","نشر التقرير في المجموعة بعد حذف اسم الطالب مع إبقاء بقية تفاصيله","الاعتذار عن النشر، ومشاركة ما يلزم المعنيين بتعليمه فقط"],"a":3,"w":"سرية البيانات تعني قصر الوصول إلى المعلومات الشخصية والتشخيصية على المخولين وفق الحاجة المهنية. فلا تُنشر في مجموعات عامة، ولا تُحجب كليًّا عمن تقتضي مسؤوليته الاطلاع عليها.","n":["حسن النية لا يبيح إفشاء بيانات حساسة لغير المخولين.","السرية لا تعني منع الفريق المخول مما يحتاجه لأداء دوره.","التفاصيل تبقى حساسة، وقد تكشف هوية الطالب.","صحيح: الإفصاح على قدر الحاجة والصلاحية."],"c":"مجموعة المعلمين العامة","p":"السرية = مشاركة على قدر الحاجة والصلاحية، لا نشر ولا حجب مطلق."},{"id":"11-17","s":11,"i":"11.4","l":"معرفة","t":"أي مما يلي يُعد تعديلًا (Modification) لا تسهيلًا (Accommodation)؟","o":["منح الطالب وقتًا إضافيًّا لإكمال اختبار الرياضيات","قراءة أسئلة العلوم للطالب حين لا تكون القراءة مقيسة","إجراء الاختبار للطالب في مكان هادئ قليل المشتتات","تقليل مستوى تعقيد المحتوى الرياضي المتوقع من الطالب"],"a":3,"w":"التسهيلات تغيّر طريقة الوصول أو العرض أو الاستجابة أو الزمن أو البيئة دون تغيير المهارة المقيسة، بينما التعديلات تمس مستوى المحتوى أو التوقع الأكاديمي نفسه.","n":["تسهيل في الزمن دون تغيير الهدف.","تسهيل في طريقة العرض يحافظ على المهارة المقيسة.","تسهيل في البيئة لا يمس المحتوى.","صحيح: يغيّر مستوى ما يُتوقع من الطالب تعلّمه."],"c":"تعديلًا لا تسهيلًا","p":"التسهيل يغيّر «كيف»، والتعديل يغيّر «ماذا» و«إلى أي مستوى»."},{"id":"11-18","s":11,"i":"11.4","l":"تطبيق","t":"اقترح أحد أعضاء الفريق إبقاء طالب يحتاج دعمًا قرائيًّا محدودًا في غرفة المصادر طوال اليوم الدراسي. ما الموقف الأنسب؟","o":["الموافقة لأن غرفة المصادر توفر له تعليمًا فرديًّا أكثر تركيزًا وعناية","تقديم الدعم بالقدر اللازم مع بقائه في الصف العام أكبر وقت مناسب","رفض أي خدمة في غرفة المصادر لأن الدمج يعني الصف العام وحده دائمًا","تأجيل القرار حتى يطلب ولي الأمر نقله إلى غرفة المصادر بنفسه"],"a":1,"w":"غرفة المصادر خدمة مساندة لا بيئة عزل دائم. وفلسفة الدمج والبيئة الأقل تقييدًا تقتضي تقديم الدعم بالقدر الذي تتطلبه الحاجة، مع إبقاء الطالب مع أقرانه في التعليم العام قدر الإمكان.","n":["تقييد زائد وعزل غير مبرر لحاجة محدودة.","صحيح: أقل قدر من التقييد مع دعم على قدر الحاجة.","الدمج لا يعني حرمانه من الدعم المساند.","القرار يُبنى على الحاجة والبيانات وقرار الفريق."],"c":"دعمًا قرائيًّا محدودًا ... طوال اليوم","p":"الدعم بقدر الحاجة، والدمج قدر الإمكان."},{"id":"11-19","s":11,"i":"11.4","l":"تحليل","t":"رفضت معلمة توفير قارئ للأسئلة لطالب لديه عسر قراءة في اختبار العلوم، معلّلة: «يجب أن يُعامل الجميع بالطريقة نفسها». ما الخلل في موقفها؟","o":["خلطت بين المساواة الشكلية والعدالة التي تزيل العائق وتحفظ الهدف","لا خلل في موقفها؛ فالمعاملة المتطابقة للجميع هي أساس مبدأ عدم التمييز","الخلل أنها لم تخفض مستوى أسئلة العلوم لتناسب مستوى الطالب القرائي","الخلل أنها لم تعفِ الطالب من اختبار العلوم كاملًا بسبب عسر القراءة لديه"],"a":0,"w":"العدالة التربوية تعني إزالة العوائق وتقديم ما يحتاجه الطالب للوصول إلى فرص تعلم عادلة، لا تقديم الشيء نفسه للجميع. وما دامت القراءة ليست المهارة المقيسة في اختبار العلوم، فقارئ الأسئلة تسهيل يحافظ على الهدف.","n":["صحيح: العدالة تقدّم ما يلزم للوصول، والقراءة ليست هدف الاختبار.","المساواة الشكلية لا تكفي حين تختلف احتياجات الوصول.","هذا تعديل لا يلزم؛ التسهيل يكفي لإزالة العائق.","الإعفاء يحرمه من إظهار تعلمه، والعائق قابل للإزالة."],"c":"يُعامل الجميع بالطريقة نفسها","p":"العدالة ليست المساواة الشكلية؛ أزل العائق واحفظ الهدف."},{"id":"11-20","s":11,"i":"11.4","l":"معرفة","t":"في موقف يتعلق بحقوق طالب في مدرسة سعودية، استند أحد المعلمين إلى قانون IDEA الأمريكي. كيف يُتعامل مع هذه المرجعية؟","o":["نظام ملزم للمدارس السعودية لأنه من أقدم تشريعات التربية الخاصة وأشهرها عالميًّا","مرجعية دولية مقارنة، والتطبيق وفق نظام حقوق الأشخاص ذوي الإعاقة وأدلة الوزارة","مرجعية تُقدَّم على الأدلة المحلية لأنها أكثر تفصيلًا في الإجراءات والنماذج","نص يُطبَّق حرفيًّا في المدرسة ما لم يعترض عليه قائد المدرسة أو المشرف التربوي"],"a":1,"w":"مصطلحات مثل IDEA وLRE شائعة في الأدبيات الدولية والأمريكية، أما التطبيق في المملكة فيرجع إلى نظام حقوق الأشخاص ذوي الإعاقة وأدلة وزارة التعليم ولوائحها السارية. فلا يُنسب نص أجنبي إلى النظام السعودي دون نص محلي صريح.","n":["القِدم والشهرة لا يمنحان نظامًا أجنبيًّا صفة الإلزام محليًّا.","صحيح: المفاهيم الدولية للمقارنة، والتطبيق وفق المرجعية المحلية.","التفصيل لا يقدّمه على المرجعية الرسمية المختصة.","الإلزام لا يُستمد من موافقة إدارية داخلية."],"c":"قانون IDEA الأمريكي","p":"IDEA مرجعية أمريكية مقارنة؛ والمرجع المحلي هو الحاكم."},{"id":"11-21","s":11,"i":"11.5","l":"تطبيق","t":"يشرح طالب مفهوم السلسلة الغذائية شفهيًّا بدقة، لكن صعوبته في الكتابة تمنعه من إظهار فهمه في الاختبار الكتابي، والهدف قياس الفهم العلمي. ما الإجراء الأنسب؟","o":["خفض مستوى أسئلة العلوم لتتناسب مع مستوى كتابته الحالي المنخفض","إعفاؤه من تقويم الوحدة كاملًا لأن الكتابة عائق دائم لديه في المادة","تكييف وسيلة الاستجابة ليجيب شفهيًّا أو بمنظم بصري مع بقاء الهدف","احتساب أخطاء الكتابة ضمن الدرجة لأن الاختبار كتابي في الأصل"],"a":2,"w":"إذا لم تكن الكتابة هي المهارة المقيسة فلا يصح أن تكون سببًا في خفض الدرجة. والتقويم البديل يتيح وسيلة أخرى لإظهار التعلم مع بقاء الهدف والمعيار ثابتين؛ أما لو كانت الكتابة هي الهدف فلا تُزال من المهمة.","n":["تعديل غير مبرر؛ الفهم العلمي سليم والعائق في الكتابة.","يحرمه من التقويم بدل إزالة العائق.","صحيح: تقويم بديل يقيس الهدف الحقيقي.","يجعل مهارة غير مستهدفة تحجب الهدف المقيس."],"c":"والهدف قياس الفهم العلمي","p":"حدد الهدف المقيس أولًا، ولا تدع مهارة فرعية تحجبه."},{"id":"11-22","s":11,"i":"11.5","l":"معرفة","t":"أي ممارسة تمثل التصميم الشامل للتعلم (UDL) بصورة أدق؟","o":["تخطيط الدرس منذ البداية بعرض النص مكتوبًا ومسموعًا وإتاحة أكثر من طريقة للتعبير","إعداد ورقة عمل خاصة لطالب ذي صعوبة بعد إخفاقه في نشاط الدرس الذي قدمه المعلم","تصنيف الطلاب حسب أنماط تعلمهم الحسية وتدريس كل فئة منهم بنمطها المفضل وحده","تقديم المحتوى نفسه لجميع الطلاب بطريقة واحدة موحدة تضمن العدل والمساواة بينهم جميعًا"],"a":0,"w":"التصميم الشامل للتعلم إطار يصمم التعلم من البداية بمرونة، فيوفر وسائل متعددة للعرض والعمل والتعبير والمشاركة لجميع المتعلمين، بدل انتظار إخفاق الطالب ثم تكييف المهمة له.","n":["صحيح: مرونة مخططة مسبقًا تتعدد فيها طرق العرض والتعبير.","تكييف لاحق لطالب واحد، لا تصميم شامل مسبق.","UDL لا يعني مطابقة أنماط تعلم ثابتة.","صيغة واحدة جامدة نقيض فكرة التصميم الشامل."],"c":"التصميم الشامل للتعلم (UDL)","p":"UDL = مرونة منذ التصميم: عرض وتعبير ومشاركة متعددة."},{"id":"11-23","s":11,"i":"11.5","l":"تحليل","t":"يحل سلمان عمليات الجمع والطرح بدقة، لكنه يخفق في المسائل اللفظية القائمة على العمليات نفسها. ما الخطوة الأولى الأنسب؟","o":["فصل اللغوي عن الحسابي بتحليل مفردات المسألة ومعطياتها وتمثيلها","افتراض عسر حساب لديه وتكثيف تدريبات العمليات الأساسية يوميًّا معه","تدريبه على كلمات مفتاحية تحدد العملية المطلوبة في كل مسألة لفظية","حذف المسائل اللفظية من مهامه لأنها تفوق قدراته الحالية في الرياضيات"],"a":0,"w":"المسائل اللفظية تجمع بين اللغة والتفكير الرياضي. وسلامة العمليات الحسابية مع الإخفاق في المسائل اللفظية تشير إلى حاجز لغوي أو قرائي، فيُحلَّل النص والمفردات والمعطيات والمطلوب ويُمثَّل بصريًّا قبل افتراض صعوبة في الحساب.","n":["صحيح: الحاجز المرجح لغوي/قرائي لا حسابي.","العمليات سليمة بحسب القرينة، فلا مبرر لافتراض عسر حساب.","الكلمة المفتاحية قد تقود إلى عملية خاطئة؛ فالعبرة ببنية المسألة.","يحذف مهارة منهجية بدل معالجة الحاجز."],"c":"يحل العمليات بدقة ... يخفق في اللفظية","p":"حساب سليم مع مسائل لفظية ضعيفة = افحص اللغة أولًا."},{"id":"11-24","s":11,"i":"11.5","l":"تطبيق","t":"تريد معلمة تدريس مفهوم الكسور لطالبة ذات صعوبات تعلم وفق مدخل CRA. أي تسلسل أنسب؟","o":["الرموز والأعداد، ثم الرسوم، ثم القطع المحسوسة","رسوم تمثيلية، ثم الرموز، ثم القطع المحسوسة أخيرًا","قطع محسوسة، ثم رسوم تمثيلية، ثم الرموز والأعداد","الرموز والأعداد مع تكرار كثيف حتى تحفظ الإجراء"],"a":2,"w":"مدخل CRA يتدرج في تعليم المفهوم الرياضي من المحسوس (Concrete) إلى التمثيلي البصري (Representational) ثم المجرد (Abstract)، فيبني المعنى قبل الرموز ويقلل القفزة المعرفية.","n":["يعكس التسلسل فيبدأ بالمجرد.","يبدأ من المنتصف ويؤخر المحسوس إلى النهاية.","صحيح: محسوس ثم تمثيلي ثم مجرد.","حفظ إجراء مجرد دون بناء المعنى."],"c":"وفق مدخل CRA","p":"CRA: محسوس ثم صورة ثم رمز."},{"id":"11-25","s":11,"i":"11.5","l":"تطبيق","t":"اعتمد معلم تطبيقًا رقميًّا جديدًا للقراءة لأنه «حديث وجذاب»، وبعد ستة أسابيع بقيت بيانات الطلاقة الأسبوعية لطالبه عند خط الأساس. ما القرار الأدق؟","o":["الاستمرار عليه لأن الأدوات الرقمية الحديثة تحتاج وقتًا أطول دائمًا","إضافة تطبيقات رقمية أخرى معه لزيادة جاذبية التعلم لدى الطالب","إيقاف جمع البيانات لأنها لا تعكس تفاعل الطالب الحقيقي مع التطبيق","مراجعة ارتباط الأداة بالهدف والحاجز، وتعديل التدخل وفق البيانات"],"a":3,"w":"الممارسات المبنية على الدليل مقدمة على الحداثة والجاذبية. وتُختار الأداة وفق الهدف والحاجز، ويُحكم على أثرها بالبيانات المتكررة؛ فإذا لم يتحسن معدل النمو تُراجع الاستراتيجية أو شدة التدخل بدل الاستمرار الآلي.","n":["الاستمرار الآلي يتجاهل بيانات ستة أسابيع.","الحداثة والجاذبية ليستا معيار الاختيار.","البيانات تُجمع لتغيير القرار لا لتُهمل.","صحيح: المستجد يُقيَّم بأثره في البيانات."],"c":"حديث وجذاب ... عند خط الأساس","p":"المستجد الأقوى ما يظهر أثره في البيانات."},{"id":"11-26","s":11,"i":"11.6","l":"تطبيق","t":"يطلب ولي أمر نقل ابنه إلى غرفة المصادر فورًا لأن درجاته في الإملاء منخفضة. ما الرد المهني الأنسب؟","o":["قبول الطالب في غرفة المصادر مؤقتًا ريثما تكتمل بقية الإجراءات النظامية","رفض الطلب لأن انخفاض الإملاء لا علاقة له بصعوبات التعلم على الإطلاق","توضيح أن الالتحاق قرار فريق يُبنى على رصد ودراسة حالة وتقييم شامل","إجراء اختبار إملاء واحد وتحديد التحاقه بالغرفة في ضوء نتيجته مباشرة"],"a":2,"w":"الدخول إلى خدمة صعوبات التعلم قرار مهني مؤسسي يمر بالرصد والدعم الأولي، ثم الإحالة ودراسة الحالة، ثم التقييم الشامل وقرار الفريق، وليس استجابة لطلب منفرد أو لنتيجة اختبار واحد.","n":["قبول قبل الأهلية يقفز على التسلسل الإجرائي.","قد يكون مؤشرًا يستحق الرصد، فلا يُرفض دون دراسة.","صحيح: الالتحاق مسار مؤسسي موثق لا طلب شفهي.","اختبار واحد لا يكفي لقرار الأهلية."],"c":"نقل ابنه ... فورًا","p":"لا قبول مباشر: رصد ثم إحالة ثم تقييم ثم قرار فريق."},{"id":"11-27","s":11,"i":"11.6","l":"معرفة","t":"سأل معلم جديد: «ما الخطوة التي تلي الإحالة؟ وما النماذج المطلوبة فيها؟». إلى أي مرجع يعود للإجابة؟","o":["الدليل التنظيمي؛ لأنه يحدد الهيكل والمهام والصلاحيات والأدوار","الدليل الإجرائي؛ لأنه يوضح تسلسل الخطوات والنماذج المطلوبة","نظام حقوق الأشخاص ذوي الإعاقة؛ لأنه يقرر الحقوق العامة للطلاب","خبرته الشخصية؛ لأنها أنسب لظروف مدرسته الخاصة من أي دليل مكتوب"],"a":1,"w":"الدليل التنظيمي يجيب عن سؤال «من يفعل ماذا؟» بتحديد الهيكل والمهام والصلاحيات، أما الدليل الإجرائي فيجيب عن «كيف ومتى تُنفَّذ المهمة؟» بتوضيح تسلسل الخطوات والنماذج والتوثيق.","n":["يجيب عن «من يفعل ماذا؟» لا عن ترتيب الخطوات.","صحيح: سؤال «كيف ومتى» سؤال إجرائي.","مرجعية حقوقية عامة لا تفصّل خطوات العمل المدرسي.","الدليل وُضع للحد من الاجتهادات الفردية."],"c":"ما الخطوة التي تلي ... وما النماذج","p":"من المسؤول؟ تنظيمي. ما الخطوة التالية؟ إجرائي."},{"id":"11-28","s":11,"i":"11.6","l":"تحليل","t":"بيانات القراءة الأسبوعية لطالب في غرفة المصادر ثابتة منذ ستة أسابيع، مع انتظام حضوره. ما الإجراء الأنسب؟","o":["تمديد الخطة نفسها حتى نهاية العام لأن التحسن قد يتأخر عند بعض الطلاب أحيانًا","إخراج الطالب من البرنامج لأنه لم يستفد من الخدمة المقدمة له حتى الآن","مراجعة جودة تنفيذ التدخل وشدته، وعرض البيانات على الفريق لتعديل الخطة","الاستمرار في جمع البيانات وأرشفتها في ملفه حتى موعد المراجعة السنوية"],"a":2,"w":"متابعة التقدم جزء من التدريس، وثبات البيانات رغم انتظام الحضور يستدعي مراجعة جودة التنفيذ وشدة الدعم والاستراتيجية، وعرض الأدلة على الفريق لتعديل الخطة بقرار موثق.","n":["الخطة لا تُمدَّد آليًّا دون مراجعة الأثر.","ضعف الاستجابة لا يعني انتفاء الحاجة إلى الخدمة.","صحيح: ضعف الاستجابة يستدعي مراجعة التدخل لا لوم الطالب.","متابعة التقدم يجب أن تقود إلى قرار لا إلى أرشفة."],"c":"ثابتة منذ ستة أسابيع مع انتظام حضوره","p":"بيانات ثابتة = راجع التدخل وعدّل الخطة؛ لا تمدّد آليًّا ولا تُخرج."},{"id":"11-29","s":11,"i":"11.6","l":"تطبيق","t":"حقق طالب أهداف خطته الفردية بثبات خلال فصلين، وأصبح يطبق مهاراته في الصف العام. ما الإجراء الأنسب بشأن استمراره في البرنامج؟","o":["إبقاؤه في البرنامج احتياطًا خوفًا من تراجع مستواه الدراسي لاحقًا بعد الخروج","إخراجه فورًا بقرار من معلم صعوبات التعلم لأنه الأعلم بحالته وتقدمه في الغرفة","انتظار طلب مكتوب من ولي الأمر قبل مناقشة أي تغيير في الخدمة المقدمة لابنه","عرض بيانات تقدمه على الفريق لاتخاذ قرار موثق بالخروج أو التخفيف وفق المعايير"],"a":3,"w":"معايير الخروج لا تقل أهمية عن معايير القبول. وعندما تتحقق الأهداف بثبات وتظهر المهارات في الصف العام، تُعرض البيانات على الفريق بمشاركة الأسرة لاتخاذ قرار موثق بالخروج أو بتعديل شدة الخدمة.","n":["الخوف من التراجع لا يبرر استمرار خدمة لم تعد لازمة.","قرار الخروج جماعي لا فردي.","الأسرة شريكة، لكن المراجعة لا تتوقف على طلبها.","صحيح: الخروج قرار فريق موثق مبني على البيانات والمعايير."],"c":"حقق أهدافه بثبات خلال فصلين","p":"قرار الخروج: بيانات + معايير + فريق + توثيق."},{"id":"11-30","s":11,"i":"11.6","l":"تطبيق","t":"كلّف قائد مدرسة معلم صعوبات التعلم بتقديم حصص تقوية عامة لجميع الطلاب المتأخرين في الصف الخامس داخل غرفة المصادر. ما التصرف المهني الأنسب؟","o":["التنفيذ دون نقاش لأن التكليف صادر من قائد المدرسة مباشرة وهو صاحب الصلاحية","رفض التكليف كتابيًّا والامتناع عن حضور أي حصة إضافية خارج جدوله الأصلي","مناقشته مهنيًّا بالرجوع إلى المهام المعتمدة لغرفة المصادر وطلابها","إعداد خطط فردية لجميع الطلاب المتأخرين حتى يصبح وجودهم في الغرفة نظاميًّا"],"a":2,"w":"غرفة المصادر خدمة متخصصة للطلاب المستحقين وفق خططهم، لا مكان لحصص التقوية العامة. وعند تعارض توجيه إداري مع المهام المعتمدة يُقدَّم المرجع الرسمي مع شرح مهني واحترام التسلسل الإداري وتوثيق الإجراء عند الحاجة.","n":["يخلط بين غرفة المصادر وحصص التقوية العامة.","رفض صدامي لا يحترم التسلسل الإداري.","صحيح: الرجوع إلى المرجعية المعتمدة بأسلوب مهني يحترم التسلسل.","خطط شكلية دون أهلية تخالف الإجراءات."],"c":"حصص تقوية عامة لجميع المتأخرين","p":"تعارض التوجيه مع الدليل؟ ارجع إلى المرجعية بأسلوب مهني."},{"id":"11-31","s":11,"i":"11.7","l":"تطبيق","t":"تقول أم سلمان إن خاله لديه عسر قراءة، وتطلب تشخيص ابنها به لأنه يخطئ أحيانًا في الإملاء. ما الموقف المهني الأدق؟","o":["التاريخ العائلي كافٍ للتشخيص لأن عسر القراءة ينتقل وراثيًّا بين الأقارب","التاريخ العائلي لا قيمة له، ويُهمل تمامًا عند دراسة حالة الطالب وتقييمه","التاريخ العائلي عامل خطر يستدعي المتابعة وجمع البيانات، لا دليل تشخيص","يُشخَّص الطالب إذا تكرر خطؤه الإملائي في اختبار واحد آخر خلال الفصل"],"a":2,"w":"العوامل الوراثية قابلية ترفع احتمال ظهور بعض اضطرابات التعلم، خصوصًا عسر القراءة، دون أن تعني الحتمية. لذلك يُعامل التاريخ العائلي قرينةً تستدعي المتابعة وجمع بيانات متعددة، لا تشخيصًا قائمًا بذاته.","n":["الاستعداد الوراثي لا يعني حتمية الإصابة.","التاريخ الأسري قرينة مهمة عند تقصي التاريخ.","صحيح: قرينة ترفع الاحتمال لا قرار نهائي.","التشخيص لا يقوم على اختبار واحد."],"c":"خاله لديه عسر قراءة","p":"عامل الخطر ليس سببًا مؤكدًا؛ البيانات الحالية هي الحكم."},{"id":"11-32","s":11,"i":"11.7","l":"تحليل","t":"طالب لديه عسر قراءة معروف، وأصبح يرفض القراءة الجهرية بعد سخرية زملائه منه. ما التحليل الأدق والإجراء الأنسب؟","o":["القلق سبب أصلي لصعوبته؛ فيُعالج أولًا ويؤجَّل التدخل القرائي إلى ما بعده","الانسحاب دليل على اضطراب انفعالي يستبعد وجود صعوبة تعلم لدى الطالب","الرفض سلوك عناد؛ فيُلزم بالقراءة الجهرية يوميًّا أمام زملائه كلهم حتى يعتاد","القلق والانسحاب عاملان مفاقمان؛ فيُخفض التهديد بالتوازي مع التدخل القرائي"],"a":3,"w":"القلق والتنمر وتدني مفهوم الذات عوامل مفاقمة تزيد شدة الصعوبة وتضعف الاستجابة للتدخل دون أن تكون سببها الأصلي. لذلك يُخفض التهديد ويُستخدم التدريب الفردي أو الثنائي وتُبنى خبرات نجاح، مع التنسيق لمنع التنمر واستمرار التدخل القرائي.","n":["العامل المفاقم لا يُنشئ الصعوبة، وتأجيل التدخل يضر.","الصعوبة سابقة ومعروفة، والانسحاب نتيجة ثانوية.","تفسير متسرع يزيد التهديد ويعمّق المشكلة.","صحيح: الصعوبة الأصلية قرائية، والخوف يزيد حدتها."],"c":"بعد سخرية زملائه","p":"اسأل: سبب أصلي أم عامل زاد الحدة؟"},{"id":"11-33","s":11,"i":"11.7","l":"معرفة","t":"ما الفهم الأدق للعوامل العصبية في التفسير الحديث لصعوبات التعلم؟","o":["اختلافات وظيفية في شبكات معالجة محددة، لا تعني بالضرورة إصابة ظاهرة","إصابة دماغية ظاهرة يجب أن تثبتها الفحوص الطبية قبل أي تشخيص تربوي","انخفاض عام في القدرة العقلية ينتج عن خلل في وظائف الدماغ المختلفة","عامل نادر الحدوث لا علاقة له بمهارات القراءة أو الحساب أو الكتابة إطلاقًا"],"a":0,"w":"ينظر النموذج العصبي النمائي إلى صعوبات التعلم بوصفها اختلافات في نمو شبكات عصبية محددة وكفاءتها، كشبكات معالجة اللغة والعدد والانتباه والذاكرة، لا بوصفها تلفًا دماغيًّا ظاهرًا كما في التسميات القديمة.","n":["صحيح: النموذج العصبي النمائي يتحدث عن كفاءة الشبكات.","التشخيص الحديث لا يفترض تلفًا دماغيًّا ظاهرًا.","صعوبات التعلم نوعية، وليست انخفاضًا عامًّا في الذكاء.","ترتبط هذه الاختلافات بمعالجة اللغة والعدد والانتباه والذاكرة."],"c":"التفسير الحديث","p":"عصبي نمائي = اختلاف وظيفي في المعالجة، لا تلف ظاهر."},{"id":"11-34","s":11,"i":"11.7","l":"تطبيق","t":"لاحظت معلمة أن طالبًا في الصف الأول يعكس كتابة بعض الحروف أحيانًا، فأبلغت أسرته بأنه مصاب بعسر القراءة. ما التقييم الأدق لتصرفها؟","o":["صحيح؛ لأن عكس الحروف هو العلامة الحاسمة في تشخيص عسر القراءة لدى الأطفال","متسرّع؛ فعكس الحروف وحده ليس علامة تشخيصية، والمطلوب تحليل القراءة واللغة","صحيح جزئيًّا؛ ويكفي أن يُضاف إليه فحص للبصر حتى يكتمل تشخيص عسر القراءة","متسرّع؛ لأن المعلمة لا يحق لها التواصل مع أسرة الطالب في شأن تعلمه وأدائه"],"a":1,"w":"عسر القراءة اضطراب لغوي صوتي في جوهره، وعكس الحروف وحده ليس سببًا له ولا علامة حاسمة عليه. ولا يشخّص المعلم منفردًا؛ بل يوثق نمط الأخطاء ويحلل القراءة واللغة والتاريخ النمائي ضمن تقييم متعدد المصادر.","n":["خطأ شائع؛ العكس وحده لا يحسم التشخيص.","صحيح: لا تشخيص من علامة واحدة، وعسر القراءة لغوي صوتي في جوهره.","عسر القراءة ليس مشكلة بصرية في جوهره.","التواصل مع الأسرة مطلوب، والخلل في التشخيص المتسرع."],"c":"يعكس كتابة بعض الحروف أحيانًا","p":"لا تجعل انعكاس الحروف علامة حاسمة على عسر القراءة."},{"id":"11-35","s":11,"i":"11.7","l":"تحليل","t":"طالب انتقل حديثًا من بلد غير عربي، يقرأ بطلاقة بلغته الأولى، ويتعثر في القراءة بالعربية وفي مفرداتها. ما التفسير الأولى بالفحص؟","o":["اختلاف لغوي وقلة تعرض للغة التدريس، فيُقدَّم دعم لغوي وتُتابع استجابته","صعوبة تعلم في القراءة لأن تعثره مستمر في لغة المدرسة منذ التحاقه بها","ضعف في الوعي الصوتي يستدعي إحالته فورًا إلى التشخيص المتخصص","تأخر نمائي عام لأنه لم يكتسب العربية بالسرعة المتوقعة مقارنة بأقرانه"],"a":0,"w":"الاختلاف اللغوي وقلة التعرض للغة التدريس من التفسيرات البديلة التي تُفحص قبل الاستنتاج. وقراءة الطالب الجيدة بلغته الأولى قرينة مهمة على أن التعثر مرتبط باللغة الجديدة، فيُقدَّم دعم لغوي مناسب وتُراقب الاستجابة.","n":["صحيح: قراءته الجيدة بلغته الأولى ترجّح العامل اللغوي.","التعثر في لغة جديدة وحدها لا يثبت صعوبة تعلم.","لا قرينة على ضعف صوتي؛ فهو يقرأ بطلاقة بلغته.","بطء اكتساب لغة ثانية ليس دليلًا على تأخر نمائي."],"c":"يقرأ بطلاقة بلغته الأولى","p":"افحص الأداء في اللغة الأولى قبل الحكم بصعوبة تعلم."},{"id":"11-36","s":11,"i":"11.8","l":"معرفة","t":"طُلب من طالب أن يحذف الصوت الأول من كلمة «سَمَك» شفهيًّا وينطق ما تبقى. أي مهارة تقيسها هذه المهمة تحديدًا؟","o":["سرعة التسمية التلقائية","فك الترميز","الطلاقة القرائية","الوعي الفونيمي"],"a":3,"w":"الوعي الفونيمي جزء دقيق من الوعي الفونولوجي يتعامل مع أصغر وحدات الصوت: عزلها ودمجها وتقسيمها وحذفها. والمهمة شفهية لا تتضمن حروفًا مكتوبة، فلا تقيس فك الترميز ولا الطلاقة.","n":["تقيس سرعة تسمية مثيرات مألوفة كالحروف والأرقام والألوان.","يتعلق بتحويل الرموز المكتوبة إلى أصوات، والمهمة شفهية.","قراءة نص بدقة وسرعة ونبرة مناسبة، والمهمة لا تتضمن نصًّا.","صحيح: التلاعب بالفونيم الفردي في الكلام المنطوق."],"c":"يحذف الصوت الأول شفهيًّا","p":"صوت فردي يُحذف أو يُدمج شفهيًّا = وعي فونيمي."},{"id":"11-37","s":11,"i":"11.8","l":"تطبيق","t":"كتب معلم في سجل المتابعة: «الطالب كسول؛ ينسى التعليمات». أي إعادة صياغة أدق بلغة مهنية؟","o":["يفتقر إلى الدافعية اللازمة لمتابعة تعليمات المعلم داخل الصف وخارجه باستمرار","يصعب عليه الاحتفاظ بالتعليمات اللفظية متعددة الخطوات ومعالجتها أثناء التنفيذ","لديه انخفاض في الذكاء العام يمنعه من فهم التعليمات الصفية وتذكرها عند التنفيذ","يعاني اضطرابًا في المعالجة السمعية المركزية يفسر نسيانه المتكرر لتعليمات المعلم"],"a":1,"w":"جوهر اللغة الأكاديمية تحويل الوصف الانطباعي إلى وصف مهني قابل للملاحظة يرتبط بإجراء، مثل الصعوبة في الاحتفاظ بالتعليمات ومعالجتها في الذاكرة العاملة، وهو ما يقود إلى تجزئة التعليمات ودعمها بصريًّا والتحقق من الفهم.","n":["يستبدل حكمًا انطباعيًّا بآخر دون وصف للأداء.","صحيح: وصف أداء يشير إلى الذاكرة العاملة ويقود إلى إجراء.","حكم غير مدعوم يخلط صعوبة نوعية بالذكاء العام.","مصطلح تشخيصي لا يُستخدم دون تقييم مختص."],"c":"كسول؛ ينسى التعليمات","p":"حوّل الانطباع إلى وصف أداء قابل للقياس يقود إلى تدخل."},{"id":"11-38","s":11,"i":"11.8","l":"تحليل","t":"يفهم عبدالله النص جيدًا عندما يُقرأ عليه، لكنه يتعثر في قراءة كلماته بنفسه. أي وصف مهني أدق لاحتياجه؟","o":["قصور في الفهم الاستنتاجي يحتاج استراتيجيات التنبؤ والتساؤل الذاتي","قصور في اللوح البصري المكاني يمنعه من تتبع السطور المكتوبة بدقة","قصور في فك الترميز والتعرف على الكلمات أكثر منه في الفهم اللغوي","قصور في اللغة الأكاديمية للمادة يمنعه من فهم مصطلحاتها ومفرداتها"],"a":2,"w":"التمييز بين التعرف على الكلمات والفهم القرائي من أهم دلالات اللغة الأكاديمية. فإذا فهم الطالب النص مسموعًا وتعثر في قراءته بنفسه، فالقرينة ترجّح فك الترميز والتعرف على الكلمات لا الفهم اللغوي العام.","n":["فهمه للنص المسموع ينفي أن يكون الفهم هو العائق الرئيس.","تفسير بصري لا تدعمه القرينة.","صحيح: الفهم السمعي سليم، والعائق في قراءة الكلمات.","لو كان العائق لغويًّا لظهر عند الاستماع أيضًا."],"c":"يفهمه مسموعًا ... يتعثر في قراءته","p":"يفهم بالاستماع ويتعثر بالقراءة = فك ترميز."},{"id":"11-39","s":11,"i":"11.8","l":"تطبيق","t":"يجيب طالب عن سؤال «برّر إجابتك» بإعادة كتابة الإجابة نفسها دون ذكر سبب. ما التدخل الأنسب؟","o":["تعليم صريح لما يطلبه فعل «برّر» بنموذج وقالب «لأن...» يُسحب تدريجيًّا","حذف أسئلة التبرير من اختباراته لأنها تفوق مستواه اللغوي الحالي بكثير","تزويده بقائمة مرادفات لكلمة «برّر» ليحفظها جيدًا قبل موعد الاختبار القادم","احتساب إجابته كاملة ما دامت الإجابة نفسها صحيحة في مضمونها العلمي"],"a":0,"w":"أفعال الأسئلة مثل «برّر» و«قارن» و«استنتج» وظائف لغوية تُعلَّم من حيث ما تطلبه من الطالب، لا كمرادفات للحفظ. وقوالب الجمل سقالة مؤقتة تدعم إنتاج الاستجابة ثم تُخفَّف تدريجيًّا نحو الاستقلال.","n":["صحيح: يعلّم الوظيفة اللغوية بسقالة مؤقتة.","يحذف متطلبًا أكاديميًّا بدل تعليمه.","حفظ المرادفات لا يعلّم ما يطلبه الفعل.","يتجاهل متطلبًا أساسيًّا في السؤال."],"c":"يعيد كتابة الإجابة دون ذكر سبب","p":"علّم ما يطلبه فعل السؤال، واستخدم القالب سقالة مؤقتة."},{"id":"11-40","s":11,"i":"11.8","l":"تطبيق","t":"طالبة تتحدث بطلاقة في المواقف اليومية، لكنها تتعثر في فهم نص علمي يكثر فيه «بينما» و«نتيجة لذلك» ومصطلحات مثل «التكثف». ما التفسير الأدق؟","o":["ضعف في الذكاء العام يظهر بوضوح في المواد العلمية تحديدًا دون غيرها","فجوة في اللغة الأكاديمية: المفردات التخصصية وأدوات الربط المنطقية","طلاقتها في الحديث اليومي تنفي أن تكون اللغة سببًا في تعثرها بالنص","صعوبة في فك الترميز لأنها لا تفهم ما تقرؤه من النص العلمي المكتوب"],"a":1,"w":"تختلف اللغة الأكاديمية عن اللغة الاجتماعية في المفردات والتراكيب والكثافة والدقة. وأدوات الربط مثل «بينما» و«نتيجة لذلك» تحمل علاقات منطقية، والمصطلحات التخصصية تحتاج تعليمًا صريحًا في سياق المحتوى.","n":["لا قرينة على ضعف عام، والتعثر مرتبط بلغة النص.","صحيح: لغة الكتب تختلف عن لغة الحديث اليومي.","الطلاقة الاجتماعية لا تعني إتقان اللغة الأكاديمية.","لا قرينة على تعثر في قراءة الكلمات نفسها."],"c":"بطلاقة يومية ... تتعثر في نص علمي","p":"الطلاقة في الحديث اليومي لا تعني إتقان لغة الكتب."},{"id":"12-01","s":12,"i":"12.1","l":"معرفة","t":"يُظهر عبدالله استدلالًا شفهيًّا متقدمًا وفهمًا جيدًا لما يسمعه، بينما يقع أداؤه في التهجئة والتعبير الكتابي دون مستوى صفه بوضوح. أي المفاهيم يصف هذا النمط بدقة؟","o":["الفروق البينية: اختلاف أداء الطالب عن أداء زملائه في الصف","عدم التجانس: اختلاف طلاب الفئة في نوع الصعوبة وشدتها","الفروق الداخلية: تفاوت مجالات الأداء والمهارات داخل ملف الطالب نفسه","التباين بين القدرة والتحصيل بوصفه محكًّا كافيًا للتشخيص"],"a":2,"w":"التفاوت الواضح بين مجال قوي (الاستدلال الشفهي والفهم السماعي) ومجال ضعيف (التهجئة والتعبير الكتابي) لدى الطالب نفسه هو تعريف الفروق الداخلية. ويُستثمر هذا التفاوت في التخطيط: توظيف القوة مدخلًا، واستهداف الحاجة بتدخل مباشر.","n":["الفروق البينية تقارن طالبًا بآخر، والموقف يقارن مجالات الطالب نفسه.","عدم التجانس وصف للفئة كلها لا لملف طالب واحد.","صحيح: المقارنة هنا بين مهارات عبدالله نفسه.","التباين ليس محكًّا كافيًا وحده، والسؤال عن وصف النمط لا عن التشخيص."],"c":"قوة شفهية وضعف كتابي لدى الطالب نفسه","p":"داخل الطالب = فروق داخلية، وبين طالب وآخر = فروق بينية."},{"id":"12-02","s":12,"i":"12.1","l":"معرفة","t":"أي العبارات الآتية تعبّر بدقة عن مبدأ «عدم التجانس» لدى الطلاب ذوي صعوبات التعلم؟","o":["قد يختلف طالبان يحملان التشخيص نفسه في سبب التعثر وشدته واستجابتهما للتدريس","الطلاب الذين يحملون التشخيص نفسه يحتاجون غالبًا البرنامج العلاجي نفسه بالشدة نفسها","يقتصر اختلاف الطلاب على شدة الصعوبة، أما نوعها فواحد داخل التشخيص الواحد","خصائص الفئة لا قيمة لها في فهم أي طالب ينتمي إليها مهما كانت حالته"],"a":0,"w":"عدم التجانس سمة أساسية لفئة صعوبات التعلم؛ فقد يتعثر طالب في المعالجة الصوتية وآخر في سرعة الاسترجاع مع أن التشخيص واحد. لذلك يُبنى التدريس على تحليل نمط الأداء الفردي والاستجابة للتدخل، لا على اسم التشخيص.","n":["صحيح: التشخيص الواحد لا يعني احتياجًا واحدًا.","هذا هو التعميم من اسم التشخيص الذي ينفيه المبدأ.","الاختلاف يشمل النوع والسبب والاستجابة، لا الشدة وحدها.","مبالغة عكسية: خصائص الفئة تولّد فرضيات تُختبر ببيانات الفرد."],"c":"التشخيص نفسه مع اختلاف السبب والاستجابة","p":"الفرد قبل الفئة: البيانات الفردية تحسم التدريس، والتشخيص يوجّه الأسئلة فقط."},{"id":"12-03","s":12,"i":"12.1","l":"تطبيق","t":"في مجموعة قراءة من ستة طلاب، أظهرت القياسات أن ثلاثة منهم يتعثرون في دمج الأصوات، واثنين في الطلاقة مع دقة جيدة، وواحدًا في الفهم القرائي. ما التنظيم التدريسي الأنسب؟","o":["تقديم درس موحد للطلاب الستة يركز على الفهم القرائي لأنه الغاية النهائية من القراءة","تثبيت كل طالب في مجموعته طوال الفصل الدراسي ضمانًا لاستقرار التدخل","مجموعات مؤقتة بحسب المهارة المتأثرة تتغير مع بيانات التقدم","تأجيل التجميع حتى نهاية الفصل وتطبيق اختبار تحصيلي شامل على الجميع"],"a":2,"w":"تكشف البيانات ثلاث حاجات مختلفة داخل مجموعة واحدة، فالأنسب تجميع مؤقت بحسب المهارة المستهدفة، مع إعادة التجميع دوريًّا وفق بيانات التقدم. هذا هو تطبيق التمايز والمجموعات المرنة، ويمنع خطأ تثبيت المجموعات أو توحيد الدرس.","n":["يتجاهل أن خمسة منهم حاجتهم في مكونات أخرى.","تثبيت المجموعات خطأ شائع؛ المجموعات تتغير مع تغير الأداء.","صحيح: مجموعات مرنة قائمة على البيانات.","يؤخر التدخل رغم توافر بيانات كافية للتجميع الآن."],"c":"ثلاث حاجات مختلفة في مجموعة واحدة","p":"المجموعات المرنة مؤقتة وتُبنى على المهارة والبيانات، ثم يُعاد تشكيلها."},{"id":"12-04","s":12,"i":"12.1","l":"تطبيق","t":"يدرس سلمان وفيصل الهدف نفسه في الدراسات الاجتماعية؛ سلمان يفهم المحتوى لكنه بطيء جدًّا في الكتابة، وفيصل يفهمه سماعًا لكنه يتعثر في قراءة النصوص. والقراءة والكتابة ليستا ما يقيسه الاختبار. ما الإجراء الأعدل في التقويم؟","o":["تقديم التكييف نفسه للطالبين تحقيقًا للمساواة بينهما لأنهما من الفئة نفسها","تقديم تكييف مختلف لكل منهما بحسب حاجزه، مع إبقاء الهدف المقاس واحدًا","خفض مستوى أسئلة الاختبار للطالبين مراعاةً لصعوبات التعلم لديهما","إلغاء التكييفات للطالبين لأن الهدف واحد ويجب قياسه بالطريقة نفسها"],"a":1,"w":"حاجز سلمان في الكتابة وحاجز فيصل في القراءة، وكلاهما خارج المهارة المقاسة؛ لذلك يحتاج كل منهما تكييفًا يزيل حاجزه هو (كالاستجابة الشفهية أو الوقت الإضافي لسلمان، وقراءة الأسئلة لفيصل) مع بقاء هدف الدراسات الاجتماعية كما هو. فالعدالة ليست المساواة الصورية.","n":["المساواة الصورية لا تراعي اختلاف الحاجز.","صحيح: العدالة دعم مختلف لهدف مشترك.","هذا تعديل يغيّر الهدف، والحاجة هنا حاجز وصول فقط.","يقيس أثر الصعوبة غير المستهدفة بدل المعرفة المقصودة."],"c":"حاجزان مختلفان والهدف المقاس واحد","p":"التكييف يُختار بحسب الحاجز والمهارة المقاسة، لا بحسب اسم الفئة."},{"id":"12-05","s":12,"i":"12.1","l":"تطبيق","t":"يحل مازن مسائل الطرح مع إعادة التجميع بدقة حين يستخدم المكعبات ولوحة المنازل، لكنه يخطئ عند حلها بالأرقام وحدها. ما الإجراء الأنسب؟","o":["التدرج من المحسوس إلى الرسم ثم الرموز، مع سحب الوسائل تدريجيًّا وفق أدائه","الإبقاء على المكعبات في جميع المسائل والاختبارات لأنها طريقته الثابتة في التعلم","منع استخدام المكعبات فورًا لأنها تؤخر انتقاله إلى التفكير المجرد","نقله إلى مسائل طرح بلا إعادة تجميع حتى يتقن الرموز دون وسائل"],"a":0,"w":"نجاحه بالمحسوس نقطة قوة تُستثمر جسرًا للمهارة الصعبة، والتسلسل: المحسوس ثم التمثيلي ثم المجرد (CRA) ينقله تدريجيًّا إلى الرموز. والمهم أن يُخفَّف الدعم وفق البيانات حتى لا يتحول إلى اعتماد دائم.","n":["صحيح: القوة جسر، والهدف الاستقلال.","يحوّل الوسيلة الداعمة إلى اعتماد دائم ونمط ثابت.","سحب الدعم المفاجئ يحرمه من الجسر الذي ينجح معه.","يخفض الهدف بدل بناء الانتقال إلى التمثيل المجرد."],"c":"ينجح بالمحسوس ويخطئ بالرموز","p":"نقطة القوة جسر مؤقت إلى الهدف، تُسحب تدريجيًّا مع تقدم الاستقلال."},{"id":"12-06","s":12,"i":"12.1","l":"تطبيق","t":"انضمت ريم حديثًا إلى برنامج صعوبات التعلم، ومعها تقرير يذكر «صعوبة تعلم في الرياضيات» دون تفاصيل عن مهاراتها. تريد المعلمة تخطيط تدريس متمايز لها. ما أول خطوة؟","o":["جمع بيانات أداء حالية من مصادر متعددة لتحديد ما تتقنه ومواضع تعثرها","اختيار برنامج علاجي جاهز يناسب التشخيص الوارد في التقرير","تطبيق الاستراتيجيات المستخدمة مع زميلاتها اللاتي يحملن التشخيص نفسه","تحديد أسلوب تعلمها المفضل ثم التدريس من خلاله في كل المهارات"],"a":0,"w":"التقرير يحدد المجال العام فقط، والرياضيات تشمل حقائق وإجراءات ومفاهيم وحل مسائل. وقبل أي تمايز يجب جمع بيانات حديثة من أكثر من مصدر (قياسات صفية، وعينات عمل، وملاحظة) لمعرفة ما تستطيعه ريم الآن وأين تتعثر.","n":["صحيح: التمايز يبدأ من البيانات.","يبدأ من اسم التشخيص لا من بيانات ريم.","يفترض أن التشخيص الواحد يعني احتياجًا واحدًا.","يثبّت نمط تعلم جامدًا بدل تحليل المهارات."],"c":"تقرير عام دون تفاصيل عن المهارات","p":"اسأل قبل التدريس: ماذا يستطيع الطالب الآن؟ وأين يتعثر بالتحديد؟"},{"id":"12-07","s":12,"i":"12.1","l":"تحليل","t":"حصل تركي على 70٪ في اختبار قراءة شامل. وبتحليل الأقسام: دقة قراءة الكلمات 95٪، والطلاقة أقل بوضوح من المتوقع لصفه، والفهم عند الاستماع إلى النص 90٪. ما التفسير الأدق لهذه البيانات؟","o":["الدرجة الكلية تخفي حاجة نوعية في الطلاقة، فيُوجَّه إليها التدخل دون خفض المحتوى","أداؤه في القراءة متوسط إجمالًا، فلا يحتاج إلى تدخل فردي في هذه المرحلة","حاجته الأساسية في الفهم القرائي، لأن الفهم هو الغاية النهائية من القراءة","ضعف الطلاقة يدل على قصور عام في القراءة يستدعي إعادة تعليم الحروف وأصواتها من البداية"],"a":0,"w":"الدقة العالية والفهم السماعي الجيد يقابلهما ضعف واضح في الطلاقة؛ أي أن الدرجة الكلية المتوسطة تخفي تفاوتًا وظيفيًّا مهمًّا. والقرار الصحيح يُبنى على بيانات المكونات: تدخل مباشر في الطلاقة دون خفض مستوى المحتوى الذي يفهمه.","n":["صحيح: تحليل المكونات يحدد الحاجة.","يكتفي بالدرجة الكلية التي تخفي التفاوت.","فهمه عند الاستماع جيد، والعائق في الطلاقة.","دقته عالية؛ وإعادة تعليم الحروف لا تستهدف الحاجة."],"c":"دقة عالية وطلاقة منخفضة خلف درجة كلية متوسطة","p":"لا تخطط من الدرجة الكلية؛ حلّل المكونات: الدقة والطلاقة والفهم."},{"id":"12-08","s":12,"i":"12.1","l":"تحليل","t":"طُبِّق برنامج تدريب صوتي منظم على هيا ولمى، ولدى كل منهما صعوبة قراءة. بعد ستة أسابيع تحسنت دقة هيا وسرعتها، أما لمى فتحسنت دقتها لكنها بقيت بطيئة جدًّا في التعرف على الكلمات. ما الاستنتاج الأدق؟","o":["البرنامج غير فعّال لأنه لم يحقق النتيجة نفسها لدى الطالبتين","تحتاج لمى إلى تحليل طلاقتها وسرعة وصولها إلى الكلمات، ثم تعديل تدخلها وفق ذلك","تستمر لمى في البرنامج نفسه دون أي تعديل، لأنه أثبت فاعليته بوضوح مع زميلتها هيا","تحسن دقة لمى يكفي للحكم بانتهاء صعوبتها، فيُوقف الدعم عنها"],"a":1,"w":"الطالبتان بالتشخيص نفسه لكن استجابتهما مختلفة؛ وتحسن الدقة لدى لمى مع بقاء البطء يشير إلى حاجة في الطلاقة وسرعة الوصول إلى الكلمة. فالإجراء الأدق قياس هذه المهارة مباشرة وتعديل التدخل، بدل افتراض أن الاستراتيجية نفسها تعطي النتيجة نفسها.","n":["نجح مع هيا وحسّن دقة لمى؛ فالحكم بعدم فاعليته غير دقيق.","صحيح: اختلاف الاستجابة يقود إلى قرار فردي.","فاعلية التدخل مع زميلة لا تضمن مناسبته للفرد.","يتجاهل بطأها الشديد الذي يبقى حاجة قائمة."],"c":"تحسنت الدقة وبقي البطء الشديد","p":"اختلاف الاستجابة للتدخل نفسه = عدم تجانس، فعدّل التدخل للفرد."},{"id":"12-09","s":12,"i":"12.2","l":"معرفة","t":"ما المقصود بـ«سرعة المعالجة» بوصفها خاصية معرفية قد تظهر لدى بعض الطلاب ذوي صعوبات التعلم؟","o":["الاحتفاظ المؤقت بالمعلومات ومعالجتها في أثناء أداء مهمة متعددة الخطوات","إدراك البنية الصوتية للكلمات والتعامل مع مقاطعها وأصواتها","مؤشر مباشر على مستوى الذكاء العام؛ فكلما بطؤت المعالجة انخفضت القدرة العقلية للطالب","زمن استقبال المعلومات وفهمها والاستجابة لها، وقد يبطؤ دون انخفاض القدرة العقلية"],"a":3,"w":"سرعة المعالجة هي الزمن اللازم لاستقبال المعلومات وفهمها والاستجابة لها، وبطؤها قد يؤثر في الأداء الزمني دون أن يعني ضعف الفهم أو القدرة العقلية. لذلك يميّز المعلم بين بطء الاستجابة وعدم المعرفة، ولا يفسر البطء كسلًا.","n":["هذا تعريف الذاكرة العاملة.","هذا تعريف الوعي الفونولوجي (الصوتي).","سرعة المعالجة تختلف عن الذكاء؛ وهذا مفهوم خاطئ.","صحيح: البطء لا يعني ضعف الفهم أو الذكاء."],"c":"الوقت اللازم للاستقبال والاستجابة","p":"يفهم لكنه يحتاج وقتًا أطول ← فكّر في سرعة المعالجة، لا في ضعف الفهم."},{"id":"12-10","s":12,"i":"12.2","l":"معرفة","t":"أي مما يلي «لا» يُعد خاصية تعريفية لازمة لصعوبات التعلم؟","o":["صعوبة نوعية ومستمرة في مهارة أكاديمية رغم التعليم المناسب","عدم كفاية الإعاقة الحسية أو نقص فرص التعليم لتفسير التعثر","انخفاض الذكاء العام عن المتوسط","اعتماد تحديد الصعوبة على تقييم شامل متعدد المصادر"],"a":2,"w":"صعوبات التعلم صعوبة نوعية مستمرة لا تفسرها الإعاقة الحسية أو العقلية أو نقص فرص التعليم، وتُحدد بتقييم شامل. أما انخفاض الذكاء العام فليس خاصية تعريفية لازمة؛ إذ قد يكون الطالب قادرًا على النقاش وحل المشكلات ويتعثر في مهارة نوعية.","n":["هذه من العناصر المشتركة في تعريفات صعوبات التعلم.","عنصر الاستبعاد جزء أساسي من المفهوم.","صحيح: الذكاء المنخفض ليس خاصية لازمة لصعوبات التعلم.","التقييم الشامل من العناصر المشتركة في التعريفات."],"c":"«لا» يُعد خاصية تعريفية لازمة","p":"صعوبات التعلم ليست مرادفًا لضعف الذكاء ولا للكسل."},{"id":"12-11","s":12,"i":"12.2","l":"تطبيق","t":"تعطي المعلمة تعليمات شفهية من أربع خطوات، فيبدأ سعد بالخطوة الأولى ثم يتوقف ويسأل عما بعدها، مع أنه ينفذ كل خطوة بدقة حين تُقدَّم منفردة. ما الإجراء الأنسب؟","o":["تكرار التعليمات الأربع كاملة بصوت أوضح قبل بدء المهمة مباشرة","إعفاؤه من المهام متعددة الخطوات حتى تتحسن ذاكرته العاملة","تنبيهه إلى ضرورة الانتباه، وتسجيل ملاحظة سلوكية في ملفه عن إهماله المتكرر للتعليمات","تجزئة التعليمات وتوفير قائمة خطوات مرئية يرجع إليها، وطلب إعادة صياغته للمطلوب"],"a":3,"w":"نجاحه في كل خطوة منفردة وتعثره عند تراكم الخطوات يشيران إلى عبء زائد على الذاكرة العاملة. والإجراء الأنسب تقليل الحمل: تجزئة التعليمات، ودعم بصري خارجي، والتحقق من الفهم بإعادة الصياغة، ثم زيادة التعقيد تدريجيًّا.","n":["يكرر الحمل نفسه على الذاكرة العاملة دون تخفيفه.","يحرمه من التعلم بدل تقديم دعم يخفف الحمل.","يفسر أثر الذاكرة العاملة تفسيرًا سلوكيًّا خاطئًا.","صحيح: يخفف الحمل على الذاكرة العاملة."],"c":"ينجح في الخطوة منفردة ويضيع عند تراكمها","p":"ينسى التعليمات المتعددة في أثناء التنفيذ ← ذاكرة عاملة ← تجزئة ودعم بصري."},{"id":"12-12","s":12,"i":"12.2","l":"تطبيق","t":"كلما قُدّمت لخالد مسألة كسور جديدة قال: «لن أفهمها مهما حاولت» وترك الورقة، وتُظهر سجلاته إخفاقات متكررة في الرياضيات خلال السنوات السابقة. ما الاستجابة الأنسب؟","o":["طمأنته لفظيًّا بأنه قادر على الحل مع
