س التقدم يطابق الهدف؛ لا تقِس السهل بدل المقصود."},{"id":"18-15","s":18,"i":"18.4","l":"تطبيق","t":"دُرّس الطالب سلمان قراءة الكلمات المشتملة على المد بالألف، وأصبح يقرأ قائمة كلمات التدريب كاملة دون أخطاء. ما التقويم الأنسب للحكم على إتقانه هذا النمط؟","o":["قراءة كلمات جديدة لم يتدرب عليها من النمط نفسه مع تسجيل الدقة","إعادة قراءة قائمة كلمات التدريب نفسها في اليوم التالي مع تسجيل الدقة","سؤاله شفهيًّا عن قاعدة المد بالألف وطلب أمثلة عليها من ذاكرته","اختيار الكلمة المشتملة على المد من بين بدائل مكتوبة في ورقة عمل"],"a":0,"w":"أفضل تقويم لما سبق تدريسه يقيس المهارة نفسها في أمثلة جديدة عادلة تمثل النمط، لا ما حفظه الطالب من قائمة التدريب. ونجاحه في قراءة كلمات جديدة من النمط نفسه يدل على تعميم القاعدة، مع تسجيل الدقة والاستقلال.","n":["صحيح: أمثلة جديدة تقيس القاعدة.","خطأ: قد يقيس حفظ القائمة لا تطبيق القاعدة.","خطأ: يقيس المعرفة عن المهارة لا أداءها.","خطأ: التعرف بين بدائل لا يساوي القراءة الفعلية."],"c":"يقرأ قائمة كلمات التدريب كاملة","p":"مثال جديد + البناء نفسه = دليل على تعلم القاعدة لا حفظ القائمة."},{"id":"18-16","s":18,"i":"18.4","l":"تطبيق","t":"أتقنت الطالبة ريم جمع الكسور المتشابهة المقامات في اختبار نهاية الوحدة، وتريد المعلمة التحقق من احتفاظها بالمهارة. ما الإجراء الأنسب؟","o":["تقويمها بمسائل ممثلة بعد فاصل زمني مناسب دون مراجعة قبل القياس","مراجعة المهارة معها في بداية الحصة ثم اختبارها مباشرة بعد المراجعة","إعادة اختبار نهاية الوحدة نفسه عليها في اليوم التالي للاختبار الأول","سؤالها عن مدى ثقتها بقدرتها على حل مسائل الكسور دون مساعدة"],"a":0,"w":"قياس الاحتفاظ يُجرى بعد فاصل زمني مناسب لمعرفة هل بقيت المهارة دون إعادة تعليم قبل القياس، ويفضل أن يكون بمسائل ممثلة جديدة. أما الاختبار بعد مراجعة أو في اليوم التالي بالبنود نفسها فيقيس الأداء الفوري أو الألفة.","n":["صحيح: زمن + أداء مستقل دون إعادة تعليم.","خطأ: المراجعة قبل القياس تقيس الأداء الفوري لا الاحتفاظ.","خطأ: لا فاصل زمني كافٍ، وتكرار البنود يرفع أثر الألفة.","خطأ: تقرير ذاتي لا يقيس بقاء المهارة."],"c":"التحقق من احتفاظها بالمهارة","p":"الاحتفاظ = فاصل زمني + أداء مستقل + دون مراجعة مسبقة."},{"id":"18-17","s":18,"i":"18.4","l":"تحليل","t":"حقق الطالب مشعل دقة 90% في اختبار القسمة الطويلة، لكن المعلم كان يذكّره بالخطوة التالية في كل مسألة تقريبًا. ما التفسير الأدق لهذه النتيجة؟","o":["إتقان مستقل؛ لأن التلميحات لم تتضمن الإجابة النهائية لأي مسألة من المسائل","أداء مدعوم لا يثبت الإتقان المستقل، فيُعاد القياس مع تلاشي التلميحات","إخفاق في المهارة؛ لأن الطالب احتاج إلى المساعدة في أغلب المسائل","إتقان كامل يسمح بنقله مباشرة إلى الهدف التالي في خطته الفردية"],"a":1,"w":"قد يحقق طالبان الدرجة نفسها بمستويين مختلفين من الدعم؛ لذلك يُسجل مقدار التلميح مع الدقة. وإذا قدّم المعلم تلميحات أثناء القياس فهو يقيس الأداء المدعوم لا الاستقلال، فيُعاد القياس بتلميحات أقل حتى تتضح القدرة المستقلة.","n":["خطأ: التلميح بالخطوة يغيّر معنى الاستقلال حتى دون إعطاء الناتج.","صحيح: النسبة مع التلميح ليست استقلالًا.","خطأ: حكم متطرف؛ فهو يؤدي المهارة بدعم ويحتاج قياسًا مستقلًا.","خطأ: يتجاهل مقدار الدعم المقدم أثناء القياس."],"c":"يذكّره بالخطوة التالية في كل مسألة","p":"سجّل الدعم مع الدقة: 90% بتلميح لا تساوي 90% باستقلال."},{"id":"18-18","s":18,"i":"18.4","l":"تطبيق","t":"هدف وحدة العلوم أن يفسر الطالب سبب تعاقب الليل والنهار، والطالب فيصل يعاني صعوبة شديدة في الكتابة. ما طريقة التقويم الأنسب لهذا الهدف؟","o":["سؤال مقالي مكتوب مع التسامح في الأخطاء الإملائية عند تصحيحه","أسئلة صواب وخطأ عن الظاهرة لتجنيبه الكتابة المطولة في الإجابة","إعفاؤه من تقويم هذا الهدف مراعاةً لصعوبة الكتابة الشديدة لديه","استجابة شفهية أو مسجلة صوتيًّا تُقوَّم بمحك واضح للتفسير"],"a":3,"w":"الهدف تفسير مفهوم علمي لا مهارة الكتابة، فإذا كانت الكتابة عائقًا غير مقصود جاز اختيار طريقة استجابة بديلة كالشفهي أو التسجيل الصوتي وفق الخطة، مع محك تصحيح واضح. وهكذا يقاس الفهم نفسه دون تلوثه بمهارة غير مستهدفة.","n":["خطأ: يبقى الإنتاج الكتابي عائقًا أمام إظهار الفهم.","خطأ: تقيس التعرف لا القدرة على التفسير، وتكثر فيها فرص التخمين.","خطأ: الإعفاء يحرمه من إظهار تعلمه بدل إزالة العائق.","صحيح: طابق طريقة الاستجابة مع الهدف."],"c":"يفسر سبب ... صعوبة شديدة في الكتابة","p":"غيّر طريقة الاستجابة، لا المعرفة المطلوبة."},{"id":"18-19","s":18,"i":"18.4","l":"معرفة","t":"ما الغرض الأساسي من استخدام نموذج موازٍ (Parallel Form) عند إعادة قياس مهارة سبق تدريسها؟","o":["تقليل أثر حفظ البنود مع قياس البناء نفسه بصعوبة متقاربة","رفع مستوى صعوبة الاختبار لقياس تقدم الطالب بدقة أكبر من قبل","تغيير المهارة المقيسة لتناسب الأهداف الجديدة في الخطة الفردية","منح الطالب فرصة ثانية على البنود نفسها لتحسين درجته السابقة"],"a":0,"w":"النموذج الموازي نسخة تقيس البناء نفسه بمستوى صعوبة متقارب ولكن ببنود مختلفة، فيقلل أثر الألفة وحفظ البنود عند إعادة القياس. وبذلك يمكن نسبة التحسن إلى التعلم لا إلى تذكر الأسئلة.","n":["صحيح: بنود مختلفة وبناء واحد.","خطأ: النموذج الموازي متقارب الصعوبة لا أصعب.","خطأ: النموذج الموازي يقيس البناء نفسه.","خطأ: هذا عكس الغرض؛ فالموازي يستخدم بنودًا مختلفة."],"c":"نموذج موازٍ عند إعادة قياس","p":"إعادة القياس بالنسخة نفسها تخلط الألفة بالتعلم؛ استخدم نموذجًا موازيًا."},{"id":"18-20","s":18,"i":"18.5","l":"تحليل","t":"تُظهر بيانات الطالبة جود خلال ستة أسابيع تحسنًا طفيفًا، لكن خط اتجاهها يبتعد تدريجيًّا عن خط الهدف، وتؤكد سجلات التنفيذ تقديم التدخل كما خُطط. ما القرار الأنسب؟","o":["الاستمرار في التدخل دون أي تغيير؛ لأن درجاتها ترتفع أسبوعًا بعد أسبوع بانتظام","عدّ النمو غير كافٍ، وتحليل أخطائها، وتعديل التدخل أو تكثيفه ثم متابعة الأثر","خفض الهدف السنوي ليتناسب مع معدل النمو الحالي الذي تظهره الطالبة","انتظار نهاية الفصل الدراسي لجمع بيانات أكثر قبل إجراء أي تعديل"],"a":1,"w":"لا يكفي أن يتحسن الطالب، بل يجب أن يتحسن بالسرعة التي تقربه من الهدف. ومع اتجاه يبتعد عن خط الهدف وسلامة تنفيذ مؤكدة، يُحلل نمط الأخطاء ويُعدّل أحد عناصر التدخل أو يُكثف، ثم يُتابع أثر التعديل.","n":["خطأ: التحسن المطلق لا يعني أن معدل النمو كافٍ.","صحيح: نمو غير كافٍ مع تنفيذ سليم = تعديل.","خطأ: يخفض التوقع بدل تحسين التدريس.","خطأ: الاتجاه الضعيف الثابت مع تنفيذ سليم لا يبرر الانتظار الطويل."],"c":"يبتعد عن خط الهدف ... كما خُطط","p":"قارن ميل الاتجاه بخط الهدف، لا الدرجة الأخيرة بالأولى."},{"id":"18-21","s":18,"i":"18.5","l":"تطبيق","t":"ضعف اتجاه الطالب عبدالله في تدخل الرياضيات، وتبيّن أن نصف الجلسات المقررة لم تُقدَّم بسبب انشغال المدرسة بالأنشطة. ما الأولوية؟","o":["استبدال التدخل فورًا بتدخل آخر أكثر كثافة وتنظيمًا وأقوى أثرًا في الرياضيات","إصلاح سلامة التنفيذ والجرعة، ثم جمع البيانات قبل الحكم على التدخل","إحالة الطالب إلى تقييم أعمق لعدم استجابته للتدخل المقدم إليه","خفض معيار الهدف بسبب عدم كفاية الوقت المتاح للتدريس هذا الفصل"],"a":1,"w":"قبل استنتاج أن التدخل فشل، يُتحقق من تطبيق مكوناته وجرعته وتكراره كما خُطط؛ وإلا فالمشكلة في التنفيذ لا في الاستراتيجية ولا في الطالب. فالأولوية إصلاح التنفيذ ثم جمع بيانات جديدة.","n":["خطأ: لا يُحكم على تدخل لم يُقدَّم كما صُمم.","صحيح: سلامة التنفيذ (Fidelity) أولًا.","خطأ: «عدم الاستجابة» هنا غير مثبت لضعف التنفيذ.","خطأ: يعالج خلل التنفيذ بخفض التوقعات."],"c":"نصف الجلسات المقررة لم تُقدَّم","p":"اتجاه ضعيف مع تنفيذ ناقص = أصلح التنفيذ أولًا، لا الخطة."},{"id":"18-22","s":18,"i":"18.5","l":"تطبيق","t":"تجاوزت الطالبة ريم معيار هدفها في الإملاء بثبات في أربعة قياسات متتالية، قبل الموعد المحدد في خطتها بشهرين. ما الإجراء الأنسب؟","o":["الإبقاء على الهدف نفسه حتى موعده المحدد في الخطة التزامًا بما اعتمده الفريق","إيقاف تقويم الإملاء لديها نهائيًّا لتحقق الهدف قبل موعده","توثيق الإتقان والانتقال إلى هدف تالٍ أو التخطيط للتعميم والصيانة","زيادة عدد كلمات التدريب من القائمة نفسها حتى نهاية الفصل"],"a":2,"w":"عندما يثبت الإتقان قبل الموعد، لا يُبقى الطالب على تدريب غير ضروري؛ بل يُوثق الإنجاز ويُنتقل إلى هدف أعلى، أو يُخطط لتعميم المهارة وصيانتها بمراجعات وقياسات متباعدة. فالخطة تستجيب للبيانات لا للتواريخ.","n":["خطأ: جمود إداري يُبقيها في تدريب منخفض التحدي.","خطأ: الصيانة تحتاج قياسات متباعدة بعد الإتقان.","صحيح: الإتقان يستدعي خطوة تالية.","خطأ: مزيد من الشيء نفسه لا يضيف تحديًا ولا تعميمًا."],"c":"بثبات في أربعة قياسات ... قبل الموعد","p":"الإتقان المبكر الثابت = هدف تالٍ أو تعميم وصيانة."},{"id":"18-23","s":18,"i":"18.5","l":"تطبيق","t":"أظهر تحليل أخطاء الطالب سلمان في القراءة الجهرية أن معظمها يقع في الكلمات المبدوءة بـ«ال» الشمسية. ما القرار التدريسي الأنسب؟","o":["إعادة تدريس برنامج القراءة كاملًا له من بدايته بصورة أبطأ","زيادة زمن القراءة الحرة اليومية له في المنزل بمتابعة الأسرة وتشجيعها","تحويل هدفه في الخطة من دقة القراءة إلى فهم المقروء مباشرة","تدريس صريح مستهدف لهذا النمط مع ممارسة موجهة ثم إعادة القياس"],"a":3,"w":"تحليل الأخطاء يحوّل الخطأ إلى معلومة تدريسية؛ فإذا تركزت الأخطاء في نمط محدد، يُستهدف هذا النمط بتدريس صريح وممارسة مناسبة، ثم يُعاد القياس للتحقق من الأثر، بدل إعادة كل شيء أو الاكتفاء بممارسة عامة.","n":["خطأ: استجابة مفرطة لحاجة محددة.","خطأ: ممارسة عامة لا تستهدف النمط الخاطئ.","خطأ: يترك الحاجة المحددة دون معالجة.","صحيح: نوع الخطأ يحدد نوع التدريس."],"c":"معظمها في «ال» الشمسية","p":"خطأ نوعي متكرر = تدريس مباشر للحاجة نفسها."},{"id":"18-24","s":18,"i":"18.5","l":"معرفة","t":"ما الذي يميز التجميع المرن (Flexible Grouping) القائم على بيانات التقويم؟","o":["يُبنى على تشخيص الطالب ويبقى ثابتًا طوال العام الدراسي","يُقسَم فيه الطلاب بحسب أعمارهم الزمنية وصفوفهم فقط","تتغير عضوية المجموعات بحسب الاحتياجات الحالية وبيانات التقدم","يجمع الطلاب ذوي صعوبات التعلم في مجموعة خاصة بهم دائمًا"],"a":2,"w":"التجميع المرن يستخدم بيانات المهارات لتشكيل مجموعات بحسب الحاجة الحالية، فيدخل الطالب مجموعة فك الترميز اليوم ويخرج منها بعد الإتقان. وبذلك تطابق المجموعات الحاجة المتغيرة ولا تتحول إلى تسميات دائمة.","n":["خطأ: الثبات والارتباط بالتشخيص يحوّلانه إلى تسمية دائمة.","خطأ: العمر لا يعكس الحاجة المهارية الحالية.","صحيح: البيانات تحرك المجموعات.","خطأ: تجميع بالفئة لا بالحاجة، ويسبب الوصم."],"c":"التجميع المرن القائم على بيانات التقويم","p":"المجموعة المرنة تتبع البيانات، والثابتة تتبع التسمية."},{"id":"18-25","s":18,"i":"18.6","l":"تطبيق","t":"الطالب فيصل مشخّص ضمن فئة صعوبات التعلم وفق الإجراءات المعتمدة، لكن مدرسته الحالية لا يتوفر فيها برنامج صعوبات تعلم. ما الحكم الصحيح في تقويمه؟","o":["يُقوَّم كسائر الطلاب دون أي ترتيبات حتى يُفتتح برنامج في مدرسته","تُطبَّق عليه أدوات وأساليب التقويم المناسبة لفئته رغم عدم توفر البرنامج","يُؤجَّل تقويمه في المواد المتأثرة حتى ينتقل إلى مدرسة بها برنامج","يُعفى من الاختبارات التحريرية كلها ويُكتفى بملاحظة أدائه اليومي في الصف"],"a":1,"w":"تنص الإجراءات على أن الطلاب المشخّصين ضمن فئة صعوبات التعلم تُطبق عليهم أدوات وأساليب التقويم الخاصة بفئتهم، حتى عند عدم تقديم الخدمات المساندة لعدم توفر البرنامج في المدرسة. فعدم توفر البرنامج لا يُسقط ترتيبات التقويم المناسبة.","n":["خطأ: يربط حق التقويم المناسب بوجود البرنامج.","صحيح: الحق يتبع التشخيص والحاجة لا وجود البرنامج.","خطأ: التأجيل يحرمه من التقويم العادل ولا سند له.","خطأ: الإعفاء العام ليس الإجراء المقرر، والتقويم فردي بحسب حاجته."],"c":"مشخّص ... لا يتوفر فيها برنامج","p":"التشخيص والحاجة يحددان أساليب التقويم، لا وجود غرفة المصادر."},{"id":"18-26","s":18,"i":"18.6","l":"تطبيق","t":"الطالبة جود مشخّصة بصعوبات في القراءة، ولا تتلقى خدمة خاصة في مادة العلوم، لكن قراءة الأسئلة تعيقها عن إظهار فهمها للمفاهيم العلمية. ما الإجراء الأنسب وفق قواعد التقويم؟","o":["تعاون معلمة العلوم ومعلمة التربية الخاصة لاختيار طريقة مناسبة كقراءة الأسئلة لها","إعفاؤها من اختبارات العلوم؛ لأن صعوبتها في القراءة لا في مادة العلوم","تقويمها كزميلاتها تمامًا؛ لأنها لا تتلقى خدمة خاصة في مادة العلوم","استبدال أسئلة العلوم المقررة بأسئلة أسهل محتوىً من الوحدة نفسها"],"a":0,"w":"عندما تؤثر صعوبة التعلم في أداء الطالب بمادة لا يتلقى فيها خدمة خاصة، يكون التقويم بالتعاون بين معلم المادة ومعلم التربية الخاصة لاختيار طريقة تناسب قدراته واحتياجاته. وقراءة الأسئلة هنا تزيل عائقًا غير مقصود، ويبقى فهم العلوم محور القياس.","n":["صحيح: تعاون مع إزالة عائق القراءة.","خطأ: الإعفاء التلقائي ليس الحل النظامي.","خطأ: تأثير الصعوبة في مادة أخرى يستدعي التعاون لا التجاهل.","خطأ: يغيّر مستوى الهدف بدل إزالة عائق القراءة."],"c":"قراءة الأسئلة تعيقها ... لا تتلقى خدمة في العلوم","p":"صعوبة تمتد إلى مادة أخرى = تعاون معلم المادة ومعلم التربية الخاصة."},{"id":"18-27","s":18,"i":"18.6","l":"معرفة","t":"وفق قواعد تقويم الطلاب ذوي صعوبات التعلم، من يتولى الإشراف على اختبارات التقويم في المواد التي يتلقى فيها الطالب خدمات التربية الخاصة؟","o":["وكيل الشؤون التعليمية في المدرسة","معلم صعوبات التعلم","معلم المادة منفردًا دون مشاركة","المرشد الطلابي بالتنسيق مع الأسرة"],"a":1,"w":"في المواد التي يتلقى فيها الطالب خدمات التربية الخاصة، يتولى معلم صعوبات التعلم الإشراف على اختبارات التقويم وفق ما ورد في الإجراءات. أما المواد الأخرى التي تتأثر بالصعوبة فيكون تقويمها بالتعاون بين معلم المادة ومعلم التربية الخاصة.","n":["خطأ: الإشراف في مواد الخدمة منوط بمعلم صعوبات التعلم.","صحيح: يشرف على تقويم مواد الخدمة.","خطأ: يتجاهل الدور التخصصي المنصوص عليه.","خطأ: ليس صاحب هذا الدور في تقويم الفئة."],"c":"المواد التي يتلقى فيها خدمات التربية الخاصة","p":"مواد الخدمة: إشراف معلم الصعوبات؛ وغيرها: تعاون مع معلم المادة."},{"id":"18-28","s":18,"i":"18.6","l":"تحليل","t":"قررت إدارة مدرسة منح جميع طلاب صعوبات التعلم فيها وقتًا إضافيًّا وقراءة للأسئلة في كل الاختبارات «تحقيقًا للعدالة». ما الخلل الأدق في هذا القرار؟","o":["الوقت الإضافي غير مسموح به أصلًا في قواعد تقويم ذوي صعوبات التعلم","قراءة الأسئلة للطالب تُعد تلقينًا للإجابة في جميع الأحوال والمواد الدراسية","يخالف الفردية؛ فالترتيب يُختار بحسب الحاجة الموثقة لكل طالب في خطته","لا خلل فيه؛ لأن التشخيص الواحد يعني احتياجًا واحدًا لجميع الطلاب"],"a":2,"w":"تُطبق أدوات القياس والتقويم بشكل فردي وفق احتياجات كل طالب وتوثق في خطته؛ فلا توجد حزمة ثابتة تُطبق تلقائيًّا على كل الطلاب ذوي صعوبات التعلم. والعدالة لا تعني التطابق، بل توفير الوسيلة المناسبة لكل طالب دون تغيير الهدف المقيس.","n":["خطأ: إعطاء زمن يتناسب مع قدرات الطالب وارد في أدلة التربية الخاصة.","خطأ: قراءة السؤال تزيل عائق الوصول، والتلقين هو إعطاء الإجابة.","صحيح: الحاجة الفردية الموثقة تحدد الترتيب.","خطأ: التشخيص نفسه لا يعني الاحتياج نفسه."],"c":"منح جميع الطلاب ... في كل الاختبارات","p":"العدالة لا تعني التطابق؛ التكييف فردي بحسب الحاجة الموثقة."},{"id":"18-29","s":18,"i":"18.6","l":"معرفة","t":"أي المطابقات الآتية بين حاجة الطالب والإجراء التقويمي تتفق مع قواعد تقويم الطلاب ذوي صعوبات التعلم؟","o":["نشاط زائد مصاحب ← السماح له بالقيام من مقعده والمشي ثم الجلوس أثناء التقويم","صعوبة في الكتابة ← قراءة الأسئلة له بصوت عالٍ مع إبقاء الإجابة كتابية","مشكلة انتباه مصاحبة ← تقويمه في القاعة مع زملائه لتعويده على التركيز وسط المشتتات","صعوبة في الحفظ ← تقويمه في مادة الحفظ كاملة دفعة واحدة مع زمن أطول"],"a":0,"w":"تربط قواعد التقويم كل حاجة بإجراء محدد: النشاط الزائد المصاحب يُسمح معه بالقيام والمشي ثم الجلوس، والانتباه بتقويم فردي بعيد عن المشتتات، وصعوبة الكتابة بالتقويم الشفهي أو كتابة الإجابة له أو تسجيلها، وصعوبة الحفظ بتجزئة المادة. فالقاعدة: اختر الإجراء المرتبط بالحاجة المحددة.","n":["صحيح: حركة منظمة للنشاط الزائد.","خطأ: صعوبة الكتابة يقابلها التقويم الشفهي أو كتابة الإجابة له أو تسجيلها.","خطأ: الإجراء المقرر تقويمه فرديًّا بعيدًا عن مصادر التشتيت.","خطأ: الإجراء المقرر تجزئة مادة الحفظ إلى أجزاء قصيرة تناسب قدرته."],"c":"المطابقات بين حاجة الطالب والإجراء","p":"حدد الحاجة أولًا (قراءة، كتابة، انتباه، حركة، حفظ) ثم الإجراء المقابل لها."},{"id":"18-30","s":18,"i":"18.7","l":"تطبيق","t":"انتقل طالب حديثًا من بلد لا تُستخدم فيه العربية، وحصل على درجات منخفضة في اختبارات المفردات والفهم القرائي بالعربية، بينما تفيد أسرته بتقدمه الجيد في القراءة بلغته الأم. ما الإجراء الأنسب؟","o":["جمع تاريخه اللغوي وأدائه في لغته الأقوى وفرص تعلمه للعربية قبل أي تفسير","إحالته فورًا لتقييم صعوبات التعلم؛ لأن ضعفه في الفهم القرائي واضح جدًّا","الاعتماد على درجته في اختبار مقنن بالعربية؛ لأنه أكثر موضوعية من غيره","تجاهل إفادة الأسرة؛ لأنها لا تستند إلى قياس رسمي لقراءته بلغته الأم"],"a":0,"w":"اختبار طالب بلغة لا يتقنها ثم تفسير انخفاضه بأنه صعوبة تعلم قد يقيس الكفاءة اللغوية أكثر من المهارة المقصودة. لذلك يُجمع تاريخ تطوره اللغوي وأداؤه في لغته الأقوى وفرص تعلمه؛ فالصعوبة التي تظهر فقط في لغة لم يتقنها قد يكون لها تفسير لغوي يحتاج فحصًا قبل التصنيف.","n":["صحيح: افصل أثر اللغة عن الصعوبة.","خطأ: يخلط بين تعلم لغة جديدة واضطراب التعلم.","خطأ: الاختبار قد يقيس كفاءته اللغوية أكثر من المهارة المقصودة.","خطأ: الأسرة مصدر مهم للتاريخ اللغوي والتعليمي."],"c":"انتقل حديثًا ... تقدمه الجيد بلغته الأم","p":"حديث التعلم بلغة التعليم = افحص اللغة وفرص التعلم قبل التصنيف."},{"id":"18-31","s":18,"i":"18.7","l":"معرفة","t":"أي الممارسات الآتية تمثل تحيزًا تأكيديًّا (Confirmation Bias) في عملية التشخيص؟","o":["تفسير الدرجة في ضوء فاصل الثقة وخطأ القياس قبل اتخاذ القرار","جمع بيانات إضافية عند تعارض مصادر التقييم المختلفة","اعتماد النتائج المؤيدة لتشخيص متوقع وإهمال النتائج المخالفة له","توثيق ظروف تطبيق الاختبار بالتفصيل في تقرير التقييم"],"a":2,"w":"التحيز التأكيدي اختيار النتائج التي تؤيد فرضية مسبقة وإهمال المخالفة لها، فيضيق التفسير ويقود إلى تشخيص غير دقيق. والصحيح تفسير الأدلة المتوافقة والمتعارضة معًا والبحث عن سبب التعارض.","n":["خطأ: ممارسة صحيحة تمنع اليقين الزائف.","خطأ: ممارسة صحيحة لتفسير التعارض بدل إخفائه.","صحيح: انتقاء ما يؤكد الفرضية.","خطأ: ممارسة صحيحة تساعد على تفسير الأداء."],"c":"تحيزًا تأكيديًّا (Confirmation Bias)","p":"إذا اخترت من البيانات ما يوافق توقعك فقط، فأنت تؤكد رأيك لا تقيس الطالب."},{"id":"18-32","s":18,"i":"18.7","l":"تطبيق","t":"حصل طالبان على درجتين معياريتين متقاربتين جدًّا، إحداهما دون نقطة القطع بدرجتين والأخرى فوقها بدرجة واحدة. ما التصرف الأدق؟","o":["تصنيف الأول ضمن الفئة واستبعاد الثاني التزامًا بنقطة القطع المحددة","إعادة الاختبار نفسه على الطالبين في اليوم التالي مباشرة للحسم","اعتماد متوسط الدرجتين معيارًا موحدًا للحكم على كلا الطالبين","تفسير الدرجتين في ضوء خطأ القياس وفاصل الثقة وبقية الأدلة"],"a":3,"w":"كل درجة تتضمن قدرًا من خطأ القياس، ولذلك لا تُعامل الفروق الصغيرة جدًّا قرب نقطة القطع حقائق قاطعة. ففاصل الثقة يذكّر بعدم اليقين، والطالب القريب من الحد يحتاج تفسيرًا حذرًا وأدلة إضافية.","n":["خطأ: يعامل فرقًا صغيرًا داخل خطأ القياس كفاصل جوهري.","خطأ: التكرار القريب يضيف أثر الممارسة ولا يحسم الأمر.","خطأ: إجراء حسابي لا معنى تشخيصيًّا له.","صحيح: نقطة القطع أداة لا قرار كامل."],"c":"دون نقطة القطع بدرجتين ... فوقها بدرجة","p":"قرب نقطة القطع: فكّر في فاصل الثقة وبقية الأدلة، لا في الرقم وحده."},{"id":"18-33","s":18,"i":"18.7","l":"تحليل","t":"ورد في تقرير طالب بالصف الخامس أن «مكافئه الصفي في القراءة هو الصف الثاني»، فاقترح أحد الأعضاء تدريسه منهج القراءة للصف الثاني كاملًا. ما التقييم الأدق للاقتراح؟","o":["غير دقيق؛ فالمكافئ مؤشر محدود، والتخطيط يُبنى على تحليل مهاراته الفعلية","دقيق؛ لأن المكافئ الصفي يحدد مستوى المنهج المناسب للطالب بدقة","دقيق؛ بشرط موافقة الأسرة كتابيًّا على تغيير منهج القراءة لابنها هذا العام","غير دقيق؛ لأن المكافئ الصفي يعبر عن نسبة إجاباته الصحيحة فقط"],"a":0,"w":"الصف أو العمر المكافئ وصف محدود للأداء ضمن معايرة الاختبار، ولا يعني أن الطالب يمتلك ملف مهارات طالب ذلك الصف كاملًا، ولا يعني نقله إلى منهجه. والتخطيط الصحيح يُبنى على تحليل المهارات المتقنة وغير المتقنة.","n":["صحيح: المكافئ لا يصف ملف المهارات كاملًا.","خطأ: التفسير الحرفي للمكافئ من أشهر أخطاء القياس.","خطأ: موافقة الأسرة لا تصحح تفسيرًا خاطئًا للدرجة.","خطأ: الحكم صحيح لكن التعليل خاطئ."],"c":"مكافئه الصفي ... منهج الصف الثاني كاملًا","p":"لا تحوّل المكافئ الصفي إلى صف دراسي ينتقل إليه الطالب."},{"id":"18-34","s":18,"i":"18.7","l":"تحليل","t":"قِيست طلاقة الطالبة ريم شهرين بقراءتها النص بنفسها، ثم صارت المعلمة تقرأ لها النص أولًا قبل كل قياس دون توثيق، فارتفعت الدرجات. ما الخطأ الأهم؟","o":["زيادة عدد مرات قياس الطلاقة عن الحد المعتاد في برامج المتابعة","استخدام نصوص متكافئة مختلفة في كل جلسة من جلسات القياس","عرض نتائج القياس على الطالبة بانتظام لتعزيز دافعيتها للقراءة","تغيير شروط القياس دون توثيق، مما يجعل مقارنة الدرجات وتفسير النمو مضللين"],"a":3,"w":"تغيير طريقة العرض أو الاستجابة بين القياسات دون توثيق يجعل مقارنة الدرجات عبر الزمن مضللة؛ فالارتفاع هنا قد يعود إلى سماع النص مسبقًا لا إلى نمو الطلاقة، وقد يغيّر ذلك البناء المقيس نفسه. لذلك يُوثق أي تغيير في طريقة التقويم ويُراعى أثره.","n":["خطأ: لا قرينة على زيادة عدد القياسات.","خطأ: هذه ممارسة صحيحة تقلل أثر الألفة.","خطأ: مشاركة الطالب بياناته ممارسة مفيدة لا خطأ.","صحيح: تغيّر الشروط دون توثيق يضلل التفسير."],"c":"صارت تقرأ لها النص أولًا ... دون توثيق","p":"غيّرت طريقة القياس؟ وثّق، ولا تقارن الأرقام كأن شيئًا لم يتغير."},{"id":"18-35","s":18,"i":"18.8","l":"معرفة","t":"ما أبرز قيد للمقابلة بوصفها أسلوبًا لجمع البيانات في تقييم الطلاب ذوي صعوبات التعلم؟","o":["اعتمادها على ذاكرة المجيب وإدراكه الشخصي، فتحتاج تحققًا من مصادر أخرى","عجزها عن تقديم أي معلومات مفيدة عن تاريخ المشكلة وسياقاتها المختلفة في البيت","حاجتها إلى معايير مقننة وجداول تحويل لا يطبقها إلا الأخصائي النفسي","استغراقها وقتًا أطول من أي أسلوب تقويم آخر في جميع الحالات"],"a":0,"w":"توفر المقابلة معلومات مهمة من الطالب والأسرة والمعلمين عن التاريخ والسياق والاستراتيجيات، لكنها تعتمد على الذاكرة والإدراك الشخصي؛ ولذلك تُستخدم مصدرًا مكملًا يُتحقق منه بالملاحظة وبيانات الأداء، لا حكمًا منفردًا.","n":["صحيح: تقرير ذاتي يحتاج تحققًا.","خطأ: التاريخ والسياق أبرز ما تقدمه المقابلة.","خطأ: المقابلة ليست اختبارًا معياريًّا مقننًا.","خطأ: تعميم غير صحيح، وليس القيد الجوهري."],"c":"أبرز قيد للمقابلة","p":"المقابلة تعطي سياقًا وفرضيات، والأداء الملاحظ يؤكدها أو ينفيها."},{"id":"18-36","s":18,"i":"18.8","l":"تطبيق","t":"يريد المعلم معرفة عدد الدقائق التي يستمر فيها الطالب مشعل منخرطًا في مهمة الكتابة المستقلة قبل أن يتوقف. ما أسلوب التسجيل الأنسب؟","o":["التسجيل الحدثي لعدد مرات بدئه المهمة","قائمة شطب لخطوات الكتابة المنجزة","تسجيل المدة","مقياس تقدير يعبئه وليّ الأمر أسبوعيًّا"],"a":2,"w":"تسجيل المدة يقيس كم يستمر السلوك أو الانخراط، وهو المناسب عندما تكون المدة هي المتغير المهم. أما التسجيل الحدثي فيعد مرات الحدوث ولا يصف المدة، وقائمة الشطب تبين وجود الخطوة لا زمنها.","n":["خطأ: يعد مرات البداية ولا يقيس الاستمرار.","خطأ: تبين وجود الخطوات لا زمن الانخراط.","صحيح: كم يستمر = مدة.","خطأ: تقدير غير مباشر لا يقيس السلوك في الصف."],"c":"عدد الدقائق التي يستمر فيها","p":"كم مرة؟ تسجيل حدثي. كم يستمر؟ تسجيل مدة."},{"id":"18-37","s":18,"i":"18.8","l":"تطبيق","t":"تريد المعلمة تقويم فقرة وصفية كتبتها الطالبة ريم من حيث الفكرة والتنظيم والمفردات، وتحديد مستوى أدائها في كل جانب على حدة. ما الأداة الأنسب؟","o":["سلم تقدير تحليلي (Analytic Rubric) بمستويات موصوفة لكل بُعد","قائمة شطب توضح وجود عناصر الفقرة المطلوبة أو غيابها","سلم تقدير كلي (Holistic Rubric) يعطي حكمًا إجماليًّا على الفقرة","اختبار اختيار من متعدد في قواعد كتابة الفقرة وعناصرها"],"a":0,"w":"سلم التقدير التحليلي يقسم الأداء إلى أبعاد كالفكرة والتنظيم والمفردات، ويصف مستويات كل بُعد، فيفيد عند الحاجة إلى تشخيص نقاط القوة والضعف. أما الكلي فيعطي حكمًا إجماليًّا، وقائمة الشطب تبين الوجود لا الجودة.","n":["صحيح: التحليلي يحدد مستوى كل بُعد.","خطأ: تبين الوجود لا مستوى الجودة.","خطأ: أسرع، لكنه لا يفصل مستوى كل جانب.","خطأ: يقيس المعرفة عن الكتابة لا إنتاجها."],"c":"مستوى أدائها في كل جانب على حدة","p":"جودة كل بُعد منفصلًا = Rubric تحليلي؛ حكم إجمالي = Rubric كلي."},{"id":"18-38","s":18,"i":"18.8","l":"تحليل","t":"حصل الطالبان سلمان وفيصل على الدرجة نفسها في اختبار قبلي لمهارة الاستنتاج، وبعد جلسة تعليم بتلميحات منظمة متدرجة تحسن سلمان كثيرًا ولم يتحسن فيصل إلا قليلًا. ما الذي كشفه هذا الأسلوب ولم تكشفه الدرجة القبلية؟","o":["موقع كل منهما النسبي مقارنة بمجموعة معيارية مناسبة لعمره وصفه الدراسي","مستوى الذكاء العام لكل منهما بصورة دقيقة يمكن الاعتماد عليها","ثبات الاختبار القبلي ومدى اتساق درجاته عند إعادة تطبيقه","قابلية كل منهما للتعلم واستجابته للوساطة ونوع الدعم الذي يحتاجه"],"a":3,"w":"التقويم الديناميكي (اختبار ثم تدريس ثم إعادة اختبار) يهتم بما يستطيع الطالب تعلمه مع وساطة أو تلميح منظم، لا بما يعرفه حاليًّا فقط. ولذلك ميّز بين طالبين متساويين في الأداء القبلي من حيث قابلية التعلم ونوع الدعم اللازم.","n":["خطأ: هذا يكشفه اختبار معياري المرجع.","خطأ: التقويم الديناميكي لا يُستخدم مقياسًا للذكاء.","خطأ: الثبات خاصية للأداة لا يكشفها هذا الموقف.","صحيح: التقويم الديناميكي يكشف الاستجابة للوساطة."],"c":"بعد جلسة تعليم بتلميحات منظمة","p":"كيف يتعلم مع المساعدة؟ = تقويم ديناميكي."},{"id":"18-39","s":18,"i":"18.8","l":"تطبيق","t":"يؤكد الطالب عبدالله أنه يخطط دائمًا لأفكاره قبل الكتابة، بينما لا تُظهر أعماله أي تخطيط. ما الإجراء الأنسب للتحقق؟","o":["اعتماد إفادته؛ لأنها المصدر الأصدق عن الاستراتيجيات التي يستخدمها","تطبيق استبانة يقدّر فيها بنفسه مدى استخدامه لاستراتيجيات الكتابة","ملاحظة منظمة لأدائه في مواقف كتابة فعلية مع تحليل عينات من أعماله","مقابلة وليّ أمره حول عادات ابنه في أداء الواجبات الكتابية في المنزل"],"a":2,"w":"عند تعارض التقرير الذاتي مع الأعمال، يُتحقق من نمط الأداء بأسلوب مباشر: ملاحظة منظمة في أكثر من موقف كتابة فعلي، مع تحليل عينات العمل. وهذا التثليث أقوى من الاعتماد على الإفادة أو الاستبانة.","n":["خطأ: التقرير الذاتي يحتاج تحققًا من مصادر أخرى.","خطأ: تقرير ذاتي آخر يتأثر بالعوامل نفسها.","صحيح: التثليث بالأداء الملاحظ.","خطأ: مصدر غير مباشر لا يرصد الأداء الفعلي."],"c":"يؤكد ... بينما لا تُظهر أعماله","p":"التقرير الذاتي فرضية؛ الملاحظة المنظمة وعينات العمل تحسمها."},{"id":"18-40","s":18,"i":"18.9","l":"معرفة","t":"ما الوظيفة الأساسية لجدول المواصفات عند إعداد اختبار تحصيلي لوحدة دراسية؟","o":["تحديد زمن الاختبار وعدد صفحاته وطريقة إخراجه وتنسيقه","توزيع البنود على الأهداف والمحتوى ومستويات التفكير وفق أوزانها","ترتيب الطلاب بحسب درجاتهم بعد تصحيح الاختبار وتحليله","تحديد التكييفات الفردية اللازمة لكل طالب في الاختبار"],"a":1,"w":"جدول المواصفات يربط المحتوى بالأهداف ومستويات التفكير، ويوزع عدد البنود بصورة مقصودة وفق أهمية المحتوى والزمن التعليمي، فيمنع الإفراط في جزء وإهمال آخر، وهو بذلك يدعم صدق المحتوى.","n":["خطأ: هذه جوانب تنظيمية لا تحقق تمثيل المحتوى.","صحيح: يحقق صدق المحتوى.","خطأ: الجدول أداة بناء قبل التطبيق لا أداة ترتيب نتائج.","خطأ: التكييفات تُحدد في الخطة الفردية لا في جدول المواصفات."],"c":"الوظيفة الأساسية لجدول المواصفات","p":"جدول المواصفات خريطة تمثيل الأهداف والمحتوى والمستويات."},{"id":"18-41","s":18,"i":"18.9","l":"تحليل","t":"بعد تصحيح اختبار قصير في الرياضيات، أخطأ جميع الطلاب تقريبًا في البند السابع، ومنهم المتفوقون عادة. ما أول إجراء منطقي؟","o":["إعادة تدريس محتوى البند للصف كاملًا في الحصة التالية مباشرة","حذف البند وإعادة احتساب درجات الطلاب جميعهم قبل أي فحص لسبب الخطأ","عدّ البند مميزًا جيدًا لأنه صعب على جميع الطلاب دون استثناء","مراجعة صياغة البند ومفتاح إجابته ومدى تدريس محتواه قبل الحكم"],"a":3,"w":"إذا أجاب الجميع إجابة خاطئة عن بند واحد بصورة غير متوقعة، فقد يكون المحتوى غير مدرّس، أو السؤال غامضًا، أو المفتاح خاطئًا؛ فلا يُستنتج مباشرة أن الطلاب لا يعرفون. وتحليل البنود بعد التطبيق جزء من تحسين الأداة.","n":["خطأ: قد يكون الخلل في البند أو المفتاح لا في التعلم.","خطأ: قرار متسرع قبل معرفة سبب الخلل.","خطأ: البند الذي يخطئ فيه الجميع لا يميز بين المستويات.","صحيح: راجع البند والمفتاح قبل لوم الطلاب."],"c":"أخطأ جميع الطلاب تقريبًا ... ومنهم المتفوقون","p":"نتيجة غريبة لبند واحد؟ افحص البند والمفتاح أولًا."},{"id":"18-42","s":18,"i":"18.9","l":"تحليل","t":"كتب معلم في اختبار للعلوم البند الآتي: «أيٌّ مما يلي ليس من العوامل التي لا تؤثر في سرعة التبخر؟». ما الخلل الأبرز في هذا البند بالنسبة إلى الطلاب ذوي صعوبات التعلم؟","o":["قياسه مستوى التذكر بدل مستويي الفهم والتطبيق في موضوع التبخر","ارتباطه بمحتوى علمي مجرد قد لا يثير اهتمام الطلاب ودافعيتهم","قلة عدد البدائل التي ستُعرض معه مقارنة ببنود الاختبار الأخرى","النفي المزدوج يجعله فخًّا قرائيًّا لا معرفيًّا، والأصح صياغته مثبتًا"],"a":3,"w":"يُتجنب النفي قدر الإمكان، فإن كان ضروريًّا أُبرز بوضوح؛ أما النفي المزدوج فيحوّل البند إلى اختبار في فك التراكيب لا في المعرفة العلمية، وهو أشد أثرًا على الطلاب ذوي صعوبات القراءة والذاكرة العاملة.","n":["خطأ: ليس الخلل الأبرز؛ فالصياغة تحجب المعرفة أيًّا كان المستوى.","خطأ: لا علاقة له بالخلل البنائي في الصياغة.","خطأ: الأهم جودة البدائل لا عددها، ولا قرينة على قلتها.","صحيح: تجنّب النفي المزدوج."],"c":"«ليس من العوامل التي لا تؤثر»","p":"النفي المزدوج يقيس القراءة لا العلم؛ صُغ البند مثبتًا."},{"id":"18-43","s":18,"i":"18.9","l":"تطبيق","t":"عند تحليل بند اختيار من متعدد في جمع الكسور، وُجد أن أحد المشتتات لم يختره أي طالب لأنه عبارة طريفة بعيدة عن الموضوع. ما التعديل الأنسب؟","o":["إبقاؤه كما هو؛ لأنه يخفف توتر الطلاب ويضفي جوًّا مريحًا على الاختبار","إطالة الإجابة الصحيحة وزيادة تفاصيلها لتصبح أوضح للطلاب","استبداله بمشتت مبني على خطأ شائع، كجمع البسطين وجمع المقامين","إضافة بديل خامس إلى البند لتقليل احتمال الإجابة بالتخمين"],"a":2,"w":"المشتتات الجيدة تُبنى من أخطاء شائعة أو مفاهيم بديلة معقولة، فتكشف من لم يتقن المفهوم. أما المشتت الذي لا يختاره أحد فلا يؤدي وظيفة قياسية ويحتاج مراجعة، وجمع البسطين والمقامين خطأ شائع حقيقي في الكسور.","n":["خطأ: المشتت غير المعقول لا يؤدي وظيفة قياسية ويزيد فرص التخمين.","خطأ: يضيف قرينة شكلية تكشف الإجابة.","صحيح: المشتت الجيد خطأ شائع معقول.","خطأ: المهم جودة البدائل لا عددها، والمشتت الضعيف يبقى ضعيفًا."],"c":"لم يختره أي طالب ... عبارة طريفة","p":"المشتت الذي لا يختاره أحد لا يقيس شيئًا؛ ابنِه من خطأ شائع."},{"id":"18-44","s":18,"i":"18.9","l":"تطبيق","t":"يعد معلم اختبارًا لقياس مهارة التعبير الكتابي لدى طالب ذي صعوبات تعلم. أي التكييفات الآتية يُعد «غير مناسب» في هذا الاختبار تحديدًا؟","o":["تقديم التعليمات له مقسّمة إلى خطوات قصيرة واضحة","السماح له بالإجابة شفهيًّا بدل كتابة النص","إتاحة مكان هادئ قليل المشتتات له وفق خطته","تكبير خط ورقة المهمة مع مساحات كتابة كافية"],"a":1,"w":"التكييف يزيل عائقًا غير مقصود مع الحفاظ على البناء المقيس؛ فإذا كانت الكتابة نفسها هي المهارة المستهدفة فلا يصح استبدالها بالإجابة الشفهية، لأن ذلك يزيل ما نريد قياسه. أما تبسيط التعليمات وتهيئة البيئة وتنسيق الصفحة فتحسن الوصول دون تغيير المهارة.","n":["مناسب، فليس هو الإجابة: يقلل عبء الذاكرة العاملة دون مساس بالكتابة.","صحيح أنه غير مناسب: يلغي المهارة المقيسة نفسها.","مناسب، فليس هو الإجابة: ترتيب بيئي لا يغيّر المهارة المقيسة.","مناسب، فليس هو الإجابة: يحسن الوصول ويبقي الإنتاج الكتابي مقيسًا."],"c":"قياس مهارة التعبير الكتابي","p":"لا تُزِل بالتكييف المهارةَ التي تقيسها."}]}</script>
<script>
(function () {
  document.documentElement.setAttribute('dir', 'rtl');
  document.documentElement.setAttribute('lang', 'ar');

  var RAW = JSON.parse(document.getElementById('qdata').textContent);
  var STD = RAW.standards;            // [{n, title, indicators:[{id,text}]}]
  var Q = RAW.q;                      // [{id,s,i,l,t,o,a,w,n,c,p}]
  var byId = {}; Q.forEach(function (q) { byId[q.id] = q; });
  var stdBy = {}; STD.forEach(function (s) { stdBy[s.n] = s; });
  var indBy = {}; STD.forEach(function (s) { s.indicators.forEach(function (i) { indBy[i.id] = i; }); });
  var LET = ['أ', 'ب', 'ج', 'د'];
  var BYLINE = '<div class="byline"><span class="who"><span>إعداد:</span> الدكتور محمد قرموش</span><span class="ai">مُمكَّن بالذكاء الاصطناعي</span></div>';
  var app = document.getElementById('app');

  function ar(n) { return Number(n).toLocaleString('ar-SA', { useGrouping: false }); }
  function pct(a, b) { return b ? Math.round(a * 100 / b) : 0; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function indCode(id) { return ar(id.split('.')[0]) + '٫' + ar(id.split('.')[1]); }

  /* ---------- per-viewer progress (localStorage, optional) ---------- */
  var KEY = 'rk-ld-v1', SKEY = 'rk-ld-session-v1';
  var store = { r: {}, f: {} };
  try { var s0 = localStorage.getItem(KEY); if (s0) { var p0 = JSON.parse(s0); store.r = p0.r || {}; store.f = p0.f || {}; } } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {} }
  function record(id, ok) { var r = store.r[id] || [0, 0, 0]; if (ok) r[0]++; else r[1]++; r[2] = ok ? 1 : -1; store.r[id] = r; }
  function saveSession() { try { if (session && !session.done) localStorage.setItem(SKEY, JSON.stringify(session)); else localStorage.removeItem(SKEY); } catch (e) {} }
  function loadSession() { try { var s = localStorage.getItem(SKEY); if (!s) return null; var o = JSON.parse(s); return o && o.ids && o.ids.every(function (id) { return byId[id]; }) ? o : null; } catch (e) { return null; } }

  /* ---------- state ---------- */
  var session = null;      // {mode, instant, title, ids, perm, ans, checked, pos, start, end, done}
  var view = 'home', viewStd = null;
  var ui = { count: 50, instant: true, indSel: {}, confirmEnd: false, confirmReset: false, showNav: false, revFilter: 'wrong' };

  function wrongIds() { return Q.filter(function (q) { var r = store.r[q.id]; return r && r[2] === -1; }).map(function (q) { return q.id; }); }
  function flaggedIds() { return Q.filter(function (q) { return store.f[q.id]; }).map(function (q) { return q.id; }); }
  function unseenIds() { return Q.filter(function (q) { return !store.r[q.id]; }).map(function (q) { return q.id; }); }
  function stdProgress(n) {
    var qs = Q.filter(function (q) { return q.s === n; }), seen = 0, good = 0;
    qs.forEach(function (q) { var r = store.r[q.id]; if (r) { seen++; if (r[2] === 1) good++; } });
    return { total: qs.length, seen: seen, good: good };
  }

  function stratified(n) {
    var pools = STD.map(function (s) { return shuffle(Q.filter(function (q) { return q.s === s.n; }).map(function (q) { return q.id; })); });
    var out = [];
    while (out.length < n) {
      var progressed = false;
      shuffle(pools.map(function (_, i) { return i; })).forEach(function (i) {
        if (out.length < n && pools[i].length) { out.push(pools[i].pop()); progressed = true; }
      });
      if (!progressed) break;
    }
    return shuffle(out);
  }

  function startSession(ids, opts) {
    if (!ids.length) return;
    var perm = {};
    ids.forEach(function (id) { perm[id] = shuffle([0, 1, 2, 3]); });
    session = { mode: opts.mode, instant: opts.instant, title: opts.title, ids: ids, perm: perm, ans: {}, checked: {}, pos: 0, start: Date.now(), end: null, done: false };
    ui.confirmEnd = false; ui.showNav = false;
    view = 'quiz'; saveSession(); render(true);
  }

  function finish() {
    session.end = Date.now(); session.done = true;
    if (!session.instant) {
      session.ids.forEach(function (id) { if (session.ans[id] != null) { record(id, session.ans[id] === byId[id].a); session.checked[id] = true; } });
    }
    save(); saveSession();
    ui.revFilter = 'wrong'; view = 'result'; render(true);
  }

  /* ---------- views ---------- */
  function homeView() {
    var seen = Object.keys(store.r).filter(function (k) { return byId[k]; }).length;
    var nInd = STD.reduce(function (a, s) { return a + s.indicators.length; }, 0);
    var w = wrongIds().length, f = flaggedIds().length, u = unseenIds().length;
    var saved = loadSession();
    var h = '';
    h += '<header class="hero"><div class="eyebrow">الرخصة المهنية للمعلمين · التربية الخاصة – صعوبات التعلم</div>' +
      '<h1>محاكي رخصة صعوبات التعلم</h1>' + BYLINE +
      '<p>أسئلة جديدة تحاكي أسلوب الاختبار التخصصي، تغطي المعايير الثمانية عشر بمؤشراتها. بعد كل سؤال تظهر تغذية راجعة: القرينة الحاسمة، وسبب صحة الإجابة، وسبب خطأ كل بديل.</p></header>';
    h += '<div class="stats">' +
      '<div class="stat"><b class="num">' + ar(Q.length) + '</b><span>سؤالًا في البنك</span></div>' +
      '<div class="stat"><b class="num">' + ar(STD.length) + '</b><span>معيارًا</span></div>' +
      '<div class="stat"><b class="num">' + ar(nInd) + '</b><span>مؤشرًا مغطًّى</span></div>' +
      '<div class="stat"><b class="num">' + ar(seen) + '</b><span>سؤالًا حللته</span></div></div>';
    if (saved) {
      var answered = Object.keys(saved.ans).length;
      h += '<section class="panel resume"><h2>لديك جلسة لم تكتمل</h2><p class="lead">' + esc(saved.title) + ' · أجبت عن ' + ar(answered) + ' من ' + ar(saved.ids.length) + '.</p>' +
        '<div class="row"><button class="btn primary" data-act="resume">أكمل من حيث توقفت</button><button class="btn ghost" data-act="drop-session">تجاهلها</button></div></section>';
    }
    h += '<section class="panel"><h2>اختبار محاكٍ شامل</h2><p class="lead">أسئلة عشوائية موزعة بالتساوي على المعايير الثمانية عشر، وتُخلط البدائل في كل مرة.</p>' +
      '<div class="field"><span class="lbl">عدد الأسئلة</span><div class="seg" role="group">' +
      [25, 50, 100].map(function (n) { return '<button data-act="count" data-v="' + n + '" aria-pressed="' + (ui.count === n) + '">' + ar(n) + ' سؤالًا</button>'; }).join('') + '</div></div>' +
      '<div class="field"><span class="lbl">طريقة التغذية الراجعة</span><div class="seg" role="group">' +
      '<button data-act="instant" data-v="1" aria-pressed="' + ui.instant + '">بعد كل سؤال</button>' +
      '<button data-act="instant" data-v="0" aria-pressed="' + !ui.instant + '">في النهاية مثل الاختبار</button></div></div>' +
      '<div class="row"><button class="btn primary" data-act="start-exam">ابدأ الاختبار</button></div></section>';
    h += '<section class="panel"><h2>مراجعتي</h2><p class="lead">تُحفظ نتائجك على هذا الجهاز، فتستطيع الرجوع لأخطائك وللأسئلة التي علّمتها.</p><div class="row">' +
      '<button class="btn" data-act="start-wrong"' + (w ? '' : ' disabled') + '>أخطائي (' + ar(w) + ')</button>' +
      '<button class="btn" data-act="start-flag"' + (f ? '' : ' disabled') + '>المعلَّمة للمراجعة (' + ar(f) + ')</button>' +
      '<button class="btn" data-act="start-unseen"' + (u ? '' : ' disabled') + '>لم أحلها بعد (' + ar(u) + ')</button></div></section>';
    h += '<div class="section-title"><h2>التدريب حسب المعيار</h2><span class="small muted">اختر معيارًا ثم مؤشراته</span></div><div class="stds">';
    STD.forEach(function (s) {
      var p = stdProgress(s.n);
      h += '<button class="std" data-act="open-std" data-v="' + s.n + '"><span class="no num">' + ar(s.n) + '</span><span class="t">' + esc(s.title) + '</span>' +
        '<span class="m"><span>' + ar(p.total) + ' سؤالًا · ' + ar(s.indicators.length) + ' مؤشرات' + (p.seen ? ' · أتقنت ' + ar(p.good) : '') + '</span>' +
        '<span class="bar ok"><i style="width:' + pct(p.good, p.total) + '%"></i></span></span></button>';
    });
    h += '</div>';
    h += '<footer class="foot"><p><b>إعداد الدكتور محمد قرموش</b>، مُمكَّن بالذكاء الاصطناعي.</p><p>أُعدّت الأسئلة اعتمادًا على ملفات «الموسوعة الذهبية» لمعايير التخصص، وهي للتدريب والمحاكاة، وليست أسئلة الاختبار الرسمية.</p>';
    if (ui.confirmReset) {
      h += '<div class="confirm"><p>سيُمسح سجل إجاباتك والأسئلة المعلَّمة من هذا الجهاز. هل تريد المتابعة؟</p><div class="row"><button class="btn danger" data-act="reset-yes">نعم، امسح السجل</button><button class="btn ghost" data-act="reset-no">إلغاء</button></div></div>';
    } else {
      h += '<div><button class="linkbtn" data-act="reset">مسح سجل الإجابات</button></div>';
    }
    h += '</footer>';
    return h;
  }

  function stdView() {
    var s = stdBy[viewStd], p = stdProgress(s.n);
    var sel = ui.indSel[s.n] || (ui.indSel[s.n] = {});
    var h = '<button class="back" data-act="home">→ الرئيسية</button>';
    h += '<header class="hero"><div class="eyebrow">المعيار ' + ar(s.n) + '</div><h1>' + esc(s.title) + '</h1>' +
      '<p>' + ar(p.total) + ' سؤالًا · حللت ' + ar(p.seen) + ' · إجاباتك الأخيرة الصحيحة ' + ar(p.good) + '</p></header>';
    h += '<section class="panel"><h2>المؤشرات</h2><p class="lead">كل المؤشرات مختارة. اضغط على مؤشر لاستبعاده أو إعادته.</p><div class="inds">';
    s.indicators.forEach(function (i) {
      var on = sel[i.id] !== false;
      var c = Q.filter(function (q) { return q.i === i.id; }).length;
      h += '<button class="ind" data-act="toggle-ind" data-v="' + esc(i.id) + '" aria-pressed="' + on + '"><span class="box">' + (on ? '✓' : '') + '</span>' +
        '<span><span class="code num">' + indCode(i.id) + '</span> ' + esc(i.text) + '</span><span class="cnt num">' + ar(c) + ' س</span></button>';
    });
    h += '</div><div class="row"><button class="btn primary" data-act="start-std" data-v="1">تدرّب بتغذية فورية</button><button class="btn" data-act="start-std" data-v="0">اختبرني في المعيار</button></div></section>';
    return h;
  }

  function optionsHtml(q, revealed, chosen, clickable) {
    var perm = session.perm[q.id], h = '<ol class="opts">';
    perm.forEach(function (oi, k) {
      var cls = 'opt';
      if (revealed) { if (oi === q.a) cls += ' right'; else if (oi === chosen) cls += ' wrong'; }
      else if (oi === chosen) cls += ' sel';
      h += '<li><button class="' + cls + '" ' + (clickable ? 'data-act="pick" data-v="' + oi + '"' : 'disabled') + '><span class="let">' + LET[k] + '</span><span>' + esc(q.o[oi]) + '</span></button>';
      if (revealed && q.n && q.n[oi]) h += '<div class="onote ' + (oi === q.a ? 'r' : (oi === chosen ? 'w' : '')) + '">' + esc(q.n[oi]) + '</div>';
      h += '</li>';
    });
    return h + '</ol>';
  }

  function feedbackHtml(q, chosen) {
    var ok = chosen === q.a, skipped = chosen == null;
    var k = session.perm[q.id].indexOf(q.a);
    var head = skipped ? 'لم تُجب عن هذا السؤال' : ok ? '✓ إجابة صحيحة' : '✗ إجابة غير صحيحة';
    var h = '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><div class="fb-head">' + head + '</div>';
    if (!ok) h += '<p>الإجابة الصحيحة: <b>' + LET[k] + '</b> ' + esc(q.o[q.a]) + '</p>';
    h += '<dl>';
    if (q.c) h += '<dt>القرينة الحاسمة</dt><dd>' + esc(q.c) + '</dd>';
    h += '<dt>لماذا هذه الإجابة؟</dt><dd>' + esc(q.w) + '</dd></dl>';
    if (q.p) h += '<div class="tip"><b>قاعدة للاختبار:</b> ' + esc(q.p) + '</div>';
    return h + '</div>';
  }

  function quizView() {
    var S = session, id = S.ids[S.pos], q = byId[id], total = S.ids.length;
    var chosen = S.ans[id], revealed = S.instant && S.checked[id];
    var answered = Object.keys(S.ans).length;
    var okN = 0, badN = 0;
    if (S.instant) S.ids.forEach(function (x) { if (S.checked[x]) { if (S.ans[x] === byId[x].a) okN++; else badN++; } });
    var h = '<div class="qbar"><div class="row"><button class="linkbtn" data-act="end">إنهاء</button>' +
      '<span class="pos num">السؤال ' + ar(S.pos + 1) + ' من ' + ar(total) + '</span>' +
      (S.instant ? '<span class="tally"><span class="t-ok num">✓ ' + ar(okN) + '</span><span class="t-bad num">✗ ' + ar(badN) + '</span></span>'
        : '<button class="linkbtn" data-act="nav">' + (ui.showNav ? 'إخفاء الخريطة' : 'خريطة الأسئلة') + '</button>') +
      '</div><div class="bar"><i style="width:' + pct(S.instant ? (okN + badN) : answered, total) + '%"></i></div></div>';
    if (ui.confirmEnd) {
      var left = total - answered;
      h += '<div class="confirm"><p>' + (left ? 'بقي ' + ar(left) + ' سؤالًا بلا إجابة. ' : '') + 'هل تريد إنهاء الجلسة وعرض النتيجة؟</p><div class="row">' +
        '<button class="btn primary" data-act="end-yes">إنهاء وعرض النتيجة</button><button class="btn ghost" data-act="end-no">متابعة الحل</button></div></div>';
    }
    if (!S.instant && ui.showNav) {
      h += '<div class="qnav">' + S.ids.map(function (x, k) {
        var c = (S.ans[x] != null ? 'done' : '') + (k === S.pos ? ' cur' : '') + (store.f[x] ? ' fl' : '');
        return '<button class="' + c + ' num" data-act="goto" data-v="' + k + '">' + ar(k + 1) + '</button>';
      }).join('') + '</div>';
    }
    var ind = indBy[q.i];
    h += '<article class="qcard"><div class="meta"><span class="chip acc num">المعيار ' + ar(q.s) + ' · المؤشر ' + indCode(q.i) + '</span><span class="chip">' + esc(q.l) + '</span>' +
      '<button class="flagbtn" data-act="flag" aria-pressed="' + !!store.f[id] + '">' + (store.f[id] ? 'معلَّم للمراجعة' : 'علّمه للمراجعة') + '</button></div>' +
      (ind ? '<p class="indtext">' + esc(ind.text) + '</p>' : '') +
      '<h2 class="stem">' + esc(q.t) + '</h2>' + optionsHtml(q, revealed, chosen, !revealed) +
      (revealed ? feedbackHtml(q, chosen) : '') + '</article>';
    h += '<div class="row">';
    if (S.instant) {
      if (!revealed) h += '<button class="btn primary grow" data-act="check"' + (chosen == null ? ' disabled' : '') + '>تحقّق من الإجابة</button>';
      else h += S.pos < total - 1 ? '<button class="btn primary grow" data-act="next">السؤال التالي</button>' : '<button class="btn primary grow" data-act="end-yes">عرض النتيجة</button>';
    } else {
      h += '<button class="btn" data-act="prev"' + (S.pos ? '' : ' disabled') + '>السابق</button>';
      h += S.pos < total - 1 ? '<button class="btn primary grow" data-act="next">التالي</button>' : '<button class="btn primary grow" data-act="end">إنهاء وتصحيح</button>';
    }
    h += '</div>';
    return h;
  }

  function resultView() {
    var S = session, total = S.ids.length, ok = 0, bad = 0, skip = 0;
    var byStd = {}, byLvl = {};
    S.ids.forEach(function (id) {
      var q = byId[id], a = S.ans[id], r = a == null ? 'skip' : (a === q.a ? 'ok' : 'bad');
      if (r === 'ok') ok++; else if (r === 'bad') bad++; else skip++;
      var b = byStd[q.s] || (byStd[q.s] = { ok: 0, n: 0 }); b.n++; if (r === 'ok') b.ok++;
      var l = byLvl[q.l] || (byLvl[q.l] = { ok: 0, n: 0 }); l.n++; if (r === 'ok') l.ok++;
    });
    var P = pct(ok, total), C = 2 * Math.PI * 50;
    var verdict = P >= 85 ? 'ممتاز، أداء متمكن' : P >= 70 ? 'جيد جدًّا، راجع أخطاءك لتثبيتها' : P >= 50 ? 'مقبول، يحتاج تعزيزًا في المعايير الأضعف' : 'ابدأ بمراجعة المعايير الأضعف ثم أعد المحاولة';
    var mins = Math.max(1, Math.round(((S.end || Date.now()) - S.start) / 60000));
    var h = '<header class="hero"><div class="eyebrow">النتيجة · ' + esc(S.title) + '</div>' + BYLINE + '</header>';
    h += '<section class="panel"><div class="score"><svg class="ring" viewBox="0 0 120 120" role="img" aria-label="النسبة ' + P + '%">' +
      '<circle class="trk" cx="60" cy="60" r="50"></circle><circle class="val" cx="60" cy="60" r="50" stroke-dasharray="' + (C * P / 100).toFixed(1) + ' ' + C.toFixed(1) + '"></circle>' +
      '<text x="60" y="70" text-anchor="middle">' + ar(P) + '٪</text></svg>' +
      '<div style="display:grid;gap:6px;min-width:0"><div class="verdict">' + verdict + '</div>' +
      '<p class="muted num">صحيحة ' + ar(ok) + ' · خاطئة ' + ar(bad) + (skip ? ' · بلا إجابة ' + ar(skip) : '') + ' من ' + ar(total) + '</p>' +
      '<p class="muted small num">المدة نحو ' + ar(mins) + ' دقيقة</p></div></div>' +
      '<div class="row"><button class="btn primary" data-act="retry-wrong"' + (bad + skip ? '' : ' disabled') + '>أعد الأسئلة التي أخطأت فيها</button><button class="btn" data-act="home">الرئيسية</button></div></section>';
    var stdKeys = Object.keys(byStd).map(Number).sort(function (a, b) { return a - b; });
    if (stdKeys.length > 1) {
      h += '<section class="panel"><h2>حسب المعيار</h2><div class="brk">';
      stdKeys.forEach(function (n) {
        var b = byStd[n];
        h += '<div class="brk-row"><span>' + ar(n) + '. ' + esc(stdBy[n].title) + '</span><span class="v num">' + ar(b.ok) + ' / ' + ar(b.n) + '</span><span class="bar ok"><i style="width:' + pct(b.ok, b.n) + '%"></i></span></div>';
      });
      h += '</div></section>';
    }
    h += '<section class="panel"><h2>حسب مستوى السؤال</h2><div class="brk">';
    ['معرفة', 'تطبيق', 'تحليل'].forEach(function (l) {
      var b = byLvl[l]; if (!b) return;
      h += '<div class="brk-row"><span>' + l + '</span><span class="v num">' + ar(b.ok) + ' / ' + ar(b.n) + '</span><span class="bar"><i style="width:' + pct(b.ok, b.n) + '%"></i></span></div>';
    });
    h += '</div></section>';
    h += '<section class="panel"><div class="section-title"><h2>مراجعة الإجابات</h2></div><div class="seg" role="group">' +
      '<button data-act="rev" data-v="wrong" aria-pressed="' + (ui.revFilter === 'wrong') + '">الخاطئة فقط</button>' +
      '<button data-act="rev" data-v="all" aria-pressed="' + (ui.revFilter === 'all') + '">كل الأسئلة</button></div><div class="rev">';
    var shown = 0;
    S.ids.forEach(function (id, k) {
      var q = byId[id], a = S.ans[id], r = a == null ? 'skip' : (a === q.a ? 'ok' : 'bad');
      if (ui.revFilter === 'wrong' && r === 'ok') return;
      shown++;
      var perm = S.perm[id];
      h += '<details><summary><span class="mark ' + r + '">' + (r === 'ok' ? '✓' : r === 'bad' ? '✗' : '–') + '</span><span><span class="small muted num">س' + ar(k + 1) + ' · المعيار ' + ar(q.s) + ' · المؤشر ' + indCode(q.i) + '</span><br>' + esc(q.t) + '</span></summary>' +
        '<div class="body"><p class="ans">' + (a != null && a !== q.a ? 'إجابتك: <span class="w">' + LET[perm.indexOf(a)] + ' ' + esc(q.o[a]) + '</span><br>' : '') +
        'الصحيحة: <span class="r">' + LET[perm.indexOf(q.a)] + ' ' + esc(q.o[q.a]) + '</span></p>' + feedbackHtml(q, a) +
        (a != null && a !== q.a && q.n && q.n[a] ? '<p class="small"><b>لماذا لا يصح اختيارك؟</b> ' + esc(q.n[a]) + '</p>' : '') + '</div></details>';
    });
    if (!shown) h += '<p class="muted">لا توجد إجابات خاطئة في هذه الجلسة.</p>';
    h += '</div></section>';
    return h;
  }

  function render(top) {
    var h = view === 'home' ? homeView() : view === 'std' ? stdView() : view === 'quiz' ? quizView() : resultView();
    app.innerHTML = h;
    if (top) window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    var act = b.getAttribute('data-act'), v = b.getAttribute('data-v');
    var S = session;
    switch (act) {
      case 'count': ui.count = +v; render(); break;
      case 'instant': ui.instant = v === '1'; render(); break;
      case 'start-exam': var exIds = stratified(ui.count); startSession(exIds, { mode: 'exam', instant: ui.instant, title: 'اختبار محاكٍ شامل (' + ar(exIds.length) + ' سؤالًا)' }); break;
      case 'start-wrong': startSession(shuffle(wrongIds()), { mode: 'review', instant: true, title: 'مراجعة الأخطاء' }); break;
      case 'start-flag': startSession(shuffle(flaggedIds()), { mode: 'review', instant: true, title: 'الأسئلة المعلَّمة' }); break;
      case 'start-unseen': startSession(shuffle(unseenIds()).slice(0, 25), { mode: 'review', instant: true, title: 'أسئلة لم تُحل بعد' }); break;
      case 'open-std': viewStd = +v; view = 'std'; render(true); break;
      case 'toggle-ind': var sel = ui.indSel[viewStd]; sel[v] = sel[v] === false; render(); break;
      case 'start-std':
        var sl = ui.indSel[viewStd] || {};
        var ids = Q.filter(function (q) { return q.s === viewStd && sl[q.i] !== false; }).map(function (q) { return q.id; });
        startSession(shuffle(ids), { mode: 'std', instant: v === '1', title: 'المعيار ' + ar(viewStd) + ': ' + stdBy[viewStd].title });
        break;
      case 'home': view = 'home'; ui.confirmReset = false; render(true); break;
      case 'resume': session = loadSession(); if (session) { ui.confirmEnd = false; view = 'quiz'; render(true); } break;
      case 'drop-session': try { localStorage.removeItem(SKEY); } catch (e) {} render(); break;
      case 'reset': ui.confirmReset = true; render(); break;
      case 'reset-no': ui.confirmReset = false; render(); break;
      case 'reset-yes': store = { r: {}, f: {} }; save(); ui.confirmReset = false; render(); break;
      case 'pick': S.ans[S.ids[S.pos]] = +v; saveSession(); render(); break;
      case 'check':
        var id = S.ids[S.pos]; if (S.ans[id] == null) break;
        S.checked[id] = true; record(id, S.ans[id] === byId[id].a); save(); saveSession(); render(); break;
      case 'next': if (S.pos < S.ids.length - 1) { S.pos++; saveSession(); render(true); } break;
      case 'prev': if (S.pos > 0) { S.pos--; saveSession(); render(true); } break;
      case 'goto': S.pos = +v; saveSession(); render(true); break;
      case 'nav': ui.showNav = !ui.showNav; render(); break;
      case 'flag': var fid = S.ids[S.pos]; if (store.f[fid]) delete store.f[fid]; else store.f[fid] = 1; save(); render(); break;
      case 'end':
        if (S.instant && !Object.keys(S.checked).length) { session = null; saveSession(); view = 'home'; render(true); break; }
        ui.confirmEnd = true; render(true); break;
      case 'end-no': ui.confirmEnd = false; render(); break;
      case 'end-yes':
        if (S.instant) { S.ids = S.ids.filter(function (x) { return S.checked[x]; }); }
        finish(); break;
      case 'retry-wrong':
        var again = S.ids.filter(function (x) { return S.ans[x] !== byId[x].a; });
        startSession(shuffle(again), { mode: 'review', instant: true, title: 'إعادة الأخطاء' }); break;
      case 'rev': ui.revFilter = v; render(); break;
    }
  });

  /* ---------- boot (keeps an open session across page updates) ---------- */
  function start(data) {
    if (data && data.session && data.session.ids) { session = data.session; view = data.view || 'quiz'; viewStd = data.viewStd || null; }
    render();
  }
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return { session: session, view: view, viewStd: viewStd }; }); } catch (e) {}
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
  else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>

</body>
</html>
